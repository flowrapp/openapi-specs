openapi: 3.1.0
info:
  title: Flowrapp API
  description: |
    REST API for Flowrapp Backend

    ## Business authorization

    A membership is `OWNER` or `EMPLOYEE`. The OWNER holds every business permission included in
    the effective features. An EMPLOYEE holds the permissions of its access role
    (`/businesses/{businessId}/access-roles`) included in the effective features, and none without
    an active contract. Operations scoped to the caller's own data need membership only.
    After membership and contract checks, an unavailable feature returns `403 1155`; if the feature
    is available, a caller lacking the permission gets `403 1020`. This table is authoritative; older wording
    such as "owner only" or "owner or manager" in operation descriptions means "requires the
    permission below".

    | Operations | Requires |
    |---|---|
    | getBusinessUsers, getBusinessUsersV2, getCurrentContractsForUsers, getOpenWorklogsForUsers, getBusinessContracts, getUserContracts, getCurrentUserContract, getBusinessJobRoles | TEAM_VIEW |
    | getBusinessInvitations, createBusinessInvitation (EMPLOYEE only), resendBusinessInvitation, deleteBusinessInvitation | TEAM_INVITE |
    | createUserContract, updateUserContract, deleteUserContract | CONTRACTS_MANAGE |
    | getWorklogs, getWorklogHistory of another worker | WORKLOGS_VIEW |
    | updateWorklog (business), correctBusinessWorklog, approveWorklog, rejectWorklog, correctBusinessWorklogBreak, voidBusinessWorklogBreak | WORKLOGS_MANAGE |
    | getDailyAttendance for everyone (otherwise narrowed to the caller), getShiftAttendance, getBusinessAttendanceMatch | ATTENDANCE_VIEW |
    | resolveAttendanceMatch, acceptUnplannedAttendance, approveShiftAttendance, acknowledgeNoShow, notifyShiftClockIn | ATTENDANCE_MANAGE |
    | getRecurringSchedules, getRecurringSchedule, getEffectiveRecurringSchedule, getScheduleExceptions, getBusinessShifts, getBusinessShift, getPlannings, getPlanning, getPlanningSettings, getPlanningGeneration, getPlanningGenerationInput | SCHEDULE_VIEW |
    | recurring schedule, schedule exception, shift, job role and planning settings writes; createDraftPlanning, replacePlanningScheduledShifts, publishPlanning, requestPlanningGeneration | SCHEDULE_MANAGE |
    | approveShiftExchangeRequest, approveScheduleChangeRequest, createScheduleChangeRequest, cancelScheduleChangeRequest, reviewer view and reviewer rejection of shift-change requests | SHIFT_CHANGES_APPROVE |
    | getBusinessReports, getWeeklyHoursReport | REPORTS_VIEW |
    | exportBusinessWorkedHoursReportPdf, requestBusinessWorkedHoursReport, getBusinessWorkedHoursMonths, getBusinessWorkedHoursPeople | REPORTS_EXPORT |
    | business and per-member auto-clocking and geofencing settings (read and write), updateBusinessWorklogSettings, updateAttendanceTolerance | CLOCKING_SETTINGS_MANAGE |
    | updateBusinessProfile, updateBusinessGeofence | BUSINESS_EDIT |
    | removeBusinessUser, access-role operations, updateBusinessUserAccessRole | OWNER |

    ## Business plans and features

    Every business has a `plan` (`ESSENTIAL` or `PROFESSIONAL` today). The plan includes a set of
    `BusinessFeature`s (configured in the backend); a platform admin may disable an included
    feature for one business. `getUserBusinesses` returns the business `plan` and its effective
    `features`, and `permissions` never holds a permission owned by an unavailable feature, even
    for the OWNER. An operation owned by an unavailable feature fails with `403 1155`; this applies
    to the operations of the feature's permissions (table above), to the self-service operations
    below, and to operations explicitly requiring ADVANCED_PLANNING. Everything else is core and
    available in every plan.

    | Feature | Plans | Requires | Owns permissions | Self-service operations |
    |---|---|---|---|---|
    | SCHEDULING | ESSENTIAL, PROFESSIONAL | — | SCHEDULE_VIEW, SCHEDULE_MANAGE, SHIFT_CHANGES_APPROVE | getCurrentUserScheduledShifts, getBusinessTeamSchedule, every shift exchange and schedule change operation |
    | ATTENDANCE | PROFESSIONAL | SCHEDULING | ATTENDANCE_VIEW, ATTENDANCE_MANAGE | getAttendanceMatch, getDailyAttendance (any scope), justifyAttendanceIncident, getCurrentUserAttendanceIncidents, getCurrentUserAttendanceIncidentGroups, getCurrentUserAttendanceIncidentGroup, justifyCurrentUserAttendanceIncidentGroup, updateAttendanceTolerance |
    | ADVANCED_PLANNING | PROFESSIONAL | SCHEDULING | — | — |

    ADVANCED_PLANNING is additionally required for requestPlanningGeneration,
    getPlanningGeneration, getPlanningSettings, replacePlanningSettings and deletePlanningSettings.
    Manual draft creation, shift assignment, publication, shift catalog and team-schedule reads
    require SCHEDULING and their existing permissions, not ADVANCED_PLANNING. Shared planning and
    generation-input reads used by manual scheduling, attendance or the dashboard retain their
    existing permission requirements; authorised users can access their underlying business data.

    `updateBusinessPlan` (platform admin) changes the plan and emits a `PERMISSIONS` sync signal.
