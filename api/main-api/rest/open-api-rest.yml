tags:
  - name: Users
    description: >-
      Operations related to user management, including user profile retrieval,
      creation, and updates.
  - name: Authentication
    description: >-
      Endpoints for user authentication, token management, and session handling.
  - name: Admin
    description: Administrative operations that require elevated privileges.
  - name: Businesses
    description: Operations for managing business entities.
  - name: Settings
    description: Operations for managing business-level settings.
  - name: Invitations
    description: Operations for managing invitations to join businesses.
  - name: Worklogs
    description: Time tracking recording and management operations.
  - name: Reports
    description: Raw daily time report data with flexible date-range filtering.
  - name: Timesheet
    description: >-
      Reporting and analytics endpoints that provide aggregated data and
      insights.
  - name: System
    description: System utility endpoints for monitoring and health checks.
  - name: Push Tokens
    description: Operations for managing push notification tokens.
  - name: Contracts
    description: Operations for managing user contracts within businesses.
  - name: Recurring Schedules
    description: >-
      Versioned recurring weekly opening hours, shifts and staffing demand.
  - name: Schedule Exceptions
    description: >-
      Date-specific replacements for recurring opening hours, shifts and
      staffing demand.
  - name: Job Roles
    description: Business job-role catalogs and member assignments.
  - name: Shifts
    description: >
      Business-owned shift identity and presentation catalogs, including optional
      default segments used only as a client preload.
  - name: Planning
    description: Weekly business plannings and scheduled shifts.
  - name: Shift Exchanges
    description: >-
      Reciprocal swap of two concrete published assignments. Cross-week is
      allowed. Different puestos are allowed and become OWNER warnings.
      Solicitudes, a screen linked from Horario, lists this collection with
      direction or lifecycle. Not a dashboard.
  - name: Schedule Changes
    description: >-
      OWNER correction of one concrete published assignment that has not
      started. A different puesto does not reject the request. Solicitudes
      lists this collection separately from exchanges. Not a dashboard.
  - name: Attendance
    description: >-
      Daily reconciliation between published shifts, recorded worklogs and caller-scoped
      attendance incident groups.

