components:
  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: {type: integer, format: int64}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: integer, format: int64}
    JobRoleId:
      name: jobRoleId
      in: path
      required: true
      schema: {type: integer, format: int64}
    ShiftTemplateId:
      name: shiftTemplateId
      in: path
      required: true
      schema: {type: integer, format: int64}
    ShiftDemandId:
      name: shiftDemandId
      in: path
      required: true
      schema: {type: integer, format: int64}
    ValidFrom:
      name: validFrom
      in: path
      required: true
      schema: {type: string, format: date}
    Date:
      name: date
      in: path
      required: true
      schema: {type: string, format: date}
    From:
      name: from
      in: query
      required: true
      schema: {type: string, format: date}
    To:
      name: to
      in: query
      required: true
      schema: {type: string, format: date}
  responses:
    BadRequest:
      description: Invalid request or scheduling configuration
      content:
        application/problem+json:
          schema:
            $ref: '../common/error-components.yml#/components/schemas/ProblemDetail'
    Forbidden:
      description: Current user is not the business owner
      content:
        application/problem+json:
          schema:
            $ref: '../common/error-components.yml#/components/schemas/ProblemDetail'
    NotFound:
      description: Business or nested resource not found
      content:
        application/problem+json:
          schema:
            $ref: '../common/error-components.yml#/components/schemas/ProblemDetail'
    Conflict:
      description: Scheduling configuration conflict
      content:
        application/problem+json:
          schema:
            $ref: '../common/error-components.yml#/components/schemas/ProblemDetail'
  schemas:
    DayOfWeekDTO:
      type: string
      description: ISO day of week
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      example: MONDAY

    LocalMinuteTimeDTO:
      type: string
      format: time
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Local business time with minute precision. An end time before the start time ends on the following day.
      example: "09:00"

    OpeningHoursIntervalRequestDTO:
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
      required: [startTime, endTime]

    OpeningHoursIntervalResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, startTime, endTime, createdAt, updatedAt]

    OpeningHoursDayRequestDTO:
      type: object
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeekDTO'
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHoursIntervalRequestDTO'
      required: [dayOfWeek, intervals]

    OpeningHoursDayResponseDTO:
      type: object
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeekDTO'
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHoursIntervalResponseDTO'
      required: [dayOfWeek, intervals]

    OpeningHoursConfigurationRequestDTO:
      type: object
      properties:
        validUntil:
          type: [string, "null"]
          format: date
          description: Inclusive end date, or null for an open-ended configuration
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/OpeningHoursDayRequestDTO'
      required: [days]

    OpeningHoursConfigurationResponseDTO:
      type: object
      properties:
        validFrom:
          type: string
          format: date
        validUntil:
          type: [string, "null"]
          format: date
        days:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHoursDayResponseDTO'
      required: [validFrom, days]

    OpeningHoursOverrideTypeDTO:
      type: string
      enum: [CLOSED, CUSTOM_HOURS]

    OpeningHoursOverrideRequestDTO:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/OpeningHoursOverrideTypeDTO'
        reason:
          type: [string, "null"]
          maxLength: 500
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHoursIntervalRequestDTO'
      required: [type, intervals]

    OpeningHoursOverrideResponseDTO:
      type: object
      properties:
        date:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/OpeningHoursOverrideTypeDTO'
        reason:
          type: [string, "null"]
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHoursIntervalResponseDTO'
      required: [date, type, intervals]

    CreateBusinessJobRoleRequestDTO:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          example: WAITER
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Waiter
        description:
          type: [string, "null"]
          maxLength: 500
      required: [code, name]

    UpdateBusinessJobRoleRequestDTO:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 500
        active:
          type: boolean
      required: [name, active]

    BusinessJobRoleResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        businessId:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, businessId, code, name, active, createdAt, updatedAt]

    ShiftTemplateRequestDTO:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
        active:
          type: boolean
          default: true
      required: [name, startTime, endTime, breakMinutes, active]

    ShiftTemplateResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        businessId:
          type: integer
          format: int64
        name:
          type: string
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        breakMinutes:
          type: integer
          format: int32
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, businessId, name, startTime, endTime, breakMinutes, active, createdAt, updatedAt]

    ShiftTemplateOverrideTypeDTO:
      type: string
      enum: [MODIFY, CANCEL]

    ShiftTemplateOverrideRequestDTO:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ShiftTemplateOverrideTypeDTO'
        startTime:
          type: [string, "null"]
          format: time
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        endTime:
          type: [string, "null"]
          format: time
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        reason:
          type: [string, "null"]
          maxLength: 500
      required: [type]

    ShiftTemplateOverrideResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        shiftTemplateId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/ShiftTemplateOverrideTypeDTO'
        startTime:
          type: [string, "null"]
          format: time
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        endTime:
          type: [string, "null"]
          format: time
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        reason:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, shiftTemplateId, date, type, createdAt, updatedAt]

    ShiftDemandRequestDTO:
      type: object
      description: A positive recurring staffing demand. Omit combinations with no demand.
      properties:
        shiftTemplateId:
          type: integer
          format: int64
        jobRoleId:
          type: integer
          format: int64
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeekDTO'
        minimumEmployees:
          type: integer
          format: int32
          minimum: 0
          description: Must be less than or equal to targetEmployees.
        targetEmployees:
          type: integer
          format: int32
          minimum: 0
          description: Must be between minimumEmployees and maximumEmployees.
        maximumEmployees:
          type: integer
          format: int32
          minimum: 1
          description: Must be greater than or equal to targetEmployees.
      required: [shiftTemplateId, jobRoleId, dayOfWeek, minimumEmployees, targetEmployees, maximumEmployees]

    ShiftDemandResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        shiftTemplateId:
          type: integer
          format: int64
        jobRoleId:
          type: integer
          format: int64
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeekDTO'
        minimumEmployees:
          type: integer
          format: int32
        targetEmployees:
          type: integer
          format: int32
        maximumEmployees:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, shiftTemplateId, jobRoleId, dayOfWeek, minimumEmployees, targetEmployees, maximumEmployees, createdAt, updatedAt]

    ShiftDemandConfigurationRequestDTO:
      type: object
      description: Sparse weekly demand matrix. Missing shift, job-role and day combinations mean zero demand.
      properties:
        validUntil:
          type: [string, "null"]
          format: date
        demands:
          type: array
          items:
            $ref: '#/components/schemas/ShiftDemandRequestDTO'
      required: [demands]

    ShiftDemandConfigurationResponseDTO:
      type: object
      properties:
        validFrom:
          type: string
          format: date
        validUntil:
          type: [string, "null"]
          format: date
        demands:
          type: array
          items:
            $ref: '#/components/schemas/ShiftDemandResponseDTO'
      required: [validFrom, demands]

    ShiftDemandOverrideRequestDTO:
      type: object
      properties:
        minimumEmployees:
          type: integer
          format: int32
          minimum: 0
        targetEmployees:
          type: integer
          format: int32
          minimum: 0
        maximumEmployees:
          type: integer
          format: int32
          minimum: 0
      required: [minimumEmployees, targetEmployees, maximumEmployees]

    ShiftDemandOverrideResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        shiftDemandId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        minimumEmployees:
          type: integer
          format: int32
        targetEmployees:
          type: integer
          format: int32
        maximumEmployees:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, shiftDemandId, date, minimumEmployees, targetEmployees, maximumEmployees, createdAt, updatedAt]
