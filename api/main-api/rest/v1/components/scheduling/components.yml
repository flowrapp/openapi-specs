        openingIntervals:
          type: array
          items:
            $ref: "#/components/schemas/OpeningIntervalResponseDTO"
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/DailyShiftResponseDTO"
      required: [openingIntervals, shifts]

    ScheduleExceptionRequestDTO:
      type: object
      description: Complete replacement configuration for one business-local calendar date.
      properties:
        date:
          type: string
          format: date
          description: Business-local exception date. It must be today or a future date.
        configuration:
          $ref: "#/components/schemas/DailyConfigurationRequestDTO"
      required: [date, configuration]

    ScheduleExceptionResponseDTO:
      type: object
