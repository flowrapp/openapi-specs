        startTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
        endTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned break of the shift, in minutes. It does not include the
            unpaid gap between segments.
        segments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Planned segments. Omitted for a normal shift, whose only interval is
            the envelope. See `ShiftSegmentDTO`.
          items:
            $ref: "#/components/schemas/ShiftSegmentDTO"
        demands:
          type: array
          items:
            $ref: "#/components/schemas/RoleDemandResponseDTO"
      required: [shiftId, startTime, endTime, breakMinutes, demands]

    RecurringScheduleDayRequestDTO:
