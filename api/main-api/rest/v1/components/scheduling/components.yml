components:
  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: {type: integer, format: int64}
    Page:
      name: page
      in: query
      required: false
      description: Zero-based slice number
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Number of job roles in the slice
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: integer, format: int64}
    JobRoleId:
      name: jobRoleId
      in: path
      required: true
      schema: {type: integer, format: int64}
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: {type: integer, format: int64}
    ScheduleExceptionId:
      name: exceptionId
      in: path
      required: true
      schema: {type: integer, format: int64}
    Date:
      name: date
      in: path
      required: true
      schema: {type: string, format: date}
    From:
      name: from
      in: query
      required: true
      schema: {type: string, format: date}
    To:
      name: to
      in: query
      required: true
      schema: {type: string, format: date}
    WeekStart:
      name: weekStart
      in: path
      required: true
      schema: {type: string, format: date}
    PlanningId:
      name: planningId
      in: path
      required: true
      description: ID of the existing planning
      schema: {type: integer, format: int64, minimum: 1, example: 500}
    PlanningEmployeeId:
      name: employeeId
      in: query
      required: false
      description: Restrict scheduled shifts to one employee; positive identifiers with no match return an empty filtered projection
      schema: {type: integer, format: int64, minimum: 1, example: 1}
    PlanningJobRoleId:
      name: jobRoleId
      in: query
      required: false
      description: Restrict scheduled shifts and immutable requirements to one job role; positive identifiers with no match return an empty filtered projection
      schema: {type: integer, format: int64, minimum: 1, example: 10}
  responses:
    BadRequest:
      description: Invalid request or scheduling configuration
      content:
        application/problem+json:
          schema:
            $ref: '../common/error-components.yml#/components/schemas/ProblemDetail'
    Forbidden:
      description: Current user is not the business owner
      content:
        application/problem+json:
          schema:
            $ref: '../common/error-components.yml#/components/schemas/ProblemDetail'
    NotFound:
      description: Business or nested resource not found
      content:
        application/problem+json:
          schema:
            $ref: '../common/error-components.yml#/components/schemas/ProblemDetail'
    Conflict:
      description: Scheduling configuration conflict
      content:
        application/problem+json:
          schema:
            $ref: '../common/error-components.yml#/components/schemas/ProblemDetail'
  schemas:
    DayOfWeekDTO:
      type: string
      description: ISO day of week
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      example: MONDAY

    LocalMinuteTimeDTO:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Local business time with minute precision. An end time before the start time ends on the following day.
      example: "09:00"

    OpeningIntervalRequestDTO:
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
      required: [startTime, endTime]

    OpeningIntervalResponseDTO:
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
      required: [startTime, endTime]

    RoleDemandRequestDTO:
      type: object
      properties:
        jobRoleId:
          type: integer
          format: int64
        minimumEmployees:
          type: integer
          format: int32
          minimum: 0
        targetEmployees:
          type: integer
          format: int32
          minimum: 0
        maximumEmployees:
          type: integer
          format: int32
          minimum: 1
      required: [jobRoleId, minimumEmployees, targetEmployees, maximumEmployees]

    RoleDemandResponseDTO:
      type: object
      properties:
        jobRoleId:
          type: integer
          format: int64
        minimumEmployees:
          type: integer
          format: int32
        targetEmployees:
          type: integer
          format: int32
        maximumEmployees:
          type: integer
          format: int32
      required: [jobRoleId, minimumEmployees, targetEmployees, maximumEmployees]

    PlanningRoleDemandResponseDTO:
      type: object
      description: Immutable planning demand with derived coverage from valid scheduled assignments.
      properties:
        jobRoleId:
          type: integer
          format: int64
        minimumEmployees:
          type: integer
          format: int32
        targetEmployees:
          type: integer
          format: int32
        maximumEmployees:
          type: integer
          format: int32
        assignedEmployees:
          type: integer
          format: int32
          minimum: 0
          description: Number of valid scheduled assignments for this demand.
        minimumDeficit:
          type: integer
          format: int32
          minimum: 0
          description: Missing employees below the minimum, never negative.
        targetDeficit:
          type: integer
          format: int32
          minimum: 0
          description: Missing employees below the target, never negative.
      required: [jobRoleId, minimumEmployees, targetEmployees, maximumEmployees, assignedEmployees, minimumDeficit, targetDeficit]

    DailyShiftRequestDTO:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hexadecimal display color preserved in planning snapshots.
          example: "#1A2B3C"
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
        demands:
          type: array
          items:
            $ref: '#/components/schemas/RoleDemandRequestDTO'
      required: [name, color, startTime, endTime, breakMinutes, demands]

    DailyShiftResponseDTO:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hexadecimal display color captured by this shift value.
          example: "#1A2B3C"
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
        demands:
          type: array
          items:
            $ref: '#/components/schemas/RoleDemandResponseDTO'
      required: [name, color, startTime, endTime, breakMinutes, demands]

    RecurringScheduleDayRequestDTO:
      type: object
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeekDTO'
        openingIntervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningIntervalRequestDTO'
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/DailyShiftRequestDTO'
      required: [dayOfWeek, openingIntervals, shifts]

    RecurringScheduleDayResponseDTO:
      type: object
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeekDTO'
        openingIntervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningIntervalResponseDTO'
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/DailyShiftResponseDTO'
      required: [dayOfWeek, openingIntervals, shifts]

    RecurringScheduleRequestDTO:
      type: object
      description: Complete seven-day recurring schedule. Nested values are replaced atomically without child identity fields.
      properties:
        version:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Expected aggregate version for replacement. Omit when creating a schedule.
        validFrom:
          type: string
          format: date
          description: Inclusive start date. Immutable after creation and must match the existing schedule during replacement.
        validUntil:
          type: [string, "null"]
          format: date
          description: Inclusive end date, or null for an open-ended schedule.
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/RecurringScheduleDayRequestDTO'
      required: [validFrom, days]

    RecurringScheduleResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        version:
          type: integer
          format: int64
        businessId:
          type: integer
          format: int64
        validFrom:
          type: string
          format: date
        validUntil:
          type: [string, "null"]
          format: date
        days:
          type: array
          items:
            $ref: '#/components/schemas/RecurringScheduleDayResponseDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, version, businessId, validFrom, days, createdAt, updatedAt]

    DailyConfigurationRequestDTO:
      type: object
      description: Complete opening intervals, shifts and staffing demand for one calendar day. Nested values have no persistence identity.
      properties:
        openingIntervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningIntervalRequestDTO'
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/DailyShiftRequestDTO'
      required: [openingIntervals, shifts]

    DailyConfigurationResponseDTO:
      type: object
      properties:
        openingIntervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningIntervalResponseDTO'
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/DailyShiftResponseDTO'
      required: [openingIntervals, shifts]

    ScheduleExceptionRequestDTO:
      type: object
      description: Complete replacement configuration for one business-local calendar date.
      properties:
        date:
          type: string
          format: date
          description: Business-local exception date. It must be today or a future date.
        configuration:
          $ref: '#/components/schemas/DailyConfigurationRequestDTO'
      required: [date, configuration]

    ScheduleExceptionResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        businessId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        configuration:
          $ref: '#/components/schemas/DailyConfigurationResponseDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, businessId, date, configuration, createdAt, updatedAt]

    CreateBusinessJobRoleRequestDTO:
      type: object
      description: Creates an active business job role with client-facing visual metadata.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          example: WAITER
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Waiter
        description:
          type: [string, "null"]
          maxLength: 500
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hexadecimal display color. Values without exactly six hexadecimal digits are invalid.
          example: "#1A2B3C"
        icon:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Lowercase slug from the open client icon catalog.
          example: front-of-house
      required: [code, name, color, icon]

    UpdateBusinessJobRoleRequestDTO:
      type: object
      description: Updates a business job role. Setting active to true reactivates a deactivated role.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 500
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hexadecimal display color. Values without exactly six hexadecimal digits are invalid.
          example: "#1A2B3C"
        icon:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Lowercase slug from the open client icon catalog.
          example: front-of-house
        active:
          type: boolean
      required: [name, color, icon, active]

    BusinessJobRoleResponseDTO:
      type: object
      description: Business job role with reversible activation and display metadata.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        businessId:
          type: integer
          format: int64
          minimum: 1
        code:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#1A2B3C"
        icon:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: front-of-house
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, businessId, code, name, color, icon, active, createdAt, updatedAt]

    BusinessJobRoleSliceResponseDTO:
      type: object
      description: Slice of business job roles without a total-count query
      properties:
        content:
          type: array
          description: Job roles ordered by active state descending, name ascending, and ID ascending
          items:
            $ref: '#/components/schemas/BusinessJobRoleResponseDTO'
        page:
          type: integer
          format: int32
          minimum: 0
          description: Current page number, zero-based
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          description: Requested page size
          example: 20
        hasNext:
          type: boolean
          description: Whether another slice is available
          example: true
      required: [content, page, size, hasNext]
      example:
        content:
          - id: 10
            businessId: 101
            code: WAITER
            name: Waiter
            description: Front of house service
            color: "#1A2B3C"
            icon: front-of-house
            active: true
            createdAt: "2025-06-01T10:00:00+00:00"
            updatedAt: "2025-06-01T10:00:00+00:00"
          - id: 11
            businessId: 101
            code: HOST
            name: Waiter
            description: Inactive front of house role
            color: "#808080"
            icon: briefcase
            active: false
            createdAt: "2025-06-02T10:00:00+00:00"
            updatedAt: "2025-06-02T10:00:00+00:00"
        page: 0
        size: 20
        hasNext: false

    PlanningRequirementShiftDTO:
      type: object
      description: Immutable, presentation-safe shift input captured when a planning was created. It contains no solver correlation identifiers.
      properties:
        name:
          type: string
          minLength: 1
          description: Shift display name captured in the planning snapshot
          example: Morning service
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Shift display color captured in the planning snapshot
          example: "#1A2B3C"
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          example: 30
        demands:
          type: array
          description: Staffing demand by stable business job-role ID with derived planning coverage.
          items:
            $ref: '#/components/schemas/PlanningRoleDemandResponseDTO'
      required: [name, color, startTime, endTime, breakMinutes, demands]

    PlanningRequirementDTO:
      type: object
      description: Immutable planning requirements grouped by business-local calendar date.
      properties:
        date:
          type: string
          format: date
          description: Business-local calendar date captured by the planning snapshot
          example: "2025-07-28"
        shifts:
          type: array
          description: Shift requirements captured for this date
          items:
            $ref: '#/components/schemas/PlanningRequirementShiftDTO'
      required: [date, shifts]

    PlanningSettingsDTO:
      type: object
      properties:
        generationDay:
          $ref: '#/components/schemas/DayOfWeekDTO'
        generationTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
      required: [generationDay, generationTime]

    PlanningStatusDTO:
      type: string
      description: Planning lifecycle state. FAILED is terminal and exposes only a sanitized failure reason.
      enum: [DRAFT, SOLVING, READY, PUBLISHED, FAILED, ARCHIVED]

    ScheduledShiftResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        planningId:
          type: integer
          format: int64
        businessId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        jobRoleId:
          type: integer
          format: int64
        shiftName:
          type: string
          minLength: 1
          description: Display name captured from the planning requirement
          example: Morning service
        shiftColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Display color captured from the planning requirement
          example: "#1A2B3C"
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, planningId, businessId, userId, jobRoleId, shiftName, shiftColor, startAt, endAt, breakMinutes, createdAt, updatedAt]

    PlanningResponseDTO:
      type: object
      description: Weekly planning with immutable requirements and any solved scheduled shifts.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        businessId:
          type: integer
          format: int64
          minimum: 1
        weekStart:
          type: string
          format: date
          description: Monday of the planning week in the business-local calendar
          example: "2025-07-28"
        weekEnd:
          type: string
          format: date
          description: Sunday of the planning week in the business-local calendar
          example: "2025-08-03"
        status:
          $ref: '#/components/schemas/PlanningStatusDTO'
        failureReason:
          type: [string, "null"]
          maxLength: 500
          description: Sanitized owner-facing reason for FAILED plannings; never a stack trace or raw provider payload.
          example: null
        requirements:
          type: array
          description: Immutable requirements captured when the planning was created, grouped by date.
          items:
            $ref: '#/components/schemas/PlanningRequirementDTO'
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, "null"]
          format: date-time
        scheduledShifts:
          type: array
          description: Solved assignments. Empty while the planning has no assignments yet.
          items:
            $ref: '#/components/schemas/ScheduledShiftResponseDTO'
        hasCoverageWarnings:
          type: boolean
          description: True when any immutable demand remains below its minimum staffing level.
      required: [id, businessId, weekStart, weekEnd, status, failureReason, requirements, createdAt, scheduledShifts, hasCoverageWarnings]
      example:
        id: 500
        businessId: 101
        weekStart: "2025-07-28"
        weekEnd: "2025-08-03"
        status: SOLVING
        failureReason: null
        requirements: []
        createdAt: "2025-07-27T08:00:00+02:00"
        scheduledShifts: []
        hasCoverageWarnings: false
      x-status-examples:
        - summary: Solving planning
          value:
            id: 500
            businessId: 101
            weekStart: "2025-07-28"
            weekEnd: "2025-08-03"
            status: SOLVING
            failureReason: null
            requirements:
              - date: "2025-07-28"
                shifts:
                  - name: Morning service
                    color: "#1A2B3C"
                    startTime: "09:00"
                    endTime: "17:00"
                    breakMinutes: 30
                    demands:
                      - jobRoleId: 10
                        minimumEmployees: 1
                        targetEmployees: 2
                        maximumEmployees: 3
                        assignedEmployees: 0
                        minimumDeficit: 1
                        targetDeficit: 2
            createdAt: "2025-07-27T08:00:00+02:00"
            publishedAt: null
            scheduledShifts: []
            hasCoverageWarnings: true
        - summary: Ready planning
          value:
            id: 500
            businessId: 101
            weekStart: "2025-07-28"
            weekEnd: "2025-08-03"
            status: READY
            failureReason: null
            requirements:
              - date: "2025-07-28"
                shifts:
                  - name: Morning service
                    color: "#1A2B3C"
                    startTime: "09:00"
                    endTime: "17:00"
                    breakMinutes: 30
                    demands:
                      - jobRoleId: 10
                        minimumEmployees: 1
                        targetEmployees: 2
                        maximumEmployees: 3
                        assignedEmployees: 1
                        minimumDeficit: 0
                        targetDeficit: 1
            createdAt: "2025-07-27T08:00:00+02:00"
            publishedAt: null
            scheduledShifts:
              - id: 900
                planningId: 500
                businessId: 101
                userId: 1
                jobRoleId: 10
                shiftName: Morning service
                shiftColor: "#1A2B3C"
                startAt: "2025-07-28T09:00:00+02:00"
                endAt: "2025-07-28T17:00:00+02:00"
                breakMinutes: 30
                createdAt: "2025-07-27T09:00:00+02:00"
                updatedAt: "2025-07-27T09:00:00+02:00"
        - summary: Published planning
          value:
            id: 500
            businessId: 101
            weekStart: "2025-07-28"
            weekEnd: "2025-08-03"
            status: PUBLISHED
            failureReason: null
            requirements: []
            createdAt: "2025-07-27T08:00:00+02:00"
            publishedAt: "2025-07-27T12:00:00+02:00"
            scheduledShifts: []
            hasCoverageWarnings: false
        - summary: Failed planning
          value:
            id: 501
            businessId: 101
            weekStart: "2025-08-04"
            weekEnd: "2025-08-10"
            status: FAILED
            failureReason: "No feasible assignment was found."
            requirements: []
            createdAt: "2025-08-03T08:00:00+02:00"
            publishedAt: null
            scheduledShifts: []
            hasCoverageWarnings: false

    TeamScheduleResponseDTO:
      type: object
      description: Privacy-safe weekly team schedule visible to any member of the business
      properties:
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        week:
          type: string
          pattern: '^\d{4}-W\d{2}$'
          description: ISO week identifier
          example: "2025-W31"
        weekStart:
          type: string
          format: date
          description: Monday of the requested ISO week in the business-local calendar
          example: "2025-07-28"
        weekEnd:
          type: string
          format: date
          description: Sunday of the requested ISO week in the business-local calendar
          example: "2025-08-03"
        days:
          type: array
          description: Days containing assigned shifts, ordered by business-local date
          items:
            $ref: '#/components/schemas/TeamScheduleDayDTO'
      required: [businessId, week, weekStart, weekEnd, days]

    TeamScheduleDayDTO:
      type: object
      description: Assigned shifts grouped by their business-local start date
      properties:
        date:
          type: string
          format: date
          example: "2025-07-28"
        shifts:
          type: array
          description: Shifts ordered by start instant and then stable shift ID
          items:
            $ref: '#/components/schemas/TeamScheduleShiftDTO'
      required: [date, shifts]

    TeamScheduleShiftDTO:
      type: object
      description: Privacy-safe presentation of one assigned shift
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 900
        worker:
          $ref: '#/components/schemas/TeamScheduleWorkerDTO'
        jobRole:
          $ref: '#/components/schemas/TeamScheduleJobRoleDTO'
        shiftName:
          type: string
          minLength: 1
          example: Morning service
        shiftColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#1A2B3C"
        startAt:
          type: string
          format: date-time
          description: Offset-aware start instant
          example: "2025-07-28T09:00:00+02:00"
        endAt:
          type: string
          format: date-time
          description: Offset-aware end instant; may be on the following local date
          example: "2025-07-28T17:00:00+02:00"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          example: 30
      required: [id, worker, jobRole, shiftName, shiftColor, startAt, endAt, breakMinutes]

    TeamScheduleWorkerDTO:
      type: object
      description: Assigned worker's minimal display identity
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 3
        name:
          type: string
          example: Bob Wilson
      required: [id, name]

    TeamScheduleJobRoleDTO:
      type: object
      description: Job-role identity and presentation metadata for an assigned shift
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 10
        code:
          type: string
          example: WAITER
        name:
          type: string
          example: Waiter
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#1A2B3C"
        icon:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: front-of-house
      required: [id, code, name, color, icon]
