components:
  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: {type: integer, format: int64}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: integer, format: int64}
    JobRoleId:
      name: jobRoleId
      in: path
      required: true
      schema: {type: integer, format: int64}
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: {type: integer, format: int64}
    ScheduleExceptionId:
      name: exceptionId
      in: path
      required: true
      schema: {type: integer, format: int64}
    Date:
      name: date
      in: path
      required: true
      schema: {type: string, format: date}
    From:
      name: from
      in: query
      required: true
      schema: {type: string, format: date}
    To:
      name: to
      in: query
      required: true
      schema: {type: string, format: date}
    WeekStart:
      name: weekStart
      in: path
      required: true
      schema: {type: string, format: date}
  responses:
    BadRequest:
      description: Invalid request or scheduling configuration
      content:
        application/problem+json:
          schema:
            $ref: '../common/error-components.yml#/components/schemas/ProblemDetail'
    Forbidden:
      description: Current user is not the business owner
      content:
        application/problem+json:
          schema:
            $ref: '../common/error-components.yml#/components/schemas/ProblemDetail'
    NotFound:
      description: Business or nested resource not found
      content:
        application/problem+json:
          schema:
            $ref: '../common/error-components.yml#/components/schemas/ProblemDetail'
    Conflict:
      description: Scheduling configuration conflict
      content:
        application/problem+json:
          schema:
            $ref: '../common/error-components.yml#/components/schemas/ProblemDetail'
  schemas:
    DayOfWeekDTO:
      type: string
      description: ISO day of week
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      example: MONDAY

    LocalMinuteTimeDTO:
      type: string
      format: time
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Local business time with minute precision. An end time before the start time ends on the following day.
      example: "09:00"

    OpeningIntervalRequestDTO:
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
      required: [startTime, endTime]

    OpeningIntervalResponseDTO:
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
      required: [startTime, endTime]

    RoleDemandRequestDTO:
      type: object
      properties:
        jobRoleId:
          type: integer
          format: int64
        minimumEmployees:
          type: integer
          format: int32
          minimum: 0
        targetEmployees:
          type: integer
          format: int32
          minimum: 0
        maximumEmployees:
          type: integer
          format: int32
          minimum: 1
      required: [jobRoleId, minimumEmployees, targetEmployees, maximumEmployees]

    RoleDemandResponseDTO:
      type: object
      properties:
        jobRoleId:
          type: integer
          format: int64
        minimumEmployees:
          type: integer
          format: int32
        targetEmployees:
          type: integer
          format: int32
        maximumEmployees:
          type: integer
          format: int32
      required: [jobRoleId, minimumEmployees, targetEmployees, maximumEmployees]

    DailyShiftRequestDTO:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
        demands:
          type: array
          items:
            $ref: '#/components/schemas/RoleDemandRequestDTO'
      required: [name, startTime, endTime, breakMinutes, demands]

    DailyShiftResponseDTO:
      type: object
      properties:
        name:
          type: string
        startTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
        breakMinutes:
          type: integer
          format: int32
        demands:
          type: array
          items:
            $ref: '#/components/schemas/RoleDemandResponseDTO'
      required: [name, startTime, endTime, breakMinutes, demands]

    RecurringScheduleDayRequestDTO:
      type: object
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeekDTO'
        openingIntervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningIntervalRequestDTO'
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/DailyShiftRequestDTO'
      required: [dayOfWeek, openingIntervals, shifts]

    RecurringScheduleDayResponseDTO:
      type: object
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeekDTO'
        openingIntervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningIntervalResponseDTO'
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/DailyShiftResponseDTO'
      required: [dayOfWeek, openingIntervals, shifts]

    RecurringScheduleRequestDTO:
      type: object
      description: Complete seven-day recurring schedule. Nested values are replaced atomically without child identity fields.
      properties:
        version:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Expected aggregate version for replacement. Omit when creating a schedule.
        validFrom:
          type: string
          format: date
          description: Inclusive start date. Immutable after creation and must match the existing schedule during replacement.
        validUntil:
          type: [string, "null"]
          format: date
          description: Inclusive end date, or null for an open-ended schedule.
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/RecurringScheduleDayRequestDTO'
      required: [validFrom, days]

    RecurringScheduleResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        version:
          type: integer
          format: int64
        businessId:
          type: integer
          format: int64
        validFrom:
          type: string
          format: date
        validUntil:
          type: [string, "null"]
          format: date
        days:
          type: array
          items:
            $ref: '#/components/schemas/RecurringScheduleDayResponseDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, version, businessId, validFrom, days, createdAt, updatedAt]

    DailyConfigurationRequestDTO:
      type: object
      description: Complete opening intervals, shifts and staffing demand for one calendar day. Nested values have no persistence identity.
      properties:
        openingIntervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningIntervalRequestDTO'
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/DailyShiftRequestDTO'
      required: [openingIntervals, shifts]

    DailyConfigurationResponseDTO:
      type: object
      properties:
        openingIntervals:
          type: array
          items:
            $ref: '#/components/schemas/OpeningIntervalResponseDTO'
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/DailyShiftResponseDTO'
      required: [openingIntervals, shifts]

    ScheduleExceptionRequestDTO:
      type: object
      description: Complete replacement configuration for one business-local calendar date.
      properties:
        date:
          type: string
          format: date
          description: Business-local exception date. It must be today or a future date.
        configuration:
          $ref: '#/components/schemas/DailyConfigurationRequestDTO'
      required: [date, configuration]

    ScheduleExceptionResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        businessId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        configuration:
          $ref: '#/components/schemas/DailyConfigurationResponseDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, businessId, date, configuration, createdAt, updatedAt]

    CreateBusinessJobRoleRequestDTO:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          example: WAITER
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Waiter
        description:
          type: [string, "null"]
          maxLength: 500
      required: [code, name]

    UpdateBusinessJobRoleRequestDTO:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 500
        active:
          type: boolean
      required: [name, active]

    BusinessJobRoleResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        businessId:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, businessId, code, name, active, createdAt, updatedAt]

    PlanningSettingsDTO:
      type: object
      properties:
        generationDay:
          $ref: '#/components/schemas/DayOfWeekDTO'
        generationTime:
          $ref: '#/components/schemas/LocalMinuteTimeDTO'
      required: [generationDay, generationTime]

    PlanningStatusDTO:
      type: string
      enum: [DRAFT, SOLVING, READY, PUBLISHED, ARCHIVED]

    ScheduledShiftResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        planningId:
          type: integer
          format: int64
        businessId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        jobRoleId:
          type: integer
          format: int64
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, planningId, businessId, userId, jobRoleId, startAt, endAt, breakMinutes, createdAt, updatedAt]

    PlanningResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        businessId:
          type: integer
          format: int64
        weekStart:
          type: string
          format: date
        weekEnd:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/PlanningStatusDTO'
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, "null"]
          format: date-time
        scheduledShifts:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledShiftResponseDTO'
      required: [id, businessId, weekStart, weekEnd, status, createdAt, scheduledShifts]
