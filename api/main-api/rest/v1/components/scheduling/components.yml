components:
  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      required: false
      description: Zero-based slice number
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Number of resources in the slice
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    JobRoleId:
      name: jobRoleId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ScheduleExceptionId:
      name: exceptionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Date:
      name: date
      in: path
      required: true
      schema: { type: string, format: date }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
    WeekStart:
      name: weekStart
      in: path
      required: true
      schema: { type: string, format: date }
    PlanningId:
      name: planningId
      in: path
      required: true
      description: ID of the existing planning
      schema: { type: integer, format: int64, minimum: 1, example: 500 }
    PlanningEmployeeId:
      name: employeeId
      in: query
      required: false
      description: Restrict scheduled shifts to one employee; positive identifiers with no match return an empty filtered projection
      schema: { type: integer, format: int64, minimum: 1, example: 1 }
    PlanningJobRoleId:
      name: jobRoleId
      in: query
      required: false
      description: Restrict scheduled shifts and immutable requirements to one job role; positive identifiers with no match return an empty filtered projection
      schema: { type: integer, format: int64, minimum: 1, example: 10 }
    CurrentUserScheduledShiftJobRoleId:
      name: jobRoleId
      in: query
      required: false
      description: Restrict the current user's published shifts to one job role; a positive identifier with no matching shift returns an empty collection.
      schema: { type: integer, format: int64, minimum: 1, example: 10 }
    CurrentUserScheduledShiftShiftId:
      name: shiftId
      in: query
      required: false
      description: Restrict the current user's published shifts to one business Shift; a positive identifier with no matching shift returns an empty collection.
      schema: { type: integer, format: int64, minimum: 1, example: 20 }
    CurrentUserScheduledShiftPlanningId:
      name: planningId
      in: query
      required: false
      description: Restrict the current user's published shifts to one planning; a positive identifier with no matching shift returns an empty collection.
      schema: { type: integer, format: int64, minimum: 1, example: 500 }
    PlanningGenerationId:
      name: generationId
      in: path
      required: true
      description: Planning generation job id.
      schema: { type: integer, format: int64, minimum: 1, example: 42 }
  responses:
    BadRequest:
      description: Invalid request or scheduling configuration
      content:
        application/problem+json:
          schema:
            $ref: "../common/error-components.yml#/components/schemas/ProblemDetail"
    Forbidden:
      description: Current user is not the business owner
      content:
        application/problem+json:
          schema:
            $ref: "../common/error-components.yml#/components/schemas/ProblemDetail"
    NotFound:
      description: Business or nested resource not found
      content:
        application/problem+json:
          schema:
            $ref: "../common/error-components.yml#/components/schemas/ProblemDetail"
    Conflict:
      description: Scheduling configuration conflict
      content:
        application/problem+json:
          schema:
            $ref: "../common/error-components.yml#/components/schemas/ProblemDetail"
  schemas:
    DayOfWeekDTO:
      type: string
      description: ISO day of week
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      example: MONDAY

    LocalMinuteTimeDTO:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Local business time with minute precision. An end time before the start time ends on the following day.
      example: "09:00"

    ShiftSegmentDTO:
      type: object
      additionalProperties: false
      description: >
        One planned interval of a recurring template, a schedule exception or a
        planning requirement, in business-local time. A shift is one aggregate
        with one or two of these intervals (a split shift, for example
        10:00–14:00 and 18:00–23:00). This is not a clocked worklog. Clocked
        intervals are the BFF `AttendanceClockedDTO.segments` and attendance
        `timeline.segments` (`AttendanceSegmentDTO`); several worklogs may
        reference the same scheduled shift.

        When the parent `segments` array is present it has one or two items
        (`maxItems: 2`), ordered by start, with no overlap and a gap of at least
        one minute (a zero gap is one continuous segment, not two). All segments
        share the shift's logical day. The first segment of a split shift does
        not cross midnight; only the last segment may, under the same overnight
        rule as the envelope (a planning week may run until Monday 07:00 local).
        Each segment must lie entirely inside that day's opening intervals. The
        gap is not covered by treating it as `breakMinutes`, and opening hours
        are checked per segment, not against the envelope.

        The parent `startTime` and `endTime` stay required and are the envelope:
        start of the first segment and end of the last. Omit `segments`, or send
        one segment equal to that envelope, for a normal shift (overnight
        included). If the client sends both and they disagree, the server
        rejects the write with `400` `1050` `INVALID_RECURRING_SCHEDULE` on a
        recurring template or `400` `1053` `INVALID_SCHEDULE_EXCEPTION` on a
        day's exception. `breakMinutes` is the shift's planned break, not the
        unpaid gap, and must satisfy `0 ≤ breakMinutes` strictly less than the
        sum of the segment durations. Net planned time is that sum minus
        `breakMinutes`. Demands stay on the shift: one quota per job role covers
        every segment. The catalog `BusinessShift` may store this same shape as
        optional `defaultSegments`. That value is a client preload only: the
        server does not copy it when an occurrence, recurring template or
        requirement is created from the shift without `segments`.
      properties:
        startTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
        endTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
      required: [startTime, endTime]
      example:
        startTime: "10:00"
        endTime: "14:00"

    ScheduledShiftSegmentDTO:
      type: object
      additionalProperties: false
      description: >
        One planned interval of an assigned shift, as offset-aware instants with
        minute precision. Not a clocked worklog: clocked intervals are the BFF
        `AttendanceClockedDTO.segments` and attendance `timeline.segments`.
        Several worklogs may reference the same `scheduledShiftId`, each one
        matched to a segment.

        The parent `segments` array, when present, has one or two items, ordered
        by `startAt`, non-overlapping, with a gap of at least one minute, on the
        same logical day (the local date of the first segment's start). Only the
        last segment may cross midnight, with the same bound as the envelope
        `endAt`. Each segment must lie inside the day's opening intervals; the
        check is per segment. The parent `startAt` and `endAt` are the envelope
        (first start, last end) and stay required. Omit `segments`, or send one
        segment equal to the envelope, for a normal shift. An envelope that does
        not match the segments is `400` `1047` `INVALID_SCHEDULED_SHIFT`.

        `breakMinutes` does not include the unpaid gap. Net seconds are the sum
        of the segment durations minus `breakMinutes`, never negative. The gap
        is reserved: overlap for the same person uses the envelope
        (`left.endAt > right.startAt`, end exclusive, so back-to-back shifts are
        allowed). Another shift of that person placed inside the gap is `400`
        `1047` on a draft replace and a `SHIFT_OVERLAP` warning on a shift-change
        proposal. A split shift is exchanged or corrected as a whole; both
        segments travel together. The shift-change fingerprint includes
        `segments`, not only the envelope.
      properties:
        startAt:
          type: string
          format: date-time
          description: Offset-aware start of this segment.
          example: "2026-10-30T10:00:00+02:00"
        endAt:
          type: string
          format: date-time
          description: >
            Offset-aware end of this segment. Only the last segment of the shift
            may fall on the next local date.
          example: "2026-10-30T14:00:00+02:00"
      required: [startAt, endAt]

    OpeningIntervalRequestDTO:
      type: object
      properties:
        startTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
        endTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
      required: [startTime, endTime]

    OpeningIntervalResponseDTO:
      type: object
      properties:
        startTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
        endTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
      required: [startTime, endTime]

    RoleDemandRequestDTO:
      type: object
      properties:
        jobRoleId:
          type: integer
          format: int64
        minimumEmployees:
          type: integer
          format: int32
          minimum: 0
        targetEmployees:
          type: integer
          format: int32
          minimum: 0
        maximumEmployees:
          type: integer
          format: int32
          minimum: 1
      required: [jobRoleId, minimumEmployees, targetEmployees, maximumEmployees]

    RoleDemandResponseDTO:
      type: object
      properties:
        jobRoleId:
          type: integer
          format: int64
        minimumEmployees:
          type: integer
          format: int32
        targetEmployees:
          type: integer
          format: int32
        maximumEmployees:
          type: integer
          format: int32
      required: [jobRoleId, minimumEmployees, targetEmployees, maximumEmployees]

    PlanningRoleDemandResponseDTO:
      type: object
      description: Immutable planning demand with derived coverage from valid scheduled assignments.
      properties:
        jobRoleId:
          type: integer
          format: int64
        minimumEmployees:
          type: integer
          format: int32
        targetEmployees:
          type: integer
          format: int32
        maximumEmployees:
          type: integer
          format: int32
        assignedEmployees:
          type: integer
          format: int32
          minimum: 0
          description: Number of valid scheduled assignments for this demand.
        minimumDeficit:
          type: integer
          format: int32
          minimum: 0
          description: Missing employees below the minimum, never negative.
        targetDeficit:
          type: integer
          format: int32
          minimum: 0
          description: Missing employees below the target, never negative.
      required:
        [
          jobRoleId,
          minimumEmployees,
          targetEmployees,
          maximumEmployees,
          assignedEmployees,
          minimumDeficit,
          targetDeficit,
        ]

    CreateBusinessShiftRequestDTO:
      type: object
      description: >
        Creates an active business Shift. The name is trimmed before normalized uniqueness is checked. Optional `defaultBreakMinutes` defaults to 0 when omitted.
        Optional `defaultSegments` is a client preload, the same kind of default as `defaultBreakMinutes`. The client uses it to prefill the editor when creating a NEW daily occurrence, recurring template or planning requirement. The server does not infer or copy these segments when something is created from this shiftId without `segments`. Changing the catalog never rewrites existing occurrences, recurring templates, planning requirements or assignments.
        `defaultStartAt` and `defaultEndAt` stay the envelope (start of the first default segment, end of the last) and stay required on update and on the response. On creation they remain optional when `defaultSegments` is omitted; the response always returns them. When `defaultSegments` is sent they must be present and match that envelope, or the server returns 400 1060 INVALID_SHIFT.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Morning service
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Six-digit hexadecimal display color.
          example: "#1A2B3C"
        defaultStartAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]{1,9})?)?$'
          description: Envelope start in local business time, without a date or time-zone offset. Optional on creation. When `defaultSegments` is sent, this is the start of the first segment, compared at minute precision, and must be present.
          example: "09:00:00"
        defaultEndAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]{1,9})?)?$'
          description: Envelope end in local business time, without a date or time-zone offset. May precede the start time for overnight Shifts. Optional on creation. When `defaultSegments` is sent, this is the end of the last segment, compared at minute precision, and must be present.
          example: "17:00:00"
        defaultBreakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned unpaid break, in minutes, suggested when a NEW daily occurrence of this shift is created. It never changes existing occurrences, schedule exceptions, recurring templates, planning requirements, plannings or assignments. Not a clocked break. Must be >= 0 and strictly less than the net default duration: the defaultStartAt→defaultEndAt envelope when there is no split default (start equal to end counts as 24h), or the sum of the `defaultSegments` durations when a split default is stored (the unpaid gap is not included). 0 means no default break. On create, omitted defaults to 0. On update, omitted keeps the stored value. If the stored default no longer fits after changing the default times or the default segments, the server returns 400 1060 INVALID_SHIFT. The server never propagates this value into daily occurrences.
          example: 30
        defaultSegments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Optional default segments. Omit for a normal shift. `[]` is
            rejected (`minItems: 1`). `null` is not allowed (the array is not
            nullable). Items reuse `ShiftSegmentDTO` (`HH:mm`), the same local
            minute time as planning `segments`. One or two intervals, ordered
            by start, with no overlap and a gap of at least one minute. They
            share one logical day. The first segment of a split shift does not
            cross midnight; only the last segment may, under the same overnight
            rule as the envelope (an end not later than the start finishes the
            next day). The first segment starts at `defaultStartAt` and the
            last ends at `defaultEndAt`, compared at minute precision
            (`10:00:00` matches `10:00`; a non-zero second or fraction does
            not match). A single segment must equal that envelope and is stored
            as a normal shift. These values only preload the client editor for
            a new occurrence, recurring template or requirement. The server
            does not copy them when a write sends this shiftId and omits
            `segments`, and later catalog edits do not propagate to existing
            occurrences, templates, requirements or assignments.
            `defaultBreakMinutes` must be strictly less than the sum of these
            segment durations (the unpaid gap is not included). A violation is
            400 1060 INVALID_SHIFT. Catalog defaults are not checked against a
            day's opening hours; that check applies when segments are written
            on an occurrence.
          items:
            $ref: "#/components/schemas/ShiftSegmentDTO"
      required: [name, color]

    UpdateBusinessShiftRequestDTO:
      type: object
      description: >
        Updates a business Shift. Setting active to true reactivates it; DELETE performs logical deactivation. Optional `defaultBreakMinutes` keeps the stored value when omitted; never rewrites existing daily occurrences, recurring templates, planning requirements or assignments.
        Optional `defaultSegments` has the same client-preload meaning as on create. Omit it to keep the stored value. `[]` removes the split default. `null` is not allowed. `defaultStartAt` and `defaultEndAt` stay required and are the envelope.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Morning service
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Six-digit hexadecimal display color.
          example: "#4C9F70"
        active:
          type: boolean
          example: true
        defaultStartAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]{1,9})?)?$'
          description: Envelope start in local business time, without a date or time-zone offset. Required. Start of the first default segment when a split default is stored.
          example: "09:00:00"
        defaultEndAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]{1,9})?)?$'
          description: Envelope end in local business time, without a date or time-zone offset. May precede the start time for overnight Shifts. Required. End of the last default segment when a split default is stored.
          example: "17:00:00"
        defaultBreakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned unpaid break, in minutes, suggested when a NEW daily occurrence of this shift is created. It never changes existing occurrences, schedule exceptions, recurring templates, planning requirements, plannings or assignments. Not a clocked break. Must be >= 0 and strictly less than the net default duration: the defaultStartAt→defaultEndAt envelope when there is no split default (start equal to end counts as 24h), or the sum of the `defaultSegments` durations when a split default is stored (the unpaid gap is not included). 0 means no default break. On create, omitted defaults to 0. On update, omitted keeps the stored value. If the stored default no longer fits after changing the default times or the default segments, the server returns 400 1060 INVALID_SHIFT. The server never propagates this value into daily occurrences.
          example: 30
        defaultSegments:
          type: array
          minItems: 0
          maxItems: 2
          description: >
            Replaces the stored default segments. Omit the property to keep
            the stored value. `[]` removes the split default and leaves a
            normal shift. `null` is not allowed (not nullable). A non-empty
            array has one or two `ShiftSegmentDTO` intervals (`HH:mm`),
            ordered by start, with no overlap and a gap of at least one
            minute, and the same midnight rule as planning `segments`: the
            first segment of a split shift does not cross midnight; only the
            last may. The first starts at `defaultStartAt` and the last ends
            at `defaultEndAt` (minute precision; a non-zero second or fraction
            on the envelope does not match). One segment must equal the
            envelope and is stored as a normal shift. If this property is
            omitted and the stored segments no longer match the envelope after
            `defaultStartAt` or `defaultEndAt` changes, the server returns
            400 1060 INVALID_SHIFT. Same client-preload semantics as on create:
            the server never copies these segments onto occurrences, recurring
            templates, requirements or assignments, including ones created from
            this shiftId without `segments`. `defaultBreakMinutes` must stay
            strictly below the net duration (the sum of the segment durations
            when a split default is stored, otherwise the envelope).
          items:
            $ref: "#/components/schemas/ShiftSegmentDTO"
      required: [name, color, active, defaultStartAt, defaultEndAt]

    BusinessShiftResponseDTO:
      type: object
      description: >
        Business-owned Shift identity and current presentation. `defaultStartAt`
        and `defaultEndAt` are always present and are the envelope.
        `defaultSegments` is omitted for a normal shift, the same presence rule
        as planning `segments` (not returned as `[]`). It is present for a
        split default. It is a client preload only: the server does not copy it
        when an occurrence, recurring template or requirement is created from
        this shift without `segments`, and editing it never changes existing
        occurrences, templates, requirements or assignments.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 20
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        name:
          type: string
          minLength: 1
          example: Morning service
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#1A2B3C"
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2025-06-01T10:00:00+00:00"
        updatedAt:
          type: string
          format: date-time
          example: "2025-06-01T10:00:00+00:00"
        defaultStartAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]{1,9})?)?$'
          description: Envelope start in local business time, without a date or time-zone offset. Always populated. Start of the first default segment when `defaultSegments` is present.
          example: "09:00:00"
        defaultEndAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]{1,9})?)?$'
          description: Envelope end in local business time, without a date or time-zone offset. Always populated; may precede the start time for overnight Shifts. End of the last default segment when `defaultSegments` is present.
          example: "17:00:00"
        defaultBreakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Always populated; 0 = no default break. Planned unpaid break, in minutes, suggested when a NEW daily occurrence of this shift is created. It never changes existing occurrences, schedule exceptions, recurring templates, planning requirements, plannings or assignments. Not a clocked break. Must be >= 0 and strictly less than the net default duration: the defaultStartAt→defaultEndAt envelope when there is no split default (start equal to end counts as 24h), or the sum of the `defaultSegments` durations when a split default is stored (the unpaid gap is not included). 0 means no default break. On create, omitted defaults to 0. On update, omitted keeps the stored value. If the stored default no longer fits after changing the default times or the default segments, the server returns 400 1060 INVALID_SHIFT. The server never propagates this value into daily occurrences.
          example: 0
        defaultSegments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Default segments of a split shift. Same shape as planning
            `segments` (`ShiftSegmentDTO`, `HH:mm`). Omitted for a normal
            shift, including when nothing is stored and when the stored value
            was normalized from a single segment equal to the envelope.
            Planning responses omit `segments` for a normal shift; this field
            follows that rule and is not returned as `[]`. When present, both
            segments are returned: the first starts at `defaultStartAt` and
            the last ends at `defaultEndAt`. A client preload only. Editing it
            does not change existing occurrences, recurring templates,
            planning requirements or assignments, and the server does not copy
            it when those are created from this shift without `segments`.
          items:
            $ref: "#/components/schemas/ShiftSegmentDTO"
      required: [id, businessId, name, color, active, createdAt, updatedAt, defaultStartAt, defaultEndAt, defaultBreakMinutes]

    BusinessShiftSliceResponseDTO:
      type: object
      description: >
        Deterministic slice of business Shifts without a total-count query.
        A normal shift omits `defaultSegments`. `Split service` is a split
        default (10:00–14:00 and 19:00–23:00, envelope 10:00–23:00,
        `defaultBreakMinutes` 30, which is below the 480-minute net).
      properties:
        content:
          type: array
          description: Shifts ordered by active state descending, name ascending, and ID ascending.
          items:
            $ref: "#/components/schemas/BusinessShiftResponseDTO"
        page:
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 20
        hasNext:
          type: boolean
          example: true
      required: [content, page, size, hasNext]
      example:
        content:
          - id: 20
            businessId: 101
            name: Morning service
            color: "#1A2B3C"
            defaultStartAt: "09:00:00"
            defaultEndAt: "17:00:00"
            defaultBreakMinutes: 30
            active: true
            createdAt: "2025-06-01T10:00:00+00:00"
            updatedAt: "2025-06-01T10:00:00+00:00"
          - id: 22
            businessId: 101
            name: Split service
            color: "#C47B2B"
            defaultStartAt: "10:00:00"
            defaultEndAt: "23:00:00"
            defaultBreakMinutes: 30
            defaultSegments:
              - startTime: "10:00"
                endTime: "14:00"
              - startTime: "19:00"
                endTime: "23:00"
            active: true
            createdAt: "2025-06-03T10:00:00+00:00"
            updatedAt: "2025-06-03T10:00:00+00:00"
          - id: 21
            businessId: 101
            name: Legacy service
            color: "#808080"
            defaultStartAt: "22:00:00"
            defaultEndAt: "06:00:00"
            defaultBreakMinutes: 0
            active: false
            createdAt: "2025-06-02T10:00:00+00:00"
            updatedAt: "2025-06-02T10:00:00+00:00"
        page: 0
        size: 20
        hasNext: false

    DailyShiftRequestDTO:
      type: object
      description: >
        Day-specific occurrence values referencing an independently managed business Shift.
        `breakMinutes` remains required and is the effective value for this occurrence. Clients
        that create a NEW occurrence typically initialize it from the catalog Shift's
        `defaultBreakMinutes`; changing the catalog default never rewrites existing occurrences.
        When a planning is generated or published, this effective value is copied into the
        planning snapshot and into each `scheduled_shift`; those snapshots never read the catalog
        `defaultBreakMinutes` back, so editing the catalog default cannot alter existing
        plannings, their net planned seconds or their assigned shifts.
        `breakMinutes` does not include the unpaid gap of a split shift. Optional
        `segments` (see `ShiftSegmentDTO`) are the planned intervals; the
        required `startTime` and `endTime` stay the envelope.
        Omitting `segments` does not make the server copy the catalog Shift's
        `defaultSegments`. The client may preload the editor from that default
        when creating a new occurrence, recurring template or requirement; only
        the segments sent here are stored. A later edit of the catalog default
        does not change this occurrence, its planning snapshot or its assignments.
      properties:
        shiftId:
          type: integer
          format: int64
          minimum: 1
          description: Business Shift referenced by this occurrence.
          example: 20
        startTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
        endTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned break of the shift, in minutes. It does not include the
            unpaid gap between segments. Must be strictly less than the sum of
            the segment durations (the envelope duration when `segments` is omitted).
        segments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Planned segments. Omit for a normal shift, whose only interval is
            the envelope. See `ShiftSegmentDTO`.
          items:
            $ref: "#/components/schemas/ShiftSegmentDTO"
        demands:
          type: array
          items:
            $ref: "#/components/schemas/RoleDemandRequestDTO"
      required: [shiftId, startTime, endTime, breakMinutes, demands]

    DailyShiftResponseDTO:
      type: object
      description: >
        Day-specific occurrence values with its business Shift reference. Shift
        presentation is resolved by the BFF. `startTime` and `endTime` are the
        envelope. Optional `segments` carries a split shift; see `ShiftSegmentDTO`.
      properties:
        shiftId:
          type: integer
          format: int64
          minimum: 1
