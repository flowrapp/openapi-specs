    CreateBusinessJobRoleRequestDTO:
      type: object
      description: Creates an active business job role with client-facing visual metadata.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          example: WAITER
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Waiter
        description:
          type: [string, "null"]
          maxLength: 500
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Hexadecimal display color. Values without exactly six hexadecimal digits are invalid.
          example: "#1A2B3C"
        icon:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Lowercase slug from the open client icon catalog.
          example: front-of-house
      required: [code, name, color, icon]

    UpdateBusinessJobRoleRequestDTO:
      type: object
      description: Updates a business job role. Setting active to true reactivates a deactivated role.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 500
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Hexadecimal display color. Values without exactly six hexadecimal digits are invalid.
          example: "#1A2B3C"
        icon:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Lowercase slug from the open client icon catalog.
          example: front-of-house
        active:
          type: boolean
      required: [name, color, icon, active]

    BusinessJobRoleResponseDTO:
      type: object
      description: Business job role with reversible activation and display metadata.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        businessId:
          type: integer
          format: int64
          minimum: 1
        code:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#1A2B3C"
        icon:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          example: front-of-house
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [id, businessId, code, name, color, icon, active, createdAt, updatedAt]

    BusinessJobRoleListItemDTO:
      type: object
      description: >
        Job role of the list, enriched with its current usage. Only the list returns
        `memberCount`; create and update keep `BusinessJobRoleResponseDTO` and do not compute it.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        businessId:
          type: integer
          format: int64
          minimum: 1
        code:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#1A2B3C"
        icon:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Lowercase slug from the open client icon catalog.
          example: front-of-house
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        memberCount:
          type: integer
          format: int32
          minimum: 0
          description: >
            Distinct active non-ADMIN members holding a current contract on this role for
            the business-local today (`LocalDate.now(business.zone)`; current =
            `startDate <= today` and (`endDate` null or `>= today`), same rule as
            `getCurrentContractsForUsers`). Computed with one grouped query for the page
            ids, never one query per role; 0 is real (also for archived roles) and never
            invented on failure.
      required:
        [id, businessId, code, name, color, icon, active, createdAt, updatedAt, memberCount]

    BusinessJobRoleSliceResponseDTO:
      type: object
      description: Slice of business job roles without a total-count query
      properties:
        content:
          type: array
          description: Job roles ordered by active state descending, name ascending, and ID ascending
          items:
            $ref: "#/components/schemas/BusinessJobRoleListItemDTO"
        page:
          type: integer
          format: int32
          minimum: 0
          description: Current page number, zero-based
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          description: Requested page size
          example: 20
        hasNext:
          type: boolean
          description: Whether another slice is available
          example: true
      required: [content, page, size, hasNext]
      example:
        content:
          - id: 10
            businessId: 101
            code: WAITER
            name: Waiter
            description: Front of house service
            color: "#1A2B3C"
            icon: front-of-house
            active: true
            createdAt: "2025-06-01T10:00:00+00:00"
            updatedAt: "2025-06-01T10:00:00+00:00"
          - id: 11
            businessId: 101
            code: HOST
            name: Waiter
            description: Inactive front of house role
            color: "#808080"
            icon: briefcase
            active: false
            createdAt: "2025-06-02T10:00:00+00:00"
            updatedAt: "2025-06-02T10:00:00+00:00"
        page: 0
        size: 20
        hasNext: false

    PlanningRequirementShiftDTO:
      type: object
      description: Immutable, presentation-safe shift input captured when a planning was created. It contains no solver correlation identifiers.
      properties:
        shiftId:
          type: integer
          format: int64
          minimum: 1
          description: Business Shift identity captured in the planning snapshot
          example: 20
        name:
          type: string
          minLength: 1
          description: Shift display name captured in the planning snapshot
          example: Morning service
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Shift display color captured in the planning snapshot
          example: "#1A2B3C"
        startTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
        endTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Effective break of this occurrence, captured in the planning snapshot. Never read
            back from the catalog Shift's `defaultBreakMinutes`: editing that default later
            cannot change this snapshot nor the planned net seconds. It does not include the
            unpaid gap between segments. Net planned time is the sum of the segment durations
            minus this value.
          example: 30
        segments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Planned segments captured in the snapshot. Omitted for a normal shift.
            `startTime` and `endTime` remain the envelope. See `ShiftSegmentDTO`.
            Not read back from the catalog Shift's `defaultSegments`.
          items:
            $ref: "#/components/schemas/ShiftSegmentDTO"
        demands:
          type: array
          description: Staffing demand by stable business job-role ID with derived planning coverage.
          items:
            $ref: "#/components/schemas/PlanningRoleDemandResponseDTO"
      required:
        [shiftId, name, color, startTime, endTime, breakMinutes, demands]

    PlanningRequirementDTO:
      type: object
      description: Immutable planning requirements grouped by business-local calendar date.
      properties:
        date:
          type: string
          format: date
          description: Business-local calendar date captured by the planning snapshot
          example: "2025-07-28"
        shifts:
          type: array
          description: Shift requirements captured for this date
          items:
            $ref: "#/components/schemas/PlanningRequirementShiftDTO"
      required: [date, shifts]

    PlanningSettingsDTO:
      type: object
      properties:
        generationDay:
          $ref: "#/components/schemas/DayOfWeekDTO"
        generationTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
      required: [generationDay, generationTime]

    PlanningStatusDTO:
      type: string
      description: >
        Planning lifecycle state: CREATED, SOLVING, DRAFT, PUBLISHED, ARCHIVED, or terminal FAILED.
        DRAFT is editable and unpublished; it may be created manually or result from automatic solving.
        ARCHIVED is previously published history.
        FAILED exposes only a sanitized failure reason.
      enum: [CREATED, SOLVING, DRAFT, PUBLISHED, ARCHIVED, FAILED]

    PlanningFailureCodeDTO:
      type: string
      description: >
        Why a planning is FAILED. Open string (not a closed enum): clients and generated
        Java/Kotlin clients must tolerate unknown values. Known values today are
        SOLVER_REJECTED (the solver HTTP submit was rejected, 4xx),
        SOLVER_UNAVAILABLE (the solver could not be reached, answered 5xx, a transport
        timeout, or the generation timed out waiting for a result),
        SOLVER_FAILED (the Timefold job existed and ended in a failed solver status),
        and INTERNAL (unexpected error in Main, or a week failed because a previous week
        of the same generation job failed). Only meaningful when status is FAILED; null
        otherwise, including FAILED rows written before this field existed. Clients must
        ignore this field unless status is FAILED.
      x-extensible-enum:
        - SOLVER_REJECTED
        - SOLVER_UNAVAILABLE
        - SOLVER_FAILED
        - INTERNAL
      example: SOLVER_FAILED

    ScheduledShiftResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        planningId:
          type: integer
          format: int64
        businessId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        jobRoleId:
          type: integer
          format: int64
        shiftId:
          type: integer
          format: int64
          minimum: 1
          description: Business Shift identity captured from the planning requirement
          example: 20
        shiftName:
          type: string
          minLength: 1
          description: Display name captured from the planning requirement
          example: Morning service
        shiftColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Display color captured from the planning requirement
          example: "#1A2B3C"
        startAt:
          type: string
          format: date-time
          description: >
            Envelope start: the start of the first planned segment. Offset-aware.
        endAt:
          type: string
          format: date-time
          description: >
            Envelope end: the end of the last planned segment. Offset-aware. May
            fall on the next local date.
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned break of the shift, in minutes. It does not include the unpaid
            gap between segments.
        segments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Planned segments of this assignment. Omitted for a normal shift.
            `startAt` and `endAt` remain the envelope. Not clocked worklogs.
            See `ScheduledShiftSegmentDTO`. Not updated when the catalog
            `defaultSegments` changes.
          items:
            $ref: "#/components/schemas/ScheduledShiftSegmentDTO"
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: >
            Net planned seconds: sum of the planned segment durations minus
            `breakMinutes`, never negative. When `segments` is omitted the
            envelope is the only segment (overnight counts 24 hours). The unpaid
            gap is not included and is not a break. Server-computed. Same value
            as `netSeconds`.
          example: 30600
        netSeconds:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: >
            Same value as `durationSeconds`. Server-computed net planned seconds.
          example: 30600
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [
          id,
          planningId,
          businessId,
          userId,
          jobRoleId,
          shiftId,
          shiftName,
          shiftColor,
          startAt,
          endAt,
          breakMinutes,
          createdAt,
          updatedAt,
        ]

    CreateDraftPlanningRequestDTO:
      type: object
      description: Creates an empty manually editable planning for one business-local ISO week.
      properties:
        weekStart:
          type: string
          format: date
          description: Monday of the planning week in the business-local calendar.
          example: "2026-10-05"
      required: [weekStart]

    ScheduledShiftRequestDTO:
      type: object
      description: >
        One manual assignment. Presentation metadata is resolved and captured by
        the server from shiftId. `startAt` and `endAt` are the envelope. Optional
        `segments` (see `ScheduledShiftSegmentDTO`) makes this a split shift.
        The gap between segments is reserved: the same person cannot hold another
        shift inside the envelope (`400` `1047`).
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: >
            Optional scheduled-shift ID returned in the planning response;
            omit for a new assignment.
          example: 900
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 42
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          example: 7
        shiftId:
          type: integer
          format: int64
          minimum: 1
          example: 20
        startAt:
          type: string
          format: date-time
          description: Envelope start. Must equal the first segment's `startAt` when `segments` is sent.
          example: "2026-10-05T09:00:00+02:00"
        endAt:
          type: string
          format: date-time
          description: Envelope end. Must equal the last segment's `endAt` when `segments` is sent.
          example: "2026-10-05T17:00:00+02:00"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned break of the shift, in minutes. It does not include the unpaid
            gap between segments, and must be strictly less than the sum of the
            segment durations.
          example: 30
        segments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Planned segments. Omit for a normal shift. The envelope must be the
            first segment's start and the last segment's end. See
            `ScheduledShiftSegmentDTO`.
          items:
            $ref: "#/components/schemas/ScheduledShiftSegmentDTO"
      required: [userId, jobRoleId, shiftId, startAt, endAt, breakMinutes]

    ReplacePlanningScheduledShiftsRequestDTO:
      type: object
      description: Complete replacement of the scheduled shifts in an editable draft planning.
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: Version obtained from the latest planning response.
          example: 3
        scheduledShifts:
          type: array
          description: Complete replacement collection; an empty array removes all draft shifts.
          items:
            $ref: "#/components/schemas/ScheduledShiftRequestDTO"
      required: [version, scheduledShifts]

    PlanningResponseDTO:
      type: object
      description: Weekly planning with manual scheduled shifts and, when automatically generated, immutable solver requirements.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        version:
          type: integer
          format: int64
          minimum: 0
          description: Aggregate version required when replacing draft scheduled shifts.
        businessId:
          type: integer
          format: int64
          minimum: 1
        weekStart:
          type: string
          format: date
          description: Monday of the planning week in the business-local calendar
          example: "2025-07-28"
        weekEnd:
          type: string
          format: date
          description: Sunday of the planning week in the business-local calendar
          example: "2025-08-03"
        status:
          $ref: "#/components/schemas/PlanningStatusDTO"
        failureReason:
          type: [string, "null"]
          maxLength: 1000
          description: >
            Sanitized diagnostic reason for FAILED plannings; never a stack trace or raw
            provider payload. For operators and support, not for display in the owner UI
            (the app shows copy from failureCode).
          example: null
        failureCode:
          description: >
            Why the planning is FAILED. Null when status is not FAILED, or for FAILED rows
            written before this field existed. Clients must ignore this field unless status
            is FAILED. Open string: see PlanningFailureCodeDTO.
          oneOf:
            - $ref: "#/components/schemas/PlanningFailureCodeDTO"
            - type: "null"
          example: null
        failedAt:
          type: [string, "null"]
          format: date-time
          description: >
            Instant when the planning entered FAILED, in the same format as createdAt
            (UTC Instant serialized with offset). Null if the planning is not FAILED, or if
            it failed before this field existed.
          example: null
        requirements:
          type: array
          description: Immutable requirements captured only for automatically generated plannings; empty for manually created drafts.
          items:
            $ref: "#/components/schemas/PlanningRequirementDTO"
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, "null"]
          format: date-time
        scheduledShifts:
          type: array
          description: Persisted manual or solver-generated assignments. Empty when the planning has no assignments yet.
          items:
            $ref: "#/components/schemas/ScheduledShiftResponseDTO"
        hasCoverageWarnings:
          type: boolean
          description: True when any immutable demand remains below its minimum staffing level.
      required:
        [
          id,
          version,
          businessId,
          weekStart,
          weekEnd,
          status,
          failureReason,
          requirements,
          createdAt,
          scheduledShifts,
          hasCoverageWarnings,
        ]
      example:
        id: 500
        businessId: 101
        weekStart: "2025-07-28"
        weekEnd: "2025-08-03"
        status: SOLVING
        failureReason: null
        requirements: []
        createdAt: "2025-07-27T08:00:00+02:00"
        scheduledShifts: []
        hasCoverageWarnings: false
      x-status-examples:
        - summary: Solving planning
          value:
            id: 500
            businessId: 101
            weekStart: "2025-07-28"
            weekEnd: "2025-08-03"
            status: SOLVING
            failureReason: null
            requirements:
              - date: "2025-07-28"
                shifts:
                  - shiftId: 20
                    name: Morning service
                    color: "#1A2B3C"
                    startTime: "09:00"
                    endTime: "17:00"
                    breakMinutes: 30
                    demands:
                      - jobRoleId: 10
                        minimumEmployees: 1
                        targetEmployees: 2
                        maximumEmployees: 3
                        assignedEmployees: 0
                        minimumDeficit: 1
                        targetDeficit: 2
            createdAt: "2025-07-27T08:00:00+02:00"
            publishedAt: null
            scheduledShifts: []
            hasCoverageWarnings: true
        - summary: Draft planning
          value:
            id: 500
            businessId: 101
            weekStart: "2025-07-28"
            weekEnd: "2025-08-03"
            status: DRAFT
            failureReason: null
            requirements:
              - date: "2025-07-28"
                shifts:
                  - shiftId: 20
                    name: Morning service
                    color: "#1A2B3C"
                    startTime: "09:00"
                    endTime: "17:00"
                    breakMinutes: 30
                    demands:
                      - jobRoleId: 10
                        minimumEmployees: 1
                        targetEmployees: 2
                        maximumEmployees: 3
                        assignedEmployees: 1
                        minimumDeficit: 0
                        targetDeficit: 1
            createdAt: "2025-07-27T08:00:00+02:00"
            publishedAt: null
            scheduledShifts:
              - id: 900
                planningId: 500
                businessId: 101
                userId: 1
                jobRoleId: 10
                shiftId: 20
                shiftName: Morning service
                shiftColor: "#1A2B3C"
                startAt: "2025-07-28T09:00:00+02:00"
                endAt: "2025-07-28T17:00:00+02:00"
                breakMinutes: 30
                createdAt: "2025-07-27T09:00:00+02:00"
                updatedAt: "2025-07-27T09:00:00+02:00"
        - summary: Published planning
          value:
            id: 500
            businessId: 101
            weekStart: "2025-07-28"
            weekEnd: "2025-08-03"
            status: PUBLISHED
            failureReason: null
            requirements: []
            createdAt: "2025-07-27T08:00:00+02:00"
            publishedAt: "2025-07-27T12:00:00+02:00"
            scheduledShifts: []
            hasCoverageWarnings: false
        - summary: Failed planning
          value:
            id: 501
            businessId: 101
            weekStart: "2025-08-04"
            weekEnd: "2025-08-10"
            status: FAILED
            failureCode: SOLVER_FAILED
            failureReason: "No feasible assignment was found."
            failedAt: "2025-08-03T08:05:12+02:00"
            requirements: []
            createdAt: "2025-08-03T08:00:00+02:00"
            publishedAt: null
            scheduledShifts: []
            hasCoverageWarnings: false

    TeamScheduleResponseDTO:
      type: object
      description: >-
        Privacy-safe schedule for all seven dates of an ISO week, visible to any member of the
        business. Days without shifts are included with an empty shifts array.
      properties:
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        week:
          type: string
          pattern: '^\d{4}-W\d{2}$'
          description: ISO week identifier
          example: "2025-W31"
        weekStart:
          type: string
          format: date
          description: Monday of the requested ISO week in the business-local calendar
          example: "2025-07-28"
        weekEnd:
          type: string
          format: date
          description: Sunday of the requested ISO week in the business-local calendar
          example: "2025-08-03"
        days:
          type: array
          description: >-
            All seven dates of the ISO week, Monday to Sunday, ordered by business-local date.
            Days without assigned shifts are included with an empty shifts array; userIds and
            jobRoleId filters only filter shifts and never remove days.
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/TeamScheduleDayDTO"
      required: [businessId, week, weekStart, weekEnd, days]

    TeamScheduleDayDTO:
      type: object
      description: >-
        One business-local date in the week. open is false when the effective daily configuration
        has no opening intervals: the date's schedule exception, otherwise the recurring schedule
        effective on that date, otherwise no configuration. A person's lack of shifts does not
        make an open date closed.
      properties:
        date:
          type: string
          format: date
          example: "2025-07-28"
        open:
          type: boolean
          description: Whether the date has at least one opening interval in its effective daily configuration.
          example: true
        shifts:
          type: array
          description: Shifts ordered by start instant and then stable shift ID
          items:
            $ref: "#/components/schemas/TeamScheduleShiftDTO"
      required: [date, open, shifts]

    TeamScheduleShiftDTO:
      type: object
      description: >
        Privacy-safe presentation of one assigned shift. `startAt` and `endAt`
        are the envelope. Optional `segments` are the planned intervals of a
        split shift, not clocked worklogs.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 900
        worker:
          $ref: "#/components/schemas/TeamScheduleWorkerDTO"
        jobRole:
          $ref: "#/components/schemas/TeamScheduleJobRoleDTO"
        shiftId:
          type: integer
          format: int64
          minimum: 1
          description: Business Shift identity captured in the immutable planning snapshot
          example: 20
        shiftName:
          type: string
          minLength: 1
          example: Morning service
        shiftColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#1A2B3C"
        startAt:
          type: string
          format: date-time
          description: Offset-aware start instant
          example: "2025-07-28T09:00:00+02:00"
        endAt:
          type: string
          format: date-time
          description: Offset-aware end instant; may be on the following local date
          example: "2025-07-28T17:00:00+02:00"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned break of the shift, in minutes. It does not include the unpaid
            gap between segments.
          example: 30
        segments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Planned segments. Omitted for a normal shift. Not clocked worklogs.
            See `ScheduledShiftSegmentDTO`.
          items:
            $ref: "#/components/schemas/ScheduledShiftSegmentDTO"
        plannedSeconds:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: >
            Net planned seconds: sum of the planned segment durations minus
            `breakMinutes`, never negative. When `segments` is omitted the
            envelope is the only segment (overnight counts 24 hours). The unpaid
            gap is not included and is not a break. Same value as
            `durationSeconds`, `netSeconds` and `AttendanceMetrics.plannedSeconds`.
          example: 27000
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Same value as `plannedSeconds`. Server-computed.
          example: 27000
        netSeconds:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Same value as `plannedSeconds`. Server-computed.
          example: 27000
      required:
        [
          id,
          worker,
          jobRole,
          shiftId,
          shiftName,
          shiftColor,
          startAt,
          endAt,
          breakMinutes,
        ]

    TeamScheduleWorkerDTO:
      type: object
      description: Assigned worker's minimal display identity
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 3
        name:
          type: string
          example: Bob Wilson
      required: [id, name]

    TeamScheduleJobRoleDTO:
      type: object
      description: Job-role identity and presentation metadata for an assigned shift
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 10
        code:
          type: string
          example: WAITER
        name:
          type: string
          example: Waiter
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#1A2B3C"
        icon:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          example: front-of-house
      required: [id, code, name, color, icon]

    PlanningGenerationRequestDTO:
      type: object
      additionalProperties: false
      description: Explicit period of whole business-local ISO weeks to generate, at most 4 weeks.
      properties:
        from:
          type: string
          format: date
          description: Monday of the first week, in the business-local calendar; the Monday of the current week or later (the current week can be generated).
          example: "2026-11-09"
        to:
          type: string
          format: date
          description: Sunday of the last week, in the business-local calendar.
          example: "2026-11-22"
        replaceDrafts:
          type: boolean
          default: false
          description: >
            When true, a DRAFT planning of the period does not block the request (no 409 1121 for
            it): that week is generated again on the same planning, and its scheduled shifts,
            manual edits included, are replaced by the solver result. PUBLISHED and ARCHIVED weeks
            still return 409 1121, and CREATED or SOLVING weeks 409 1122. When false or omitted,
            the behaviour is unchanged. The client asks the OWNER before sending true.
          example: false
      required: [from, to]

    PlanningGenerationStatusDTO:
      type: string
      description: >
        PENDING: accepted, no week has reached the solver yet. RUNNING: at least one week is
        SOLVING and not every week has finished. COMPLETED: every week is DRAFT (terminal).
        FAILED: every week has finished and at least one is FAILED, or the job expired without
        an answer from the solver (terminal). The weeks that were solved stay DRAFT. New values
        may be added; clients must tolerate unknown values.
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
      example: RUNNING

    PlanningGenerationWeekDTO:
      type: object
      properties:
        weekStart:
          type: string
          format: date
          example: "2026-11-09"
        weekEnd:
          type: string
          format: date
          example: "2026-11-15"
        planningId:
          type: integer
          format: int64
          minimum: 1
          description: Planning of the week, readable with getPlanning by weekStart.
          example: 501
        planningStatus:
          $ref: "#/components/schemas/PlanningStatusDTO"
        failureReason:
          type: [string, "null"]
          maxLength: 1000
          description: >
            Sanitized diagnostic reason of a FAILED week, as in PlanningResponseDTO.
            For operators and support, not for display in the owner UI.
          example: null
        failureCode:
          description: >
            Why this week is FAILED. Null when planningStatus is not FAILED, or for FAILED
            rows written before this field existed. Clients must ignore this field unless
            planningStatus is FAILED. Open string: see PlanningFailureCodeDTO.
          oneOf:
            - $ref: "#/components/schemas/PlanningFailureCodeDTO"
            - type: "null"
          example: null
        failedAt:
          type: [string, "null"]
          format: date-time
          description: >
            Instant when this week's planning entered FAILED, in the same format as createdAt.
            Null if planningStatus is not FAILED, or if it failed before this field existed.
          example: null
      required: [weekStart, weekEnd, planningId, planningStatus, failureReason]

    PlanningGenerationDTO:
      type: object
      description: Automatic generation job of one business period. Its result is one DRAFT planning per week.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 42
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        from:
          type: string
          format: date
          example: "2026-11-09"
        to:
          type: string
          format: date
          example: "2026-11-22"
        status:
          $ref: "#/components/schemas/PlanningGenerationStatusDTO"
        requestedBy:
          type: integer
          format: int64
          minimum: 1
          description: OWNER who requested the generation.
          example: 1
        requestedAt:
          type: string
          format: date-time
          example: "2026-11-02T18:45:00+01:00"
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: When the job reached COMPLETED or FAILED; null before.
          example: null
        failureReason:
          type: [string, "null"]
          maxLength: 1000
          description: >
            Sanitized diagnostic reason when the generation job is FAILED; never a stack
            trace or raw provider payload. For operators and support, not for display in
            the owner UI (the app shows copy from failureCode).
          example: null
        failureCode:
          description: >
            Why the generation job is FAILED (typically the first failed week, or
            SOLVER_UNAVAILABLE if the job expired). Null when status is not FAILED, or for
            jobs written before this field existed. Clients must ignore this field unless
            status is FAILED. Open string: see PlanningFailureCodeDTO.
          oneOf:
            - $ref: "#/components/schemas/PlanningFailureCodeDTO"
            - type: "null"
          example: null
        failedAt:
          type: [string, "null"]
          format: date-time
          description: >
            Instant when the generation job entered FAILED, in the same format as requestedAt.
            Null if status is not FAILED, or if it failed before this field existed.
          example: null
        weeks:
          type: array
          maxItems: 4
          description: One entry per week of the period, ordered by weekStart.
          items:
            $ref: "#/components/schemas/PlanningGenerationWeekDTO"
      required: [id, businessId, from, to, status, requestedBy, requestedAt, finishedAt, failureReason, weeks]

    PlanningGenerationInputShiftDTO:
      type: object
      description: >
        One shift of an effective day, as the planning snapshot captures it: the business shift
        identity and presentation, the occurrence times and break, and its staffing demand per
        job role. `startTime` and `endTime` are the envelope. `endTime` not later than
        `startTime` rolls into the next day. Optional `segments` are the planned intervals
        of a split shift; net duration is the sum of those segments minus `breakMinutes`.
        These `segments` are the occurrence's, not the catalog `defaultSegments`.
        Building this input does not read the catalog default.
      properties:
        shiftId:
          type: integer
          format: int64
          minimum: 1
          example: 20
        name:
          type: string
          minLength: 1
          example: Mañana
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#1A2B3C"
        startTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
        endTime:
          $ref: "#/components/schemas/LocalMinuteTimeDTO"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned break of the shift, in minutes. It does not include the unpaid
            gap between segments.
          example: 0
        segments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Planned segments of the effective day. Omitted for a normal shift.
            See `ShiftSegmentDTO`.
          items:
            $ref: "#/components/schemas/ShiftSegmentDTO"
        demands:
          type: array
          description: Minimum, target and maximum employees per job role
          items:
            $ref: "#/components/schemas/RoleDemandResponseDTO"
      required: [shiftId, name, color, startTime, endTime, breakMinutes, demands]

    PlanningGenerationInputDayDTO:
      type: object
      description: Effective configuration of one business-local date of the week
      properties:
        date:
          type: string
          format: date
          example: "2026-11-17"
        source:
          type: string
          description: >
            Where the effective configuration comes from: EXCEPTION (the schedule exception of the
            date), RECURRING_SCHEDULE (the recurring schedule effective on the date) or NONE (no
            recurring schedule covers the date: empty day). Open set.
          enum: [RECURRING_SCHEDULE, EXCEPTION, NONE]
          example: RECURRING_SCHEDULE
        scheduleExceptionId:
          type: [integer, "null"]
          format: int64
          description: >
            Id of the schedule exception that replaces this date, or null when the date uses the
            recurring schedule (or has none)
          example: null
        openingIntervals:
          type: array
          items:
            $ref: "#/components/schemas/OpeningIntervalResponseDTO"
        shifts:
          type: array
          description: Shifts of the date; empty means the date is closed for the solver
          items:
            $ref: "#/components/schemas/PlanningGenerationInputShiftDTO"
      required: [date, source, scheduleExceptionId, openingIntervals, shifts]

    PlanningGenerationInputDTO:
      type: object
      description: >
        Read-only solver input of one week (getPlanningGenerationInput): the 7 effective days
        and the solver contract set.
      properties:
        businessId:
          type: integer
          format: int64
          example: 101
        weekStart:
          type: string
          format: date
          example: "2026-11-16"
        weekEnd:
          type: string
          format: date
          example: "2026-11-22"
        days:
          type: array
          minItems: 7
          maxItems: 7
          description: The 7 dates of the week in order, Monday first
          items:
            $ref: "#/components/schemas/PlanningGenerationInputDayDTO"
        contracts:
          type: array
          description: >
            Contracts that intersect the week and belong to active members, ordered by userId
            then startDate descending. Same set the solver receives.
          items:
            $ref: "../contracts/components.yml#/components/schemas/BusinessContractResponseDTO"
      required: [businessId, weekStart, weekEnd, days, contracts]
