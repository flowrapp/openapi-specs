components:
  schemas:
    BusinessProfileUpdateRequestDTO:
      type: object
      description: Complete replacement of the editable business profile fields
      additionalProperties: false
      properties:
        nif:
          type: string
          minLength: 1
          description: Tax identification number for the business
          example: B12345678
        name:
          type: string
          minLength: 1
          description: Name of the business
          example: Coffee Time
        address:
          type: string
          minLength: 1
          description: Address of the business
          example: C/Sin nombre 453
        town:
          type: string
          minLength: 1
          description: Town of the business
          example: Barbate
        city:
          type: string
          minLength: 1
          description: City of the business
          example: Cádiz
        country:
          type: string
          minLength: 1
          description: Country of the business
          example: España
        postalCode:
          type: string
          minLength: 1
          description: Postal code of the business
          example: '11160'
      required: [nif, name, address, town, city, country, postalCode]

    BusinessResponseDTO:
      type: object
      description: Business information with identifier
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the business
          example: 101
        nif:
          type: string
          minLength: 1
          description: Tax identification number for the business
          example: B12345678
        name:
          type: string
          description: Name of the business
          example: "Coffee Time"
        zone:
          type: string
          description: IANA time zone identifier for the business (e.g., America/Caracas)
          example: Europe/Madrid
        address:
          type: string
          description: Address of the business
          example: "C/Sin nombre 453"
        town:
          type: string
          description: Town of the business
          example: "Barbate"
        city:
          type: string
          description: City of the business
          example: "Cádiz"
        country:
          type: string
          description: Country of the business
          example: "España"
        postalCode:
          type: string
          description: Postal code of the business
          example: "11160"
        location:
          $ref: '#/components/schemas/LocationDTO'
        userRole:
          type: string
          description: Role of the current authenticated user in the business
          enum: [OWNER, EMPLOYEE]
          example: "OWNER"
        permissions:
          type: array
          description: >
            Effective permissions of the current user in this business. An OWNER holds every
            permission of the business's effective features and all core permissions. An EMPLOYEE
            holds the permissions of its access role filtered by effective features, or none without
            an active contract. Some advanced operations also require ADVANCED_PLANNING.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BusinessPermission'
          example: [TEAM_VIEW, WORKLOGS_VIEW, REPORTS_VIEW]
        accessRole:
          oneOf:
            - $ref: '#/components/schemas/BusinessAccessRoleSummaryDTO'
            - type: 'null'
          description: Access role of the current user, or null for an OWNER or an EMPLOYEE without one
        plan:
          type: string
          minLength: 1
          description: >
            Commercial plan of the business. Open value set for clients (`ESSENTIAL` and
            `PROFESSIONAL` today); new plans are added by backend configuration.
          example: PROFESSIONAL
        features:
          type: array
          description: >
            Effective features of the business: the features of its plan that are not disabled
            for it and whose requirements are available. `permissions` never holds a permission
            owned by a feature missing here.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BusinessFeature'
          example: [SCHEDULING, ATTENDANCE, ADVANCED_PLANNING]
        longOpenAfterMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 1439
          description: Minutes after which an open worklog requires review for this business.
          example: 720
        attendanceToleranceMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 1440
          description: Minutes tolerated for attendance deviations in this business.
          example: 5
      required:
        - id
        - nif
        - name
        - zone
        - address
        - town
        - city
        - country
        - postalCode
        - location
        - userRole
        - permissions
        - accessRole
        - plan
        - features
        - longOpenAfterMinutes
        - attendanceToleranceMinutes

    BusinessUsersResponseDTO:
      type: object
      description: Response containing users associated with a business
      properties:
        users:
          type: array
          description: List of users associated with the business
          items:
            $ref: '#/components/schemas/BusinessUserResponseDTO'
      required:
        - users

    BusinessUserJobRoleDTO:
      type: object
      description: Job-role identity and display metadata embedded in a current contract
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the job role
          example: 10
        code:
          type: string
          description: Stable business code for the job role
          example: WAITER
        name:
          type: string
          description: Display name of the job role
          example: Waiter
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hexadecimal display color
          example: "#1A2B3C"
        icon:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Lowercase slug from the client icon catalog
          example: front-of-house
        active:
          type: boolean
          description: Whether the referenced job role is currently active in the business catalog
          example: true
      required: [id, code, name, color, icon, active]

    BusinessUserCurrentContractDTO:
      type: object
      description: Contract effective for the worker on the business-local current date
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the contract
          example: 123
        businessId:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the business
          example: 101
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the contracted job role
          example: 10
        jobRole:
          $ref: '#/components/schemas/BusinessUserJobRoleDTO'
        totalWeekHours:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Number of contracted hours in a week
          example: 40.0
        startDate:
          type: string
          format: date
          description: Inclusive contract start date
          example: "2025-01-01"
        endDate:
          type: [string, "null"]
          format: date
          description: Inclusive contract end date, or null for an open-ended contract
          example: null
      required: [id, businessId, jobRoleId, jobRole, totalWeekHours, startDate, endDate]

    BusinessUserResponseDTO:
      type: object
      description: User profile and current contract associated with a business
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier for the user
          example: 1
        username:
          type: string
          description: Existing username identifier for the user
          example: "john.doe"
        name:
          type: string
          description: Display name of the user
          example: "John Doe"
        email:
          type: string
          format: email
          description: Email address of the user
          example: "john.doe@example.com"
        role:
          type: string
          description: Role of the user in the business
          enum: [OWNER, EMPLOYEE]
          example: "OWNER"
        currentContract:
          oneOf:
            - $ref: '#/components/schemas/BusinessUserCurrentContractDTO'
            - type: 'null'
          description: Contract effective on the business-local current date, or null when absent
        removedAt:
          type: [string, "null"]
          format: date-time
          description: Instant the user was removed from the business. Null for active members; only non-null when `includeRemoved=true`.
          example: null
        accessRole:
          oneOf:
            - $ref: '#/components/schemas/BusinessAccessRoleSummaryDTO'
            - type: 'null'
          description: Access role of the member, or null for an OWNER or an EMPLOYEE without one
      required: [userId, username, name, email, role, currentContract, accessRole]

    BusinessUserMembershipPageDTO:
      type: object
      description: >
        One page of active business memberships. With a search, ordered by rank
        (a prefix of the name or of a word first), then by normalized name, then by
        userId. Without a search, ordered by normalized name, then by userId.
        There is no total count.
      properties:
        content:
          type: array
          description: Memberships for this page, possibly empty
          items:
            $ref: '#/components/schemas/BusinessUserMembershipDTO'
        hasNext:
          type: boolean
          description: True when another page exists after this one
          example: true
        nextCursor:
          type: [string, "null"]
          description: >
            Opaque cursor for the next page, or null on the last page. Bound to the
            business and the normalized search.
          example: "eyJ2IjoxLCJyIjoxfQ"
      required: [content, hasNext, nextCursor]

    BusinessUserMembershipDTO:
      type: object
      description: >
        User and membership projection used by the paginated member list.
        `BusinessUserResponseDTO` is not reused: that schema requires `email` and
        `currentContract`, and this list must not expose either. `username` is kept
        for consistency with that v1 list and is currently equal to `name`. `userId`
        is the same identifier schedule and planning accept as `employeeId`.
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          description: >
            User identifier. Same id that schedule and planning use as employeeId.
          example: 41
        username:
          type: string
          description: >
            Currently equal to `name`. Kept for consistency with the v1 member list.
            The backend has no separate username column; the member mapper fills
            `username` with `users.name`.
          example: "Turín García"
        name:
          type: string
          description: Display name (`users.name`). Search matches this field only, not email.
          example: "Turín García"
        role:
          type: string
          description: Role of the user in the business
          enum: [OWNER, EMPLOYEE]
          example: EMPLOYEE
      required: [userId, username, name, role]

    BusinessCurrentContractBatchItemDTO:
      type: object
      description: >
        Current contract of one requested member, including the job role of that contract.
        Requested members without a current contract are omitted from the collection.
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          description: User identifier the contract belongs to
          example: 41
        contract:
          $ref: '#/components/schemas/BusinessUserCurrentContractDTO'
      required: [userId, contract]

    LocationDTO:
      type: object
      description: Business geofence center and radius in meters
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude coordinate
          example: 30.5
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude coordinate
          example: 50.5
        area:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Geofence radius in meters
          example: 5.3
      required:
        - latitude
        - longitude
        - area

    BusinessPermission:
      type: string
      description: >
        Business permission. Implications are closed when an access role is saved:
        TEAM_INVITE, CONTRACTS_MANAGE, WORKLOGS_VIEW, SCHEDULE_VIEW, REPORTS_VIEW and
        CLOCKING_SETTINGS_MANAGE imply TEAM_VIEW; WORKLOGS_MANAGE implies WORKLOGS_VIEW;
        ATTENDANCE_VIEW implies WORKLOGS_VIEW, SCHEDULE_VIEW and REPORTS_VIEW; ATTENDANCE_MANAGE implies ATTENDANCE_VIEW and
        WORKLOGS_MANAGE; SCHEDULE_MANAGE and SHIFT_CHANGES_APPROVE imply SCHEDULE_VIEW;
        REPORTS_EXPORT implies REPORTS_VIEW. The operation each permission unlocks is listed in
        the API description.
      enum:
        - TEAM_VIEW
        - TEAM_INVITE
        - CONTRACTS_MANAGE
        - WORKLOGS_VIEW
        - WORKLOGS_MANAGE
        - ATTENDANCE_VIEW
        - ATTENDANCE_MANAGE
        - SCHEDULE_VIEW
        - SCHEDULE_MANAGE
        - SHIFT_CHANGES_APPROVE
        - REPORTS_VIEW
        - REPORTS_EXPORT
        - CLOCKING_SETTINGS_MANAGE
        - BUSINESS_EDIT
      example: TEAM_VIEW

    BusinessFeature:
      type: string
      description: >
        Optional product module of a business. Available when the business plan includes it, it is
        not disabled for the business and its requirements are available. SCHEDULING owns
        SCHEDULE_VIEW, SCHEDULE_MANAGE and SHIFT_CHANGES_APPROVE and includes manual shifts.
        ATTENDANCE requires SCHEDULING and owns ATTENDANCE_VIEW and ATTENDANCE_MANAGE.
        ADVANCED_PLANNING requires SCHEDULING and gates advanced operations independently of RBAC.
        Every other permission is core. See the API description for the operations each feature gates.
      enum:
        - SCHEDULING
        - ATTENDANCE
        - ADVANCED_PLANNING
      example: SCHEDULING

    BusinessAccessRoleSummaryDTO:
      type: object
      description: Identity of an access role
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the access role
          example: 7
        name:
          type: string
          description: Display name of the access role
          example: Encargado
      required: [id, name]

    BusinessAccessRoleDTO:
      type: object
      description: Access role of a business, a named set of permissions assignable to employees
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the access role
          example: 7
        name:
          type: string
          description: Display name, unique in the business ignoring case
          example: Encargado
        permissions:
          type: array
          description: Permissions of the role, implications included, in catalog order
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BusinessPermission'
          example: [TEAM_VIEW, WORKLOGS_VIEW, ATTENDANCE_VIEW, REPORTS_VIEW]
        memberCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of active members holding this role
          example: 2
      required: [id, name, permissions, memberCount]

    BusinessAccessRoleRequestDTO:
      type: object
      description: >
        Complete definition of an access role. The name is trimmed, 1 to 50 characters and
        unique in the business ignoring case. Implied permissions are added by the server.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Display name of the access role
          example: Encargado
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          description: Permissions granted by the role
          items:
            $ref: '#/components/schemas/BusinessPermission'
          example: [ATTENDANCE_VIEW, REPORTS_VIEW]
      required: [name, permissions]

    BusinessUserAccessRoleRequestDTO:
      type: object
      description: Access role to assign to an employee, or null to clear it
      additionalProperties: false
      properties:
        accessRoleId:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Access role of the business, or null to leave the employee without one
          example: 7
      required: [accessRoleId]
