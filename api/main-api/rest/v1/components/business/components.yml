components:
  schemas:
    BusinessResponseDTO:
      type: object
      description: Business information with identifier
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the business
          example: 101
        name:
          type: string
          description: Name of the business
          example: "Coffee Time"
        zone:
          type: string
          description: IANA time zone identifier for the business (e.g., America/Caracas)
          example: Europe/Madrid
        address:
          type: string
          description: Address of the business
          example: "C/Sin nombre 453"
        town:
          type: string
          description: Town of the business
          example: "Barbate"
        city:
          type: string
          description: City of the business
          example: "Cádiz"
        country:
          type: string
          description: Country of the business
          example: "España"
        location:
          $ref: '#/components/schemas/LocationDTO'
        userRole:
          type: string
          description: Role of the current authenticated user in the business
          enum: [OWNER, MANAGER, EMPLOYEE]
          example: "OWNER"
      required:
        - id
        - name
        - zone
        - address
        - town
        - city
        - country
        - location
        - userRole

    BusinessUsersResponseDTO:
      type: object
      description: Response containing users associated with a business
      properties:
        users:
          type: array
          description: List of users associated with the business
          items:
            $ref: '#/components/schemas/BusinessUserResponseDTO'
      required:
        - users

    BusinessUserJobRoleDTO:
      type: object
      description: Job-role identity and display metadata embedded in a current contract
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the job role
          example: 10
        code:
          type: string
          description: Stable business code for the job role
          example: WAITER
        name:
          type: string
          description: Display name of the job role
          example: Waiter
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Hexadecimal display color
          example: "#1A2B3C"
        icon:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Lowercase slug from the client icon catalog
          example: front-of-house
        active:
          type: boolean
          description: Whether the referenced job role is currently active in the business catalog
          example: true
      required: [id, code, name, color, icon, active]

    BusinessUserCurrentContractDTO:
      type: object
      description: Contract effective for the worker on the business-local current date
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the contract
          example: 123
        businessId:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the business
          example: 101
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the contracted job role
          example: 10
        jobRole:
          $ref: '#/components/schemas/BusinessUserJobRoleDTO'
        totalWeekHours:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Number of contracted hours in a week
          example: 40.0
        startDate:
          type: string
          format: date
          description: Inclusive contract start date
          example: "2025-01-01"
        endDate:
          type: [string, "null"]
          format: date
          description: Inclusive contract end date, or null for an open-ended contract
          example: null
      required: [id, businessId, jobRoleId, jobRole, totalWeekHours, startDate, endDate]

    BusinessUserResponseDTO:
      type: object
      description: User profile and current contract associated with a business
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier for the user
          example: 1
        username:
          type: string
          description: Existing username identifier for the user
          example: "john.doe"
        name:
          type: string
          description: Display name of the user
          example: "John Doe"
        email:
          type: string
          format: email
          description: Email address of the user
          example: "john.doe@example.com"
        role:
          type: string
          description: Role of the user in the business
          enum: [OWNER, MANAGER, EMPLOYEE]
          example: "OWNER"
        currentContract:
          oneOf:
            - $ref: '#/components/schemas/BusinessUserCurrentContractDTO'
            - type: 'null'
          description: Contract effective on the business-local current date, or null when absent
      required: [userId, username, name, email, role, currentContract]


    LocationDTO:
      type: object
      description: Geographic location information
      properties:
        latitude:
          type: number
          format: double
          description: Latitude coordinate
          example: 30.5
        longitude:
          type: number
          format: double
          description: Longitude coordinate
          example: 50.5
        area:
          type: number
          format: double
          description: Area size in square units
          example: 5.3
      required:
        - latitude
        - longitude
        - area
