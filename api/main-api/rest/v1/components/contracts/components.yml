components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Zero-based slice number
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Number of contracts in the slice
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    ContractRequestDTO:
      type: object
      description: Contract details supplied when creating or updating a contract. Its date range must not overlap any other contract for the same user and business, regardless of job role.
      properties:
        jobRoleId:
          type: integer
          format: int64
          description: Active job role contracted within the business
          example: 10
        totalWeekHours:
          type: number
          format: double
          description: Number of hours agreed for a working week
          exclusiveMinimum: 0
          example: 40.0
        startDate:
          type: string
          format: date
          description: Date from which the contract is effective
          example: "2025-01-01"
        endDate:
          type: ["string", "null"]
          format: date
          description: Date until which the contract is effective, or null for an open-ended contract
          example: "2025-12-31"
      required:
        - jobRoleId
        - totalWeekHours
        - startDate
        - endDate

    ContractEndDateUpdateRequestDTO:
      type: object
      additionalProperties: false
      description: End date supplied when updating a contract. All other contract terms are immutable after creation.
      properties:
        endDate:
          type: ["string", "null"]
          format: date
          description: Inclusive contract end date, or null to reopen the contract
          example: "2025-07-31"
      required: [endDate]

    ContractAmendmentApplyRequestDTO:
      type: object
      additionalProperties: false
      description: >
        Terms of an amendment. At least one of `totalWeekHours` or `jobRoleId` must differ from the current contract
        (1171). `expectedState` is the state the user saw in the preview; the operation rejects any difference.
        There are no per-shift decisions: published shifts are never changed.
      properties:
        effectiveDate:
          type: string
          format: date
          description: >
            Business-local day the new terms start. Today or later (1169) and within the contract validity, from
            its start date to its end date inclusive (1170). Equal to the contract start date means correcting the
            contract from its first day, keeping the start date.
          example: "2026-12-01"
        totalWeekHours:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 32.0
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          example: 10
        expectedState:
          $ref: '#/components/schemas/ContractAmendmentExpectedStateDTO'
      required: [effectiveDate, expectedState]

    ContractAmendmentExpectedStateDTO:
      type: object
      additionalProperties: false
      description: >
        What the preview showed. Planning `version` is NOT a sufficient guarantee: in the current Main API only
        shift-change operations bump it explicitly, and editing shifts of a planning does not guarantee a bump.
        Therefore the state also carries the readable data of every shift of this person from the effective date
        (`shifts`, including `updatedAt`). On apply, the Main API recalculates the contract `updatedAt`, the planning
        `version`s and the full shift set inside the same transaction and compares all of it: any added, removed or
        modified shift, or a changed planning version or contract, is rejected with 1167 and nothing is written.
        Requirement for the Main API implementation: bump the planning `version` on every shift write that affects a
        PUBLISHED or DRAFT planning; the shift comparison stays as the authoritative check.
      properties:
        contractUpdatedAt:
          type: string
          format: date-time
          example: "2026-11-20T10:00:00Z"
        plannings:
          type: array
          items:
            $ref: '#/components/schemas/ContractAmendmentExpectedPlanningDTO'
        shifts:
          type: array
          description: All scheduled shifts of this person from `effectiveDate` in plannings of any status the preview read
          items:
            $ref: '#/components/schemas/ContractAmendmentExpectedShiftDTO'
      required: [contractUpdatedAt, plannings, shifts]

    ContractAmendmentExpectedShiftDTO:
      type: object
      additionalProperties: false
      description: >
        Data of one scheduled shift of this person as the preview read it from `getPlanning`. Every field is
        compared on apply, so an edit that keeps the id (time window, job role, catalog shift, break or holder) is
        detected even if the planning `version` did not change.
      properties:
        shiftId:
          type: integer
          format: int64
          minimum: 1
          example: 501
        planningId:
          type: integer
          format: int64
          example: 77
        jobRoleId:
          type: integer
          format: int64
          example: 10
        catalogShiftId:
          type: integer
          format: int64
          description: Catalog shift (`ScheduledShiftResponseDTO.shiftId`)
          example: 4
        startAt:
          type: string
          format: date-time
          example: "2026-12-08T08:00:00Z"
        endAt:
          type: string
          format: date-time
          example: "2026-12-08T16:00:00Z"
        breakMinutes:
          type: integer
          minimum: 0
          example: 30
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-20T09:15:00Z"
      required: [shiftId, planningId, jobRoleId, catalogShiftId, startAt, endAt, breakMinutes, updatedAt]

    ContractAmendmentExpectedPlanningDTO:
      type: object
      additionalProperties: false
      properties:
        planningId:
          type: integer
          format: int64
          example: 77
        version:
          type: integer
          format: int64
          example: 4
      required: [planningId, version]

    ContractAmendmentResultDTO:
      type: object
      description: The contract closed by the amendment, when there is one, and the contract with the new terms
      properties:
        closedContract:
          description: Null when `effectiveDate` is the first day of the contract (no earlier segment is created)
          oneOf:
            - $ref: '#/components/schemas/ContractResponseDTO'
            - type: 'null'
        newContract:
          $ref: '#/components/schemas/ContractResponseDTO'
        updatedShiftCount:
          type: integer
          minimum: 0
          description: Number of scheduled shifts whose job role was changed, across all DRAFT plannings from the effective date (current and later weeks). Zero when no planning was written.
          example: 2
      required: [closedContract, newContract, updatedShiftCount]

    BusinessContractResponseDTO:
      type: object
      description: Contract projection for a business date-range query. Validity is inclusive and periods do not overlap per user and business.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the contract
          example: 123
        userId:
          type: integer
          format: int64
          description: Unique identifier of the contracted user
          example: 1
        businessId:
          type: integer
          format: int64
          description: Unique identifier of the business associated with the contract
          example: 101
        jobRoleId:
          type: integer
          format: int64
          description: Job role associated with the contract
          example: 10
        totalWeekHours:
          type: number
          format: double
          description: Number of hours agreed for a working week
          example: 40.0
        startDate:
          type: string
          format: date
          description: Inclusive contract start date
          example: "2025-06-15"
        endDate:
          type: ["string", "null"]
          format: date
          description: Inclusive contract end date, or null for an open-ended contract
          example: "2025-07-03"
        createdAt:
          type: string
          format: date-time
          description: Instant when the contract was created
          example: "2025-06-01T10:15:00+00:00"
        updatedAt:
          type: string
          format: date-time
          description: Instant when the contract was last updated
          example: "2025-06-01T10:15:00+00:00"
      required: [id, userId, businessId, jobRoleId, totalWeekHours, startDate, endDate, createdAt, updatedAt]

    ContractResponseDTO:
      type: object
      description: Contract details for a user in a business. Contract periods are mutually exclusive for that user and business across all job roles.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the contract
          example: 123
        businessId:
          type: integer
          format: int64
          description: Unique identifier of the business associated with the contract
          example: 101
        jobRoleId:
          type: integer
          format: int64
          description: Job role associated with the contract
          example: 10
        totalWeekHours:
          type: number
          format: double
          description: Number of hours agreed for a working week
          example: 40.0
        startDate:
          type: string
          format: date
          description: Date from which the contract is effective
          example: "2025-01-01"
        endDate:
          type: ["string", "null"]
          format: date
          description: Date until which the contract is effective, or null for an open-ended contract
          example: "2025-12-31"
        createdAt:
          type: string
          format: date-time
          description: Instant when the contract was created
          example: "2024-12-20T10:15:00+00:00"
        updatedAt:
          type: string
          format: date-time
          description: Instant when the contract was last updated
          example: "2024-12-20T10:15:00+00:00"
      required:
        - id
        - businessId
        - jobRoleId
        - totalWeekHours
        - startDate
        - endDate
        - createdAt
        - updatedAt

    CurrentUserContractResponseDTO:
      type: object
      description: >
        One contract of the authenticated user, as returned by getCurrentUserContracts.
        Same terms as ContractResponseDTO, plus the job role name. The caller may lack
        TEAM_VIEW, and the job-role catalog requires TEAM_VIEW, so the name is returned
        here. Create, update, getUserContracts and getCurrentUserContract keep
        ContractResponseDTO and do not return the name.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the contract
          example: 123
        businessId:
          type: integer
          format: int64
          description: Unique identifier of the business associated with the contract
          example: 101
        jobRoleId:
          type: integer
          format: int64
          description: Job role associated with the contract
          example: 10
        jobRoleName:
          type: ["string", "null"]
          description: >
            Display name of `jobRoleId`. Always present. Null only when the role has
            no stored name.
          example: Sala
        totalWeekHours:
          type: number
          format: double
          description: Number of hours agreed for a working week
          example: 40.0
        startDate:
          type: string
          format: date
          description: Date from which the contract is effective
          example: "2025-01-01"
        endDate:
          type: ["string", "null"]
          format: date
          description: Date until which the contract is effective, or null for an open-ended contract
          example: "2025-12-31"
        createdAt:
          type: string
          format: date-time
          description: Instant when the contract was created
          example: "2024-12-20T10:15:00+00:00"
        updatedAt:
          type: string
          format: date-time
          description: Instant when the contract was last updated
          example: "2024-12-20T10:15:00+00:00"
      required:
        - id
        - businessId
        - jobRoleId
        - jobRoleName
        - totalWeekHours
        - startDate
        - endDate
        - createdAt
        - updatedAt

    ContractSliceResponseDTO:
      type: object
      description: Slice of contracts without a total-count query
      properties:
        content:
          type: array
          description: Contracts in the requested slice
          items:
            $ref: '#/components/schemas/ContractResponseDTO'
        page:
          type: integer
          format: int32
          minimum: 0
          description: Current page number, zero-based
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          description: Requested page size
          example: 20
        hasNext:
          type: boolean
          description: Whether another slice is available
          example: true
      required:
        - content
        - page
        - size
        - hasNext

    CurrentUserContractSliceResponseDTO:
      type: object
      description: >
        Slice of the authenticated user's contracts, including each job role name,
        without a total-count query. Used only by getCurrentUserContracts.
      properties:
        content:
          type: array
          description: Contracts in the requested slice
          items:
            $ref: '#/components/schemas/CurrentUserContractResponseDTO'
        page:
          type: integer
          format: int32
          minimum: 0
          description: Current page number, zero-based
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          description: Requested page size
          example: 20
        hasNext:
          type: boolean
          description: Whether another slice is available
          example: true
      required:
        - content
        - page
        - size
        - hasNext
