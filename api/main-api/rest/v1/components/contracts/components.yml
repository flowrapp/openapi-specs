components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Zero-based slice number
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Number of contracts in the slice
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    ContractRequestDTO:
      type: object
      description: Contract details supplied when creating or updating a contract. Its date range must not overlap any other contract for the same user and business, regardless of job role.
      properties:
        jobRoleId:
          type: integer
          format: int64
          description: Active job role contracted within the business
          example: 10
        totalWeekHours:
          type: number
          format: double
          description: Number of hours agreed for a working week
          exclusiveMinimum: 0
          example: 40.0
        startDate:
          type: string
          format: date
          description: Date from which the contract is effective
          example: "2025-01-01"
        endDate:
          type: ["string", "null"]
          format: date
          description: Date until which the contract is effective, or null for an open-ended contract
          example: "2025-12-31"
      required:
        - jobRoleId
        - totalWeekHours
        - startDate
        - endDate

    ContractEndDateUpdateRequestDTO:
      type: object
      additionalProperties: false
      description: End date supplied when updating a contract. All other contract terms are immutable after creation.
      properties:
        endDate:
          type: ["string", "null"]
          format: date
          description: Inclusive contract end date, or null to reopen the contract
          example: "2025-07-31"
      required: [endDate]

    ContractAmendmentRequestDTO:
      type: object
      additionalProperties: false
      description: >
        Terms to change from `effectiveDate`. At least one of `totalWeekHours` or `jobRoleId` is required.
        The previous contract closes the day before `effectiveDate`; the new one starts on `effectiveDate`.
      properties:
        effectiveDate:
          type: string
          format: date
          description: Business-local day the new terms start; the previous contract ends the day before
          example: "2026-12-01"
        totalWeekHours:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Hours agreed for a working week from `effectiveDate`; omit to keep the current hours
          example: 32.0
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          description: Active job role of the business from `effectiveDate`; omit to keep the current role
          example: 10
      required: [effectiveDate]

    ContractAmendmentApplyRequestDTO:
      type: object
      additionalProperties: false
      description: The same terms as the preview, plus the fingerprint of that preview and one decision per affected shift.
      properties:
        effectiveDate:
          type: string
          format: date
          example: "2026-12-01"
        totalWeekHours:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 32.0
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          example: 10
        previewFingerprint:
          type: string
          description: Fingerprint returned by the preview of the same request
          example: "3f9c1a0e"
        shiftDecisions:
          type: array
          description: Exactly one decision for each shift listed by the preview
          items:
            $ref: '#/components/schemas/ContractAmendmentShiftDecisionDTO'
      required: [effectiveDate, previewFingerprint, shiftDecisions]

    ContractAmendmentShiftDecisionDTO:
      type: object
      additionalProperties: false
      properties:
        shiftId:
          type: integer
          format: int64
          minimum: 1
          example: 501
        action:
          type: string
          enum: [KEEP_AND_NOTIFY, UNASSIGN, ADJUST_DRAFT]
          description: >
            KEEP_AND_NOTIFY keeps a shift (any status) and notifies the person. UNASSIGN removes this person
            from the shift so it can be reassigned; allowed for PUBLISHED and DRAFT shifts. ADJUST_DRAFT applies
            to DRAFT shifts only.
          example: KEEP_AND_NOTIFY
      required: [shiftId, action]

    ContractAmendmentTermsDTO:
      type: object
      description: Contract terms as they would be (proposed) or are (current)
      properties:
        jobRoleId:
          type: integer
          format: int64
          example: 10
        jobRoleName:
          type: ["string", "null"]
          example: Cocina
        totalWeekHours:
          type: number
          format: double
          example: 40.0
      required: [jobRoleId, jobRoleName, totalWeekHours]

    ContractAmendmentAffectedShiftDTO:
      type: object
      description: A scheduled shift of this person on or after the effective date
      properties:
        shiftId:
          type: integer
          format: int64
          example: 501
        planningId:
          type: integer
          format: int64
          example: 77
        date:
          type: string
          format: date
          example: "2026-12-02"
        startAt:
          type: string
          format: date-time
          example: "2026-12-02T09:00:00+01:00"
        endAt:
          type: string
          format: date-time
          example: "2026-12-02T17:00:00+01:00"
        status:
          type: string
          enum: [PUBLISHED, DRAFT]
        jobRoleId:
          type: integer
          format: int64
          example: 10
      required: [shiftId, planningId, date, startAt, endAt, status, jobRoleId]

    ContractAmendmentPreviewDTO:
      type: object
      description: Impact of an amendment. Read-only; nothing is saved.
      properties:
        effectiveDate:
          type: string
          format: date
          example: "2026-12-01"
        previousContractEndDate:
          type: string
          format: date
          example: "2026-11-30"
        current:
          $ref: '#/components/schemas/ContractAmendmentTermsDTO'
        proposed:
          $ref: '#/components/schemas/ContractAmendmentTermsDTO'
        affectedShifts:
          type: array
          items:
            $ref: '#/components/schemas/ContractAmendmentAffectedShiftDTO'
        exceedsPlannedHours:
          type: boolean
          description: True when the proposed weekly hours are below the hours already planned for some week from the effective date. Informational only.
          example: false
        previewFingerprint:
          type: string
          description: Changes when the contract or any affected planning changes. Send it back when applying.
          example: "3f9c1a0e"
        expiresAt:
          type: string
          format: date-time
          description: After this instant the preview must be recalculated
          example: "2026-11-22T20:00:00Z"
      required: [effectiveDate, previousContractEndDate, current, proposed, affectedShifts, exceedsPlannedHours, previewFingerprint, expiresAt]

    ContractAmendmentResultDTO:
      type: object
      description: The contract closed by the amendment and the one that replaces it
      properties:
        closedContract:
          $ref: '#/components/schemas/ContractResponseDTO'
        newContract:
          $ref: '#/components/schemas/ContractResponseDTO'
        appliedShiftCount:
          type: integer
          minimum: 0
          example: 2
      required: [closedContract, newContract, appliedShiftCount]

    BusinessContractResponseDTO:
      type: object
      description: Contract projection for a business date-range query. Validity is inclusive and periods do not overlap per user and business.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the contract
          example: 123
        userId:
          type: integer
          format: int64
          description: Unique identifier of the contracted user
          example: 1
        businessId:
          type: integer
          format: int64
          description: Unique identifier of the business associated with the contract
          example: 101
        jobRoleId:
          type: integer
          format: int64
          description: Job role associated with the contract
          example: 10
        totalWeekHours:
          type: number
          format: double
          description: Number of hours agreed for a working week
          example: 40.0
        startDate:
          type: string
          format: date
          description: Inclusive contract start date
          example: "2025-06-15"
        endDate:
          type: ["string", "null"]
          format: date
          description: Inclusive contract end date, or null for an open-ended contract
          example: "2025-07-03"
        createdAt:
          type: string
          format: date-time
          description: Instant when the contract was created
          example: "2025-06-01T10:15:00+00:00"
        updatedAt:
          type: string
          format: date-time
          description: Instant when the contract was last updated
          example: "2025-06-01T10:15:00+00:00"
      required: [id, userId, businessId, jobRoleId, totalWeekHours, startDate, endDate, createdAt, updatedAt]

    ContractResponseDTO:
      type: object
      description: Contract details for a user in a business. Contract periods are mutually exclusive for that user and business across all job roles.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the contract
          example: 123
        businessId:
          type: integer
          format: int64
          description: Unique identifier of the business associated with the contract
          example: 101
        jobRoleId:
          type: integer
          format: int64
          description: Job role associated with the contract
          example: 10
        totalWeekHours:
          type: number
          format: double
          description: Number of hours agreed for a working week
          example: 40.0
        startDate:
          type: string
          format: date
          description: Date from which the contract is effective
          example: "2025-01-01"
        endDate:
          type: ["string", "null"]
          format: date
          description: Date until which the contract is effective, or null for an open-ended contract
          example: "2025-12-31"
        createdAt:
          type: string
          format: date-time
          description: Instant when the contract was created
          example: "2024-12-20T10:15:00+00:00"
        updatedAt:
          type: string
          format: date-time
          description: Instant when the contract was last updated
          example: "2024-12-20T10:15:00+00:00"
      required:
        - id
        - businessId
        - jobRoleId
        - totalWeekHours
        - startDate
        - endDate
        - createdAt
        - updatedAt

    CurrentUserContractResponseDTO:
      type: object
      description: >
        One contract of the authenticated user, as returned by getCurrentUserContracts.
        Same terms as ContractResponseDTO, plus the job role name. The caller may lack
        TEAM_VIEW, and the job-role catalog requires TEAM_VIEW, so the name is returned
        here. Create, update, getUserContracts and getCurrentUserContract keep
        ContractResponseDTO and do not return the name.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the contract
          example: 123
        businessId:
          type: integer
          format: int64
          description: Unique identifier of the business associated with the contract
          example: 101
        jobRoleId:
          type: integer
          format: int64
          description: Job role associated with the contract
          example: 10
        jobRoleName:
          type: ["string", "null"]
          description: >
            Display name of `jobRoleId`. Always present. Null only when the role has
            no stored name.
          example: Sala
        totalWeekHours:
          type: number
          format: double
          description: Number of hours agreed for a working week
          example: 40.0
        startDate:
          type: string
          format: date
          description: Date from which the contract is effective
          example: "2025-01-01"
        endDate:
          type: ["string", "null"]
          format: date
          description: Date until which the contract is effective, or null for an open-ended contract
          example: "2025-12-31"
        createdAt:
          type: string
          format: date-time
          description: Instant when the contract was created
          example: "2024-12-20T10:15:00+00:00"
        updatedAt:
          type: string
          format: date-time
          description: Instant when the contract was last updated
          example: "2024-12-20T10:15:00+00:00"
      required:
        - id
        - businessId
        - jobRoleId
        - jobRoleName
        - totalWeekHours
        - startDate
        - endDate
        - createdAt
        - updatedAt

    ContractSliceResponseDTO:
      type: object
      description: Slice of contracts without a total-count query
      properties:
        content:
          type: array
          description: Contracts in the requested slice
          items:
            $ref: '#/components/schemas/ContractResponseDTO'
        page:
          type: integer
          format: int32
          minimum: 0
          description: Current page number, zero-based
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          description: Requested page size
          example: 20
        hasNext:
          type: boolean
          description: Whether another slice is available
          example: true
      required:
        - content
        - page
        - size
        - hasNext

    CurrentUserContractSliceResponseDTO:
      type: object
      description: >
        Slice of the authenticated user's contracts, including each job role name,
        without a total-count query. Used only by getCurrentUserContracts.
      properties:
        content:
          type: array
          description: Contracts in the requested slice
          items:
            $ref: '#/components/schemas/CurrentUserContractResponseDTO'
        page:
          type: integer
          format: int32
          minimum: 0
          description: Current page number, zero-based
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          description: Requested page size
          example: 20
        hasNext:
          type: boolean
          description: Whether another slice is available
          example: true
      required:
        - content
        - page
        - size
        - hasNext
