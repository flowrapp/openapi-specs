components:
  schemas:
    RegisterUserFromInvitationRequestDTO:
      type: object
      description: Registration details for a new user who received an invitation
      properties:
        username:
          type: string
          description: Username for the new user
          example: "johndoe"
        phone:
          type: string
          description: >
            Phone number in E.164 (`^\+[1-9][0-9]{6,14}$`). The server does not
            infer a country prefix. A value that does not match is 400 1161 and
            the message does not echo it. Not unique across users.
          minLength: 8
          maxLength: 16
          pattern: '^\+[1-9][0-9]{6,14}$'
          example: "+34612345678"
      required:
        - username
        - phone

    InvitationRequestDTO:
      type: object
      description: Request to invite a user to a business
      properties:
        email:
          type: string
          description: Email address of the invitee
          example: "invitee@example.com"
        role:
          type: string
          description: Role to assign to the invitee
          enum: [OWNER, EMPLOYEE]
          example: "OWNER"
        contract:
          oneOf:
            - $ref: '../contracts/components.yml#/components/schemas/ContractRequestDTO'
            - type: 'null'
          description: Optional contract proposal. When absent, acceptance creates a 40-hour GENERAL job contract.
        identityDocument:
          description: >
            Optional identity document for this membership. Omit it or send null
            to invite without one. Only the OWNER may send a document: a caller
            who is not the OWNER and sends a non-null document receives 403 1020
            (`user is not the owner of business`), even with `TEAM_INVITE`.
            Creating the invitation still requires `TEAM_INVITE`. The document is
            stored with the invitation and is not returned on
            `InvitationResponseDTO`. Accept copies it onto the membership in the
            same transaction and then clears it on the invitation. If the
            membership already has a document and the invitation brings one, the
            invitation wins; if the invitation has none, the membership document
            is kept. If acceptance races with another active membership that
            already has the same document, acceptance still succeeds, the
            membership is stored without the document, and the drop is audited
            without the number. Decline clears it. Revoke deletes the row.
            The document is deleted as soon as the invitation expires
            (`expires_at` in the past). There is no retention period. A resend
            after expiry therefore comes back without a document. A resend
            before expiry keeps it.
          oneOf:
            - $ref: '../personalData/components.yml#/components/schemas/IdentityDocumentRequestDTO'
            - type: 'null'
      required:
        - email
        - role

    InvitationResponseDTO:
      type: object
      description: Response containing invitation details. The identity document is never included.
      properties:
        id:
          type: integer
          description: Unique identifier for the invitation
          example: 123
        businessId:
          type: integer
          description: Unique identifier of the business issuing the invitation
          example: 101
        businessName:
          type: string
          description: Name of the business issuing the invitation
          example: "Coffee Time"
        email:
          type: string
          description: Email address of the invitee
          example: "invitee@example.com"
        role:
          type: string
          description: Role assigned to the invitee
          enum: [OWNER, EMPLOYEE]
          example: "EMPLOYEE"
        contract:
          oneOf:
            - $ref: '../contracts/components.yml#/components/schemas/ContractRequestDTO'
            - type: 'null'
          description: Proposed contract, or null when the default GENERAL contract will be created on acceptance
        status:
          type: string
          description: Status of the invitation
          enum: [PENDING, ACCEPTED, DECLINED, EXPIRED]
          example: "PENDING"
        createdAt:
          type: string
          format: date-time
          description: Date and time when the invitation was created
          example: "2023-06-15T14:30:00+00:00"
        expiresAt:
          type: string
          format: date-time
          description: Date and time when the invitation expires
          example: "2023-06-22T14:30:00+00:00"
      required:
        - id
        - businessId
        - businessName
        - email
        - role
        - contract
        - status
        - createdAt
        - expiresAt
