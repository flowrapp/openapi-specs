components:
  schemas:
    RegisterUserFromInvitationRequestDTO:
      type: object
      description: Registration details for a new user who received an invitation
      properties:
        username:
          type: string
          description: Username for the new user
          example: "johndoe"
        phone:
          type: string
          description: Phone number of the user
          maxLength: 15
          example: "+1234567890"
        password:
          type: string
          description: Password for the new user
          format: password
          example: "securePassword123"
      required:
        - username
        - phone
        - password

    InvitationRequestDTO:
      type: object
      description: Request to invite a user to a business
      properties:
        email:
          type: string
          description: Email address of the invitee
          example: "invitee@example.com"
        role:
          type: string
          description: Role to assign to the invitee
          enum: [OWNER, MANAGER, EMPLOYEE]
          example: "OWNER"
        contract:
          oneOf:
            - $ref: '../contracts/components.yml#/components/schemas/ContractRequestDTO'
            - type: 'null'
          description: Optional contract proposal. When absent, acceptance creates a 40-hour GENERAL job contract.
      required:
        - email
        - role

    InvitationResponseDTO:
      type: object
      description: Response containing invitation details
      properties:
        id:
          type: integer
          description: Unique identifier for the invitation
          example: 123
        businessId:
          type: integer
          description: Unique identifier of the business issuing the invitation
          example: 101
        businessName:
          type: string
          description: Name of the business issuing the invitation
          example: "Coffee Time"
        email:
          type: string
          description: Email address of the invitee
          example: "invitee@example.com"
        role:
          type: string
          description: Role assigned to the invitee
          enum: [OWNER, MANAGER, EMPLOYEE]
          example: "MANAGER"
        contract:
          oneOf:
            - $ref: '../contracts/components.yml#/components/schemas/ContractRequestDTO'
            - type: 'null'
          description: Proposed contract, or null when the default GENERAL contract will be created on acceptance
        status:
          type: string
          description: Status of the invitation
          enum: [PENDING, ACCEPTED, DECLINED, EXPIRED]
          example: "PENDING"
        createdAt:
          type: string
          format: date-time
          description: Date and time when the invitation was created
          example: "2023-06-15T14:30:00+00:00"
        expiresAt:
          type: string
          format: date-time
          description: Date and time when the invitation expires
          example: "2023-06-22T14:30:00+00:00"
        lastSentAt:
          type: string
          format: date-time
          description: >
            When the invitation email was last queued: `createdAt` until the first
            resend, then the time of the latest accepted `resendBusinessInvitation`.
            Always returned, not listed as required.
          example: "2023-06-15T14:30:00+00:00"
        nextResendAllowedAt:
          type: [string, "null"]
          format: date-time
          description: >
            Earliest instant at which `resendBusinessInvitation` is accepted for this
            invitation (`lastSentAt` plus the 10-minute cooldown). Null when the status is
            not PENDING, because such an invitation can never be resent. A value in the past
            means the resend is available now. Always returned, not listed as required.
          example: "2023-06-15T14:40:00+00:00"
      required:
        - id
        - businessId
        - businessName
        - email
        - role
        - contract
        - status
        - createdAt
        - expiresAt
