components:
  schemas:
    PushTokenRequestDTO:
      description: Request to register or update push notifications for a device
      allOf:
        - $ref: '#/components/schemas/PushTokenDetailsDTO'
        - type: object
          properties:
            deviceId:
              type: string
              description: Stable app-installation identifier; must match the session only when the bearer token has device binding; legacy authentication remains supported
              example: "uuid-of-device"
          required:
            - deviceId
    PushTokenDetailsDTO:
      type: object
      description: Push token and platform, optionally supplied during authentication; a token must be associated with only one user at a time
      properties:
        token:
          type: string
          description: The push notification token
          example: "abcdef123456"
        platform:
          type: string
          description: The device platform
          enum: [ANDROID, IOS]
          example: "ANDROID"
      required:
        - token
        - platform
