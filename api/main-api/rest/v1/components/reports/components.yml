components:
  schemas:
    ReportResponseDTO:
      type: object
      description: Daily time report for a user at a business. Each record represents the total worked seconds for a single user on a single calendar day.
      properties:
        userId:
          type: integer
          format: int64
          description: ID of the user
          example: 12
        businessId:
          type: integer
          format: int64
          description: ID of the business
          example: 123
        day:
          type: string
          format: date
          description: The calendar date of this report
          example: "2025-07-28"
        seconds:
          type: integer
          format: int64
          description: >
            Total worked seconds for this user on this day. Only worklogs in
            CONFIRMED or APPROVED are included. PENDING_RECONCILIATION is excluded
            until attendance reconciliation moves the worklog to CONFIRMED or
            PENDING_REVIEW.
          example: 32040
      required:
        - userId
        - businessId
        - day
        - seconds

    WorkedHoursReportPeriodTypeDTO:
      type: string
      description: |
        Period type of a worked-hours report. It selects the report layout (title, grouping and
        subtotals) and how from and to are validated. from and to are calendar days in the
        business time zone, both inclusive.
        - MONTH: from and to must cover exactly one calendar month (from is the first day and to
          is the last day of the same month).
        - YEAR: from and to must cover exactly one calendar year (from is January 1 and to is
          December 31 of the same year).
        - RANGE: any from and to with from on or before to, exactly as before this field existed.
        When omitted, RANGE is used. Nothing is inferred from the dates.
        If from and to do not match the period type, the request fails with 400.
      enum: [MONTH, YEAR, RANGE]
      default: RANGE
      example: MONTH
