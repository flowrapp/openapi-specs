components:
  schemas:
    ReportResponseDTO:
      type: object
      description: Daily time report for a user at a business. Each record represents the total worked seconds for a single user on a single calendar day.
      properties:
        userId:
          type: integer
          format: int64
          description: ID of the user
          example: 12
        businessId:
          type: integer
          format: int64
          description: ID of the business
          example: 123
        day:
          type: string
          format: date
          description: Business-local calendar date of this report. A worklog counts on the business-local date of its clock-in.
          example: "2025-07-28"
        seconds:
          type: integer
          format: int64
          description: >
            Total worked seconds for this user on this day, net of effective
            breaks. By default only worklogs in CONFIRMED or APPROVED are
            included. PENDING_RECONCILIATION is excluded until attendance
            reconciliation moves the worklog to CONFIRMED or PENDING_REVIEW.
            When getBusinessReports receives reviewStatus, only worklogs in the
            requested states are included.
          example: 32040
      required:
        - userId
        - businessId
        - day
        - seconds
