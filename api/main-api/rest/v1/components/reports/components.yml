components:
  schemas:
    ReportResponseDTO:
      type: object
      description: Daily time report for a user at a business. Each record represents the total worked seconds for a single user on a single calendar day.
      properties:
        userId:
          type: integer
          format: int64
          description: ID of the user
          example: 12
        businessId:
          type: integer
          format: int64
          description: ID of the business
          example: 123
        day:
          type: string
          format: date
          description: Business-local calendar date of this report. A worklog counts on the business-local date of its clock-in.
          example: "2025-07-28"
        seconds:
          type: integer
          format: int64
          description: >
            Total worked seconds for this user on this day, net of effective
            breaks. By default only worklogs in CONFIRMED or APPROVED are
            included. PENDING_RECONCILIATION is excluded until attendance
            reconciliation moves the worklog to CONFIRMED or PENDING_REVIEW.
            When getBusinessReports or getUserReports receives reviewStatus,
            only worklogs in the requested states are included. REJECTED may
            be requested on getUserReports; the worker history totals do not
            request it.
          example: 32040
      required:
        - userId
        - businessId
        - day
        - seconds

    WorkedHoursReportPeriodTypeDTO:
      type: string
      description: |
        Period type of a worked-hours report. It selects the report layout (title, grouping and
        subtotals) and how from and to are validated. from and to are calendar days in the
        business time zone, both inclusive.
        - MONTH: from and to must cover exactly one calendar month (from is the first day and to
          is the last day of the same month).
        - YEAR: from and to must cover exactly one complete calendar year (from is January 1 and
          to is December 31 of the same year). Fiscal or rolling 12-month years are not supported.
        - RANGE: any from and to with from on or before to, exactly as before this field existed.
        For every period type, the period may end after today: send the full period (for example
        MONTH 2026-11-01 to 2026-11-30, or YEAR 2026-01-01 to 2026-12-31) and the server truncates
        the effective end to today in the business time zone. A period whose from is after today
        is rejected with 400.
        When omitted, RANGE is used. Nothing is inferred from the dates.
        If from and to do not match the period type, the request fails with 400 and functional code 1114 (REPORT_PERIOD_TYPE_MISMATCH).
      enum: [MONTH, YEAR, RANGE]
      default: RANGE
      example: MONTH

    CurrentUserWorkedHoursMonthsResponseDTO:
      type: object
      description: |
        One page of the caller's own monthly worked-hours summary in one business, newest month first.
        Always the authenticated user; there is no user parameter.
      properties:
        zone:
          type: string
          description: IANA time zone of the business. Months, days and today are calendar values in this zone.
          example: Europe/Madrid
        today:
          type: string
          format: date
          description: Today in the business time zone, from the server clock
          example: "2026-11-11"
        months:
          type: array
          description: |
            Consecutive calendar months, newest first, with no gaps: a month without worklogs is listed with
            hasWorklogs false and zero seconds. Without `before`, the first item is always the current month, even
            when it has no worklogs. The list covers at most the 12 most recent months (the current month and the
            11 before it) and never goes back past the caller's first month in the business (the earliest of the
            membership `joinedAt` and the first worklog clock-in, in the business time zone), whichever is later.
            Empty when `before` is on or before the oldest month of that range.
          items:
            $ref: '#/components/schemas/CurrentUserWorkedHoursMonthDTO'
        nextBefore:
          type:
            - string
            - 'null'
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Send it as `before` to read the next (older) page. It is the month of the last item when older months remain inside the 12-month window and on or after the first month; null otherwise.
          example: "2025-12"
      required: [zone, today, months, nextBefore]

    CurrentUserWorkedHoursMonthDTO:
      type: object
      description: |
        Totals of one calendar month for the caller. Worklogs are attributed to the business-local date of their
        clock-in, and seconds are net of effective closed breaks (`reportableSeconds`), the same attribution and
        rule as the worked-hours PDF. Open worklogs and REJECTED worklogs are in neither figure.
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Calendar month (YYYY-MM)
          example: "2026-10"
        inProgress:
          type: boolean
          description: True for the current month in the business time zone
          example: false
        effectiveTo:
          type: string
          format: date
          description: Last day covered, the last day of the month, or today for the current month. Same effective end as the monthly PDF.
          example: "2026-10-31"
        confirmedSeconds:
          type: integer
          format: int64
          minimum: 0
          description: |
            Closed worklogs whose reviewStatus is CONFIRMED or APPROVED. Equals the month total of
            exportCurrentUserWorkedHoursReportPdf for the same month; the server computes both with the same queries and domain rule.
          example: 561600
        pendingSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Closed worklogs whose reviewStatus is PENDING_REVIEW or PENDING_RECONCILIATION. Not included in confirmedSeconds. Always present; 0 when nothing is pending.
          example: 15300
        pendingCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of the closed worklogs counted in pendingSeconds
          example: 2
        hasWorklogs:
          type: boolean
          description: True when the caller has at least one worklog with its clock-in in this month, in any review status, open ones included
          example: true
      required: [month, inProgress, effectiveTo, confirmedSeconds, pendingSeconds, pendingCount, hasWorklogs]

    WorkedHoursReportTypeDTO:
      type: string
      description: |
        Output format of a worked-hours report download. Both formats cover the same period, the same people
        and the same counting rules; the PDF month total equals the sum of «Horas netas» over the CSV rows with
        «Cuenta en el total» = Sí, up to the per-row rounding described below.
        - PDF (default): the registro de jornada PDF (`application/pdf`).
        - CSV: a text file for Excel in Spanish (`text/csv; charset=utf-8`):
          - Encoding UTF-8 with a byte order mark (EF BB BF), so Excel detects it. Separator `;`. Line endings CRLF.
            Decimal comma.
          - The first line is the header, in Spanish and in this order:
            `Persona;ID persona;Puesto;Fecha;Entrada;Salida;Salida día siguiente;Pausas (min);Horas netas;Duración;Estado;Cuenta en el total`
          - One row per closed worklog (clock-out set) of the people in scope whose clock-in falls in the period
            (business time zone), in CONFIRMED, APPROVED, PENDING_REVIEW or PENDING_RECONCILIATION. REJECTED and
            open worklogs are not listed. No total or subtotal rows. A period without such worklogs returns the
            header line only.
          - Rows ordered by person (name ignoring case, then user id), then date, then clock-in.
          - Persona: display name with the PDF rule (`Persona #<id>` when the name is empty or looks like an
            email). The email is never written.
          - ID persona: user id, to tell apart people with the same name.
          - Puesto: name of the job role of the person's contract in force on that date, or empty.
          - Fecha: business-local date of the clock-in, `dd/MM/yyyy` (the PDF day attribution).
          - Entrada, Salida: `HH:mm`, business-local.
          - Salida día siguiente: `Sí` when the clock-out falls on a later business-local date than the
            clock-in, otherwise `No`.
          - Pausas (min): whole minutes of the effective closed breaks of the worklog, truncated.
          - Duración: net time (clock-out − clock-in − effective closed breaks, truncated to the minute) as
            `H:MM`, the PDF format (e.g. `7:45`).
          - Horas netas: the same truncated net minutes divided by 60, two decimals rounded half up, decimal
            comma (e.g. `7,75`).
          - Estado: `Confirmado`, `Aprobado`, `Pendiente de revisión` or `Pendiente de conciliación` (the PDF
            wording).
          - Cuenta en el total: `Sí` for CONFIRMED and APPROVED, `No` for PENDING_REVIEW and
            PENDING_RECONCILIATION.
          - Quoting (RFC 4180): a field is enclosed in double quotes only when it contains `;`, `"`, CR or LF;
            an inner double quote is doubled.
          - Formula protection (CSV injection): a text field (Persona, Puesto) that starts with `=`, `+`, `-`,
            `@`, TAB or CR is written with a leading apostrophe (`'`). Generated numeric, date and time columns
            are never prefixed.
          - Instants are converted to business-local dates and times in the server code with the business
            ZoneId, not in SQL.
        Any other value returns 400 (1103).
      enum: [PDF, CSV]
      default: PDF
      example: CSV

    BusinessWorkedHoursMonthsResponseDTO:
      type: object
      description: |
        One page of the monthly worked-hours totals of a business, newest month first, for the owner reports
        screen. Same shape as CurrentUserWorkedHoursMonthsResponseDTO, with the scope of the request (the whole
        business or the requested people) instead of the caller, plus oldestMonth and peopleCount.
      properties:
        zone:
          type: string
          description: IANA time zone of the business. Months, days and today are calendar values in this zone.
          example: Europe/Madrid
        today:
          type: string
          format: date
          description: Today in the business time zone, from the server clock
          example: "2026-11-12"
        oldestMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: |
            Oldest month the list can reach for this scope: the later of the first month of the window (at most
            48 months: the current month and the 47 before it) and the first month of the scope (see
            getBusinessWorkedHoursMonths). The client shows «No hay meses anteriores a …» with it.
          example: "2025-03"
        months:
          type: array
          description: |
            Consecutive calendar months, newest first, with no gaps: a month without worklogs is listed with
            hasWorklogs false, peopleCount 0 and zero seconds. Without `before`, the first item is always the
            current month, even when it has no worklogs. Never older than oldestMonth. Empty when `before` is on
            or before oldestMonth.
          items:
            $ref: '#/components/schemas/BusinessWorkedHoursMonthDTO'
        nextBefore:
          type:
            - string
            - 'null'
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Send it as `before` to read the next (older) page. It is the month of the last item when that month is after oldestMonth; null otherwise.
          example: "2025-11"
      required: [zone, today, oldestMonth, months, nextBefore]

    BusinessWorkedHoursMonthDTO:
      type: object
      description: |
        Totals of one calendar month for the people in scope, summed over them. Worklogs are attributed to the
        business-local date of their clock-in, and seconds are net of effective closed breaks, the same
        attribution and rule as the worked-hours PDF. Open and REJECTED worklogs are in neither figure.
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Calendar month (YYYY-MM)
          example: "2026-10"
        inProgress:
          type: boolean
          description: True for the current month in the business time zone. Its PDF and CSV are provisional (up to today).
          example: false
        effectiveTo:
          type: string
          format: date
          description: Last day covered, the last day of the month, or today for the current month. Same effective end as the monthly PDF and CSV.
          example: "2026-10-31"
        confirmedSeconds:
          type: integer
          format: int64
          minimum: 0
          description: |
            Closed worklogs whose reviewStatus is CONFIRMED or APPROVED. Equals the total of
            exportBusinessWorkedHoursReportPdf with periodType MONTH for the same month and the same userIds; the
            server computes both with the same queries and domain rule. The materialized reports table is not read.
          example: 4624200
        pendingSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Closed worklogs whose reviewStatus is PENDING_REVIEW or PENDING_RECONCILIATION. Not included in confirmedSeconds. Always present; 0 when nothing is pending.
          example: 130500
        pendingCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of the closed worklogs counted in pendingSeconds
          example: 14
        hasWorklogs:
          type: boolean
          description: True when someone in scope has at least one worklog with its clock-in in this month, in any review status, open ones included. Equals peopleCount > 0.
          example: true
        peopleCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of the people in scope with at least one worklog whose clock-in is in this month, in any review status, open ones included
          example: 8
        archive:
          $ref: '#/components/schemas/WorkedHoursMonthArchiveDTO'
      required: [month, inProgress, effectiveTo, confirmedSeconds, pendingSeconds, pendingCount, hasWorklogs, peopleCount]

    WorkedHoursMonthArchiveDTO:
      type: object
      description: |
        Reserved for the 4-year retention of the registro de jornada (art. 34.9 ET), which is not approved for
        implementation. Not returned in this version: clients must accept its absence and ignore it. When retention
        exists it will describe the sealed copy of a closed month (stored PDF with its hash); until then every PDF
        and CSV is generated on demand from the current data.
      properties:
        status:
          type: string
          enum: [SEALED]
          description: SEALED when a sealed copy of the closed month exists
          example: SEALED
        version:
          type: integer
          format: int32
          minimum: 1
          description: Version of the sealed copy; a correction of a closed month adds a new version
          example: 1
        sealedAt:
          type: string
          format: date-time
          description: Instant the version was sealed
          example: "2026-11-01T02:00:00Z"
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the sealed file, lowercase hexadecimal
          example: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
      required: [status, version, sealedAt, sha256]

    BusinessWorkedHoursPeopleResponseDTO:
      type: object
      description: People that can be picked in the owner reports selector, current and former members
      properties:
        people:
          type: array
          description: Ordered by name ignoring case, then userId. Current and former members together; removedAt tells them apart.
          items:
            $ref: '#/components/schemas/BusinessWorkedHoursPersonDTO'
      required: [people]

    BusinessWorkedHoursPersonDTO:
      type: object
      description: One person of the business for the reports selector. No email and no contract detail.
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 103
        name:
          type: string
          description: Display name with the PDF rule (`Persona #<id>` when the name is empty or looks like an email)
          example: Lucía Ruiz
        jobRoleName:
          type:
            - string
            - 'null'
          description: Job role of the contract in force today in the business time zone; null without one, and always null for a removed member
          example: Sala
        joinedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Instant the membership started, or null when unknown
          example: "2026-07-01T07:00:00Z"
        removedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Instant the person was removed from the business; null for a current member. The app lists people with removedAt in the section «Ya no están en el negocio».
          example: null
      required: [userId, name, jobRoleName, joinedAt, removedAt]
