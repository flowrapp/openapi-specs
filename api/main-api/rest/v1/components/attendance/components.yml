components:
  schemas:
    AttendanceMatchKindDTO:
      type: string
      description: Current structural result of matching one worklog to published scheduling.
      enum: [NOT_APPLICABLE, MATCHED, UNSCHEDULED, AMBIGUOUS]
      example: MATCHED

    AttendanceMatchOriginDTO:
      type: string
      description: Origin of the current attendance-match decision.
      enum: [AUTOMATIC, MANAGEMENT]
      example: AUTOMATIC

    ReconciliationStateDTO:
      type: string
      description: Whether asynchronous attendance incident reconciliation has caught up with current source data.
      enum: [PENDING, READY]
      example: READY

    AttendanceReconciliationDTO:
      type: object
      description: Current reconciliation watermark for an attendance match.
      properties:
        state:
          $ref: '#/components/schemas/ReconciliationStateDTO'
        sourceRevision:
          type: [string, 'null']
          minLength: 1
          description: Opaque SHA-256 source revision when state is READY, otherwise null.
          example: 4f8f1f6f3a1d5f2e7c9e5c0b6f2a8a7f6d4e1c9b8a7f6e5d4c3b2a1908171615
        reconciledAt:
          type: [string, 'null']
          format: date-time
          description: Time when this source revision was reconciled, otherwise null.
          example: '2025-07-29T17:31:00+02:00'
      required: [state, sourceRevision, reconciledAt]

    AttendanceMatchBaseDTO:
      type: object
      description: Fields common to every attendance-match variant.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 700
        worklogId:
          type: integer
          format: int64
          minimum: 1
          example: 123
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 3
        origin:
          $ref: '#/components/schemas/AttendanceMatchOriginDTO'
        reconciliation:
          $ref: '#/components/schemas/AttendanceReconciliationDTO'
        version:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic-lock version of the current match.
          example: 0
        createdAt:
          type: string
          format: date-time
          example: '2025-07-29T08:30:01+02:00'
        updatedAt:
          type: string
          format: date-time
          example: '2025-07-29T08:30:01+02:00'
      required: [id, worklogId, businessId, userId, origin, reconciliation, version, createdAt, updatedAt]

    AttendanceMatchNotApplicableDTO:
      allOf:
        - $ref: '#/components/schemas/AttendanceMatchBaseDTO'
        - type: object
          properties:
            kind:
              type: string
              enum: [NOT_APPLICABLE]
              example: NOT_APPLICABLE
          required: [kind]

    AttendanceMatchMatchedDTO:
      allOf:
        - $ref: '#/components/schemas/AttendanceMatchBaseDTO'
        - type: object
          properties:
            kind:
              type: string
              enum: [MATCHED]
              example: MATCHED
            scheduledShift:
              $ref: '../scheduling/components.yml#/components/schemas/ScheduledShiftResponseDTO'
          required: [kind, scheduledShift]

    AttendanceMatchUnscheduledDTO:
      allOf:
        - $ref: '#/components/schemas/AttendanceMatchBaseDTO'
        - type: object
          properties:
            kind:
              type: string
              enum: [UNSCHEDULED]
              example: UNSCHEDULED
          required: [kind]

    AttendanceMatchAmbiguousDTO:
      allOf:
        - $ref: '#/components/schemas/AttendanceMatchBaseDTO'
        - type: object
          properties:
            kind:
              type: string
              enum: [AMBIGUOUS]
              example: AMBIGUOUS
            candidateShifts:
              type: array
              minItems: 2
              description: Every plausible published shift observed by the matcher. Candidates remain after resolution.
              items:
                $ref: '../scheduling/components.yml#/components/schemas/ScheduledShiftResponseDTO'
          required: [kind, candidateShifts]

    AttendanceMatchDTO:
      type: object
      description: Wire representation of one sealed AttendanceMatch variant. The kind discriminator determines which variant payload is populated.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 700
        worklogId:
          type: integer
          format: int64
          minimum: 1
          example: 123
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 3
        kind:
          $ref: '#/components/schemas/AttendanceMatchKindDTO'
        origin:
          $ref: '#/components/schemas/AttendanceMatchOriginDTO'
        scheduledShift:
          oneOf:
            - $ref: '../scheduling/components.yml#/components/schemas/ScheduledShiftResponseDTO'
            - type: 'null'
        candidateShifts:
          type: array
          description: Retained candidates for an AMBIGUOUS match; empty for other kinds.
          items:
            $ref: '../scheduling/components.yml#/components/schemas/ScheduledShiftResponseDTO'
        reconciliation:
          $ref: '#/components/schemas/AttendanceReconciliationDTO'
        incidents:
          type: array
          description: >
            Match-scoped attendance incidents of this worklog. Optional: absent or
            empty when the match has none. Shift-scoped no-shows are not included.
            Only the owner of the worklog can read the match, so this list is that
            worker's own incidents.
          items:
            $ref: '#/components/schemas/AttendanceIncidentDTO'
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, worklogId, businessId, userId, kind, origin, scheduledShift, candidateShifts, reconciliation, version, createdAt, updatedAt]

    ClockInResultDTO:
      type: object
      description: >
        Result of a successful clock-in. `attendanceMatchId` stays required.
        The backend fills it with the attendance match created synchronously for
        the new worklog, including a NOT_APPLICABLE match. The clock-in use case
        does not select the match; the API completes the identifier before it responds.
      properties:
        worklog:
          $ref: '../worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        attendanceMatchId:
          type: integer
          format: int64
          minimum: 1
          description: >
            Identifier of the attendance match created for this worklog.
            The backend always fills it. Clients receive it as a present value.
          example: 700
      required: [worklog, attendanceMatchId]

    AttendanceIncidentTypeDTO:
      type: string
      description: |
        Type of attendance deviation or structural incident.
        On a split shift, early and late entry or exit and a missed segment are
        evaluated per segment (each worklog is matched to the nearest segment).
        `NO_SHOW` is the shift-level incident and is opened only when every
        segment was missed. Missing one segment and working another is an
        absence of that segment, not a shift no-show. This version does not
        auto-close a worklog at the end of a segment; `AUTOMATIC_CLOSE` stays
        the existing 24-hour close.
        AUTOMATIC_CLOSE: the worklog was closed automatically by the system after 24 hours without a clock-out. Its clock-out time is a placeholder and not valid: the worklog does not count in totals or reports until the owner corrects the clock-out or rejects the worklog. While this incident is open the worklog cannot be approved.
        OUTSIDE_GEOFENCE: under the WARN geofencing policy, the clock-in or the clock-out of the worklog was recorded more than 25 m (GPS margin) outside the business area (`distanceMeters > areaMeters + 25`) or without a device location. Scope MATCH, at most one open per worklog, covering both its clock-in and its clock-out; the checks are in `evidence.geofenceChecks`. Only for a worklog whose match is MATCHED, UNSCHEDULED or AMBIGUOUS (the ones attendance shows): with a NOT_APPLICABLE match (no published planning that day) the check is recorded but no incident is opened, so the worklog is not left pending without a place to review it; if the worklog is later rematched to a planning, reconciliation opens it then. It is a normal review: it does not block approval, so accepting the shift attendance or approving the worklog accepts it; a management correction resolves it as CORRECTED, and a rejection resolves it as WORKLOG_REJECTED. Once a person resolves it, it is not reopened. ALLOW never opens it, and BLOCK rejects the clock action instead (403 1100), so neither leaves this incident.
        New values may be added to this enum; clients must tolerate unknown values.
      enum: [EARLY_ENTRY, LATE_ENTRY, EARLY_EXIT, LATE_EXIT, UNEXPLAINED_GAP, UNSCHEDULED_WORK, AMBIGUOUS_MATCH, NO_SHOW, AUTOMATIC_CLOSE, OUTSIDE_GEOFENCE]
      example: LATE_ENTRY

    AttendanceIncidentScopeDTO:
      type: string
      description: Aggregate scope that owns an attendance incident.
      enum: [MATCH, SHIFT]
      example: MATCH

    IncidentResolutionDTO:
      type: string
      description: >
        Terminal resolution of an attendance incident. CORRECTED and
        WORKLOG_REJECTED are not requested on the incident; they are produced
        by the existing worklog correction and rejection routes. Management
        correction reconciliation runs in the same request: incidents no longer
        produced by the corrected data resolve as CORRECTED, or
        NO_LONGER_APPLICABLE when that incident type does not admit CORRECTED.
        Remaining temporal incidents (EARLY_ENTRY, LATE_ENTRY, EARLY_EXIT,
        LATE_EXIT, UNEXPLAINED_GAP) resolve as ACCEPTED by the correcting owner
        with the correction reason. OUTSIDE_GEOFENCE resolves as CORRECTED.
        A worker's own correction does not accept incidents. This contract adds
        no correction or rejection action on the incident.
      enum: [ACCEPTED, CORRECTED, REASSIGNED, WORKLOG_REJECTED, ACKNOWLEDGED, NO_LONGER_APPLICABLE]
      example: ACCEPTED

    IncidentLifecycleDTO:
      type: string
      description: Current incident lifecycle.
      enum: [OPEN, RESOLVED]
      example: OPEN

    AttendanceIncidentEvidenceDTO:
      type: object
      description: Typed evidence captured for the current incident occurrence.
      properties:
        type:
          $ref: '#/components/schemas/AttendanceIncidentTypeDTO'
        measuredSeconds:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Measured deviation for temporal incidents; null for structural, no-show, AUTOMATIC_CLOSE and OUTSIDE_GEOFENCE incidents.
          example: 900
        toleranceSeconds:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Effective business tolerance for temporal incidents; null otherwise.
          example: 300
        candidateShiftIds:
          type: array
          description: Retained plausible shift IDs for an ambiguous match, empty otherwise.
          items:
            type: integer
            format: int64
            minimum: 1
        geofenceChecks:
          type: array
          description: >
            For OUTSIDE_GEOFENCE, every geofence check recorded for the worklog of the match (its clock-in
            and, once closed, its clock-out), ordered by `checkedAt`, including a check that was inside, so
            the reviewer sees both actions. Empty for every other incident type. Always returned, not listed
            as required.
          items:
            $ref: '#/components/schemas/AttendanceGeofenceCheckDTO'
      required: [type, measuredSeconds, toleranceSeconds, candidateShiftIds]

    AttendanceGeofenceCheckActionDTO:
      type: string
      description: Clock action that was checked against the business geofence.
      enum: [CLOCK_IN, CLOCK_OUT]
      example: CLOCK_IN

    AttendanceGeofenceCheckOutcomeDTO:
      type: string
      description: >
        Result of a geofence check. INSIDE: the device location was within the business area plus the
        25 m GPS margin (`distanceMeters <= areaMeters + 25`). OUTSIDE: it was beyond that margin.
        NO_LOCATION: the clock request carried no device location. New values may be added; clients must
        tolerate unknown values.
      enum: [INSIDE, OUTSIDE, NO_LOCATION]
      example: OUTSIDE

    AttendanceGeofenceCheckDTO:
      type: object
      description: >
        Append-only evidence of one geofence check of a clock action under the WARN policy. Only the
        distance and the area radius in force are stored; the device coordinates are never stored or
        returned.
      properties:
        action:
          $ref: '#/components/schemas/AttendanceGeofenceCheckActionDTO'
        outcome:
          $ref: '#/components/schemas/AttendanceGeofenceCheckOutcomeDTO'
        distanceMeters:
          type: [integer, 'null']
          format: int32
          minimum: 0
          description: Distance in whole meters from the device location to the centre of the business area; null for NO_LOCATION.
          example: 340
        areaMeters:
          type: integer
          format: int32
          minimum: 0
          description: Radius in whole meters of the business area when the check was made (it may have changed since).
          example: 100
        checkedAt:
          type: string
          format: date-time
          description: When the check was made (the clock request was processed).
          example: "2026-11-03T08:01:12Z"
      required: [action, outcome, distanceMeters, areaMeters, checkedAt]

    AttendanceIncidentDTO:
      type: object
      description: Auditable current or resolved attendance incident.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 880
        scope:
          $ref: '#/components/schemas/AttendanceIncidentScopeDTO'
        attendanceMatchId:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Match scope identifier; null for shift-scoped incidents.
          example: 700
        scheduledShiftId:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Shift scope identifier; null for match-scoped incidents.
          example: 900
        evidence:
          $ref: '#/components/schemas/AttendanceIncidentEvidenceDTO'
        lifecycle:
          $ref: '#/components/schemas/IncidentLifecycleDTO'
        resolution:
          oneOf:
            - $ref: '#/components/schemas/IncidentResolutionDTO'
            - type: 'null'
        resolvedBy:
          type: [integer, 'null']
          format: int64
          minimum: 1
        resolvedAt:
          type: [string, 'null']
          format: date-time
        reason:
          type: [string, 'null']
          maxLength: 500
        justification:
          description: >
            Employee justification while the incident stays OPEN. Null when the
            employee has not justified it. Writing or replacing it does not
            resolve the incident; an OWNER or MANAGER still resolves it.
          oneOf:
            - $ref: '#/components/schemas/IncidentJustificationDTO'
            - type: 'null'
        version:
          type: integer
          format: int64
          minimum: 0
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, scope, attendanceMatchId, scheduledShiftId, evidence, lifecycle, resolution, resolvedBy, resolvedAt, reason, version, createdAt, updatedAt]

    IncidentJustificationDTO:
      type: object
      description: >
        Text written by the employee who owns the worklog (MATCH) or the shift
        (SHIFT). It can be replaced while the incident stays OPEN. At most 500
        characters.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Non-blank justification, at most 500 characters.
          example: The bus was late, so I clocked in after the shift started.
        justifiedBy:
          type: integer
          format: int64
          minimum: 1
          description: User id of the employee who wrote the justification.
          example: 3
        justifiedAt:
          type: string
          format: date-time
          description: Instant when this justification was recorded.
          example: '2025-07-29T09:00:00+02:00'
      required: [text, justifiedBy, justifiedAt]

    JustifyAttendanceIncidentRequestDTO:
      type: object
      description: Replacement justification text for an open attendance incident.
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Non-blank justification, at most 500 characters.
          example: The bus was late, so I clocked in after the shift started.
      required: [text]

    AttendanceMetricsDTO:
      type: object
      description: >
        Calculated seconds for one scheduled shift. Values are derived from current
        source truth. A split shift is still one shift: several worklogs may
        reference its `scheduledShiftId`, each matched to a segment. The unpaid
        gap between segments is not planned time and is not a break.
      properties:
        plannedSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Net planned seconds: sum of the planned segment durations minus
            `breakMinutes`, never negative. When the shift has no `segments`, the
            envelope is the only segment (overnight counts 24 hours). The unpaid
            gap is not included.
          example: 27000
        recordedWorkedSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 28800
        reportableWorkedSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 27900
        breakSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 1800
        entryDeviationSeconds:
          type: integer
          format: int64
          description: >
            Signed deviation of the earliest clock-in from the first segment's
            start (the envelope start); positive means late. Late and early
            entry of each segment are incidents of that segment, not this total.
          example: 600
        exitDeviationSeconds:
          type: integer
          format: int64
          description: >
            Signed deviation of the latest clock-out from the last segment's end
            (the envelope end); positive means late. Late and early exit of each
            segment are incidents of that segment, not this total.
          example: -300
        unexplainedGapSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Unexplained gaps between clocked worklogs. The planned unpaid gap
            between segments is subtracted and is not an unexplained gap.
          example: 0
        outsideScheduleSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Time worked outside every planned segment. Work during the unpaid
            gap counts as outside the schedule.
          example: 900
        excessWorkedSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 1800
      required: [plannedSeconds, recordedWorkedSeconds, reportableWorkedSeconds, breakSeconds, entryDeviationSeconds, exitDeviationSeconds, unexplainedGapSeconds, outsideScheduleSeconds, excessWorkedSeconds]

    ShiftAttendanceLifecycleDTO:
      type: string
      description: >
        Derived lifecycle based on current time, the planned segments, and
        worklogs. `IN_PROGRESS` only while now falls inside a segment. During
        the unpaid gap the shift is not in progress: a later segment still to
        start keeps it `UPCOMING` (one shift, not a second row). There is no
        automatic close at the end of a segment in this version.
      enum: [UPCOMING, EXPECTED, IN_PROGRESS, INTERRUPTED, FINISHED]
      example: FINISHED

    ShiftAttendanceCoverageDTO:
      type: string
      description: Derived coverage state for a scheduled shift.
      enum: [UNCOVERED, POTENTIALLY_COVERED, COVERED]
      example: COVERED

    ShiftAttendanceReviewDTO:
      type: string
      description: Derived management review state.
      enum: [NOT_READY, PENDING, CONFIRMED, APPROVED]
      example: PENDING

    ShiftAttendanceAlertDTO:
      type: string
      description: Alert derived for the daily view without a duplicate incident row.
      enum: [MISSING_CLOCK_IN, LONG_OPEN]
      example: MISSING_CLOCK_IN

    AttendanceWorkerDTO:
      type: object
      description: Minimal worker identity shown in management attendance views.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 3
        name:
          type: string
          example: Bob Wilson
      required: [id, name]

    ShiftAttendanceApprovalBlockerDTO:
      type: string
      enum: [SHIFT_NOT_FINISHED, RECONCILIATION_PENDING, OPEN_WORKLOGS, STRUCTURAL_INCIDENTS]
      description: >
        Why approveShiftAttendance would refuse the shift right now, evaluated
        in this order: SHIFT_NOT_FINISHED (lifecycle is not FINISHED, 409
        1081), RECONCILIATION_PENDING (reconciliation of a match is still
        pending, 409 1080), OPEN_WORKLOGS (an open worklog or an open break,
        409 1082), STRUCTURAL_INCIDENTS (an open structural incident, 409
        1083; for example UNSCHEDULED_WORK, AMBIGUOUS_MATCH or NO_SHOW, resolved
        first with acceptUnplannedAttendance, resolveAttendanceMatch or
        acknowledgeNoShow). It does not cover a stale expectedRevision (1079)
        or the caller's role. New values may be added; clients must tolerate
        unknown values.
      example: SHIFT_NOT_FINISHED

    ShiftAttendanceDTO:
      type: object
      description: On-demand reconciliation of one scheduled shift and its current worklogs.
      properties:
        scheduledShift:
          $ref: '../scheduling/components.yml#/components/schemas/ScheduledShiftResponseDTO'
        worker:
          $ref: '#/components/schemas/AttendanceWorkerDTO'
        metrics:
          $ref: '#/components/schemas/AttendanceMetricsDTO'
        lifecycle:
          $ref: '#/components/schemas/ShiftAttendanceLifecycleDTO'
        coverage:
          $ref: '#/components/schemas/ShiftAttendanceCoverageDTO'
        review:
          $ref: '#/components/schemas/ShiftAttendanceReviewDTO'
        reconciliation:
          $ref: '#/components/schemas/AttendanceReconciliationDTO'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/ShiftAttendanceAlertDTO'
        matches:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceMatchDTO'
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceIncidentDTO'
        worklogs:
          type: array
          description: >
            Current worklogs of this shift (the worklogs of its matches,
            including ambiguous candidates), ordered by clock-in, REJECTED
            included for audit; each worklog carries its `breaks`; consumers
            draw entry, exit and break segments from them without another call.
            Clock-in and clock-out are per planned segment: several worklogs may
            reference this same `scheduledShiftId`. One open worklog per person
            and business still applies, so the first segment must be clocked out
            before the next segment is clocked in.
          items:
            $ref: '../worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        approvalBlocker:
          description: >
            Null when the shift can be approved now with the current revision;
            otherwise the first reason approveShiftAttendance would refuse it.
            Derived by the backend from the same rule as the approval; clients
            must not recompute it.
          oneOf:
            - $ref: '#/components/schemas/ShiftAttendanceApprovalBlockerDTO'
            - type: 'null'
        clockInNotice:
          $ref: '#/components/schemas/ShiftClockInNoticeDTO'
          description: >
            Clock-in notice state of the shift (notifyShiftClockIn). Always returned from 0.0.88;
            not listed as required so that clients generated from earlier versions keep working.
        revision:
          type: string
          minLength: 1
          description: Opaque approval revision calculated from current approval-relevant sources.
          example: 4f8f1f6f3a1d5f2e7c9e5c0b6f2a8a7f6d4e1c9b8a7f6e5d4c3b2a1908171615
      required: [scheduledShift, worker, metrics, lifecycle, coverage, review, reconciliation, alerts, matches, incidents, revision]

    UnmatchedAttendanceDTO:
      type: object
      description: Attendance with an UNSCHEDULED or AMBIGUOUS match that is not currently assigned to a shift.
      properties:
        match:
          $ref: '#/components/schemas/AttendanceMatchDTO'
        worklog:
          $ref: '../worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceIncidentDTO'
      required: [match, worklog, incidents]

    DailyAttendanceSummaryDTO:
      type: object
      description: Summary totals for a business-local attendance date.
      properties:
        shiftCount:
          type: integer
          format: int32
          minimum: 0
        coveredShiftCount:
          type: integer
          format: int32
          minimum: 0
        potentiallyCoveredShiftCount:
          type: integer
          format: int32
          minimum: 0
        uncoveredShiftCount:
          type: integer
          format: int32
          minimum: 0
        unmatchedAttendanceCount:
          type: integer
          format: int32
          minimum: 0
        pendingReconciliationCount:
          type: integer
          format: int32
          minimum: 0
        openIncidentCount:
          type: integer
          format: int32
          minimum: 0
        recordedWorkedSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Net worked seconds of the day, breaks deducted: the
            recordedWorkedSeconds of every shift attendance plus the net
            seconds of the unmatched worklogs not already counted in a shift.
        reportableWorkedSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Net reportable seconds of the day, breaks deducted: the
            reportableWorkedSeconds of every shift attendance plus the net
            seconds of the closed unmatched worklogs in CONFIRMED or APPROVED
            not already counted in a shift.
      required: [shiftCount, coveredShiftCount, potentiallyCoveredShiftCount, uncoveredShiftCount, unmatchedAttendanceCount, pendingReconciliationCount, openIncidentCount, recordedWorkedSeconds, reportableWorkedSeconds]

    DailyAttendanceDTO:
      type: object
      description: >
        Attendance for one business-local calendar date. An OWNER or MANAGER
        receives every shift and unmatched worklog of the business. An EMPLOYEE
        receives the same schema restricted to their own shifts and worklogs.
      properties:
        businessId:
          type: integer
          format: int64
          minimum: 1
        date:
          type: string
          format: date
          description: Business-local calendar date.
        summary:
          $ref: '#/components/schemas/DailyAttendanceSummaryDTO'
        shiftAttendances:
          type: array
          description: Shift attendances ordered by shift start and then worker.
          items:
            $ref: '#/components/schemas/ShiftAttendanceDTO'
        unmatchedAttendances:
          type: array
          items:
            $ref: '#/components/schemas/UnmatchedAttendanceDTO'
        reconciliation:
          type: string
          enum: [READY, PENDING]
          description: PENDING when any included attendance match is pending reconciliation.
      required: [businessId, date, summary, shiftAttendances, unmatchedAttendances, reconciliation]

    AttendanceToleranceDTO:
      type: object
      description: >
        Single attendance tolerance of the business, in minutes. It is a field
        of the business, not a per-member value and not a business-settings key.
        Only the OWNER may change it.
      properties:
        businessId:
          type: integer
          format: int64
          minimum: 1
        toleranceMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 1440
          example: 5
      required: [businessId, toleranceMinutes]

    AttendanceToleranceUpdateRequestDTO:
      type: object
      description: Replacement business attendance tolerance.
      additionalProperties: false
      properties:
        toleranceMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 1440
          example: 10
      required: [toleranceMinutes]

    AttendanceMatchResolutionRequestDTO:
      type: object
      description: Management resolution of an ambiguous or unplanned match. A non-blank reason is mandatory.
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [ASSIGN_SHIFT, DECLARE_UNPLANNED]
          example: ASSIGN_SHIFT
        scheduledShiftId:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Required for ASSIGN_SHIFT and null for DECLARE_UNPLANNED.
          example: 900
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Non-blank explanation for the structural resolution.
          example: The worker covered the morning service.
      required: [action, scheduledShiftId, reason]

    UnscheduledAttendanceAcceptanceRequestDTO:
      type: object
      description: Mandatory reason for accepting an unscheduled worklog as approved unplanned work.
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Emergency cover approved by the owner.
      required: [reason]

    NoShowAcknowledgementRequestDTO:
      type: object
      description: Mandatory reason for acknowledging a shift no-show without creating a worklog.
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Worker reported absence by phone.
      required: [reason]

    ShiftAttendanceApprovalRequestDTO:
      type: object
      description: Revision-safe approval command for one completed ShiftAttendance.
      additionalProperties: false
      properties:
        expectedRevision:
          type: string
          minLength: 1
          description: Revision returned by the latest daily attendance read.
          example: 4f8f1f6f3a1d5f2e7c9e5c0b6f2a8a7f6d4e1c9b8a7f6e5d4c3b2a1908171615
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Optional explanation recorded with accepted temporal incidents.
          example: Approved after confirming the closing handover.
      required: [expectedRevision]

    AttendanceRevisionConflictDTO:
      type: object
      description: Current revision returned when approval loses an optimistic concurrency race.
      properties:
        currentRevision:
          type: string
          minLength: 1
        code:
          type: string
          enum: [ATTENDANCE_REVISION_CONFLICT]
      required: [currentRevision, code]

    ClockInNoticeBlockerDTO:
      type: string
      enum: [OUTSIDE_WINDOW, ALREADY_CLOCKED_IN, MEMBER_NOT_ELIGIBLE, TOO_SOON]
      description: >
        Why notifyShiftClockIn would refuse the targeted segment right now, evaluated in the
        same order as the operation: OUTSIDE_WINDOW (409 1116), ALREADY_CLOCKED_IN (409 1117),
        MEMBER_NOT_ELIGIBLE (409 1118), TOO_SOON (429 1119). The window, the already-clocked
        check and the cooldown are per segment. Clocking out of an earlier segment does not
        set ALREADY_CLOCKED_IN for a later one. An open worklog still does. Derived by the
        backend from the same rule as the operation; clients must not recompute it. New values
        may be added; clients must tolerate unknown values.
      example: TOO_SOON

    NotifyShiftClockInRequestDTO:
      type: object
      additionalProperties: false
      description: >
        Identifies the planned segment the reminder is for. Omit the body, or omit
        `segmentIndex`, to address the first segment (index 0). A normal shift has
        only that segment.
      properties:
        segmentIndex:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          description: >
            Zero-based index into the shift's planned segments. 0 is the first
            segment. The maximum is 1 in this version (at most two segments).
            An index past the shift's segments is `400` `1047`.
          example: 1

    ClockInNoticeDTO:
      type: object
      description: >
        One clock-in notice sent by the OWNER to the worker of one planned segment
        of a scheduled shift. `segmentIndex` and `segmentStartAt` identify that
        segment. This is not a clocked worklog.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 7001
        scheduledShiftId:
          type: integer
          format: int64
          minimum: 1
          example: 900
        segmentIndex:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          description: >
            Zero-based index of the planned segment this notice is for. 0 when the
            shift has a single segment.
          example: 0
        segmentStartAt:
          type: string
          format: date-time
          description: >
            Start instant of that segment. Equal to the shift envelope `startAt`
            when `segmentIndex` is 0.
          example: "2026-11-02T09:00:00+01:00"
        userId:
          type: integer
          format: int64
          minimum: 1
          description: Worker of the shift who receives the notice.
          example: 3
        notifiedBy:
          type: integer
          format: int64
          minimum: 1
          description: OWNER who sent the notice.
          example: 1
        notifiedAt:
          type: string
          format: date-time
          example: "2026-11-02T09:07:00+01:00"
        nextAllowedAt:
          type: string
          format: date-time
          description: >
            notifiedAt plus the cooldown (10 minutes). No other notice for this
            shift and this `segmentIndex` is accepted before it. A notice of
            another segment does not consume this cooldown.
          example: "2026-11-02T09:17:00+01:00"
      required: [id, scheduledShiftId, userId, notifiedBy, notifiedAt, nextAllowedAt]

    ShiftClockInNoticeDTO:
      type: object
      description: >
        Clock-in notice state for the segment that can be reminded now: the segment
        whose window contains now, otherwise the next segment that has not started,
        otherwise the last segment. A notice of another segment does not hide this
        one. Home and attendance keep one row per shift; this object says which
        segment «Avisar para fichar» targets.
      properties:
        segmentIndex:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          description: >
            Zero-based index of the segment `lastNotice` and `blocker` refer to.
          example: 0
        segmentStartAt:
          type: string
          format: date-time
          description: Start instant of that segment.
          example: "2026-11-02T09:00:00+01:00"
        lastNotice:
          description: Latest notice of this segment; null when none was sent for it.
          oneOf:
            - $ref: '#/components/schemas/ClockInNoticeDTO'
            - type: 'null'
        blocker:
          description: Null when notifyShiftClockIn would accept a notice now; otherwise the first reason it would refuse it.
          oneOf:
            - $ref: '#/components/schemas/ClockInNoticeBlockerDTO'
            - type: 'null'
      required: [lastNotice, blocker]

    BusinessAttendanceIncidentDailyCountDTO:
      type: object
      additionalProperties: false
      description: >-
        One worker and one business-local date with at least one attendance incident that is
        still OPEN and has no justification. Rows with a count of zero are omitted.
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          description: Worker the incidents belong to.
          example: 103
        date:
          type: string
          format: date
          description: >-
            Business-local anchor date in the business time zone. Same anchor as the inbox:
            shift start for SHIFT scope or a MATCHED match, otherwise the worklog clock-in
            date. A night shift stays on its start date.
          example: '2026-02-12'
        unjustifiedCount:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Incidents of `userId` anchored on `date` whose lifecycle is OPEN and whose
            justification is null. An OPEN incident that already has a justification, and a
            resolved incident, are not counted. Always at least 1: rows with zero are omitted.
          example: 1
      required: [userId, date, unjustifiedCount]
