components:
  schemas:
    AttendanceMatchKindDTO:
      type: string
      description: Current structural result of matching one worklog to published scheduling.
      enum: [NOT_APPLICABLE, MATCHED, UNSCHEDULED, AMBIGUOUS]
      example: MATCHED

    AttendanceMatchOriginDTO:
      type: string
      description: Origin of the current attendance-match decision.
      enum: [AUTOMATIC, MANAGEMENT]
      example: AUTOMATIC

    ReconciliationStateDTO:
      type: string
      description: Whether asynchronous attendance incident reconciliation has caught up with current source data.
      enum: [PENDING, READY]
      example: READY

    AttendanceReconciliationDTO:
      type: object
      description: Current reconciliation watermark for an attendance match.
      properties:
        state:
          $ref: '#/components/schemas/ReconciliationStateDTO'
        sourceRevision:
          type: [string, 'null']
          minLength: 1
          description: Opaque SHA-256 source revision when state is READY, otherwise null.
          example: 4f8f1f6f3a1d5f2e7c9e5c0b6f2a8a7f6d4e1c9b8a7f6e5d4c3b2a1908171615
        reconciledAt:
          type: [string, 'null']
          format: date-time
          description: Time when this source revision was reconciled, otherwise null.
          example: '2025-07-29T17:31:00+02:00'
      required: [state, sourceRevision, reconciledAt]

    AttendanceMatchBaseDTO:
      type: object
      description: Fields common to every attendance-match variant.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 700
        worklogId:
          type: integer
          format: int64
          minimum: 1
          example: 123
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 3
        origin:
          $ref: '#/components/schemas/AttendanceMatchOriginDTO'
        reconciliation:
          $ref: '#/components/schemas/AttendanceReconciliationDTO'
        version:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic-lock version of the current match.
          example: 0
        createdAt:
          type: string
          format: date-time
          example: '2025-07-29T08:30:01+02:00'
        updatedAt:
          type: string
          format: date-time
          example: '2025-07-29T08:30:01+02:00'
      required: [id, worklogId, businessId, userId, origin, reconciliation, version, createdAt, updatedAt]

    AttendanceMatchNotApplicableDTO:
      allOf:
        - $ref: '#/components/schemas/AttendanceMatchBaseDTO'
        - type: object
          properties:
            kind:
              type: string
              enum: [NOT_APPLICABLE]
              example: NOT_APPLICABLE
          required: [kind]

    AttendanceMatchMatchedDTO:
      allOf:
        - $ref: '#/components/schemas/AttendanceMatchBaseDTO'
        - type: object
          properties:
            kind:
              type: string
              enum: [MATCHED]
              example: MATCHED
            scheduledShift:
              $ref: '../scheduling/components.yml#/components/schemas/ScheduledShiftResponseDTO'
          required: [kind, scheduledShift]

    AttendanceMatchUnscheduledDTO:
      allOf:
        - $ref: '#/components/schemas/AttendanceMatchBaseDTO'
        - type: object
          properties:
            kind:
              type: string
              enum: [UNSCHEDULED]
              example: UNSCHEDULED
          required: [kind]

    AttendanceMatchAmbiguousDTO:
      allOf:
        - $ref: '#/components/schemas/AttendanceMatchBaseDTO'
        - type: object
          properties:
            kind:
              type: string
              enum: [AMBIGUOUS]
              example: AMBIGUOUS
            candidateShifts:
              type: array
              minItems: 2
              description: Every plausible published shift observed by the matcher. Candidates remain after resolution.
              items:
                $ref: '../scheduling/components.yml#/components/schemas/ScheduledShiftResponseDTO'
          required: [kind, candidateShifts]

    AttendanceMatchDTO:
      type: object
      description: Wire representation of one sealed AttendanceMatch variant. The kind discriminator determines which variant payload is populated.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 700
        worklogId:
          type: integer
          format: int64
          minimum: 1
          example: 123
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 3
        kind:
          $ref: '#/components/schemas/AttendanceMatchKindDTO'
        origin:
          $ref: '#/components/schemas/AttendanceMatchOriginDTO'
        scheduledShift:
          oneOf:
            - $ref: '../scheduling/components.yml#/components/schemas/ScheduledShiftResponseDTO'
            - type: 'null'
        candidateShifts:
          type: array
          description: Retained candidates for an AMBIGUOUS match; empty for other kinds.
          items:
            $ref: '../scheduling/components.yml#/components/schemas/ScheduledShiftResponseDTO'
        reconciliation:
          $ref: '#/components/schemas/AttendanceReconciliationDTO'
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, worklogId, businessId, userId, kind, origin, scheduledShift, candidateShifts, reconciliation, version, createdAt, updatedAt]

    ClockInResultDTO:
      type: object
      description: Result of a successful clock-in, including the durable attendance-match identity.
      properties:
        worklog:
          $ref: '../worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        attendanceMatchId:
          type: integer
          format: int64
          minimum: 1
          description: Independently identified attendance match created for the worklog.
          example: 700
      required: [worklog, attendanceMatchId]

    AttendanceIncidentTypeDTO:
      type: string
      description: Type of attendance deviation or structural incident.
      enum: [EARLY_ENTRY, LATE_ENTRY, EARLY_EXIT, LATE_EXIT, UNEXPLAINED_GAP, UNSCHEDULED_WORK, AMBIGUOUS_MATCH, NO_SHOW]
      example: LATE_ENTRY

    AttendanceIncidentScopeDTO:
      type: string
      description: Aggregate scope that owns an attendance incident.
      enum: [MATCH, SHIFT]
      example: MATCH

    IncidentResolutionDTO:
      type: string
      description: Terminal resolution of an attendance incident.
      enum: [ACCEPTED, CORRECTED, REASSIGNED, WORKLOG_REJECTED, ACKNOWLEDGED, NO_LONGER_APPLICABLE]
      example: ACCEPTED

    IncidentLifecycleDTO:
      type: string
      description: Current incident lifecycle.
      enum: [OPEN, RESOLVED]
      example: OPEN

    AttendanceIncidentEvidenceDTO:
      type: object
      description: Typed evidence captured for the current incident occurrence.
      properties:
        type:
          $ref: '#/components/schemas/AttendanceIncidentTypeDTO'
        measuredSeconds:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Measured deviation for temporal incidents; null for structural and no-show incidents.
          example: 900
        toleranceSeconds:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Effective business tolerance for temporal incidents; null otherwise.
          example: 300
        candidateShiftIds:
          type: array
          description: Retained plausible shift IDs for an ambiguous match, empty otherwise.
          items:
            type: integer
            format: int64
            minimum: 1
      required: [type, measuredSeconds, toleranceSeconds, candidateShiftIds]

    AttendanceIncidentDTO:
      type: object
      description: Auditable current or resolved attendance incident.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 880
        scope:
          $ref: '#/components/schemas/AttendanceIncidentScopeDTO'
        attendanceMatchId:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Match scope identifier; null for shift-scoped incidents.
          example: 700
        scheduledShiftId:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Shift scope identifier; null for match-scoped incidents.
          example: 900
        evidence:
          $ref: '#/components/schemas/AttendanceIncidentEvidenceDTO'
        lifecycle:
          $ref: '#/components/schemas/IncidentLifecycleDTO'
        resolution:
          oneOf:
            - $ref: '#/components/schemas/IncidentResolutionDTO'
            - type: 'null'
        resolvedBy:
          type: [integer, 'null']
          format: int64
          minimum: 1
        resolvedAt:
          type: [string, 'null']
          format: date-time
        reason:
          type: [string, 'null']
          maxLength: 500
        version:
          type: integer
          format: int64
          minimum: 0
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, scope, attendanceMatchId, scheduledShiftId, evidence, lifecycle, resolution, resolvedBy, resolvedAt, reason, version, createdAt, updatedAt]

    AttendanceMetricsDTO:
      type: object
      description: Calculated seconds for one scheduled shift. Values are derived from current source truth.
      properties:
        plannedSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 27000
        recordedWorkedSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 28800
        reportableWorkedSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 27900
        breakSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 1800
        entryDeviationSeconds:
          type: integer
          format: int64
          description: Signed deviation of earliest clock-in from shift start; positive means late.
          example: 600
        exitDeviationSeconds:
          type: integer
          format: int64
          description: Signed deviation of latest clock-out from shift end; positive means late.
          example: -300
        unexplainedGapSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 0
        outsideScheduleSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 900
        excessWorkedSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 1800
      required: [plannedSeconds, recordedWorkedSeconds, reportableWorkedSeconds, breakSeconds, entryDeviationSeconds, exitDeviationSeconds, unexplainedGapSeconds, outsideScheduleSeconds, excessWorkedSeconds]

    ShiftAttendanceLifecycleDTO:
      type: string
      description: Derived lifecycle based on current time, shift interval, and worklogs.
      enum: [UPCOMING, EXPECTED, IN_PROGRESS, INTERRUPTED, FINISHED]
      example: FINISHED

    ShiftAttendanceCoverageDTO:
      type: string
      description: Derived coverage state for a scheduled shift.
      enum: [UNCOVERED, POTENTIALLY_COVERED, COVERED]
      example: COVERED

    ShiftAttendanceReviewDTO:
      type: string
      description: Derived management review state.
      enum: [NOT_READY, PENDING, CONFIRMED, APPROVED]
      example: PENDING

    ShiftAttendanceAlertDTO:
      type: string
      description: Alert derived for the daily view without a duplicate incident row.
      enum: [MISSING_CLOCK_IN, LONG_OPEN]
      example: MISSING_CLOCK_IN

    AttendanceWorkerDTO:
      type: object
      description: Minimal worker identity shown in management attendance views.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 3
        name:
          type: string
          example: Bob Wilson
      required: [id, name]

    ShiftAttendanceDTO:
      type: object
      description: On-demand reconciliation of one scheduled shift and its current worklogs.
      properties:
        scheduledShift:
          $ref: '../scheduling/components.yml#/components/schemas/ScheduledShiftResponseDTO'
        worker:
          $ref: '#/components/schemas/AttendanceWorkerDTO'
        metrics:
          $ref: '#/components/schemas/AttendanceMetricsDTO'
        lifecycle:
          $ref: '#/components/schemas/ShiftAttendanceLifecycleDTO'
        coverage:
          $ref: '#/components/schemas/ShiftAttendanceCoverageDTO'
        review:
          $ref: '#/components/schemas/ShiftAttendanceReviewDTO'
        reconciliation:
          $ref: '#/components/schemas/AttendanceReconciliationDTO'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/ShiftAttendanceAlertDTO'
        matches:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceMatchDTO'
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceIncidentDTO'
        revision:
          type: string
          minLength: 1
          description: Opaque approval revision calculated from current approval-relevant sources.
          example: 4f8f1f6f3a1d5f2e7c9e5c0b6f2a8a7f6d4e1c9b8a7f6e5d4c3b2a1908171615
      required: [scheduledShift, worker, metrics, lifecycle, coverage, review, reconciliation, alerts, matches, incidents, revision]

    UnmatchedAttendanceDTO:
      type: object
      description: Attendance with an UNSCHEDULED or AMBIGUOUS match that is not currently assigned to a shift.
      properties:
        match:
          $ref: '#/components/schemas/AttendanceMatchDTO'
        worklog:
          $ref: '../worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceIncidentDTO'
      required: [match, worklog, incidents]

    DailyAttendanceSummaryDTO:
      type: object
      description: Summary totals for a business-local attendance date.
      properties:
        shiftCount:
          type: integer
          format: int32
          minimum: 0
        coveredShiftCount:
          type: integer
          format: int32
          minimum: 0
        potentiallyCoveredShiftCount:
          type: integer
          format: int32
          minimum: 0
        uncoveredShiftCount:
          type: integer
          format: int32
          minimum: 0
        unmatchedAttendanceCount:
          type: integer
          format: int32
          minimum: 0
        pendingReconciliationCount:
          type: integer
          format: int32
          minimum: 0
        openIncidentCount:
          type: integer
          format: int32
          minimum: 0
        recordedWorkedSeconds:
          type: integer
          format: int64
          minimum: 0
        reportableWorkedSeconds:
          type: integer
          format: int64
          minimum: 0
      required: [shiftCount, coveredShiftCount, potentiallyCoveredShiftCount, uncoveredShiftCount, unmatchedAttendanceCount, pendingReconciliationCount, openIncidentCount, recordedWorkedSeconds, reportableWorkedSeconds]

    DailyAttendanceDTO:
      type: object
      description: Complete management attendance view for one business-local calendar date.
      properties:
        businessId:
          type: integer
          format: int64
          minimum: 1
        date:
          type: string
          format: date
          description: Business-local calendar date.
        summary:
          $ref: '#/components/schemas/DailyAttendanceSummaryDTO'
        shiftAttendances:
          type: array
          description: Shift attendances ordered by shift start and then worker.
          items:
            $ref: '#/components/schemas/ShiftAttendanceDTO'
        unmatchedAttendances:
          type: array
          items:
            $ref: '#/components/schemas/UnmatchedAttendanceDTO'
        reconciliation:
          type: string
          enum: [READY, PENDING]
          description: PENDING when any included attendance match is pending reconciliation.
      required: [businessId, date, summary, shiftAttendances, unmatchedAttendances, reconciliation]

    AttendanceToleranceDTO:
      type: object
      description: Owner-configurable business attendance tolerance.
      properties:
        businessId:
          type: integer
          format: int64
          minimum: 1
        toleranceMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 1440
          example: 5
      required: [businessId, toleranceMinutes]

    AttendanceToleranceUpdateRequestDTO:
      type: object
      description: Replacement business attendance tolerance.
      additionalProperties: false
      properties:
        toleranceMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 1440
          example: 10
      required: [toleranceMinutes]

    AttendanceMatchResolutionRequestDTO:
      type: object
      description: Management resolution of an ambiguous or unplanned match. A non-blank reason is mandatory.
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [ASSIGN_SHIFT, DECLARE_UNPLANNED]
          example: ASSIGN_SHIFT
        scheduledShiftId:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Required for ASSIGN_SHIFT and null for DECLARE_UNPLANNED.
          example: 900
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Non-blank explanation for the structural resolution.
          example: The worker covered the morning service.
      required: [action, scheduledShiftId, reason]

    UnscheduledAttendanceAcceptanceRequestDTO:
      type: object
      description: Mandatory reason for accepting an unscheduled worklog as approved unplanned work.
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Emergency cover approved by the owner.
      required: [reason]

    NoShowAcknowledgementRequestDTO:
      type: object
      description: Mandatory reason for acknowledging a shift no-show without creating a worklog.
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Worker reported absence by phone.
      required: [reason]

    ShiftAttendanceApprovalRequestDTO:
      type: object
      description: Revision-safe approval command for one completed ShiftAttendance.
      additionalProperties: false
      properties:
        expectedRevision:
          type: string
          minLength: 1
          description: Revision returned by the latest daily attendance read.
          example: 4f8f1f6f3a1d5f2e7c9e5c0b6f2a8a7f6d4e1c9b8a7f6e5d4c3b2a1908171615
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Optional explanation recorded with accepted temporal incidents.
          example: Approved after confirming the closing handover.
      required: [expectedRevision]

    AttendanceRevisionConflictDTO:
      type: object
      description: Current revision returned when approval loses an optimistic concurrency race.
      properties:
        currentRevision:
          type: string
          minLength: 1
        code:
          type: string
          enum: [ATTENDANCE_REVISION_CONFLICT]
      required: [currentRevision, code]

    WeeklyAttendancePeriodStateDTO:
      type: string
      description: Current lifecycle state of a weekly attendance period.
      enum: [OPEN, CLOSED]
      example: OPEN

    WeeklyAttendancePeriodTransitionActionDTO:
      type: string
      description: Last successful state transition represented by the current period projection.
      enum: [CLOSE, REOPEN]
      example: CLOSE

    WeeklyAttendancePeriodSummaryDTO:
      type: object
      description: Compact counts and worked-time totals derived from the current weekly attendance sources.
      properties:
        scheduledShiftCount:
          type: integer
          format: int32
          minimum: 0
        resolvedShiftCount:
          type: integer
          format: int32
          minimum: 0
        coveredShiftCount:
          type: integer
          format: int32
          minimum: 0
        potentiallyCoveredShiftCount:
          type: integer
          format: int32
          minimum: 0
        uncoveredShiftCount:
          type: integer
          format: int32
          minimum: 0
        attendanceMatchCount:
          type: integer
          format: int32
          minimum: 0
        ambiguousAttendanceCount:
          type: integer
          format: int32
          minimum: 0
        pendingReconciliationCount:
          type: integer
          format: int32
          minimum: 0
        worklogCount:
          type: integer
          format: int32
          minimum: 0
        openWorklogCount:
          type: integer
          format: int32
          minimum: 0
        openBreakCount:
          type: integer
          format: int32
          minimum: 0
        undecidedWorklogCount:
          type: integer
          format: int32
          minimum: 0
        approvedWorklogCount:
          type: integer
          format: int32
          minimum: 0
        rejectedWorklogCount:
          type: integer
          format: int32
          minimum: 0
        openIncidentCount:
          type: integer
          format: int32
          minimum: 0
        recordedWorkedSeconds:
          type: integer
          format: int64
          minimum: 0
        reportableWorkedSeconds:
          type: integer
          format: int64
          minimum: 0
      required: [scheduledShiftCount, resolvedShiftCount, coveredShiftCount, potentiallyCoveredShiftCount, uncoveredShiftCount, attendanceMatchCount, ambiguousAttendanceCount, pendingReconciliationCount, worklogCount, openWorklogCount, openBreakCount, undecidedWorklogCount, approvedWorklogCount, rejectedWorklogCount, openIncidentCount, recordedWorkedSeconds, reportableWorkedSeconds]

    WeeklyAttendancePeriodTransitionMetadataDTO:
      type: object
      description: Metadata for the latest successful close or reopen transition. Null when the period has never been persisted.
      properties:
        action:
          $ref: '#/components/schemas/WeeklyAttendancePeriodTransitionActionDTO'
        actorId:
          type: integer
          format: int64
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        reason:
          type: [string, 'null']
          maxLength: 500
        beforeState:
          $ref: '#/components/schemas/WeeklyAttendancePeriodStateDTO'
        afterState:
          $ref: '#/components/schemas/WeeklyAttendancePeriodStateDTO'
        sourceRevision:
          type: string
          minLength: 1
          description: Weekly source revision observed for the transition.
        frozenToleranceMinutes:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 1440
          description: Tolerance frozen by a close transition; null for a reopen transition.
      required: [action, actorId, occurredAt, reason, beforeState, afterState, sourceRevision, frozenToleranceMinutes]

    WeeklyAttendancePeriodBlockerTypeDTO:
      type: string
      description: Stable discriminator for a weekly closure blocker.
      enum: [PERIOD_NOT_FINISHED, RECONCILIATION_PENDING, OPEN_WORKLOGS, OPEN_BREAKS, UNDECIDED_WORKLOGS, UNRESOLVED_INCIDENTS, AMBIGUOUS_ATTENDANCE, UNCOVERED_SHIFTS]

    WeeklyAttendancePeriodNotFinishedBlockerDTO:
      type: object
      description: The Business-local Monday-to-Monday period has not ended yet.
      properties:
        type:
          type: string
          enum: [PERIOD_NOT_FINISHED]
        periodEndsAt:
          type: string
          format: date-time
          description: Exclusive end instant of the period in the Business zone.
      required: [type, periodEndsAt]

    WeeklyAttendancePeriodReconciliationPendingBlockerDTO:
      type: object
      description: Attendance matches whose reconciliation watermark is not ready.
      properties:
        type:
          type: string
          enum: [RECONCILIATION_PENDING]
        attendanceMatchIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Canonically ascending attendance-match identifiers.
          x-canonical-order: ascending
          items:
            type: integer
            format: int64
            minimum: 1
      required: [type, attendanceMatchIds]

    WeeklyAttendancePeriodOpenWorklogsBlockerDTO:
      type: object
      description: Worklogs that have no clock-out yet.
      properties:
        type:
          type: string
          enum: [OPEN_WORKLOGS]
        worklogIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Canonically ascending worklog identifiers.
          x-canonical-order: ascending
          items:
            type: integer
            format: int64
            minimum: 1
      required: [type, worklogIds]

    WeeklyAttendancePeriodOpenBreaksBlockerDTO:
      type: object
      description: Breaks that have no end yet.
      properties:
        type:
          type: string
          enum: [OPEN_BREAKS]
        breakIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Canonically ascending break identifiers.
          x-canonical-order: ascending
          items:
            type: integer
            format: int64
            minimum: 1
      required: [type, breakIds]

    WeeklyAttendancePeriodUndecidedWorklogsBlockerDTO:
      type: object
      description: Closed worklogs whose review state is neither APPROVED nor REJECTED.
      properties:
        type:
          type: string
          enum: [UNDECIDED_WORKLOGS]
        worklogIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Canonically ascending worklog identifiers.
          x-canonical-order: ascending
          items:
            type: integer
            format: int64
            minimum: 1
      required: [type, worklogIds]

    WeeklyAttendancePeriodUnresolvedIncidentsBlockerDTO:
      type: object
      description: Attendance incidents that remain open.
      properties:
        type:
          type: string
          enum: [UNRESOLVED_INCIDENTS]
        incidentIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Canonically ascending incident identifiers.
          x-canonical-order: ascending
          items:
            type: integer
            format: int64
            minimum: 1
      required: [type, incidentIds]

    WeeklyAttendancePeriodAmbiguousAttendanceBlockerDTO:
      type: object
      description: Attendance matches that still have unresolved candidate ambiguity.
      properties:
        type:
          type: string
          enum: [AMBIGUOUS_ATTENDANCE]
        attendanceMatchIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Canonically ascending attendance-match identifiers.
          x-canonical-order: ascending
          items:
            type: integer
            format: int64
            minimum: 1
      required: [type, attendanceMatchIds]

    WeeklyAttendancePeriodUncoveredShiftsBlockerDTO:
      type: object
      description: Ended scheduled shifts with no match or potential covering attendance.
      properties:
        type:
          type: string
          enum: [UNCOVERED_SHIFTS]
        scheduledShiftIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Canonically ascending scheduled-shift identifiers.
          x-canonical-order: ascending
          items:
            type: integer
            format: int64
            minimum: 1
      required: [type, scheduledShiftIds]

    WeeklyAttendancePeriodBlockerDTO:
      description: Typed closure blocker. Identifier collections are returned in canonical ascending order.
      oneOf:
        - $ref: '#/components/schemas/WeeklyAttendancePeriodNotFinishedBlockerDTO'
        - $ref: '#/components/schemas/WeeklyAttendancePeriodReconciliationPendingBlockerDTO'
        - $ref: '#/components/schemas/WeeklyAttendancePeriodOpenWorklogsBlockerDTO'
        - $ref: '#/components/schemas/WeeklyAttendancePeriodOpenBreaksBlockerDTO'
        - $ref: '#/components/schemas/WeeklyAttendancePeriodUndecidedWorklogsBlockerDTO'
        - $ref: '#/components/schemas/WeeklyAttendancePeriodUnresolvedIncidentsBlockerDTO'
        - $ref: '#/components/schemas/WeeklyAttendancePeriodAmbiguousAttendanceBlockerDTO'
        - $ref: '#/components/schemas/WeeklyAttendancePeriodUncoveredShiftsBlockerDTO'
      discriminator:
        propertyName: type
        mapping:
          PERIOD_NOT_FINISHED: '#/components/schemas/WeeklyAttendancePeriodNotFinishedBlockerDTO'
          RECONCILIATION_PENDING: '#/components/schemas/WeeklyAttendancePeriodReconciliationPendingBlockerDTO'
          OPEN_WORKLOGS: '#/components/schemas/WeeklyAttendancePeriodOpenWorklogsBlockerDTO'
          OPEN_BREAKS: '#/components/schemas/WeeklyAttendancePeriodOpenBreaksBlockerDTO'
          UNDECIDED_WORKLOGS: '#/components/schemas/WeeklyAttendancePeriodUndecidedWorklogsBlockerDTO'
          UNRESOLVED_INCIDENTS: '#/components/schemas/WeeklyAttendancePeriodUnresolvedIncidentsBlockerDTO'
          AMBIGUOUS_ATTENDANCE: '#/components/schemas/WeeklyAttendancePeriodAmbiguousAttendanceBlockerDTO'
          UNCOVERED_SHIFTS: '#/components/schemas/WeeklyAttendancePeriodUncoveredShiftsBlockerDTO'

    WeeklyAttendancePeriodDTO:
      type: object
      description: Compact Business-local weekly attendance projection. Missing persistence is represented as OPEN.
      properties:
        businessId:
          type: integer
          format: int64
          minimum: 1
        weekStart:
          type: string
          format: date
          description: Monday at the start of the Business-local attendance period.
        weekEnd:
          type: string
          format: date
          description: Exclusive following Monday at the end of the Business-local attendance period.
        state:
          $ref: '#/components/schemas/WeeklyAttendancePeriodStateDTO'
        revision:
          type: string
          minLength: 1
          description: Opaque revision of the current attendance and planning sources.
        effectiveToleranceMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 1440
          description: Tolerance used to calculate this projection; frozen when state is CLOSED.
        frozenToleranceMinutes:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 1440
          description: Tolerance captured at close, or null while OPEN.
        closable:
          type: boolean
          description: True only when the period is completed and has no closure blockers.
        summary:
          $ref: '#/components/schemas/WeeklyAttendancePeriodSummaryDTO'
        blockers:
          type: array
          description: All current closure blockers, in stable blocker-type order.
          items:
            $ref: '#/components/schemas/WeeklyAttendancePeriodBlockerDTO'
        transitionMetadata:
          oneOf:
            - $ref: '#/components/schemas/WeeklyAttendancePeriodTransitionMetadataDTO'
            - type: 'null'
      required: [businessId, weekStart, weekEnd, state, revision, effectiveToleranceMinutes, frozenToleranceMinutes, closable, summary, blockers, transitionMetadata]

    WeeklyAttendancePeriodApprovalSelectionDTO:
      type: object
      description: One revision-safe ShiftAttendance selected for atomic approval.
      additionalProperties: false
      properties:
        scheduledShiftId:
          type: integer
          format: int64
          minimum: 1
        expectedRevision:
          type: string
          minLength: 1
          description: Opaque ShiftAttendance revision from the latest attendance read.
      required: [scheduledShiftId, expectedRevision]

    WeeklyAttendancePeriodBulkApprovalRequestDTO:
      type: object
      description: Non-empty selection of ShiftAttendances from one Business-local week.
      additionalProperties: false
      properties:
        selections:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Stable selection order; duplicate scheduled shifts are invalid.
          items:
            $ref: '#/components/schemas/WeeklyAttendancePeriodApprovalSelectionDTO'
      required: [selections]

    WeeklyAttendancePeriodBulkApprovalResultDTO:
      type: object
      description: Result of one atomic selected approval command.
      properties:
        businessId:
          type: integer
          format: int64
          minimum: 1
        weekStart:
          type: string
          format: date
        approvedScheduledShiftIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Scheduled shifts approved by this command, in request order.
          items:
            type: integer
            format: int64
            minimum: 1
        revision:
          type: string
          minLength: 1
          description: Weekly attendance revision after the successful approval.
      required: [businessId, weekStart, approvedScheduledShiftIds, revision]

    CloseWeeklyAttendancePeriodRequestDTO:
      type: object
      description: Revision-safe close command for one completed weekly attendance period.
      additionalProperties: false
      properties:
        expectedRevision:
          type: string
          minLength: 1
          description: Weekly revision returned by the latest period read.
      required: [expectedRevision]

    ReopenWeeklyAttendancePeriodRequestDTO:
      type: object
      description: Owner-only command to reopen a closed period.
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
          description: Non-blank explanation for reopening the period.
          example: Corrected a worklog after payroll review.
      required: [reason]
