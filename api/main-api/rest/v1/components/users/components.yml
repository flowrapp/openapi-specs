components:
  schemas:
    CurrentUserResponseDTO:
      type: object
      description: Profile of the authenticated user
      properties:
        id:
          type: integer
          format: int32
          description: Flowrapp user id
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        phone:
          type: [string, "null"]
          pattern: '^\+[1-9][0-9]{6,14}$'
          description: >
            Global phone in E.164, or null when unset. Not unique across users.
            The same value as `MemberPersonalDataDTO.phone`.
          example: "+34612345678"
        avatarUrl:
          $ref: '../personalData/components.yml#/components/schemas/AvatarUrl'
        role:
          type: string
          description: Global role of the user
          enum: [ADMIN, USER]
          example: USER
      required:
        - id
        - name
        - email
        - phone
        - avatarUrl
        - role
