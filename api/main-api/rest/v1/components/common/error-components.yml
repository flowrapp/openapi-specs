components:
  schemas:
    ProblemDetail:
      type: object
      description: |
        RFC 9457 Problem Details response. Returned for business errors.
        The `detail` field contains `"<code> - <message>"`.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "1003 - invalid credentials"
        instance:
          type: string
          format: uri
      required: [status, detail]
      examples:
        - status: 400
          detail: "1053 - schedule exception is invalid"
        - status: 409
          detail: "1029 - contract overlaps another contract for the same user and business"
        - status: 409
          detail: "1049 - resource was modified concurrently"
        - status: 404
          detail: "1056 - schedule exception not found"
        - status: 400
          detail: "1057 - contract date range is invalid"
        - status: 409
          detail: "1058 - contract update is blocked by planning state"

    FunctionalErrorCode:
      type: integer
      description: |
        Business error code embedded in `ProblemDetail.detail`.

        | Code | HTTP Status | Name | Message |
        |------|-------------|------|---------|
        | 1000 | 404 | USER_NOT_FOUND | user not found |
        | 1001 | 500 | ADMIN_USER_NOT_FOUND | admin user not found |
        | 1002 | 409 | USERNAME_ALREADY_EXISTS | user already exists |
        | 1003 | 401 | INVALID_CREDENTIALS | invalid credentials |
        | 1004 | 401 | INVALID_REFRESH_TOKEN | invalid refresh token |
        | 1005 | 404 | INVITATION_NOT_FOUND | invitation not found |
        | 1006 | 404 | BUSINESS_NOT_FOUND | business does not exist |
        | 1007 | 409 | USER_ALREADY_MEMBER_OF_BUSINESS | user already member of business |
        | 1008 | 409 | INVITATION_ALREADY_EXISTS | user is already invited to this business |
        | 1009 | 403 | INVITATION_NOT_FOR_CURRENT_USER | invitation not for current user |
        | 1010 | 403 | INVITATION_EXPIRED | invitation expired |
        | 1011 | 403 | USER_INVITATION_NOT_OWNER | user not authorized for invitation |
        | 1012 | 403 | INVITATION_ALREADY_ACCEPTED | invitation already accepted |
        | 1013 | 403 | INVITATION_NOT_PENDING | invitation not pending |
        | 1014 | 409 | USER_ALREADY_ENABLED | user already enabled |
        | 1015 | 403 | USER_IS_NOT_MEMBER_OF_BUSINESS | user is not member of business |
        | 1016 | 500 | CURRENT_USER_NOT_FOUND | Current user not found |
        | 1017 | 404 | WORKLOG_NOT_FOUND | worklog not found |
        | 1018 | 403 | WORKLOG_CLOSED | worklog already closed |
        | 1019 | 403 | WORKLOG_NOT_OWNER | user is not the owner of worklog |
        | 1020 | 403 | USER_NOT_OWNER_OF_BUSINESS | user is not the owner of business |
        | 1021 | 400 | ZONE_ID_NOT_FOUND | zone id not found |
        | 1022 | 409 | WORKLOG_OVERLAP | worklog overlaps with existing worklog |
        | 1023 | 401 | OAUTH2_INVALID_TOKEN | oauth2 token is invalid |
        | 1024 | 400 | USER_AUTH_PROVIDER_NOT_FOUND | user auth provider not found |
        | 1025 | 400 | WORKLOG_NOT_VALID | worklog is not valid |
        | 1026 | 400 | PASSWORD_RESET_CODE_INVALID | password reset code is invalid or expired |
        | 1027 | 429 | PASSWORD_RESET_TOO_MANY_ATTEMPTS | too many password reset attempts |
        | 1028 | 403 | CONTRACT_OPERATION_NOT_ENOUGH_PERMISSIONS | User does not have permission to create a contract |
        | 1029 | 409 | CONTRACT_OVERLAPS | contract overlaps another contract for the same user and business |
        | 1030 | 404 | CONTRACT_NOT_FOUND | Contract not found |
        | 1031 | 403 | CONTRACT_IS_NOT_FOR_USER | Contract is not for the current user |
        | 1032 | 400 | INVALID_OPENING_HOURS_CONFIGURATION | opening hours configuration is invalid |
        | 1033 | 409 | OPENING_HOURS_CONFIGURATION_OVERLAPS | opening hours configuration overlaps an existing configuration |
        | 1034 | 404 | JOB_ROLE_NOT_FOUND | job role not found |
        | 1035 | 409 | JOB_ROLE_CODE_ALREADY_EXISTS | job role code already exists |
        | 1036 | 400 | INVALID_JOB_ROLE_ASSIGNMENT | job roles must be active and belong to the business |
        | 1037 | 400 | CONTRACT_USER_IS_NOT_EMPLOYEE | contracts can only be assigned to employees |
        | 1038 | 400 | INVALID_SHIFT_TEMPLATE | shift template is invalid |
        | 1039 | 404 | SHIFT_TEMPLATE_NOT_FOUND | shift template not found |
        | 1040 | 409 | SHIFT_TEMPLATE_NAME_ALREADY_EXISTS | shift template name already exists |
        | 1041 | 400 | INVALID_SHIFT_DEMAND_CONFIGURATION | shift demand configuration is invalid |
        | 1042 | 409 | SHIFT_DEMAND_CONFIGURATION_OVERLAPS | shift demand configuration overlaps an existing configuration |
        | 1043 | 404 | SHIFT_DEMAND_NOT_FOUND | shift demand not found |
        | 1044 | 400 | INVALID_PLANNING_SETTINGS | planning settings are invalid |
        | 1045 | 400 | INVALID_PLANNING | planning is invalid |
        | 1046 | 404 | PLANNING_NOT_FOUND | planning not found |
        | 1047 | 400 | INVALID_SCHEDULED_SHIFT | scheduled shift is invalid |
        | 1048 | 409 | PLANNING_NOT_READY | planning is not ready to publish |
        | 1049 | 409 | CONCURRENT_MODIFICATION | resource was modified concurrently |
        | 1050 | 400 | INVALID_RECURRING_SCHEDULE | recurring schedule is invalid |
        | 1051 | 409 | RECURRING_SCHEDULE_OVERLAPS | recurring schedule overlaps an existing schedule |
        | 1052 | 404 | RECURRING_SCHEDULE_NOT_FOUND | recurring schedule not found |
        | 1053 | 400 | INVALID_SCHEDULE_EXCEPTION | schedule exception is invalid |
        | 1054 | 409 | SCHEDULE_EXCEPTION_ALREADY_EXISTS | schedule exception already exists for date |
        | 1055 | 409 | SCHEDULE_EXCEPTION_OVERLAPS | schedule exception overlaps an adjacent effective configuration |
        | 1056 | 404 | SCHEDULE_EXCEPTION_NOT_FOUND | schedule exception not found |
        | 1057 | 400 | INVALID_CONTRACT_RANGE | contract date range is invalid |
        | 1058 | 409 | CONTRACT_UPDATE_BLOCKED_BY_PLANNING | contract update is blocked by planning state |
        | 1059 | 409 | JOB_ROLE_NAME_ALREADY_EXISTS | job role name already exists |
