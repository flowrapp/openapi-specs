components:
  schemas:
    ProblemDetail:
      type: object
      description: |
        RFC 9457 Problem Details response. Returned for business errors.
        The `detail` field contains `"<code> - <message>"`.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "1003 - invalid credentials"
        instance:
          type: string
          format: uri
      required: [status, detail]
      examples:
        - status: 400
          detail: "1053 - schedule exception is invalid"
        - status: 409
          detail: "1029 - contract overlaps another contract for the same user and business"
        - status: 409
          detail: "1049 - resource was modified concurrently"
        - status: 404
          detail: "1056 - schedule exception not found"
        - status: 400
          detail: "1057 - contract date range is invalid"
        - status: 409
          detail: "1058 - contract update is blocked by planning state"
        - status: 409
          detail: "1062 - shift name already exists"
        - status: 404
          detail: "1061 - shift not found"

