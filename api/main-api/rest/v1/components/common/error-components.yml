        Codes 1087 and 1088 are the backend enum: PLANNING_ALREADY_EXISTS and PLANNING_VERSION_MISMATCH. Code 1086 (`SESSION_EXPIRED`) belonged to legacy in-house sessions and is removed with those routes; it is not free and must not be reused. Codes 1004, 1023, 1024, 1026 and 1027 belonged to legacy login, token refresh, OAuth and password reset and are removed with those routes; they are not free and must not be reused. Code 1003 (`INVALID_CREDENTIALS`) stays: `getBusinessMemberProfile` returns 401 1003 when the JWT `sub` is not a numeric user id. Codes 1089–1092 belonged to weekly attendance periods, which were never implemented, and are removed with those routes. Code 1095 remains a separate PLANNING_ALREADY_EXISTS entry and is unchanged here. Code 1115 is raised by the BFF attendance screens (invalid `week` or `date`, or a `date` outside `week`); no Main API operation returns it.

        Codes 1116–1119 belong to notifyShiftClockIn and 1120–1125 to the planning generation operations (Main API 0.0.88). Codes 1099 and 1100 are used by the backend enum but are not documented here yet; they are not free and must not be reused.

        Codes 1101 (`INVALID_REPORT_USER_IDS`: a report `userIds` value without a membership row in the business, active or removed) and 1104 (`EMPLOYEE_WITHOUT_ACTIVE_CONTRACT`: an EMPLOYEE with the required permission but no contract in force) are documented from Main API 0.0.115. Code 1103 now means a worked-hours report `type` other than PDF or CSV (CSV added in 0.0.115; EXCEL removed); its message changes accordingly. The worked-hours report operations reuse 1111 (`INVALID_USER_IDS`) for more than 50 `userIds`, the cap already used by the BFF attendance screens.

        Code 1126 is raised by the BFF member profile (`getBusinessMemberProfile`, BFF 0.0.69) when the user is not an active member of the business; no Main API operation returns it. Code 1011 (`USER_INVITATION_NOT_OWNER`) stays in the backend enum, but no operation returns it: the business invitation operations reject a non-owner with 1020.

        Codes 1127–1140 belong to shift exchange requests and schedule change requests (Main API 0.0.94, passed through by BFF 0.0.82). Code 1088 (`PLANNING_VERSION_MISMATCH`) stays the draft scheduled-shift replacement code and is not reused for these requests. Code 1129 (`PLANNING_VERSION_CONFLICT`) is the snapshot check of this contract. A request the caller must not see uses 1134 or 1135, the same body as a missing id.

        Code 1141 belongs to resendBusinessInvitation (Main API 0.0.95, passed through by BFF 0.0.83 `managerResendInvitation`): an invitation can be resent at most once every 10 minutes, and the 429 carries a `Retry-After` header.

        Codes 1142 and 1143 are retained from the approved Main API 0.0.96 inbox catalog: cursor validation for the legacy individual incident list and the legacy confirmation action. This delivery retains only the legacy incident list; it adds no confirmation route. Codes 1144–1149 are allocated for the proposed Main API 0.0.97 / BFF 0.0.86 grouped-incident contracts: invalid group request, invalid scoped cursor, group not found, stale revision/canonicalization, no longer open and lock timeout. Code 1150 is a proposed protection error for future history-mutating writers only; neither GET nor group justification emits it. Future correction, rejection, resolution/reconciliation and other writers must adopt history protection before activation; see `docs/attendance-incident-groups.md`.

        Code 1020 (`USER_NOT_OWNER_OF_BUSINESS`) stays in the catalog as the business authorization error (Main API 0.0.103). Owner-only operations keep the message `user is not the owner of business`. An operation that requires a business permission uses the same code with the message `user lacks permission <PERMISSION> in business`. A caller that is not a member also gets 1020. Codes 1151–1154 belong to access roles.

        Codes 1155 and 1156 belong to business plans (Main API 0.0.106, BFF 0.0.96). 1155 is returned by any operation owned by a business feature that is unavailable for the business (see the API description), including when the caller's access role grants the permission; the BFF propagates it and also raises it early. It is not repeated in each operation's `x-functional-errors`.

        Code 1157 (`INVALID_ATTENDANCE_INCIDENT_DATE_RANGE`, 400, `attendance incident date range is invalid`) belongs to `getCurrentUserAttendanceIncidentDailyCounts` (Main API 0.0.118). It is returned when `from` is after `to` or the inclusive range is longer than 42 dates. A missing or syntactically invalid date stays a plain 400 without this code. 1115 stays the BFF attendance-screen week/date code and is not reused here; 1025, 1057 and 1120 stay the worklog, contract and planning-generation range codes.
