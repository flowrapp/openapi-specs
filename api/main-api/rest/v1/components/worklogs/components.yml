components:
  schemas:
    OpenWorklogUserDTO:
      type: object
      description: >
        A requested member who has an open worklog in the business. The worklog itself is not
        returned.
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          description: User identifier with an open worklog in this business
          example: 41
      required: [userId]

    WorklogBreakStatusDTO:
      type: string
      description: Current effectiveness of a worklog break. VOIDED breaks remain queryable but do not deduct worked time.
      enum: [EFFECTIVE, VOIDED]
      example: EFFECTIVE

    WorklogOperationalStateDTO:
      type: string
      description: Derived operational state of a worklog. This value is read-only and cannot be submitted by clients.
      enum: [WORKING, ON_BREAK, CLOSED]
      example: WORKING

    WorklogBreakDTO:
      type: object
      description: Explicit break interval belonging to a worklog.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the break.
          example: 456
        worklogId:
          type: integer
          format: int64
          description: Identifier of the parent worklog.
          example: 123
        startedAt:
          type: string
          format: date-time
          description: Effective break-start timestamp.
          example: "2025-07-29T12:00:00+00:00"
        endedAt:
          type: ['string', 'null']
          format: date-time
          description: Effective break-end timestamp, or null while the break is open.
          example: "2025-07-29T12:30:00+00:00"
        status:
          $ref: '#/components/schemas/WorklogBreakStatusDTO'
        version:
          type: integer
          format: int64
          description: Optimistic-lock version of the break.
          example: 0
        createdAt:
          type: string
          format: date-time
          description: Server time when the break was created.
          example: "2025-07-29T12:00:01+00:00"
        updatedAt:
          type: string
          format: date-time
          description: Server time when the break was last changed.
          example: "2025-07-29T12:30:01+00:00"
      required:
        - id
        - worklogId
        - startedAt
        - status
        - version
        - createdAt
        - updatedAt

    StartWorklogBreakRequestDTO:
      type: object
      description: Idempotent request to start an explicit break. The server clock is used when startedAt is omitted.
      additionalProperties: false
      properties:
        idempotencyId:
          type: string
          format: uuid
          description: Client-generated command identifier reused when retrying the same break start.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        startedAt:
          type: string
          format: date-time
          description: Observed break-start timestamp; omitted to use the server clock.
          example: "2025-07-29T12:00:00+00:00"
      required:
        - idempotencyId

    EndWorklogBreakRequestDTO:
      type: object
      description: Idempotent request to end an explicit break. The server clock is used when endedAt is omitted.
      additionalProperties: false
      properties:
        idempotencyId:
          type: string
          format: uuid
          description: Client-generated command identifier reused when retrying the same break end.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        endedAt:
          type: string
          format: date-time
          description: Observed break-end timestamp; omitted to use the server clock.
          example: "2025-07-29T12:30:00+00:00"
      required:
        - idempotencyId

    WorklogBreakCorrectionRequestDTO:
      type: object
      description: Replacement interval and mandatory reason for correcting a completed break.
      additionalProperties: false
      properties:
        startedAt:
          type: string
          format: date-time
          description: Replacement break-start timestamp.
          example: "2025-07-29T11:55:00+00:00"
        endedAt:
          type: string
          format: date-time
          description: Replacement break-end timestamp.
          example: "2025-07-29T12:25:00+00:00"
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Non-blank plain-text reason for the correction.
          example: "The break started five minutes earlier than recorded."
      required:
        - startedAt
        - endedAt
        - reason

    WorklogBreakVoidRequestDTO:
      type: object
      description: Mandatory reason for voiding a completed break without deleting its history.
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Non-blank plain-text reason for voiding the break.
          example: "The break was recorded accidentally."
      required:
        - reason

    WorklogLocationDTO:
      type: object
      description: Device location captured when clocking in or out.
      additionalProperties: false
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 36.19
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -5.99
      required: [latitude, longitude]

    ClockInRequestDTO:
      type: object
      description: Request object for clocking in. `idempotencyId` is required.
      additionalProperties: false
      properties:
        clockIn:
          type: string
          format: date-time
          description: Timestamp for clock-in (optional, server uses current time if omitted)
          example: "2025-07-29T08:30:00+00:00"
        location:
          description: Device location at clock-in; may be omitted or null if unavailable.
          oneOf:
            - $ref: '#/components/schemas/WorklogLocationDTO'
            - type: 'null'
          example: {latitude: 36.19, longitude: -5.99}
        idempotencyId:
          type: string
          format: uuid
          description: Client-generated command identifier reused when retrying the same clock-in.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        note:
          type: ['string', 'null']
          maxLength: 500
          description: Optional current note for the worklog.
          example: "Opening shift"
      required:
        - idempotencyId

    ClockOutRequestDTO:
      type: object
      description: Request object for clocking out. `idempotencyId` is required.
      additionalProperties: false
      properties:
        clockOut:
          type: string
          format: date-time
          description: Timestamp for clock-out (optional, server uses current time if omitted)
          example: "2025-07-29T17:30:00+00:00"
        location:
          description: Device location at clock-out; may be omitted or null if unavailable.
          oneOf:
            - $ref: '#/components/schemas/WorklogLocationDTO'
            - type: 'null'
          example: {latitude: 36.19, longitude: -5.99}
        idempotencyId:
          type: string
          format: uuid
          description: Client-generated command identifier reused when retrying the same clock-out.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        note:
          type: ['string', 'null']
          maxLength: 500
          description: Optional current note for the worklog.
          example: "Closing shift"
      required:
        - idempotencyId

    WorkLogUpdateRequestDTO:
      type: object
      description: Request object for updating a worklog with clock-in and clock-out times
      additionalProperties: false
      properties:
        clockIn:
          type: string
          format: date-time
          description: Timestamp for clock-in
          example: "2025-07-29T08:30:00+00:00"
        clockOut:
          type: ['string', 'null']
          format: date-time
          description: Timestamp for clock-out
          example: "2025-07-29T17:30:00+00:00"
        note:
          type: ['string', 'null']
          maxLength: 500
          description: Optional current note for the worklog.
          example: "Corrected after a missed punch"

    WorklogCorrectionRequestDTO:
      type: object
      description: Worker or management correction. At least one worklog field must change.
      additionalProperties: false
      properties:
        clockIn:
          type: string
          format: date-time
          description: Replacement clock-in timestamp.
          example: "2025-07-29T08:30:00+00:00"
        clockOut:
          type: ['string', 'null']
          format: date-time
          description: Replacement clock-out timestamp; null keeps or clears the current value according to the command semantics.
          example: "2025-07-29T17:30:00+00:00"
        note:
          type: ['string', 'null']
          maxLength: 500
          description: Replacement current note; null clears the note.
          example: "Missed clock-in corrected"
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Non-blank plain-text reason for the correction.
          example: "The worker forgot to clock in before opening the store."
      required:
        - reason

    WorklogRejectionRequestDTO:
      type: object
      description: Reason for rejecting a worklog under review.
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Non-blank plain-text reason for the rejection.
          example: "The submitted interval does not match the shift."
      required:
        - reason

    WorklogSettingsUpdateRequestDTO:
      type: object
      description: Owner-only business worklog settings.
      additionalProperties: false
      properties:
        longOpenAfterMinutes:
          type: integer
          format: int32
          exclusiveMinimum: 0
          exclusiveMaximum: 1440
          description: Minutes after which an open worklog requires review.
          example: 720
      required:
        - longOpenAfterMinutes

    WorklogSettingsResponseDTO:
      type: object
      description: Effective worklog settings for a business.
      properties:
        businessId:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the business.
          example: 101
        longOpenAfterMinutes:
          type: integer
          format: int32
          description: Minutes after which an open worklog requires review.
          example: 720
      required:
        - businessId
        - longOpenAfterMinutes

    WorklogOriginDTO:
      type: string
      description: Origin of a recorded punch. UNKNOWN is used only for migrated historical data.
      enum: [MANUAL, GEOFENCE, QR, AUTOMATIC, ADMIN, UNKNOWN]
      example: MANUAL

    WorklogReviewStatusDTO:
      type: string
      description: >
        Review state of the worklog. The existing states stay: CONFIRMED and
        APPROVED are the states worked-hours reports count; PENDING_REVIEW waits
        for a person and is excluded from those reports; REJECTED is kept for
        audit and is excluded. PENDING_RECONCILIATION is the new state entered
        when a worklog is closed, before the attendance reconciliation consumer
        has run. It uses the same PENDING_ prefix as PENDING_REVIEW and the same
        reconciliation vocabulary as the attendance match, and it is a different
        wait: nothing has been decided yet, so it is not already PENDING_REVIEW.
        Listings return a worklog in this state. Worked-hours reports do not
        count it. When reconciliation finishes, the consumer moves it to
        CONFIRMED if nothing is left to review, or to PENDING_REVIEW if an open
        attendance incident remains. Only CONFIRMED, and later APPROVED, count
        in reports.
      enum: [CONFIRMED, PENDING_RECONCILIATION, PENDING_REVIEW, APPROVED, REJECTED]
      example: CONFIRMED

    WorkLogResponseDTO:
      type: object
      description: Response object containing worklog information
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the worklog
          example: 123
        userId:
          type: integer
          format: int64
          description: Identifier of the user who created the worklog
          example: 1
        businessId:
          type: integer
          format: int64
          description: Identifier of the business where the worklog was recorded
          example: 101
        clockIn:
          type: string
          format: date-time
          description: Timestamp when the user clocked in
          example: "2025-07-29T08:30:00+00:00"
        clockOut:
          type: ['string', 'null']
          format: date-time
          description: Timestamp when the user clocked out (null if not clocked out yet)
          example: "2025-07-29T17:30:00+00:00"
        clockInOrigin:
          $ref: '#/components/schemas/WorklogOriginDTO'
        clockOutOrigin:
          oneOf:
            - $ref: '#/components/schemas/WorklogOriginDTO'
            - type: 'null'
        reviewStatus:
          $ref: '#/components/schemas/WorklogReviewStatusDTO'
        note:
          type: ['string', 'null']
          maxLength: 500
          description: Current worklog note, if any.
        version:
          type: integer
          format: int64
          description: Optimistic-lock version of the worklog.
          example: 0
        createdAt:
          type: string
          format: date-time
          description: Server time when the worklog was created.
          example: "2025-07-29T06:30:00+00:00"
        updatedAt:
          type: string
          format: date-time
          description: Server time when the worklog was last updated.
          example: "2025-07-29T15:30:00+00:00"
        breaks:
          type: array
          description: Current break children in creation order, including effective and voided breaks.
          items:
            $ref: '#/components/schemas/WorklogBreakDTO'
        operationalState:
          $ref: '#/components/schemas/WorklogOperationalStateDTO'
      required:
        - id
        - userId
        - businessId
        - clockIn
        - clockInOrigin
        - reviewStatus
        - version
        - createdAt
        - updatedAt
        - breaks
        - operationalState

    WorklogChangeActionDTO:
      type: string
      description: >
        Kind of change recorded in the worklog history. CORRECTED is a correction of clock-in
        or clock-out (by the worker or the owner). REJECTED is the owner's rejection (old and new
        times are equal). BREAK_CORRECTED and BREAK_VOIDED change exactly one break. AUTO_CLOSED is
        the system closing a worklog left open for 24 hours. MEMBER_REMOVED_CLOSE is the close of an
        open worklog when its worker is removed from the business. Clients must tolerate unknown values.
      enum: [CORRECTED, REJECTED, BREAK_CORRECTED, BREAK_VOIDED, AUTO_CLOSED, MEMBER_REMOVED_CLOSE]
      example: CORRECTED

    WorklogBreakChangeDTO:
      type: object
      description: >
        The one break touched by a BREAK_CORRECTED or BREAK_VOIDED change. In BREAK_VOIDED the new
        start and end are null.
      properties:
        breakId:
          type: integer
          format: int64
          minimum: 1
          description: Identifier of the changed break
          example: 77
        oldStartedAt:
          type: string
          format: date-time
          description: Break start before the change
          example: "2026-10-30T11:00:00Z"
        oldEndedAt:
          type: ['string', 'null']
          format: date-time
          description: Break end before the change
          example: "2026-10-30T11:30:00Z"
        newStartedAt:
          type: ['string', 'null']
          format: date-time
          description: Break start after the change; null when the break was voided
          example: "2026-10-30T11:05:00Z"
        newEndedAt:
          type: ['string', 'null']
          format: date-time
          description: Break end after the change; null when the break was voided
          example: "2026-10-30T11:20:00Z"
      required: [breakId, oldStartedAt, oldEndedAt, newStartedAt, newEndedAt]

    WorklogChangeDTO:
      type: object
      description: >
        One immutable entry of a worklog's change history, read from the append-only
        worklog_changes table. All times are instants in UTC.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Identifier of the change
          example: 1201
        worklogId:
          type: integer
          format: int64
          minimum: 1
          description: Worklog the change belongs to
          example: 3051
        userId:
          type: integer
          format: int64
          minimum: 1
          description: Worker who owns the worklog
          example: 41
        businessId:
          type: integer
          format: int64
          minimum: 1
          description: Business of the worklog
          example: 7
        action:
          $ref: '#/components/schemas/WorklogChangeActionDTO'
        oldClockIn:
          type: string
          format: date-time
          description: Clock-in before the change
          example: "2026-10-30T08:00:00Z"
        newClockIn:
          type: string
          format: date-time
          description: Clock-in after the change
          example: "2026-10-30T08:15:00Z"
        oldClockOut:
          type: ['string', 'null']
          format: date-time
          description: Clock-out before the change; null when the worklog was still open (AUTO_CLOSED, MEMBER_REMOVED_CLOSE)
          example: "2026-10-30T16:00:00Z"
        newClockOut:
          type: ['string', 'null']
          format: date-time
          description: Clock-out after the change
          example: "2026-10-30T16:00:00Z"
        breakChange:
          description: The changed break; present only for BREAK_CORRECTED and BREAK_VOIDED, null otherwise
          oneOf:
            - $ref: '#/components/schemas/WorklogBreakChangeDTO'
            - type: 'null'
          example: null
        authorId:
          type: ['integer', 'null']
          format: int64
          minimum: 1
          description: User who made the change; null for system actions such as AUTO_CLOSED
          example: 12
        reason:
          type: ['string', 'null']
          maxLength: 500
          description: Reason given for the change; required for user actions, may be null for system actions
          example: "Forgot to clock in on arrival."
        occurredAt:
          type: string
          format: date-time
          description: When the change was recorded
          example: "2026-10-30T18:02:11Z"
        confirmation:
          description: >
            Worker confirmation of this change (Main API 0.0.96), or null when the change has
            none. Only a CORRECTED or REJECTED change made through management
            (`correctBusinessWorklog`, `rejectWorklog`) by an author other than the worker, and
            recorded after the 0.0.96 rollout, has one; it is created PENDING in the same
            transaction as the change. Null for every other change: a worker's own correction,
            break corrections and voids, AUTO_CLOSED, MEMBER_REMOVED_CLOSE, and every change
            recorded before the rollout (there is no backfill). Null never means that the worker
            reviewed the change or that the worker agrees with it; it only means that no
            confirmation was requested.
          oneOf:
            - $ref: '#/components/schemas/WorklogChangeConfirmationDTO'
            - type: 'null'
          example: null
      required: [id, worklogId, userId, businessId, action, oldClockIn, newClockIn, oldClockOut, newClockOut, breakChange, authorId, reason, occurredAt, confirmation]

    WorklogChangeConfirmationStatusDTO:
      type: string
      description: >
        State of a worker confirmation of one management change. PENDING: the worker has not
        answered yet. ACKNOWLEDGED: the worker states that they saw and reviewed the change.
        DISPUTED: the worker records that they disagree with the change. ACKNOWLEDGED and
        DISPUTED are terminal. Neither is a legal consent or a legal claim, and neither changes
        the worklog, its `reviewStatus`, reports, or attendance incidents. New values may be
        added; clients must tolerate unknown values.
      enum: [PENDING, ACKNOWLEDGED, DISPUTED]
      example: PENDING

    WorklogChangeConfirmationDTO:
      type: object
      description: >
        Persistent worker confirmation of exactly one worklog change (unique per
        `worklogChangeId`; its identity is the parent change). The worker is the immutable
        `userId` of the change. Created PENDING with version 0 by management CORRECTED or
        REJECTED; answered once with `respondToWorklogChangeConfirmation`, which moves it to
        ACKNOWLEDGED or DISPUTED and increments `version`. It never gates reports, never reverts
        the change, never changes the worklog `reviewStatus` and never resolves an attendance
        incident.
      properties:
        status:
          $ref: '#/components/schemas/WorklogChangeConfirmationStatusDTO'
        comment:
          type: ['string', 'null']
          minLength: 1
          maxLength: 500
          description: >
            Optional worker comment, trimmed, at most 500 characters. Null while PENDING and
            when the worker answered without a comment. Allowed with ACKNOWLEDGED and with
            DISPUTED; a DISPUTED answer does not require it.
          example: "I left at 17:00, not at 16:30."
        respondedBy:
          type: ['integer', 'null']
          format: int64
          minimum: 1
          description: User who answered (always the worker of the change); null while PENDING.
          example: 41
        respondedAt:
          type: ['string', 'null']
          format: date-time
          description: When the worker answered; null while PENDING.
          example: "2026-10-31T08:12:40Z"
        version:
          type: integer
          format: int64
          minimum: 0
          description: >
            Optimistic-lock version of the confirmation: 0 while PENDING, incremented by the
            answer. Send it back as `version` in `respondToWorklogChangeConfirmation`.
          example: 0
      required: [status, comment, respondedBy, respondedAt, version]
      examples:
        - status: PENDING
          comment: null
          respondedBy: null
          respondedAt: null
          version: 0
        - status: DISPUTED
          comment: "I left at 17:00, not at 16:30."
          respondedBy: 41
          respondedAt: "2026-10-31T08:12:40Z"
          version: 1

    WorklogChangeConfirmationRequestDTO:
      type: object
      description: >
        Worker answer to one PENDING confirmation. `comment` is trimmed; when supplied it must
        be non-empty after trimming and at most 500 characters, otherwise 400. Omitted or null
        means no comment. A body that does not validate (unknown `status`, `PENDING`, blank
        or too long `comment`, missing or negative `version`) is a plain 400 without a
        functional code.
      additionalProperties: false
      properties:
        status:
          type: string
          description: The answer. PENDING cannot be sent.
          enum: [ACKNOWLEDGED, DISPUTED]
          example: DISPUTED
        comment:
          type: ['string', 'null']
          minLength: 1
          maxLength: 500
          description: Optional comment, also allowed with ACKNOWLEDGED. Not required for DISPUTED.
          example: "I left at 17:00, not at 16:30."
        version:
          type: integer
          format: int64
          minimum: 0
          description: The `confirmation.version` the worker read (0 for a PENDING confirmation).
          example: 0
      required: [status, version]
