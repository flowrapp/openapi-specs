geofenceDeviceCredentials:
  collection:
    post:
      summary: Issue a geofence device credential
      description: >-
        Issues a device-scoped credential that can only submit geofence events. The credential
        is returned once and must be stored securely by the client. Issuing a credential replaces
        any previous credential for the same user and device.
      tags:
        - Users
      operationId: issueGeofenceDeviceCredential
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/geofenceEvents/components.yml#/components/schemas/IssueGeofenceDeviceCredentialRequestDTO'
            example:
              deviceId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      responses:
        '201':
          description: Geofence device credential issued
          content:
            application/json:
              schema:
                $ref: '../../components/geofenceEvents/components.yml#/components/schemas/GeofenceDeviceCredentialDTO'
              example:
                token: "6d2WwR3wVh0mAE8k0x5D6WzPjVgYZtld4bMHQfK2qCo"
                issuedAt: "2026-11-08T12:00:00Z"
                expiresAt: "2027-02-06T12:00:00Z"
        '401':
          description: Missing or invalid bearer token

    delete:
      summary: Revoke a geofence device credential
      description: Revokes the geofence device credential for this device. Repeated revocations are safe.
      tags:
        - Users
      operationId: revokeGeofenceDeviceCredential
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: query
          required: true
          description: Device whose geofence credential should be revoked
          schema:
            type: string
            format: uuid
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      responses:
        '204':
          description: Geofence device credential revoked or already absent
        '401':
          description: Missing or invalid bearer token

  device-event:
    put:
      summary: Register a geofence event from a device
      description: >-
        Idempotently registers a geofence event using a device-scoped credential. This route
        accepts only `X-Geofence-Credential`, not bearer authentication. Never log the credential
        header or its value.
      tags:
        - Businesses
      operationId: upsertDeviceGeofenceEvent
      security:
        - geofenceDeviceCredential: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business whose geofence emitted the event
          schema:
            type: integer
            format: int64
        - name: eventId
          in: path
          required: true
          description: Client-generated identifier used to make event delivery idempotent
          schema:
            type: string
            format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      requestBody:
        required: true
        description: Geofence event data captured by the device
        content:
          application/json:
            schema:
              $ref: '../../components/geofenceEvents/components.yml#/components/schemas/GeofenceEventRequestDTO'
            example:
              deviceId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
              type: DWELL
              occurredAt: "2026-08-06T08:30:00Z"
      responses:
        '201':
          description: Geofence event created successfully
        '204':
          description: An identical geofence event was already registered
        '400':
          description: Invalid geofence event
        '401':
          description: Missing, invalid, expired, revoked or device-mismatched geofence credential
        '403':
          description: User is disabled or is not a member of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                USER_IS_NOT_MEMBER_OF_BUSINESS:
                  summary: "1015 - user is not member of business"
                  value:
                    status: 403
                    detail: "1015 - user is not member of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
        '409':
          description: The event ID is already associated with a different payload
      x-functional-errors:
        - 1006
        - 1015
