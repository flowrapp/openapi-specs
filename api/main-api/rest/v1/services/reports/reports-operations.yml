reports:
  business-reports:
    get:
      summary: Get business reports
      description: |
        Retrieves daily time reports for a specific business within a date range.
        Returns raw daily seconds per user, suitable for aggregation into weekly, monthly, or custom period totals.
        Seconds include only worklogs whose reviewStatus is CONFIRMED or APPROVED.
        A closed worklog in PENDING_RECONCILIATION does not count until attendance
        reconciliation moves it to CONFIRMED or PENDING_REVIEW. PENDING_REVIEW does
        not count either. The worklog list still returns PENDING_RECONCILIATION.
        Caller must be the owner of the business.
      tags:
        - Reports
      operationId: getBusinessReports
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            example: 123
        - name: from
          in: query
          required: true
          description: Start date of the range (inclusive, format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-07-01"
        - name: to
          in: query
          required: true
          description: End date of the range (inclusive, format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-07-31"
        - name: userId
          in: query
          required: false
          description: Filter by a specific user ID within the business
          schema:
            type: integer
            format: int64
            example: 12
      responses:
        '200':
          description: Reports retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/reports/components.yml#/components/schemas/ReportResponseDTO'
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                USER_NOT_OWNER_OF_BUSINESS:
                  summary: "1020 - user is not the owner of business"
                  value:
                    status: 403
                    detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
      x-functional-errors:
        - 1006
        - 1020

  business-worked-hours-report-pdf:
    get:
      summary: Export business worked hours report as PDF or Excel
      description: |
        Generates and downloads a PDF or Excel (.xlsx) report containing worked-hours information for the selected employees in the business within the requested date range.
        If userIds is omitted or empty, all employees in the business are included. Every supplied user ID must belong to the requested business.
        The type parameter selects the output format and defaults to PDF. The .pdf URL suffix is retained for compatibility, including when Excel is requested.
        The range is day-based and inclusive. This endpoint is intended for annual reports, but supports any valid date range.
        Seconds include only worklogs whose reviewStatus is CONFIRMED or APPROVED.
        A closed worklog in PENDING_RECONCILIATION does not count until attendance
        reconciliation moves it to CONFIRMED or PENDING_REVIEW. PENDING_REVIEW does not count either.
        Caller must have privileged access to the business, either OWNER or MANAGER.
      tags:
        - Reports
      operationId: exportBusinessWorkedHoursReportPdf
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            example: 123
        - name: from
          in: query
          required: true
          description: Start date of the report range, inclusive (format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-01-01"
        - name: to
          in: query
          required: true
          description: End date of the report range, inclusive (format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-12-31"
        - name: type
          in: query
          required: false
          description: Output format of the report. EXCEL generates an .xlsx workbook.
          schema:
            type: string
            enum: [PDF, EXCEL]
            default: PDF
            example: EXCEL
        - name: userIds
          in: query
          required: false
          description: User IDs to include, all belonging to this business. Omit or leave empty to include all employees. Repeat the parameter for multiple IDs (userIds=12&userIds=34).
          style: form
          explode: true
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: integer
              format: int64
            example: [12, 34]
      responses:
        '200':
          description: Report generated successfully. The response media type and attachment extension match the requested type.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Attachment filename ending in .pdf for PDF or .xlsx for EXCEL
              schema:
                type: string
                example: 'attachment; filename="worked-hours-report-2025-01-01-2025-12-31.pdf"'
        '400':
          description: Invalid date range, report type, or user IDs (including users outside the requested business)
        '401':
          description: Unauthorized
        '403':
          description: Current user does not have privileged access to the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
      x-functional-errors:
        - 1006

  request-business-worked-hours-report:
    post:
      summary: Request asynchronous business worked hours report generation
      description: |
        Accepts a request to generate a PDF or Excel (.xlsx) worked-hours report for the selected
        employees in the business. If userIds is omitted or empty, all employees in the business
        are included. Every supplied user ID must belong to the requested business. The report is
        generated asynchronously; this response only confirms that the request was accepted.
        Seconds include only worklogs whose reviewStatus is CONFIRMED or APPROVED.
        A closed worklog in PENDING_RECONCILIATION does not count until attendance
        reconciliation moves it to CONFIRMED or PENDING_REVIEW. PENDING_REVIEW does not count either.
        Caller must be the owner of the business.
      tags:
        - Reports
      operationId: requestBusinessWorkedHoursReport
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                  description: Start date of the report range, inclusive
                  example: "2025-01-01"
                to:
                  type: string
                  format: date
                  description: End date of the report range, inclusive
                  example: "2025-12-31"
                type:
                  type: string
                  enum: [PDF, EXCEL]
                  default: PDF
                  description: Output format of the report
                userIds:
                  type: array
                  description: User IDs to include. Omit or leave empty to include all employees.
                  items:
                    type: integer
                    format: int64
                  example: [12, 34]
              required: [from, to]
            example:
              from: "2025-01-01"
              to: "2025-12-31"
              type: PDF
              userIds: [12, 34]
      responses:
        '202':
          description: Report generation request accepted; no report is returned in this response
        '400':
          description: Invalid date range, report type, or user IDs (including users outside the requested business)
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                USER_NOT_OWNER_OF_BUSINESS:
                  summary: "1020 - user is not the owner of business"
                  value:
                    status: 403
                    detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
      x-functional-errors: [1006, 1020]

  user-reports:
    get:
      summary: Get current user's reports
      description: |
        Retrieves daily time reports for the authenticated user within a date range.
        Returns raw daily seconds, suitable for aggregation into weekly, monthly, or custom period totals.
        Always scoped to the current user's own data.
      tags:
        - Reports
      operationId: getUserReports
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Start date of the range (inclusive, format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-07-01"
        - name: to
          in: query
          required: true
          description: End date of the range (inclusive, format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-07-31"
        - name: businessId
          in: query
          required: false
          description: Filter by a specific business ID
          schema:
            type: integer
            format: int64
            example: 123
      responses:
        '200':
          description: Reports retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/reports/components.yml#/components/schemas/ReportResponseDTO'
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized
