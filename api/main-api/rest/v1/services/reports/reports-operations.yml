reports:
  business-reports:
    get:
      summary: Get business reports
      description: |
        Retrieves daily time reports for a specific business within a date range.
        Returns daily seconds per user and business-local day, suitable for aggregation into weekly, monthly, or custom period totals.
        Each closed worklog is attributed to the business-local calendar date of its clock-in, in the business time zone,
        and its seconds are net of effective breaks (the same reportable-seconds rule as worked-hours reports).
        Open worklogs never count.
        When reviewStatus is omitted, only worklogs whose reviewStatus is CONFIRMED or APPROVED count, exactly as before.
        A closed worklog in PENDING_RECONCILIATION does not count until attendance
        reconciliation moves it to CONFIRMED or PENDING_REVIEW. PENDING_REVIEW does
        not count either. The worklog list still returns PENDING_RECONCILIATION.
        When reviewStatus is sent, only worklogs in the requested states count, computed with the same day attribution
        and break deduction. For example, reviewStatus=PENDING_RECONCILIATION&reviewStatus=PENDING_REVIEW returns the
        seconds still waiting for reconciliation or review.
        Caller must be an OWNER or MANAGER of the business.
      tags:
        - Reports
      operationId: getBusinessReports
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            example: 123
        - name: from
          in: query
          required: true
          description: Start date of the range (inclusive, format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-07-01"
        - name: to
          in: query
          required: true
          description: End date of the range (inclusive, format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-07-31"
        - name: userId
          in: query
          required: false
          description: "Filter by one user of the business. Kept for compatibility; prefer userIds. When both are sent, userId is treated as one more entry of userIds."
          schema:
            type: integer
            format: int64
            example: 12
        - name: userIds
          in: query
          required: false
          style: form
          explode: true
          description: "Repeat the parameter for several users (userIds=12&userIds=34). Omit it to include every user of the business. Ids with no worklogs in the range, or that are not users of the business, return no rows."
          schema:
            type: array
            uniqueItems: true
            items:
              type: integer
              format: int64
              minimum: 1
            example: [12, 34]
        - name: jobRoleId
          in: query
          required: false
          description: >
            Restricts the seconds to work under this job role, filtered server-side. The job role of a scheduled shift is the one stored on the shift when it was created (scheduled_shifts.job_role_id), so a past day keeps the job role in force that day even if the member's contract changed later. Worklogs count under the job role of the scheduled shift they are matched to; worklogs without a scheduled shift (unscheduled or ambiguous) count under the job role of the member's contract in force on that business-local day. Combined with userId and userIds using AND. A job role with no match, or not of this business, returns no rows.
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 10
        - name: reviewStatus
          in: query
          required: false
          style: form
          explode: true
          description: "One or more review states whose seconds are returned. Repeating the parameter adds a state. When omitted, CONFIRMED and APPROVED count, as before."
          schema:
            type: array
            items:
              $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogReviewStatusDTO'
            example: [PENDING_RECONCILIATION, PENDING_REVIEW]
      responses:
        '200':
          description: Reports retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/reports/components.yml#/components/schemas/ReportResponseDTO'
        '400':
          description: Invalid request parameters (date range, user IDs or review status)
        '401':
          description: Unauthorized
        '403':
          description: Current user is not an owner or manager of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                USER_NOT_OWNER_OF_BUSINESS:
                  summary: "1020 - user is not an owner or manager of the business"
                  value:
                    status: 403
                    detail: "1020 - user is not an owner or manager of the business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
      x-functional-errors:
        - 1006
        - 1020

  business-worked-hours-report-pdf:
    get:
      summary: Export the business worked hours report as PDF or CSV
      description: |
        Generates and returns, in the response body, the worked-hours report of the selected people of the
        business for the requested period, as one PDF document or one CSV file (type). No email is sent and
        nothing is stored: every call renders the current data (synchronous, no server cache).
        Authorization: the business permission REPORTS_EXPORT (see the API description). The OWNER holds it; an
        EMPLOYEE holds it through its access role. Without it: 403 (1020, `user lacks permission REPORTS_EXPORT
        in business`); an EMPLOYEE without a contract in force: 403 (1104). REPORTS_EXPORT belongs to no business
        feature: every plan.
        People: if userIds is omitted or empty, every member of the business active at some point of the period
        (removed members included until their removal). With userIds, exactly those people, current or former
        members (a removed membership is still valid); an id without a membership row in the business returns 400
        (1101). At most 50 distinct ids: 400 (1111). Several people produce one single file (one PDF with a
        section per person and a centre summary page, or one CSV), never a ZIP.
        The range is day-based and inclusive. periodType (MONTH, YEAR or RANGE, default RANGE) selects the
        layout and how from and to are validated (400 1114 when they do not match). The owner reports screen
        uses MONTH only.
        A period that ends after today is accepted and truncated by the server to today in the business time
        zone (provisional report: the PDF says so and the filename carries the date); a period whose from is after
        today returns 400 (1025).
        Totals include only closed worklogs whose reviewStatus is CONFIRMED or APPROVED. PENDING_REVIEW and
        PENDING_RECONCILIATION do not count until reviewed or reconciled; in the PDF they are listed in annex B,
        in the CSV they are rows with «Cuenta en el total» = No. REJECTED and open worklogs count nowhere.
        The month total of the PDF equals confirmedSeconds of getBusinessWorkedHoursMonths for the same month and
        userIds. See WorkedHoursReportTypeDTO for the CSV columns and format.
        The `.pdf` suffix of the path is kept for both types; the media type and the filename extension follow
        type.
      tags:
        - Reports
      operationId: exportBusinessWorkedHoursReportPdf
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            example: 123
        - name: from
          in: query
          required: true
          description: Start date of the report range, inclusive (format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-01"
        - name: to
          in: query
          required: true
          description: End date of the report range, inclusive (format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-31"
        - name: periodType
          in: query
          required: false
          description: Period type of the report. Omit it for RANGE. MONTH requires from and to to cover exactly one calendar month and YEAR exactly one calendar year.
          schema:
            $ref: '../../components/reports/components.yml#/components/schemas/WorkedHoursReportPeriodTypeDTO'
        - name: type
          in: query
          required: false
          description: Output format, PDF (default) or CSV. See WorkedHoursReportTypeDTO.
          schema:
            $ref: '../../components/reports/components.yml#/components/schemas/WorkedHoursReportTypeDTO'
        - name: userIds
          in: query
          required: false
          description: People to include, current or former members of this business. Omit or leave empty for the whole business. Repeat the parameter for several ids (userIds=12&userIds=34). At most 50 distinct ids.
          style: form
          explode: true
          allowEmptyValue: true
          schema:
            type: array
            maxItems: 50
            items:
              type: integer
              format: int64
            example: [12, 34]
      responses:
        '200':
          description: Report generated. The media type and the filename extension match type.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: |
                `attachment; filename="registro-jornada-<period>-<scope>.<pdf|csv>"`, ASCII only. The PDF and the
                CSV of the same request differ only in the extension.
                - period: `YYYY-MM` for MONTH; `YYYY` for YEAR; `<from>-<to>` (YYYY-MM-DD) for RANGE. When the
                  period is truncated to today (provisional), `-hasta-<today YYYY-MM-DD>` is appended, e.g.
                  `2026-11-hasta-2026-11-12`.
                - scope: `todo-el-negocio` without userIds; with one id, the person's display name lowercased,
                  accents removed, every run of other characters replaced by `-`, at most 40 characters (`persona-<id>`
                  when the PDF rule gives no name); with two or more distinct ids, `<N>-personas`.
                Examples: `registro-jornada-2026-10-todo-el-negocio.pdf`, `registro-jornada-2026-10-lucia-ruiz.csv`,
                `registro-jornada-2026-11-hasta-2026-11-12-3-personas.pdf`.
              schema:
                type: string
                example: 'attachment; filename="registro-jornada-2026-10-todo-el-negocio.pdf"'
            Content-Length:
              description: Size of the file in bytes
              schema:
                type: integer
                format: int64
                example: 83995
        '400':
          description: Invalid date range or from after today (1025), period type mismatch (1114), report type (1103), an id without membership in the business (1101) or more than 50 userIds (1111)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                INVALID_DATE_RANGE:
                  summary: "1025 - from date must be before or equal to to date"
                  value: {status: 400, detail: "1025 - from date must be before or equal to to date"}
                REPORT_PERIOD_TYPE_MISMATCH:
                  summary: "1114 - from and to do not match periodType"
                  value: {status: 400, detail: "1114 - from and to do not match periodType"}
                INVALID_REPORT_TYPE:
                  summary: "1103 - worked-hours report type is not supported"
                  value: {status: 400, detail: "1103 - worked-hours report type is not supported"}
                INVALID_REPORT_USER_IDS:
                  summary: "1101 - report user IDs must belong to the business"
                  value: {status: 400, detail: "1101 - report user IDs must belong to the business"}
                INVALID_USER_IDS:
                  summary: "1111 - userIds must contain between 1 and 50 identifiers"
                  value: {status: 400, detail: "1111 - userIds must contain between 1 and 50 identifiers"}
        '401':
          description: Unauthorized
        '403':
          description: The caller lacks REPORTS_EXPORT in the business, or is an EMPLOYEE without a contract in force
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                MISSING_PERMISSION:
                  summary: "1020 - user lacks permission REPORTS_EXPORT in business"
                  value: {status: 403, detail: "1020 - user lacks permission REPORTS_EXPORT in business"}
                EMPLOYEE_WITHOUT_ACTIVE_CONTRACT:
                  summary: "1104 - employee has no active contract in this business"
                  value: {status: 403, detail: "1104 - employee has no active contract in this business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
      x-functional-errors:
        - 1006
        - 1020
        - 1025
        - 1101
        - 1103
        - 1104
        - 1111
        - 1114

  business-worked-hours-months:
    get:
      summary: List the monthly worked hours of the business for the owner reports screen
      description: |
        Returns one page of monthly worked-hours totals of the business, newest month first, for the owner
        reports screen. Same shape, paging and counting rules as getCurrentUserWorkedHoursMonths («Mis horas»),
        for the whole business or for the requested people, plus oldestMonth and peopleCount.
        Authorization: REPORTS_EXPORT, the same as exportBusinessWorkedHoursReportPdf, so whoever reads a figure
        can download its PDF and CSV. Without it: 403 (1020); an EMPLOYEE without a contract in force: 403 (1104).
        Every plan.
        Scope: without userIds, every member of the business, removed members included (their worklogs count in
        the months they worked). With userIds, those people only, current or former members; an id without a
        membership row in the business returns 400 (1101); at most 50 distinct ids, 400 (1111). Every figure is
        the sum over the people in scope, exactly as the PDF of the same month and userIds.
        Window: at most the 48 most recent calendar months in the business time zone (4 years: the current month
        and the 47 before it). The size is a server setting of at most 48; oldestMonth carries the effective
        limit. The list never goes back past the first month of the scope:
        - without userIds, the month of the earliest worklog clock-in of the business (any member, any status);
        - with userIds, the earliest, over those people, of the membership joinedAt and the first worklog
          clock-in: the rule of «Mis horas», so a person shows the same months in both screens.
        A business without any worklog lists the current month only.
        Paging: before is an exclusive upper bound (YYYY-MM) and limit 1 to 12 (default 12). Omit before for the
        first page, which starts with the current month; then send the previous nextBefore. A before after the
        current month returns 400 (1025); a before on or before oldestMonth returns an empty page with nextBefore
        null.
        Totals (option B): confirmedSeconds counts closed CONFIRMED and APPROVED worklogs; pendingSeconds counts
        closed PENDING_REVIEW and PENDING_RECONCILIATION apart and is not included in confirmedSeconds; REJECTED and
        open worklogs count in neither. Same worklog queries and domain rule as the worked-hours PDF; the
        materialized reports table is not read.
        Nothing is stored: a month's PDF and CSV are generated when downloaded. The per-month archive field is
        reserved for the 4-year retention and is not returned in this version.
      tags:
        - Reports
      operationId: getBusinessWorkedHoursMonths
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            example: 123
        - name: userIds
          in: query
          required: false
          style: form
          explode: true
          description: People in scope, current or former members of this business. Repeat the parameter for several ids (userIds=12&userIds=34). Omit it for the whole business. At most 50 distinct ids.
          schema:
            type: array
            uniqueItems: true
            maxItems: 50
            items:
              type: integer
              format: int64
              minimum: 1
            example: [12, 34]
        - name: before
          in: query
          required: false
          description: |
            Exclusive upper bound (YYYY-MM): the page starts with the month before it. Omit it for the first page,
            which starts with the current month. Use the previous page's nextBefore. A month after the current month
            returns 400 (1025); a month on or before oldestMonth returns an empty page.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: "2025-11"
        - name: limit
          in: query
          required: false
          description: Maximum number of months in the page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 12
            default: 12
            example: 12
      responses:
        '200':
          description: One page of monthly totals
          content:
            application/json:
              schema:
                $ref: '../../components/reports/components.yml#/components/schemas/BusinessWorkedHoursMonthsResponseDTO'
              example:
                zone: Europe/Madrid
                today: "2026-11-12"
                oldestMonth: "2025-03"
                months:
                  - {month: "2026-11", inProgress: true, effectiveTo: "2026-11-12", confirmedSeconds: 4624200, pendingSeconds: 130500, pendingCount: 14, hasWorklogs: true, peopleCount: 8}
                  - {month: "2026-10", inProgress: false, effectiveTo: "2026-10-31", confirmedSeconds: 9734400, pendingSeconds: 0, pendingCount: 0, hasWorklogs: true, peopleCount: 8}
                  - {month: "2026-09", inProgress: false, effectiveTo: "2026-09-30", confirmedSeconds: 0, pendingSeconds: 0, pendingCount: 0, hasWorklogs: false, peopleCount: 0}
                nextBefore: "2026-09"
        '400':
          description: Invalid before or limit (1 to 12) or before after the current month (1025), an id without membership in the business (1101), or more than 50 userIds (1111)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                INVALID_DATE_RANGE:
                  summary: "1025 - from date must be before or equal to to date"
                  value: {status: 400, detail: "1025 - from date must be before or equal to to date"}
                INVALID_REPORT_USER_IDS:
                  summary: "1101 - report user IDs must belong to the business"
                  value: {status: 400, detail: "1101 - report user IDs must belong to the business"}
                INVALID_USER_IDS:
                  summary: "1111 - userIds must contain between 1 and 50 identifiers"
                  value: {status: 400, detail: "1111 - userIds must contain between 1 and 50 identifiers"}
        '401':
          description: Unauthorized
        '403':
          description: The caller lacks REPORTS_EXPORT in the business, or is an EMPLOYEE without a contract in force
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                MISSING_PERMISSION:
                  summary: "1020 - user lacks permission REPORTS_EXPORT in business"
                  value: {status: 403, detail: "1020 - user lacks permission REPORTS_EXPORT in business"}
                EMPLOYEE_WITHOUT_ACTIVE_CONTRACT:
                  summary: "1104 - employee has no active contract in this business"
                  value: {status: 403, detail: "1104 - employee has no active contract in this business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value: {status: 404, detail: "1006 - business does not exist"}
      x-functional-errors:
        - 1006
        - 1020
        - 1025
        - 1101
        - 1104
        - 1111

  business-worked-hours-people:
    get:
      summary: List the people of the owner reports selector, current and former members
      description: |
        Lists the people a REPORTS_EXPORT holder can pick in the owner reports selector: every membership of the
        business, active or removed, except platform administrators (the people the worked-hours PDF can hold).
        A removed membership is listed when it was removed on or after the first day of the oldest month of the
        48-month window of getBusinessWorkedHoursMonths, so every person whose record is still inside the window
        can be picked; older removals are not listed. removedAt tells former members apart. Every listed userId is
        accepted by getBusinessWorkedHoursMonths and exportBusinessWorkedHoursReportPdf.
        Authorization: REPORTS_EXPORT (403 1020; an EMPLOYEE without a contract in force 403 1104), not
        TEAM_VIEW: getBusinessUsers needs TEAM_VIEW, which a reports user may lack. It returns only what the
        selector shows: no email, no contract detail. Not paginated (a business roster).
      tags:
        - Reports
      operationId: getBusinessWorkedHoursPeople
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            example: 123
      responses:
        '200':
          description: People of the selector
          content:
            application/json:
              schema:
                $ref: '../../components/reports/components.yml#/components/schemas/BusinessWorkedHoursPeopleResponseDTO'
              example:
                people:
                  - {userId: 104, name: "Ana Gil", jobRoleName: null, joinedAt: "2025-03-02T09:00:00Z", removedAt: "2026-06-30T18:00:00Z"}
                  - {userId: 103, name: "Lucía Ruiz", jobRoleName: "Sala", joinedAt: "2026-07-01T07:00:00Z", removedAt: null}
        '401':
          description: Unauthorized
        '403':
          description: The caller lacks REPORTS_EXPORT in the business, or is an EMPLOYEE without a contract in force
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                MISSING_PERMISSION:
                  summary: "1020 - user lacks permission REPORTS_EXPORT in business"
                  value: {status: 403, detail: "1020 - user lacks permission REPORTS_EXPORT in business"}
                EMPLOYEE_WITHOUT_ACTIVE_CONTRACT:
                  summary: "1104 - employee has no active contract in this business"
                  value: {status: 403, detail: "1104 - employee has no active contract in this business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value: {status: 404, detail: "1006 - business does not exist"}
      x-functional-errors:
        - 1006
        - 1020
        - 1104

  current-user-worked-hours-months:
    get:
      summary: List the authenticated user's own monthly worked hours in a business
      description: |
        Returns one page of monthly totals of the authenticated user only, in one business, newest month first,
        for the worker screen «Mis horas». The user is derived from the access token; there is no user parameter
        and the response never holds another member's data.
        Authorization: the caller is or was a member of the business, that is, a membership row exists for the
        caller and this business, active or removed (removing a member sets removedAt and keeps the row). Contracts
        are not checked: a member whose contracts ended, or who was removed from the business, still reads their own
        data. No business permission (REPORTS_EXPORT is not required) and no business feature: available on every
        plan. An OWNER may call it for their own worklogs. A user that never was a member gets 403 (1015).
        Window: the 12 most recent calendar months in the business time zone, the current month included (the
        current month and the 11 before it).
        confirmedSeconds is the month total of the monthly PDF: the server computes it with the same worklog
        queries and domain rule as the worked-hours report (closed worklogs in CONFIRMED or APPROVED, net of
        effective closed breaks, attributed to the business-local date of the clock-in). pendingSeconds
        (PENDING_REVIEW and PENDING_RECONCILIATION) is apart and not included in confirmedSeconds. REJECTED and open
        worklogs count in neither. The materialized reports table is not read.
      tags:
        - Reports
      operationId: getCurrentUserWorkedHoursMonths
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            example: 123
        - name: before
          in: query
          required: false
          description: |
            Exclusive upper bound (YYYY-MM): the page starts with the month before it. Omit it for the first page,
            which starts with the current month. Use the previous page's nextBefore. A month after the current month returns 400 (1025);
            a month on or before the oldest month of the 12-month window returns an empty page.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: "2026-11"
        - name: limit
          in: query
          required: false
          description: Maximum number of months in the page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 12
            default: 12
            example: 12
      responses:
        '200':
          description: One page of monthly totals
          content:
            application/json:
              schema:
                $ref: '../../components/reports/components.yml#/components/schemas/CurrentUserWorkedHoursMonthsResponseDTO'
              example:
                zone: Europe/Madrid
                today: "2026-11-11"
                months:
                  - {month: "2026-11", inProgress: true, effectiveTo: "2026-11-11", confirmedSeconds: 189000, pendingSeconds: 15300, pendingCount: 2, hasWorklogs: true}
                  - {month: "2026-10", inProgress: false, effectiveTo: "2026-10-31", confirmedSeconds: 561600, pendingSeconds: 0, pendingCount: 0, hasWorklogs: true}
                  - {month: "2026-09", inProgress: false, effectiveTo: "2026-09-30", confirmedSeconds: 0, pendingSeconds: 0, pendingCount: 0, hasWorklogs: false}
                nextBefore: "2026-09"
        '400':
          description: Invalid before or limit (1 to 12), or before after the current month
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                INVALID_DATE_RANGE:
                  summary: "1025 - from date must be before or equal to to date"
                  value:
                    status: 400
                    detail: "1025 - from date must be before or equal to to date"
        '401':
          description: Unauthorized
        '403':
          description: The caller never was a member of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                USER_IS_NOT_MEMBER_OF_BUSINESS:
                  summary: "1015 - user is not member of business"
                  value:
                    status: 403
                    detail: "1015 - user is not member of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
      x-functional-errors:
        - 1006
        - 1015
        - 1025

  current-user-worked-hours-report-pdf:
    get:
      summary: Export the authenticated user's own monthly worked hours report as PDF
      description: |
        Generates and returns, in the response body, the worked-hours report PDF of one calendar month for the
        authenticated user only, in one business. No email is sent. It is meant to be shown in an in-app PDF viewer.
        The person is always the caller: the user is derived from the access token and this operation has no
        userIds parameter. It never returns another member's data, whatever permissions the caller holds.
        Authorization: the caller is or was a member of the business, that is, a membership row exists for the
        caller and this business, active or removed (removing a member sets removedAt and keeps the row). Contracts
        are not checked: a member whose contracts ended, or who was removed from the business, still reads their own
        data. No business permission (REPORTS_EXPORT is not required) and no business feature: available on every
        plan. An OWNER may call it for their own worklogs. A user that never was a member gets 403 (1015).
        The layout, rules and content are exactly those of exportBusinessWorkedHoursReportPdf with periodType MONTH,
        from the first and to the last day of the month, and userIds equal to the caller: a single-person
        PDF with no centre summary page, totals that include only closed worklogs whose reviewStatus is CONFIRMED or
        APPROVED (net of effective breaks, attributed to the business-local date of the clock-in), annex A with the
        corrections and annex B with the worklogs left out of the total (rejected, pending review, pending
        reconciliation, open).
        The month must be inside the same 12-month window as getCurrentUserWorkedHoursMonths: the current month in
        the business time zone or one of the 11 before it. A future month, or a month older than the window, returns
        400 (1025). The current month is accepted and truncated by the server to today (provisional report). A month
        of the window without countable worklogs still returns a PDF.
        Its month total equals confirmedSeconds of getCurrentUserWorkedHoursMonths for the same month.
        Synchronous: the PDF is rendered within the request, like exportBusinessWorkedHoursReportPdf. No server
        cache: every call renders the current data, and the footer carries the generation time.
        Generation time is measured in develop; if its p95 exceeds about 5 s, generation moves to a queue (RabbitMQ)
        with stored PDFs, and this operation will change in a later version.
      tags:
        - Reports
      operationId: exportCurrentUserWorkedHoursReportPdf
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            example: 123
        - name: month
          in: query
          required: true
          description: Calendar month of the report in the business time zone (YYYY-MM)
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: "2026-10"
      responses:
        '200':
          description: The caller's own monthly report, as a single PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Attachment disposition with the filename registro-jornada-{YYYY-MM}.pdf (the person's name is not in the filename)
              schema:
                type: string
                example: 'attachment; filename="registro-jornada-2026-10.pdf"'
            Content-Length:
              description: Size of the PDF in bytes
              schema:
                type: integer
                format: int64
                example: 83995
        '400':
          description: Invalid month, a future month, or a month older than the 12-month window
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                INVALID_DATE_RANGE:
                  summary: "1025 - from date must be before or equal to to date"
                  value:
                    status: 400
                    detail: "1025 - from date must be before or equal to to date"
        '401':
          description: Unauthorized
        '403':
          description: The caller never was a member of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                USER_IS_NOT_MEMBER_OF_BUSINESS:
                  summary: "1015 - user is not member of business"
                  value:
                    status: 403
                    detail: "1015 - user is not member of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
      x-functional-errors:
        - 1006
        - 1015
        - 1025

  request-business-worked-hours-report:
    post:
      summary: Request asynchronous business worked hours report generation
      description: |
        Accepts a request to generate the worked-hours PDF for the selected people of the business and
        email it to the requester. If userIds is omitted or empty, the whole business is included; with
        userIds, current or former members only (an id without a membership row returns 400 1101), at most
        50 distinct ids (400 1111). The report is generated asynchronously; this response only confirms that
        the request was accepted. Only PDF is sent by email; the CSV is download-only
        (exportBusinessWorkedHoursReportPdf).
        The owner reports screen no longer uses this operation (Main API 0.0.115): it lists months with
        getBusinessWorkedHoursMonths and downloads with exportBusinessWorkedHoursReportPdf. It is kept unchanged
        otherwise.
        The optional periodType (MONTH, YEAR or RANGE, default RANGE) selects the report layout and how from and to are validated; when it is omitted the request behaves exactly as before (RANGE).
        A period that ends after today is accepted and truncated by the server to today in the business time zone; a period whose from is after today returns 400.
        Seconds include only worklogs whose reviewStatus is CONFIRMED or APPROVED.
        A closed worklog in PENDING_RECONCILIATION does not count until attendance
        reconciliation moves it to CONFIRMED or PENDING_REVIEW. PENDING_REVIEW does not count either.
        Authorization: REPORTS_EXPORT. Without it: 403 (1020, `user lacks permission REPORTS_EXPORT in
        business`); an EMPLOYEE without a contract in force: 403 (1104).
        A PDF report that covers several employees, for any periodType including YEAR, is delivered as one single PDF document, not as a ZIP.
      tags:
        - Reports
      operationId: requestBusinessWorkedHoursReport
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                  description: Start date of the report range, inclusive
                  example: "2025-01-01"
                to:
                  type: string
                  format: date
                  description: End date of the report range, inclusive
                  example: "2025-12-31"
                periodType:
                  $ref: '../../components/reports/components.yml#/components/schemas/WorkedHoursReportPeriodTypeDTO'
                  description: Period type of the report. Omit it to keep the previous behavior (RANGE).
                type:
                  type: string
                  enum: [PDF]
                  default: PDF
                  description: Output format of the report. Only PDF is sent by email; any other value returns 400 (1103).
                userIds:
                  type: array
                  maxItems: 50
                  description: People to include, current or former members. Omit or leave empty for the whole business. At most 50 distinct ids.
                  items:
                    type: integer
                    format: int64
                  example: [12, 34]
              required: [from, to]
            example:
              from: "2025-01-01"
              to: "2025-12-31"
              type: PDF
              userIds: [12, 34]
      responses:
        '202':
          description: Report generation request accepted; no report is returned in this response
        '400':
          description: Invalid date range or from after today (1025), period type mismatch (1114), report type (1103), an id without membership in the business (1101) or more than 50 userIds (1111)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 400
                detail: "1114 - from and to do not match periodType"
        '401':
          description: Unauthorized
        '403':
          description: The caller lacks REPORTS_EXPORT in the business, or is an EMPLOYEE without a contract in force
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                MISSING_PERMISSION:
                  summary: "1020 - user lacks permission REPORTS_EXPORT in business"
                  value:
                    status: 403
                    detail: "1020 - user lacks permission REPORTS_EXPORT in business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
      x-functional-errors: [1006, 1020, 1025, 1101, 1103, 1104, 1111, 1114]

  user-reports:
    get:
      summary: Get current user's reports
      description: |
        Retrieves daily time reports for the authenticated user within a date range.
        Returns daily seconds per business and business-local day, suitable for aggregation into weekly, monthly, or custom period totals.
        Always scoped to the current user's own data.
        Each closed worklog is attributed to the business-local calendar date of its clock-in, in the business time zone,
        and its seconds are net of effective breaks (the same reportable-seconds rule as worked-hours reports).
        Open worklogs never count.
        When reviewStatus is omitted, only worklogs whose reviewStatus is CONFIRMED or APPROVED count, read from the materialized reports table, exactly as before.
        A closed worklog in PENDING_RECONCILIATION does not count until attendance
        reconciliation moves it to CONFIRMED or PENDING_REVIEW. PENDING_REVIEW does
        not count either.
        When reviewStatus is sent, only closed worklogs in the requested states count, aggregated on the fly
        by user and business-local day with the same day attribution and break deduction.
        For example, reviewStatus=PENDING_RECONCILIATION&reviewStatus=PENDING_REVIEW returns the
        seconds still waiting for reconciliation or review.
        REJECTED may be requested. The worker history totals do not request it.
      tags:
        - Reports
      operationId: getUserReports
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Start date of the range (inclusive, format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-07-01"
        - name: to
          in: query
          required: true
          description: End date of the range (inclusive, format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-07-31"
        - name: businessId
          in: query
          required: false
          description: Filter by a specific business ID
          schema:
            type: integer
            format: int64
            example: 123
        - name: reviewStatus
          in: query
          required: false
          style: form
          explode: true
          description: "One or more review states whose seconds are returned. Repeating the parameter adds a state. When omitted, CONFIRMED and APPROVED count, as before."
          schema:
            type: array
            items:
              $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogReviewStatusDTO'
            example: [PENDING_RECONCILIATION, PENDING_REVIEW]
      responses:
        '200':
          description: Reports retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/reports/components.yml#/components/schemas/ReportResponseDTO'
        '400':
          description: Invalid request parameters (date range or review status)
        '401':
          description: Unauthorized
