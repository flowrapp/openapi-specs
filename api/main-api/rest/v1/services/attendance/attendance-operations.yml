  clock-in-notices:
    post:
      summary: Notify a worker to clock in for a shift segment
      description: >
        The OWNER asks the worker of one scheduled shift to clock in for one planned
        segment. The notice is per segment, never per user. Optional `segmentIndex`
        (0-based, default 0 when the body is omitted) selects the segment; the response
        echoes it with `segmentStartAt`. A normal shift has only segment 0. An index
        past the shift's segments is 400 1047. The request is accepted only when all of
        these hold, checked in this order: the shift belongs to a published planning of
        the business (or 404 1076, the same rule as getShiftAttendance and
        approveShiftAttendance; an unpublished planning is indistinguishable from a
        missing shift); now, in the business time zone, is inside that segment's notice
        window, from `segmentStartAt` minus the lead time (15 minutes) until the
        segment's end (409 1116) — the envelope is not the window, so the gap between
        segments is outside it; the worker has not already clocked this segment: no
        non-rejected worklog covers that segment, and the worker has no open worklog in
        the business (409 1117). Clocking out of an earlier segment does not block the
        later one. The worker is an active member (not removed) with a contract in force
        on the business-local date of the shift start (409 1118); and no notice was sent
        for this shift and this `segmentIndex` within the cooldown (10 minutes),
        otherwise 429 1119 with a `Retry-After` header. A notice of another segment does
        not consume the cooldown. The notice is recorded in its own table (who, when and
        which segment) in the same transaction as an outbox event; the push to the
        worker's devices is sent asynchronously through RabbitMQ, so the response is 202
        and does not confirm delivery. A worker without registered devices still gets the
        notice recorded. Only the OWNER of the business may call this operation; a
        MANAGER receives 403 (1020). The notifiable segment is read back in
        `ShiftAttendanceDTO.clockInNotice` (getDailyAttendance and getShiftAttendance):
        one state per shift, for the segment whose window contains now or the next
        segment still to start.
      tags: [Attendance]
      operationId: notifyShiftClockIn
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: scheduledShiftId
          in: path
          required: true
          description: Scheduled shift of a published planning of the business
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: false
        description: >
          Segment to remind. Omit the body to remind segment 0.
        content:
          application/json:
            schema:
              $ref: '../../components/attendance/components.yml#/components/schemas/NotifyShiftClockInRequestDTO'
            example:
              segmentIndex: 1
      responses:
        '202':
          description: Notice recorded; the push is sent asynchronously.
          content:
            application/json:
              schema:
                $ref: '../../components/attendance/components.yml#/components/schemas/ClockInNoticeDTO'
              examples:
                firstSegment:
                  summary: Reminder for the first segment
                  value:
                    id: 7001
                    scheduledShiftId: 900
                    segmentIndex: 0
                    segmentStartAt: "2026-11-02T09:00:00+01:00"
                    userId: 3
                    notifiedBy: 1
                    notifiedAt: "2026-11-02T09:07:00+01:00"
                    nextAllowedAt: "2026-11-02T09:17:00+01:00"
                secondSegment:
                  summary: Reminder for the return segment of a split shift
                  value:
                    id: 7002
                    scheduledShiftId: 900
                    segmentIndex: 1
                    segmentStartAt: "2026-11-02T18:00:00+01:00"
                    userId: 3
                    notifiedBy: 1
                    notifiedAt: "2026-11-02T17:50:00+01:00"
                    nextAllowedAt: "2026-11-02T18:00:00+01:00"
        '400':
          description: segmentIndex is outside the shift's planned segments.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: '1047 - scheduled shift is invalid'}
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not the owner of the business. A MANAGER receives 403 too.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: '1020 - user is not the owner of business'}
        '404':
          description: Business not found, or shift not found in a published planning of the business.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  value: {status: 404, detail: '1006 - business does not exist'}
                SHIFT_NOT_FOUND:
                  value: {status: 404, detail: '1076 - scheduled shift not found'}
        '409':
          description: The shift is outside the notice window, the worker already clocked in, or the worker is not eligible.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                OUTSIDE_WINDOW:
                  value: {status: 409, detail: '1116 - shift is outside the clock-in notice window'}
                ALREADY_CLOCKED_IN:
                  value: {status: 409, detail: '1117 - worker already clocked in for this shift'}
                MEMBER_NOT_ELIGIBLE:
                  value: {status: 409, detail: '1118 - worker is not an active member with a contract in force for this shift'}
        '429':
          description: A notice was already sent for this shift and segment within the cooldown.
          headers:
            Retry-After:
              description: Seconds until the next notice for this shift and segment is allowed.
              schema: {type: integer, minimum: 1, example: 420}
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 429, detail: '1119 - a clock-in notice was sent for this shift too recently'}
      x-functional-errors: [1006, 1020, 1047, 1076, 1116, 1117, 1118, 1119]
