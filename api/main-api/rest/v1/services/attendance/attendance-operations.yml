attendance:
  worker-match-detail:
    get:
      summary: Get an attendance match
      description: >
        Returns the authenticated worker's attendance match, its associated shift
        when matched, retained candidates when ambiguous, reconciliation readiness,
        and the optional `incidents` of that match. Only the owner of the worklog
        receives the match. Anyone else receives 404.
      tags: [Attendance]
      operationId: getAttendanceMatch
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: attendanceMatchId
          in: path
          required: true
          description: Independent attendance-match identifier returned by clock-in.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Attendance match retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceMatch'
        '401':
          description: Unauthorized.
        '404':
          description: Match not found or not owned by the authenticated worker.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                ATTENDANCE_MATCH_NOT_FOUND:
                  value: {status: 404, detail: '1074 - attendance match not found'}
      x-functional-errors: [1074]

  daily:
    get:
      summary: Get daily attendance
      description: >
        Returns one business-local date with summary totals, ordered shift
        attendances, and unmatched unscheduled or ambiguous worklogs. An OWNER
        or a MANAGER receives the whole business day. An EMPLOYEE is allowed and
        receives the same schema restricted to their own shifts and worklogs.
        The optional userIds and jobRoleId filters restrict the day to the given users (AND).
        A caller who is not a member of the business receives 403.
      tags: [Attendance]
      operationId: getDailyAttendance
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Business whose attendance is requested.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: date
          in: query
          required: true
          description: Business-local calendar date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
            example: '2025-07-29'
        - name: userIds
          in: query
          required: false
          style: form
          explode: true
          description: >
            Restricts the day to the shifts assigned to these users and to
            their unmatched worklogs; the summary is computed over the
            restricted set. Omit it to get the whole day. Repeat it for
            several users (userIds=3&userIds=7). For an EMPLOYEE the filter
            applies on top of the restriction to their own data, so other
            users' ids add nothing.
          schema:
            type: array
            uniqueItems: true
            items:
              type: integer
              format: int64
              minimum: 1
            example: [3, 7]
        - name: jobRoleId
          in: query
          required: false
          description: >
            Restricts the day to the shift attendances and unmatched worklogs of this job role, filtered server-side; the summary is computed over the restricted set. The job role of a scheduled shift is the one stored on the shift when it was created (scheduled_shifts.job_role_id), so a past day keeps the job role in force that day even if the member's contract changed later. Worklogs count under the job role of the scheduled shift they are matched to; worklogs without a scheduled shift (unscheduled or ambiguous) count under the job role of the member's contract in force on that business-local day. Combined with userIds using AND. A job role with no match, or not of this business, returns an empty day.
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 10
      responses:
        '200':
          description: Daily attendance retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/DailyAttendance'
        '401':
          description: Unauthorized.
        '403':
          description: >
            The authenticated user is not a member of the business. OWNER,
            MANAGER, and EMPLOYEE memberships may read this view.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: '1015 - user is not member of business'}
        '404':
          description: Business not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: '1006 - business does not exist'}
      x-functional-errors: [1006, 1015]

  incident-daily-counts:
    get:
      summary: Count unjustified attendance incidents by worker and day
      description: >
        Returns attendance incidents of this business, counted by worker and by the
        business-local anchor date, for an inclusive date range. Requires an active
        membership, the ATTENDANCE feature and ATTENDANCE_VIEW. An active member of a
        business without ATTENDANCE receives 403 `1155` (`1155` is not repeated in
        `x-functional-errors`). A member who lacks ATTENDANCE_VIEW receives 403 `1020`,
        including an EMPLOYEE asking for their own incidents: the caller-scoped read is
        `getCurrentUserAttendanceIncidentDailyCounts`. A caller who is not an active member
        receives 403 `1015`. An unknown business is 404 `1006`.


        Unjustified means lifecycle OPEN and justification null. An OPEN incident that
        already has a justification, and a resolved incident, are not counted. The anchor
        date is the inbox anchor in the business time zone: the shift start for SHIFT scope
        or a MATCHED match, otherwise the clock-in date. A night shift's incidents stay on
        the shift's start date. Dates use the business time zone, including DST days of 23
        or 25 hours.


        `from` and `to` are required `YYYY-MM-DD` query dates. The range is inclusive: the
        number of dates is (to - from) + 1, and 42 is the maximum. `from` after `to`, or
        more than 42 dates, is 400 `1157` (`INVALID_ATTENDANCE_INCIDENT_DATE_RANGE`). A
        missing parameter or a value that is not a date is a plain 400 without a functional
        code.


        `userIds` is optional. Omit it for the whole business. When present it holds 1 to 50
        distinct ids (`uniqueItems`); more than 50, an empty list or duplicates is 400
        `1111`. A value that is not an integer is a plain 400. An id that is not a member,
        or that has no unjustified incident in the range, adds no row.


        `jobRoleId` is optional and uses the same rule as `getDailyAttendance`. The job role
        of a scheduled shift is the one stored on the shift when it was created
        (`scheduled_shifts.job_role_id`), so a past day keeps the job role in force that day.
        A match without a shift uses the job role of the member's contract in force on that
        business-local day. Combined with `userIds` using AND. A job role of another
        business, or one with no matching incident, returns `[]`.


        The list contains only rows with `unjustifiedCount` > 0, ordered by `date` ascending
        and then `userId` ascending. A worker-date with no unjustified incident is omitted,
        not returned as 0. No matches is `200` with `[]`.
      tags: [Attendance]
      operationId: getBusinessAttendanceIncidentDailyCounts
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Business whose attendance incidents are counted.
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 101
        - name: from
          in: query
          required: true
          description: >
            First business-local date of the inclusive range (YYYY-MM-DD). Together with
            `to`, at most 42 dates. `from` after `to`, or a longer range, is 400 1157.
          schema:
            type: string
            format: date
            example: '2026-02-01'
        - name: to
          in: query
          required: true
          description: >
            Last business-local date of the inclusive range (YYYY-MM-DD). The inclusive
            length `(to - from) + 1` is at most 42.
          schema:
            type: string
            format: date
            example: '2026-02-28'
        - name: userIds
          in: query
          required: false
          style: form
          explode: true
          description: >
            Restricts the count to these workers. Omit it for the whole business. Repeat it
            for several users (`userIds=102&userIds=103`). At most 50 distinct ids; more
            than 50, an empty list or duplicates is 400 1111.
          schema:
            type: array
            minItems: 1
            maxItems: 50
            uniqueItems: true
            items:
              type: integer
              format: int64
              minimum: 1
            example: [102, 103]
        - name: jobRoleId
          in: query
          required: false
          description: >
            Restricts the count to this job role, the same rule as `getDailyAttendance`:
            the role stored on the scheduled shift, or, for a match without a shift, the
            contract in force on that business-local day. Combined with `userIds` using AND.
            A role of another business, or with no match, returns an empty list.
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 3
      responses:
        '200':
          description: >
            Worker-dates in the range with at least one OPEN incident and no justification.
            Ordered by date ascending, then userId ascending. Empty when nothing matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/attendance/components.yml#/components/schemas/BusinessAttendanceIncidentDailyCountDTO'
              examples:
                someRows:
                  summary: Two worker-dates; every other worker-date of the range is omitted
                  value:
                    - {userId: 103, date: '2026-02-12', unjustifiedCount: 1}
                    - {userId: 102, date: '2026-02-18', unjustifiedCount: 2}
                empty:
                  summary: No unjustified incidents in the range, or the job role matches nothing
                  value: []
        '400':
          description: >
            `from` after `to`, or more than 42 inclusive dates (1157); or `userIds` empty,
            duplicated or longer than 50 (1111). A missing or non-date `from` or `to`, or a
            non-integer id, is a plain 400 without a functional code.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                invalidRange:
                  summary: "1157 - attendance incident date range is invalid"
                  value: {status: 400, detail: '1157 - attendance incident date range is invalid'}
                invalidUserIds:
                  summary: "1111 - userIds must contain between 1 and 50 identifiers"
                  value: {status: 400, detail: '1111 - userIds must contain between 1 and 50 identifiers'}
        '401':
          description: Unauthorized.
        '403':
          description: >
            Not an active member (1015), lacks ATTENDANCE_VIEW (1020), or ATTENDANCE is
            unavailable (1155, not listed in `x-functional-errors`). An EMPLOYEE without
            ATTENDANCE_VIEW receives 1020 even for their own incidents.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                notMember:
                  summary: "1015 - user is not member of business"
                  value: {status: 403, detail: '1015 - user is not member of business'}
                lacksAttendanceView:
                  summary: "1020 - user lacks permission ATTENDANCE_VIEW in business"
                  value: {status: 403, detail: '1020 - user lacks permission ATTENDANCE_VIEW in business'}
        '404':
          description: Business not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: '1006 - business does not exist'}
      x-functional-errors: [1006, 1015, 1020, 1111, 1157]

  tolerance:
    put:
      summary: Update business attendance tolerance
      description: >
        Updates the single attendance tolerance of the business, in minutes.
        The value is a field of the business. It is not a per-member setting
        and it is not a business-settings key. Only the OWNER may change it.
        The tolerance is what attendance deviation and no-show calculations use.
        Existing affected matches are queued for reconciliation.
      tags: [Attendance]
      operationId: updateAttendanceTolerance
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Business whose attendance tolerance is changed.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Replacement attendance tolerance.
        content:
          application/json:
            schema:
              $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceToleranceUpdateRequest'
      responses:
        '200':
          description: Attendance tolerance updated successfully.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceTolerance'
        '400':
          description: Attendance tolerance is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: '1077 - attendance tolerance is invalid'}
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not the owner of the business.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: '1020 - user is not the owner of business'}
        '404':
          description: Business not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: '1006 - business does not exist'}
      x-functional-errors: [1006, 1020, 1077]

  business-match-detail:
    get:
      summary: Get one attendance match of a business (owner)
      description: >
        Returns one attendance match of the business by id, in the same shape as an
        entry of `unmatchedAttendances` in `getDailyAttendance`: the match, its current
        worklog and the incidents of that match. The match is returned whatever its
        current state: a match already assigned to a shift is still returned with 200
        (never 404 or 409), `match` shows that shift, and the shift's attendance stays in
        `getShiftAttendance`. Only the OWNER of
        the business may call this operation; anyone else, MANAGER and EMPLOYEE included,
        receives 403 (1020). A match that does not exist or belongs to another business
        returns 404 (1074).
      tags: [Attendance]
      operationId: getBusinessAttendanceMatch
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Business that owns the match.
          schema: {type: integer, format: int64, minimum: 1}
        - name: attendanceMatchId
          in: path
          required: true
          description: Attendance-match identifier, as in `match.id` of the daily attendance.
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Attendance match retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/UnmatchedAttendance'
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not the owner of the business. A MANAGER receives 403 too.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: '1020 - user is not the owner of business'}
        '404':
          description: Business or match not found, or the match belongs to another business.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  value: {status: 404, detail: '1006 - business does not exist'}
                ATTENDANCE_MATCH_NOT_FOUND:
                  value: {status: 404, detail: '1074 - attendance match not found'}
      x-functional-errors: [1006, 1020, 1074]

  match-resolution:
    post:
      summary: Resolve an attendance match
      description: Assigns an ambiguous match to one valid retained or plausible shift, or declares it unplanned. A non-blank reason is required. Only the OWNER of the business may call this operation; a MANAGER receives 403 (1020).
      tags: [Attendance]
      operationId: resolveAttendanceMatch
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Route business for authorization and consistency validation.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: attendanceMatchId
          in: path
          required: true
          description: Match to resolve.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Structural resolution and mandatory reason.
        content:
          application/json:
            schema:
              $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceMatchResolutionRequest'
            examples:
              assign:
                value: {action: ASSIGN_SHIFT, scheduledShiftId: 900, reason: 'The worker covered the morning service.'}
              unplanned:
                value: {action: DECLARE_UNPLANNED, scheduledShiftId: null, reason: 'Emergency cover approved by the owner.'}
      responses:
        '200':
          description: Attendance match resolved successfully.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceMatch'
        '400':
          description: Resolution or reason is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                REASON_REQUIRED:
                  value: {status: 400, detail: '1078 - attendance resolution requires a non-blank reason'}
                INVALID_RESOLUTION:
                  value: {status: 400, detail: '1084 - attendance resolution is not allowed for the current state'}
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not the owner of the business. A MANAGER receives 403 too.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: '1020 - user is not the owner of business'}
        '404':
          description: Business, match, or selected shift not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Match was modified concurrently.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 409, detail: '1049 - resource was modified concurrently'}
      x-functional-errors: [1006, 1020, 1049, 1074, 1075, 1076, 1078, 1084]

  unplanned-acceptance:
    post:
      summary: Accept unscheduled attendance
      description: Accepts an UNSCHEDULED_WORK incident with a mandatory reason and approves its eligible non-rejected worklog. Only the OWNER of the business may call this operation; a MANAGER receives 403 (1020).
      tags: [Attendance]
      operationId: acceptUnplannedAttendance
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: attendanceMatchId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../../open-api-rest.yml#/components/schemas/UnscheduledAttendanceAcceptanceRequest'
      responses:
        '200':
          description: Unscheduled attendance accepted.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceMatch'
        '400':
          description: Acceptance or reason is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not the owner of the business. A MANAGER receives 403 too.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: '1020 - user is not the owner of business'}
        '404':
          description: Business or match not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Match or worklog cannot be accepted in its current state.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors: [1006, 1020, 1049, 1067, 1074, 1078, 1084]

  no-show-acknowledgment:
    post:
      summary: Acknowledge a no-show
      description: Resolves the shift-scoped NO_SHOW incident with a mandatory reason and does not create a worklog. Only the OWNER of the business may call this operation; a MANAGER receives 403 (1020).
      tags: [Attendance]
      operationId: acknowledgeNoShow
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: scheduledShiftId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../../open-api-rest.yml#/components/schemas/NoShowAcknowledgementRequest'
      responses:
        '200':
          description: No-show acknowledged.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceIncident'
        '400':
          description: Acknowledgement reason is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not the owner of the business. A MANAGER receives 403 too.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: '1020 - user is not the owner of business'}
        '404':
          description: Business, shift, or no-show incident not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors: [1006, 1020, 1076, 1078, 1085]

  shift-attendance:
    get:
      summary: Get shift attendance
      description: >
        Returns the on-demand ShiftAttendance of one scheduled shift of the
        published plan (published, or archived after being published), the
        same object approveShiftAttendance returns, including worklogs,
        incidents, approvalBlocker and the revision to send as
        expectedRevision. Read-only; it does not change state. The caller must
        be an OWNER or MANAGER of the business.
      tags: [Attendance]
      operationId: getShiftAttendance
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Business that owns the scheduled shift.
          schema: {type: integer, format: int64, minimum: 1}
        - name: scheduledShiftId
          in: path
          required: true
          description: Scheduled shift whose attendance is requested.
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Shift attendance retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/ShiftAttendance'
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not an owner or manager of the business.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: '1020 - user is not an owner or manager of the business'}
        '404':
          description: Business or scheduled shift not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  value: {status: 404, detail: '1006 - business does not exist'}
                ATTENDANCE_SHIFT_NOT_FOUND:
                  value: {status: 404, detail: '1076 - scheduled shift not found'}
      x-functional-errors: [1006, 1020, 1076]

  shift-approval:
    post:
      summary: Approve shift attendance
      description: Approves one completed ShiftAttendance using an opaque expected revision. Approval is atomic and rejects stale or unreconciled attendance. An open AUTOMATIC_CLOSE incident (a worklog closed automatically after 24 hours without a clock-out) blocks approval like any unresolved structural incident and returns 409 1083 until the owner corrects the clock-out or rejects the worklog. Only the OWNER of the business may call this operation; a MANAGER receives 403 (1020).
      tags: [Attendance]
      operationId: approveShiftAttendance
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: scheduledShiftId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../../open-api-rest.yml#/components/schemas/ShiftAttendanceApprovalRequest'
      responses:
        '200':
          description: Shift attendance approved successfully.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/ShiftAttendance'
        '400':
          description: Approval request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not the owner of the business. A MANAGER receives 403 too.
          content:
