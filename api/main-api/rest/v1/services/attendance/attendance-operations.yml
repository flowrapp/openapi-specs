  incident-justification:
    post:
      summary: Justify an attendance incident
      description: >
        Lets the employee who owns the worklog (MATCH) or the scheduled shift
        (SHIFT) write or replace the justification of one open incident. The
        same route covers both scopes. The body is the justification text, at
        most 500 characters. The incident stays OPEN: justification does not
        resolve it, and an OWNER or MANAGER still resolves it. A resolved
        incident cannot be justified. A caller who does not own the incident
        receives the same 404 as a missing incident. Correction and rejection
        are not actions of this route; they stay on the worklog correction and
        reject routes.
      tags: [Attendance]
      operationId: justifyAttendanceIncident
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          description: Attendance incident to justify.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Replacement justification text.
        content:
          application/json:
            schema:
              $ref: '../../../open-api-rest.yml#/components/schemas/JustifyAttendanceIncidentRequest'
            example:
              text: The bus was late, so I clocked in after the shift started.
      responses:
        '200':
          description: Justification stored. The incident remains OPEN.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceIncident'
              example:
                id: 880
                scope: MATCH
                attendanceMatchId: 700
                scheduledShiftId: null
                evidence:
                  type: LATE_ENTRY
                  measuredSeconds: 900
                  toleranceSeconds: 300
                  candidateShiftIds: []
                lifecycle: OPEN
                resolution: null
                resolvedBy: null
                resolvedAt: null
                reason: null
                justification:
                  text: The bus was late, so I clocked in after the shift started.
                  justifiedBy: 3
                  justifiedAt: '2025-07-29T09:00:00+02:00'
                version: 2
                createdAt: '2025-07-29T08:45:00+02:00'
                updatedAt: '2025-07-29T09:00:00+02:00'
        '400':
          description: Justification text is blank or longer than 500 characters.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: '1113 - attendance justification text is required'}
        '401':
          description: Unauthorized.
        '404':
          description: Incident not found, or not owned by the authenticated employee.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: '1085 - attendance incident not found'}
        '409':
          description: The incident is not open, or it was modified concurrently.
          content:
            application/problem+json:
              schema:
