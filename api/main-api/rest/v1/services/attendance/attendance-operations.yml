attendance:
  worker-match-detail:
    get:
      summary: Get an attendance match
      description: >
        Returns the authenticated worker's attendance match, its associated shift
        when matched, retained candidates when ambiguous, reconciliation readiness,
        and the optional `incidents` of that match. Only the owner of the worklog
        receives the match. Anyone else receives 404.
      tags: [Attendance]
      operationId: getAttendanceMatch
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: attendanceMatchId
          in: path
          required: true
          description: Independent attendance-match identifier returned by clock-in.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Attendance match retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceMatch'
        '401':
          description: Unauthorized.
        '404':
          description: Match not found or not owned by the authenticated worker.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                ATTENDANCE_MATCH_NOT_FOUND:
                  value: {status: 404, detail: '1074 - attendance match not found'}
      x-functional-errors: [1074]

  daily:
    get:
      summary: Get daily attendance
      description: >
        Returns one business-local date with summary totals, ordered shift
        attendances, and unmatched unscheduled or ambiguous worklogs. An OWNER
        or a MANAGER receives the whole business day. An EMPLOYEE is allowed and
        receives the same schema restricted to their own shifts and worklogs.
        A caller who is not a member of the business receives 403.
      tags: [Attendance]
      operationId: getDailyAttendance
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Business whose attendance is requested.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: date
          in: query
          required: true
          description: Business-local calendar date in YYYY-MM-DD format.
          schema:
            type: string
            format: date
            example: '2025-07-29'
      responses:
        '200':
          description: Daily attendance retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/DailyAttendance'
        '401':
          description: Unauthorized.
        '403':
          description: >
            The authenticated user is not a member of the business. OWNER,
            MANAGER, and EMPLOYEE memberships may read this view.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: '1015 - user is not member of business'}
        '404':
          description: Business not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: '1006 - business does not exist'}
      x-functional-errors: [1006, 1015]

  tolerance:
    put:
      summary: Update business attendance tolerance
      description: >
        Updates the single attendance tolerance of the business, in minutes.
        The value is a field of the business. It is not a per-member setting
        and it is not a business-settings key. Only the OWNER may change it.
        The tolerance is what attendance deviation and no-show calculations use.
        Existing affected matches are queued for reconciliation.
      tags: [Attendance]
      operationId: updateAttendanceTolerance
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Business whose attendance tolerance is changed.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Replacement attendance tolerance.
        content:
          application/json:
            schema:
              $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceToleranceUpdateRequest'
      responses:
        '200':
          description: Attendance tolerance updated successfully.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceTolerance'
        '400':
          description: Attendance tolerance is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: '1077 - attendance tolerance is invalid'}
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not the owner of the business.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: '1020 - user is not the owner of business'}
        '404':
          description: Business not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: '1006 - business does not exist'}
      x-functional-errors: [1006, 1020, 1077]

  match-resolution:
    post:
      summary: Resolve an attendance match
      description: Assigns an ambiguous match to one valid retained or plausible shift, or declares it unplanned. A non-blank reason is required.
      tags: [Attendance]
      operationId: resolveAttendanceMatch
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Route business for authorization and consistency validation.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: attendanceMatchId
          in: path
          required: true
          description: Match to resolve.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Structural resolution and mandatory reason.
        content:
          application/json:
            schema:
              $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceMatchResolutionRequest'
            examples:
              assign:
                value: {action: ASSIGN_SHIFT, scheduledShiftId: 900, reason: 'The worker covered the morning service.'}
              unplanned:
                value: {action: DECLARE_UNPLANNED, scheduledShiftId: null, reason: 'Emergency cover approved by the owner.'}
      responses:
        '200':
          description: Attendance match resolved successfully.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceMatch'
        '400':
          description: Resolution or reason is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                REASON_REQUIRED:
                  value: {status: 400, detail: '1078 - attendance resolution requires a non-blank reason'}
                INVALID_RESOLUTION:
                  value: {status: 400, detail: '1084 - attendance resolution is not allowed for the current state'}
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not an owner or manager of the business.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Business, match, or selected shift not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Match was modified concurrently.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 409, detail: '1049 - resource was modified concurrently'}
      x-functional-errors: [1006, 1049, 1074, 1075, 1076, 1078, 1084]

  unplanned-acceptance:
    post:
      summary: Accept unscheduled attendance
      description: Accepts an UNSCHEDULED_WORK incident with a mandatory reason and approves its eligible non-rejected worklog.
      tags: [Attendance]
      operationId: acceptUnplannedAttendance
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: attendanceMatchId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../../open-api-rest.yml#/components/schemas/UnscheduledAttendanceAcceptanceRequest'
      responses:
        '200':
          description: Unscheduled attendance accepted.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceMatch'
        '400':
          description: Acceptance or reason is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not an owner or manager of the business.
        '404':
          description: Business or match not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Match or worklog cannot be accepted in its current state.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors: [1006, 1049, 1067, 1074, 1078, 1084]

  no-show-acknowledgment:
    post:
      summary: Acknowledge a no-show
      description: Resolves the shift-scoped NO_SHOW incident with a mandatory reason and does not create a worklog.
      tags: [Attendance]
      operationId: acknowledgeNoShow
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: scheduledShiftId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../../open-api-rest.yml#/components/schemas/NoShowAcknowledgementRequest'
      responses:
        '200':
          description: No-show acknowledged.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceIncident'
        '400':
          description: Acknowledgement reason is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not an owner or manager of the business.
        '404':
          description: Business, shift, or no-show incident not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors: [1006, 1076, 1078, 1085]

  shift-approval:
    post:
      summary: Approve shift attendance
      description: Approves one completed ShiftAttendance using an opaque expected revision. Approval is atomic and rejects stale or unreconciled attendance.
      tags: [Attendance]
      operationId: approveShiftAttendance
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: scheduledShiftId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../../open-api-rest.yml#/components/schemas/ShiftAttendanceApprovalRequest'
      responses:
        '200':
          description: Shift attendance approved successfully.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/ShiftAttendance'
        '400':
          description: Approval request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized.
        '403':
          description: The authenticated user is not an owner or manager of the business.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Business or scheduled shift not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Approval is stale, pending reconciliation, unfinished, open, or structurally unresolved.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                REVISION_CONFLICT:
                  value: {status: 409, detail: '1079 - attendance changed since it was read'}
                PENDING:
                  value: {status: 409, detail: '1080 - attendance reconciliation is still pending'}
                NOT_FINISHED:
                  value: {status: 409, detail: '1081 - scheduled shift is not finished'}
                OPEN_WORKLOGS:
                  value: {status: 409, detail: '1082 - attendance has an open worklog or break'}
                STRUCTURAL:
                  value: {status: 409, detail: '1083 - attendance has unresolved structural incidents'}
      x-functional-errors: [1006, 1049, 1076, 1079, 1080, 1081, 1082, 1083]

  incident-justification:
    post:
      summary: Justify an attendance incident
      description: >
        Lets the employee who owns the worklog (MATCH) or the scheduled shift
        (SHIFT) write or replace the justification of one open incident. The
        same route covers both scopes. The body is the justification text, at
        most 500 characters. The incident stays OPEN: justification does not
        resolve it, and an OWNER or MANAGER still resolves it. A resolved
        incident cannot be justified. A caller who does not own the incident
        receives the same 404 as a missing incident. Correction and rejection
        are not actions of this route; they stay on the worklog correction and
        reject routes.
      tags: [Attendance]
      operationId: justifyAttendanceIncident
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          description: Attendance incident to justify.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Replacement justification text.
        content:
          application/json:
            schema:
              $ref: '../../../open-api-rest.yml#/components/schemas/JustifyAttendanceIncidentRequest'
            example:
              text: The bus was late, so I clocked in after the shift started.
      responses:
        '200':
          description: Justification stored. The incident remains OPEN.
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/AttendanceIncident'
              example:
                id: 880
                scope: MATCH
                attendanceMatchId: 700
                scheduledShiftId: null
                evidence:
                  type: LATE_ENTRY
                  measuredSeconds: 900
                  toleranceSeconds: 300
                  candidateShiftIds: []
                lifecycle: OPEN
                resolution: null
                resolvedBy: null
                resolvedAt: null
                reason: null
                justification:
                  text: The bus was late, so I clocked in after the shift started.
                  justifiedBy: 3
                  justifiedAt: '2025-07-29T09:00:00+02:00'
                version: 2
                createdAt: '2025-07-29T08:45:00+02:00'
                updatedAt: '2025-07-29T09:00:00+02:00'
        '400':
          description: Justification text is blank or longer than 500 characters.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: '1113 - attendance justification text is required'}
        '401':
          description: Unauthorized.
        '404':
          description: Incident not found, or not owned by the authenticated employee.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: '1085 - attendance incident not found'}
        '409':
          description: The incident is not open, or it was modified concurrently.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                NOT_ALLOWED:
                  value: {status: 409, detail: '1112 - attendance justification is not allowed'}
                CONCURRENT:
                  value: {status: 409, detail: '1049 - resource was modified concurrently'}
      x-functional-errors: [1049, 1085, 1112, 1113]
