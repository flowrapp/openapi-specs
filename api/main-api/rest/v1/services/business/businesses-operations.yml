businesses:
  update-business-profile:
    put:
      summary: Update business profile
      description: >
        Replaces the editable business profile fields. Only the business owner may update the
        tax identifier, name, address, town, city, country, and postal code.
      tags:
        - Businesses
      operationId: updateBusinessProfile
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Complete replacement of the editable business profile
        content:
          application/json:
            schema:
              $ref: '../../components/business/components.yml#/components/schemas/BusinessProfileUpdateRequestDTO'
            example:
              nif: B12345678
              name: Coffee Time
              address: C/Sin nombre 453
              town: Barbate
              city: Cádiz
              country: España
              postalCode: '11160'
      responses:
        '204':
          description: Business profile updated successfully
        '400':
          description: Business profile values are invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 400
                detail: "1093 - business profile is invalid"
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 404
                detail: "1006 - business does not exist"
      x-functional-errors: [1006, 1020, 1093]

  update-business-geofence:
    put:
      summary: Update business geofence
      description: >
        Replaces the business geofence center and radius. Only the business owner may update the
        latitude, longitude, and area.
      tags:
        - Businesses
      operationId: updateBusinessGeofence
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Complete replacement of the business geofence
        content:
          application/json:
            schema:
              $ref: '../../components/business/components.yml#/components/schemas/LocationDTO'
            example:
              latitude: 36.19
              longitude: -5.99
              area: 50.0
      responses:
        '204':
          description: Business geofence updated successfully
        '400':
          description: Geofence values are invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 400
                detail: "1094 - business geofence is invalid"
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 404
                detail: "1006 - business does not exist"
      x-functional-errors: [1006, 1020, 1094]

  get-businesses:
    get:
      summary: Get user businesses with roles
      description: >
        Retrieves a comprehensive list of all businesses that are associated with the currently authenticated user, including the role of the current user in each business.
        When provided, search filters by a case-insensitive substring of the business name only;
        surrounding whitespace is ignored, blank values return all memberships, and `%` and `_`
        are treated as literal characters.
      tags:
        - Businesses
      operationId: getUserBusinesses
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Optional case-insensitive substring to search within the business name.
          schema:
            type: string
      responses:
        '200':
          description: Businesses retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/business/components.yml#/components/schemas/BusinessResponseDTO'
                example:
                  - id: 101
                    nif: "B12345678"
                    name: "Coffee Time"
                    zone: "Europe/Madrid"
                    address: "C/ sin nombre 43"
                    town: "Barbate"
                    city: "Cádiz"
                    country: "España"
                    postalCode: "11160"
                    location:
                      latitude: 30.5
                      longitude: 50.5
                      area: 5.3
                    userRole: "OWNER"
                    longOpenAfterMinutes: 720
                    attendanceToleranceMinutes: 5
                  - id: 102
                    nif: "B87654321"
                    name: "Tea Corner"
                    zone: "Europe/Madrid"
                    address: "C/ sin nombre 43"
                    town: "Barbate"
                    city: "Cádiz"
                    country: "España"
                    postalCode: "11160"
                    location:
                      latitude: 32.0
                      longitude: 51.2
                      area: 3.2
                    userRole: "MANAGER"
                    longOpenAfterMinutes: 720
                    attendanceToleranceMinutes: 5
        '401':
          description: Unauthorized

  get-business-users:
    get:
      summary: Get users associated within a business
      description: >
        Retrieves a list of business memberships with each user's username, profile, and nullable
        current contract, including job-role display metadata. Access is restricted to the OWNER
        and MANAGER of the business. Can be filtered by business role and
        by a case-insensitive literal substring of the user's name, username, or email. Surrounding
        whitespace is trimmed, blank values disable search, and role and search are combined with
        AND. Results are ordered by worker name without regard to case, then user ID ascending.
      tags:
        - Businesses
      operationId: getBusinessUsers
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
        - name: role
          in: query
          required: false
          description: Filter users by role
          schema:
            type: string
            enum: [OWNER, MANAGER, EMPLOYEE]
        - name: search
          in: query
          required: false
          description: >
            Optional case-insensitive literal substring matched against the user's name, username,
            or email. Surrounding whitespace is trimmed; empty or whitespace-only values are
            treated as absent. Percent and underscore are matched literally. Combined with role
            using AND; the identity fields are combined using OR. Results are ordered by name,
            ignoring case, then user ID ascending.
          schema:
            type: string
      responses:
        '200':
          description: Business memberships with profile and current-contract data retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/business/components.yml#/components/schemas/BusinessUserResponseDTO'
              example:
                - userId: 1
                  username: "john.doe"
                  name: "John Doe"
                  email: "john.doe@example.com"
                  role: "OWNER"
                  currentContract:
                    id: 123
                    businessId: 101
                    jobRoleId: 10
                    jobRole:
                      id: 10
                      code: WAITER
                      name: Waiter
                      color: "#1A2B3C"
                      icon: front-of-house
                      active: true
                    totalWeekHours: 40.0
                    startDate: "2025-01-01"
                    endDate: null
                - userId: 2
                  username: "jane.doe"
                  name: "Jane Doe"
                  email: "jane.doe@example.com"
                  role: "MANAGER"
                  currentContract: null
                - userId: 3
                  username: "sam.lee"
                  name: "Sam Lee"
                  email: "sam.lee@example.com"
                  role: "EMPLOYEE"
                  currentContract:
                    id: 124
                    businessId: 101
                    jobRoleId: 11
                    jobRole:
                      id: 11
                      code: COOK
                      name: Cook
                      color: "#4C9F70"
                      icon: kitchen
                      active: false
                    totalWeekHours: 20.0
                    startDate: "2025-01-01"
                    endDate: "2025-07-31"
        '401':
          description: Unauthorized
        '403':
          description: Current user is not an owner or manager of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 404
                detail: "1006 - business does not exist"
      x-functional-errors: [1006, 1020]

  remove-business-user:
    delete:
      summary: Remove a user from a business
      description: >
        Ends a user's membership in the business. Only the business OWNER may perform this
        operation; the MANAGER role is not sufficient. The user's historical data (worklogs,
        contracts, reports) is preserved. An OWNER cannot be removed.
      tags:
        - Businesses
      operationId: removeBusinessUser
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: userId
          in: path
          required: true
          description: User ID of the member to remove, not the business membership ID
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: User removed from the business successfully; no response body
        '401':
          description: Unauthorized
        '403':
          description: >
            Current user is not the owner of the business, the target user is not a business
            member, or the target user is an OWNER of the business.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                notMember:
                  value: {status: 403, detail: "1015 - user is not member of business"}
                cannotRemoveOwner:
                  value: {status: 403, detail: "1106 - user cannot remove the owner from the business"}
        '404':
          description: Business or user not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  value: {status: 404, detail: "1006 - business does not exist"}
                userNotFound:
                  value: {status: 404, detail: "1000 - user not found"}
      x-functional-errors: [1000, 1006, 1015, 1020, 1106]

  get-business-users-v2:
    get:
      summary: List business members, paginated
      description: >
        Returns one keyset page of active memberships: user identity and membership role only.
        Email, the current contract, the job role, and whether the member is working are not
        included. `GET /api/v1/businesses/{businessId}/users` is unchanged and still returns
        the full array, including email and the current contract, when `limit` and `cursor`
        are omitted.
        `search`, when present, is accent- and case-insensitive and matches the name only,
        never the email. The server trims it and normalizes it (lowercase, accents removed,
        ñ folded to n). After normalization it must be 2 to 64 characters. Percent,
        underscore, and backslash are literal. Omitting `search` lists every active membership.
        With a search, order is rank, then normalized name, then userId. Rank is 0 when the
        normalized query is a prefix of the normalized name or of a word inside it, and 1
        when it is only an interior substring. Without a search, order is normalized name,
        then userId. The caller must be an OWNER or MANAGER of the business. Removed
        memberships are excluded. `userId` is the same identifier schedule and planning
        accept as `employeeId`.
      tags:
        - Businesses
      operationId: getBusinessUsersV2
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 101
        - name: search
          in: query
          required: false
          description: >
            Optional name query, accent- and case-insensitive. Applied only when present.
            After trim and normalization (lowercase, accents removed, ñ folded to n) it must
            be 2 to 64 characters. A blank or shorter value returns 400 SEARCH_QUERY_TOO_SHORT.
            A longer value returns 400 SEARCH_QUERY_TOO_LONG. Percent, underscore, and
            backslash are literal. Search is by name only, not by email. This is not the v1
            `search` parameter: v1 also matches username and email and has no length minimum.
          schema:
            type: string
            minLength: 2
            maxLength: 64
            example: tur
        - name: limit
          in: query
          required: false
          description: >
            Maximum number of members to return. Defaults to 20. A value below 1 or above
            50 returns 400 INVALID_SEARCH_LIMIT and is not clamped.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
            example: 20
        - name: cursor
          in: query
          required: false
          description: >
            Opaque keyset cursor from a previous page. Omit it to read the first page.
            The cursor is bound to this business and to the normalized search, including
            the no-search listing. A malformed cursor, or one reused with a different
            search or businessId, returns 400 INVALID_SEARCH_CURSOR.
          schema:
            type: string
            minLength: 1
            maxLength: 512
            example: eyJ2IjoxLCJyIjoxfQ
      responses:
        '200':
          description: >
            One page of active memberships. With `search`, ordered by rank, normalized name,
            and userId. Without `search`, ordered by normalized name and userId.
          content:
            application/json:
              schema:
                $ref: '../../components/business/components.yml#/components/schemas/BusinessUserMembershipPageDTO'
              example:
                content:
                  - userId: 41
                    username: "Turín García"
                    name: "Turín García"
                    role: EMPLOYEE
                  - userId: 18
                    username: "Arturo López"
                    name: "Arturo López"
                    role: EMPLOYEE
                  - userId: 27
                    username: "Saturnino Ruiz"
                    name: "Saturnino Ruiz"
                    role: MANAGER
                hasNext: true
                nextCursor: "eyJ2IjoxLCJyIjoxfQ"
        '400':
          description: >
            The search, limit, or cursor is invalid. A present search that normalizes to
            fewer than 2 characters returns SEARCH_QUERY_TOO_SHORT; one longer than 64
            characters returns SEARCH_QUERY_TOO_LONG. A limit outside 1..50 returns
            INVALID_SEARCH_LIMIT. A cursor that is malformed or was issued for a different
            search or business returns INVALID_SEARCH_CURSOR.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                queryTooShort:
                  summary: "1107 - search query is shorter than 2 characters after trim and normalization"
                  value:
                    status: 400
                    detail: "1107 - search query is shorter than 2 characters after trim and normalization"
                queryTooLong:
                  summary: "1108 - search query is longer than 64 characters after trim and normalization"
                  value:
                    status: 400
                    detail: "1108 - search query is longer than 64 characters after trim and normalization"
                limitOutOfRange:
                  summary: "1109 - search limit must be between 1 and 50"
                  value:
                    status: 400
                    detail: "1109 - search limit must be between 1 and 50"
                invalidCursor:
                  summary: "1110 - search cursor is invalid or does not match this business and query"
                  value:
                    status: 400
                    detail: "1110 - search cursor is invalid or does not match this business and query"
        '401':
          description: No authenticated session
        '403':
          description: Current user is not an owner or manager of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 404
                detail: "1006 - business does not exist"
      x-functional-errors: [1006, 1020, 1107, 1108, 1109, 1110]
