businesses:
  update-business-profile:
    put:
      summary: Update business profile
      description: >
        Replaces the editable business profile fields. Only the business owner may update the
        tax identifier, name, address, town, city, country, and postal code.
      tags:
        - Businesses
      operationId: updateBusinessProfile
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Complete replacement of the editable business profile
        content:
          application/json:
            schema:
              $ref: '../../components/business/components.yml#/components/schemas/BusinessProfileUpdateRequestDTO'
            example:
              nif: B12345678
              name: Coffee Time
              address: C/Sin nombre 453
              town: Barbate
              city: Cádiz
              country: España
              postalCode: '11160'
      responses:
        '204':
          description: Business profile updated successfully
        '400':
          description: Business profile values are invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 400
                detail: "1093 - business profile is invalid"
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 404
                detail: "1006 - business does not exist"
      x-functional-errors: [1006, 1020, 1093]

  update-business-geofence:
    put:
      summary: Update business geofence
      description: >
        Replaces the business geofence center and radius. Only the business owner may update the
        latitude, longitude, and area.
      tags:
        - Businesses
      operationId: updateBusinessGeofence
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Complete replacement of the business geofence
        content:
          application/json:
            schema:
              $ref: '../../components/business/components.yml#/components/schemas/LocationDTO'
            example:
              latitude: 36.19
              longitude: -5.99
              area: 50.0
      responses:
        '204':
          description: Business geofence updated successfully
        '400':
          description: Geofence values are invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 400
                detail: "1094 - business geofence is invalid"
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 404
                detail: "1006 - business does not exist"
      x-functional-errors: [1006, 1020, 1094]

  get-businesses:
    get:
      summary: Get user businesses with roles
      description: >
        Retrieves a comprehensive list of all businesses that are associated with the currently authenticated user, including the role of the current user in each business.
        When provided, search filters by a case-insensitive substring of the business name only;
        surrounding whitespace is ignored, blank values return all memberships, and `%` and `_`
        are treated as literal characters.
      tags:
        - Businesses
      operationId: getUserBusinesses
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Optional case-insensitive substring to search within the business name.
          schema:
            type: string
      responses:
        '200':
          description: Businesses retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/business/components.yml#/components/schemas/BusinessResponseDTO'
                example:
                  - id: 101
                    nif: "B12345678"
                    name: "Coffee Time"
                    zone: "Europe/Madrid"
                    address: "C/ sin nombre 43"
                    town: "Barbate"
                    city: "Cádiz"
                    country: "España"
                    postalCode: "11160"
                    location:
                      latitude: 30.5
                      longitude: 50.5
                      area: 5.3
                    userRole: "OWNER"
                    longOpenAfterMinutes: 720
                    attendanceToleranceMinutes: 5
                  - id: 102
                    nif: "B87654321"
                    name: "Tea Corner"
                    zone: "Europe/Madrid"
                    address: "C/ sin nombre 43"
                    town: "Barbate"
                    city: "Cádiz"
                    country: "España"
                    postalCode: "11160"
                    location:
                      latitude: 32.0
                      longitude: 51.2
                      area: 3.2
                    userRole: "MANAGER"
                    longOpenAfterMinutes: 720
                    attendanceToleranceMinutes: 5
        '401':
          description: Unauthorized

  get-business-users:
    get:
      summary: Get users associated within a business
      description: >
        Retrieves a list of business memberships with each user's username, profile, and nullable
        current contract, including job-role display metadata. Can be filtered by business role and
        by a case-insensitive literal substring of the user's name, username, or email. Surrounding
        whitespace is trimmed, blank values disable search, and role and search are combined with
        AND. Results are ordered by worker name without regard to case, then user ID ascending.
      tags:
        - Businesses
      operationId: getBusinessUsers
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
        - name: role
          in: query
          required: false
          description: Filter users by role
          schema:
            type: string
            enum: [OWNER, MANAGER, EMPLOYEE]
        - name: search
          in: query
          required: false
          description: >
            Optional case-insensitive literal substring matched against the user's name, username,
            or email. Surrounding whitespace is trimmed; empty or whitespace-only values are
            treated as absent. Percent and underscore are matched literally. Combined with role
            using AND; the identity fields are combined using OR. Results are ordered by name,
            ignoring case, then user ID ascending.
          schema:
            type: string
      responses:
        '200':
          description: Business memberships with profile and current-contract data retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/business/components.yml#/components/schemas/BusinessUserResponseDTO'
              example:
                - userId: 1
                  username: "john.doe"
                  name: "John Doe"
                  email: "john.doe@example.com"
                  role: "OWNER"
                  currentContract:
                    id: 123
                    businessId: 101
                    jobRoleId: 10
                    jobRole:
                      id: 10
                      code: WAITER
                      name: Waiter
                      color: "#1A2B3C"
                      icon: front-of-house
                      active: true
                    totalWeekHours: 40.0
                    startDate: "2025-01-01"
                    endDate: null
                - userId: 2
                  username: "jane.doe"
                  name: "Jane Doe"
                  email: "jane.doe@example.com"
                  role: "MANAGER"
                  currentContract: null
                - userId: 3
                  username: "sam.lee"
                  name: "Sam Lee"
                  email: "sam.lee@example.com"
                  role: "EMPLOYEE"
                  currentContract:
                    id: 124
                    businessId: 101
                    jobRoleId: 11
                    jobRole:
                      id: 11
                      code: COOK
                      name: Cook
                      color: "#4C9F70"
                      icon: kitchen
                      active: false
                    totalWeekHours: 20.0
                    startDate: "2025-01-01"
                    endDate: "2025-07-31"
        '401':
          description: Unauthorized
        '404':
          description: Business not found

  search-business-users:
    get:
      summary: Search business members by name
      description: >
        Returns one keyset page of active memberships whose name contains the query.
        Matching is accent- and case-insensitive and applies to the name only, never
        to email. The literal path segment `search` is registered beside
        `/users/{userId}`; `userId` is an int64, and servers match this concrete path
        before the templated member path, so `search` is not a user id.
        Results are ordered by rank, then by normalized name, then by userId ascending.
        Rank is 0 when the normalized query is a prefix of the normalized name or of a
        word inside it, and 1 when it is only an interior substring. Normalization is
        lowercase with accents removed and ñ folded to n.
        The caller must be an OWNER or MANAGER of the business. Members without a
        current contract are included with a null job role and contract id. Removed
        memberships are excluded.
      tags:
        - Businesses
      operationId: searchBusinessUsers
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 101
        - name: q
          in: query
          required: true
          description: >
            Name query, accent- and case-insensitive. The server trims surrounding
            whitespace and normalizes the value (lowercase, accents removed, ñ folded
            to n) before checking length. After normalization the query must be 2 to
            64 characters. A missing, blank, or shorter query returns 400
            SEARCH_QUERY_TOO_SHORT. A longer query returns 400 SEARCH_QUERY_TOO_LONG.
            Percent, underscore, and backslash are matched as literal characters.
            Search is by name only, not by email.
          schema:
            type: string
            minLength: 2
            maxLength: 64
            example: tur
        - name: limit
          in: query
          required: false
          description: >
            Maximum number of members to return. Defaults to 20. A value below 1 or
            above 50 returns 400 INVALID_SEARCH_LIMIT and is not clamped.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
            example: 20
        - name: cursor
          in: query
          required: false
          description: >
            Opaque keyset cursor from a previous page. Omit it to read the first page.
            The cursor is bound to this business and to the normalized query. A
            malformed cursor, or one reused with a different q or businessId, returns
            400 INVALID_SEARCH_CURSOR.
          schema:
            type: string
            minLength: 1
            maxLength: 512
            example: eyJ2IjoxLCJyIjoxfQ
      responses:
        '200':
          description: >
            One page of matching active memberships, ordered by rank, normalized name,
            and userId
          content:
            application/json:
              schema:
                $ref: '../../components/business/components.yml#/components/schemas/BusinessUserSearchPageDTO'
              example:
                content:
                  - userId: 41
                    name: "Turín García"
                    role: EMPLOYEE
                    jobRole:
                      id: 11
                      code: COOK
                      name: Cocina
                      color: "#4C9F70"
                      icon: kitchen
                      active: true
                    currentContractId: 501
                    workingNow: true
                  - userId: 18
                    name: "Arturo López"
                    role: EMPLOYEE
                    jobRole:
                      id: 10
                      code: WAITER
                      name: Sala
                      color: "#1A2B3C"
                      icon: front-of-house
                      active: true
                    currentContractId: 480
                    workingNow: false
                  - userId: 27
                    name: "Saturnino Ruiz"
                    role: MANAGER
                    jobRole: null
                    currentContractId: null
                hasNext: true
                nextCursor: "eyJ2IjoxLCJyIjoxfQ"
        '400':
          description: >
            The query, limit, or cursor is invalid. A query that normalizes to fewer
            than 2 characters returns SEARCH_QUERY_TOO_SHORT; one longer than 64
            characters returns SEARCH_QUERY_TOO_LONG. A limit outside 1..50 returns
            INVALID_SEARCH_LIMIT. A cursor that is malformed or was issued for a
            different query or business returns INVALID_SEARCH_CURSOR.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                queryTooShort:
                  summary: "1108 - search query is shorter than 2 characters after trim and normalization"
                  value:
                    status: 400
                    detail: "1108 - search query is shorter than 2 characters after trim and normalization"
                queryTooLong:
                  summary: "1109 - search query is longer than 64 characters after trim and normalization"
                  value:
                    status: 400
                    detail: "1109 - search query is longer than 64 characters after trim and normalization"
                limitOutOfRange:
                  summary: "1110 - search limit must be between 1 and 50"
                  value:
                    status: 400
                    detail: "1110 - search limit must be between 1 and 50"
                invalidCursor:
                  summary: "1111 - search cursor is invalid or does not match this business and query"
                  value:
                    status: 400
                    detail: "1111 - search cursor is invalid or does not match this business and query"
        '401':
          description: No authenticated session
        '403':
          description: Caller is not an OWNER or MANAGER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 404
                detail: "1006 - business does not exist"
      x-functional-errors: [1006, 1020, 1108, 1109, 1110, 1111]

  remove-business-user:
    delete:
      summary: Remove a user from a business
      description: >
        Ends a user's membership in the business. Only the business OWNER may perform this
        operation; the MANAGER role is not sufficient. The user's historical data (worklogs,
        contracts, reports) is preserved. The last OWNER of a business cannot be removed.
      tags:
        - Businesses
      operationId: removeBusinessUser
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: userId
          in: path
          required: true
          description: User ID of the member to remove, not the business membership ID
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: User removed from the business successfully; no response body
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business, or the target user is not a business member
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                notMember:
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: Business or user not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  value: {status: 404, detail: "1006 - business does not exist"}
                userNotFound:
                  value: {status: 404, detail: "1000 - user not found"}
        '409':
          description: The user is the last OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 409
                detail: "1107 - business must keep at least one owner"
      x-functional-errors: [1000, 1006, 1015, 1020, 1107]
