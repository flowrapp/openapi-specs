recurringSchedules:
  collection:
    get:
      tags: [Recurring Schedules]
      operationId: getRecurringSchedules
      summary: List recurring schedules for a business
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
      responses:
        '200':
          description: Recurring schedules retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/scheduling/components.yml#/components/schemas/RecurringScheduleResponseDTO'
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
      x-functional-errors: [1006, 1020]
    post:
      tags: [Recurring Schedules]
      operationId: createRecurringSchedule
      summary: Create a recurring schedule
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/scheduling/components.yml#/components/schemas/RecurringScheduleRequestDTO'
      responses:
        '201':
          description: Recurring schedule created
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/RecurringScheduleResponseDTO'
        '400': {$ref: '../../components/scheduling/components.yml#/components/responses/BadRequest'}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
        '409': {$ref: '../../components/scheduling/components.yml#/components/responses/Conflict'}
      x-functional-errors: [1006, 1020, 1050, 1051]
  effective:
    get:
      tags: [Recurring Schedules]
      operationId: getEffectiveRecurringSchedule
      summary: Get the recurring schedule effective on a date
      description: >
        Returns the complete recurring schedule whose inclusive validity period covers
        `effectiveOn`. When omitted, `effectiveOn` is resolved as the current date in the
        business time zone. A valid schedule with empty opening intervals and shifts is still
        returned as `200`; `404` means that no recurring schedule covers the resolved date.
        Only the business owner can access this operation.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - name: effectiveOn
          in: query
          required: false
          description: Business-local date on which the schedule must be effective; defaults to the current business-local date
          schema:
            type: string
            format: date
            example: "2025-07-28"
      responses:
        '200':
          description: Complete recurring schedule effective on the requested or defaulted business-local date
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/RecurringScheduleResponseDTO'
              examples:
                explicitDate:
                  summary: Schedule effective on an explicit date
                  value:
                    id: 200
                    version: 2
                    businessId: 101
                    validFrom: "2025-07-01"
                    validUntil: null
                    days:
                      - dayOfWeek: MONDAY
                        openingIntervals:
                          - startTime: "09:00"
                            endTime: "17:00"
                        shifts: []
                      - dayOfWeek: TUESDAY
                        openingIntervals: []
                        shifts: []
                      - dayOfWeek: WEDNESDAY
                        openingIntervals: []
                        shifts: []
                      - dayOfWeek: THURSDAY
                        openingIntervals: []
                        shifts: []
                      - dayOfWeek: FRIDAY
                        openingIntervals: []
                        shifts: []
                      - dayOfWeek: SATURDAY
                        openingIntervals: []
                        shifts: []
                      - dayOfWeek: SUNDAY
                        openingIntervals: []
                        shifts: []
                    createdAt: "2025-06-30T10:00:00+02:00"
                    updatedAt: "2025-07-01T08:00:00+02:00"
                omittedDate:
                  summary: Schedule effective on the current business-local date
                  value:
                    id: 200
                    version: 2
                    businessId: 101
                    validFrom: "2025-07-01"
                    validUntil: null
                    days:
                      - dayOfWeek: MONDAY
                        openingIntervals:
                          - startTime: "09:00"
                            endTime: "17:00"
                        shifts: []
                      - dayOfWeek: TUESDAY
                        openingIntervals: []
                        shifts: []
                      - dayOfWeek: WEDNESDAY
                        openingIntervals: []
                        shifts: []
                      - dayOfWeek: THURSDAY
                        openingIntervals: []
                        shifts: []
                      - dayOfWeek: FRIDAY
                        openingIntervals: []
                        shifts: []
                      - dayOfWeek: SATURDAY
                        openingIntervals: []
                        shifts: []
                      - dayOfWeek: SUNDAY
                        openingIntervals: []
                        shifts: []
                    createdAt: "2025-06-30T10:00:00+02:00"
                    updatedAt: "2025-07-01T08:00:00+02:00"
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business or recurring schedule not found for the resolved date
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 404
                detail: "1052 - recurring schedule not found"
      x-functional-errors: [1006, 1020, 1052]

  item:
    get:
      tags: [Recurring Schedules]
      operationId: getRecurringSchedule
      summary: Get a recurring schedule by its root ID
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/ScheduleId'
      responses:
        '200':
          description: Recurring schedule retrieved
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/RecurringScheduleResponseDTO'
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
      x-functional-errors: [1006, 1052]
    put:
      tags: [Recurring Schedules]
      operationId: replaceRecurringSchedule
      summary: Replace a complete recurring schedule by its root ID
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/scheduling/components.yml#/components/schemas/RecurringScheduleRequestDTO'
      responses:
        '200':
          description: Recurring schedule replaced
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/RecurringScheduleResponseDTO'
        '400': {$ref: '../../components/scheduling/components.yml#/components/responses/BadRequest'}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
        '409': {$ref: '../../components/scheduling/components.yml#/components/responses/Conflict'}
      x-functional-errors: [1006, 1020, 1050, 1051, 1049]
    delete:
      tags: [Recurring Schedules]
      operationId: deleteRecurringSchedule
      summary: Delete a recurring schedule by its root ID
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/ScheduleId'
      responses:
        '204': {description: Recurring schedule deleted}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
      x-functional-errors: [1006, 1020, 1052]

scheduleExceptions:
  collection:
    get:
      tags: [Schedule Exceptions]
      operationId: getScheduleExceptions
      summary: List schedule exceptions for a business
      description: Returns exceptions whose dates are within the inclusive from and to bounds, ordered by date ascending.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/From'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/To'
      responses:
        '200':
          description: Schedule exceptions retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/scheduling/components.yml#/components/schemas/ScheduleExceptionResponseDTO'
        '400': {$ref: '../../components/scheduling/components.yml#/components/responses/BadRequest'}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
      x-functional-errors: [1006, 1020, 1025]
    post:
      tags: [Schedule Exceptions]
      operationId: createScheduleException
      summary: Create a schedule exception
      description: Creates a complete date-specific replacement for the recurring schedule.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/scheduling/components.yml#/components/schemas/ScheduleExceptionRequestDTO'
            example:
              date: "2025-08-15"
              configuration:
                openingIntervals:
                  - startTime: "09:00"
                    endTime: "17:00"
                shifts:
                  - name: Holiday service
                    color: "#1A2B3C"
                    startTime: "09:00"
                    endTime: "17:00"
                    breakMinutes: 30
                    demands:
                      - jobRoleId: 10
                        minimumEmployees: 1
                        targetEmployees: 2
                        maximumEmployees: 3
      responses:
        '201':
          description: Schedule exception created
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/ScheduleExceptionResponseDTO'
              example:
                id: 700
                businessId: 101
                date: "2025-08-15"
                configuration:
                  openingIntervals:
                    - startTime: "09:00"
                      endTime: "17:00"
                  shifts:
                    - name: Holiday service
                      color: "#1A2B3C"
                      startTime: "09:00"
                      endTime: "17:00"
                      breakMinutes: 30
                      demands:
                        - jobRoleId: 10
                          minimumEmployees: 1
                          targetEmployees: 2
                          maximumEmployees: 3
                createdAt: "2025-08-01T10:00:00+02:00"
                updatedAt: "2025-08-01T10:00:00+02:00"
        '400': {$ref: '../../components/scheduling/components.yml#/components/responses/BadRequest'}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
        '409': {$ref: '../../components/scheduling/components.yml#/components/responses/Conflict'}
      x-functional-errors: [1006, 1020, 1034, 1053, 1054, 1055]
  item:
    put:
      tags: [Schedule Exceptions]
      operationId: replaceScheduleException
      summary: Replace a schedule exception configuration
      description: >
        Atomically replaces the complete configuration for an existing exception. The stored
        exception date is immutable and is intentionally not accepted in this request. A failed
        validation or adjacent-boundary conflict leaves the previous exception unchanged.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/ScheduleExceptionId'
      requestBody:
        required: true
        description: Configuration only; the exception date remains unchanged.
        content:
          application/json:
            schema:
              $ref: '../../components/scheduling/components.yml#/components/schemas/DailyConfigurationRequestDTO'
            example:
              openingIntervals:
                - startTime: "10:00"
                  endTime: "18:00"
              shifts:
                - name: Holiday service
                  color: "#4C9F70"
                  startTime: "10:00"
                  endTime: "18:00"
                  breakMinutes: 30
                  demands:
                    - jobRoleId: 10
                      minimumEmployees: 1
                      targetEmployees: 2
                      maximumEmployees: 3
      responses:
        '200':
          description: Schedule exception configuration replaced; the response keeps the original date
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/ScheduleExceptionResponseDTO'
              example:
                id: 700
                businessId: 101
                date: "2025-08-15"
                configuration:
                  openingIntervals:
                    - startTime: "10:00"
                      endTime: "18:00"
                  shifts:
                    - name: Holiday service
                      color: "#4C9F70"
                      startTime: "10:00"
                      endTime: "18:00"
                      breakMinutes: 30
                      demands:
                        - jobRoleId: 10
                          minimumEmployees: 1
                          targetEmployees: 2
                          maximumEmployees: 3
                createdAt: "2025-08-01T10:00:00+02:00"
                updatedAt: "2025-08-10T10:00:00+02:00"
        '400': {$ref: '../../components/scheduling/components.yml#/components/responses/BadRequest'}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
        '409': {$ref: '../../components/scheduling/components.yml#/components/responses/Conflict'}
      x-functional-errors: [1006, 1020, 1053, 1055, 1056]
    delete:
      tags: [Schedule Exceptions]
      operationId: deleteScheduleException
      summary: Delete a schedule exception by its root ID
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/ScheduleExceptionId'
      responses:
        '204': {description: Schedule exception deleted}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
        '409': {$ref: '../../components/scheduling/components.yml#/components/responses/Conflict'}
      x-functional-errors: [1006, 1020, 1055, 1056]

jobRoles:
  collection:
    get:
      tags: [Job Roles]
      operationId: getBusinessJobRoles
      summary: List job roles for a business
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - name: includeInactive
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Job roles retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/scheduling/components.yml#/components/schemas/BusinessJobRoleResponseDTO'
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
      x-functional-errors: [1006, 1020]
    post:
      tags: [Job Roles]
      operationId: createBusinessJobRole
      summary: Create a job role
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/scheduling/components.yml#/components/schemas/CreateBusinessJobRoleRequestDTO'
            example:
              code: WAITER
              name: Waiter
              description: Front of house service
              color: "#1A2B3C"
              icon: front-of-house
      responses:
        '201':
          description: Job role created
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/BusinessJobRoleResponseDTO'
        '400': {$ref: '../../components/scheduling/components.yml#/components/responses/BadRequest'}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
        '409': {$ref: '../../components/scheduling/components.yml#/components/responses/Conflict'}
      x-functional-errors: [1006, 1020, 1035]
  item:
    put:
      tags: [Job Roles]
      operationId: updateBusinessJobRole
      summary: Update or reactivate a job role without changing its code
      description: Updates job-role metadata. Setting `active` to true reactivates the existing role ID. Logical deactivation is exposed by DELETE and never physically removes historical role references.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/JobRoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/scheduling/components.yml#/components/schemas/UpdateBusinessJobRoleRequestDTO'
            example:
              name: Senior waiter
              description: Shift lead
              color: "#4C9F70"
              icon: front-of-house
              active: true
      responses:
        '200':
          description: Job role updated
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/BusinessJobRoleResponseDTO'
        '400': {$ref: '../../components/scheduling/components.yml#/components/responses/BadRequest'}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
        '409': {$ref: '../../components/scheduling/components.yml#/components/responses/Conflict'}
      x-functional-errors: [1006, 1020, 1034]
    delete:
      tags: [Job Roles]
      operationId: deleteBusinessJobRole
      summary: Deactivate a business job role
      description: >
        Logically deactivates the job role by setting `active` to false. The role is never
        physically removed, so historical contracts and assignments retain its identity. The
        operation is idempotent and returns `204` for both an active role and an existing role
        that is already inactive. Reactivation uses the complete PUT with `active: true`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/JobRoleId'
      responses:
        '204': {description: "Job role deactivated, or was already inactive"}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
      x-functional-errors: [1006, 1020, 1034]
planning:
  settings:
