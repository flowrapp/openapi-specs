      responses:
        '200':
          description: Assigned roles retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/scheduling/components.yml#/components/schemas/BusinessJobRoleResponseDTO'
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/NotFound'}
      x-functional-errors: [1006, 1015, 1020]
    put:
      tags: [Job Roles]
      operationId: replaceBusinessUserJobRoles
      summary: Atomically replace all job roles assigned to a business member
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/parameters/BusinessId'
        - $ref: '#/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/scheduling/components.yml#/components/schemas/BusinessUserJobRolesRequestDTO'
      responses:
        '200':
          description: Assigned roles replaced
          content:
            application/json:
              schema:
