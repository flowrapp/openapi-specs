      tags: [Planning]
      operationId: getPlanningSettings
      summary: Get planning generation settings for a business
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
      responses:
        '200':
          description: Planning settings retrieved
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/PlanningSettingsDTO'
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
      x-functional-errors: [1006, 1020]
    put:
      tags: [Planning]
      operationId: replacePlanningSettings
      summary: Create or replace planning generation settings
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/scheduling/components.yml#/components/schemas/PlanningSettingsDTO'
      responses:
        '200':
          description: Planning settings replaced
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/PlanningSettingsDTO'
        '400': {$ref: '../../components/scheduling/components.yml#/components/responses/BadRequest'}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
      x-functional-errors: [1006, 1020, 1044]
    delete:
      tags: [Planning]
      operationId: deletePlanningSettings
      summary: Delete planning generation settings
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
      responses:
        '204': {description: Planning settings deleted or already absent}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
      x-functional-errors: [1006, 1020]
  collection:
    get:
      tags: [Planning]
      operationId: getPlannings
      summary: List business plannings in a date range
      description: Returns plannings with the immutable requirements captured at creation time; later schedule edits do not change historical requirements.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/From'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/To'
      responses:
        '200':
          description: Plannings retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/scheduling/components.yml#/components/schemas/PlanningResponseDTO'
        '400': {$ref: '../../components/scheduling/components.yml#/components/responses/BadRequest'}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
      x-functional-errors: [1006, 1020, 1045]
  item:
    get:
      tags: [Planning]
      operationId: getPlanning
      summary: Get a business planning by week start
      description: Retrieves the existing planning addressed by its Monday `weekStart`, including immutable snapshot requirements and any scheduled-shift presentation values. It does not regenerate the planning.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/WeekStart'
      responses:
        '200':
          description: Planning retrieved
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/PlanningResponseDTO'
              example:
                id: 500
                businessId: 101
                weekStart: "2025-07-28"
                weekEnd: "2025-08-03"
                status: SOLVING
                failureReason: null
                requirements:
                  - date: "2025-07-28"
                    shifts:
                      - name: Morning service
                        color: "#1A2B3C"
                        startTime: "09:00"
                        endTime: "17:00"
                        breakMinutes: 30
                        demands:
                          - jobRoleId: 10
                            minimumEmployees: 1
                            targetEmployees: 2
                            maximumEmployees: 3
                createdAt: "2025-07-27T08:00:00+02:00"
                publishedAt: null
                scheduledShifts: []
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
      x-functional-errors: [1006, 1020, 1046]
    put:
      tags: [Planning]
      operationId: createPlanning
      summary: Create or retrieve a business planning for a week
      description: Automatic planning generation may create or return the planning addressed by its Monday `weekStart`. This generation operation is not exposed by the BFF manager contract.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '../../components/scheduling/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/scheduling/components.yml#/components/parameters/WeekStart'
      responses:
        '200':
          description: Planning created or retrieved if it already exists
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/PlanningResponseDTO'
        '400': {$ref: '../../components/scheduling/components.yml#/components/responses/BadRequest'}
        '403': {$ref: '../../components/scheduling/components.yml#/components/responses/Forbidden'}
        '404': {$ref: '../../components/scheduling/components.yml#/components/responses/NotFound'}
      x-functional-errors: [1006, 1020, 1032, 1034, 1039, 1041, 1044, 1045, 1047]
  publish:
    post:
      tags: [Planning]
      operationId: publishPlanning
      summary: Publish a ready business planning
      description: >
        Idempotently transitions the existing planning addressed by its stable `planningId` within
        the route `businessId` from READY to PUBLISHED. An already published planning is returned
        unchanged. If no planning exists for the ID, or it belongs to another business, the API
        returns 404 and creates nothing.
      security: [{ bearerAuth: [] }]
      parameters:
