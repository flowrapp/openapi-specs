parameters:
  BusinessId:
    name: businessId
    in: path
    required: true
    schema: {type: integer, format: int64}
  UserId:
    name: userId
    in: path
    required: true
    schema: {type: integer, format: int64}
  JobRoleId:
    name: jobRoleId
    in: path
    required: true
    schema: {type: integer, format: int64}
  ShiftTemplateId:
    name: shiftTemplateId
    in: path
    required: true
    schema: {type: integer, format: int64}
  ShiftDemandId:
    name: shiftDemandId
    in: path
    required: true
    schema: {type: integer, format: int64}
  ValidFrom:
    name: validFrom
    in: path
    required: true
    schema: {type: string, format: date}
  Date:
    name: date
    in: path
    required: true
    schema: {type: string, format: date}
  From:
    name: from
    in: query
    required: true
    schema: {type: string, format: date}
  To:
    name: to
    in: query
    required: true
    schema: {type: string, format: date}

responses:
  BadRequest:
    description: Invalid request or scheduling configuration
    content:
      application/problem+json:
        schema:
          $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
  Forbidden:
    description: Current user is not the business owner
    content:
      application/problem+json:
        schema:
          $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
  NotFound:
    description: Business or nested resource not found
    content:
      application/problem+json:
        schema:
          $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
  Conflict:
    description: Scheduling configuration conflict
    content:
      application/problem+json:
        schema:
          $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
