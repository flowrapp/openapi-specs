openingHours:
  configurations:
    get:
      tags: [Opening Hours]
      operationId: getOpeningHoursConfigurations
      summary: List recurring opening-hours configurations
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/parameters/BusinessId'
      responses:
        '200':
          description: Configurations retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/scheduling/components.yml#/components/schemas/OpeningHoursConfigurationResponseDTO'
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/NotFound'}
      x-functional-errors: [1006, 1020]
  configuration:
    put:
      tags: [Opening Hours]
      operationId: replaceOpeningHoursConfiguration
      summary: Create or replace a complete weekly opening-hours configuration
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/parameters/BusinessId'
        - $ref: '#/parameters/ValidFrom'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/scheduling/components.yml#/components/schemas/OpeningHoursConfigurationRequestDTO'
      responses:
        '200':
          description: Configuration replaced
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/OpeningHoursConfigurationResponseDTO'
        '400': {$ref: '#/responses/BadRequest'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/NotFound'}
        '409': {$ref: '#/responses/Conflict'}
      x-functional-errors: [1006, 1020, 1033, 1034]
    delete:
      tags: [Opening Hours]
      operationId: deleteOpeningHoursConfiguration
      summary: Delete a recurring opening-hours configuration
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/parameters/BusinessId'
        - $ref: '#/parameters/ValidFrom'
      responses:
        '204': {description: Configuration deleted or already absent}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/NotFound'}
      x-functional-errors: [1006, 1020]
  overrides:
    get:
      tags: [Opening Hours]
      operationId: getOpeningHoursOverrides
      summary: List opening-hours overrides in a date range
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/parameters/BusinessId'
        - $ref: '#/parameters/From'
        - $ref: '#/parameters/To'
      responses:
        '200':
          description: Overrides retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/scheduling/components.yml#/components/schemas/OpeningHoursOverrideResponseDTO'
        '400': {$ref: '#/responses/BadRequest'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/NotFound'}
      x-functional-errors: [1006, 1020, 1032]
  override:
    put:
      tags: [Opening Hours]
      operationId: upsertOpeningHoursOverride
      summary: Create or replace an opening-hours override for a date
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/parameters/BusinessId'
        - $ref: '#/parameters/Date'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/scheduling/components.yml#/components/schemas/OpeningHoursOverrideRequestDTO'
      responses:
        '200':
          description: Override stored
          content:
            application/json:
              schema:
                $ref: '../../components/scheduling/components.yml#/components/schemas/OpeningHoursOverrideResponseDTO'
        '400': {$ref: '#/responses/BadRequest'}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/NotFound'}
      x-functional-errors: [1006, 1020, 1033]
    delete:
      tags: [Opening Hours]
      operationId: deleteOpeningHoursOverride
      summary: Delete an opening-hours override
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/parameters/BusinessId'
        - $ref: '#/parameters/Date'
      responses:
        '204': {description: Override deleted or already absent}
        '403': {$ref: '#/responses/Forbidden'}
        '404': {$ref: '#/responses/NotFound'}
      x-functional-errors: [1006, 1020]

