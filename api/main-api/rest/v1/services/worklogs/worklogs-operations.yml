          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog to reject
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Mandatory rejection reason
        content:
          application/json:
            schema:
              $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogRejectionRequestDTO'
      responses:
        '200':
          description: Worklog rejected successfully
          content:
            application/json:
              schema:
                $ref: '../../components/worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        '400':
          description: Rejection reason is invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '403':
          description: The authenticated user is not an owner or manager of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Business or worklog not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: The worklog cannot transition to rejected
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1006
        - 1017
        - 1067
        - 1068

  history:
    get:
      summary: Get worklog audit history
      description: Returns immutable audit entries for a worklog in chronological order. The worker owning the worklog and owners or managers of its business may access this history.
      tags:
        - Worklogs
      operationId: getWorklogHistory
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog whose history is requested
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Worklog audit history in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogAuditEntryDTO'
        '401':
          description: Unauthorized
        '403':
          description: The authenticated user is not authorized to view this worklog
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Worklog not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1017
        - 1019

  settings:
    put:
      summary: Update business worklog settings
      description: Updates the owner-only long-open threshold for a business. The value must be greater than zero and less than the global 24-hour automatic-closure threshold.
      tags:
        - Worklogs
      operationId: updateBusinessWorklogSettings
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: New business worklog settings
        content:
          application/json:
            schema:
              $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogSettingsUpdateRequestDTO'
      responses:
        '200':
          description: Business worklog settings updated successfully
          content:
            application/json:
              schema:
                $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogSettingsResponseDTO'
        '400':
          description: Long-open threshold is invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1006
        - 1020
