  management-correction:
    put:
      summary: Correct a business worklog
      description: >
        Allows the owner of the route business to correct a worker worklog. A non-blank
        reason is required. Successful management corrections are approved immediately; changed
        punch origins become ADMIN while unchanged origins are preserved. This is the correction
        route for attendance. Incident reconciliation runs synchronously in this request. Incidents
        no longer produced by the corrected data resolve as CORRECTED, or NO_LONGER_APPLICABLE when
        that incident type does not admit CORRECTED; OUTSIDE_GEOFENCE resolves as CORRECTED.
        Remaining or newly produced temporal incidents (EARLY_ENTRY, LATE_ENTRY, EARLY_EXIT,
        LATE_EXIT, UNEXPLAINED_GAP) resolve as ACCEPTED by the correcting owner with this reason,
        so the worklog remains APPROVED and needs no separate accept or approve call. Structural
        incidents (UNSCHEDULED_WORK, AMBIGUOUS_MATCH, NO_SHOW) remain open and block approval;
        AUTOMATIC_CLOSE remains open and blocks approval if its clock-out was not corrected.
        The contract does not add a correction action on the incident. A worker's own correction
        does not accept incidents.
        Only the OWNER of the business may call this operation; a MANAGER receives 403 (1020).
      tags:
        - Worklogs
      operationId: correctBusinessWorklog
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog to correct
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Corrected worklog values and mandatory reason
        content:
          application/json:
            schema:
              $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogCorrectionRequestDTO'
      responses:
        '200':
          description: Worklog corrected and approved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        '400':
          description: Correction or reason is invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '403':
          description: The authenticated user is not the owner of the business. A MANAGER receives 403 too
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: '1020 - user is not the owner of business'}
        '404':
          description: Business or worklog not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Correction overlaps another worklog or the worklog was modified concurrently
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1006
        - 1017
        - 1020
        - 1022
        - 1049
        - 1068

  approval:
    post:
      summary: Approve a business worklog
      description: Allows the owner of the business to approve a pending or confirmed worklog without changing its data. A worklog with an open AUTOMATIC_CLOSE attendance incident cannot be approved until the owner corrects its clock-out or rejects it. Only the OWNER of the business may call this operation; a MANAGER receives 403 (1020).
      tags:
        - Worklogs
      operationId: approveWorklog
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: worklogId
          in: path
          required: true
