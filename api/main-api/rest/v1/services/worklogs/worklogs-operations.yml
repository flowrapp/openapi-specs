worklogs:
  clock-in:
    post:
      summary: Register start of workday
      description: >
        Records the start time of a work session for the authenticated user at a
        specific business location. The response `attendanceMatchId` stays
        required. The backend fills it with the attendance match created for the
        new worklog, including a NOT_APPLICABLE match. The clock-in use case does
        not select the match; the API completes the identifier before it responds.
        Geofencing policy (the more restrictive of the business and the user policy): BLOCK rejects a
        clock-in outside the business area or without a location with 403 1100. WARN lets it through and,
        when the location is more than 25 m outside the area or missing, opens an OUTSIDE_GEOFENCE
        attendance incident on the new worklog, which therefore starts in PENDING_REVIEW, unless its match
        is NOT_APPLICABLE (no published planning that day): then the check is only recorded. ALLOW never flags.
      tags:
        - Worklogs
      operationId: clockIn
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
      requestBody:
        description: Clock-in information, including optional device location
        content:
          application/json:
            schema:
              $ref: '../../components/worklogs/components.yml#/components/schemas/ClockInRequestDTO'
        required: false
      responses:
        '200':
          description: Clock-in successful
          content:
            application/json:
              schema:
                $ref: '../../../open-api-rest.yml#/components/schemas/ClockInResult'
        '400':
          description: Clock-in timestamp, note, or location is invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '404':
          description: Business not found or user is not a member of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
        '409':
          description: An open worklog already exists or the idempotency identifier conflicts with a previous command
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1006
        - 1025
        - 1063
        - 1064

  clock-out:
    put:
      summary: Close open worklog
      description: >
        Finalizes an active work session by recording the end time for the
        authenticated user at a specific business location. When ATTENDANCE is available,
        closing sets `reviewStatus` to PENDING_RECONCILIATION. The worklog stays in worklog
        listings and does not count in worked-hours reports until attendance reconciliation
        moves it to CONFIRMED, when there is nothing to review, or to PENDING_REVIEW, when an
        open attendance incident remains. Without ATTENDANCE, an ordinary manual close stays
        CONFIRMED when the open worklog was already confirmed; an existing review state is
        preserved. Report totals are recalculated asynchronously after the close.
        Geofencing policy: as in clock-in, BLOCK rejects a clock-out outside the business area or without
        a location with 403 1100, and WARN lets it through and records the check. When ATTENDANCE is
        available, reconciliation can open (or keep) an OUTSIDE_GEOFENCE incident when the clock-out
        location is more than 25 m outside the area or missing; without ATTENDANCE, the check is
        retained without opening an attendance incident.
      tags:
        - Worklogs
      operationId: clockOut
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog to close
          schema:
            type: integer
            format: int64
      requestBody:
        description: Clock-out information, including optional device location
        content:
          application/json:
            schema:
              $ref: '../../components/worklogs/components.yml#/components/schemas/ClockOutRequestDTO'
        required: false
      responses:
        '200':
          description: Clock-out successful
          content:
            application/json:
              schema:
                $ref: '../../components/worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        '400':
          description: Worklog times or location are invalid (e.g. clock-out before clock-in)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                WORKLOG_NOT_VALID:
                  summary: "1025 - worklog is not valid"
                  value:
                    status: 400
                    detail: "1025 - worklog is not valid"
        '401':
          description: Unauthorized
        '403':
          description: User is not the owner of the worklog or the worklog is already closed
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                WORKLOG_NOT_OWNER:
                  summary: "1019 - user is not the owner of worklog"
                  value:
                    status: 403
                    detail: "1019 - user is not the owner of worklog"
                WORKLOG_CLOSED:
                  summary: "1018 - worklog already closed"
                  value:
                    status: 403
                    detail: "1018 - worklog already closed"
        '404':
          description: Worklog not found or is not available through the route business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                WORKLOG_NOT_FOUND:
                  summary: "1017 - worklog not found"
                  value:
                    status: 404
                    detail: "1017 - worklog not found"
                WORKLOG_BUSINESS_MISMATCH:
                  summary: "1065 - worklog is not available through this business"
                  value:
                    status: 404
                    detail: "1065 - worklog is not available through this business"
        '409':
          description: Worklog overlaps with an existing worklog, the idempotency identifier conflicts, or the row was modified concurrently
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                WORKLOG_OVERLAP:
                  summary: "1022 - worklog overlaps with existing worklog"
                  value:
                    status: 409
                    detail: "1022 - worklog overlaps with existing worklog"
      x-functional-errors:
        - 1017
        - 1018
        - 1019
        - 1022
        - 1025
        - 1049
        - 1064
        - 1065

  filtered-worklogs:
    get:
      summary: Get filtered worklogs
      description: >
        Retrieves a collection of worklog records for a specific business,
        filtered by various time-based and user criteria. A worklog in
        PENDING_RECONCILIATION is included. Reports omit that state; this list
        does not. Repeat `reviewStatus=PENDING_RECONCILIATION` to read only it.
      tags:
        - Worklogs
      operationId: getWorklogs
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: false
          description: Start date for filtering (format YYYY-MM-DD). UTC timezone is used.
          schema:
            type: string
            format: date
            example: "2025-07-22"
        - name: to
          in: query
          required: false
          description: End date for filtering (format YYYY-MM-DD). UTC timezone is used.
          schema:
            type: string
            format: date
            example: "2025-07-28"
        - name: date
          in: query
          required: false
          description: Specific date for filtering (alternative to from/to, format YYYY-MM-DD). UTC timezone is used.
          schema:
            type: string
            format: date
            example: "2025-07-29"
        - name: userId
          in: query
          required: false
          description: Filter by user ID
          schema:
            type: integer
            format: int64
            example: 123
        - name: reviewStatus
          in: query
          required: false
          description: >
            One or more review states to include. Repeating the parameter adds
            another state. PENDING_RECONCILIATION selects closed worklogs that
            attendance reconciliation has not finished.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogReviewStatusDTO'
      responses:
        '200':
          description: Worklogs retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                USER_NOT_OWNER_OF_BUSINESS:
                  summary: "1020 - user is not the owner of business"
                  value:
                    status: 403
                    detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
      x-functional-errors:
        - 1006
        - 1020

  open-worklogs:
    get:
      summary: List open worklogs for a set of users
      description: >
        Returns the requested members who have an open worklog in this business (clocked in and
        not yet clocked out). One call covers the whole set. Requested users who are not working,
        and user ids that are not active members, are omitted rather than rejected. The response
        is only the user id, not the worklog. The caller must be an OWNER or MANAGER of the
        business. `userIds` is required and holds 1 to 50 identifiers, the same cap as a
        member-list page.
        `GET /api/v1/businesses/{businessId}/worklogs` does not fit this call: it accepts a single
        `userId`, has no open-worklog filter, and returns the full worklog.
      tags:
        - Worklogs
      operationId: getOpenWorklogsForUsers
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 101
        - name: userIds
          in: query
          required: true
          description: >
            User ids to check, repeated (`userIds=41&userIds=18`). At least 1 and at most 50
            distinct ids. More than 50, an empty list, or duplicates return 400 INVALID_USER_IDS.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            uniqueItems: true
            items:
              type: integer
              format: int64
              minimum: 1
            example: [41, 18, 27]
      responses:
        '200':
          description: >
            Members from the request who have an open worklog. Members who are not working are
            absent.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/worklogs/components.yml#/components/schemas/OpenWorklogUserDTO'
              example:
                - userId: 41
        '400':
          description: userIds is missing, empty, longer than 50, or contains duplicates
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 400
                detail: "1111 - userIds must contain between 1 and 50 identifiers"
        '401':
          description: No authenticated session
        '403':
          description: Current user is not an owner or manager of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 404
                detail: "1006 - business does not exist"
      x-functional-errors: [1006, 1020, 1111]

