                  value:
                    status: 400
                    detail: "1025 - worklog is not valid"
        '401':
          description: Unauthorized
        '403':
          description: User is not the owner of the worklog
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                WORKLOG_NOT_OWNER:
                  summary: "1019 - user is not the owner of worklog"
                  value:
                    status: 403
                    detail: "1019 - user is not the owner of worklog"
        '404':
          description: Worklog not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                WORKLOG_NOT_FOUND:
                  summary: "1017 - worklog not found"
                  value:
                    status: 404
                    detail: "1017 - worklog not found"
        '409':
          description: Updated worklog overlaps with an existing worklog
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                WORKLOG_OVERLAP:
                  summary: "1022 - worklog overlaps with existing worklog"
                  value:
                    status: 409
                    detail: "1022 - worklog overlaps with existing worklog"
      x-functional-errors:
        - 1017
        - 1019
        - 1022
        - 1025

  worker-correction:
    put:
      summary: Correct own worklog
      description: >
        Submits a correction to a closed worklog owned by the authenticated worker. A non-blank
        reason is required and a successful correction enters PENDING_REVIEW until management
        confirms it. The worker may change either punch or the current note.
      tags:
        - Worklogs
      operationId: correctOwnWorklog
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog to correct
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Corrected worklog values and mandatory reason
        content:
          application/json:
            schema:
              $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogCorrectionRequestDTO'
      responses:
        '200':
          description: Worklog correction accepted for review
          content:
            application/json:
              schema:
                $ref: '../../components/worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        '400':
          description: Correction or reason is invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '403':
          description: The authenticated worker does not own the worklog
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Worklog not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Correction overlaps another worklog or the worklog was modified concurrently
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1017
        - 1019
        - 1022
        - 1025
        - 1049
        - 1068

  worker-confirmation:
    post:
      summary: Confirm own worklog
      description: >
        Confirms an automatically closed or otherwise pending worklog owned by the authenticated
        worker without changing its data. Confirmation requires no reason and makes the worklog
        reportable.
      tags:
        - Worklogs
      operationId: confirmWorklog
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog to confirm
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Worklog confirmed successfully
          content:
            application/json:
              schema:
                $ref: '../../components/worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: The authenticated worker does not own the worklog
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Worklog not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: The worklog cannot transition to confirmed
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1017
        - 1019
        - 1067

  management-correction:
    put:
      summary: Correct a business worklog
      description: >
        Allows an owner or manager of the route business to correct a worker worklog. A non-blank
        reason is required. Successful management corrections are approved immediately; changed
        punch origins become ADMIN while unchanged origins are preserved.
      tags:
        - Worklogs
      operationId: correctBusinessWorklog
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog to correct
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Corrected worklog values and mandatory reason
        content:
          application/json:
            schema:
              $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogCorrectionRequestDTO'
      responses:
        '200':
          description: Worklog corrected and approved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        '400':
          description: Correction or reason is invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '403':
          description: The authenticated user is not an owner or manager of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Business or worklog not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Correction overlaps another worklog or the worklog was modified concurrently
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1006
        - 1017
        - 1022
        - 1049
        - 1068

  approval:
