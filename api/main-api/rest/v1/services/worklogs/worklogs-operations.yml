  worker-correction:
    put:
      summary: Correct own worklog
      description: >
        Submits a correction to a closed worklog owned by the authenticated worker. A non-blank
        reason is required and a successful correction enters PENDING_REVIEW until management
        confirms it. The worker may change either punch or the current note.
      tags:
        - Worklogs
      operationId: correctOwnWorklog
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog to correct
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Corrected worklog values and mandatory reason
        content:
          application/json:
            schema:
              $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogCorrectionRequestDTO'
      responses:
        '200':
          description: Worklog correction accepted for review
          content:
            application/json:
              schema:
                $ref: '../../components/worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        '400':
          description: Correction or reason is invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '403':
          description: The authenticated worker does not own the worklog
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Worklog not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Correction overlaps another worklog or the worklog was modified concurrently
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1017
        - 1019
        - 1022
        - 1025
        - 1049
        - 1068

  worker-confirmation:
    post:
      summary: Confirm own worklog
      description: >
        Confirms an automatically closed or otherwise pending worklog owned by the authenticated
        worker without changing its data. Confirmation requires no reason and makes the worklog
        reportable.
      tags:
        - Worklogs
      operationId: confirmWorklog
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog to confirm
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Worklog confirmed successfully
          content:
            application/json:
              schema:
                $ref: '../../components/worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        '401':
          description: Unauthorized
        '403':
