  management-break-correction:
    put:
      summary: Correct a business worklog break
      description: >
        Corrects a completed break in a closed worklog for the owner of the route business. A
        non-blank reason is required and the worklog remains APPROVED. Incident reconciliation
        runs synchronously in this request: incidents no longer produced by the corrected data
        resolve as CORRECTED, or NO_LONGER_APPLICABLE when that incident type does not admit
        CORRECTED; OUTSIDE_GEOFENCE resolves as CORRECTED. Remaining or newly produced temporal
        incidents (EARLY_ENTRY, LATE_ENTRY, EARLY_EXIT, LATE_EXIT, UNEXPLAINED_GAP) resolve as
        ACCEPTED by the correcting owner with this reason, so no separate accept or approve call is
        needed. Structural incidents (UNSCHEDULED_WORK, AMBIGUOUS_MATCH, NO_SHOW) remain open and
        block approval; AUTOMATIC_CLOSE remains open and blocks approval if its clock-out was not
        corrected. Only the OWNER of the business may call this operation; a MANAGER receives 403
        (1020).
      tags:
        - Worklogs
      operationId: correctBusinessWorklogBreak
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog
          schema:
            type: integer
            format: int64
        - name: breakId
          in: path
          required: true
          description: ID of the break to correct
