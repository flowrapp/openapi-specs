      summary: Approve a business worklog
      description: Allows an owner or manager of the business to approve a pending or confirmed worklog without changing its data.
      tags:
        - Worklogs
      operationId: approveWorklog
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog to approve
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Worklog approved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/worklogs/components.yml#/components/schemas/WorkLogResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: The authenticated user is not an owner or manager of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Business or worklog not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: The worklog cannot transition to approved
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1006
        - 1017
        - 1067

  rejection:
    post:
      summary: Reject a business worklog
      description: Allows an owner or manager of the business to reject a worklog. A non-blank reason is required and the worklog remains retained for audit.
      tags:
        - Worklogs
      operationId: rejectWorklog
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
