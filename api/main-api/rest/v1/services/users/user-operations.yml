users:
  byName:
    post:
      summary: Find a user by name
      description: Searches for and retrieves a user profile based on the provided name.
      tags:
        - Users
      operationId: getUser
      security:
        - basicAuth: []
        - bearerAuth: []
      requestBody:
        description: User information to search for
        content:
          application/json:
            schema:
              "$ref": '../../components/users/components.yml#/components/schemas/UserRequestDTO'
        required: true
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                "$ref": "../../components/users/components.yml#/components/schemas/UserResponseDTO"
        '404':
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                USER_NOT_FOUND:
                  summary: "1000 - user not found"
                  value:
                    status: 404
                    detail: "1000 - user not found"
      x-functional-errors:
        - 1000

  me:
    get:
      summary: Get the current user
      description: >-
        Returns the Flowrapp profile of the authenticated caller, resolved from the
        mail claim of the bearer token. Used by the BFF when the token subject is not
        a Flowrapp user id (Clerk session tokens).
      tags:
        - Users
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                "$ref": "../../components/users/components.yml#/components/schemas/CurrentUserResponseDTO"
        '401':
          description: Missing or invalid bearer token
        '403':
          description: >-
            The token mail does not match any Flowrapp user (1016), or the user is
            not enabled yet (plain 403 without functional code)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                CURRENT_USER_NOT_FOUND:
                  summary: "1016 - Current user not found"
                  value:
                    status: 403
                    detail: "1016 - Current user not found"
      x-functional-errors:
        - 1016

  change-password:
    put:
      deprecated: true
      summary: Change user password
      description: Updates the password for the authenticated user.
      tags:
        - Users
      operationId: changePassword
      security:
        - basicAuth: []
        - bearerAuth: []
      requestBody:
        description: New password information
        content:
          application/json:
            schema:
              "$ref": '../../components/users/components.yml#/components/schemas/PasswordChangeRequestDTO'
        required: true
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: User auth provider not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                USER_AUTH_PROVIDER_NOT_FOUND:
                  summary: "1024 - user auth provider not found"
                  value:
                    status: 400
                    detail: "1024 - user auth provider not found"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User does not have permission to change this password
        '404':
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                USER_NOT_FOUND:
                  summary: "1000 - user not found"
                  value:
                    status: 404
                    detail: "1000 - user not found"
      x-functional-errors:
        - 1000
        - 1024
