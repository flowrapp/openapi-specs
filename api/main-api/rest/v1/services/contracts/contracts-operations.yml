  contract-amendments-v2:
    post:
      summary: Apply an amendment to a contract's hours or job role from a date (version 2)
      description: >
        Version 2 of the amendment, the only one that writes. Its path does not exist in a Main API that predates it,
        so a client that calls it is rejected before any write by such a service (404) and must not fall back to
        `/amendments`. Rule of this version (from Main API 0.0.127): when the job role changes, the planned shifts
        of this person from `effectiveDate` change job role in the DRAFT planning of the current week and in every
        later week, DRAFT or PUBLISHED alike; the current week is conserved when it is PUBLISHED. The status of a
        planning (including its publication) never changes. This replaces the rule that v2 had until 0.0.126
        (only DRAFT plannings): a preview of that rule is never confirmed with this one, see `currentWeekStart`.

        Applies an amendment in one database transaction, only if the state the user saw still holds.
        `expectedState` carries the contract `updatedAt`, the `version` of every affected planning, and the
        data of every scheduled shift of this person from `effectiveDate` (id, planning, job role, catalog
        shift, start, end, break and `updatedAt`). The planning `version` alone is not enough, because editing
        a shift is not guaranteed to change it. The operation recalculates all of that inside the transaction
        under the planning locks and compares it; any added, removed or modified shift, or any other difference,
        is rejected with 1167 and nothing is written. The client then recalculates the preview (BFF) and asks the user again.

        `expectedState.currentWeekStart` is the Monday of the week that contained today, in the business time zone,
        when the preview was taken. Inside the same transaction the operation computes that Monday again and rejects
        with 1167, writing nothing, when it differs (the local week changed between preview and confirmation, so the
        applicable set would be another) and also when the field is absent: a state issued before this rule, which
        showed the previous one, is not confirmed. The same 1167 applies to any concurrent change that alters the
        applicable set (a shift added, removed or edited keeping its id, a planning version moved, a DRAFT
        published or the reverse). The recovery is always a new preview.

        Effective date (business time zone): it must be today or later (1169 otherwise, also when it is the
        first day of the contract) and within the validity of the contract, from its `startDate` to its `endDate`
        inclusive (1170 otherwise); contracts of a single day are valid. At least one of `totalWeekHours` or
        `jobRoleId` must differ from the current contract (1171 otherwise). The new contract keeps the previous
        `endDate`.

        Examples, with today = 2026-11-23 and a contract from 2026-12-01 to 2026-12-31 (hours 40, job role 10):
        - `effectiveDate` 2026-12-01 (first day): the contract is corrected in place, same id and start date,
          `closedContract` null, no earlier segment.
        - `effectiveDate` 2026-12-02 (start + 1): the previous contract becomes 2026-12-01 to 2026-12-01 (one day)
          and the new one runs 2026-12-02 to 2026-12-31.
        - `effectiveDate` 2026-12-15: previous 2026-12-01 to 2026-12-14, new 2026-12-15 to 2026-12-31.
        - `effectiveDate` 2026-12-31 (end date): previous 2026-12-01 to 2026-12-30, new 2026-12-31 to 2026-12-31
          (one day).
        - `effectiveDate` 2026-11-22 (past): 1169. 2026-11-30 (today or later but before the start) and 2027-01-01
          (after the end): 1170. The past check comes first, so a contract that started on 2026-11-01 rejects
          `effectiveDate` 2026-11-01 with 1169.
        - Same hours and job role as the current contract: 1171.

        Correction from the first day (`effectiveDate` equals `startDate`, today or future): the existing contract
        is updated in place, keeping its id, so references to it stay valid. In the same transaction the previous
        `totalWeekHours` and `jobRoleId` are recorded in the audit trail (an audit event that carries the contract
        id, the previous and the new hours and job role, the effective date and the acting user). They are internal
        to audit: no operation of this API returns that history and the app shows none.

        Scheduled shifts are never deleted, unassigned, shortened or reassigned, and no shift without a person is
        created. Planned hours are never trimmed when they exceed the new `totalWeekHours`. Only one planning
        write exists: when the job role changes, the job role of this person's shifts from `effectiveDate` changes
        to the new one (a) in the DRAFT planning of the current week (the week that contains today in the business
        time zone) and (b) in every later week, whether its planning is DRAFT or PUBLISHED. A PUBLISHED current
        week is conserved. Their hours, assignment, schedule and break stay as they are, and a PUBLISHED planning
        stays PUBLISHED (not republished). Shifts before `effectiveDate`, shifts of other people and ARCHIVED
        plannings are not touched. An amendment of hours only writes no planning. When no shift of this person
        qualifies, only the contract is written. The new terms are taken into account when later weeks are
        planned, never before `effectiveDate`. A business has one planning per week, so its status applies to
        all the shifts of that week.
        Example: job role General to Security from 2026-11-27, today 2026-11-24, with this person's shifts on
        2026-11-27 (week 2026-11-23 to 2026-11-29) and 2026-12-01, 02 and 04 (week 2026-11-30 to 2026-12-06).
        With both weeks PUBLISHED, 2026-11-27 keeps General (current week conserved) and 2026-12-01, 02 and 04
        change to Security, the week staying PUBLISHED. With 2026-11-23 to 2026-11-29 in DRAFT, 2026-11-27 also
        changes. With a PUBLISHED current week and several later PUBLISHED weeks, all later weeks change from the
        effective date; a date in the middle of a week changes only that day onwards. A request to exchange or
        change a shift that is still open and belongs to a planning written here is no longer valid because the
        planning version changes, and a new request must be made; the version is per weekly planning, so this
        reaches every open request that includes a shift of that week, not only a shift whose job role changed.
        No notification is sent automatically to the employee. Fichajes already registered are
        never touched. Either all changes are saved or none is. Only roles that manage the business team
        (`CONTRACTS_MANAGE`) in the business can call this operation.
      tags:
        - Contracts
      operationId: applyContractAmendmentV2
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user whose contract is amended
          schema:
            type: integer
            format: int64
        - name: contractId
          in: path
          required: true
          description: Unique identifier of the contract to amend
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ContractAmendmentApplyRequestDTO'
            example:
              effectiveDate: "2026-12-01"
              totalWeekHours: 32.0
              jobRoleId: 10
              expectedState:
                contractUpdatedAt: "2026-11-20T10:00:00Z"
                currentWeekStart: "2026-11-30"
                plannings:
                  - planningId: 77
                    version: 4
                shifts:
                  - shiftId: 501
                    planningId: 77
                    jobRoleId: 10
                    catalogShiftId: 4
                    startAt: "2026-12-08T08:00:00Z"
                    endAt: "2026-12-08T16:00:00Z"
                    breakMinutes: 30
                    updatedAt: "2026-11-20T09:15:00Z"
      responses:
        '201':
          description: Amendment applied. The new contract is active from `effectiveDate`; the previous one is closed the day before, or not created when `effectiveDate` is the first day of the contract.
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ContractAmendmentResultDTO'
        '400':
          description: Effective date in the past, effective date outside the contract validity, or no change in hours and job role
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                datePast:
                  value:
                    status: 400
                    detail: "1169 - contract amendment effective date is in the past"
                dateOutOfRange:
                  value:
                    status: 400
                    detail: "1170 - contract amendment effective date is outside the contract validity"
                noChanges:
                  value:
                    status: 400
                    detail: "1171 - contract amendment changes neither hours nor job role"
        '401':
          description: Unauthorized
        '403':
          description: Current user cannot manage the business team
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business, user, contract, or job role not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: The expected state changed since the preview, the effective date overlaps another contract, or the contract changed concurrently
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                expectedStateChanged:
                  value:
                    status: 409
                    detail: "1167 - contract amendment expected state changed; recalculate the preview"
                contractOverlap:
                  value:
                    status: 409
                    detail: "1029 - contract overlaps another contract for the same user and business"
                concurrentModification:
                  value:
                    status: 409
                    detail: "1049 - resource was modified concurrently"
      x-functional-errors:
        - 1006
        - 1020
        - 1029
        - 1034
        - 1049
        - 1167
