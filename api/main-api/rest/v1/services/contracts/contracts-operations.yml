contracts:
  business-contracts:
    get:
      summary: List business contracts intersecting a date range
      description: >
        Retrieves every contract for the business whose inclusive validity period intersects
        the inclusive business-local `from` and `to` dates. The range must not be reversed and
        may contain at most 31 calendar dates. A valid range with no matches returns `200 []`.
        Results are not paginated because the bounded range and non-overlap invariant are sufficient
        for the business-wide projection. Only the business owner can access this operation.
      tags:
        - Contracts
      operationId: getBusinessContracts
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: from
          in: query
          required: true
          description: Inclusive first business-local date; the range may contain at most 31 calendar dates
          schema:
            type: string
            format: date
            example: "2025-07-01"
        - name: to
          in: query
          required: true
          description: Inclusive last business-local date; must not precede from
          schema:
            type: string
            format: date
            example: "2025-07-31"
      responses:
        '200':
          description: All contracts intersecting the requested range, or an empty collection when none match
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/contracts/components.yml#/components/schemas/BusinessContractResponseDTO'
              examples:
                contractsAtBothBoundaries:
                  summary: Contracts for multiple users intersecting one range boundary each
                  value:
                    - id: 123
                      userId: 1
                      businessId: 101
                      jobRoleId: 10
                      totalWeekHours: 40.0
                      startDate: "2025-06-15"
                      endDate: "2025-07-03"
                      createdAt: "2025-06-01T10:15:00+00:00"
                      updatedAt: "2025-06-01T10:15:00+00:00"
                    - id: 124
                      userId: 2
                      businessId: 101
                      jobRoleId: 11
                      totalWeekHours: 20.0
                      startDate: "2025-07-29"
                      endDate: "2025-08-20"
                      createdAt: "2025-07-20T10:15:00+00:00"
                      updatedAt: "2025-07-20T10:15:00+00:00"
                noMatches:
                  summary: No contracts intersect the range
                  value: []
        '400':
          description: Contract date range is reversed or contains more than 31 inclusive calendar dates
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                invalidRange:
                  value:
                    status: 400
                    detail: "1057 - contract date range is invalid"
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 404
                detail: "1006 - business does not exist"
      x-functional-errors:
        - 1006
        - 1020
        - 1057

  current-contracts-batch:
    get:
      summary: Get current contracts for a set of users
      description: >
        Returns the contract effective on the business-local current date for each requested
        member, including that contract's job role. One call covers the whole set. Requested
        users without a current contract, and user ids that are not active members, are omitted
        rather than rejected. The caller must be an OWNER or MANAGER of the business.
        `userIds` is required and holds 1 to 50 identifiers, the same cap as a member-list page.
        This is not `GET /api/v1/businesses/{businessId}/contracts`, which lists every contract
        intersecting a date range and does not accept `userIds` or embed the job role, and it is
        not `GET /api/v1/businesses/{businessId}/users/{userId}/contracts/current`, which is one
        user per call.
      tags:
        - Contracts
      operationId: getCurrentContractsForUsers
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 101
        - name: userIds
          in: query
          required: true
          description: >
            User ids to resolve, repeated (`userIds=41&userIds=18`). At least 1 and at most 50
            distinct ids. More than 50, an empty list, or duplicates return 400 INVALID_USER_IDS.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            uniqueItems: true
            items:
              type: integer
              format: int64
              minimum: 1
            example: [41, 18, 27]
      responses:
        '200':
          description: >
            Current contracts for the requested members who have one. Members without a current
            contract are absent.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/business/components.yml#/components/schemas/BusinessCurrentContractBatchItemDTO'
              example:
                - userId: 41
                  contract:
                    id: 501
                    businessId: 101
                    jobRoleId: 11
                    jobRole:
                      id: 11
                      code: COOK
                      name: Cocina
                      color: "#4C9F70"
                      icon: kitchen
                      active: true
                    totalWeekHours: 40.0
                    startDate: "2025-01-01"
                    endDate: null
                - userId: 18
                  contract:
                    id: 480
                    businessId: 101
                    jobRoleId: 10
                    jobRole:
                      id: 10
                      code: WAITER
                      name: Sala
                      color: "#1A2B3C"
                      icon: front-of-house
                      active: true
                    totalWeekHours: 20.0
                    startDate: "2025-03-01"
                    endDate: null
        '400':
          description: userIds is missing, empty, longer than 50, or contains duplicates
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 400
                detail: "1111 - userIds must contain between 1 and 50 identifiers"
        '401':
          description: No authenticated session
        '403':
          description: Current user is not an owner or manager of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 404
                detail: "1006 - business does not exist"
      x-functional-errors: [1006, 1020, 1111]

  business-user-contracts:
    post:
      summary: Create a user contract
      description: Creates a contract for a user associated with a business. Date ranges cannot overlap another contract for the same user and business, even when the job roles differ. Only the business owner can manage contracts.
      tags:
        - Contracts
      operationId: createUserContract
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user receiving the contract
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Contract details
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ContractRequestDTO'
            example:
              jobRoleId: 10
              totalWeekHours: 40.0
              startDate: "2025-01-01"
              endDate: null
      responses:
        '201':
          description: Contract created successfully
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ContractResponseDTO'
              example:
                id: 123
                businessId: 101
                jobRoleId: 10
                totalWeekHours: 40.0
                startDate: "2025-01-01"
                endDate: null
                createdAt: "2024-12-20T10:15:00+00:00"
                updatedAt: "2024-12-20T10:15:00+00:00"
        '400':
          description: Contract dates or weekly hours are invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business or user not found, or user is not associated with the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Contract dates overlap with another contract for the same user and business, regardless of job role
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1000
        - 1006
        - 1015
        - 1020
        - 1029

    get:
      summary: List user contracts in a business
      description: Retrieves a paginated slice of contracts for a user in a business, ordered by start date descending. Only the business owner can access this business-scoped history.
      tags:
        - Contracts
      operationId: getUserContracts
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user whose contracts are requested
          schema:
            type: integer
            format: int64
        - $ref: '../../components/contracts/components.yml#/components/parameters/Page'
        - $ref: '../../components/contracts/components.yml#/components/parameters/Size'
      responses:
        '200':
          description: Contract slice retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ContractSliceResponseDTO'
              example:
                content:
                  - id: 123
                    businessId: 101
                    jobRoleId: 10
                    totalWeekHours: 40.0
                    startDate: "2025-01-01"
                    endDate: null
                    createdAt: "2024-12-20T10:15:00+00:00"
                    updatedAt: "2024-12-20T10:15:00+00:00"
                page: 0
                size: 20
                hasNext: false
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business or user not found, or user is not associated with the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1000
        - 1006
        - 1015
        - 1020

  current-business-user-contract:
    get:
      summary: Get the current contract for a user in a business
      description: >
        BREAKING CHANGE: Retrieves one contract effective on the business-local current date,
        or returns 204 when none is effective. Contract periods cannot overlap for the same user
        and business across different job roles.
      tags:
        - Contracts
      operationId: getCurrentUserContract
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user whose current contract is requested
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Current contract retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ContractResponseDTO'
              example:
                id: 123
                businessId: 101
                jobRoleId: 10
                totalWeekHours: 10.0
                startDate: "2025-01-01"
                endDate: null
                createdAt: "2024-12-20T10:15:00+00:00"
                updatedAt: "2024-12-20T10:15:00+00:00"
        '204':
          description: No contract is effective on the business-local current date
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business or user not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1000
        - 1006
        - 1020

  business-user-contract:
    delete:
      summary: Delete a future user contract
      description: >
        Deletes a contract only when its startDate is strictly after the current date in the
        business time zone. Contracts starting today or earlier cannot be deleted, regardless
        of whether the user has clocked in. The contract must belong to the business and user
        identified in the path; otherwise, returns 404. Only the business OWNER may delete
        contracts; the MANAGER role is not sufficient. The inclusive contract period must not
        intersect a planning in SOLVING, DRAFT, PUBLISHED, or ARCHIVED. CREATED and FAILED
        plannings do not by themselves block deletion. Eligibility checks and deletion must
        be atomic so that concurrent planning changes cannot bypass these restrictions.
      tags:
        - Contracts
      operationId: deleteUserContract
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user whose contract is deleted
          schema:
            type: integer
            format: int64
        - name: contractId
          in: path
          required: true
          description: Unique identifier of the future contract to delete
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Future contract deleted successfully; no response body
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business, or the target user is not a business member
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                notMember:
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: Business or user not found, or contract not found for the specified business and user (including an already deleted contract)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  value: {status: 404, detail: "1006 - business does not exist"}
                userNotFound:
                  value: {status: 404, detail: "1000 - user not found"}
                contractNotFound:
                  value: {status: 404, detail: "1030 - Contract not found"}
        '409':
          description: Contract starts today or earlier in the business time zone, or its inclusive period intersects a planning in SOLVING, DRAFT, PUBLISHED, or ARCHIVED
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                contractAlreadyStarted:
                  value: {status: 409, detail: "1097 - contract has already started"}
                planningStateConflict:
                  value: {status: 409, detail: "1102 - contract deletion is blocked by planning state"}
      x-functional-errors: [1000, 1006, 1015, 1020, 1030, 1097, 1102]

    put:
      summary: Update a contract end date
      description: >
        BREAKING CHANGE: Updates only the nullable `endDate` of a specific contract. The job role,
        weekly hours, and start date are immutable after creation; changed terms require a new
        non-overlapping contract. The previous and proposed inclusive contract periods must not
        intersect a planning in `SOLVING`, `DRAFT`, `PUBLISHED`, or `ARCHIVED`. `CREATED` and `FAILED`
        plannings do not by themselves freeze contract validity. Only the business owner can manage
        contracts.
      tags:
        - Contracts
      operationId: updateUserContract
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user receiving the contract
          schema:
            type: integer
            format: int64
        - name: contractId
          in: path
          required: true
          description: Unique identifier of the contract to update
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: New contract end date; all other contract terms remain unchanged
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ContractEndDateUpdateRequestDTO'
            example:
              endDate: "2025-07-31"
      responses:
        '200':
          description: Contract updated successfully with only its end date changed
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ContractResponseDTO'
        '400':
          description: Contract end date is invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 400
                detail: "1057 - contract date range is invalid"
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business, user, or contract not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: >
            The proposed end date overlaps another contract for the same user and business, or
            the previous or proposed contract period intersects a planning in SOLVING, DRAFT,
            PUBLISHED, or ARCHIVED. CREATED and FAILED plannings do not cause this conflict.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                contractOverlap:
                  value:
                    status: 409
                    detail: "1029 - contract overlaps another contract for the same user and business"
                planningStateConflict:
                  value:
                    status: 409
                    detail: "1058 - contract update is blocked by planning state"
      x-functional-errors:
        - 1000
        - 1006
        - 1015
        - 1020
        - 1029
        - 1057
        - 1058

  current-user-contracts:
    get:
      summary: List the authenticated user's contract history across businesses
      description: >
        Retrieves a paginated slice of every contract of the authenticated user across
        all of their businesses, ordered by start date descending. Membership is enough;
        TEAM_VIEW is not required. Each contract includes `jobRoleName`, the display
        name of `jobRoleId`. The job-role catalog requires TEAM_VIEW, so an employee
        without that permission still receives the name here. `jobRoleName` is null
        only when the role has no stored name.
      tags:
        - Contracts
      operationId: getCurrentUserContracts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/contracts/components.yml#/components/parameters/Page'
        - $ref: '../../components/contracts/components.yml#/components/parameters/Size'
      responses:
        '200':
          description: Contract slice retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/CurrentUserContractSliceResponseDTO'
              example:
                content:
                  - id: 123
                    businessId: 101
                    jobRoleId: 10
                    jobRoleName: Sala
                    totalWeekHours: 40.0
                    startDate: "2025-01-01"
                    endDate: null
                    createdAt: "2024-12-20T10:15:00+00:00"
                    updatedAt: "2024-12-20T10:15:00+00:00"
                  - id: 122
                    businessId: 202
                    jobRoleId: 20
                    jobRoleName: Cocina
                    totalWeekHours: 20.0
                    startDate: "2024-06-01"
                    endDate: "2024-12-31"
                    createdAt: "2024-05-20T10:15:00+00:00"
                    updatedAt: "2024-05-20T10:15:00+00:00"
                page: 0
                size: 20
                hasNext: false
        '401':
          description: Unauthorized
        '403':
          description: Authenticated user could not be resolved
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1016 - Current user not found"
      x-functional-errors:
        - 1016

  contract-amendment-preview:
    post:
      summary: Preview the impact of amending a contract's hours or job role from a date
      description: >
        Read-only. Shows what an amendment would do before anything is saved: the previous
        contract closes the day before `effectiveDate`, a new contract starts on `effectiveDate`
        with the proposed terms, and every scheduled shift of this person from `effectiveDate`
        onward is listed in `publishedShifts` or `draftShifts`. Published shifts are never removed
        silently and their job role is never changed automatically. Draft shifts are only listed: the
        manager adjusts them manually. `effectiveDate` must be today or later in the business time zone;
        a past date is rejected with 1057. `exceedsPlannedHours` is informational and does not block the amendment.
        Nothing is written. The response carries `previewFingerprint`, which the apply operation
        must send back; it changes when the contract or any affected planning changes, so a stale
        preview is rejected instead of applied silently. Only roles that manage the business team
        (`CONTRACTS_MANAGE`) can call this operation. At least one of `totalWeekHours` or `jobRoleId`
        is required. Fichajes are never read or changed.
      tags:
        - Contracts
      operationId: previewContractAmendment
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user whose contract is amended
          schema:
            type: integer
            format: int64
        - name: contractId
          in: path
          required: true
          description: Unique identifier of the contract to amend
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ContractAmendmentRequestDTO'
            example:
              effectiveDate: "2026-12-01"
              totalWeekHours: 32.0
      responses:
        '200':
          description: Impact preview. Nothing has been saved.
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ContractAmendmentPreviewDTO'
        '400':
          description: Effective date, hours, or job role is invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 400
                detail: "1057 - contract date range is invalid"
        '401':
          description: Unauthorized
        '403':
          description: Current user cannot manage the business team
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business, user, contract, or job role not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: The effective date overlaps another contract for the same user and business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 409
                detail: "1029 - contract overlaps another contract for the same user and business"
      x-functional-errors:
        - 1006
        - 1020
        - 1029
        - 1034
        - 1057

  contract-amendments:
    post:
      summary: Apply an amendment to a contract's hours or job role from a date
      description: >
        Applies a previously previewed amendment in one database transaction: closes the previous
        contract the day before `effectiveDate`, creates the new contract starting on `effectiveDate`,
        and records one explicit decision for every affected shift. Either all changes are saved or
        none is. `previewFingerprint` must match a fresh preview; otherwise the request is rejected
        with 1167 and nothing changes. Every published shift listed by the preview needs exactly one
        decision in `shiftDecisions`; a missing decision, or one for a shift that is not published, is
        rejected with 1168. Published shifts are
        never deleted silently: `KEEP_AND_NOTIFY` keeps them, `UNASSIGN` removes this person from them
        so they can be reassigned. Decisions apply to PUBLISHED shifts only; draft shifts are not changed
        by this operation. `effectiveDate` must be today or later in the business time zone (1057 otherwise). Fichajes already
        registered are never touched. Only roles that manage the business team (`CONTRACTS_MANAGE`)
        can call this operation.
      tags:
        - Contracts
      operationId: applyContractAmendment
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user whose contract is amended
          schema:
            type: integer
            format: int64
        - name: contractId
          in: path
          required: true
          description: Unique identifier of the contract to amend
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ContractAmendmentApplyRequestDTO'
            example:
              effectiveDate: "2026-12-01"
              totalWeekHours: 32.0
              previewFingerprint: "3f9c1a0e"
              shiftDecisions:
                - shiftId: 501
                  action: KEEP_AND_NOTIFY
                - shiftId: 502
                  action: UNASSIGN
      responses:
        '201':
          description: Amendment applied. The previous contract is closed and the new one is active from `effectiveDate`.
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ContractAmendmentResultDTO'
        '400':
          description: Effective date, hours, job role, or shift decisions are invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                decisionsMissing:
                  value:
                    status: 400
                    detail: "1168 - shift decisions are missing or do not match the affected shifts"
                rangeInvalid:
                  value:
                    status: 400
                    detail: "1057 - contract date range is invalid"
        '401':
          description: Unauthorized
        '403':
          description: Current user cannot manage the business team
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business, user, contract, or job role not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: The preview is stale, the effective date overlaps another contract, or the contract changed concurrently
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                stalePreview:
                  value:
                    status: 409
                    detail: "1167 - contract amendment preview is stale"
                contractOverlap:
                  value:
                    status: 409
                    detail: "1029 - contract overlaps another contract for the same user and business"
                concurrentModification:
                  value:
                    status: 409
                    detail: "1049 - resource was modified concurrently"
      x-functional-errors:
        - 1006
        - 1020
        - 1029
        - 1034
        - 1049
        - 1057
        - 1167
        - 1168
