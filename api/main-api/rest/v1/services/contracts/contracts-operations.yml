contracts:
  business-user-contracts:
    post:
      summary: Create a user contract
      description: Creates a contract for a user associated with a business. Only the business owner can manage contracts.
      tags:
        - Contracts
      operationId: createUserContract
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user receiving the contract
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Contract details
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ContractRequestDTO'
            example:
              totalWeekHours: 40.0
              startDate: "2025-01-01"
              endDate: null
      responses:
        '201':
          description: Contract created successfully
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ContractResponseDTO'
              example:
                id: 123
                businessId: 101
                totalWeekHours: 40.0
                startDate: "2025-01-01T00:00:00+00:00"
                endDate: null
                createdAt: "2024-12-20T10:15:00+00:00"
                updatedAt: "2024-12-20T10:15:00+00:00"
        '400':
          description: Contract dates or weekly hours are invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business or user not found, or user is not associated with the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Contract dates overlap with another contract for the user in the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1000
        - 1006
        - 1015
        - 1020

    get:
      summary: List user contracts in a business
      description: Retrieves a paginated slice of contracts for a user in a business, ordered by start date descending. Only the business owner can access this business-scoped history.
      tags:
        - Contracts
      operationId: getUserContracts
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user whose contracts are requested
          schema:
            type: integer
            format: int64
        - $ref: '../../components/contracts/components.yml#/components/parameters/Page'
        - $ref: '../../components/contracts/components.yml#/components/parameters/Size'
      responses:
        '200':
          description: Contract slice retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ContractSliceResponseDTO'
              example:
                content:
                  - id: 123
                    businessId: 101
                    totalWeekHours: 40.0
                    startDate: "2025-01-01"
                    endDate: null
                    createdAt: "2024-12-20T10:15:00+00:00"
                    updatedAt: "2024-12-20T10:15:00+00:00"
                page: 0
                size: 20
                hasNext: false
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business or user not found, or user is not associated with the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1000
        - 1006
        - 1015
        - 1020

  current-business-user-contract:
    get:
      summary: Get the current contract for a user in a business
      description: Retrieves the contract effective now with the most recent start date. An open-ended contract is valid when its end date is null.
      tags:
        - Contracts
      operationId: getCurrentUserContract
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user whose current contract is requested
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Current contract retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ContractResponseDTO'
              example:
                id: 123
                businessId: 101
                totalWeekHours: 40.0
                startDate: "2025-01-01"
                endDate: null
                createdAt: "2024-12-20T10:15:00+00:00"
                updatedAt: "2024-12-20T10:15:00+00:00"
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business, user, or current contract not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1000
        - 1006
        - 1020

  business-user-contract:
    put:
      summary: Update a user contract
      description: Replaces the dates and weekly hours of a specific contract. Only the business owner can manage contracts.
      tags:
        - Contracts
      operationId: updateUserContract
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: Unique identifier of the user receiving the contract
          schema:
            type: integer
            format: int64
        - name: contractId
          in: path
          required: true
          description: Unique identifier of the contract to update
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Updated contract details
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ContractRequestDTO'
            example:
              totalWeekHours: 35.0
              startDate: "2025-01-01"
              endDate: null
      responses:
        '200':
          description: Contract updated successfully
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ContractResponseDTO'
        '400':
          description: Contract dates or weekly hours are invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '403':
          description: Current user is not the owner of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not the owner of business"
        '404':
          description: Business, user, or contract not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Contract dates overlap with another contract for the user in the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
      x-functional-errors:
        - 1000
        - 1006
        - 1015
        - 1020

  current-user-contracts:
    get:
      summary: List the current user's contracts across businesses
      description: Retrieves a paginated slice of all contracts belonging to the authenticated user across every associated business, ordered by start date descending.
      tags:
        - Contracts
      operationId: getCurrentUserContracts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/contracts/components.yml#/components/parameters/Page'
        - $ref: '../../components/contracts/components.yml#/components/parameters/Size'
      responses:
        '200':
          description: Contract slice retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ContractSliceResponseDTO'
              example:
                content:
                  - id: 123
                    businessId: 101
                    totalWeekHours: 40.0
                    startDate: "2025-01-01"
                    endDate: null
                    createdAt: "2024-12-20T10:15:00+00:00"
                    updatedAt: "2024-12-20T10:15:00+00:00"
                  - id: 122
                    businessId: 202
                    totalWeekHours: 20.0
                    startDate: "2024-06-01"
                    endDate: "2024-12-31"
                    createdAt: "2024-05-20T10:15:00+00:00"
                    updatedAt: "2024-05-20T10:15:00+00:00"
                page: 0
                size: 20
                hasNext: false
        '401':
          description: Unauthorized
        '500':
          description: Authenticated user could not be resolved
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example:
                status: 500
                detail: "1016 - Current user not found"
      x-functional-errors:
        - 1016
