attendanceInbox:
  incidents:
    get:
      tags: [Attendance]
      operationId: getCurrentUserAttendanceIncidents
      summary: List the caller's actionable attendance incidents
      description: |
        Legacy Main API 0.0.96 inbox query retained from approved source commit `92f0504`.
        It returns only the caller's own incidents for this business with lifecycle OPEN and
        current justification IS NULL. MATCH scope is owned through the worklog's worker;
        SHIFT scope through the shift assignee. Any active business membership role may
        call it, but OWNER and MANAGER never receive another worker's incidents.

        Once justified, an item leaves this legacy list but remains OPEN and can still be
        edited through the existing individual justification contract/history. Resolved
        incidents are history only. There is no read/unread state or exact total.

        Order is persisted `incident.updatedAt` descending then `incident.id` descending,
        using a keyset cursor. Cursor is bound to business, caller and this collection;
        invalid/undecodable/foreign cursor is 400 `1142`. `limit` defaults to 20 and is 1..50;
        an out-of-range limit is a plain 400. Each item includes the legacy full
        `AttendanceIncidentDTO` and anchor: business-local navigation date (shift start for
        SHIFT or current MATCHED match, otherwise worklog clock-in), the actual current
        match id for every MATCH-scoped incident regardless of kind, and server-derived
        worklog id. `anchor.date` is navigation only, not a sort key, filter or cursor part.
        `updatedAt` is the persisted incident timestamp, read literally and never derived
        from justification, resolution, match or shift state. New/updated incidents sort
        before an existing cursor and appear after refreshing from page one; unchanged
        rows are not skipped or repeated solely because of insertion/update. Items that
        cease to be actionable simply disappear. Reconciliation may bring back an OPEN
        unjustified incident; a saved justification is never removed by this list contract.

        This is the legacy individual-item contract. New grouped reads and group-wide
        justification are separate operations.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/Cursor'
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/Limit'
      responses:
        '200':
          description: Page of the caller's actionable incidents.
          content:
            application/json:
              schema:
                $ref: '../../components/attendanceInbox/components.yml#/components/schemas/CurrentUserAttendanceIncidentPageDTO'
              examples:
                lateEntry:
                  value:
                    content:
                      - incident:
                          id: 880
                          scope: MATCH
                          attendanceMatchId: 700
                          scheduledShiftId: null
                          evidence: {type: LATE_ENTRY, measuredSeconds: 1080, toleranceSeconds: 300, candidateShiftIds: []}
                          lifecycle: OPEN
                          resolution: null
                          resolvedBy: null
                          resolvedAt: null
                          reason: null
                          justification: null
                          version: 1
                          createdAt: '2026-10-30T09:20:00+01:00'
                          updatedAt: '2026-10-30T09:20:00+01:00'
                        anchor: {date: '2026-10-30', scheduledShiftId: 900, attendanceMatchId: 700, worklogId: 3051}
                    hasNext: true
                    nextCursor: eyJ1IjoiMjAyNi0xMC0zMFQwODoyMDowMFoiLCJpIjo4ODB9
                empty:
                  value: {content: [], hasNext: false, nextCursor: null}
        '400':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/InboxListBadRequest'
        '401':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/Unauthorized'
        '403':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/NotMember'
        '404':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/BusinessNotFound'
      x-functional-errors: [1006, 1015, 1142]

  daily-counts:
    get:
      tags: [Attendance]
      operationId: getCurrentUserAttendanceIncidentDailyCounts
      summary: Count the caller's unjustified attendance incidents by day
      description: |
        Returns the caller's own attendance incidents in this business, counted by
        the business-local anchor date, for an inclusive date range. Any active
        membership role may call it. The caller never receives another worker's
        incidents.

        The path is nested under the caller-scoped collection
        `GET /api/v1/businesses/{businessId}/attendance-incidents`
        (`getCurrentUserAttendanceIncidents`) because these rows are the same
        incidents aggregated by date. Groups stay on the sibling path
        `/attendance-incident-groups`: they have their own `S-` / `M-` identity.
        The business-scoped incidents path has no `{incidentId}` child, so
        `daily-counts` does not collide with the individual justification route
        (`POST /api/v1/attendance-incidents/{incidentId}/justification`).

        Unjustified means lifecycle OPEN and justification null. An OPEN incident
        that already has a justification, and a resolved incident, are not counted.
        The anchor date is the same as the worker inbox: the business-local shift
        start for SHIFT scope or a MATCHED match, otherwise the business-local
        clock-in date. A night shift's incidents stay on the shift's start date.
        Dates use the business time zone, including DST days of 23 or 25 hours.

        `from` and `to` are required `YYYY-MM-DD` query dates. The range is
        inclusive: the number of dates is (to - from) + 1, and 42 is the maximum
        (a six-week month grid). `from` after `to`, or more than 42 dates, is
        400 `1157`. A missing parameter or a value that is not a date is a plain
        400 without a functional code.

        The list contains only dates with `unjustifiedCount` > 0, ordered by
        `date` ascending. A date with no unjustified incident is omitted, not
        returned as 0. An empty range match is `200` with `[]`.

        Requires membership and the ATTENDANCE feature. An active member of a
        business without it receives 403 `1155`, the same as the other
        self-service operations of that feature; `1155` is not repeated in
        `x-functional-errors`. A caller who is not an active member receives
        403 `1015`. An unknown business is 404 `1006`. No `ATTENDANCE_VIEW`
        permission is required. Planned seconds are not part of this operation;
        the BFF reads them from `getBusinessTeamSchedule`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/DailyCountFrom'
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/DailyCountTo'
      responses:
        '200':
          description: Dates in the range on which the caller has at least one OPEN incident with no justification.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/attendanceInbox/components.yml#/components/schemas/CurrentUserAttendanceIncidentDailyCountDTO'
              examples:
                someDays:
                  summary: Two dates with unjustified incidents; the other dates of the range are omitted
                  value:
                    - {date: '2026-03-02', unjustifiedCount: 1}
                    - {date: '2026-03-18', unjustifiedCount: 2}
                empty:
                  summary: No unjustified incidents in the range
                  value: []
        '400':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/DailyCountsBadRequest'
        '401':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/Unauthorized'
        '403':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/NotMember'
        '404':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/BusinessNotFound'
      x-functional-errors: [1006, 1015, 1157]

  confirmations:
    get:
      tags: [Worklogs]
      operationId: getCurrentUserWorklogChangeConfirmations
      summary: List the caller's pending worklog change confirmations
      description: >
        Independent persistent query of the authenticated user's own PENDING confirmations in
        the business. A confirmation is the caller's when the caller is the immutable `userId`
        of its worklog change. It always filters `status` PENDING; answered confirmations stay
        in the worklog history (`getWorklogHistory`, `WorklogChangeDTO.confirmation`). Any
        member role may call it and gets only their own items. There is no read or unread
        state.


        Each item is the full `WorklogChangeDTO` (worklog, parent `worklogChangeId`, action,
        old and new times, author, reason, `occurredAt`, confirmation) plus an `anchor` and
        `laterChangeExists`. The anchor is read with an explicit join from the change to the
        current match of its worklog, and `laterChangeExists` with an aggregate over the
        changes of the same worklog that sort after it in (`occurredAt`, `id`), both in the
        same page query, never one lookup per item. A later change of any action or author
        sets `laterChangeExists` to true without cancelling or invalidating this
        confirmation: it stays PENDING and is answered on its own. This is not a shift change
        request: no accepted or rejected request is synthesized, and it is unrelated to
        shift exchanges, schedule changes and `confirmWorklog`.


        Order is `change.occurredAt` descending, then `change.id` descending, with a keyset
        cursor. A PENDING row never changes until it is answered and then leaves the list, so
        pages are stable while new confirmations arrive; there is no exact total (see the
        badge). Errors: a non-member gets 403 1015 and an unknown business 404 1006; an
        invalid or foreign cursor is 400 1142.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/Cursor'
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/Limit'
      responses:
        '200':
          description: Page of the caller's PENDING confirmations. May be empty.
          content:
            application/json:
              schema:
                $ref: '../../components/attendanceInbox/components.yml#/components/schemas/CurrentUserWorklogChangeConfirmationPageDTO'
              examples:
                correction:
                  summary: An owner correction of the clock-out waiting for the worker
                  value:
                    content:
                      - change:
                          id: 1201
                          worklogId: 3051
                          userId: 41
                          businessId: 101
                          action: CORRECTED
                          oldClockIn: "2026-10-30T08:18:00Z"
                          newClockIn: "2026-10-30T08:18:00Z"
                          oldClockOut: "2026-10-30T16:00:00Z"
                          newClockOut: "2026-10-30T15:30:00Z"
                          breakChange: null
                          authorId: 12
                          reason: "The register was closed at 16:30."
                          occurredAt: "2026-10-30T18:02:11Z"
                          confirmation:
                            status: PENDING
                            comment: null
                            respondedBy: null
                            respondedAt: null
                            version: 0
                        anchor:
                          date: "2026-10-30"
                          scheduledShiftId: 900
                          attendanceMatchId: 700
                          worklogId: 3051
                        laterChangeExists: true
                    hasNext: false
                    nextCursor: null
                notApplicable:
                  summary: A correction of a worklog on a day without a published planning
                  value:
                    content:
                      - change:
                          id: 1230
                          worklogId: 3104
                          userId: 41
                          businessId: 101
                          action: CORRECTED
                          oldClockIn: "2026-11-02T09:02:00Z"
                          newClockIn: "2026-11-02T09:02:00Z"
                          oldClockOut: "2026-11-02T13:30:00Z"
                          newClockOut: "2026-11-02T13:00:00Z"
                          breakChange: null
                          authorId: 12
                          reason: "Closed at 14:00."
                          occurredAt: "2026-11-02T17:10:00Z"
                          confirmation:
                            status: PENDING
                            comment: null
                            respondedBy: null
                            respondedAt: null
                            version: 0
                        anchor:
                          date: "2026-11-02"
                          scheduledShiftId: null
                          attendanceMatchId: 731
                          worklogId: 3104
                        laterChangeExists: false
                    hasNext: false
                    nextCursor: null
                empty:
                  summary: Nothing to confirm
                  value:
                    content: []
                    hasNext: false
                    nextCursor: null
        '400':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/InboxListBadRequest'
        '401':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/Unauthorized'
        '403':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/NotMember'
        '404':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/BusinessNotFound'
      x-functional-errors: [1006, 1015, 1142]

  confirmation-response:
    put:
      tags: [Worklogs]
      operationId: respondToWorklogChangeConfirmation
      summary: Answer the confirmation of one worklog change
      description: >
        The worker answers the PENDING confirmation of one management change of their worklog:
        ACKNOWLEDGED (seen and reviewed) or DISPUTED (records disagreement). It is not an
        approval, not a legal consent and not a legal claim. It does not revert or change the
        worklog, its `reviewStatus` or reports, and does not resolve any attendance incident;
        a comment is not a justification. Management is not asked to act by this route.


        Ownership is the immutable `userId` of the worklog change; the body never names a
        user. A change that does not exist, belongs to another worker (the OWNER who authored
        it included), or has no confirmation (`confirmation: null`: legacy, own, break or
        system changes) returns the same 404 1143.


        `version` is the `confirmation.version` the worker read. Rules: PENDING and the same
        version: the answer is stored, `respondedBy` and `respondedAt` are set and `version`
        increments. Already answered with the same `status`, the same trimmed `comment` and the
        `version` it was answered from: idempotent retry, 200 with the stored change and no
        write. Any other answer to an answered confirmation, or a stale version: 409 1049.
        Of two concurrent answers one wins; the other gets 409 1049 unless it is the same
        answer, which a retry then sees as idempotent. A later management change of the same
        worklog is a different change with its own PENDING confirmation.


        `comment` is optional with both answers, trimmed, non-empty after trimming when
        supplied and at most 500 characters. A body that does not validate is a plain 400
        without a functional code.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/WorklogChangeId'
      requestBody:
        required: true
        description: The worker's answer, optional comment and the confirmation version read.
        content:
          application/json:
            schema:
              $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogChangeConfirmationRequestDTO'
            examples:
              acknowledged:
                summary: Seen and reviewed, no comment
                value: {status: ACKNOWLEDGED, version: 0}
              disputed:
                summary: Disagreement with a comment
                value: {status: DISPUTED, comment: "I left at 17:00, not at 16:30.", version: 0}
      responses:
        '200':
          description: >
            The change with its answered confirmation (also returned unchanged on an
            idempotent retry).
          content:
            application/json:
              schema:
                $ref: '../../components/worklogs/components.yml#/components/schemas/WorklogChangeDTO'
              example:
                id: 1201
                worklogId: 3051
                userId: 41
                businessId: 101
                action: CORRECTED
                oldClockIn: "2026-10-30T08:18:00Z"
                newClockIn: "2026-10-30T08:18:00Z"
                oldClockOut: "2026-10-30T16:00:00Z"
                newClockOut: "2026-10-30T15:30:00Z"
                breakChange: null
                authorId: 12
                reason: "The register was closed at 16:30."
                occurredAt: "2026-10-30T18:02:11Z"
                confirmation:
                  status: DISPUTED
                  comment: "I left at 17:00, not at 16:30."
                  respondedBy: 41
                  respondedAt: "2026-10-31T08:12:40Z"
                  version: 1
        '400':
          description: >
            The body does not validate: `status` not ACKNOWLEDGED or DISPUTED, `comment` blank
            after trimming or longer than 500 characters, `version` missing or negative. Plain
            400 without a functional code.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized.
        '404':
          description: >
            The change does not exist, is not the caller's, or has no confirmation (1143). The
            same body in every case.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: '1143 - worklog change confirmation not found'}
        '409':
          description: >
            Stale `version`, or a different answer to a confirmation that was already
            answered (1049). Refetch and show the stored answer.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              example: {status: 409, detail: '1049 - resource was modified concurrently'}
      x-functional-errors: [1049, 1143]
  groups:
    get:
      tags: [Attendance]
      operationId: getCurrentUserAttendanceIncidentGroups
      summary: List my open attendance incident groups
      description: |
        Returns only the authenticated user's incidents in an active membership of this
        business, for any membership role (OWNER, MANAGER or EMPLOYEE); role does not widen
        the data scope. Historical RESOLVED incidents are excluded and cannot be changed by
        these routes.

        A SHIFT group has id `S-{scheduledShiftId}` and contains every OPEN SHIFT-scoped
        incident for that shift plus OPEN MATCH-scoped incidents whose current match is
        MATCHED to that shift and belongs to the caller. An UNMATCHED group has id
        `M-{attendanceMatchId}` and contains the caller's OPEN MATCH incidents for a match
        whose current kind is not MATCHED, including NOT_APPLICABLE. `MATCH` is not a group
        kind. If reconciliation assigns a match, GET canonicalizes its `M-` identity to the
        corresponding `S-` group. A reassignment changes group membership while preserving
        incident evidence and increments the group revision.

        Optional `date` selects the business-local start date of the scheduled shift for
        SHIFT groups, or the business-local clock-in date for UNMATCHED groups. It uses the
        business ZoneId and the half-open interval [startOfDay, startOfNextDay), including
        DST days of 23 or 25 hours and overnight shifts. `justification` defaults to ALL;
        JUSTIFIED and UNJUSTIFIED filter by current justification presence. Filtering and
        caller scoping occur before keyset pagination. `limit` defaults to 20, range 1..50.

        `totalGroupsMatchingFilters` is the exact number of complete OPEN groups matching
        caller scope plus date and justification filters, counted before cursor and limit;
        it is not the page length and is not accumulated across pages. `summary` reuses the
        `AttendanceInboxSummaryDTO` semantics: `incidentCount` counts the caller's
        individual OPEN incidents without justification (not groups), while
        `confirmationCount` counts the caller's pending worklog-change confirmations. It is
        global to this business and caller and ignores date, justification, cursor and limit.
        The initial page includes both counts, so clients need no separate count request.

        The list, filtered total, global summary and complete members are read under one
        REPEATABLE READ READ ONLY transaction per response. Count queries are aggregated by
        business and caller, not run per item. If any count cannot be computed, this request
        fails with an HTTP error; it never returns null, unknown or a fabricated zero. An
        empty `content` has total 0 only when no groups match, and its global summary may
        still be nonzero. `asOf` is informational. Each page request is a new live snapshot;
        writes between pages may change totals and counters, so clients show the latest
        coherent response and refresh rather than summing or merging page counters. Clients
        treat an HTTP error or a missing/null count as an error, never as zero.

        Groups are ordered by `anchorAt` descending, `kindRank` ascending (SHIFT=0,
        UNMATCHED=1), then `anchorId` descending. The opaque cursor is bound to business,
        caller, date, justification filter and business zone; changed scope/filter is 400
        `1145`. This is a live keyset, not a global snapshot: anchor changes, membership
        changes, canonicalization and eligibility changes may require refreshing from page
        one and are not guaranteed free of gaps or duplicates across requests. Group plus
        all its open members is read repeatably within one response; `asOf` is informational.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/GroupDate'
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/JustificationFilter'
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/GroupCursor'
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/GroupLimit'
      responses:
        '200':
          description: Cursor page of complete groups with exact filtered total and global caller-scoped summary from one response snapshot.
          content:
            application/json:
              schema:
                $ref: '../../components/attendanceInbox/components.yml#/components/schemas/AttendanceIncidentGroupPageDTO'
              examples:
                empty:
                  value:
                    content: []
                    totalGroupsMatchingFilters: 0
                    summary: {incidentCount: 2, confirmationCount: 1}
                    hasNext: false
                    nextCursor: null
                    asOf: '2026-11-07T10:00:00Z'
                filteredNoResults:
                  summary: No groups match the filters; global summary counts remain nonzero.
                  value:
                    content: []
                    totalGroupsMatchingFilters: 0
                    summary: {incidentCount: 2, confirmationCount: 1}
                    hasNext: false
                    nextCursor: null
                    asOf: '2026-11-07T10:00:00Z'
        '400':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/GroupListBadRequest'
        '401':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/Unauthorized'
        '403':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/NotMember'
        '404':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/BusinessNotFound'
      x-functional-errors: [1006, 1015, 1144, 1145]

  group:
    get:
      tags: [Attendance]
      operationId: getCurrentUserAttendanceIncidentGroup
      summary: Get one current attendance incident group
      description: >-
        Returns the complete current group and all its OPEN members for the authenticated
        user. Membership and privacy rules are identical to the group list. If the requested
        M- id has become MATCHED, GET canonicalizes it and returns the S- group. POST using
        the stale M- id returns 409 and its current S- id. RESOLVED incidents are never
        returned.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/GroupId'
      responses:
        '200':
          description: The complete current group.
          content:
            application/json:
              schema:
                $ref: '../../components/attendanceInbox/components.yml#/components/schemas/AttendanceIncidentGroupDTO'
        '401':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/Unauthorized'
        '403':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/NotMember'
        '404':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/GroupNotFound'
      x-functional-errors: [1006, 1015, 1146]

  group-justification:
    post:
      tags: [Attendance]
      operationId: justifyCurrentUserAttendanceIncidentGroup
      summary: Apply one common justification to every open group member
      description: |
        Atomically writes one exact, common text to the full current group. The command
        never accepts arbitrary incident ids. `expectedRevision` is the snapshot read from
        the group; stale membership, incident state, anchor, assignment or revision yields
        409 `1147`. The text is 1..500 characters and must not be blank, but is stored
        exactly as sent without trimming. Resolved incidents cannot be justified and remain
        historical; a closed group command does not resolve any incident.

        `M-` is immutable only while its match is not MATCHED. If it has become MATCHED,
        POST returns 409 `1147` with `currentGroupId` set to the canonical `S-` group; the
        client refetches before retrying. Non-open groups return 409 `1148`. Lock acquisition
        timeout returns 503 `1149` and `Retry-After: 1`.

        Proposed persistence contract (not implemented): group-level common justification,
        append-only baseline evidence for pre-existing individual justifications, append-only
        justification records and incident markers; preserve original values as auditable
        evidence. Replay is allowed only for the same baseline, exact text, caller and exact
        current post-revision. Resolving a subset retains the common group text but invalidates
        replay; a newly eligible incident changes revision and receives no implied consent.
        Retention is undecided and is a gate before persistence activation. See
        `docs/attendance-incident-groups.md` for locking, writer-adoption, history protection
        and runtime gates. This is a new API design, not an assertion of existing backend
        capability.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendanceInbox/components.yml#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/attendanceInbox/components.yml#/components/schemas/AttendanceIncidentGroupJustificationRequestDTO'
            example:
              text: The bus was delayed; I arrived as soon as possible.
              expectedRevision: rv1-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        '400':
          $ref: '../../components/attendanceInbox/components.yml#/components/responses/GroupRequestBadRequest'
        '200':
          description: Atomic result; APPLIED or exact idempotent REPLAYED.
          content:
            application/json:
              schema:
                $ref: '../../components/attendanceInbox/components.yml#/components/schemas/AttendanceIncidentGroupJustificationResponseDTO'
              examples:
                applied:
                  value:
                    outcome: APPLIED
                    group:
                      groupId: S-900
                      kind: SHIFT
                      scheduledShiftId: 900
                      attendanceMatchIds: [700]
                      businessDate: '2026-10-30'
                      anchorAt: '2026-10-30T09:00:00Z'
                      revision: rv1-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                      justification:
                        state: COMMON
