                  contract: null
                  status: "PENDING"
                  createdAt: "2023-06-15T14:30:00+00:00"
                  expiresAt: "2023-06-22T14:30:00+00:00"
                - id: 124
                  businessId: 202
                  businessName: "Bistro Central"
                  email: "another@example.com"
                  role: "EMPLOYEE"
                  contract: null
                  status: "PENDING"
