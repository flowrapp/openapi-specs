  resend-business-invitation:
    post:
      summary: Resend a business invitation
      description: >
        Resends an existing invitation of the business and reactivates it. Only the business
        OWNER may resend it; a MANAGER or EMPLOYEE receives 403 (1020). A business that does
        not exist returns 404 (1006); an invitation that does not exist or belongs to another
        business returns 404 (1005).
        An invitation can be resent when its stored status is PENDING (whether or not its
        expiresAt has already passed) or EXPIRED. The resend reactivates the same invitation:
        status becomes PENDING again and expiresAt becomes the moment of the resend plus seven
        days. No new invitation is created; id, token, invitee email, role, contract,
        createdAt and every other field are preserved, so the invitation token is the same
        one sent originally.
        The invitation email is sent asynchronously: the event that createBusinessInvitation
        publishes is published again through the outbox, so the invitee receives the
        invitation email again after the response is returned.
        An invitation in a terminal status (ACCEPTED or DECLINED) cannot be resent and returns
        403 (1013). The response is the reactivated invitation, with status PENDING and the
        same mapping as createBusinessInvitation. There is no request body.
        Each invitation can be resent at most once every 10 minutes. The checks run in this
        order: owner and business (1020, 1006), invitation of the business (1005), status
        (1013), and then the resend cooldown. If the same invitation was resent less than 10
        minutes ago, the response is 429 (1141) with a `Retry-After` header: the whole seconds
        until the next resend is allowed, rounded up and at least 1. The cooldown is per
        invitation, not per user, business or caller, and the server records when each resend
        happens. The email sent when the invitation is created does not count, so the first
        resend of an invitation is always accepted. Exactly 10 minutes after the previous
        resend, a new resend is accepted. If several resends of the same invitation arrive at
        the same time, only one is accepted and the others receive 429 (1141). A 429 does not
        change the invitation and does not publish the email. The response does not expose
        when the invitation was last resent.
      tags:
        - Invitations
      operationId: resendBusinessInvitation
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: Unique identifier of the business
          schema:
            type: integer
        - name: invitationId
          in: path
          required: true
          description: Unique identifier of the invitation to resend
          schema:
            type: integer
      responses:
        '200':
          description: >
            Invitation reactivated and resent; status is PENDING and expiresAt is seven days
            from the resend. The email is sent asynchronously.
          content:
            application/json:
              schema:
                $ref: '../../components/invitations/components.yml#/components/schemas/InvitationResponseDTO'
              example:
                id: 123
                businessId: 101
                businessName: "Coffee Time"
                email: "invitee@example.com"
                role: "MANAGER"
                contract: null
                status: "PENDING"
                createdAt: "2023-06-15T14:30:00+00:00"
                expiresAt: "2023-07-04T09:00:00+00:00"
        '401':
          description: Unauthorized
        '403':
          description: >
            Current user is not the owner of the business (1020), or the invitation is in a
            terminal status, ACCEPTED or DECLINED, and cannot be resent (1013)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                USER_NOT_OWNER_OF_BUSINESS:
                  summary: "1020 - user is not the owner of business"
                  value:
                    status: 403
                    detail: "1020 - user is not the owner of business"
                INVITATION_NOT_PENDING:
                  summary: "1013 - invitation not pending"
                  value:
                    status: 403
                    detail: "1013 - invitation not pending"
        '404':
          description: Business or invitation not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
                INVITATION_NOT_FOUND:
                  summary: "1005 - invitation not found"
                  value:
                    status: 404
                    detail: "1005 - invitation not found"
        '429':
          description: >
            The same invitation was resent less than 10 minutes ago (1141). The invitation is not
            changed and no email is published.
          headers:
            Retry-After:
              description: >
                Whole seconds until the next resend of this invitation is allowed, rounded up.
              schema: {type: integer, minimum: 1, example: 420}
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/error-components.yml#/components/schemas/ProblemDetail'
              examples:
                INVITATION_RESENT_TOO_RECENTLY:
                  summary: "1141 - invitation was resent too recently"
                  value:
                    status: 429
                    detail: "1141 - invitation was resent too recently"
      x-functional-errors:
        - 1005
        - 1006
        - 1013
        - 1020
        - 1141

