---
openapi: 3.1.0
info:
  title: Flowrapp BFF API
  description: >
    Backend for Frontend API for the Flowrapp mobile application.
    This BFF aggregates and shapes data from the Flowrapp main API to serve
    the specific needs of the mobile frontend, providing role-based endpoints
    for workers and managers.
  version: 0.0.92
  contact:
    name: Flowrapp Team
    url: https://flowrapp.github.io
    email: flowraapp@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8081/flowrapp-bff
    description: Local BFF server

tags:
  - name: System
    description: System utility endpoints for health checks.
  - name: Authentication
    description: >
      User authentication and token management endpoints.
      These are pass-through proxies to the main API.
  - name: User
    description: Current user profile and account management.
  - name: Push Tokens
    description: >-
      Push notification token management. Pass-through to the main API.
  - name: Worker
    description: >
      Worker-facing endpoints for clock-in/out, work history and grouped incident inbox.
      These endpoints are scoped to the authenticated worker's own data.
  - name: Manager
    description: >
      Manager-facing endpoints for business oversight, worker management,
      work history reporting, owner-only invitation management, timesheet export,
      Shift, recurring-schedule, exception, job-role, and planning management.
  - name: Reports
    description: Owner-only business report generation requests.
  - name: Contracts
    description: Owner-only contract management operations.
  - name: Members
    description: >
      Business membership operations. Removal and the member profile («ficha de
      persona») are owner-only. Name search is limited to an OWNER or MANAGER of
      the business.
  - name: Attendance
    description: >
      Owner-only «Asistencia» tab: one endpoint per screen (Hours, Today, Week,
      detail sheet, tab badge) and the review actions, under
      /api/v1/businesses/{businessId}/attendance. Each endpoint aggregates Main API
      calls with parZip (at most 8 in flight) and never filters in memory; the
      app does not call the Main API directly.
  - name: Planning
    description: >
      Owner-only automatic generation of draft plans for an explicit period, under
      /api/v1/businesses/{businessId}/planning-generations. Pass-through to the Main API.
  - name: Shift Exchanges
    description: >
      Reciprocal swap of two concrete published assignments, under
      /api/v1/businesses/{businessId}/shift-exchange-requests. Pass-through to
      the Main API. Solicitudes calls this list with direction or lifecycle.
      Not a dashboard.
  - name: Schedule Changes
    description: >
      OWNER correction of one concrete published assignment, under
      /api/v1/businesses/{businessId}/schedule-change-requests. Pass-through to
      the Main API. Solicitudes calls this list separately. Not a dashboard.
  - name: Realtime
    description: >-
      Business-scoped server-sent events that tell the app which REST data to
      refresh. Signals never contain business data.

