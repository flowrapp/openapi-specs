components:
  schemas:
    SyncReadyEvent:
      $ref: "v1/components/realtime/components.yml#/components/schemas/SyncReadyEvent"
    SyncEvent:
      $ref: "v1/components/realtime/components.yml#/components/schemas/SyncEvent"
    SyncTopic:
      $ref: "v1/components/realtime/components.yml#/components/schemas/SyncTopic"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Clerk session JWT issued by the configured Clerk instance. Tokens carry
        the mail, name and roles claims; when roles is absent, the default role
        is USER. During the migration, legacy Flowrapp-issued tokens are still
        accepted under their existing rules: tokens issued with deviceId must
        match an active server-side user/device session and are rejected
        immediately when that session is missing or revoked.
    geofenceDeviceCredential:
      type: apiKey
      in: header
      name: X-Geofence-Credential
      description: >-
        Device-scoped credential for the geofence event endpoint only. Never log
        this header or its value.
