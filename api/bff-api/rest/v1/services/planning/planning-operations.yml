planning:
  generations:
    post:
      summary: Request automatic generation of draft plans for a period
      description: |
        «Generar horario automáticamente». OWNER only: the BFF checks the role with
        `getUserBusinesses` first; the Main API enforces it again. Every rule lives in the Main API
        (explicit period of whole weeks, at most 4, starting at the current week or later; no plan in the period; no
        generation in progress, double click included; members with a contract and staffing
        demand) and its functional errors are propagated unchanged. `replaceDrafts: true` is
        forwarded: a DRAFT week is then generated again instead of returning 409 1121 (ask the
        OWNER first; `getWeekCoverage.planning` tells whether the week has a DRAFT). The result
        is one DRAFT plan per week, never published automatically. Poll `getPlanGeneration` until COMPLETED or
        FAILED.

        Main API calls, in sequence:
        1. `getUserBusinesses` (role).
        2. `requestPlanningGeneration` (`POST /api/v1/businesses/{businessId}/planning-generations`).
      tags:
        - Planning
      operationId: requestPlanGeneration
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/planning/components.yml#/components/parameters/BusinessId'
      requestBody:
        required: true
        description: Period to generate, whole weeks
        content:
          application/json:
            schema:
              $ref: '../../components/planning/components.yml#/components/schemas/PlanningGenerationRequestDTO'
            examples:
              nextTwoWeeks:
                summary: The next two weeks
                value: {from: "2026-11-09", to: "2026-11-22"}
              currentWeek:
                summary: The current week, requested on Wednesday 2026-11-04 (allowed)
                value: {from: "2026-11-02", to: "2026-11-08"}
              replaceDraft:
                summary: The week of 16 Nov, replacing its DRAFT after the OWNER confirmed
                value: {from: "2026-11-16", to: "2026-11-22", replaceDrafts: true}
      responses:
        '202':
          description: Generation accepted
          headers:
            Location:
              description: BFF generation job resource
              schema:
                type: string
                format: uri-reference
                example: "/api/v1/businesses/101/planning-generations/42"
          content:
            application/json:
              schema:
                $ref: '../../components/planning/components.yml#/components/schemas/PlanningGenerationDTO'
              example:
                id: 42
                businessId: 101
                from: "2026-11-09"
                to: "2026-11-22"
                status: PENDING
                requestedBy: 1
                requestedAt: "2026-11-02T18:45:00+01:00"
                finishedAt: null
                failureReason: null
                weeks:
                  - {weekStart: "2026-11-09", weekEnd: "2026-11-15", planningId: 501, planningStatus: CREATED, failureReason: null}
                  - {weekStart: "2026-11-16", weekEnd: "2026-11-22", planningId: 502, planningStatus: CREATED, failureReason: null}
        '400':
          description: Invalid period (1120) or a period starting before the current week (1098)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                invalidPeriod:
                  summary: "1120 - planning generation period is invalid"
                  value: {status: 400, detail: "1120 - planning generation period is invalid"}
                past:
                  summary: "1098 - Planning week creation cannot be in the past"
                  value: {status: 400, detail: "1098 - Planning week creation cannot be in the past"}
        '401':
          description: No authenticated session
        '403':
          description: The caller is not the OWNER of the business (1020), or not a member of it (1015)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  summary: "1020 - user is not the owner of business"
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                notMember:
                  summary: "1015 - user is not member of business"
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: Business not found (1006)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  summary: "1006 - business does not exist"
                  value: {status: 404, detail: "1006 - business does not exist"}
        '409':
          description: >
            A plan already exists in the period (1121), a generation is in progress (1122), or a
            week planning was changed while it was being saved, for example an edit of a draft that
            `replaceDrafts` regenerates (1049, read it again and retry). Main API errors are passed
            through unchanged.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                planExists:
                  summary: "1121 - a planning already exists in the generation period"
                  value: {status: 409, detail: "1121 - a planning already exists in the generation period"}
                inProgress:
                  summary: "1122 - a planning generation is already in progress for the period"
                  value: {status: 409, detail: "1122 - a planning generation is already in progress for the period"}
                concurrentModification:
                  summary: "1049 - resource was modified concurrently"
                  value: {status: 409, detail: "1049 - resource was modified concurrently"}
        '422':
          description: No active member with a contract in the period (1123), or a week without staffing demand (1124)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                noMembers:
                  summary: "1123 - no active member has a contract in the generation period"
                  value: {status: 422, detail: "1123 - no active member has a contract in the generation period"}
                noDemand:
                  summary: "1124 - a week of the generation period has no shift with staffing demand"
                  value: {status: 422, detail: "1124 - a week of the generation period has no shift with staffing demand"}
      x-functional-errors: [1006, 1015, 1020, 1049, 1098, 1120, 1121, 1122, 1123, 1124]
  generation:
    get:
      summary: Get the status of a planning generation
      description: |
        OWNER only (`getUserBusinesses` first). Forwards the Main API job unchanged.

        Main API calls, in sequence:
        1. `getUserBusinesses` (role).
        2. `getPlanningGeneration` (`GET /api/v1/businesses/{businessId}/planning-generations/{generationId}`).
      tags:
        - Planning
      operationId: getPlanGeneration
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/planning/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/planning/components.yml#/components/parameters/GenerationId'
      responses:
        '200':
          description: Generation job
          content:
            application/json:
              schema:
                $ref: '../../components/planning/components.yml#/components/schemas/PlanningGenerationDTO'
              examples:
                running:
                  summary: Generation still running
                  value:
                    id: 42
                    businessId: 101
                    from: "2026-11-09"
                    to: "2026-11-22"
                    status: RUNNING
                    requestedBy: 1
                    requestedAt: "2026-11-02T18:45:00+01:00"
                    finishedAt: null
                    failureReason: null
                    failureCode: null
                    failedAt: null
                    weeks:
                      - {weekStart: "2026-11-09", weekEnd: "2026-11-15", planningId: 501, planningStatus: DRAFT, failureReason: null, failureCode: null, failedAt: null}
                      - {weekStart: "2026-11-16", weekEnd: "2026-11-22", planningId: 502, planningStatus: SOLVING, failureReason: null, failureCode: null, failedAt: null}
                failed:
                  summary: Generation failed
                  value:
                    id: 42
                    businessId: 101
                    from: "2026-11-09"
                    to: "2026-11-22"
                    status: FAILED
                    requestedBy: 1
                    requestedAt: "2026-11-02T18:45:00+01:00"
                    finishedAt: "2026-11-02T18:47:10+01:00"
                    failureReason: One or more weeks could not be generated.
                    failureCode: SOLVER_FAILED
                    failedAt: "2026-11-02T18:47:10+01:00"
                    weeks:
                      - {weekStart: "2026-11-09", weekEnd: "2026-11-15", planningId: 501, planningStatus: DRAFT, failureReason: null, failureCode: null, failedAt: null}
                      - {weekStart: "2026-11-16", weekEnd: "2026-11-22", planningId: 502, planningStatus: FAILED, failureReason: "The solver could not find a valid schedule.", failureCode: SOLVER_FAILED, failedAt: "2026-11-02T18:47:10+01:00"}
        '401':
          description: No authenticated session
        '403':
          description: The caller is not the OWNER of the business (1020), or not a member of it (1015)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  summary: "1020 - user is not the owner of business"
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business (1006) or generation job (1125) not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  summary: "1006 - business does not exist"
                  value: {status: 404, detail: "1006 - business does not exist"}
                generationNotFound:
                  summary: "1125 - planning generation not found"
                  value: {status: 404, detail: "1125 - planning generation not found"}
      x-functional-errors: [1006, 1015, 1020, 1125]
  week-coverage:
    get:
      summary: Weekly staffing coverage («¿Llegas?») before generating
      description: |
        «¿Llegas con tu equipo?» for one ISO week, OWNER only. It compares the staffing demand of
        the week with the contracted hours, per job role, and the people needed at once with the
        people of each role, per date and shift. It uses the solver input of the week
        (`getPlanningGenerationInput`: the same effective days, special days included, and the
        same contract set as a generation), so the numbers match what the solver receives. It is
        a necessary condition, not a promise: the solver can still leave a gap because of rest
        rules or overlaps.

        Week, per job role `r` (seconds):
        - `requiredSeconds` N(r): for every shift of every date of the week, the net shift
          duration (`endTime - startTime`, rolling into the next day when `endTime` is not later
          than `startTime`, minus `breakMinutes`) times `targetEmployees` of `r`. A date without
          shifts adds nothing, so closing a day lowers N.
        - `minimumSeconds`: the same with `minimumEmployees`.
        - `contractedSeconds` E(r): for every contract of `r` in the solver contract set,
          `floor(totalWeekHours * 3600 * coveredDays / 7)`, where `coveredDays` is the number of
          days of the week inside the contract. This is the solver capacity
          (`ContractPeriod.capacitySeconds`). Closing a day does not change E. Pending invitations
          are not contracts and do not count.
        - `status`: SHORT when E < N; TIGHT when N <= E < 1.10 * N (computed in integers:
          `10 * E < 11 * N`); COVERED when E >= 1.10 * N. A role without demand (N = 0) is COVERED.
        - `belowMinimum`: E < `minimumSeconds`. A warning only («ni al mínimo»): it never
          changes `status`. The Main API keeps minimumEmployees <= targetEmployees, so it can only
          be true for a role that is already SHORT.
        - `shortfallSeconds` = max(0, N - E) («te faltan 8 h») and `surplusSeconds` =
          max(0, E - N) («sobran 16 h»). Hours are not converted into shifts.
        - `memberCount` and `members` (name and prorated seconds): the distinct people with a
          contract of `r` in the week.
        - `roles` lists every job role with N > 0 or E > 0 this week, ordered by job-role name
          and id.
        Week `status` is the worst role status (null without roles); `openDays`,
        `shiftOccurrences` and `memberCount` count dates with at least one opening interval (open
        dates, with or without shifts), shifts and distinct people with a contract in the week.

        Totals: `requiredSeconds` = ΣN, `contractedSeconds` = ΣE, `coveredSeconds` = Σ min(N, E)
        over `roles`, and `coveragePercent` = round half up of 100 * coveredSeconds /
        requiredSeconds, or null when requiredSeconds is 0.

        Per date and shift, per job role of the shift demand:
        - `people`: distinct users whose contract effective on that date has that job role.
        - `targetAtOnce` and `minimumAtOnce`: the largest sum of `targetEmployees` (or
          `minimumEmployees`) of that role over the shifts of the same date that are running at
          the same instant, at any instant of this shift (this shift included). A worker cannot
          be in two overlapping shifts.
        - `status`: SHORT when targetAtOnce > people; TIGHT when equal; COVERED when lower, or
          when targetAtOnce is 0. `belowMinimum`: minimumAtOnce > people, a warning only that
          never changes `status` (it can only be true when the status is already SHORT).
        - Day `status` is the worst shift-role status of the date, and `reason` says why:
          `CLOSED` (no opening interval, `open: false`, status null), `NO_DEMAND` (open, but
          no target above 0: no shifts, or shifts without any target; status null),
          `BELOW_MINIMUM_AT_ONCE` (SHORT and a shift-role of the date is `belowMinimum`),
          `SHORT_AT_ONCE`, `TIGHT_AT_ONCE`, or null when COVERED.
          `reasonJobRoleId` is the job role that sets it (worst first, then job-role name and id).

        A week without any recurring schedule in force is not an error: it returns 200 with its
        dates `source: NONE` and closed (special days still count), so with no demand
        `coveragePercent` is null and `generation.blocker` is NO_DEMAND.

        Each date has `open`: true when its effective day has at least one opening interval
        (`openingIntervals` of `getPlanningGenerationInput`), even without shifts; false means
        closed («Cerrado»). Shifts do not decide whether a date is open. Each date also has
        `source` (RECURRING_SCHEDULE, EXCEPTION or NONE), `scheduleExceptionId` and `roles` (Σ
        targetEmployees of each role over its shifts, with the worst status). Each
        shift has `targetEmployees` (Σ of its roles) and its worst `status`.

        `planning` is the existing planning of the week (`id`, `status`, and optional `failureCode` when status is FAILED) or null. `generation`
        is a hint for «Generar», with the Main API checks of `requestPlanningGeneration` in its
        order: PAST_WEEK (`weekStart` before the Monday of the business-local current week,
        1098), IN_PROGRESS (planning CREATED or SOLVING, 1122), PLANNING_EXISTS (PUBLISHED or
        ARCHIVED, 1121), NO_CONTRACTS (empty solver contract set, 1123), NO_DEMAND (no shift of
        the week with any demand, 1124). `replacesDraft` is true for a DRAFT week: ask the OWNER,
        then call `requestPlanGeneration` with `replaceDrafts: true`. The Main API still decides.

        Not in this version: hypothetical days without saving (preview) and the assigned
        employees of an existing planning per shift; both can be added later without breaking
        this response.

        Main API calls, in parallel (Arrow `parZip`, at most 5 in flight), never one per user or
        per day:
        1. `getPlanningGenerationInput` (`GET /api/v1/businesses/{businessId}/planning-generations/input?weekStart=`).
        2. `getBusinessJobRoles`, every page of 100, inactive roles included (names and colors).
        3. `getPlanning` (`GET /api/v1/businesses/{businessId}/plannings/{weekStart}`); its
           404 1046 becomes `planning: null`.
        4. `getBusinessUsers` (active members), only for the names of `members`.
        5. `getUserBusinesses`, only for the business `zone` of PAST_WEEK.
        The Main API enforces the OWNER role on calls 1 to 4; any other error is propagated.
      tags:
        - Planning
      operationId: getWeekCoverage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/planning/components.yml#/components/parameters/BusinessId'
        - name: week
          in: query
          required: true
          description: ISO week `YYYY-Www`, Monday to Sunday in the business calendar. Past, current and future weeks are accepted.
          schema:
            type: string
            pattern: '^\d{4}-W\d{2}$'
            example: "2026-W47"
      responses:
