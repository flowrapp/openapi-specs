                from: "2026-02-01"
                to: "2026-02-28"
                today: "2026-02-12"
                totals:
                  clockedSeconds: 43200
                  pendingReviewSeconds: 3600
                  plannedSeconds: 57600
                  unjustifiedIncidentCount: 1
                  unpublishedDayCount: 6
                days:
                  - {date: "2026-02-01", isToday: false, clockedSeconds: 0, pendingReviewSeconds: 0, plannedSeconds: 0, unjustifiedIncidentCount: 0}
                  - {date: "2026-02-02", isToday: false, clockedSeconds: 28800, pendingReviewSeconds: 0, plannedSeconds: 28800, unjustifiedIncidentCount: 0}
