  shift-clock-in-notices:
    post:
      summary: Notify the worker of a shift segment to clock in
      description: |
        «Avisar para fichar» on `…/attendance/shifts/{scheduledShiftId}/clock-in-notices`.

        OWNER only. The BFF checks the role with `getUserBusinesses` before anything else; the Main API
        enforces it again. Optional body `segmentIndex` (0-based, default 0) selects the planned
        segment and is forwarded as-is. The response echoes `segmentIndex` and `segmentStartAt`.
        All the rules live in the Main API and are per segment: published plan, notice window from
        15 minutes before that segment's start until that segment's end (the unpaid gap is outside
        the window), not already clocked for that segment (an earlier segment already closed does
        not block the later one; an open worklog still does), active member with a contract in
        force, one notice per shift and segment every 10 minutes. Functional errors are propagated
        unchanged, including `400` `1047` for an index past the shift's segments and the
        `Retry-After` header of the 429. The push is sent asynchronously, so the response is 202
        with the recorded notice and does not confirm delivery; the next read of Day or of the
        detail shows the notifiable segment in `clockInNotice` (one state per shift).

        Main API calls, in sequence:
        1. `getUserBusinesses` (role).
        2. `notifyShiftClockIn` (`POST /api/v1/businesses/{businessId}/scheduled-shifts/{scheduledShiftId}/clock-in-notices`), forwarding the optional body.
      tags:
        - Attendance
      operationId: notifyAttendanceShiftClockIn
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendance/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendance/components.yml#/components/parameters/ScheduledShiftId'
      requestBody:
        required: false
        description: Segment to remind. Omit the body to remind segment 0.
        content:
          application/json:
            schema:
              $ref: '../../components/attendance/components.yml#/components/schemas/AttendanceNotifyShiftClockInRequestDTO'
            example:
              segmentIndex: 1
      responses:
        '202':
          description: Notice recorded; the push is sent asynchronously
          content:
            application/json:
              schema:
                $ref: '../../components/attendance/components.yml#/components/schemas/AttendanceClockInNoticeDTO'
              examples:
                firstSegment:
                  summary: Reminder for the first segment
                  value:
                    id: 7001
                    scheduledShiftId: 900
                    segmentIndex: 0
                    segmentStartAt: "2026-11-02T09:00:00+01:00"
                    notifiedAt: "2026-11-02T09:07:00+01:00"
                    notifiedBy: 1
                    nextAllowedAt: "2026-11-02T09:17:00+01:00"
                secondSegment:
                  summary: Reminder for the return segment of a split shift
                  value:
                    id: 7002
                    scheduledShiftId: 900
                    segmentIndex: 1
                    segmentStartAt: "2026-11-02T18:00:00+01:00"
                    notifiedAt: "2026-11-02T17:50:00+01:00"
                    notifiedBy: 1
                    nextAllowedAt: "2026-11-02T18:00:00+01:00"
        '400':
          description: segmentIndex is outside the shift's planned segments (1047).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1047 - scheduled shift is invalid"}
        '401':
          description: No authenticated session
        '403':
          description: >
            The caller is not the OWNER of the business (1020), or not a member of it (1015).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  summary: "1020 - user is not the owner of business"
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                notMember:
                  summary: "1015 - user is not member of business"
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: Business not found, or shift not found in a published plan of the business.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  summary: "1006 - business does not exist"
                  value: {status: 404, detail: "1006 - business does not exist"}
                shiftNotFound:
                  summary: "1076 - scheduled shift not found"
                  value: {status: 404, detail: "1076 - scheduled shift not found"}
        '409':
          description: Outside the notice window (1116), already clocked in (1117) or worker not eligible (1118).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                outsideWindow:
                  summary: "1116 - shift is outside the clock-in notice window"
                  value: {status: 409, detail: "1116 - shift is outside the clock-in notice window"}
                alreadyClockedIn:
                  summary: "1117 - worker already clocked in for this shift"
                  value: {status: 409, detail: "1117 - worker already clocked in for this shift"}
                memberNotEligible:
                  summary: "1118 - worker is not an active member with a contract in force for this shift"
                  value: {status: 409, detail: "1118 - worker is not an active member with a contract in force for this shift"}
        '429':
          description: A notice was already sent for this shift and segment within the last 10 minutes (1119).
          headers:
            Retry-After:
              description: Seconds until the next notice is allowed, forwarded from the Main API
              schema: {type: integer, minimum: 1, example: 420}
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                tooSoon:
                  summary: "1119 - a clock-in notice was sent for this shift too recently"
                  value: {status: 429, detail: "1119 - a clock-in notice was sent for this shift too recently"}
      x-functional-errors: [1006, 1015, 1020, 1047, 1076, 1116, 1117, 1118, 1119]
