      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendance/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendance/components.yml#/components/parameters/AttendanceMatchId'
        - $ref: '../../components/attendance/components.yml#/components/parameters/MatchDate'
        - $ref: '../../components/attendance/components.yml#/components/parameters/MatchUserId'
        - $ref: '../../components/attendance/components.yml#/components/parameters/BreakId'
      requestBody:
        required: true
        description: New break interval and mandatory reason
        content:
          application/json:
            schema:
              $ref: '../../components/attendance/components.yml#/components/schemas/AttendanceBreakCorrectionRequestDTO'
            example:
              startedAt: "2026-10-30T11:00:00+01:00"
              endedAt: "2026-10-30T11:20:00+01:00"
              reason: The break ended earlier than recorded.
      responses:
        '200':
          description: Refreshed detail; `kind` may be SHIFT if the match is now assigned to a shift
          content:
            application/json:
              schema:
                $ref: '../../components/attendance/components.yml#/components/schemas/AttendanceDetailDTO'
              examples:
                attendanceMatchDetail:
                  $ref: '../../components/attendance/components.yml#/components/examples/AttendanceMatchDetail'
        '400':
          description: >
            The reason is blank (1068) or the interval is not valid (1073), which today includes overlapping another effective break (follow-up: the Main API needs its own overlap code).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                reasonRequired:
                  summary: "1068 - worklog correction requires a non-blank reason"
                  value: {status: 400, detail: "1068 - worklog correction requires a non-blank reason"}
                breakNotValid:
                  summary: "1073 - worklog break interval is not valid"
                  value: {status: 400, detail: "1073 - worklog break interval is not valid"}
        '401':
          description: No authenticated session
        '403':
          description: >
            The caller is not the OWNER of the business. The BFF checks the role first with `getUserBusinesses`; the Main API enforces the same rule (M7) and its 403 1020 is propagated unchanged. A non-member receives 1015.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  summary: "1020 - user is not the owner of business"
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                notMember:
                  summary: "1015 - user is not member of business"
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: >
            Business, match, worklog or break not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  summary: "1006 - business does not exist"
                  value: {status: 404, detail: "1006 - business does not exist"}
                worklogNotFound:
                  summary: "1017 - worklog not found"
                  value: {status: 404, detail: "1017 - worklog not found"}
                breakNotFound:
                  summary: "1069 - worklog break not found"
                  value: {status: 404, detail: "1069 - worklog break not found"}
                matchNotFound:
                  summary: "1074 - attendance match not found"
                  value: {status: 404, detail: "1074 - attendance match not found"}
        '409':
          description: >
            The break changed concurrently (1049). An overlap that the Main API only detects when saving (a concurrent change) also surfaces as 1049, so 1049 does not tell overlap from concurrency; follow-up for a Main API overlap code.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                concurrentModification:
                  summary: "1049 - resource was modified concurrently"
                  value: {status: 409, detail: "1049 - resource was modified concurrently"}
      x-functional-errors: [1006, 1015, 1017, 1020, 1049, 1068, 1069, 1073, 1074]

