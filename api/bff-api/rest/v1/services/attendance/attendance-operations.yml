attendance:
  hours:
    get:
      summary: Get the Hours screen
      description: |
        «Horas» for one ISO week, OWNER only, ready to paint: totals, 7 days, legend, the selected day's
        rows and the filter options. All seconds are net of effective breaks and attributed to the
        business-local day of the clock-in. Open worklogs count in no figure (D3 default).

        Main API calls:
        1. Stage 0: `getUserBusinesses` (`GET /api/v1/businesses`), for the caller's role (OWNER required, otherwise 403 1020; not a member: 403 1015) and the business time zone.
        2. Stage 1, one `parZip` (13 calls, at most 8 in flight):
           - `getBusinessReports` (`GET /api/v1/businesses/{businessId}/reports?from&to&userIds`), the
             reportable seconds (CONFIRMED + APPROVED) per person and day;
           - `getBusinessReports` with `reviewStatus=PENDING_RECONCILIATION&reviewStatus=PENDING_REVIEW`, the
             pending seconds per person and day;
           - 7 × `getDailyAttendance` (`GET /api/v1/businesses/{businessId}/attendance?date&userIds`), one per
             day, for the planned seconds (`metrics.plannedSeconds`), the clock-in and clock-out of the
             selected day's rows, their warnings and their `detailRef`;
           - `getPlannings` (`GET /api/v1/businesses/{businessId}/plannings?from&to`, the week), to tell
             «no published plan» (`plannedSeconds: null`) from «a plan with 0 h» (`0`): only a planning in
             PUBLISHED or ARCHIVED counts as published;
           - `getBusinessUsers` (`includeRemoved=true`), for names, current job roles and `filterOptions.people`;
           - `getBusinessJobRoles` without `active` (all roles, inactive included), for the job-role name of
             each row: a current contract may point to a role that is no longer active;
           - `getBusinessJobRoles` (`active=true`), for `filterOptions.jobRoles` (the Main API filters it).

        `jobRoleId` is forwarded to `getBusinessReports` and `getDailyAttendance` (Main API 0.0.87), which
        filter it server-side together with `userIds` (AND), so all thirteen calls run in the one `parZip`.
        When no member matches, the response has zeros (or null planned seconds without a plan) and no rows. clocked = reportable + pending, per person, day and week.

        Validation before any Main API call: an invalid `week` or `date`, or a `date` outside `week`, returns
        400 1115. The BFF never moves `date` into the week: the front sends a `date` of the week it shows.

        Concurrency: independent Main API calls of one stage run with Arrow `parZip`; fan-outs are bounded by `Semaphore(8)`, so at most 8 Main API calls are in flight per request. The BFF never filters rows in memory: every filter (date, week, users) is a Main API parameter.
      tags:
        - Attendance
      operationId: getAttendanceHours
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendance/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendance/components.yml#/components/parameters/Week'
        - $ref: '../../components/attendance/components.yml#/components/parameters/Date'
        - $ref: '../../components/attendance/components.yml#/components/parameters/UserIds'
        - $ref: '../../components/attendance/components.yml#/components/parameters/JobRoleId'
      responses:
        '200':
          description: Hours of the week, already filtered
          content:
            application/json:
              schema:
                $ref: '../../components/attendance/components.yml#/components/schemas/AttendanceHoursDTO'
              example:
                week: {week: "2026-W44", from: "2026-10-26", to: "2026-11-01"}
                totals: {clockedSeconds: 50400, pendingReviewSeconds: 13440, reportableSeconds: 36960, plannedSeconds: 57600}
                days:
                  - {date: "2026-10-26", closed: false, isToday: false, clockedSeconds: 0, pendingReviewSeconds: 0, plannedSeconds: 0, people: []}
                  - {date: "2026-10-27", closed: false, isToday: false, clockedSeconds: 0, pendingReviewSeconds: 0, plannedSeconds: 0, people: []}
                  - {date: "2026-10-28", closed: false, isToday: false, clockedSeconds: 0, pendingReviewSeconds: 0, plannedSeconds: 0, people: []}
                  - {date: "2026-10-29", closed: false, isToday: false, clockedSeconds: 0, pendingReviewSeconds: 0, plannedSeconds: 0, people: []}
                  - date: "2026-10-30"
                    closed: false
                    isToday: true
                    clockedSeconds: 50400
                    pendingReviewSeconds: 13440
                    plannedSeconds: 57600
                    people:
                      - {userId: 102, name: Lucía Martín, clockedSeconds: 18180}
                      - {userId: 103, name: Carlos Vega, clockedSeconds: 13440}
                      - {userId: 109, name: irene.navas@example.com, clockedSeconds: 18780}
                  - {date: "2026-10-31", closed: false, isToday: false, clockedSeconds: 0, pendingReviewSeconds: 0, plannedSeconds: 0, people: []}
                  - {date: "2026-11-01", closed: false, isToday: false, clockedSeconds: 0, pendingReviewSeconds: 0, plannedSeconds: 0, people: []}
                legend:
                  - {userId: 103, name: Carlos Vega}
                  - {userId: 109, name: irene.navas@example.com}
                  - {userId: 102, name: Lucía Martín}
                selectedDay:
                  date: "2026-10-30"
                  clockedSeconds: 50400
                  pendingReviewSeconds: 13440
                  peopleCount: 3
                  averageSecondsPerPerson: 16800
                  rows:
                    - userId: 102
                      name: Lucía Martín
                      jobRole: {id: 2, name: Cocina}
                      firstClockIn: "2026-10-30T07:00:00+01:00"
                      lastClockOut: "2026-10-30T12:03:00+01:00"
                      open: false
                      clockedSeconds: 18180
                      pendingReviewSeconds: 0
                      warnings: []
                      detailRef: {date: "2026-10-30", userId: 102, scheduledShiftId: 902, attendanceMatchId: null}
                    - userId: 103
                      name: Carlos Vega
                      jobRole: {id: 3, name: Barra}
                      firstClockIn: "2026-10-30T09:18:00+01:00"
                      lastClockOut: "2026-10-30T13:02:00+01:00"
                      open: false
                      clockedSeconds: 13440
                      pendingReviewSeconds: 13440
                      warnings:
                        - {type: LATE_ENTRY, severity: WARNING, seconds: 1080}
                      detailRef: {date: "2026-10-30", userId: 103, scheduledShiftId: 900, attendanceMatchId: null}
                    - userId: 109
                      name: irene.navas@example.com
                      jobRole: {id: 1, name: Sala}
                      firstClockIn: "2026-10-30T07:31:00+01:00"
                      lastClockOut: "2026-10-30T12:44:00+01:00"
                      open: false
                      clockedSeconds: 18780
                      pendingReviewSeconds: 0
                      warnings: []
                      detailRef: {date: "2026-10-30", userId: 109, scheduledShiftId: 909, attendanceMatchId: null}
                filterOptions:
                  people:
                    - {userId: 103, name: Carlos Vega, jobRoleId: 3, removed: false}
                    - {userId: 109, name: irene.navas@example.com, jobRoleId: 1, removed: false}
                    - {userId: 102, name: Lucía Martín, jobRoleId: 2, removed: false}
                  jobRoles:
                    - {id: 1, name: Sala}
                    - {id: 2, name: Cocina}
                    - {id: 3, name: Barra}
        '400':
          description: >
            Invalid `week` or `date`, or `date` outside `week` (1115); or more than 50 `userIds` (1111).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                invalidAttendancePeriod:
                  summary: "1115 - attendance week or date is invalid"
                  value: {status: 400, detail: "1115 - attendance week or date is invalid"}
                invalidUserIds:
                  summary: "1111 - userIds must contain between 1 and 50 identifiers"
                  value: {status: 400, detail: "1111 - userIds must contain between 1 and 50 identifiers"}
        '401':
          description: No authenticated session
        '403':
          description: >
            The caller is not the OWNER of the business (1020; the BFF checks the role with `getUserBusinesses` because the Main API reads also admit a MANAGER), or not a member of it (1015).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  summary: "1020 - user is not the owner of business"
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                notMember:
                  summary: "1015 - user is not member of business"
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: >
            Business not found.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  summary: "1006 - business does not exist"
                  value: {status: 404, detail: "1006 - business does not exist"}
      x-functional-errors: [1006, 1015, 1020, 1111, 1115]

  day:
    get:
      summary: Get the Today screen (List and Timeline)
      description: |
        «Hoy» for one business-local date, OWNER only: one row per scheduled shift and per worklog without
        a shift, with section, severity (fixed table in `AttendanceSeverityDTO`), status, planned and
        clocked times, segments, chips, enabled action codes and the detail reference, plus the counters
        of the filter chips. Order, sections and counts are decided by the BFF.

        Main API calls:
        1. Stage 0: `getUserBusinesses` (`GET /api/v1/businesses`), for the caller's role (OWNER required, otherwise 403 1020; not a member: 403 1015) and the business time zone.
        2. Stage 1, one `parZip` (4 calls):
           - `getDailyAttendance` (`GET /api/v1/businesses/{businessId}/attendance?date&userIds`), the
             rows: `shiftAttendances` (kind SHIFT) and `unmatchedAttendances` (kind UNMATCHED), with
             metrics, alerts, incidents and worklogs with breaks;
           - `getBusinessJobRoles` (all, active or not), for the job-role name of each scheduled shift
             (`ScheduledShiftResponseDTO` has only `jobRoleId`);
           - `getBusinessUsers` (`includeRemoved=true`), for the job role of UNMATCHED rows and
             `filterOptions.people`;
           - `getBusinessJobRoles` (`active=true`), for `filterOptions.jobRoles` (the Main API filters it).

        `jobRoleId` is forwarded to `getDailyAttendance` (Main API 0.0.87), which filters it server-side with `userIds` (AND).
        Worklogs of a business without a published plan (NOT_APPLICABLE matches) are not part of the
        daily view, so they have no row here.

        Concurrency: independent Main API calls of one stage run with Arrow `parZip`; fan-outs are bounded by `Semaphore(8)`, so at most 8 Main API calls are in flight per request. The BFF never filters rows in memory: every filter (date, week, users) is a Main API parameter.
      tags:
        - Attendance
      operationId: getAttendanceDay
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendance/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendance/components.yml#/components/parameters/Date'
        - $ref: '../../components/attendance/components.yml#/components/parameters/UserIds'
        - $ref: '../../components/attendance/components.yml#/components/parameters/JobRoleId'
