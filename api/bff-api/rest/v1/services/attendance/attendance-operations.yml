        asynchronous: the detail may show `reconciliationPending: true` and `accept.disabledReason:
        RECONCILIATION_PENDING`; refetch it shortly.

        Incidents no longer produced by the corrected data resolve as `CORRECTED`, or
        `NO_LONGER_APPLICABLE` when that incident type does not admit `CORRECTED`;
        `OUTSIDE_GEOFENCE` resolves as `CORRECTED`.
        Remaining or newly produced temporal incidents (`EARLY_ENTRY`, `LATE_ENTRY`, `EARLY_EXIT`,
        `LATE_EXIT`, `UNEXPLAINED_GAP`) resolve as `ACCEPTED` by the correcting owner with the
        correction reason. No separate «accept» is needed when only temporal incidents remain;
