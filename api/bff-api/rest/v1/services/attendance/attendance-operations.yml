  month:
    get:
      summary: Get the Month screen
      description: |
        «Mes» for one calendar month, requires ATTENDANCE_VIEW (1020), ready to paint: totals,
        one bar per date and the ISO weeks that touch the month, clipped to it. The BFF sums;
        the client does not. Omit `userIds` for the whole team (phase 2, team by month). There
        is no people list and no `closed` flag per day.

        `month` is optional `YYYY-MM` and defaults to the current month in the business time
        zone. A value that is not that pattern returns 400 1115. The message stays
        `attendance week or date is invalid`; no new code. `userIds` is the existing parameter
        (at most 50, 400 1111). `jobRoleId` is the existing parameter. Both are forwarded (AND).

        Main API calls:
        1. Stage 0: `getUserBusinesses` (`GET /api/v1/businesses`), for ATTENDANCE_VIEW (otherwise 403 1020; not a member: 403 1015; ATTENDANCE unavailable: 403 1155) and the business time zone.
        2. Stage 1, at most 9 calls, at most 8 in flight:
           - two `getBusinessReports` for `from`..`to` of the month (CONFIRMED + APPROVED, and
             `reviewStatus=PENDING_RECONCILIATION&reviewStatus=PENDING_REVIEW`);
           - at most six `getBusinessTeamSchedule`
             (`GET /api/v1/businesses/{businessId}/team-schedules/{weekStart}`), one per ISO
             week that touches the month;
           - one `getBusinessAttendanceIncidentDailyCounts`
             (`GET /api/v1/businesses/{businessId}/attendance/incident-daily-counts?from&to`),
             `from` the first day and `to` the last (a month is at most 31 dates).

        `userIds` and `jobRoleId` are forwarded to those calls. Team-schedules filters the role
        stored on the shift. Reports and incident counts use the `getDailyAttendance` rule (a
        worklog or incident without a shift uses the contract in force that business-local day).

        Planned seconds use team-schedules v1.0.28: sum of segments minus the break; a night
        shift counts entirely on its start day, so a shift that starts before the month is not
        in it and a shift that starts on the last day counts entirely on that day. An ISO week
        that crosses the month affects only its own dates. PUBLISHED, or ARCHIVED that was
        previously published, counts as published. After stage 0, 404 1046 on a week means that
        week's dates inside the month have `plannedSeconds: null` and the week `published: false`.
        0 means the week is published and the filtered audience has no shift that day. The client
        must not interpolate nulls. `totals.plannedSeconds` sums the dates whose planned seconds
        are not null, and is null when no date of the month is published.
        `totals.unpublishedDayCount` is how many dates are unpublished. Any other failure of
        those Main API calls fails the request; the BFF does not substitute 0.

        `unjustifiedIncidentCount` is required and not nullable. It counts OPEN incidents with
        justification null, anchored like the inbox (shift start for SHIFT or a MATCHED match,
        otherwise the business-local clock-in) in the business time zone. A date absent from the
        Main count is 0. ATTENDANCE implies SCHEDULING, and ATTENDANCE_VIEW is only held when
        ATTENDANCE is available.

        clocked = CONFIRMED + APPROVED; pending apart in `pendingReviewSeconds`. Open worklogs
        count in no figure. Seconds are net of effective breaks and attributed to the
        business-local clock-in day.

        Rate limit: 120 requests per minute and 1200 per hour per authenticated user and business,
        one bucket shared with the other attendance GET reads (hours, day, week, badge, shift
        detail and match detail). 429 has no functional code and sets
        `X-Rate-Limit-Retry-After-Seconds`, not `Retry-After`. An allowed response sets
        `X-Rate-Limit-Remaining`. The BFF implementation PR must verify both headers with an
        integration test. POST actions are not in this bucket.

        Concurrency: independent Main API calls of one stage run with Arrow `parZip`; fan-outs are bounded by `Semaphore(8)`, so at most 8 Main API calls are in flight per request. The BFF never filters rows in memory: every filter (month, users, job role) is a Main API parameter.
      tags:
        - Attendance
      operationId: getAttendanceMonth
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendance/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendance/components.yml#/components/parameters/Month'
        - $ref: '../../components/attendance/components.yml#/components/parameters/UserIds'
        - $ref: '../../components/attendance/components.yml#/components/parameters/JobRoleId'
      responses:
        '200':
          description: Month already summed for the filtered audience
          headers:
            X-Rate-Limit-Remaining:
              $ref: '../../components/attendance/components.yml#/components/headers/XRateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '../../components/attendance/components.yml#/components/schemas/AttendanceMonthDTO'
