  day:
    get:
      summary: Get the Today screen (List and Timeline)
      description: |
        «Hoy» for one business-local date, requires ATTENDANCE_VIEW (1020): one row per scheduled shift and per worklog without
        a shift, with section, severity (fixed table in `AttendanceSeverityDTO`), status, planned and
        clocked times, segments, chips, enabled action codes and the detail reference, plus the counters
        of the filter chips. Order, sections and counts are decided by the BFF.

        Main API calls:
        1. Stage 0: `getUserBusinesses` (`GET /api/v1/businesses`), for ATTENDANCE_VIEW (otherwise 403 1020; not a member: 403 1015; ATTENDANCE unavailable: 403 1155) and the business time zone.
        2. Stage 1, one `parZip` (6 calls):
           - `getDailyAttendance` (`GET /api/v1/businesses/{businessId}/attendance?date&userIds`), the
             rows: `shiftAttendances` (kind SHIFT) and `unmatchedAttendances` (kind UNMATCHED), with
             alerts, incidents and worklogs with breaks. Not the source of `planned.plannedSeconds`;
           - one `getBusinessTeamSchedule`
             (`GET /api/v1/businesses/{businessId}/team-schedules/{weekStart}`, `weekStart` the Monday
             of the date), each published shift's planned seconds (v1.0.28: segments minus the break,
             a night shift in full on its start day). The same shift has this figure on Hours and
             Month. 404 1046 means the week is not published: the BFF does not copy
             `metrics.plannedSeconds` and does not fail the day for that 404. Any other failure of
             team-schedules fails the request;
           - `getPlanningGenerationInput`
             (`GET /api/v1/businesses/{businessId}/planning-generations/input?weekStart=`, the Monday of
             the date's ISO week), for `closed`;
           - `getBusinessJobRoles` (all, active or not), for the job-role name of each scheduled shift
             (`ScheduledShiftResponseDTO` has only `jobRoleId`);
           - `getBusinessUsers` (`includeRemoved=true`), for the job role of UNMATCHED rows and
             `filterOptions.people`;
           - `getBusinessJobRoles` (`active=true`), for `filterOptions.jobRoles` (the Main API filters it).

        `jobRoleId` is forwarded to `getDailyAttendance` and `getBusinessTeamSchedule` (AND with `userIds`).
        Team-schedules filters the role stored on the shift.
        Worklogs of a business without a published plan (NOT_APPLICABLE matches) are not part of the
        daily view, so they have no row here.

        Rate limit: 120 requests per minute and 1200 per hour per authenticated user and business, one
        bucket shared with the other attendance GET reads. 429 has no functional code and sets
        `X-Rate-Limit-Retry-After-Seconds`, not `Retry-After`. An allowed response sets
        `X-Rate-Limit-Remaining`. The BFF implementation PR must verify both headers with an
        integration test.

        Concurrency: independent Main API calls of one stage run with Arrow `parZip`; fan-outs are bounded by `Semaphore(8)`, so at most 8 Main API calls are in flight per request. The BFF never filters rows in memory: every filter (date, week, users) is a Main API parameter.
