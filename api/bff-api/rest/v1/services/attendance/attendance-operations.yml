  shift-correction:
    post:
      summary: Correct a worklog of a shift
      description: |
        Correct a worklog of a shift on `…/attendance/shifts/{scheduledShiftId}/correction`.

        OWNER only. The BFF checks the role with `getUserBusinesses` before anything else; the Main API
        enforces it again (M7). Main API functional errors are propagated unchanged. The response is the
        detail re-read after the action. Management correction reconciliation completes synchronously within the Main API
        correction request, and the refreshed BFF detail reflects it. After a rejection, reconciliation is
        asynchronous: the detail may show `reconciliationPending: true` and `accept.disabledReason:
        RECONCILIATION_PENDING`; refetch it shortly.

        Incidents no longer produced by the corrected data resolve as `CORRECTED`, or
        `NO_LONGER_APPLICABLE` when that incident type does not admit `CORRECTED`;
        `OUTSIDE_GEOFENCE` resolves as `CORRECTED`.
        Remaining or newly produced temporal incidents (`EARLY_ENTRY`, `LATE_ENTRY`, `EARLY_EXIT`,
        `LATE_EXIT`, `UNEXPLAINED_GAP`) resolve as `ACCEPTED` by the correcting owner with the
        correction reason. No separate «accept» is needed when only temporal incidents remain;
        «accept» is needed only if a structural incident or another unreviewed worklog of the shift
        remains. `UNSCHEDULED_WORK`, `AMBIGUOUS_MATCH` and `NO_SHOW` remain open and block approval;
        `AUTOMATIC_CLOSE` remains open and blocks approval if its clock-out was not corrected.

        Main API calls, in sequence:
        1. `getUserBusinesses` (role).
        2. Pre-read `getShiftAttendance` to check that `worklogId` is one of the shift's `worklogs` (otherwise 404 1017, without calling the action).
        3. `correctBusinessWorklog` (`PUT /api/v1/businesses/{businessId}/worklogs/{worklogId}/correction`) with `clockIn`, `clockOut` and `reason`. The worklog is approved at once. For a worklog with `provisionalClockOut: true`, `clockOut` is required (400 1025).
        4. Re-read as in `getAttendanceShiftDetail`: `getShiftAttendance` (`GET /api/v1/businesses/{businessId}/scheduled-shifts/{scheduledShiftId}/attendance`),
             `getBusinessUsers` (`includeRemoved=true`, names of justification and change authors and of
             resolvers) and `getBusinessJobRoles`, in one `parZip`; then `getWorklogHistory`
             (`GET /api/v1/worklogs/{worklogId}/history`) once per worklog of the shift, at most 8 in flight.

        Concurrency: independent Main API calls of one stage run with Arrow `parZip`; fan-outs are bounded by `Semaphore(8)`, so at most 8 Main API calls are in flight per request. The BFF never filters rows in memory: every filter (date, week, users) is a Main API parameter.
      tags:
        - Attendance
      operationId: correctAttendanceShiftWorklog
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendance/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendance/components.yml#/components/parameters/ScheduledShiftId'
      requestBody:
        required: true
        description: Worklog to correct, new times and mandatory reason
        content:
          application/json:
            schema:
              $ref: '../../components/attendance/components.yml#/components/schemas/AttendanceWorklogCorrectionRequestDTO'
            example:
              worklogId: 3051
              clockIn: "2026-10-30T09:00:00+01:00"
              reason: The worker was at the door at 9:00; the tablet was off.
      responses:
        '200':
          description: Refreshed detail
          content:
            application/json:
              schema:
                $ref: '../../components/attendance/components.yml#/components/schemas/AttendanceDetailDTO'
              examples:
                attendanceShiftDetail:
                  $ref: '../../components/attendance/components.yml#/components/examples/AttendanceShiftDetail'
        '400':
          description: >
            The reason is blank (1068); or the correction is not valid (1025): neither `clockIn` nor `clockOut` is sent, `clockOut` is missing for a worklog with `provisionalClockOut` (open AUTOMATIC_CLOSE), or the Main API rejects the interval (it changes nothing, ends in the future or is not a valid interval). The BFF checks the first two rules after the pre-read and before calling `correctBusinessWorklog`.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                worklogNotValid:
                  summary: "1025 - worklog is not valid"
                  value: {status: 400, detail: "1025 - worklog is not valid"}
                reasonRequired:
                  summary: "1068 - worklog correction requires a non-blank reason"
                  value: {status: 400, detail: "1068 - worklog correction requires a non-blank reason"}
        '401':
          description: No authenticated session
        '403':
          description: >
            The caller is not the OWNER of the business. The BFF checks the role first with `getUserBusinesses`; the Main API enforces the same rule (M7) and its 403 1020 is propagated unchanged. A non-member receives 1015.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  summary: "1020 - user is not the owner of business"
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                notMember:
                  summary: "1015 - user is not member of business"
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: >
            Business or shift not found, or the worklog is not one of the shift's worklogs.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  summary: "1006 - business does not exist"
                  value: {status: 404, detail: "1006 - business does not exist"}
                worklogNotFound:
                  summary: "1017 - worklog not found"
                  value: {status: 404, detail: "1017 - worklog not found"}
                shiftNotFound:
                  summary: "1076 - scheduled shift not found"
                  value: {status: 404, detail: "1076 - scheduled shift not found"}
        '409':
          description: >
            The correction overlaps another worklog (1022) or the worklog changed concurrently (1049).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
