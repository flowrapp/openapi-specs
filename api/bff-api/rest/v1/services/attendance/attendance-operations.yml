        What needs attention today (business time zone), for the red badge of the tab, requires ATTENDANCE_VIEW (1020). It
        takes no `date`: it is always today. The front shows `openIncidentCount` (Main API, open
        incidents only; alerts are not counted), as Sergio decided. `attentionCount` (the rows of today
        whose severity is not OK, `counts.incidents` of `getAttendanceDay` for today without filters, so
        the CRITICAL alerts MISSING_CLOCK_IN and LONG_OPEN count) stays in the response but is not the
        badge.

        Main API calls (sequential, today depends on the zone):
        1. Stage 0: `getUserBusinesses` (`GET /api/v1/businesses`), for ATTENDANCE_VIEW (otherwise 403 1020; not a member: 403 1015; ATTENDANCE unavailable: 403 1155) and the business time zone.
