                  value: {status: 404, detail: "1006 - business does not exist"}
                worklogNotFound:
                  summary: "1017 - worklog not found"
                  value: {status: 404, detail: "1017 - worklog not found"}
                shiftNotFound:
                  summary: "1076 - scheduled shift not found"
                  value: {status: 404, detail: "1076 - scheduled shift not found"}
        '409':
