attendance:
  hours:
    get:
      summary: Get the Hours screen
      description: |
        «Horas» for one ISO week, requires ATTENDANCE_VIEW (1020), ready to paint: totals, 7 days,
        legend, `people`, the selected day's rows and the filter options. All seconds are net of
        effective breaks and attributed to the business-local day of the clock-in. Open worklogs
        count in no figure (D3 default).

        Main API calls:
        1. Stage 0: `getUserBusinesses` (`GET /api/v1/businesses`), for ATTENDANCE_VIEW (otherwise 403 1020; not a member: 403 1015; ATTENDANCE unavailable: 403 1155) and the business time zone.
        2. Stage 1, one `parZip` (9 calls, at most 8 in flight):
           - `getBusinessReports` (`GET /api/v1/businesses/{businessId}/reports?from&to&userIds`), the
             reportable seconds (CONFIRMED + APPROVED) per person and day;
           - `getBusinessReports` with `reviewStatus=PENDING_RECONCILIATION&reviewStatus=PENDING_REVIEW`, the
             pending seconds per person and day;
           - one `getDailyAttendance` (`GET /api/v1/businesses/{businessId}/attendance?date&userIds`) of the
             selected day only, for the clock-in and clock-out of that day's rows, their warnings and
             their `detailRef`. It is not the source of planned seconds;
           - one `getBusinessTeamSchedule`
             (`GET /api/v1/businesses/{businessId}/team-schedules/{weekStart}`, `weekStart` the Monday),
             the planned seconds of the week;
           - one `getBusinessAttendanceIncidentDailyCounts`
             (`GET /api/v1/businesses/{businessId}/attendance/incident-daily-counts?from&to`, the seven
             dates), the unjustified incidents of the filtered audience;
           - `getPlanningGenerationInput`
             (`GET /api/v1/businesses/{businessId}/planning-generations/input?weekStart=`, the Monday),
             for `closed`;
           - `getBusinessUsers` (`includeRemoved=true`), the roster, including removed members, for
             names, the current job role, `removed` and `filterOptions.people`;
           - `getBusinessJobRoles` without `active` (all roles, inactive included), for the job-role
             name of each row;
           - `getBusinessJobRoles` (`active=true`), for `filterOptions.jobRoles`.

        `jobRoleId` is forwarded, together with `userIds` (AND), to the two reports, the selected day's
        `getDailyAttendance`, `getBusinessTeamSchedule` and `getBusinessAttendanceIncidentDailyCounts`.
        Team-schedules filters the role stored on the shift. The other three use the `getDailyAttendance`
        rule (a worklog or incident without a shift uses the contract in force that business-local day).
        When no member matches, the response has zeros, or null planned seconds when the week is not
        published, and no rows.

        Planned seconds (`days[].plannedSeconds`, `days[].people[].plannedSeconds`,
        `totals.plannedSeconds`, `people[].plannedSeconds`, `selectedDay.rows[].plannedSeconds`)
        come from that team schedule (v1.0.28). A shift is the sum of its segments minus the break; the
        unpaid gap of a split shift is not included; a night shift counts entirely on its start day.
        PUBLISHED, or ARCHIVED that was previously published, counts as published. After stage 0, 404
        1046 means the ISO week is not published: every planned-seconds field of the week is null. 0
        means the week is published and that day, or that person, has no shift. The seven days and the
        total are either all null or all numbers. The client must not interpolate nulls. Any other
        failure of team-schedules, of the reports, of the incident counts or of the selected day fails
        the request; the BFF does not substitute 0. Up to BFF 0.0.112 planned seconds came from
        `getDailyAttendance` `metrics.plannedSeconds` and `getPlannings`. There is no legacy form.

        `people` lists every person of the filtered audience who has confirmed or pending seconds in
        the week, a published shift, or an unjustified incident. Order is `needsReview` true first,
        then name, then userId. Name order is case- and accent-insensitive Spanish locale
        collation (`es`); ties break by `userId` ascending (`irene` before `Lucía`). There is no
        people list for the month.

        clocked = reportable (CONFIRMED + APPROVED), per person, day and week; pending apart in
        `pendingReviewSeconds` (BFF 0.0.106; up to 0.0.105 clocked = reportable + pending).
        `unjustifiedIncidentCount` is required and not nullable: ATTENDANCE implies SCHEDULING, and a
        caller who passes ATTENDANCE_VIEW has ATTENDANCE. It counts OPEN incidents whose justification
        is null, anchored like the inbox (shift start for SHIFT or a MATCHED match, otherwise the
        business-local clock-in) in the business time zone. A date or person absent from the Main count
        is 0.

        Validation before any Main API call: an invalid `week` or `date`, or a `date` outside `week`,
        returns 400 1115. The BFF never moves `date` into the week.

        Rate limit: 120 requests per minute and 1200 per hour per authenticated user and business, one
        bucket shared with the other attendance GET reads (day, week, month, badge, shift detail and
        match detail). 429 has no functional code. The limiter sets `X-Rate-Limit-Retry-After-Seconds`
        on 429 and `X-Rate-Limit-Remaining` on an allowed response. It does not set `Retry-After`.
        The BFF implementation PR must verify both headers with an integration test. POST actions
        are not in this bucket.

        Concurrency: independent Main API calls of one stage run with Arrow `parZip`; fan-outs are bounded by `Semaphore(8)`, so at most 8 Main API calls are in flight per request. The BFF never filters rows in memory: every filter (date, week, users, job role) is a Main API parameter.
      tags:
        - Attendance
      operationId: getAttendanceHours
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendance/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendance/components.yml#/components/parameters/Week'
        - $ref: '../../components/attendance/components.yml#/components/parameters/Date'
        - $ref: '../../components/attendance/components.yml#/components/parameters/UserIds'
        - $ref: '../../components/attendance/components.yml#/components/parameters/JobRoleId'
      responses:
        '200':
          description: Hours of the week, already filtered
          headers:
            X-Rate-Limit-Remaining:
              $ref: '../../components/attendance/components.yml#/components/headers/XRateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '../../components/attendance/components.yml#/components/schemas/AttendanceHoursDTO'
              example:
                week: {week: "2026-W44", from: "2026-10-26", to: "2026-11-01"}
                totals: {clockedSeconds: 36960, pendingReviewSeconds: 13440, reportableSeconds: 36960, plannedSeconds: 57600, unjustifiedIncidentCount: 1}
                days:
                  - {date: "2026-10-26", closed: false, isToday: false, clockedSeconds: 0, pendingReviewSeconds: 0, plannedSeconds: 0, unjustifiedIncidentCount: 0, people: []}
                  - {date: "2026-10-27", closed: false, isToday: false, clockedSeconds: 0, pendingReviewSeconds: 0, plannedSeconds: 0, unjustifiedIncidentCount: 0, people: []}
                  - {date: "2026-10-28", closed: false, isToday: false, clockedSeconds: 0, pendingReviewSeconds: 0, plannedSeconds: 0, unjustifiedIncidentCount: 0, people: []}
                  - {date: "2026-10-29", closed: false, isToday: false, clockedSeconds: 0, pendingReviewSeconds: 0, plannedSeconds: 0, unjustifiedIncidentCount: 0, people: []}
                  - date: "2026-10-30"
                    closed: false
                    isToday: true
                    clockedSeconds: 36960
                    pendingReviewSeconds: 13440
                    plannedSeconds: 57600
                    unjustifiedIncidentCount: 1
                    people:
                      - {userId: 102, name: Lucía Martín, clockedSeconds: 18180, pendingReviewSeconds: 0, plannedSeconds: 19200, unjustifiedIncidentCount: 0, avatarUrl: null}
                      - {userId: 103, name: Carlos Vega, clockedSeconds: 0, pendingReviewSeconds: 13440, plannedSeconds: 19200, unjustifiedIncidentCount: 1, avatarUrl: null}
                      - {userId: 109, name: irene.navas@example.com, clockedSeconds: 18780, pendingReviewSeconds: 0, plannedSeconds: 19200, unjustifiedIncidentCount: 0, avatarUrl: null}
