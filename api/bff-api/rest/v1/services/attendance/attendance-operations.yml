  shift-detail:
    get:
      summary: Get the detail of a shift attendance
      description: |
        Detail sheet of one scheduled shift, OWNER only: planned and clocked, the shift's worklogs with
        breaks, segments and change history, incidents with severity and justification, the opaque
        `revision` and the enabled actions. `actions.accept.disabledReason` is the Main API
        `approvalBlocker`, forwarded unchanged.

        Main API calls:
        1. Stage 0: `getUserBusinesses` (`GET /api/v1/businesses`), for the caller's role (OWNER required, otherwise 403 1020; not a member: 403 1015) and the business time zone.
        2. Stage 1: `getShiftAttendance` (`GET /api/v1/businesses/{businessId}/scheduled-shifts/{scheduledShiftId}/attendance`),
             `getBusinessUsers` (`includeRemoved=true`, names of justification and change authors and of
             resolvers) and `getBusinessJobRoles`, in one `parZip`; then `getWorklogHistory`
             (`GET /api/v1/worklogs/{worklogId}/history`) once per worklog of the shift, at most 8 in flight.

        Concurrency: independent Main API calls of one stage run with Arrow `parZip`; fan-outs are bounded by `Semaphore(8)`, so at most 8 Main API calls are in flight per request. The BFF never filters rows in memory: every filter (date, week, users) is a Main API parameter.
      tags:
        - Attendance
      operationId: getAttendanceShiftDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendance/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendance/components.yml#/components/parameters/ScheduledShiftId'
      responses:
        '200':
          description: Detail of the shift
          content:
            application/json:
              schema:
                $ref: '../../components/attendance/components.yml#/components/schemas/AttendanceDetailDTO'
              examples:
                attendanceShiftDetail:
                  $ref: '../../components/attendance/components.yml#/components/examples/AttendanceShiftDetail'
        '401':
          description: No authenticated session
        '403':
          description: >
            The caller is not the OWNER of the business (1020; the BFF checks the role with `getUserBusinesses` because the Main API reads also admit a MANAGER), or not a member of it (1015).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  summary: "1020 - user is not the owner of business"
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                notMember:
                  summary: "1015 - user is not member of business"
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: >
            Business or scheduled shift not found (the shift must belong to the published plan of this business).
          content:
