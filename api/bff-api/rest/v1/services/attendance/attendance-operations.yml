  match-break-correction:
    post:
      summary: Correct a break of the worklog of a match
      description: |
        Correct a break of the worklog of a match on `…/attendance/matches/{attendanceMatchId}/breaks/{breakId}/correction`.

        OWNER only. The BFF checks the role with `getUserBusinesses` before anything else; the Main API
        enforces it again (M7). Main API functional errors are propagated unchanged. The response is the
        detail re-read after the action. Management correction reconciliation completes synchronously within the Main API
        correction request, and the refreshed BFF detail reflects it. After a rejection, reconciliation is
        asynchronous: the detail may show `reconciliationPending: true` and `accept.disabledReason:
        RECONCILIATION_PENDING`; refetch it shortly.

        Incidents no longer produced by the corrected data resolve as `CORRECTED`, or `NO_LONGER_APPLICABLE` when
        that incident type does not admit `CORRECTED`; `OUTSIDE_GEOFENCE` resolves as `CORRECTED`.
        Remaining or newly produced temporal incidents (`EARLY_ENTRY`, `LATE_ENTRY`, `EARLY_EXIT`,
        `LATE_EXIT`, `UNEXPLAINED_GAP`) resolve as `ACCEPTED` by the correcting owner with the
        correction reason. No separate «accept» is needed when only temporal incidents remain;
        «accept» is needed only if a structural incident or another unreviewed worklog of the shift
        remains. `UNSCHEDULED_WORK`, `AMBIGUOUS_MATCH` and `NO_SHOW` remain open and block approval;
        `AUTOMATIC_CLOSE` remains open and blocks approval if its clock-out was not corrected.

        Main API calls, in sequence:
        1. `getUserBusinesses` (role and business time zone).
        2. Locate the match: `getBusinessAttendanceMatch` (`GET /api/v1/businesses/{businessId}/attendance-matches/{attendanceMatchId}`),
             `getBusinessUsers` (`includeRemoved=true`) and `getBusinessJobRoles`, in one `parZip`. Not found:
             404 1074. The deprecated `date` and `userId` are ignored.
        3. `correctBusinessWorklogBreak` (`PUT /api/v1/businesses/{businessId}/worklogs/{worklogId}/breaks/{breakId}/correction`) on the match's worklog. A `breakId` that is not one of its breaks returns 404 1069 without calling the action.
        4. Re-read the match as in `getAttendanceMatchDetail`.

        Concurrency: independent Main API calls of one stage run with Arrow `parZip`; fan-outs are bounded by `Semaphore(8)`, so at most 8 Main API calls are in flight per request. The BFF never filters rows in memory: every filter (date, week, users) is a Main API parameter.
      tags:
