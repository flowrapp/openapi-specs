  week:
    get:
      summary: Get the Week screen
      description: |
        «Semana» for one ISO week, requires ATTENDANCE_VIEW (1020): KPIs and a people × 7 days grid. Cell state and KPI rules
        are in `AttendanceWeekCellStateDTO` and `AttendanceWeekKpisDTO`.

        Main API calls:
        1. Stage 0: `getUserBusinesses` (`GET /api/v1/businesses`), for ATTENDANCE_VIEW (otherwise 403 1020; not a member: 403 1015; ATTENDANCE unavailable: 403 1155) and the business time zone.
        2. Stage 1, one `parZip` (10 calls, at most 8 in flight):
           - 7 × `getDailyAttendance` (`GET /api/v1/businesses/{businessId}/attendance?date&userIds`), one
             per day; future days return their shifts as UPCOMING;
           - `getPlanningGenerationInput`
             (`GET /api/v1/businesses/{businessId}/planning-generations/input?weekStart=`, the Monday),
             for `closed`;
           - `getBusinessUsers` (`includeRemoved=true`), for `filterOptions`;
           - `getBusinessJobRoles` (`active=true`), for `filterOptions.jobRoles`.

        `jobRoleId` is forwarded to each `getDailyAttendance` (Main API 0.0.87), filtered server-side with `userIds` (AND). There is no Main API range read; 7 daily calls are the
        approved approach until metrics ask for one. This screen has no `plannedSeconds` field, so it
        does not call `getBusinessTeamSchedule`. Cell start and end stay the attendance times.

        Rate limit: 120 requests per minute and 1200 per hour per authenticated user and business, one
        bucket shared with the other attendance GET reads. 429 has no functional code and sets
        `X-Rate-Limit-Retry-After-Seconds`, not `Retry-After`. An allowed response sets
        `X-Rate-Limit-Remaining`. The BFF implementation PR must verify both headers with an
        integration test.

        Concurrency: independent Main API calls of one stage run with Arrow `parZip`; fan-outs are bounded by `Semaphore(8)`, so at most 8 Main API calls are in flight per request. The BFF never filters rows in memory: every filter (date, week, users) is a Main API parameter.
      tags:
        - Attendance
      operationId: getAttendanceWeek
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../../components/attendance/components.yml#/components/parameters/BusinessId'
        - $ref: '../../components/attendance/components.yml#/components/parameters/Week'
        - $ref: '../../components/attendance/components.yml#/components/parameters/UserIds'
        - $ref: '../../components/attendance/components.yml#/components/parameters/JobRoleId'
      responses:
        '200':
          description: People × days of the week, already filtered
          headers:
            X-Rate-Limit-Remaining:
              $ref: '../../components/attendance/components.yml#/components/headers/XRateLimitRemaining'
          content:
