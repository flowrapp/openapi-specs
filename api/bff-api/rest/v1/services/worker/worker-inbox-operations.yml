                          durationSeconds: 1800
                      changes: []
                    incidents:
                      - id: 880
                        scope: MATCH
                        attendanceMatchId: 700
                        scheduledShiftId: null
                        type: LATE_ENTRY
                        lifecycle: RESOLVED
                        resolution: ACCEPTED
                        measuredSeconds: 1080
