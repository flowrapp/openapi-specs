worker:
  businesses:
    get:
      summary: Get worker's businesses
      description: >
        Returns the list of businesses the authenticated worker belongs to, including full
        business details and the worker's role in each business. When provided, search is
        forwarded as a case-insensitive substring filter on the business name; surrounding
        whitespace is ignored, blank values return all memberships, and `%` and `_` are
        treated as literal characters.
      tags:
        - Worker
      operationId: getWorkerBusinesses
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Optional case-insensitive substring to search within the business name.
          schema:
            type: string
      responses:
        '200':
          description: Businesses retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/worker/components.yml#/components/schemas/WorkerBusinessResponseDTO'
              example:
                - id: 101
                  nif: "B12345678"
                  name: "Coffee Time"
                  zone: "Europe/Madrid"
                  address: "C/ Gran Vía 43"
                  town: "Barbate"
                  city: "Cádiz"
                  country: "España"
                  postalCode: "11160"
                  location:
                    latitude: 36.19
                    longitude: -5.99
                    area: 50.0
                  userRole: "EMPLOYEE"
                  permissions: []
                  accessRole: null
                  plan: PROFESSIONAL
                  features: [SCHEDULING, ATTENDANCE, ADVANCED_PLANNING]
                  attendanceToleranceMinutes: 5
        '401':
          description: Unauthorized

  clock-view:
    get:
      summary: Get worker clock view
      description: >
        Returns the worker's clock view for a given date (defaults to today). This is the main
        aggregation endpoint that combines: today's completed sessions, the currently active
        session (if clocked in), its open break (`activeBreak`), the breaks of the day (`breaks`),
        and running totals for the current week and month.
        Breaks add no Main API call: they come in the `breaks` of each Main API `getUserWorklogs`
        worklog the view already reads. Session `durationSeconds` is net of breaks (BFF 0.0.73).
        `autoClocking` (BFF 0.0.75) adds one Main API call, `getCurrentUserAutoClockingSettings`, made in
        parallel with the worklogs and reports calls; an error of that call is propagated like the others.
      tags:
        - Worker
      operationId: getWorkerClockView
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          required: false
          description: Date to view (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
            format: date
            example: "2025-07-29"
      responses:
        '200':
          description: Clock view retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/worker/components.yml#/components/schemas/ClockViewResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a member of this business
        '404':
          description: Business not found

  clock-in:
    post:
      summary: Clock in
      description: >
        Records the start of a work session for the authenticated worker at the specified business.
        Pass-through to the main API.
      tags:
        - Worker
      operationId: workerClockIn
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
      requestBody:
        description: Clock-in information, including optional device location
        required: false
        content:
          application/json:
            schema:
              $ref: '../../components/worker/components.yml#/components/schemas/ClockInRequestDTO'
      responses:
        '200':
          description: Clock-in successful
          content:
            application/json:
              schema:
                $ref: '../../components/worker/components.yml#/components/schemas/ClockInResultDTO'
        '400':
          description: Clock-in timestamp or location is invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a member of this business
        '404':
          description: Business not found
        '409':
          description: Conflict - User already has an active session or the idempotency identifier conflicts

  geofence-event:
    put:
      deprecated: true
      summary: Register a worker geofence event
      description: >
        Idempotently registers a geofence event emitted by the authenticated worker's device.
        Repeating the request with the same event ID and payload does not create a duplicate event.
        New device clients should use `PUT /api/v1/device/businesses/{businessId}/geofence-events/{eventId}`
        with a geofence device credential. This authenticated endpoint remains available for compatibility.
      tags:
        - Worker
      operationId: upsertWorkerGeofenceEvent
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business whose geofence emitted the event
          schema:
            type: integer
            format: int64
        - name: eventId
          in: path
          required: true
          description: Client-generated identifier used to make event delivery idempotent
          schema:
            type: string
            format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      requestBody:
        required: true
        description: Geofence event data captured by the worker's device
        content:
          application/json:
            schema:
              $ref: '../../components/worker/components.yml#/components/schemas/GeofenceEventRequestDTO'
            example:
              deviceId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
              type: DWELL
              occurredAt: "2026-08-06T08:30:00Z"
      responses:
        '201':
          description: Geofence event created successfully
        '204':
          description: An identical geofence event was already registered
        '400':
          description: Invalid geofence event
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a member of this business
        '404':
          description: Business not found
        '409':
          description: The event ID is already associated with a different payload

  clock-out:
    put:
      summary: Clock out
      description: >
        Records the end of an active work session for the authenticated worker.
        Pass-through to the main API. A break still open is ended by the Main API at the
        clock-out instant; the returned `durationSeconds` is net of breaks.
      tags:
        - Worker
      operationId: workerClockOut
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: worklogId
          in: path
          required: true
          description: ID of the active worklog to close
          schema:
            type: integer
            format: int64
      requestBody:
        description: Clock-out information, including optional device location
        required: false
        content:
          application/json:
            schema:
              $ref: '../../components/worker/components.yml#/components/schemas/ClockOutRequestDTO'
      responses:
        '200':
          description: Clock-out successful
          content:
            application/json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/SessionDTO'
        '400':
          description: Clock-out timestamp or location is invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User does not own this worklog
        '404':
          description: Worklog not found

  break-start:
    post:
      summary: Start a break
      description: |
        Starts a break («Pausa») on the authenticated worker's open worklog `worklogId` (the
        `activeWorklog.id` of the clock view). There is a single kind of break, without types, and every
        break is deducted from the worked time. At most one break is open at a time.

        Pass-through: one Main API call, `startWorklogBreak`
        (`POST /api/v1/businesses/{businessId}/worklogs/{worklogId}/breaks`), with `idempotencyId` and `startedAt`. No geofence
        check and no location: unlike clock-in and clock-out, the Main API break commands take no location
        and do not apply the business geofence policy. Idempotent: retrying with the same `idempotencyId`
        (and the same `startedAt`, if sent) returns the same break. Main API functional errors are
        propagated unchanged.
      tags:
        - Worker
      operationId: startWorkerBreak
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: worklogId
          in: path
          required: true
          description: >
            ID of the worker's open worklog (`activeWorklog.id` of the clock view)
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Idempotent break-start command
        content:
          application/json:
            schema:
              $ref: '../../components/worker/components.yml#/components/schemas/WorkerBreakStartRequestDTO'
            example:
              idempotencyId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        '200':
          description: >
            Break started (or the same break, on a retry)
          content:
            application/json:
              schema:
                $ref: '../../components/worker/components.yml#/components/schemas/WorkerBreakDTO'
              example:
                id: 457
                worklogId: 123
                startedAt: "2025-07-29T14:00:00+02:00"
                endedAt: null
                durationSeconds: null
        '400':
          description: >
            `startedAt` is before the clock-in or in the future (1073).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                breakNotValid:
                  summary: "1073 - worklog break interval is not valid"
                  value: {status: 400, detail: "1073 - worklog break interval is not valid"}
        '401':
          description: Unauthorized
        '403':
          description: >
            The worklog is closed (1018): the worker is clocked out, so there is no open worklog to pause; or it belongs to another user (1019).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                worklogClosed:
                  summary: "1018 - worklog already closed"
                  value: {status: 403, detail: "1018 - worklog already closed"}
                notOwner:
                  summary: "1019 - user is not the owner of worklog"
                  value: {status: 403, detail: "1019 - user is not the owner of worklog"}
        '404':
          description: >
            The worklog does not exist (1017) or does not belong to this business (1065).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                worklogNotFound:
                  summary: "1017 - worklog not found"
                  value: {status: 404, detail: "1017 - worklog not found"}
                businessMismatch:
                  summary: "1065 - worklog is not available through this business"
                  value: {status: 404, detail: "1065 - worklog is not available through this business"}
        '409':
          description: >
            A break is already open (1070): end it first. The `idempotencyId` was reused with a different worklog or `startedAt` (1072). The worklog changed concurrently (1049); refetch the clock view.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                breakAlreadyOpen:
                  summary: "1070 - worklog already has an open break"
                  value: {status: 409, detail: "1070 - worklog already has an open break"}
                idempotencyConflict:
                  summary: "1072 - break idempotency identifier was reused with different command content"
                  value: {status: 409, detail: "1072 - break idempotency identifier was reused with different command content"}
                concurrentModification:
                  summary: "1049 - resource was modified concurrently"
                  value: {status: 409, detail: "1049 - resource was modified concurrently"}
      x-functional-errors: [1017, 1018, 1019, 1049, 1065, 1070, 1072, 1073]

  break-end:
    put:
      summary: End a break
      description: |
        Ends the authenticated worker's open break `breakId` (the `activeBreak.id` of the clock view)
        on the open worklog `worklogId`; the worker is back to WORKING. The break time is deducted from the
        session's worked time.

        Pass-through: one Main API call, `endWorklogBreak`
        (`PUT /api/v1/businesses/{businessId}/worklogs/{worklogId}/breaks/{breakId}/end`), with `idempotencyId` and `endedAt`. No geofence
        check and no location (the Main API break commands take none). Idempotent: retrying with the same
        `idempotencyId` (and the same `endedAt`, if sent) returns the same break. Main API functional errors
        are propagated unchanged. Clocking out with a break still open is allowed: the Main API ends the
        break at the clock-out instant, so the app does not need to call this endpoint first.
      tags:
        - Worker
      operationId: endWorkerBreak
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: worklogId
          in: path
          required: true
          description: >
            ID of the worker's open worklog (`activeWorklog.id` of the clock view)
          schema:
            type: integer
            format: int64
        - name: breakId
          in: path
          required: true
          description: >
            ID of the open break to end (`activeBreak.id` of the clock view)
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: Idempotent break-end command
        content:
          application/json:
            schema:
              $ref: '../../components/worker/components.yml#/components/schemas/WorkerBreakEndRequestDTO'
            example:
              idempotencyId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      responses:
        '200':
          description: >
            Break ended (or the same break, on a retry)
          content:
            application/json:
              schema:
                $ref: '../../components/worker/components.yml#/components/schemas/WorkerBreakDTO'
              example:
                id: 457
                worklogId: 123
                startedAt: "2025-07-29T14:00:00+02:00"
                endedAt: "2025-07-29T14:30:00+02:00"
                durationSeconds: 1800
        '400':
          description: >
            `endedAt` is not after the break start or is in the future (1073).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                breakNotValid:
                  summary: "1073 - worklog break interval is not valid"
                  value: {status: 400, detail: "1073 - worklog break interval is not valid"}
        '401':
          description: Unauthorized
        '403':
          description: >
            The worklog is closed (1018); its open break was already ended at the clock-out. Or it belongs to another user (1019).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                worklogClosed:
                  summary: "1018 - worklog already closed"
                  value: {status: 403, detail: "1018 - worklog already closed"}
                notOwner:
                  summary: "1019 - user is not the owner of worklog"
                  value: {status: 403, detail: "1019 - user is not the owner of worklog"}
        '404':
          description: >
            The worklog does not exist (1017) or does not belong to this business (1065), or the break is not one of its breaks (1069).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                worklogNotFound:
                  summary: "1017 - worklog not found"
                  value: {status: 404, detail: "1017 - worklog not found"}
                businessMismatch:
                  summary: "1065 - worklog is not available through this business"
                  value: {status: 404, detail: "1065 - worklog is not available through this business"}
                breakNotFound:
                  summary: "1069 - worklog break not found"
                  value: {status: 404, detail: "1069 - worklog break not found"}
        '409':
          description: >
            The break is not open (1071): it was already ended (or voided). The `idempotencyId` was reused with a different break or `endedAt` (1072). The worklog changed concurrently (1049); refetch the clock view.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                breakNotOpen:
                  summary: "1071 - worklog has no open break"
                  value: {status: 409, detail: "1071 - worklog has no open break"}
                idempotencyConflict:
                  summary: "1072 - break idempotency identifier was reused with different command content"
                  value: {status: 409, detail: "1072 - break idempotency identifier was reused with different command content"}
                concurrentModification:
                  summary: "1049 - resource was modified concurrently"
                  value: {status: 409, detail: "1049 - resource was modified concurrently"}
      x-functional-errors: [1017, 1018, 1019, 1049, 1065, 1069, 1071, 1072, 1073]

  history-day:
    get:
      summary: Get worker day history
      description: >
        Returns the detailed work history for a specific day, including all individual
        clock-in/clock-out sessions and total seconds worked. It also returns required
        `attendances`: caller-owned rows for the day with planned shift and job-role details,
        worklogs, change history including worker confirmation, and incidents. Week and month
        history remain day-summary views and do not include attendance rows.
      tags:
        - Worker
      operationId: getWorkerDayHistory
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          required: false
          description: Date to view (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
            format: date
            example: "2025-03-10"
      responses:
        '200':
          description: Day history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/worker/components.yml#/components/schemas/WorkerDayHistoryResponseDTO'
              examples:
                empty:
                  summary: Day without attendance rows
                  value: {date: "2026-11-02", closed: false, totalSeconds: 0, sessions: [], attendances: []}
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a member of this business
        '404':
          description: Business not found

  history-week:
    get:
      summary: Get worker week history
      description: >
        Returns the work history for an ISO week, broken down by day with individual sessions
        per day. Includes total seconds and session count for the week. Day `totalSeconds`
        (confirmed) and `pendingSeconds` keep their meaning; pending seconds are not added
        to `plannedSeconds`.


        `plannedSeconds` comes from one Main `getBusinessTeamSchedule`
        (`GET /api/v1/businesses/{businessId}/team-schedules/{weekStart}?userIds=` the caller),
        where `weekStart` is the Monday of this ISO week. Sum the caller's shift
        `plannedSeconds` on each date. `null` means no data (no published planning for that
        week, or the business has no SCHEDULING feature): do not call team-schedules when
        SCHEDULING is absent, and a 404 for the week means no published planning. `0` means
        the week is published and that date has no shift. The client must not interpolate
        nulls. There is no Main API change for planned seconds.


        `unjustifiedIncidentCount` comes from Main `getCurrentUserAttendanceIncidentDailyCounts`
        with `from` Monday and `to` Sunday of this week. Unjustified means OPEN with no
        justification. Dates omitted by that list are 0. `unjustifiedIncidentCount` is
        `null` on every day when the business has no ATTENDANCE feature; do not call
        the endpoint in that case.


        A 403 1155 from team-schedules means SCHEDULING is unavailable: `plannedSeconds`
        is null and this request still returns 200. A 403 1155 from daily-counts means
        ATTENDANCE is unavailable: `unjustifiedIncidentCount` is null and this request
        still returns 200. Any other failure of those calls fails this request; the BFF
        does not substitute 0. The new fields are required. There is no legacy response
        that omits them.
      tags:
        - Worker
      operationId: getWorkerWeekHistory
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: week
          in: query
          required: false
          description: ISO 8601 week (YYYY-Www). Defaults to current week.
          schema:
            type: string
            pattern: '^\d{4}-W\d{2}$'
            example: "2025-W31"
      responses:
        '200':
          description: Week history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/worker/components.yml#/components/schemas/WorkerWeekHistoryResponseDTO'
              examples:
                publishedWeek:
                  summary: Published ISO week. Days without a shift are 0, not null.
                  value:
                    week: "2026-W10"
                    totalSeconds: 28800
                    pendingSeconds: 1800
                    totalSessions: 1
                    days:
                      - {date: "2026-03-02", closed: false, totalSeconds: 28800, pendingSeconds: 1800, plannedSeconds: 28800, unjustifiedIncidentCount: 1, sessions: []}
                      - {date: "2026-03-03", closed: false, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: 0, unjustifiedIncidentCount: 0, sessions: []}
                      - {date: "2026-03-04", closed: false, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: 0, unjustifiedIncidentCount: 0, sessions: []}
                      - {date: "2026-03-05", closed: false, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: 0, unjustifiedIncidentCount: 0, sessions: []}
                      - {date: "2026-03-06", closed: false, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: 0, unjustifiedIncidentCount: 0, sessions: []}
                      - {date: "2026-03-07", closed: false, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: 0, unjustifiedIncidentCount: 0, sessions: []}
                      - {date: "2026-03-08", closed: true, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: 0, unjustifiedIncidentCount: 0, sessions: []}
                noPublishedPlanning:
                  summary: No published planning. Every plannedSeconds is null; the client must not interpolate nulls.
                  value:
                    week: "2026-W09"
                    totalSeconds: 0
                    pendingSeconds: 0
                    totalSessions: 0
                    days:
                      - {date: "2026-02-23", closed: false, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: null, unjustifiedIncidentCount: 0, sessions: []}
                      - {date: "2026-02-24", closed: false, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: null, unjustifiedIncidentCount: 0, sessions: []}
                      - {date: "2026-02-25", closed: false, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: null, unjustifiedIncidentCount: 0, sessions: []}
                      - {date: "2026-02-26", closed: false, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: null, unjustifiedIncidentCount: 0, sessions: []}
                      - {date: "2026-02-27", closed: false, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: null, unjustifiedIncidentCount: 0, sessions: []}
                      - {date: "2026-02-28", closed: false, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: null, unjustifiedIncidentCount: 0, sessions: []}
                      - {date: "2026-03-01", closed: false, totalSeconds: 0, pendingSeconds: 0, plannedSeconds: null, unjustifiedIncidentCount: 0, sessions: []}
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a member of this business
        '404':
          description: Business not found

  history-month:
    get:
      summary: Get worker month history
      description: >
        Returns a calendar view for a month with day-level totals only (no session detail).
        Use the day history endpoint to drill into a specific day's sessions. The month tab
        accumulates daily confirmed `totalSeconds` against daily `plannedSeconds`, draws one
        bar per day and warns from `unjustifiedIncidentCount`. Day `totalSeconds` (confirmed)
        and `pendingSeconds` keep their meaning; pending seconds are not added to
        `plannedSeconds`.


        `plannedSeconds` comes from Main `getBusinessTeamSchedule`
        (`GET /api/v1/businesses/{businessId}/team-schedules/{weekStart}?userIds=` the caller)
        for each ISO week that contains a date of this month. Only the dates of that week
        that fall in this month are filled from it; a week that crosses the month does not
        change any other month. `null` means no data (no published planning for that date's
        ISO week, or the business has no SCHEDULING feature). `0` means the week is
        published and that date has no shift. The client must not interpolate nulls. Do not
        call team-schedules when SCHEDULING is absent. A 404 for one week means no published
        planning for the dates of that week inside this month. There is no Main API change
        for planned seconds.


        `unjustifiedIncidentCount` comes from one Main
        `getCurrentUserAttendanceIncidentDailyCounts` with `from` the first day of the month
        and `to` the last (at most 31 dates). Unjustified means OPEN with no justification.
        Dates omitted by that list are 0. `unjustifiedIncidentCount` is `null` on every
        day when the business has no ATTENDANCE feature; do not call the endpoint in
        that case.


        A 403 1155 from team-schedules means SCHEDULING is unavailable: `plannedSeconds`
        is null and this request still returns 200. A 403 1155 from daily-counts means
        ATTENDANCE is unavailable: `unjustifiedIncidentCount` is null and this request
        still returns 200. Any other failure of those calls fails this request; the BFF
        does not substitute 0. The new fields are required. There is no legacy response
        that omits them.
      tags:
        - Worker
      operationId: getWorkerMonthHistory
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: month
          in: query
          required: false
          description: Year and month (YYYY-MM). Defaults to current month.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: "2025-03"
      responses:
        '200':
          description: Month history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/worker/components.yml#/components/schemas/WorkerMonthHistoryResponseDTO'
              examples:
                crossingWeeks:
                  summary: >
                    Three dates, not the whole month. 2026-03-01 belongs to an unpublished
                    ISO week (null = no data). 2026-03-02 is a published shift and 2026-03-03
                    is published with no shift (0). The client must not interpolate the null
                    from either neighbour.
                  value:
                    month: "2026-03"
                    totalSeconds: 28800
                    pendingSeconds: 1800
                    totalSessions: 1
                    days:
                      - {date: "2026-03-01", totalSeconds: 0, pendingSeconds: 0, plannedSeconds: null, unjustifiedIncidentCount: 0}
                      - {date: "2026-03-02", totalSeconds: 28800, pendingSeconds: 1800, plannedSeconds: 28800, unjustifiedIncidentCount: 1}
                      - {date: "2026-03-03", totalSeconds: 0, pendingSeconds: 0, plannedSeconds: 0, unjustifiedIncidentCount: 0}
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a member of this business
        '404':
          description: Business not found

  hours-months:
    get:
      summary: List the worker's own monthly hours for «Mis horas»
      description: |
        One page of the worker's own monthly totals in this business, newest month first, for the «Mis horas»
        screen. Forwards to the Main API `getCurrentUserWorkedHoursMonths` and adds `report` to each month.
        The person is always the caller, derived from the access token; there is no user parameter and the
        response never holds another member's data. The caller must be or have been a member of the business (an
        active or a removed membership, forwarded to the Main API check); contracts are not checked, so a worker
        whose contracts ended or who was removed still reads their own data. A user that never was a member gets
        403 (1015). No REPORTS_EXPORT, no other business permission and no business feature: every plan. The BFF does
        not pre-check membership with getWorkerBusinesses (that list holds active memberships only).
        Window: the 12 most recent calendar months in the business time zone, the current month included.
        `confirmedSeconds` is the month total of the monthly PDF (`getWorkerWorkedHoursReportPdf`).
        `pendingSeconds` is apart and always present. These fields do not follow the worker history `totalSeconds`
        rule: their meaning does not change whatever is decided for the history and clock-view totals.
        If the Main API call fails the request fails (5xx); no field is omitted or replaced by 0.
      tags:
        - Worker
      operationId: getWorkerHoursMonths
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: before
          in: query
          required: false
          description: Exclusive upper bound (YYYY-MM). Omit it for the first page, which starts with the current month; then send the previous nextBefore. After the current month 400 (1025); on or before the oldest month of the window, an empty page.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: "2026-11"
        - name: limit
          in: query
          required: false
          description: Maximum number of months in the page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 12
            default: 12
            example: 12
      responses:
        '200':
          description: One page of monthly totals
          content:
            application/json:
              schema:
                $ref: '../../components/worker/components.yml#/components/schemas/WorkerHoursMonthsResponseDTO'
              example:
                zone: Europe/Madrid
                today: "2026-11-11"
                months:
                  - month: "2026-11"
                    inProgress: true
                    confirmedSeconds: 189000
                    pendingSeconds: 15300
                    pendingCount: 2
                    hasWorklogs: true
                    report: {available: true, provisional: true, effectiveTo: "2026-11-11"}
                  - month: "2026-10"
                    inProgress: false
                    confirmedSeconds: 561600
                    pendingSeconds: 0
                    pendingCount: 0
                    hasWorklogs: true
                    report: {available: true, provisional: false, effectiveTo: "2026-10-31"}
                  - month: "2026-09"
                    inProgress: false
                    confirmedSeconds: 0
                    pendingSeconds: 0
                    pendingCount: 0
                    hasWorklogs: false
                    report: {available: false, provisional: false, effectiveTo: "2026-09-30"}
                nextBefore: "2026-09"
        '400':
          description: Invalid before or limit (1 to 12), or before after the current month
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1025 - from date must be before or equal to to date"}
        '401':
          description: Unauthorized
        '403':
          description: The caller never was a member of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notMember:
                  summary: "1015 - user is not member of business"
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}
      x-functional-errors: [1006, 1015, 1025]

  worked-hours-report:
    get:
      summary: Get the worker's own monthly worked hours report PDF
      description: |
        Returns, in the response body, the worker's own worked-hours report PDF for one calendar month in this
        business, for the in-app PDF viewer and the system share sheet of «Mis horas». No email is sent. Forwards to
        the Main API `exportCurrentUserWorkedHoursReportPdf` and streams its PDF and headers unchanged.
        The person is always the caller, derived from the access token; there is no user parameter and the
        response never holds another member's data. The caller must be or have been a member of the business (an
        active or a removed membership, forwarded to the Main API check); contracts are not checked, so a worker
        whose contracts ended or who was removed still reads their own data. A user that never was a member gets
        403 (1015). No REPORTS_EXPORT, no other business permission and no business feature: every plan. The BFF does
        not pre-check membership with getWorkerBusinesses (that list holds active memberships only).
        Same v2 render as the manager export with periodType MONTH for one person (no centre summary page). Its
        month total equals `confirmedSeconds` of `getWorkerHoursMonths`; pending, rejected and open worklogs are in
        annex B, outside the total. The month must be inside the 12-month window of `getWorkerHoursMonths` (the
        current month or one of the 11 before it); a future month or an older one returns 400 (1025). The current
        month is truncated to today in the business time zone and the PDF says so («hasta hoy»).
        Filename (Content-Disposition, forwarded from the Main API): `registro-jornada-YYYY-MM.pdf` for a closed
        month; for the provisional current month, `registro-jornada-YYYY-MM-hasta-YYYY-MM-DD.pdf`, where the second
        date is today in the business time zone (for example `registro-jornada-2026-11-hasta-2026-11-12.pdf`), the
        same `-hasta-` convention as the manager export. No person name in the filename.
        Synchronous, no polling. If the p95 generation time measured in develop exceeds about 5 s, it moves to a
        queue (RabbitMQ) with stored PDFs in a later version.
        Rate limit: 6 requests per minute and 30 per hour per authenticated worker, all businesses together (429).
        Error bodies are problem+json, but a client that downloads the binary may rely on the status code only.
        A manager who wants to preview a member's monthly PDF in the same viewer uses
        `exportManagerWorkedHoursReportPdf` with periodType=MONTH and userIds set to that member (REPORTS_EXPORT);
        this operation is not for that.
      tags:
        - Worker
      operationId: getWorkerWorkedHoursReportPdf
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: month
          in: query
          required: true
          description: Calendar month of the report in the business time zone (YYYY-MM)
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: "2026-10"
      responses:
        '200':
          description: The worker's own monthly report, as a single PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: |
                Forwarded from the Main API. Closed month: `registro-jornada-YYYY-MM.pdf`. Provisional current
                month: `registro-jornada-YYYY-MM-hasta-YYYY-MM-DD.pdf` (today in the business time zone), for example
                `registro-jornada-2026-11-hasta-2026-11-12.pdf`. No person name.
              schema:
                type: string
                example: 'attachment; filename="registro-jornada-2026-10.pdf"'
            Content-Length:
              description: Size of the PDF in bytes
              schema:
                type: integer
                format: int64
                example: 83995
        '400':
          description: Invalid month, a future month, or a month older than the 12-month window
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1025 - from date must be before or equal to to date"}
        '401':
          description: Unauthorized
        '403':
          description: The caller never was a member of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notMember:
                  summary: "1015 - user is not member of business"
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}
        '429':
          description: More than 6 requests in a minute or 30 in an hour from this worker (all businesses together). Retry later. No functional code; the body is the rate limiter's default problem.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {title: Too Many Requests, status: 429, detail: "Too many requests. Retry later."}
        '500':
          description: The report could not be generated
      x-functional-errors: [1006, 1015, 1025]

  team-schedule:
    get:
      summary: Get the worker-visible team schedule for an ISO week
      description: >
        Returns assigned shifts from a published planning, or from an archived planning that was
        previously published, grouped by the business-local start date. OWNER, MANAGER, and
        EMPLOYEE members may read this privacy-safe view. All seven dates of the week are returned,
        including dates without shifts. Missing membership and unavailable planning both return a
        non-disclosing 404.
      tags: [Worker]
      operationId: getWorkerTeamSchedule
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: week
          in: query
          required: true
          description: ISO week identifier in YYYY-Www format
          schema:
            type: string
            pattern: '^\d{4}-W\d{2}$'
            example: "2025-W31"
      responses:
        '200':
          description: Published or previously published archived team schedule
          content:
            application/json:
              schema:
                $ref: '../../components/worker/components.yml#/components/schemas/WorkerTeamScheduleResponseDTO'
              examples:
                published:
                  summary: Published team schedule with an overnight shift
                  value:
                    businessId: 101
                    week: "2025-W31"
                    weekStart: "2025-07-28"
                    weekEnd: "2025-08-03"
                    days:
                      - date: "2025-07-28"
                        closed: false
                        shifts:
                          - id: 900
                            worker: {id: 3, name: Bob Wilson}
                            jobRole: {id: 10, code: WAITER, name: Waiter, color: "#1A2B3C", icon: front-of-house}
                            shiftId: 20
                            shiftName: Morning service
                            shiftColor: "#1A2B3C"
                            startAt: "2025-07-28T09:00:00+02:00"
                            endAt: "2025-07-28T17:00:00+02:00"
                            breakMinutes: 30
                            durationSeconds: 27000
                            netSeconds: 27000
