                            endAt: "2025-07-28T23:00:00+02:00"
                            breakMinutes: 30
                            durationSeconds: 30600
                            netSeconds: 30600
                            segments:
                              - startAt: "2025-07-28T10:00:00+02:00"
                                endAt: "2025-07-28T14:00:00+02:00"
                              - startAt: "2025-07-28T18:00:00+02:00"
                                endAt: "2025-07-28T23:00:00+02:00"
                          - id: 901
                            worker: {id: 4, name: Alice Brown}
                            jobRole: {id: 11, code: KITCHEN, name: Kitchen, color: "#4C9F70", icon: kitchen}
                            shiftId: 21
                            shiftName: Night service
