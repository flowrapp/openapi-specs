reports:
  request-business-worked-hours-report:
    post:
      deprecated: true
      summary: Request asynchronous business worked hours report generation
      description: |
        Requests the worked-hours PDF for the selected people of the business, emailed to the requester.
        If userIds is omitted or empty, the whole business is included; with userIds, current or former
        members only (400 1101 otherwise), at most 50 distinct ids (400 1111). The report is generated
        asynchronously; this response only confirms that the request was accepted. Only PDF is sent by email;
        the CSV is download-only (exportManagerWorkedHoursReportPdf).
        Authorization: REPORTS_EXPORT (403 1020 without it; 403 1104 for an EMPLOYEE without a contract in force).
        Deprecated since BFF 0.0.110 (Sergio, 2026-11-12, t43s1): the owner reports screen now uses the direct
        export. It lists months with getManagerHoursMonths and downloads the PDF or CSV of each month, in the
        response body, with exportManagerWorkedHoursReportPdf; nothing is emailed. New clients must not use this
        operation. It still works exactly as before; its removal will come in a later version.
        Rate limit: 2 requests per minute and 10 per hour per authenticated user and business, a bucket of its own
        (not shared with the download). 429 without a functional code.
        The optional periodType (MONTH, YEAR or RANGE, default RANGE) is forwarded to the main API; when it is omitted the request behaves exactly as before (RANGE).
        A period that ends after today is accepted and truncated by the server to today in the business time zone; a period whose from is after today returns 400.
        A PDF report that covers several employees, for any periodType including YEAR, is delivered as one single PDF document, not as a ZIP.
      tags:
        - Reports
      operationId: requestBusinessWorkedHoursReport
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                  description: Start date of the report range, inclusive
                  example: "2025-01-01"
                to:
                  type: string
                  format: date
                  description: End date of the report range, inclusive
                  example: "2025-12-31"
                periodType:
                  $ref: '../../components/reports/components.yml#/components/schemas/WorkedHoursReportPeriodTypeDTO'
                  description: Period type of the report. Omit it to keep the previous behavior (RANGE). Forwarded to the main API.
                type:
                  type: string
                  enum: [PDF]
                  default: PDF
                  description: Output format of the report. Only PDF is sent by email; any other value returns 400 (1103).
                userIds:
                  type: array
                  maxItems: 50
                  description: People to include, current or former members. Omit or leave empty for the whole business. At most 50 distinct ids.
                  items:
                    type: integer
                    format: int64
                  example: [12, 34]
              required: [from, to]
            example:
              from: "2025-01-01"
              to: "2025-12-31"
              type: PDF
              userIds: [12, 34]
      responses:
        '202':
          description: Report generation request accepted; no report is returned in this response
        '400':
          description: Invalid date range or from after today (1025), period type mismatch (1114), report type (1103), an id without membership in the business (1101) or more than 50 userIds (1111)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example:
                status: 400
                detail: "1114 - from and to do not match periodType"
        '401':
          description: Unauthorized
        '403':
          description: The caller lacks REPORTS_EXPORT in the business, or is an EMPLOYEE without a contract in force
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user lacks permission REPORTS_EXPORT in business"}
        '429':
          description: More than 2 requests in a minute or 10 in an hour from this user for this business. Retry later. No functional code; the body is the rate limiter's default problem.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {title: Too Many Requests, status: 429, detail: "Too many requests. Retry later."}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}
      x-functional-errors: [1006, 1020, 1025, 1101, 1103, 1104, 1111, 1114]
