reports:
  request-business-worked-hours-report:
    post:
      summary: Request asynchronous business worked hours report generation
      description: |
        Requests a PDF or Excel (.xlsx) worked-hours report for the selected employees in the
        business. If userIds is omitted or empty, all employees in the business are included.
        The report is generated asynchronously; this response only confirms that the request was
        accepted. Only the business OWNER may request report generation.
      tags:
        - Reports
      operationId: requestBusinessWorkedHoursReport
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                  description: Start date of the report range, inclusive
                  example: "2025-01-01"
                to:
                  type: string
                  format: date
                  description: End date of the report range, inclusive
                  example: "2025-12-31"
                type:
                  type: string
                  enum: [PDF, EXCEL]
                  default: PDF
                  description: Output format of the report
                userIds:
                  type: array
                  description: User IDs to include. Omit or leave empty to include all employees.
                  items:
                    type: integer
                    format: int64
                  example: [12, 34]
              required: [from, to]
            example:
              from: "2025-01-01"
              to: "2025-12-31"
              type: PDF
              userIds: [12, 34]
      responses:
        '202':
          description: Report generation request accepted; no report is returned in this response
        '400':
          description: Invalid date range, report type, or user IDs (including users outside the requested business)
        '401':
          description: Unauthorized
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}
      x-functional-errors: [1006, 1020]
