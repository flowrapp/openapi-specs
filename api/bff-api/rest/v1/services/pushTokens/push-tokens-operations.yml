pushTokens:
  push-tokens:
    post:
      summary: Register push notification token
      description: >
        Registers or updates a device push notification token for the
        authenticated user. Remains available when a token becomes available
        after login, permissions change, or the push provider rotates the token.
        Legacy bearer tokens without device binding remain supported with the
        existing user/device registration behavior. Only for device-bound tokens
        must deviceId match the authenticated session; the registration is then
        associated with that session for logout cleanup. Registering a token
        replaces any previous association of that token with another user, so
        notifications cannot reach the previous account. Pass-through to the main API.
      tags:
        - Push Tokens
      operationId: registerPushToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/pushTokens/components.yml#/components/schemas/PushTokenRequestDTO'
      responses:
        '201':
          description: Push token registered successfully
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Device identity does not match the device-bound bearer session; does not apply to legacy tokens
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'

  deletion:
    delete:
      summary: Delete push notification token
      description: >
        Deletes a device push notification token for the authenticated user.
        Does not revoke the authentication session; use POST /api/v1/auth/logout
        to revoke the current session and remove its push registration together.
        Pass-through to the main API.
      tags:
        - Push Tokens
      operationId: deletePushToken
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          description: Unique identifier of the device
          schema:
            type: string
      responses:
        '200':
          description: Push token deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Push token not found for this device
