members:
  remove-business-member:
    delete:
      summary: Remove a member from a business
      description: >
        Forwards to the Main API, which ends the user's membership in the business. Only the
        business OWNER may perform this operation; the MANAGER role is not sufficient. The
        member's historical data (worklogs, contracts, reports) is preserved. An OWNER cannot
        be removed. The BFF propagates the Main API's functional errors.
      tags:
        - Members
      operationId: removeBusinessMember
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: User ID of the member to remove, not the business membership ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Member removed from the business successfully; no response body
        '401':
          description: Unauthorized
        '403':
          description: >
            Authenticated user is not an OWNER of the business, the target user is not a business
            member, or the target user is an OWNER of the business.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                notMember:
                  value: {status: 403, detail: "1015 - user is not member of business"}
                cannotRemoveOwner:
                  value: {status: 403, detail: "1106 - user cannot remove the owner from the business"}
        '404':
          description: Business or user not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  value: {status: 404, detail: "1006 - business does not exist"}
                userNotFound:
                  value: {status: 404, detail: "1000 - user not found"}
      x-functional-errors: [1000, 1006, 1015, 1020, 1106]
