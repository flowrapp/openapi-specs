members:
  remove-business-member:
    delete:
      summary: Remove a member from a business
      description: >
        Forwards to the Main API, which ends the user's membership in the business. Only the
        business OWNER may perform this operation; the MANAGER role is not sufficient. The
        member's historical data (worklogs, contracts, reports) is preserved. The identity
        document of the membership is kept and stops counting for uniqueness in the business.
        An OWNER cannot
        be removed. The BFF propagates the Main API's functional errors.
      tags:
        - Members
      operationId: removeBusinessMember
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: User ID of the member to remove, not the business membership ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Member removed from the business successfully; no response body
        '401':
          description: Unauthorized
        '403':
          description: >
            Authenticated user is not an OWNER of the business, the target user is not a business
            member, or the target user is an OWNER of the business.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                notMember:
                  value: {status: 403, detail: "1015 - user is not member of business"}
                cannotRemoveOwner:
                  value: {status: 403, detail: "1106 - user cannot remove the owner from the business"}
        '404':
          description: Business or user not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  value: {status: 404, detail: "1006 - business does not exist"}
                userNotFound:
                  value: {status: 404, detail: "1000 - user not found"}
      x-functional-errors: [1000, 1006, 1015, 1020, 1106]

  search-business-members:
    get:
      summary: Search or list business members by name
      description: >
        Searches members by name, or lists all of them when `q` is omitted, empty, or
        blank, and returns one page ready for the hub. Access is
        limited to an OWNER or MANAGER of the business. Anyone else receives 403
        with functional code 1020 (`USER_NOT_OWNER_OF_BUSINESS`), already in the
        catalog. On this operation the detail is
        `1020 - user is not an owner or manager of the business`, because a
        MANAGER is allowed and the failure is not "not the owner". A missing
        business receives 404 with functional code 1006.
        The literal path segment `search` is registered beside `/members/{userId}`;
        `userId` is an int64, so `search` is not a member id.
        The BFF does not interpret the cursor. It makes at most four Main API calls
        for the page, never one call per user:
        1. `GET /api/v2/businesses/{businessId}/users` with `search` set to `q` (omitted
        when `q` is empty or blank), optional `jobRoleId`, plus
        `limit` and `cursor`. That response is user and membership only (`userId`,
        `username`, `name`, `role`). `username` is currently equal to `name`. `hasNext`
        and `nextCursor` are forwarded as-is.
        2. When the page is not empty, `GET /api/v1/businesses/{businessId}/contracts/current?userIds=`
        once, with every user id of the page (at most 50). `currentContractId` is
        `contract.id`, `jobRole` is `contract.jobRole`, `totalWeekHours` is
        `contract.totalWeekHours`, and `currentContractEndDate` is `contract.endDate`.
        A member missing from this response has `currentContractId`, `jobRole`,
        `totalWeekHours`, and `currentContractEndDate` null and `contractEndingSoon` false.
        3. When the page is not empty, `GET /api/v1/businesses/{businessId}/worklogs/open?userIds=`
        once, with the same ids. `workingNow` is true when that response contains the
        user id, and false otherwise.
        4. When the page is not empty, `GET /api/v1/businesses` (`getUserBusinesses`) once,
        only to read the business `zone` and compute the business-local today for
        `contractEndingSoon` (true when `currentContractEndDate` is within today + 30 days,
        both ends included). A business without a zone uses UTC.
        Calls 2, 3, and 4 run for the whole page together (at most three in flight). An
        empty page skips them. Errors of any call are propagated.
        `q` is the v2 `search` parameter: accent- and case-insensitive, name only, not
        email, 2 to 64 characters after trim and normalization when present. Order is the
        v2 order: with `q`, rank (a prefix of the name or of a word first), then normalized
        name, then userId. Without `q`, normalized name, then userId.
        Optional `jobRoleId` is forwarded unchanged to Main `getBusinessUsersV2` and is
        combinable with `q`, `limit`, and `cursor` (AND). Preview of who holds a role uses
        the same call with a small `limit` (for example 3); "Ver en Equipo" uses the same
        filter, optionally with `q`, and cursor pagination. The job role must belong to the
        business (active or archived); otherwise Main 404 1034 is propagated. Optional
        `accessRoleId` works the same way for access roles (Main 404 1151). No `total`
        field is added.
      tags:
        - Members
      operationId: searchBusinessMembers
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 101
        - name: q
          in: query
          required: false
          description: >
            Optional name query, accent- and case-insensitive. Omitted, empty, or blank
            means no filter: every active member is listed. Otherwise sent to the Main API
            as `search` on `GET /api/v2/businesses/{businessId}/users`. The Main API trims
            and normalizes it (lowercase, accents removed, ñ folded to n) and requires 2
            to 64 characters after that normalization. A shorter query returns 400
            SEARCH_QUERY_TOO_SHORT. A longer query returns 400 SEARCH_QUERY_TOO_LONG. Percent, underscore, and backslash are literal.
            Search is by name only, not by email.
          schema:
            type: string
            maxLength: 64
            example: tur
        - name: jobRoleId
          in: query
          required: false
          description: >
            Optional job role filter, forwarded to Main `getBusinessUsersV2` as `jobRoleId`.
            Combined with `q`. The job role must belong to this business (active or archived);
            otherwise 404 JOB_ROLE_NOT_FOUND. Preview of who holds the role typically uses
            `limit=3` (or another small limit); Equipo uses the same filter with cursor pages.
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 11
        - name: accessRoleId
          in: query
          required: false
          description: >
            Optional access role filter, forwarded to Main `getBusinessUsersV2` as
            `accessRoleId`: only active members holding that access role. Combined with `q`
            and `jobRoleId` (AND). The access role must belong to this business; otherwise
            404 ACCESS_ROLE_NOT_FOUND (1151). «Quién lo tiene» of the role editor uses a small
            `limit`; Equipo uses the same filter with cursor pages.
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 7
        - name: limit
          in: query
          required: false
          description: >
            Maximum number of members to return. Defaults to 20. A value below 1 or
            above 50 returns 400 INVALID_SEARCH_LIMIT and is not clamped.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 20
            example: 20
        - name: cursor
          in: query
          required: false
          description: >
            Opaque keyset cursor from a previous page of
            `GET /api/v2/businesses/{businessId}/users`. Omit it to read the first page.
            Forward it unchanged. It is bound to this business, to the normalized query,
            and to `jobRoleId` / `accessRoleId` when used. A malformed cursor, or one reused
            with a different q, `jobRoleId`, `accessRoleId`, or businessId, returns 400
            INVALID_SEARCH_CURSOR.
          schema:
            type: string
            minLength: 1
            maxLength: 512
            example: eyJ2IjoxLCJyIjoxfQ
      responses:
        '200':
          description: >
            One page of matching active memberships. With `q`, ordered by rank, normalized
            name, and userId. Without `q`, ordered by normalized name and userId.
          content:
            application/json:
              schema:
                $ref: '../../components/members/components.yml#/components/schemas/MemberSearchPageDTO'
              example:
                content:
                  - userId: 41
                    name: "Turín García"
                    role: EMPLOYEE
                    jobRole:
                      id: 11
                      code: COOK
                      name: Cocina
                      color: "#4C9F70"
                      icon: kitchen
                      active: true
                    currentContractId: 501
                    totalWeekHours: 40
                    currentContractEndDate: null
                    contractEndingSoon: false
                    workingNow: true
                  - userId: 18
                    name: "Arturo López"
                    role: EMPLOYEE
                    jobRole:
                      id: 10
                      code: WAITER
                      name: Sala
                      color: "#1A2B3C"
                      icon: front-of-house
                      active: true
                    currentContractId: 480
                    totalWeekHours: 32
                    currentContractEndDate: "2026-11-30"
                    contractEndingSoon: true
                    workingNow: false
                  - userId: 27
                    name: "Saturnino Ruiz"
                    role: EMPLOYEE
                    jobRole: null
                    currentContractId: null
                    totalWeekHours: null
                    currentContractEndDate: null
                    contractEndingSoon: false
                    workingNow: false
                hasNext: true
                nextCursor: "eyJ2IjoxLCJyIjoxfQ"
        '400':
          description: >
            The Main API rejected the query, limit, or cursor. A query that normalizes
            to a single character returns SEARCH_QUERY_TOO_SHORT; one longer than
            64 characters returns SEARCH_QUERY_TOO_LONG. A limit outside 1..50 returns
            INVALID_SEARCH_LIMIT. A cursor that is malformed or was issued for a
            different query or business returns INVALID_SEARCH_CURSOR.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                queryTooShort:
                  summary: "1107 - search query is shorter than 2 characters after trim and normalization"
                  value:
                    status: 400
                    detail: "1107 - search query is shorter than 2 characters after trim and normalization"
                queryTooLong:
                  summary: "1108 - search query is longer than 64 characters after trim and normalization"
                  value:
                    status: 400
                    detail: "1108 - search query is longer than 64 characters after trim and normalization"
                limitOutOfRange:
                  summary: "1109 - search limit must be between 1 and 50"
                  value:
                    status: 400
                    detail: "1109 - search limit must be between 1 and 50"
                invalidCursor:
                  summary: "1110 - search cursor is invalid or does not match this business and query"
                  value:
                    status: 400
                    detail: "1110 - search cursor is invalid or does not match this business and query"
        '401':
          description: No authenticated session
        '403':
          description: >
            Caller is not an OWNER or MANAGER of the business. The functional code
            is 1020, which is already in the catalog. The message states that rule.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example:
                status: 403
                detail: "1020 - user is not an owner or manager of the business"
        '404':
          description: >
            Business not found (1006), `jobRoleId` does not belong to this business
            (1034 JOB_ROLE_NOT_FOUND), or `accessRoleId` does not belong to this business
            (1151 ACCESS_ROLE_NOT_FOUND), propagated from Main.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
                jobRoleNotFound:
                  summary: "1034 - job role not found"
                  value:
                    status: 404
                    detail: "1034 - job role not found"
                accessRoleNotFound:
                  summary: "1151 - access role not found"
                  value:
                    status: 404
                    detail: "1151 - access role not found"
      x-functional-errors: [1006, 1020, 1034, 1107, 1108, 1109, 1110, 1151]

  member-profile:
    get:
      summary: Get the profile screen of one member («ficha de persona»)
      description: |
        Everything the «ficha de persona» (design A: header, Resumen, Contratos, Fichaje and
        Ajustes) needs, in one response that is ready to paint: the front computes nothing.
        Requires `TEAM_VIEW` (403 1020). `personalData` is a separate block and is null unless
        the caller is the OWNER, has `PERSONAL_DATA_VIEW`, or is the subject. Email stays on
        `email` and is not protected by `PERSONAL_DATA_VIEW`.
        Every value comes from Main API operations that already exist; the BFF only aggregates them
        and derives the fields described in each schema. All instants are returned with the business
        offset, and every local date (today, the week, contract states, seniority) is computed in
        Kotlin with the business `ZoneId` (`getUserBusinesses.zone`), never in SQL.

        The shortcuts «Su histórico» and «Su horario» need no data: the front opens Attendance with
        `userIds=<userId>` and the schedule with `userIds=<userId>` (or `employeeId`) for `week.from`.

        The caller's id (for `isSelf`) is the JWT `sub`, read before any Main API call, the same source
        as the BFF `GET /api/v1/me`. A `sub` that is not
        a numeric user id returns 401 1003 and makes no Main API call.

        `avatarUrl` comes from `getBusinessUsers`. When the caller may see personal data, the BFF
        adds one call: `getCurrentUserPersonalData` if the caller is the subject, otherwise
        `getBusinessUserPersonalData`. Otherwise it does not call them and `personalData` is null.
        The response sends `Cache-Control: no-store`. There is no realtime signal.

        Main API calls (11, with one page each of contracts and job roles; never one per contract, day
        or worklog; full lists are read and the member is picked in Kotlin; at most 8 in flight):
        1. Stage 0, one `parZip` (2 calls):
           - `getUserBusinesses` (`GET /api/v1/businesses`): `TEAM_VIEW` (otherwise
             403 1020; not a member: 403 1015), `zone`, `attendanceToleranceMinutes` and `location.area`;
           - `getBusinessUsers` (`GET /api/v1/businesses/{businessId}/users`, active members only): name,
             email and role of `userId`. When `userId` is not in the response, the BFF returns 404 1126 and
             makes no other call.
        2. Stage 1, one `parZip` (9 calls, at most 8 in flight):
           - `getUserContracts` (`GET /api/v1/businesses/{businessId}/users/{userId}/contracts?size=100`),
             the contract history and the only source of the current contract; further pages only while
             `hasNext` is true;
           - `getBusinessJobRoles` without `active` (`size=100`, every page): names of the job roles of
             contracts and of today's shifts, inactive roles included;
           - `getWorklogs` (`GET /api/v1/businesses/{businessId}/worklogs?userId&from&to`), with `from` the
             UTC date of the business-local Monday 00:00 minus one day and `to` the UTC date of now: the open
             worklog (live status, open elapsed seconds). Worklogs are then filtered by instant in Kotlin;
           - 2 × `getBusinessReports` (`GET /api/v1/businesses/{businessId}/reports?from&to&userId`), Monday to
             Sunday of the business-local week: once without `reviewStatus` (CONFIRMED + APPROVED) and once
             with `reviewStatus=PENDING_RECONCILIATION&reviewStatus=PENDING_REVIEW`; the first is
             `week.workedSeconds` and the second `week.pendingSeconds` (BFF 0.0.106; before, their sum
             was `workedSeconds`), the same rule as Attendance «Horas» `clockedSeconds` and
             `pendingReviewSeconds`;
           - `getBusinessTeamSchedule` (`GET /api/v1/businesses/{businessId}/team-schedules/{weekStart}?userIds`):
             planned seconds of the week. A 404 1046 (no published planning) is not an error here: it
             gives `week.plannedSeconds: null`;
           - `getDailyAttendance` (`GET /api/v1/businesses/{businessId}/attendance?date&userIds`), today in
             the business time zone: the «Hoy» rows, SHIFT (`shiftAttendances`) and UNMATCHED
             (`unmatchedAttendances`), with their lifecycle, clock-in, entry deviation and chips (same rules
             as the Attendance Day rows);
           - `getBusinessGeofencingSettings` (`GET /api/v1/businesses/{businessId}/settings/geofencing`): the
             business policy and this person's `policy` and `effectivePolicy`;
           - `getBusinessAutoClockingSettings` (`GET /api/v1/businesses/{businessId}/settings/auto-clocking`):
             the business switch and this person's `enabled` and `effectiveEnabled`.
           In both settings responses, `businessUserId` is the user id, so the BFF matches it with `userId`
           and returns it as `businessUserId`. A person missing from a settings list gets the Main API
           defaults (ALLOW, enabled) and `businessUserId = userId`.

        Errors: any other Main API failure fails the whole request and is propagated unchanged (no partial
        response), like the Attendance screens. The only exception is the 404 1046 of
        `getBusinessTeamSchedule` described above.
      tags:
        - Members
      operationId: getBusinessMemberProfile
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 101
        - name: userId
          in: path
          required: true
          description: User ID of the member (the same id as `MemberSearchItemDTO.userId`), not the membership ID
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 41
      responses:
        '200':
          description: The member's profile, ready to paint
          headers:
            Cache-Control:
              description: The profile may include personal data and must not be stored by caches.
              required: true
              schema:
                type: string
                enum: ["no-store"]
          content:
