user:
  profile:
    get:
      summary: Get current user profile
      description: >
        Returns the profile of the currently authenticated user, including their name,
        email, phone, profile photo and global system role. `avatarUrl` is null
        until a Clerk webhook has synced the photo. There is no initial backfill.
      tags:
        - User
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          headers:
            Cache-Control:
              description: The profile includes the phone and must not be stored by caches.
              required: true
              schema:
                type: string
                enum: ["no-store"]
          content:
            application/json:
              schema:
                $ref: '../../components/user/components.yml#/components/schemas/UserProfileResponseDTO'
              example:
                id: 1
                name: John Doe
                email: john.doe@example.com
                phone: "+34612345678"
                avatarUrl: null
                role: USER
        '401':
          description: Unauthorized

  phone:
    put:
      summary: Replace the current user's phone
      description: >
        Replaces the caller's global phone. Pass-through to Main API
        `updateCurrentUserPhone`. `phone: null` clears it. The value must be
        E.164 (`^\+[1-9][0-9]{6,14}$`) or null; otherwise 400 1161. The response
        is the current profile and sends `Cache-Control: no-store`.
      tags:
        - User
      operationId: updateCurrentUserPhone
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: New phone, or null to clear it
        content:
          application/json:
            schema:
              $ref: '../../components/personalData/components.yml#/components/schemas/UpdateCurrentUserPhoneRequestDTO'
            examples:
              set:
                summary: Set an E.164 phone
                value:
                  phone: "+34612345678"
              clear:
                summary: Clear the phone
                value:
                  phone: null
      responses:
        '200':
          description: Phone updated. Body is the current user profile.
          headers:
            Cache-Control:
              description: The profile includes the phone and must not be stored by caches.
              required: true
              schema:
                type: string
                enum: ["no-store"]
          content:
            application/json:
              schema:
                $ref: '../../components/user/components.yml#/components/schemas/UserProfileResponseDTO'
              example:
                id: 1
                name: John Doe
                email: john.doe@example.com
                phone: "+34612345678"
                avatarUrl: null
                role: USER
        '400':
          description: The phone is not E.164 (1161). The detail does not echo the value.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                invalidPhone:
                  summary: "1161 - phone number is invalid"
                  value:
                    status: 400
                    detail: "1161 - phone number is invalid"
        '401':
          description: Unauthorized
      x-functional-errors:
        - 1161

  invitations:
    get:
      summary: List current user's invitations
      description: >
        Returns invitations addressed to the currently authenticated user. By default,
        only pending invitations are returned so the response is ready for the mobile inbox.
      tags:
        - User
      operationId: getCurrentUserInvitations
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter invitations by status. Defaults to pending invitations.
          schema:
            type: string
            enum: [PENDING, ACCEPTED, DECLINED, EXPIRED]
            default: PENDING
      responses:
        '200':
          description: Invitations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/user/components.yml#/components/schemas/UserInvitationResponseDTO'
              example:
                - id: 123
                  businessId: 101
                  businessName: "Coffee Time"
                  email: "invitee@example.com"
                  role: "EMPLOYEE"
                  status: "PENDING"
                  createdAt: "2026-07-14T10:30:00+02:00"
                  expiresAt: "2026-07-21T10:30:00+02:00"
        '401':
          description: Unauthorized

  accept-invitation:
    post:
      summary: Accept an invitation
      description: Accepts a pending invitation addressed to the currently authenticated user.
      tags:
        - User
      operationId: acceptCurrentUserInvitation
      security:
        - bearerAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          description: Unique identifier of the invitation
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Invitation accepted successfully
        '401':
          description: Unauthorized
        '403':
          description: Invitation does not belong to the user, has expired, or is not pending
        '404':
          description: Invitation not found

  decline-invitation:
    post:
      summary: Decline an invitation
      description: Declines a pending invitation addressed to the currently authenticated user.
      tags:
        - User
      operationId: declineCurrentUserInvitation
      security:
        - bearerAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          description: Unique identifier of the invitation
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Invitation declined successfully
        '401':
          description: Unauthorized
        '403':
          description: Invitation does not belong to the user, has expired, or is not pending
        '404':
          description: Invitation not found
