contracts:
  worker-contracts:
    parameters:
      - name: businessId
        in: path
        required: true
        description: ID of the business
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        description: User ID of the worker, not the business membership ID
        schema:
          type: integer
          format: int64
    get:
      summary: Get a worker's contract history
      description: >
        Forwards to the Main API's business-scoped user contract history. Returns a paginated
        slice ordered by start date descending, including past, current, and future contracts.
        Only the business OWNER may access this operation; the MANAGER role is not sufficient.
      tags:
        - Contracts
      operationId: getManagerWorkerContracts
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based slice number
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of contracts in the slice
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Contract history retrieved successfully; content is empty when no contracts match
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractSliceResponseDTO'
              examples:
                contractHistory:
                  value:
                    content:
                      - id: 123
                        businessId: 101
                        jobRoleId: 10
                        totalWeekHours: 40.0
                        startDate: "2025-01-01"
                        endDate: null
                        createdAt: "2024-12-20T10:15:00+00:00"
                        updatedAt: "2024-12-20T10:15:00+00:00"
                    page: 0
                    size: 20
                    hasNext: false
                emptyHistory:
                  value: {content: [], page: 0, size: 20, hasNext: false}
        '401':
          description: Unauthorized
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business or user not found, or user is not associated with the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}
      x-functional-errors: [1000, 1006, 1015, 1020]

    post:
      summary: Create a worker contract
      description: >
        Forwards contract creation to the Main API for a user associated with the business.
        Inclusive contract dates must not overlap any other contract for the same user and
        business, even when the job roles differ. Only the business OWNER may create contracts;
        the MANAGER role is not sufficient.
      tags:
        - Contracts
      operationId: createManagerWorkerContract
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: New contract terms
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractRequestDTO'
            example:
              jobRoleId: 10
              totalWeekHours: 40.0
              startDate: "2025-01-01"
              endDate: null
      responses:
        '201':
          description: Contract created successfully
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractResponseDTO'
              example:
                id: 123
                businessId: 101
                jobRoleId: 10
                totalWeekHours: 40.0
                startDate: "2025-01-01"
                endDate: null
                createdAt: "2024-12-20T10:15:00+00:00"
                updatedAt: "2024-12-20T10:15:00+00:00"
        '400':
          description: Contract dates or weekly hours are invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business or user not found, or user is not associated with the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}
        '409':
          description: Contract dates overlap another contract for the same user and business, regardless of job role
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 409, detail: "1029 - contract overlaps another contract for the same user and business"}
      x-functional-errors: [1000, 1006, 1015, 1020, 1029]

  worker-contract:
    delete:
      summary: Delete a future worker contract
      description: >
        Forwards deletion to the Main API, which validates eligibility and deletes atomically.
        The contract must belong to the business and user identified in the path; otherwise,
        returns 404. Only the business OWNER may delete contracts; the MANAGER role is not
        sufficient. The startDate must be strictly after the current date in the business
        time zone. Contracts starting today or earlier cannot be deleted, regardless of
        whether the worker has clocked in. The inclusive contract period must not intersect
        a planning in SOLVING, DRAFT, PUBLISHED, or ARCHIVED. CREATED and FAILED plannings do
        not by themselves block deletion. The BFF propagates the Main API's functional errors.
      tags:
        - Contracts
      operationId: deleteManagerWorkerContract
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: User ID of the worker, not the business membership ID
          schema:
            type: integer
            format: int64
        - name: contractId
          in: path
          required: true
          description: ID of the future worker contract to delete
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Future contract deleted successfully; no response body
        '401':
          description: Unauthorized
        '403':
          description: Authenticated user is not an OWNER of the business, or the target user is not a business member
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                notMember:
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: Business or user not found, or contract not found for the specified business and user (including an already deleted contract)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  value: {status: 404, detail: "1006 - business does not exist"}
                userNotFound:
                  value: {status: 404, detail: "1000 - user not found"}
                contractNotFound:
                  value: {status: 404, detail: "1030 - Contract not found"}
        '409':
          description: Contract starts today or earlier in the business time zone, or its inclusive period intersects a planning in SOLVING, DRAFT, PUBLISHED, or ARCHIVED
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                contractAlreadyStarted:
                  value: {status: 409, detail: "1097 - contract has already started"}
                planningStateConflict:
                  value: {status: 409, detail: "1102 - contract deletion is blocked by planning state"}
      x-functional-errors: [1000, 1006, 1015, 1020, 1030, 1097, 1102]

    put:
      summary: Update a worker contract end date
      description: >
        Forwards an end-date-only update to the Main API. The job role, weekly hours, and start
        date are immutable; changed terms require a new consecutive non-overlapping contract.
        The previous and proposed inclusive contract periods must not intersect a planning in
        SOLVING, DRAFT, PUBLISHED, or ARCHIVED. CREATED and FAILED plannings do not by themselves
        freeze contract validity. A null endDate reopens the contract, subject to the same
        non-overlap and planning-state restrictions. Only the business OWNER may update contracts;
        the MANAGER role is not sufficient.
      tags:
        - Contracts
      operationId: updateManagerWorkerContract
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: User ID of the worker, not the business membership ID
          schema:
            type: integer
            format: int64
        - name: contractId
          in: path
          required: true
          description: ID of the worker contract to update
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: New inclusive contract end date; all other terms remain unchanged
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractEndDateUpdateRequestDTO'
            examples:
              endContract:
                value: {endDate: "2025-07-31"}
              reopenContract:
                value: {endDate: null}
      responses:
        '200':
          description: Contract updated successfully with only its end date changed
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractResponseDTO'
              example:
                id: 123
                businessId: 101
                jobRoleId: 10
                totalWeekHours: 40.0
                startDate: "2025-01-01"
                endDate: "2025-07-31"
                createdAt: "2024-12-20T10:15:00+00:00"
                updatedAt: "2025-06-20T10:15:00+00:00"
        '400':
          description: Contract end date is invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1057 - contract date range is invalid"}
        '401':
          description: Unauthorized
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business, user, or contract not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}
        '409':
          description: >
            The proposed end date overlaps another contract for the same user and business, or
            the previous or proposed contract period intersects a planning in SOLVING, DRAFT,
            PUBLISHED, or ARCHIVED. CREATED and FAILED plannings do not cause this conflict.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                contractOverlap:
                  value: {status: 409, detail: "1029 - contract overlaps another contract for the same user and business"}
                planningStateConflict:
                  value: {status: 409, detail: "1058 - contract update is blocked by planning state"}
      x-functional-errors: [1000, 1006, 1015, 1020, 1029, 1057, 1058]

  worker-contract-amendment-preview:
    post:
      summary: Preview a contract amendment for a worker
      description: >
        Composes the amendment preview from existing Main API reads for the business and user in the path, and
        applies the same effective-date and no-change checks as the apply operation (1169, 1170, 1171), so an
        invalid proposal is rejected before the user confirms. Returns the current contract, the proposed terms,
        the plannings and shifts of the worker from the effective date, each marked as changed or preserved, the
        planned hours per week against the new contract hours (never trimmed), the first day from which the new
        terms are taken into account when planning, and an `expectedState` that the apply operation must receive
        back unchanged. Deprecated, superseded by `previewManagerWorkerContractAmendmentV2`. This version applies the rule of `v1.0.36`: when the job role changes, only the worker's shifts in the DRAFT planning of the week that contains today in the business time zone are marked `JOB_ROLE_CHANGES`; the rest is `PRESERVED`. A result of this operation cannot be confirmed: the apply operation of this version is withdrawn and always rejects with 410 and 1172, so a result of this operation cannot be confirmed by any client. No decision per shift is requested and no notification is sent automatically to the
        employee. Contracts of a single day are valid; effective dates and examples follow the Main API operation.
        Requires CONTRACTS_MANAGE and SCHEDULE_VIEW in the same active business (the plannings are read with
        SCHEDULE_VIEW): without either of them the preview is denied with 403 and 1020, and nothing is returned.
      tags:
        - Contracts
      operationId: previewManagerWorkerContractAmendment
      deprecated: true
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: User ID of the worker, not the business membership ID
          schema:
            type: integer
            format: int64
        - name: contractId
          in: path
          required: true
          description: ID of the contract to amend
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractAmendmentPreviewRequestDTO'
      responses:
        '200':
          description: Amendment preview computed
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractAmendmentPreviewDTO'
        '400':
          description: Invalid request body, effective date in the past, effective date outside the contract validity, or no change in hours and job role
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                datePast:
                  value: {status: 400, detail: "1169 - contract amendment effective date is in the past"}
                dateOutOfRange:
                  value: {status: 400, detail: "1170 - contract amendment effective date is outside the contract validity"}
                noChanges:
                  value: {status: 400, detail: "1171 - contract amendment changes neither hours nor job role"}
        '401':
          description: Unauthorized
        '403':
          description: Missing CONTRACTS_MANAGE or SCHEDULE_VIEW permission in the active business, or the target user is not a business member
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                missingContractsManage:
                  value: {status: 403, detail: "1020 - user lacks permission CONTRACTS_MANAGE in business"}
                missingScheduleView:
                  value: {status: 403, detail: "1020 - user lacks permission SCHEDULE_VIEW in business"}
                notMember:
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: Business, user or contract not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                contractNotFound:
                  value: {status: 404, detail: "1030 - Contract not found"}
        '409':
          description: The effective date overlaps another contract
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                overlap:
                  value: {status: 409, detail: "1029 - contract overlaps another contract for the same user and business"}
      x-functional-errors: [1000, 1006, 1015, 1020, 1029, 1030, 1169, 1170, 1171]

  worker-contract-amendment-preview-v2:
    post:
      summary: Preview a contract amendment for a worker (version 2)
      description: >
        Version 2 of the preview: the only one whose result can be confirmed, with `applyManagerWorkerContractAmendmentV2`.
        A client that calls these version 2 paths against a BFF that predates them gets 404 and writes nothing; it must
        not fall back to the version 1 paths. Composes the amendment preview from existing Main API reads for the business and user in the path, and
        applies the same effective-date and no-change checks as the apply operation (1169, 1170, 1171), so an
        invalid proposal is rejected before the user confirms. Returns the current contract, the proposed terms,
        the plannings and shifts of the worker from the effective date, each marked as changed or preserved, the
        planned hours per week against the new contract hours (never trimmed), the first day from which the new
        terms are taken into account when planning, and an `expectedState` that the apply operation must receive
        back unchanged. When the job role changes, only the job role of the worker's shifts from the effective
        date changes: in the DRAFT planning of the current week (the week that contains today in the business time
        zone) and in every later week, DRAFT or PUBLISHED, which keeps its status; a PUBLISHED current week is
        preserved. This is the rule of Main API 0.0.127 and replaces the one this version had until 0.0.120
        (DRAFT plannings only): a preview of that rule is never confirmed with this one. The preview always sends
        `expectedState.currentWeekStart` (Monday of the current local week) and lists
        the shifts that the apply operation compares to detect changes since the preview (the worker's shifts from
        the effective date in every DRAFT and PUBLISHED planning, kept ones included) and marks the subset that
        apply writes (only those with `impact` JOB_ROLE_CHANGES). It needs no permission beyond the ones below. No decision per shift is requested and no notification is sent automatically to the
        employee. Contracts of a single day are valid; effective dates and examples follow the Main API operation.
        Requires CONTRACTS_MANAGE and SCHEDULE_VIEW in the same active business (the plannings are read with
        SCHEDULE_VIEW): without either of them the preview is denied with 403 and 1020, and nothing is returned.
      tags:
        - Contracts
      operationId: previewManagerWorkerContractAmendmentV2
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: User ID of the worker, not the business membership ID
          schema:
            type: integer
            format: int64
        - name: contractId
          in: path
          required: true
          description: ID of the contract to amend
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractAmendmentPreviewRequestDTO'
      responses:
        '200':
          description: Amendment preview computed
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractAmendmentPreviewDTO'
        '400':
          description: Invalid request body, effective date in the past, effective date outside the contract validity, or no change in hours and job role
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                datePast:
                  value: {status: 400, detail: "1169 - contract amendment effective date is in the past"}
                dateOutOfRange:
                  value: {status: 400, detail: "1170 - contract amendment effective date is outside the contract validity"}
                noChanges:
                  value: {status: 400, detail: "1171 - contract amendment changes neither hours nor job role"}
        '401':
          description: Unauthorized
        '403':
          description: Missing CONTRACTS_MANAGE or SCHEDULE_VIEW permission in the active business, or the target user is not a business member
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                missingContractsManage:
                  value: {status: 403, detail: "1020 - user lacks permission CONTRACTS_MANAGE in business"}
                missingScheduleView:
                  value: {status: 403, detail: "1020 - user lacks permission SCHEDULE_VIEW in business"}
                notMember:
                  value: {status: 403, detail: "1015 - user is not member of business"}
        '404':
          description: Business, user or contract not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                contractNotFound:
                  value: {status: 404, detail: "1030 - Contract not found"}
        '409':
          description: The effective date overlaps another contract
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                overlap:
                  value: {status: 409, detail: "1029 - contract overlaps another contract for the same user and business"}
      x-functional-errors: [1000, 1006, 1015, 1020, 1029, 1030, 1169, 1170, 1171]

  worker-contract-amendments:
    post:
      summary: Apply a contract amendment for a worker
      description: >
        Withdrawn, superseded by `applyManagerWorkerContractAmendmentV2`. It does not call the Main API and writes
        nothing: it always rejects with 410 and 1172. This is not a stale state that the same client can resolve
        (1167 is): a preview taken with the version 1 operation, or one opened before the version 2 operations
        existed, can only be recalculated and confirmed by a client that uses the version 2 operations. Request and
        responses keep their documented shape for compatibility, but no 2xx is ever returned.
      tags:
        - Contracts
      operationId: applyManagerWorkerContractAmendment
      deprecated: true
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: User ID of the worker, not the business membership ID
          schema:
            type: integer
            format: int64
        - name: contractId
          in: path
          required: true
          description: ID of the contract to amend
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractAmendmentApplyRequestDTO'
      responses:
        '200':
          description: Historic shape only. This withdrawn version never returns it (it always answers 410 with 1172); see `applyManagerWorkerContractAmendmentV2`.
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractAmendmentResultDTO'
        '400':
          description: Invalid request body, effective date in the past, effective date outside the contract validity, or no change in hours and job role
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                datePast:
                  value: {status: 400, detail: "1169 - contract amendment effective date is in the past"}
                dateOutOfRange:
                  value: {status: 400, detail: "1170 - contract amendment effective date is outside the contract validity"}
                noChanges:
                  value: {status: 400, detail: "1171 - contract amendment changes neither hours nor job role"}
        '401':
          description: Unauthorized
        '403':
          description: Missing CONTRACTS_MANAGE permission in the active business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Business, user or contract not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '410':
          description: This version is withdrawn and nothing was written. Use `applyManagerWorkerContractAmendmentV2`
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 410, detail: "1172 - this version of the contract amendment operation is withdrawn; use version 2"}
        '409':
          description: Expected state changed since the preview (no effects), or the effective date overlaps another contract
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                expectedStateChanged:
                  value: {status: 409, detail: "1167 - contract amendment expected state changed; recalculate the preview"}
      x-functional-errors: [1000, 1006, 1015, 1020, 1029, 1030, 1167, 1169, 1170, 1171, 1172]

  worker-contract-amendments-v2:
    post:
      summary: Apply a contract amendment for a worker (version 2)
      description: >
        Version 2: confirms a result of `previewManagerWorkerContractAmendmentV2` and forwards to `applyContractAmendmentV2` of the Main API,
        with no fallback to any other path: if the Main API does not have it, nothing is written and the request fails. A BFF that predates
        this path answers 404 and writes nothing. Forwards to the Main API, which applies the amendment atomically. The request carries `expectedState` from
        the preview. The Main API recalculates that state inside the same transaction; if the contract, a planning
        version, or any shift of the worker from the effective date was added, removed or modified (time window, job
        role, catalog shift, break or `updatedAt`, even when the shift id is the same), it rejects with 1167 and
        writes nothing. The client must then
        call the preview again and ask the user to confirm. Effective date and no-change rules are those of the
        preview (1169, 1170, 1171). No per-shift decisions exist: only the job role of the worker's shifts from the
        effective date changes, in the DRAFT planning of the current week and in every later week, DRAFT or
        PUBLISHED (status unchanged); a PUBLISHED current week is preserved. The state must be sent back unchanged,
        `currentWeekStart` included: a state without it (a preview of the previous rule) or from another local week
        is rejected with 1167 and nothing is written, and the client asks for a new preview. Open shift-change
        requests of an affected weekly planning are invalidated by the version change and must be made again. No
        notification is sent automatically to the employee. `closedContract` is null and `newContract` keeps the id of the amended
        contract when the effective date is the first day of the contract (see the Main API operation for examples,
        including single-day contracts). Requires the CONTRACTS_MANAGE permission in the active business.
      tags:
        - Contracts
      operationId: applyManagerWorkerContractAmendmentV2
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          description: User ID of the worker, not the business membership ID
          schema:
            type: integer
            format: int64
        - name: contractId
          in: path
          required: true
          description: ID of the contract to amend
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractAmendmentApplyRequestDTO'
      responses:
        '200':
          description: Amendment applied; the response describes the new contract and the shifts changed
          content:
            application/json:
              schema:
                $ref: '../../components/contracts/components.yml#/components/schemas/ManagerContractAmendmentResultDTO'
        '400':
          description: Invalid request body, effective date in the past, effective date outside the contract validity, or no change in hours and job role
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                datePast:
                  value: {status: 400, detail: "1169 - contract amendment effective date is in the past"}
                dateOutOfRange:
                  value: {status: 400, detail: "1170 - contract amendment effective date is outside the contract validity"}
                noChanges:
                  value: {status: 400, detail: "1171 - contract amendment changes neither hours nor job role"}
        '401':
          description: Unauthorized
        '403':
          description: Missing CONTRACTS_MANAGE permission in the active business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Business, user or contract not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '409':
          description: Expected state changed since the preview (no effects), or the effective date overlaps another contract
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                expectedStateChanged:
                  value: {status: 409, detail: "1167 - contract amendment expected state changed; recalculate the preview"}
      x-functional-errors: [1000, 1006, 1015, 1020, 1029, 1030, 1167, 1169, 1170, 1171]
