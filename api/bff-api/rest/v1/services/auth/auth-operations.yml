auth:
  register-from-invitation:
    post:
      summary: Register user from invitation
      description: >
        Requires a Clerk session whose mail claim matches the invited email.
        A not-yet-enabled invited user is enabled, their username and phone are
        updated, and the invitation is accepted. An already-enabled invited
        user only has the invitation accepted. A session email that does not
        match the invited email is rejected with 1009 - invitation not for
        current user. This is a pass-through to the main API.
      tags:
        - Invitations
      operationId: registerUserFromInvitation
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: query
          required: true
          description: Human-readable invitation code or legacy UUID from the invitation email
          schema:
            type: string
            pattern: '^(?:[2-9A-HJ-NP-Z]{8}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
            example: 7K3M9XQ2
      requestBody:
        description: Registration details for the new user
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/auth/components.yml#/components/schemas/RegisterUserFromInvitationRequestDTO'
            example:
              username: "johndoe"
              phone: "+1234567890"
      responses:
        '201':
          description: User registered and invitation accepted successfully
        '401':
          description: Unauthorized - missing or invalid bearer token
        '403':
          description: Invitation expired or does not belong to the current user
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                INVITATION_NOT_FOR_CURRENT_USER:
                  summary: "1009 - invitation not for current user"
                  value:
                    status: 403
                    detail: "1009 - invitation not for current user"
                INVITATION_EXPIRED:
                  summary: "1010 - invitation expired"
                  value:
                    status: 403
                    detail: "1010 - invitation expired"
        '404':
          description: Invitation token not found
      x-functional-errors:
        - 1005
        - 1009
        - 1010
