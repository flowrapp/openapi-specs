manager:
  businesses:
    get:
      summary: Get manager business dashboard
      description: |
        Returns the manager's business dashboard with aggregate statistics. Includes the total
        number of businesses, total workers across all businesses, and a summary of each
        business with its worker count. When businessId is provided, it must identify a business
        managed by the authenticated user; the response also includes its home view. All home
        dates and hourly samples use the business's IANA time zone.

        Home admin v3.2 (BFF 0.0.81, additive, optional fields on `ManagerBusinessHomeDTO`):
        - `workingNow.byJobRole`: fichados vs planificados ahora por puesto from
          `home.workingNow` + Main `getDailyAttendance(today)` grouped by `row.jobRole`
          (`working` = `clocked.open`, `scheduledNow` = `asOf` inside a planned segment, not the unpaid gap;
          `jobRole: null` group for UNMATCHED / no puesto). Not plantilla, contracts or
          P4a `memberCount`.
        - `attendanceToday.missing`: CRITICAL rows with chips `NO_SHOW` or `MISSING_CLOCK_IN`;
          `attendanceToday.upcoming` = `counts.upcoming`.
        - `teamHours.clockedSeconds` + `teamHours.plannedSeconds` from the same BFF
          `getAttendanceHours` totals (`totals.clockedSeconds` / `totals.plannedSeconds`).
          Since BFF 0.0.106 `clockedSeconds` is CONFIRMED + APPROVED only and
          `teamHours.pendingReviewSeconds` (`totals.pendingReviewSeconds`) is apart.
          Home «Horas semana» must use that pair; legacy `teamHours.totalSeconds` stays for
          compatibility and must not be mixed with `plannedSeconds`. `plannedSeconds` null =
          no published plan; `clockedSeconds` remains present for OWNER.
        - `attention`: `incidentCount` (= `counts.incidents`) and ≤3 first INCIDENTS rows;
          Recordar = existing `notifyAttendanceShiftClockIn`, Revisar = attendance detail.
        - `nextWeek`: ISO week after `date`, planning status or `NONE`, `gapCount` = people
          still missing, summed per cell as `max(max(minimum, target) - assigned, 0)`. It is
          deliberately different from Horario H5 `publishCoverageGaps`, which counts
          under-covered cells; not `shortfallSeconds`. Null `gapCount` when there is no
          planning to evaluate. Front copy expresses people, not ambiguous "huecos".
        Checklist: front-only; no backend field.

        Composition uses existing Main reads only (no Main change), bounded concurrency
        (`parZip`, `Semaphore(8)`), no team-wide sweeps and no in-memory filters over complete
        team collections. OWNER vs MANAGER: blocks that need attendance/day, attendance/hours
        or planning/coverage are filled only for OWNER (Main limits those reads); for MANAGER
        they are omitted or null. Composing never returns 403; privileges are not elevated and
        attendance data is never returned to MANAGER. The dashboard already admits MANAGER.
      tags:
        - Manager
      operationId: getManagerBusinessDashboard
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: query
          required: false
          description: Managed business to include in the home view; omit to retrieve only the business list and aggregate counts.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        '200':
          description: Dashboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerBusinessDashboardResponseDTO'
              examples:
                withoutBusinessId:
                  summary: Dashboard without a selected business
                  value:
                    totalBusinesses: 2
                    totalWorkers: 17
                    businesses:
                      - {id: 1, name: "Downtown Office", city: "New York", workerCount: 12}
                      - {id: 2, name: "Uptown Branch", city: "New York", workerCount: 5}
                withBusinessId:
                  summary: Dashboard with home for a managed business
                  value:
                    totalBusinesses: 2
                    totalWorkers: 17
                    businesses:
                      - {id: 1, name: "Downtown Office", city: "New York", workerCount: 12}
                      - {id: 2, name: "Uptown Branch", city: "New York", workerCount: 5}
                    home:
                      businessId: 1
                      zone: America/New_York
                      date: '2026-09-24'
                      asOf: '2026-09-24T10:30:00-04:00'
                      workingNow:
                        count: 2
                        workers:
                          - {userId: 11, name: "Alex Morgan", clockIn: '2026-09-24T08:30:00-04:00', avatarUrl: null}
                          - {userId: 12, name: "Jordan Lee", clockIn: '2026-09-24T09:00:00-04:00', avatarUrl: null}
                        byJobRole:
                          - {jobRole: {id: 10, name: "Sala", color: "#1A2B3C"}, working: 1, scheduledNow: 1}
                          - {jobRole: {id: 3, name: "Barra", color: "#4C9F70"}, working: 1, scheduledNow: 1}
                      attendanceToday:
                        count: 3
                        missing: 1
                        upcoming: 4
                        workers:
                          - {userId: 13, name: "Sam Rivera", firstClockIn: '2026-09-24T06:00:00-04:00', lastClockOut: '2026-09-24T08:00:00-04:00', totalSeconds: 7200, avatarUrl: null}
                          - {userId: 11, name: "Alex Morgan", firstClockIn: '2026-09-24T08:30:00-04:00', lastClockOut: null, totalSeconds: 7200, avatarUrl: null}
                          - {userId: 12, name: "Jordan Lee", firstClockIn: '2026-09-24T09:00:00-04:00', lastClockOut: null, totalSeconds: 5400, avatarUrl: null}
                      teamHours:
                        week: 2026-W39
                        totalSeconds: 99000
                        clockedSeconds: 95400
                        pendingReviewSeconds: 3600
                        plannedSeconds: 1764000
                        days:
                          - {date: '2026-09-21', totalSeconds: 28800}
                          - {date: '2026-09-22', totalSeconds: 32400}
                          - {date: '2026-09-23', totalSeconds: 18000}
                          - {date: '2026-09-24', totalSeconds: 19800}
                          - {date: '2026-09-25', totalSeconds: 0}
                          - {date: '2026-09-26', totalSeconds: 0}
