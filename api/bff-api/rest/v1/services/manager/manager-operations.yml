  planning-scheduled-shifts:
    put:
      summary: Replace all shifts in a draft weekly planning
      description: >
        Atomically replaces every assignment in the existing DRAFT planning addressed by
        `planningId`. Send `version` from the latest manager planning response; a stale
        version returns 409 without replacing any shifts. An empty array clears the planning.
        Shift name and color come from the referenced business Shift, not the request.
        Optional `segments` make an assignment a split shift. Omit `segments`, or send an
        empty array, for a normal shift. A non-empty list has one or two segments, and
        `startAt` and `endAt` are the envelope and must match the first start and the last
        end. The
        unpaid gap is reserved: envelopes of the same person that intersect are `400`
        `1047`, including a shift placed inside that gap. Returns the updated manager
        planning projection with a new version and recalculated aggregates. Net seconds
        are the sum of the segment durations minus `breakMinutes`.
        Requires an OWNER membership.
      tags: [Manager]
      operationId: replaceManagerPlanningScheduledShifts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: planningId
          in: path
          required: true
          description: ID of the existing planning
          schema: {type: integer, format: int64, minimum: 1, example: 500}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/ManagerReplacePlanningScheduledShiftsRequestDTO'
            examples:
              continuous:
                summary: One continuous assignment
                value:
                  version: 3
                  scheduledShifts:
                    - userId: 42
                      jobRoleId: 7
                      shiftId: 20
                      startAt: "2026-10-05T09:00:00+02:00"
                      endAt: "2026-10-05T17:00:00+02:00"
                      breakMinutes: 30
              split:
                summary: Split shift, gap reserved
                value:
                  version: 4
                  scheduledShifts:
                    - userId: 42
                      jobRoleId: 7
                      shiftId: 22
                      startAt: "2026-10-05T10:00:00+02:00"
                      endAt: "2026-10-05T23:00:00+02:00"
                      breakMinutes: 30
                      segments:
                        - startAt: "2026-10-05T10:00:00+02:00"
                          endAt: "2026-10-05T14:00:00+02:00"
                        - startAt: "2026-10-05T18:00:00+02:00"
                          endAt: "2026-10-05T23:00:00+02:00"
      responses:
        '200':
          description: Draft planning assignments replaced
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerPlanningResponseDTO'
              example:
                id: 500
                version: 4
                businessId: 101
                week: "2026-W41"
                weekStart: "2026-10-05"
                weekEnd: "2026-10-11"
                status: DRAFT
                failureReason: null
                totals: {requiredSeconds: 0, scheduledSeconds: 27000, contractedSeconds: 0}
                requirements: []
                days:
                  - {date: "2026-10-05", requiredSeconds: 0, scheduledSeconds: 27000}
                workers:
                  - userId: 42
                    avatarUrl: null
                    name: Alex Rivera
                    contractedSeconds: 0
                    scheduledSeconds: 27000
                    days:
                      - date: "2026-10-05"
                        scheduledSeconds: 27000
                        assignments:
                          - id: 900
                            jobRoleId: 7
                            jobRole: {id: 7, code: WAITER, name: Waiter, color: "#1A2B3C", icon: front-of-house, active: true}
                            shiftId: 20
                            shiftName: Morning service
                            shiftColor: "#1A2B3C"
                            startAt: "2026-10-05T09:00:00+02:00"
                            endAt: "2026-10-05T17:00:00+02:00"
                            breakMinutes: 30
                            durationSeconds: 27000
                createdAt: "2026-10-04T08:00:00+02:00"
                publishedAt: null
                hasCoverageWarnings: false
        '400':
          description: Invalid planning or scheduled shift
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                invalidPlanning:
                  value: {status: 400, detail: "1045 - planning is invalid"}
                invalidShift:
                  value: {status: 400, detail: "1047 - scheduled shift is invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business, planning or referenced job role not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  value: {status: 404, detail: "1006 - business does not exist"}
                planningNotFound:
                  value: {status: 404, detail: "1046 - planning not found"}
                jobRoleNotFound:
                  value: {status: 404, detail: "1034 - job role not found"}
        '409':
          description: Planning is not editable or has been modified concurrently
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notEditable:
                  value: {status: 409, detail: "1096 - planning scheduled shifts can only be replaced while the planning is in DRAFT"}
                staleVersion:
                  value: {status: 409, detail: "1049 - resource was modified concurrently"}

  publish-planning:
    put:
      summary: Publish a weekly business planning
      description: >
        Publishes the existing planning addressed by its `planningId` within the requested
        business. Publication accepts a DRAFT planning, manual or solver-generated, and is idempotent:
        publishing an already PUBLISHED planning returns it unchanged. A missing or cross-business
        planning is never generated and returns 404; a non-publishable state returns 409. Requires
        an OWNER membership.
      tags: [Manager]
      operationId: publishManagerPlanning
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: planningId
          in: path
          required: true
          description: ID of the existing planning
          schema: {type: integer, format: int64, minimum: 1, example: 500}
      responses:
        '200':
          description: Planning published or already published
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerPlanningResponseDTO'
              example:
                id: 500
                version: 4
                businessId: 101
                week: "2025-W31"
                weekStart: "2025-07-28"
                weekEnd: "2025-08-03"
                status: PUBLISHED
                failureReason: null
                totals: {requiredSeconds: 28800, scheduledSeconds: 28800, contractedSeconds: 144000}
                requirements: []
                days: []
                workers: []
                createdAt: "2025-07-27T08:00:00+02:00"
                publishedAt: "2025-07-27T12:00:00+02:00"
                hasCoverageWarnings: false
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business or planning ID not found in the requested business; no planning is created
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1046 - planning not found"}
        '409':
          description: Planning is not publishable
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 409, detail: "1048 - planning is not ready to publish"}

  schedule-exceptions:
    get:
      summary: List schedule exceptions
      description: Returns exceptions in the inclusive business-local `from` and `to` date range, ordered by date ascending. Requires an OWNER membership.
      tags: [Manager]
      operationId: getManagerScheduleExceptions
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: from
          in: query
          required: true
          description: Inclusive first date
          schema: {type: string, format: date, example: "2025-08-01"}
        - name: to
          in: query
          required: true
          description: Inclusive last date; must not precede from
          schema: {type: string, format: date, example: "2025-08-31"}
      responses:
        '200':
          description: Schedule exceptions retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/manager/components.yml#/components/schemas/ManagerScheduleExceptionResponseDTO'
        '400':
          description: Invalid inclusive date range
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1053 - schedule exception is invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}

    post:
      summary: Create a schedule exception
      description: >
        Creates a complete configuration for one immutable business-local date. Requires an
        OWNER membership. Existing daily-shift references to an archived (inactive) business
        Shift of this business may be kept; a new reference to an inactive Shift is rejected
        (404 1061). Existing role demands that already referenced an inactive job role of this
        business may be kept; a new demand for an inactive job role is rejected (404 1034).
      tags: [Manager]
      operationId: createManagerScheduleException
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/ManagerScheduleExceptionRequestDTO'
            example:
              date: "2025-08-15"
              configuration:
                openingIntervals:
                  - startTime: "09:00"
                    endTime: "17:00"
                shifts:
                  - shiftId: 20
                    startTime: "09:00"
                    endTime: "12:00"
                    breakMinutes: 0
                    demands: []
                  - shiftId: 20
                    startTime: "13:00"
                    endTime: "17:00"
                    breakMinutes: 0
                    demands: []
      responses:
        '201':
          description: Schedule exception created
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerScheduleExceptionResponseDTO'
        '400':
          description: Invalid schedule-exception configuration
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1053 - schedule exception is invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}
        '409':
          description: >
            An exception already exists for the date (1054), or an opening interval that crosses
            midnight would collide with the opening of the adjacent day (1055). Main API error passed
            through unchanged.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                alreadyExists:
                  summary: "1054 - schedule exception already exists for date"
                  value: {status: 409, detail: "1054 - schedule exception already exists for date"}
                adjacentDayOverlap:
                  summary: "1055 - schedule exception overlaps an adjacent effective configuration"
                  value: {status: 409, detail: "1055 - schedule exception overlaps an adjacent effective configuration"}

  schedule-exception-item:
    put:
      summary: Replace a schedule exception configuration
      description: >
        Atomically replaces the complete exception configuration by `exceptionId`. The request
        has no date field, so the stored date remains immutable. Requires an OWNER membership.
        Existing daily-shift references to an archived (inactive) business Shift of this business
        may be kept; a new reference to an inactive Shift is rejected (404 1061). Existing role
        demands that already referenced an inactive job role of this business may be kept; a new
        demand for an inactive job role is rejected (404 1034).
      tags: [Manager]
      operationId: replaceManagerScheduleException
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: exceptionId
          in: path
          required: true
          description: ID of the schedule exception
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        description: Configuration only; the stored exception date cannot be changed.
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/ManagerDailyConfigurationRequestDTO'
            example:
              openingIntervals:
                - startTime: "10:00"
                  endTime: "18:00"
              shifts:
                - shiftId: 20
                  startTime: "10:00"
                  endTime: "18:00"
                  breakMinutes: 30
                  demands:
                    - jobRoleId: 10
                      minimumEmployees: 1
                      targetEmployees: 2
                      maximumEmployees: 3
      responses:
        '200':
          description: Exception configuration replaced with its original date
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerScheduleExceptionResponseDTO'
        '400':
          description: Invalid replacement configuration
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1053 - schedule exception is invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business or exception not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1056 - schedule exception not found"}
        '409':
          description: Replacement conflicts with an adjacent effective configuration
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 409, detail: "1055 - schedule exception overlaps an adjacent effective configuration"}

    delete:
      summary: Delete a schedule exception
      description: Deletes a schedule exception by `exceptionId`. Requires an OWNER membership.
      tags: [Manager]
      operationId: deleteManagerScheduleException
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: exceptionId
          in: path
          required: true
          description: ID of the schedule exception
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '204':
          description: Schedule exception deleted
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business or exception not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1056 - schedule exception not found"}
        '409':
          description: >
            Removing the exception would make an opening interval that crosses midnight collide with
            the opening of the adjacent day once the recurring schedule applies again (1055). Main API
            error passed through unchanged.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 409, detail: "1055 - schedule exception overlaps an adjacent effective configuration"}
