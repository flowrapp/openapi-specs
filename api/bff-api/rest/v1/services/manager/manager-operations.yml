  planning:
    get:
      summary: Get a weekly business planning
      description: >
        Returns the existing planning for the requested ISO week. The response shape is stable
        for CREATED, SOLVING, DRAFT, PUBLISHED, ARCHIVED, and FAILED; DRAFT is editable whether
        created manually or by the solver, and ARCHIVED is historical and read-only. Manually
        created drafts have no requirements. This operation never generates a missing planning.
        Required seconds use the net of each shift: the sum of its planned segment
        durations (the envelope when `segments` is omitted; an end not later than its
        start rolls into the next calendar day) minus `breakMinutes`, multiplied by
        target employee demand. The unpaid gap is not included. Scheduled seconds use
        that same net. Contracted seconds sum
        `totalWeekHours * 3600 * coveredCalendarDays / 7` per intersecting contract at full
        precision, then round once per worker; planning totals are sums of the daily and worker
        totals. Workers are the union of users with intersecting contracts and users with
        assignments. Names come from business users and role metadata comes from the current job
        role catalog with inactive roles included. Optional `employeeId` restricts contracts,
        assignments, workers, and their scheduled/contracted aggregates to one employee while
        preserving global requirements and required seconds. Optional `jobRoleId` restricts
        demands, contracts, assignments, workers, and all recalculated aggregates to one role;
        both filters are combined with AND. A valid identifier with no matching data returns `200`
        with an empty filtered projection, preserving global required seconds for an employee-only
        miss and returning zero required seconds when a job-role filter has no matching demand.
        For example, a 22:00-02:00 shift with a 30-minute break has 12,600 net seconds and
        requires 25,200 seconds at target demand 2; an offset assignment for that shift has 12,600
        scheduled seconds. A worker with 20-hour and 30-hour consecutive contracts covering three
        and four calendar days contributes `(20 * 3600 * 3 / 7) + (30 * 3600 * 4 / 7) =
        92,571.428...` seconds and is reported as 92,571 after one final rounding. Requires an
        OWNER membership.
      tags: [Manager]
      operationId: getManagerPlanning
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: week
          in: query
          required: true
          description: ISO week identifier in YYYY-Www format
          schema:
            type: string
            pattern: '^\d{4}-W\d{2}$'
            example: "2025-W31"
        - name: employeeId
          in: query
          required: false
          description: Restrict the planning projection to one employee; positive identifiers with no match return an empty filtered projection
          schema: {type: integer, format: int64, minimum: 1, example: 3}
        - name: jobRoleId
          in: query
          required: false
          description: Restrict the planning projection to one job role and its demands; positive identifiers with no match return an empty filtered projection
          schema: {type: integer, format: int64, minimum: 1, example: 10}
      responses:
        '200':
          description: Weekly planning retrieved
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerPlanningResponseDTO'
              examples:
                created:
                  summary: Created planning awaiting solver submission
                  value:
                    id: 500
                    version: 0
                    businessId: 101
                    week: "2025-W31"
                    weekStart: "2025-07-28"
                    weekEnd: "2025-08-03"
                    status: CREATED
                    failureReason: null
                    totals: {requiredSeconds: 0, scheduledSeconds: 0, contractedSeconds: 0}
                    requirements: []
                    days: []
                    workers: []
                    createdAt: "2025-07-27T08:00:00+02:00"
                    publishedAt: null
                    hasCoverageWarnings: false
                solving:
                  summary: Solving planning with an overnight requirement and contract/assignment union
                  value:
                    id: 500
                    version: 1
                    businessId: 101
                    week: "2025-W31"
                    weekStart: "2025-07-28"
                    weekEnd: "2025-08-03"
