                        - {at: '2026-09-24T22:00:00-04:00', workerCount: 0}
                        - {at: '2026-09-24T23:00:00-04:00', workerCount: 0}
                      attention:
                        incidentCount: 4
                        rows:
                          - attendanceMatchId: null
                            avatarUrl: null
