              example: {status: 404, detail: "1061 - shift not found"}

  job-roles:
    get:
      summary: List business job roles
      description: >
        Returns a deterministic slice of job roles. An optional `name` filter matches a trimmed,
        case-insensitive partial name using the main API's PostgreSQL `ILIKE` semantics; missing,
        empty, and blank values are ignored. `active=true` returns only active roles,
        `active=false` returns only inactive roles, and an omitted `active` returns both states.
        Name and active filters are applied before results are ordered by active state descending,
        name ascending, and ID ascending. Requires an OWNER membership.
        Each `content` item is a `ManagerJobRoleListItemDTO`: the same fields as
        `ManagerJobRoleResponseDTO` plus required `memberCount`, forwarded from Main
        `getBusinessJobRoles` (distinct active non-ADMIN members with a current contract on that
        role for the business-local today). The BFF does not call a count endpoint nor compose
        counts; any Main error fails the whole list (no invented zeros). POST/PUT keep
        `ManagerJobRoleResponseDTO` and do not return `memberCount`. Order, `page`/`size`/
        `hasNext`, and `name`/`active` filters are unchanged.
      tags: [Manager]
      operationId: getManagerJobRoles
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: name
          in: query
          required: false
          description: Trimmed, case-insensitive partial name filter; blank values are ignored
          schema:
            type: string
            maxLength: 100
            example: cook
        - name: active
          in: query
          required: false
          description: Filter by active state; omit to include both active and inactive roles
          schema:
            type: boolean
            example: true
        - $ref: '../../components/manager/components.yml#/components/parameters/Page'
        - $ref: '../../components/manager/components.yml#/components/parameters/Size'
      responses:
        '200':
          description: Job-role slice retrieved
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerJobRoleSliceResponseDTO'
              example:
                content:
                  - id: 10
                    businessId: 101
                    code: WAITER
                    name: Waiter
                    description: Front of house service
                    color: "#1A2B3C"
                    icon: front-of-house
                    active: true
                    createdAt: "2025-06-01T10:00:00+00:00"
                    updatedAt: "2025-06-01T10:00:00+00:00"
                    memberCount: 3
                  - id: 11
                    businessId: 101
                    code: HOST
                    name: Waiter
                    description: Inactive front of house role
                    color: "#808080"
                    icon: briefcase
                    active: false
                    createdAt: "2025-06-02T10:00:00+00:00"
                    updatedAt: "2025-06-02T10:00:00+00:00"
                    memberCount: 0
                page: 0
                size: 20
                hasNext: false
        '400':
          description: Invalid page or size
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}

