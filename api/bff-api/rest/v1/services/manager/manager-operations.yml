    put:
      summary: Create or replace planning generation settings
      description: >
        Creates or completely replaces the business-local weekday and minute used to generate the
        next weekly planning. Requires an OWNER membership and is idempotent.
      tags: [Manager]
      operationId: replaceManagerPlanningGenerationSettings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/ManagerPlanningGenerationSettingsDTO'
