                        gapCount: 1
        '400':
          description: Invalid businessId
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: User does not manage the requested business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '404':
          description: Requested business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'

  business-profile:
    put:
      summary: Update manager business profile
      description: >
        Replaces the editable profile fields of a business. Only the authenticated business owner
        may update the tax identifier, name, address, town, city, country, and postal code.
      tags:
        - Manager
      operationId: updateManagerBusinessProfile
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Complete replacement of the editable business profile
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/ManagerBusinessProfileUpdateRequestDTO'
            example:
              nif: B12345678
              name: Coffee Time
              address: C/Sin nombre 453
              town: Barbate
              city: Cádiz
              country: España
              postalCode: '11160'
      responses:
        '204':
          description: Business profile updated successfully
        '400':
          description: Business profile values are invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1093 - business profile is invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}

  business-geofence:
    put:
      summary: Update manager business geofence
      description: >
        Replaces the business geofence center and radius. Only the authenticated business owner
        may update the latitude, longitude, and area.
      tags:
        - Manager
      operationId: updateManagerBusinessGeofence
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Complete replacement of the business geofence
        content:
          application/json:
            schema:
              $ref: '../../components/common/components.yml#/components/schemas/LocationDTO'
            example:
              latitude: 36.19
              longitude: -5.99
              area: 50.0
      responses:
        '204':
          description: Business geofence updated successfully
        '400':
          description: Geofence values are invalid
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1094 - business geofence is invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}

  workers:
    get:
      summary: Get business workers
      description: >
        Returns business memberships for the authenticated user's business. `totalWorkers` is
        the number of returned memberships after the optional role and search filters, including
        owners and managers when selected. Search is a case-insensitive literal substring of the
        worker's name, username, or email; surrounding whitespace is trimmed, blank values disable
        search, and role and search are combined with AND. Results preserve name-then-user-ID
        ordering from the main API.
      tags:
        - Manager
      operationId: getManagerBusinessWorkers
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: role
          in: query
          required: false
          description: Filter users by business membership role
          schema:
            type: string
            enum: [OWNER, EMPLOYEE]
        - name: search
          in: query
          required: false
          description: >
            Optional case-insensitive literal substring matched against the worker's name, username,
            or email. Surrounding whitespace is trimmed; empty or whitespace-only values are
            treated as absent. Percent and underscore are matched literally. Combined with role
            using AND; the identity fields are combined using OR. Ordering from the main API is
            preserved: name ignoring case, then user ID ascending.
          schema:
            type: string
      responses:
        '200':
          description: Workers list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerWorkersResponseDTO'
              example:
                totalWorkers: 3
                workers:
                  - userId: 1
                    avatarUrl: null
                    name: "John Doe"
                    email: "john.doe@example.com"
                    role: "OWNER"
                    currentContract: null
                  - userId: 2
                    avatarUrl: null
                    name: "Jane Smith"
                    email: "jane.smith@example.com"
                    role: "EMPLOYEE"
                    currentContract: null
                  - userId: 3
                    avatarUrl: null
                    name: "Bob Wilson"
                    email: "bob.wilson@example.com"
                    role: "EMPLOYEE"
                    currentContract:
                      id: 123
                      userId: 3
                      businessId: 101
                      jobRoleId: 10
                      jobRole:
                        id: 10
                        code: WAITER
                        name: Waiter
                        color: "#1A2B3C"
                        icon: front-of-house
                        active: true
                      totalWeekHours: 40.0
                      startDate: "2025-01-01"
                      endDate: null
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a manager of this business
        '404':
          description: Business not found

  history-day:
    get:
      summary: Get manager day history
      description: >
        Returns all workers' sessions for a specific day in a business. Shows each worker's
        individual clock-in/clock-out sessions and their daily total. Since BFF 0.0.107 the day and
        worker totals count only CONFIRMED + APPROVED (as `history/week` and `history/month`), with
        `pendingSeconds` apart («+X h pendientes») and REJECTED in neither. The BFF computes them from
        the review status of the sessions it already reads (`getWorklogs`); the sessions are unchanged.
      tags:
        - Manager
      operationId: getManagerDayHistory
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          required: false
          description: Date to view (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
            format: date
            example: "2025-03-10"
      responses:
        '200':
          description: Day history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerDayHistoryResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a manager of this business
        '404':
          description: Business not found

  history-week:
    get:
      summary: Get manager week history
      description: >
        Returns a weekly summary for a business, broken down by day with per-worker totals
        for each day. Use the day history endpoint for session-level detail. Totals: Main
        `getBusinessReports` without `reviewStatus` (CONFIRMED + APPROVED). Since BFF 0.0.107 a second
        `getBusinessReports` with `reviewStatus=PENDING_REVIEW&reviewStatus=PENDING_RECONCILIATION`, run
        in parallel, gives the optional `pendingSeconds`; when it fails they are omitted and the totals
        are still returned.
      tags:
        - Manager
      operationId: getManagerWeekHistory
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: week
          in: query
          required: false
          description: ISO 8601 week (YYYY-Www). Defaults to current week.
          schema:
            type: string
            pattern: '^\d{4}-W\d{2}$'
            example: "2025-W31"
      responses:
        '200':
          description: Week history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerWeekHistoryResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a manager of this business
        '404':
          description: Business not found

  history-month:
    get:
      summary: Get manager month history
      description: >
        Returns a monthly calendar view for a business with day-level totals and worker counts.
        No session-level detail. Use the day history endpoint to drill into a specific day. Totals and
        the optional `pendingSeconds` (BFF 0.0.107) follow the same two `getBusinessReports` reads as
        the week history.
      tags:
        - Manager
      operationId: getManagerMonthHistory
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: month
          in: query
          required: false
          description: Year and month (YYYY-MM). Defaults to current month.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: "2025-03"
      responses:
        '200':
          description: Month history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerMonthHistoryResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a manager of this business
        '404':
          description: Business not found

  edit-worklog:
    put:
      summary: Edit a worklog
      description: >
        Updates the clock-in and/or clock-out times of an existing worklog. This is an owner-only
        operation for correcting worker time entries: only the OWNER of the business may call it and a MANAGER receives 403.
      tags:
        - Manager
      operationId: managerUpdateWorklog
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog to update
          schema:
            type: integer
            format: int64
      requestBody:
        description: Updated clock-in and/or clock-out times
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/WorklogUpdateRequestDTO'
      responses:
        '200':
          description: Worklog updated successfully
          content:
            application/json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/SessionDTO'
        '400':
          description: Invalid request (e.g., clock-out before clock-in)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not the owner of this business (a MANAGER receives 403 too)
        '404':
          description: Worklog not found

  invitations:
    post:
      summary: Create a business invitation
      description: >
        Creates a new invitation for a person to join a business with a specified role
        and an optional proposed contract. Without a contract, acceptance creates a
        40-hour GENERAL job contract. Requires `TEAM_INVITE`. An optional
        `identityDocument` may be sent only by the OWNER; a non-owner who sends one
        receives 403 1020. The response does not include the document. It is deleted
        as soon as the invitation expires, with no retention period.
        Pass-through to the main API.
      tags:
        - Manager
      operationId: managerCreateInvitation
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
      requestBody:
        description: Invitation details
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/InvitationRequestDTO'
            example:
              email: "newworker@example.com"
              role: "EMPLOYEE"
              contract:
                jobRoleId: 10
                totalWeekHours: 30.0
                startDate: "2026-10-01"
                endDate: null
      responses:
        '201':
          description: Invitation created successfully
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/InvitationResponseDTO'
              example:
                id: 123
                hasIdentityDocument: false
                email: "newworker@example.com"
                role: "EMPLOYEE"
                contract:
                  jobRoleId: 10
                  totalWeekHours: 30.0
                  startDate: "2026-10-01"
                  endDate: null
                status: "PENDING"
                createdAt: "2026-09-26T14:30:00+00:00"
                expiresAt: "2026-10-03T14:30:00+00:00"
        '400':
          description: >
            Invalid request, or an identity document that fails format (1158) or
            check letter (1159). The number is not included.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                invalidFormat:
                  summary: "1158 - identity document format is invalid"
                  value:
                    status: 400
                    detail: "1158 - identity document format is invalid"
                invalidLetter:
                  summary: "1159 - identity document check letter is invalid"
                  value:
                    status: 400
                    detail: "1159 - identity document check letter is invalid"
        '401':
          description: Unauthorized
        '403':
          description: >
            The caller lacks `TEAM_INVITE` (1020), or is not the owner and sent
            an identity document (1020).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                notOwner:
                  summary: "1020 - user is not the owner of business"
                  value:
                    status: 403
                    detail: "1020 - user is not the owner of business"
                lacksInvite:
                  summary: "1020 - user lacks permission TEAM_INVITE in business"
                  value:
                    status: 403
                    detail: "1020 - user lacks permission TEAM_INVITE in business"
        '404':
          description: Business not found (1006)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                businessNotFound:
                  summary: "1006 - business does not exist"
                  value:
                    status: 404
                    detail: "1006 - business does not exist"
        '409':
          description: >
            The user is already a member (1007), already invited (1008), or the
            identity document is already used in this business (1160).
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                alreadyMember:
                  summary: "1007 - user already member of business"
                  value:
                    status: 409
                    detail: "1007 - user already member of business"
                alreadyInvited:
                  summary: "1008 - user is already invited to this business"
                  value:
                    status: 409
                    detail: "1008 - user is already invited to this business"
                documentInUse:
                  summary: "1160 - identity document is already used in this business"
                  value:
                    status: 409
                    detail: "1160 - identity document is already used in this business"
      x-functional-errors: [1006, 1007, 1008, 1020, 1158, 1159, 1160]

    get:
      summary: List business invitations
      description: >
        Returns the list of invitations for a specific business, optionally filtered by status.
        Requires an OWNER membership in the business.
      tags:
        - Manager
      operationId: managerGetBusinessInvitations
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: Filter invitations by status
          schema:
            type: string
            enum: [PENDING, ACCEPTED, DECLINED, EXPIRED]
      responses:
        '200':
          description: Invitations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/manager/components.yml#/components/schemas/InvitationResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not an owner of this business
        '404':
          description: Business not found

  delete-invitation:
    delete:
      summary: Delete a business invitation
      description: >
        Deletes an existing invitation to join a business. Requires an OWNER membership in the
        business. Pass-through to the main API.
      tags:
        - Manager
      operationId: managerDeleteInvitation
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: invitationId
          in: path
          required: true
