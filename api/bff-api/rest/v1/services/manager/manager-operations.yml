        '403':
          description: Forbidden - User is not an owner of this business
        '404':
          description: Business or invitation not found

  resend-invitation:
    post:
      summary: Resend a business invitation
      description: >
        Resends an existing invitation of the business and reactivates it, so the invitee
        receives the invitation email again. Requires an OWNER membership in the business; a
        MANAGER or EMPLOYEE receives 403 (1020). A business that does not exist returns 404
        (1006); an invitation that does not exist or belongs to another business returns 404
        (1005).
        An invitation can be resent when its stored status is PENDING (whether or not its
        expiresAt has already passed) or EXPIRED. The Main API reactivates the same
        invitation: status becomes PENDING again and expiresAt becomes the moment of the
        resend plus seven days. No new invitation is created; id, token, invitee email, role,
        contract, createdAt and every other field are preserved, so the invitation token is
        the same one sent originally. The email is sent asynchronously: the Main API publishes
        again, through the outbox, the existing invitation creation event.
        An invitation in a terminal status (ACCEPTED or DECLINED) cannot be resent and returns
        403 (1013). There is no request body.
        Each invitation can be resent at most once every 10 minutes; the Main API records each
        resend and checks the cooldown after the owner, invitation and status checks. If the
        same invitation was resent less than 10 minutes ago, the response is 429 (1141) with a
        `Retry-After` header: the whole seconds until the next resend is allowed, rounded up
        and at least 1. The cooldown is per invitation, not per user, business or caller. The
        email sent when the invitation is created does not count, so the first resend is always
        accepted, and exactly 10 minutes after the previous resend a new one is accepted. If
        several resends of the same invitation arrive at the same time, only one is accepted
        and the others receive 429 (1141). A 429 does not change the invitation and does not
        publish the email. Pass-through to the main API (resendBusinessInvitation); status,
        body, functional errors and the `Retry-After` header of the 429 are forwarded
        unchanged.
      tags:
        - Manager
      operationId: managerResendInvitation
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: invitationId
          in: path
          required: true
          description: ID of the invitation to resend
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: >
            Invitation reactivated and resent; status is PENDING and expiresAt is seven days
            from the resend. The email is sent asynchronously.
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/InvitationResponseDTO'
              example:
                id: 123
                hasIdentityDocument: false
                email: "newworker@example.com"
                role: "EMPLOYEE"
                contract:
                  jobRoleId: 10
                  totalWeekHours: 30.0
                  startDate: "2026-10-01"
                  endDate: null
                status: "PENDING"
                createdAt: "2026-09-26T14:30:00+00:00"
                expiresAt: "2026-10-12T09:00:00+00:00"
        '401':
          description: Unauthorized
        '403':
          description: >
            User is not an owner of this business (1020), or the invitation is in a terminal
            status, ACCEPTED or DECLINED, and cannot be resent (1013)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                USER_NOT_OWNER_OF_BUSINESS:
                  summary: "1020 - user is not the owner of business"
                  value: {status: 403, detail: "1020 - user is not the owner of business"}
                INVITATION_NOT_PENDING:
                  summary: "1013 - invitation not pending"
                  value: {status: 403, detail: "1013 - invitation not pending"}
        '404':
          description: Business or invitation not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                BUSINESS_NOT_FOUND:
                  summary: "1006 - business does not exist"
                  value: {status: 404, detail: "1006 - business does not exist"}
                INVITATION_NOT_FOUND:
                  summary: "1005 - invitation not found"
                  value: {status: 404, detail: "1005 - invitation not found"}
        '429':
          description: >
            The same invitation was resent less than 10 minutes ago (1141). The invitation is not
            changed and no email is published.
          headers:
            Retry-After:
              description: >
                Whole seconds until the next resend of this invitation is allowed, rounded up,
                forwarded from the Main API
              schema: {type: integer, minimum: 1, example: 420}
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                INVITATION_RESENT_TOO_RECENTLY:
                  summary: "1141 - invitation was resent too recently"
                  value: {status: 429, detail: "1141 - invitation was resent too recently"}
      x-functional-errors: [1005, 1006, 1013, 1020, 1141]

  export-worked-hours-report:
    get:
      summary: Download the worked hours report as PDF or CSV
      description: >
        Downloads, in the response body, the worked-hours report of the selected people of the business for the
        requested period, as one PDF document or one CSV file (type). Forwards from, to, periodType, type and
        userIds to the Main API exportBusinessWorkedHoursReportPdf and returns its file, media type and
        Content-Disposition unchanged. No email, nothing stored, no server cache.
        Authorization: REPORTS_EXPORT (see the API description), not only the OWNER: 403 (1020, `user lacks
        permission REPORTS_EXPORT in business`) without it; 403 (1104) for an EMPLOYEE without a contract in force.
        People: omit userIds for the whole business (members active at some point of the period: joined on or
        before its last day and not removed before its first day); with userIds, current or former members (an id
        without a membership row returns 400 1101), at most 50 distinct ids (400 1111). Several people produce one
        single PDF (a section per person and a centre summary page) or one CSV, never a ZIP.
        The owner reports screen calls it with periodType=MONTH, from the first and to the last day of the month,
        for the PDF viewer and the CSV of each month row of getManagerHoursMonths. A month in progress is accepted
        and truncated to today (provisional: the PDF says so and the filename carries the date). For the custom
        date range export («Exportar fechas») it calls it with periodType=RANGE and the from and to shown by
        getManagerHoursRange. When periodType is omitted the request behaves as RANGE.
        Date rules (Main API, business time zone), in this order: from after to or after today: 400 (1025);
        from and to do not match periodType: 400 (1114); only for periodType=RANGE (the custom date range), a to
        after today: 400 (1166), so a RANGE is never truncated (MONTH and YEAR in progress are still accepted and
        truncated to today, never 1166); from before the first day of the 48-month window of getManagerHoursMonths: 400
        (1165), for every periodType; more inclusive days than the cap of the format, PDF 366 and CSV 1461: 400
        (1164). The BFF forwards these codes unchanged.
        Timeout: the BFF waits up to 60 seconds for the Main API file on this operation only (read timeout); the
        other BFF calls keep their default timeouts.
        Totals include only closed CONFIRMED and APPROVED worklogs; pending ones are listed apart (annex B of the
        PDF, CSV rows with «Cuenta en el total» = No); REJECTED and open worklogs count nowhere. See
        WorkedHoursReportTypeDTO for the CSV columns and format.
        Rate limit: 6 downloads per minute and 30 per hour per authenticated user and business, PDF and CSV
        together, in a bucket of its own (not shared with the email request or the month list). 429 without a
        functional code; the app shows «Demasiadas descargas. Vuelve a intentarlo en un momento.».
        The app downloads the binary and may rely on the status code only.
      tags:
        - Manager
      operationId: exportManagerWorkedHoursReportPdf
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: true
          description: Start date of the report range, inclusive (format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-01"
        - name: to
          in: query
          required: true
          description: End date of the report range, inclusive (format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-31"
        - name: periodType
          in: query
          required: false
          description: Period type of the report, forwarded to the main API. Omit it for RANGE. MONTH requires from and to to cover exactly one calendar month and YEAR exactly one calendar year.
          schema:
            $ref: '../../components/reports/components.yml#/components/schemas/WorkedHoursReportPeriodTypeDTO'
        - name: type
          in: query
          required: false
          description: Output format, PDF (default) or CSV, forwarded to the main API. See WorkedHoursReportTypeDTO.
          schema:
            $ref: '../../components/reports/components.yml#/components/schemas/WorkedHoursReportTypeDTO'
        - name: userIds
          in: query
          required: false
          description: People to include, current or former members of this business. Omit or leave empty for the whole business. Repeat the parameter for several ids (userIds=12&userIds=34). At most 50 distinct ids.
          style: form
          explode: true
          allowEmptyValue: true
          schema:
            type: array
            maxItems: 50
            items:
              type: integer
              format: int64
            example: [12, 34]
      responses:
        '200':
          description: Report generated. The media type and the filename extension match type.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: >
                Forwarded from the Main API: `attachment; filename="registro-jornada-<period>-<scope>.<pdf|csv>"`.
                period is `YYYY-MM` for MONTH (`YYYY` for YEAR, `<from>-<to>` for RANGE), followed by
                `-hasta-<YYYY-MM-DD>` when a MONTH or YEAR is truncated to today (never for RANGE); scope is `todo-el-negocio`, the person's
                name in ASCII lowercase with dashes (`persona-<id>` without a name) or `<N>-personas`. Examples:
                `registro-jornada-2026-10-todo-el-negocio.pdf`, `registro-jornada-2026-10-lucia-ruiz.csv`,
                `registro-jornada-2026-11-hasta-2026-11-12-3-personas.pdf`.
              schema:
                type: string
                example: 'attachment; filename="registro-jornada-2026-10-todo-el-negocio.pdf"'
        '400':
          description: Invalid date range or from after today (1025), period type mismatch (1114), RANGE ending after today (1166), from before the 48-month window (1165), more days than the cap of the format (1164), report type (1103), an id without membership in the business (1101) or more than 50 userIds (1111)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                periodType:
                  summary: "1114 - from and to do not match periodType"
                  value: {status: 400, detail: "1114 - from and to do not match periodType"}
                rangeInFuture:
                  summary: "1166 - report range ends after today"
                  value: {status: 400, detail: "1166 - report range ends after today"}
                rangeOutOfWindow:
                  summary: "1165 - report range starts before the 48-month window"
                  value: {status: 400, detail: "1165 - report range starts before the 48-month window"}
                rangeTooLong:
                  summary: "1164 - report range is longer than the maximum for this format"
                  value: {status: 400, detail: "1164 - report range is longer than the maximum for this format"}
                userIds:
                  summary: "1111 - userIds must contain between 1 and 50 identifiers"
                  value: {status: 400, detail: "1111 - userIds must contain between 1 and 50 identifiers"}
        '401':
          description: Unauthorized
        '403':
          description: The caller lacks REPORTS_EXPORT in the business, or is an EMPLOYEE without a contract in force
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user lacks permission REPORTS_EXPORT in business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}
        '429':
          description: More than 6 downloads in a minute or 30 in an hour from this user for this business (PDF and CSV together). Retry later. No functional code; the body is the rate limiter's default problem.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {title: Too Many Requests, status: 429, detail: "Too many requests. Retry later."}
      x-functional-errors: [1006, 1020, 1025, 1101, 1103, 1104, 1111, 1114, 1164, 1165, 1166]

  hours-months:
    get:
      summary: List the monthly worked hours of the business for the owner reports screen
      description: >
        One page of the monthly worked-hours totals of the business, newest month first, for the owner reports
        screen (whole business, or one or several people). Forwards userIds, before and limit to the Main API
        getBusinessWorkedHoursMonths and adds `report` to each month, as getWorkerHoursMonths does for «Mis horas».
        Authorization: REPORTS_EXPORT, the permission of the download, so whoever sees a figure can open its PDF
        and CSV (403 1020 without it; 403 1104 for an EMPLOYEE without a contract in force). Every plan.
        Scope: omit userIds for the whole business (removed members included in the months they worked); with
        userIds, those people, current or former members (getManagerHoursPeople lists them), 400 (1101) for an id
        without a membership row, at most 50 distinct ids (400 1111). Figures are the sum over the people in scope,
        exactly as the PDF of the same month and userIds.
        Window: at most 48 months (4 years: the current month and the 47 before it), never before the first month
        of the scope: the earliest worklog of the business without userIds; with userIds, the earliest of each
        person's join date and first worklog (the «Mis horas» rule). oldestMonth carries the effective limit.
        Paging: cursor before (exclusive, YYYY-MM) and limit 1 to 12 (default 12); the app loads more with «Ver
        meses anteriores» sending nextBefore, which is null at the end. A before after the current month returns
        400 (1025); on or before oldestMonth, an empty page.
        Option B: confirmedSeconds is CONFIRMED + APPROVED and equals the PDF total; pendingSeconds is apart and
        always present; REJECTED and open worklogs count in neither.
        `archive` is reserved for the 4-year retention and not returned in this version.
        Rate limit: 20 requests per minute and 200 per hour per authenticated user and business, shared with
        getManagerHoursPeople, in a bucket of its own. 429 without a functional code.
        If the Main API call fails the request fails (5xx); no field is omitted or replaced by 0.
      tags:
        - Manager
      operationId: getManagerHoursMonths
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: userIds
          in: query
          required: false
          style: form
          explode: true
          description: People in scope, current or former members. Repeat the parameter for several ids (userIds=12&userIds=34). Omit it for the whole business. At most 50 distinct ids.
          schema:
            type: array
            uniqueItems: true
            maxItems: 50
            items:
              type: integer
              format: int64
              minimum: 1
            example: [12, 34]
        - name: before
          in: query
          required: false
          description: Exclusive upper bound (YYYY-MM). Omit it for the first page, which starts with the current month; then send the previous nextBefore. After the current month 400 (1025); on or before oldestMonth, an empty page.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: "2025-11"
        - name: limit
          in: query
          required: false
          description: Maximum number of months in the page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 12
            default: 12
            example: 12
      responses:
        '200':
          description: One page of monthly totals
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerHoursMonthsResponseDTO'
              example:
                zone: Europe/Madrid
                today: "2026-11-12"
                oldestMonth: "2025-03"
                months:
                  - month: "2026-11"
                    inProgress: true
                    confirmedSeconds: 4624200
                    pendingSeconds: 130500
                    pendingCount: 14
                    hasWorklogs: true
                    peopleCount: 8
                    report: {available: true, provisional: true, effectiveTo: "2026-11-12"}
                  - month: "2026-10"
                    inProgress: false
                    confirmedSeconds: 9734400
                    pendingSeconds: 0
                    pendingCount: 0
                    hasWorklogs: true
                    peopleCount: 8
                    report: {available: true, provisional: false, effectiveTo: "2026-10-31"}
                  - month: "2026-09"
                    inProgress: false
                    confirmedSeconds: 0
                    pendingSeconds: 0
                    pendingCount: 0
                    hasWorklogs: false
                    peopleCount: 0
                    report: {available: false, provisional: false, effectiveTo: "2026-09-30"}
                nextBefore: "2026-09"
        '400':
          description: Invalid before or limit (1 to 12) or before after the current month (1025), an id without membership in the business (1101), or more than 50 userIds (1111)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                before:
                  summary: "1025 - from date must be before or equal to to date"
                  value: {status: 400, detail: "1025 - from date must be before or equal to to date"}
                userIds:
                  summary: "1101 - report user IDs must belong to the business"
                  value: {status: 400, detail: "1101 - report user IDs must belong to the business"}
                tooManyUserIds:
                  summary: "1111 - userIds must contain between 1 and 50 identifiers"
                  value: {status: 400, detail: "1111 - userIds must contain between 1 and 50 identifiers"}
        '401':
          description: Unauthorized
        '403':
          description: The caller lacks REPORTS_EXPORT in the business, or is an EMPLOYEE without a contract in force
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                missingPermission:
                  summary: "1020 - user lacks permission REPORTS_EXPORT in business"
                  value: {status: 403, detail: "1020 - user lacks permission REPORTS_EXPORT in business"}
                noActiveContract:
                  summary: "1104 - employee has no active contract in this business"
                  value: {status: 403, detail: "1104 - employee has no active contract in this business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}
        '429':
          description: More than 20 requests in a minute or 200 in an hour from this user for this business (month list, range summary and people together). Retry later. No functional code.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {title: Too Many Requests, status: 429, detail: "Too many requests. Retry later."}
      x-functional-errors: [1006, 1020, 1025, 1101, 1104, 1111]

  hours-range:
    get:
      summary: Summarize the worked hours of a custom date range for the owner reports screen
      description: >
        Totals of the business for one custom date range (from and to, inclusive, business time zone), for the
        whole business or one or several people, with a breakdown by calendar month clipped to the range, for the
        «Exportar fechas» sheet of the owner reports screen. Forwards from, to and userIds to the Main API
        getBusinessWorkedHoursRange and adds `report` (which files the app offers for the range).
        Authorization: REPORTS_EXPORT, the permission of getManagerHoursMonths and of the download (403 1020; 403
        1104 for an EMPLOYEE without a contract in force). Every plan.
        Scope: exactly the people of exportManagerWorkedHoursReportPdf with periodType=RANGE and the same from, to
        and userIds: without userIds, members active at some point of the range (joined on or before to, not
        removed before from); with userIds, current or former members (400 1101 for an id without a membership
        row), at most 50 distinct ids (400 1111).
        Dates: from after to or after today, 400 (1025); to after today, 400 (1166): the app's calendar ends today;
        from before the first day of the 48-month window (oldestMonth of getManagerHoursMonths without userIds is
        never earlier), 400 (1165). No per-format cap here: `report` says whether the PDF (up to 366 days) and the
        CSV (up to 1461 days) can be downloaded, and the download answers 1164 beyond them.
        Option B: confirmedSeconds is CONFIRMED + APPROVED and equals the total of the RANGE PDF and CSV for the
        same dates and people; pendingSeconds is apart and always present; REJECTED and open worklogs count in
        neither. The months add up to the range figures (peopleCount is distinct per month).
        provisional is true when to is today: the app shows «Provisional» and «Ver informe hasta hoy».
        Rate limit: 20 requests per minute and 200 per hour per authenticated user and business, shared with
        getManagerHoursMonths and getManagerHoursPeople. 429 without a functional code.
        If the Main API call fails the request fails (5xx); no field is omitted or replaced by 0.
      tags:
        - Manager
      operationId: getManagerHoursRange
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: true
          description: First day of the range, inclusive (YYYY-MM-DD, business time zone)
          schema:
            type: string
            format: date
            example: "2026-09-15"
        - name: to
          in: query
          required: true
          description: Last day of the range, inclusive (YYYY-MM-DD, business time zone). Today at the latest (400 1166 otherwise).
          schema:
            type: string
            format: date
            example: "2026-11-14"
        - name: userIds
          in: query
          required: false
          style: form
          explode: true
          description: People in scope, current or former members. Repeat the parameter for several ids (userIds=12&userIds=34). Omit it for the whole business. At most 50 distinct ids.
          schema:
            type: array
            uniqueItems: true
            maxItems: 50
            items:
              type: integer
              format: int64
              minimum: 1
            example: [12, 34]
      responses:
        '200':
          description: Totals of the range, their breakdown by month and the files the app offers
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerHoursRangeResponseDTO'
              example:
                zone: Europe/Madrid
                today: "2026-11-14"
                from: "2026-09-15"
                to: "2026-11-14"
                effectiveTo: "2026-11-14"
                days: 61
                provisional: true
                confirmedSeconds: 10522800
                pendingSeconds: 138300
                pendingCount: 15
                hasWorklogs: true
                peopleCount: 8
                report: {pdfAvailable: true, csvAvailable: true}
                months:
                  - {month: "2026-09", from: "2026-09-15", to: "2026-09-30", inProgress: false, confirmedSeconds: 2408400, pendingSeconds: 0, pendingCount: 0, hasWorklogs: true, peopleCount: 7}
                  - {month: "2026-10", from: "2026-10-01", to: "2026-10-31", inProgress: false, confirmedSeconds: 5212800, pendingSeconds: 7800, pendingCount: 1, hasWorklogs: true, peopleCount: 8}
                  - {month: "2026-11", from: "2026-11-01", to: "2026-11-14", inProgress: true, confirmedSeconds: 2901600, pendingSeconds: 130500, pendingCount: 14, hasWorklogs: true, peopleCount: 8}
        '400':
          description: from after to or after today (1025), to after today (1166), from before the 48-month window (1165), an id without membership in the business (1101), or more than 50 userIds (1111)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
