      description: >
        Returns a deterministic slice of job roles. An optional `name` filter matches a trimmed,
        case-insensitive partial name using the main API's PostgreSQL `ILIKE` semantics; missing,
        empty, and blank values are ignored. `active=true` returns only active roles,
        `active=false` returns only inactive roles, and an omitted `active` returns both states.
        Name and active filters are applied before results are ordered by active state descending,
        name ascending, and ID ascending. Requires an OWNER membership.
      tags: [Manager]
      operationId: getManagerJobRoles
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: name
          in: query
          required: false
          description: Trimmed, case-insensitive partial name filter; blank values are ignored
          schema:
            type: string
            maxLength: 100
            example: cook
        - name: active
          in: query
          required: false
          description: Filter by active state; omit to include both active and inactive roles
          schema:
            type: boolean
            example: true
        - $ref: '../../components/manager/components.yml#/components/parameters/Page'
        - $ref: '../../components/manager/components.yml#/components/parameters/Size'
