  recurring-schedule:
    get:
      summary: Get the effective recurring schedule
      description: >
        Returns the complete recurring schedule effective on `effectiveOn` in the business-local
        time zone. The date defaults to the current business-local date. Requires an OWNER
        membership; absence is returned as 404 rather than an invented empty schedule.
      tags: [Manager]
      operationId: getManagerEffectiveRecurringSchedule
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: effectiveOn
          in: query
          required: false
          description: Business-local date on which the schedule must be effective; defaults to today
          schema:
            type: string
            format: date
            example: "2025-07-28"
      responses:
        '200':
          description: Effective recurring schedule retrieved
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerRecurringScheduleResponseDTO'
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business or effective recurring schedule not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1052 - recurring schedule not found"}

    post:
      summary: Create a recurring schedule
      description: >
        Creates the first or a new versioned recurring schedule for the business. Requires an
        OWNER membership. Existing daily-shift references to an archived (inactive) business
        Shift of this business may be kept; a new reference to an inactive Shift is rejected
        (404 1061). Existing role demands that already referenced an inactive job role of this
        business may be kept; a new demand for an inactive job role is rejected (404 1034).
      tags: [Manager]
      operationId: createManagerRecurringSchedule
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/ManagerRecurringScheduleRequestDTO'
            example:
              validFrom: "2025-07-28"
              validUntil: null
              days:
                - dayOfWeek: MONDAY
                  configuration:
                    openingIntervals:
                      - startTime: "09:00"
                        endTime: "17:00"
                    shifts:
                      - shiftId: 20
                        startTime: "09:00"
                        endTime: "12:00"
                        breakMinutes: 0
                        demands: []
                      - shiftId: 20
                        startTime: "13:00"
                        endTime: "17:00"
                        breakMinutes: 0
                        demands: []
                - dayOfWeek: TUESDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: WEDNESDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: THURSDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: FRIDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: SATURDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: SUNDAY
                  configuration: {openingIntervals: [], shifts: []}
      responses:
        '201':
          description: Recurring schedule created
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerRecurringScheduleResponseDTO'
        '400':
          description: Invalid recurring-schedule configuration
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1050 - recurring schedule is invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}
        '409':
          description: >
            Recurring schedule overlaps an existing version (1051), or, together with the schedule
            exceptions next to its validity, an opening interval that crosses midnight would collide
            with the opening of the following day (1055). Main API error passed through unchanged.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                versionOverlap:
                  summary: "1051 - recurring schedule overlaps an existing schedule"
                  value: {status: 409, detail: "1051 - recurring schedule overlaps an existing schedule"}
                adjacentDayOverlap:
                  summary: "1055 - schedule exception overlaps an adjacent effective configuration"
                  value: {status: 409, detail: "1055 - schedule exception overlaps an adjacent effective configuration"}

  recurring-schedule-item:
    put:
      summary: Replace a recurring schedule
      description: >
        Atomically replaces a complete recurring schedule using the expected root `version`.
        Requires an OWNER membership and returns a concurrency conflict when the version is stale.
        Existing daily-shift references to an archived (inactive) business Shift of this business
        may be kept; a new reference to an inactive Shift is rejected (404 1061). Existing role
        demands that already referenced an inactive job role of this business may be kept; a new
        demand for an inactive job role is rejected (404 1034).
      tags: [Manager]
      operationId: replaceManagerRecurringSchedule
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: scheduleId
          in: path
          required: true
          description: Root ID of the recurring schedule
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/ManagerRecurringScheduleReplacementRequestDTO'
            example:
              version: 2
              validFrom: "2025-07-28"
              validUntil: null
              days:
                - dayOfWeek: MONDAY
                  configuration:
                    openingIntervals:
                      - startTime: "10:00"
                        endTime: "18:00"
                    shifts:
                      - shiftId: 21
                        startTime: "10:00"
                        endTime: "18:00"
                        breakMinutes: 30
                        demands:
                          - jobRoleId: 10
                            minimumEmployees: 1
                            targetEmployees: 2
                            maximumEmployees: 3
                - dayOfWeek: TUESDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: WEDNESDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: THURSDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: FRIDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: SATURDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: SUNDAY
                  configuration: {openingIntervals: [], shifts: []}
      responses:
        '200':
          description: Recurring schedule replaced with its next version
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerRecurringScheduleResponseDTO'
        '400':
          description: Invalid recurring-schedule configuration
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1050 - recurring schedule is invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business or recurring schedule not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1052 - recurring schedule not found"}
        '409':
          description: >
            Stale `version` (1049), overlap with another version (1051), or, together with the
            schedule exceptions next to its validity, an opening interval that crosses midnight would
            collide with the opening of the following day (1055). Main API error passed through
            unchanged.
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              examples:
                concurrentModification:
                  summary: "1049 - resource was modified concurrently"
                  value: {status: 409, detail: "1049 - resource was modified concurrently"}
                versionOverlap:
                  summary: "1051 - recurring schedule overlaps an existing schedule"
                  value: {status: 409, detail: "1051 - recurring schedule overlaps an existing schedule"}
                adjacentDayOverlap:
                  summary: "1055 - schedule exception overlaps an adjacent effective configuration"
                  value: {status: 409, detail: "1055 - schedule exception overlaps an adjacent effective configuration"}

  shifts:
    get:
      summary: List business Shifts
      description: >
        Returns the deterministic current and archived Shift catalog for the requested business.
        `name` is a trimmed, case-insensitive partial filter; blank values are ignored. Results
        are ordered by active state descending, name ascending, and ID ascending. A normal shift
        omits `defaultSegments`; a split default includes it. Requires an
        OWNER membership.
      tags: [Manager]
      operationId: getManagerShifts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: name
          in: query
          required: false
          description: Trimmed, case-insensitive partial Shift-name filter; blank values are ignored.
          schema:
            type: string
            maxLength: 100
            example: service
        - name: active
          in: query
          required: false
          description: Filter by active state; omit to include active and archived Shifts.
          schema:
            type: boolean
            example: true
        - $ref: '../../components/manager/components.yml#/components/parameters/Page'
        - $ref: '../../components/manager/components.yml#/components/parameters/Size'
      responses:
        '200':
          description: Business Shift slice retrieved
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerShiftSliceResponseDTO'
        '400':
          description: Invalid page or size
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}

    post:
      summary: Create a business Shift
      description: >
        Creates an active business Shift with a unique normalized name. Requires an OWNER membership.
        Optional `defaultBreakMinutes` defaults to 0 when omitted. It must be strictly less than the
        net default duration: the envelope when `defaultSegments` is omitted (start equal to end = 24h),
        or the sum of the segment durations when default segments are sent. Optional `defaultSegments`
        is one or two `ShiftSegmentDTO` values (`HH:mm`) and is only a client preload. The server does
        not copy it when a write sends this shiftId and omits `segments`. Invalid segments, an envelope
        that does not match, or a break that does not fit returns Main 400 1060 INVALID_SHIFT. Catalog
        defaults never propagate to existing occurrences, recurring templates, planning requirements
        or assignments.
      tags: [Manager]
      operationId: createManagerShift
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/ManagerShiftCreateRequestDTO'
            examples:
              nameAndColor:
                summary: Name and color only
                description: Times and default segments omitted. `defaultBreakMinutes` defaults to 0.
                value:
                  name: Morning service
                  color: "#1A2B3C"
              normal:
                summary: Normal shift
                description: >
                  No `defaultSegments`. The envelope is the only interval.
                  `defaultBreakMinutes` 30 fits under 09:00–17:00.
                value:
                  name: Morning service
                  color: "#1A2B3C"
                  defaultStartAt: "09:00:00"
                  defaultEndAt: "17:00:00"
                  defaultBreakMinutes: 30
              split:
                summary: Split shift
                description: >
                  Two default segments, 10:00–14:00 and 19:00–23:00. The envelope
                  is 10:00–23:00. Net duration is 480 minutes, so `defaultBreakMinutes`
                  30 is valid.
                value:
                  name: Split service
                  color: "#C47B2B"
                  defaultStartAt: "10:00:00"
                  defaultEndAt: "23:00:00"
                  defaultBreakMinutes: 30
                  defaultSegments:
                    - startTime: "10:00"
                      endTime: "14:00"
                    - startTime: "19:00"
                      endTime: "23:00"
      responses:
        '201':
          description: Business Shift created
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerShiftResponseDTO'
        '400':
          description: Invalid Shift values, including default segments or a default break that does not fit (1060 INVALID_SHIFT)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1060 - shift is invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business not found
          content:
