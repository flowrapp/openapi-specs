  shift-item:
    get:
      summary: Get a business Shift
      description: >
        Returns an active or archived Shift belonging to the requested business, including its
        default local start and end times. `defaultSegments` is included only for a split
        default and omitted for a normal shift. Requires an OWNER membership.
      tags: [Manager]
      operationId: getManagerShift
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: shiftId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Business Shift retrieved
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerShiftResponseDTO'
        '400':
          description: Invalid business or Shift identifier
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business or Shift not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1061 - shift not found"}
    put:
      summary: Update or reactivate a business Shift
      description: >
        Updates Shift presentation without changing its identity. Setting active to true
        reactivates an archived Shift. Optional `defaultBreakMinutes` keeps the stored value
        when omitted. Omit `defaultSegments` to keep the stored segments; `[]` removes the
        split default; `null` is not allowed. Invalid segments, an envelope that does not
        match, or a break that does not fit the net duration returns Main 400 1060
        INVALID_SHIFT. Changing the default never rewrites existing daily occurrences,
        recurring templates, planning requirements or assignments, and the server does not
        copy `defaultSegments` when those are created from this shiftId without `segments`.
      tags: [Manager]
      operationId: updateManagerShift
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: shiftId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/ManagerShiftUpdateRequestDTO'
            examples:
              normal:
                summary: Normal shift, keep stored default segments
                description: Omitting `defaultSegments` keeps the stored value.
                value:
                  name: Morning service
                  color: "#4C9F70"
                  active: true
                  defaultStartAt: "09:00:00"
                  defaultEndAt: "17:00:00"
              split:
                summary: Set a split default
                description: >
                  Envelope 10:00–23:00 with segments 10:00–14:00 and 19:00–23:00.
                  `defaultBreakMinutes` 30 is below the 480-minute net.
                value:
                  name: Split service
                  color: "#C47B2B"
                  active: true
                  defaultStartAt: "10:00:00"
                  defaultEndAt: "23:00:00"
                  defaultBreakMinutes: 30
                  defaultSegments:
                    - startTime: "10:00"
                      endTime: "14:00"
                    - startTime: "19:00"
                      endTime: "23:00"
              clearSplit:
                summary: Remove the split default
                description: "`[]` clears stored default segments. `null` is not allowed."
                value:
                  name: Morning service
                  color: "#4C9F70"
                  active: true
                  defaultStartAt: "09:00:00"
                  defaultEndAt: "17:00:00"
                  defaultSegments: []
      responses:
        '200':
          description: Business Shift updated or reactivated
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerShiftResponseDTO'
        '400':
          description: Invalid Shift values, including default segments or a default break that does not fit (1060 INVALID_SHIFT)
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1060 - shift is invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business or Shift not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1061 - shift not found"}
        '409':
          description: Main API rejected a duplicate normalized Shift name
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 409, detail: "1062 - shift name already exists"}
    delete:
      summary: Deactivate a business Shift
      description: Idempotently deactivates a Shift while preserving its identity and historical references. Requires an OWNER membership.
      tags: [Manager]
      operationId: deleteManagerShift
