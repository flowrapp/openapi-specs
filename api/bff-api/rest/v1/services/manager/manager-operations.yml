manager:
  businesses:
    get:
      summary: Get manager business dashboard
      description: >
        Returns the manager's business dashboard with aggregate statistics. Includes the total
        number of businesses, total workers across all businesses, and a summary of each
        business with its worker count.
      tags:
        - Manager
      operationId: getManagerBusinessDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerBusinessDashboardResponseDTO'
              example:
                totalBusinesses: 2
                totalWorkers: 17
                businesses:
                  - id: 1
                    name: "Downtown Office"
                    city: "New York"
                    workerCount: 12
                  - id: 2
                    name: "Uptown Branch"
                    city: "New York"
                    workerCount: 5
        '401':
          description: Unauthorized

  workers:
    get:
      summary: Get business workers
      description: >
        Returns business memberships for the authenticated user's business. `totalWorkers` is
        the number of returned memberships after the optional role filter, including owners and
        managers when selected.
      tags:
        - Manager
      operationId: getManagerBusinessWorkers
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: role
          in: query
          required: false
          description: Filter users by business membership role
          schema:
            type: string
            enum: [OWNER, MANAGER, EMPLOYEE]
      responses:
        '200':
          description: Workers list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerWorkersResponseDTO'
              example:
                totalWorkers: 3
                workers:
                  - userId: 1
                    name: "John Doe"
                    email: "john.doe@example.com"
                    role: "OWNER"
                    currentContract: null
                  - userId: 2
                    name: "Jane Smith"
                    email: "jane.smith@example.com"
                    role: "MANAGER"
                    currentContract: null
                  - userId: 3
                    name: "Bob Wilson"
                    email: "bob.wilson@example.com"
                    role: "EMPLOYEE"
                    currentContract:
                      id: 123
                      userId: 3
                      businessId: 101
                      jobRoleId: 10
                      jobRole:
                        id: 10
                        code: WAITER
                        name: Waiter
                        color: "#1A2B3C"
                        icon: front-of-house
                        active: true
                      totalWeekHours: 40.0
                      startDate: "2025-01-01"
                      endDate: null
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a manager of this business
        '404':
          description: Business not found

  history-day:
    get:
      summary: Get manager day history
      description: >
        Returns all workers' sessions for a specific day in a business. Shows each worker's
        individual clock-in/clock-out sessions and their daily total.
      tags:
        - Manager
      operationId: getManagerDayHistory
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          required: false
          description: Date to view (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
            format: date
            example: "2025-03-10"
      responses:
        '200':
          description: Day history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerDayHistoryResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a manager of this business
        '404':
          description: Business not found

  history-week:
    get:
      summary: Get manager week history
      description: >
        Returns a weekly summary for a business, broken down by day with per-worker totals
        for each day. Use the day history endpoint for session-level detail.
      tags:
        - Manager
      operationId: getManagerWeekHistory
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: week
          in: query
          required: false
          description: ISO 8601 week (YYYY-Www). Defaults to current week.
          schema:
            type: string
            pattern: '^\d{4}-W\d{2}$'
            example: "2025-W31"
      responses:
        '200':
          description: Week history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerWeekHistoryResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a manager of this business
        '404':
          description: Business not found

  history-month:
    get:
      summary: Get manager month history
      description: >
        Returns a monthly calendar view for a business with day-level totals and worker counts.
        No session-level detail. Use the day history endpoint to drill into a specific day.
      tags:
        - Manager
      operationId: getManagerMonthHistory
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: month
          in: query
          required: false
          description: Year and month (YYYY-MM). Defaults to current month.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: "2025-03"
      responses:
        '200':
          description: Month history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerMonthHistoryResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a manager of this business
        '404':
          description: Business not found

  edit-worklog:
    put:
      summary: Edit a worklog
      description: >
        Updates the clock-in and/or clock-out times of an existing worklog. This is a manager-only
        operation for correcting worker time entries.
      tags:
        - Manager
      operationId: managerUpdateWorklog
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: worklogId
          in: path
          required: true
          description: ID of the worklog to update
          schema:
            type: integer
            format: int64
      requestBody:
        description: Updated clock-in and/or clock-out times
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/WorklogUpdateRequestDTO'
      responses:
        '200':
          description: Worklog updated successfully
          content:
            application/json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/SessionDTO'
        '400':
          description: Invalid request (e.g., clock-out before clock-in)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a manager of this business
        '404':
          description: Worklog not found

  invitations:
    post:
      summary: Create a business invitation
      description: >
        Creates a new invitation for a person to join a business with a specified role.
        Requires an OWNER membership in the business. An email will be sent to the invitee.
        Pass-through to the main API.
      tags:
        - Manager
      operationId: managerCreateInvitation
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
      requestBody:
        description: Invitation details
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/InvitationRequestDTO'
            example:
              email: "newowner@example.com"
              role: "OWNER"
      responses:
        '201':
          description: Invitation created successfully
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/InvitationResponseDTO'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not an owner of this business
        '404':
          description: Business not found
        '409':
          description: Conflict - User already invited or already a member

    get:
      summary: List business invitations
      description: >
        Returns the list of invitations for a specific business, optionally filtered by status.
        Requires an OWNER membership in the business.
      tags:
        - Manager
      operationId: managerGetBusinessInvitations
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          description: Filter invitations by status
          schema:
            type: string
            enum: [PENDING, ACCEPTED, DECLINED, EXPIRED]
      responses:
        '200':
          description: Invitations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../components/manager/components.yml#/components/schemas/InvitationResponseDTO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not an owner of this business
        '404':
          description: Business not found

  delete-invitation:
    delete:
      summary: Delete a business invitation
      description: >
        Deletes an existing invitation to join a business. Requires an OWNER membership in the
        business. Pass-through to the main API.
      tags:
        - Manager
      operationId: managerDeleteInvitation
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: invitationId
          in: path
          required: true
          description: ID of the invitation to delete
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Invitation deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not an owner of this business
        '404':
          description: Business or invitation not found

  export-weekly-timesheet:
    get:
      summary: Export weekly timesheet as PDF
      description: >
        Generates and downloads a PDF document containing the weekly timesheet for a business.
        The PDF includes each worker's daily clock-in/clock-out times and total hours for the
        specified week.
      tags:
        - Manager
      operationId: exportWeeklyTimesheetPdf
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: week
          in: query
          required: true
          description: ISO 8601 week to export (YYYY-Www)
          schema:
            type: string
            pattern: '^\d{4}-W\d{2}$'
            example: "2025-W31"
      responses:
        '200':
          description: PDF generated successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
                example: 'attachment; filename="timesheet-2025-W31.pdf"'
        '400':
          description: Invalid week format
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a manager of this business
        '404':
          description: Business not found or no data for the specified week

  export-worked-hours-report:
    get:
      summary: Export worked hours report as PDF
      description: >
        Downloads a PDF report with worked-hours information for every employee in the business
        within the requested date range. This endpoint is a pass-through proxy to the main API,
        where privileged business access is enforced for OWNER and MANAGER roles.
      tags:
        - Manager
      operationId: exportManagerWorkedHoursReportPdf
      security:
        - bearerAuth: []
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: true
          description: Start date of the report range, inclusive (format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-01-01"
        - name: to
          in: query
          required: true
          description: End date of the report range, inclusive (format YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-12-31"
      responses:
        '200':
          description: PDF generated successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
                example: 'attachment; filename="worked-hours-report-2025-01-01-2025-12-31.pdf"'
        '400':
          description: Invalid date range
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User does not have privileged access to this business
        '404':
          description: Business not found

  planning-generation-settings:
    get:
      summary: Get planning generation settings
      description: >
        Returns the optional business-local weekday and minute at which the next weekly planning
        is generated automatically. Requires an OWNER membership. Absence is returned as 404.
      tags: [Manager]
      operationId: getManagerPlanningGenerationSettings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Planning generation settings retrieved
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerPlanningGenerationSettingsDTO'
              example:
                generationDay: MONDAY
                generationTime: "09:00"
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business or planning generation settings not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "planning generation settings not found"}

    put:
      summary: Create or replace planning generation settings
      description: >
        Creates or completely replaces the business-local weekday and minute used to generate the
        next weekly planning. Requires an OWNER membership and is idempotent.
      tags: [Manager]
      operationId: replaceManagerPlanningGenerationSettings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/ManagerPlanningGenerationSettingsDTO'
            example:
              generationDay: MONDAY
              generationTime: "09:00"
      responses:
        '200':
          description: Planning generation settings replaced
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerPlanningGenerationSettingsDTO'
              example:
                generationDay: FRIDAY
                generationTime: "18:30"
        '400':
          description: Invalid planning generation settings
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1044 - planning settings are invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}

    delete:
      summary: Delete planning generation settings
      description: >
        Disables automatic planning generation for the business. Requires an OWNER membership and
        is idempotent: deleting an absent configuration has the same successful result.
      tags: [Manager]
      operationId: deleteManagerPlanningGenerationSettings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '204':
          description: Planning generation settings deleted or already absent
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}

  recurring-schedule:
    get:
      summary: Get the effective recurring schedule
      description: >
        Returns the complete recurring schedule effective on `effectiveOn` in the business-local
        time zone. The date defaults to the current business-local date. Requires an OWNER
        membership; absence is returned as 404 rather than an invented empty schedule.
      tags: [Manager]
      operationId: getManagerEffectiveRecurringSchedule
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: effectiveOn
          in: query
          required: false
          description: Business-local date on which the schedule must be effective; defaults to today
          schema:
            type: string
            format: date
            example: "2025-07-28"
      responses:
        '200':
          description: Effective recurring schedule retrieved
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerRecurringScheduleResponseDTO'
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business or effective recurring schedule not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1052 - recurring schedule not found"}

    post:
      summary: Create a recurring schedule
      description: Creates the first or a new versioned recurring schedule for the business. Requires an OWNER membership.
      tags: [Manager]
      operationId: createManagerRecurringSchedule
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/ManagerRecurringScheduleRequestDTO'
            example:
              validFrom: "2025-07-28"
              validUntil: null
              days:
                - dayOfWeek: MONDAY
                  configuration:
                    openingIntervals:
                      - startTime: "09:00"
                        endTime: "17:00"
                    shifts:
                      - name: Morning service
                        color: "#1A2B3C"
                        startTime: "09:00"
                        endTime: "17:00"
                        breakMinutes: 30
                        demands:
                          - jobRoleId: 10
                            minimumEmployees: 1
                            targetEmployees: 2
                            maximumEmployees: 3
                - dayOfWeek: TUESDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: WEDNESDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: THURSDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: FRIDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: SATURDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: SUNDAY
                  configuration: {openingIntervals: [], shifts: []}
      responses:
        '201':
          description: Recurring schedule created
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerRecurringScheduleResponseDTO'
        '400':
          description: Invalid recurring-schedule configuration
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1050 - recurring schedule is invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 403, detail: "1020 - user is not the owner of business"}
        '404':
          description: Business not found
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 404, detail: "1006 - business does not exist"}
        '409':
          description: Recurring schedule overlaps an existing version
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 409, detail: "1051 - recurring schedule overlaps an existing schedule"}

  recurring-schedule-item:
    put:
      summary: Replace a recurring schedule
      description: >
        Atomically replaces a complete recurring schedule using the expected root `version`.
        Requires an OWNER membership and returns a concurrency conflict when the version is stale.
      tags: [Manager]
      operationId: replaceManagerRecurringSchedule
      security: [{ bearerAuth: [] }]
      parameters:
        - name: businessId
          in: path
          required: true
          description: ID of the business
          schema: {type: integer, format: int64, minimum: 1}
        - name: scheduleId
          in: path
          required: true
          description: Root ID of the recurring schedule
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/manager/components.yml#/components/schemas/ManagerRecurringScheduleReplacementRequestDTO'
            example:
              version: 2
              validFrom: "2025-07-28"
              validUntil: null
              days:
                - dayOfWeek: MONDAY
                  configuration:
                    openingIntervals:
                      - startTime: "10:00"
                        endTime: "18:00"
                    shifts:
                      - name: Evening service
                        color: "#4C9F70"
                        startTime: "10:00"
                        endTime: "18:00"
                        breakMinutes: 30
                        demands:
                          - jobRoleId: 10
                            minimumEmployees: 1
                            targetEmployees: 2
                            maximumEmployees: 3
                - dayOfWeek: TUESDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: WEDNESDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: THURSDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: FRIDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: SATURDAY
                  configuration: {openingIntervals: [], shifts: []}
                - dayOfWeek: SUNDAY
                  configuration: {openingIntervals: [], shifts: []}
      responses:
        '200':
          description: Recurring schedule replaced with its next version
          content:
            application/json:
              schema:
                $ref: '../../components/manager/components.yml#/components/schemas/ManagerRecurringScheduleResponseDTO'
        '400':
          description: Invalid recurring-schedule configuration
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
              example: {status: 400, detail: "1050 - recurring schedule is invalid"}
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        '403':
          description: Authenticated user is not an OWNER of the business
          content:
            application/problem+json:
              schema:
                $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
