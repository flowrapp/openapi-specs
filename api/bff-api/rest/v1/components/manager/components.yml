    ManagerCurrentContractDTO:
      type: object
      description: One contract effective for a worker during the business-local current date
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 123
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 3
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          example: 10
        jobRole:
          $ref: '#/components/schemas/ManagerJobRoleSummaryDTO'
        totalWeekHours:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 40.0
        startDate:
          type: string
          format: date
          example: "2025-01-01"
        endDate:
          type: [string, "null"]
          format: date
          example: null
      required: [id, userId, businessId, jobRoleId, jobRole, totalWeekHours, startDate, endDate]

    ManagerPlanningRequirementShiftDTO:
      type: object
      description: >
        Immutable, presentation-safe shift requirement with no solver correlation IDs. Requirement
        duration uses local wall-clock time: an end time not later than the start time is on the
        following calendar day, and break minutes are subtracted before staffing demand is applied.
      properties:
        shiftId:
          type: integer
          format: int64
          minimum: 1
          description: Business Shift identity captured in the planning snapshot
          example: 20
        shiftName:
          type: string
          minLength: 1
          example: Morning service
        shiftColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#1A2B3C"
        startTime:
          $ref: '#/components/schemas/ManagerLocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/ManagerLocalMinuteTimeDTO'
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          example: 30
        demands:
          type: array
          description: Staffing demands with derived planning coverage.
          items:
            $ref: '#/components/schemas/ManagerPlanningRoleDemandDTO'
      required: [shiftId, shiftName, shiftColor, startTime, endTime, breakMinutes, demands]

    ManagerPlanningRequirementDTO:
      type: object
      description: Immutable planning requirements grouped by business-local date
      properties:
        date:
          type: string
          format: date
          example: "2025-07-28"
        requiredSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Sum of each shift's net local wall-clock seconds multiplied by each demand's
            `targetEmployees`. Overnight shifts roll their end into the following calendar day
            before breaks and demand are applied.
          example: 54000
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/ManagerPlanningRequirementShiftDTO'
      required: [date, requiredSeconds, shifts]

    ManagerPlanningTotalsDTO:
      type: object
      description: >
        Aggregate planning durations in seconds. `requiredSeconds` is the sum of daily
        requirements, `scheduledSeconds` is the sum of daily worker assignments, and
        `contractedSeconds` is the sum of the rounded worker contracted totals.
      properties:
        requiredSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 270000
        scheduledSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 237600
        contractedSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 288000
      required: [requiredSeconds, scheduledSeconds, contractedSeconds]

    ManagerPlanningAssignmentDTO:
      type: object
      description: >
        One assigned shift with immutable presentation metadata. Its net duration is the elapsed
        duration between the offset-aware `startAt` and `endAt`, minus `breakMinutes`.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 900
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          example: 10
        jobRole:
          $ref: '#/components/schemas/ManagerJobRoleSummaryDTO'
        shiftId:
          type: integer
          format: int64
          minimum: 1
          description: Business Shift identity captured in the planning snapshot
          example: 20
        shiftName:
          type: string
          minLength: 1
          example: Morning service
        shiftColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#1A2B3C"
        startAt:
          type: string
          format: date-time
          example: "2025-07-28T09:00:00+02:00"
        endAt:
          type: string
          format: date-time
          example: "2025-07-28T17:00:00+02:00"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          example: 30
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Net assigned duration after subtracting breaks
          example: 27000
      required: [id, jobRoleId, jobRole, shiftId, shiftName, shiftColor, startAt, endAt, breakMinutes, durationSeconds]

    ManagerWorkerDayDTO:
      type: object
      description: One employee's assignments and total for one business-local date
      properties:
        date:
          type: string
          format: date
          example: "2025-07-28"
        scheduledSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Sum of the net durations of this day's assignments
          example: 27000
        assignments:
          type: array
          description: Zero or more assigned shifts; multiple shifts on the same date are preserved.
          items:
            $ref: '#/components/schemas/ManagerPlanningAssignmentDTO'
      required: [date, scheduledSeconds, assignments]

    ManagerWorkerPlanningDTO:
      type: object
      description: >
        Worker included when the user has an intersecting contract or an assignment in the
        planning. Names come from the business-user projection; assignment role metadata comes
        from the current job-role catalog queried with inactive roles included.
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 3
        name:
          type: string
          example: Bob Wilson
        contractedSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Contracted time applicable to the planning period. Each intersecting contract
            contributes `totalWeekHours * 3600 * coveredCalendarDays / 7`; contributions are
            accumulated at full precision per worker and rounded once to the nearest whole second.
          example: 144000
        scheduledSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Sum of the worker's daily scheduled seconds
          example: 54000
        days:
          type: array
          items:
            $ref: '#/components/schemas/ManagerWorkerDayDTO'
      required: [userId, name, contractedSeconds, scheduledSeconds, days]

    ManagerPlanningDayDTO:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2025-07-28"
        requiredSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 54000
        scheduledSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 54000
      required: [date, requiredSeconds, scheduledSeconds]

    ManagerPlanningResponseDTO:
      type: object
      description: >
        Stable weekly planning response for CREATED, SOLVING, DRAFT, PUBLISHED, ARCHIVED, and
        FAILED. DRAFT is solved and reviewable but unpublished; ARCHIVED is historical and
        read-only. Requirements use local wall-clock
        net shift duration multiplied by target staffing demand; assignments use offset elapsed
        duration minus breaks. Workers are the union of users with intersecting contracts and users
        with assignments, and planning totals reconcile to their daily and worker totals.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 500
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        week:
          type: string
          pattern: '^\d{4}-W\d{2}$'
          description: ISO week identifier
          example: "2025-W31"
        weekStart:
          type: string
          format: date
          description: Monday of the ISO week
          example: "2025-07-28"
        weekEnd:
          type: string
          format: date
          description: Sunday of the ISO week
          example: "2025-08-03"
        status:
          type: string
          description: CREATED is awaiting solver submission; DRAFT is solved and reviewable but unpublished; ARCHIVED is historical and read-only
          enum: [CREATED, SOLVING, DRAFT, PUBLISHED, ARCHIVED, FAILED]
          example: SOLVING
        failureReason:
          type: [string, "null"]
          maxLength: 500
          description: Optional sanitized owner-facing failure reason; never a stack trace or raw solver payload
          example: null
        totals:
          $ref: '#/components/schemas/ManagerPlanningTotalsDTO'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/ManagerPlanningRequirementDTO'
        days:
          type: array
          items:
            $ref: '#/components/schemas/ManagerPlanningDayDTO'
        workers:
          type: array
          description: Worker totals and per-date assignment arrays
          items:
            $ref: '#/components/schemas/ManagerWorkerPlanningDTO'
        createdAt:
          type: string
          format: date-time
          example: "2025-07-27T08:00:00+02:00"
        publishedAt:
          type: [string, "null"]
          format: date-time
          example: null
        hasCoverageWarnings:
          type: boolean
          description: True when any immutable demand remains below its minimum staffing level.
      required: [id, businessId, week, weekStart, weekEnd, status, failureReason, totals, requirements, days, workers, createdAt, publishedAt, hasCoverageWarnings]
