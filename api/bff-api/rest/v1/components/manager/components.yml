    ManagerPlanningRequirementShiftDTO:
      type: object
      description: >
        Immutable, presentation-safe shift requirement with no solver correlation IDs. Requirement
        duration is the sum of the planned segment durations minus `breakMinutes` (the envelope
        when `segments` is omitted). An end time not later than the start time is on the
        following calendar day. The unpaid gap is not part of the duration and is not a break.
      properties:
        shiftId:
          type: integer
          format: int64
          minimum: 1
          description: Business Shift identity captured in the planning snapshot
          example: 20
        shiftName:
          type: string
          minLength: 1
          example: Morning service
        shiftColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#1A2B3C"
        startTime:
          $ref: "#/components/schemas/ManagerLocalMinuteTimeDTO"
        endTime:
          $ref: "#/components/schemas/ManagerLocalMinuteTimeDTO"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned break of the shift, in minutes. It does not include the
            unpaid gap between segments.
          example: 30
        segments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Planned segments captured in the requirement. Omitted for a normal
            shift. `startTime` and `endTime` remain the envelope. Not read back
            from the catalog Shift's `defaultSegments`.
          items:
            $ref: "../common/components.yml#/components/schemas/ShiftSegmentDTO"
        demands:
          type: array
          description: Staffing demands with derived planning coverage.
          items:
            $ref: "#/components/schemas/ManagerPlanningRoleDemandDTO"
      required:
        [
          shiftId,
          shiftName,
          shiftColor,
          startTime,
          endTime,
          breakMinutes,
          demands,
        ]

    ManagerPlanningRequirementDTO:
      type: object
      description: Immutable planning requirements grouped by business-local date
      properties:
        date:
          type: string
          format: date
          example: "2025-07-28"
        requiredSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Sum of each shift's net seconds (sum of segment durations minus `breakMinutes`,
            or the envelope when `segments` is omitted) multiplied by each demand's
            `targetEmployees`. Overnight shifts roll the last segment into the following
            calendar day. The unpaid gap is not included.
          example: 54000
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/ManagerPlanningRequirementShiftDTO"
      required: [date, requiredSeconds, shifts]

    ManagerPlanningTotalsDTO:
      type: object
      description: >
        Aggregate planning durations in seconds. `requiredSeconds` is the sum of daily
        requirements, `scheduledSeconds` is the sum of daily worker assignments, and
        `contractedSeconds` is the sum of the rounded worker contracted totals.
      properties:
        requiredSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 270000
        scheduledSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 237600
        contractedSeconds:
          type: integer
          format: int64
          minimum: 0
          example: 288000
      required: [requiredSeconds, scheduledSeconds, contractedSeconds]

    ManagerPlanningAssignmentDTO:
      type: object
      description: >
        One assigned shift with immutable presentation metadata. `startAt` and `endAt` are the
        envelope. Net duration is the sum of the planned segment durations minus `breakMinutes`
        (the envelope duration when `segments` is omitted). The unpaid gap is not included and
        is not a break. `durationSeconds` and `netSeconds` are that same server-computed value.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 900
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          example: 10
        jobRole:
          $ref: "#/components/schemas/ManagerJobRoleSummaryDTO"
        shiftId:
          type: integer
          format: int64
          minimum: 1
          description: Business Shift identity captured in the planning snapshot
          example: 20
        shiftName:
          type: string
          minLength: 1
          example: Morning service
        shiftColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#1A2B3C"
        startAt:
          type: string
          format: date-time
          example: "2025-07-28T09:00:00+02:00"
        endAt:
          type: string
          format: date-time
          example: "2025-07-28T17:00:00+02:00"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned break of the shift, in minutes. It does not include the unpaid
            gap between segments.
          example: 30
        segments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Planned segments of this assignment. Omitted for a normal shift.
            Not clocked worklogs. See `ScheduledShiftSegmentDTO`. Not updated
            when the catalog `defaultSegments` changes.
          items:
            $ref: "../common/components.yml#/components/schemas/ScheduledShiftSegmentDTO"
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: >
            Net assigned seconds: sum of the planned segment durations minus
            `breakMinutes`, never negative. Same value as `netSeconds`. The
            unpaid gap is not included.
          example: 27000
        netSeconds:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Same value as `durationSeconds`. Server-computed.
          example: 27000
      required:
        [
          id,
          jobRoleId,
          jobRole,
          shiftId,
          shiftName,
          shiftColor,
          startAt,
          endAt,
          breakMinutes,
          durationSeconds,
        ]

