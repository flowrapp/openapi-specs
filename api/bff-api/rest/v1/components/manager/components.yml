            - type: "null"
          description: Proposed contract, or null when the default GENERAL contract will be created on acceptance
        status:
          type: string
          description: Current status of the invitation
          enum: [PENDING, ACCEPTED, DECLINED, EXPIRED]
          example: "PENDING"
        createdAt:
          type: string
          format: date-time
          description: When the invitation was created
          example: "2025-06-15T14:30:00+00:00"
        expiresAt:
          type: string
          format: date-time
          description: When the invitation expires
          example: "2025-06-22T14:30:00+00:00"
        hasIdentityDocument:
          type: [boolean, "null"]
          description: >
            Whether this invitation currently stores an identity document.
            `true` or `false` only when the caller is the OWNER of the business.
            `null` for everyone else. The document itself is never returned.
            Forwarded from the Main API `InvitationResponseDTO`.
          example: false
      required:
