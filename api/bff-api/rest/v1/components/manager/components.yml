      type: object
      description: >
        Manual assignment; shift name and color are captured from the business
        Shift. `startAt` and `endAt` are the envelope. Optional `segments` makes
        this a split shift. Omit `segments`, or send an empty array, for a
        normal shift. One or two elements is a split shift. The domain
        validates 1–2 segments only when the list is not empty.
        The gap is reserved: the same person cannot hold
        another shift inside the envelope (`400` `1047`).
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: >
            Optional scheduled-shift ID returned in the planning response;
            omit for a new assignment.
          example: 900
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 42
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          example: 7
        shiftId:
          type: integer
          format: int64
          minimum: 1
          example: 20
        startAt:
          type: string
          format: date-time
          example: "2026-10-05T09:00:00+02:00"
        endAt:
          type: string
          format: date-time
          example: "2026-10-05T17:00:00+02:00"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned break of the shift, in minutes. It does not include the unpaid
            gap between segments.
          example: 30
        segments:
          type: array
          maxItems: 2
          description: >
            Planned segments. Omit, or send an empty array, for a normal shift.
            One or two elements is a split shift. The domain validates 1–2
            segments only when the list is not empty. When the list is not
            empty, the envelope must match the first start and the last end.
            See `ScheduledShiftSegmentDTO`.
          items:
            $ref: "../common/components.yml#/components/schemas/ScheduledShiftSegmentDTO"
      required: [userId, jobRoleId, shiftId, startAt, endAt, breakMinutes]

    ManagerReplacePlanningScheduledShiftsRequestDTO:
      type: object
      description: Complete replacement of a DRAFT planning's assignments.
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: Version from the latest manager planning response.
          example: 3
        scheduledShifts:
          type: array
          description: Complete collection; an empty array removes every assignment.
          items:
            $ref: "#/components/schemas/ManagerScheduledShiftRequestDTO"
      required: [version, scheduledShifts]

    ManagerPlanningResponseDTO:
      type: object
      description: >
        Stable weekly planning response for CREATED, SOLVING, DRAFT, PUBLISHED, ARCHIVED, and
        FAILED. DRAFT is editable and unpublished, whether created manually or by the solver;
        manually created drafts have no requirements. ARCHIVED is historical and read-only.
        Requirements use local wall-clock
        net shift duration (sum of segment durations minus `breakMinutes`) multiplied by target
        staffing demand; assignments use that same net duration. The unpaid gap is not included.
        Workers are the union of users with intersecting contracts and users
        with assignments, and planning totals reconcile to their daily and worker totals.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 500
        version:
          type: integer
          format: int64
          minimum: 0
          description: Aggregate version required to replace draft assignments.
          example: 3
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        week:
          type: string
          pattern: '^\d{4}-W\d{2}$'
          description: ISO week identifier
          example: "2025-W31"
        weekStart:
          type: string
          format: date
          description: Monday of the ISO week
          example: "2025-07-28"
        weekEnd:
          type: string
          format: date
          description: Sunday of the ISO week
          example: "2025-08-03"
        status:
          type: string
          description: CREATED is awaiting solver submission; DRAFT is editable and unpublished; ARCHIVED is historical and read-only
          enum: [CREATED, SOLVING, DRAFT, PUBLISHED, ARCHIVED, FAILED]
          example: SOLVING
        failureReason:
          type: [string, "null"]
          maxLength: 1000
          description: >
            Sanitized diagnostic reason for FAILED plannings, forwarded from Main; never a
            stack trace or raw solver payload. For operators and support, not for display
            in the owner UI (the app shows copy from failureCode).
          example: null
        failureCode:
          description: >
            Why the planning is FAILED. Null when status is not FAILED, or for FAILED rows
            written before this field existed. Clients must ignore this field unless status
            is FAILED. Open string: see PlanningFailureCodeDTO.
          oneOf:
            - $ref: "../planning/components.yml#/components/schemas/PlanningFailureCodeDTO"
            - type: "null"
          example: null
        failedAt:
          type: [string, "null"]
          format: date-time
          description: >
            Instant when the planning entered FAILED, in the same format as createdAt
            (UTC Instant serialized with offset). Null if the planning is not FAILED, or if
            it failed before this field existed.
          example: null
        totals:
          $ref: "#/components/schemas/ManagerPlanningTotalsDTO"
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/ManagerPlanningRequirementDTO"
        days:
          type: array
          items:
            $ref: "#/components/schemas/ManagerPlanningDayDTO"
        workers:
          type: array
          description: Worker totals and per-date assignment arrays
          items:
            $ref: "#/components/schemas/ManagerWorkerPlanningDTO"
        createdAt:
          type: string
          format: date-time
          example: "2025-07-27T08:00:00+02:00"
        publishedAt:
          type: [string, "null"]
          format: date-time
          example: null
        hasCoverageWarnings:
          type: boolean
          description: True when any immutable demand remains below its minimum staffing level.
      required:
        [
          id,
          version,
          businessId,
          week,
          weekStart,
          weekEnd,
          status,
          failureReason,
          totals,
          requirements,
          days,
          workers,
          createdAt,
          publishedAt,
          hasCoverageWarnings,
        ]

    ManagerHoursMonthsResponseDTO:
      type: object
      description: >
        One page of the monthly worked-hours totals of the business for the owner reports screen, newest month
        first, for the whole business or the requested people. Same shape as WorkerHoursMonthsResponseDTO
        («Mis horas»), plus oldestMonth and, per month, peopleCount.
      properties:
        zone:
          type: string
          description: IANA time zone of the business. Months, days and today are calendar values in this zone.
          example: Europe/Madrid
        today:
          type: string
          format: date
          description: Today in the business time zone, from the server clock
          example: "2026-11-12"
        oldestMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: >
            Oldest month the list can reach for this scope: the later of the first month of the window (at most 48
            months, the current month and the 47 before it) and the first month of the scope. The app shows «No hay
            meses anteriores a …» with it.
          example: "2025-03"
        months:
          type: array
          description: >
            Consecutive calendar months, newest first, with no gaps (a month without worklogs has hasWorklogs false
            and peopleCount 0). Without `before`, the first item is always the current month, even when empty. Never
            older than oldestMonth. Empty when `before` is on or before oldestMonth.
          items:
            $ref: '#/components/schemas/ManagerHoursMonthDTO'
        nextBefore:
          type:
            - string
            - 'null'
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Send it as `before` for the next (older) page. Null when no older month remains on or after oldestMonth.
          example: "2025-11"
      required: [zone, today, oldestMonth, months, nextBefore]

    ManagerHoursMonthDTO:
      type: object
      description: >
        Totals of one calendar month summed over the people in scope. Worklogs are attributed to the business-local
        date of their clock-in and seconds are net of effective closed breaks, the same rule as the worked-hours PDF.
        REJECTED and open worklogs are in neither figure (option B).
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Calendar month (YYYY-MM)
          example: "2026-10"
        inProgress:
          type: boolean
          description: True for the current month in the business time zone
          example: false
        confirmedSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Closed worklogs in CONFIRMED or APPROVED. Equals the total of the PDF of exportManagerWorkedHoursReportPdf
            with periodType MONTH for the same month and the same userIds; the Main API computes both with the same
            queries and domain rule.
          example: 9734400
        pendingSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Closed worklogs in PENDING_REVIEW or PENDING_RECONCILIATION. Not included in confirmedSeconds; the app shows
            it apart («+X h pendientes de revisar»). Always present: 0 means nothing pending.
          example: 130500
        pendingCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of the closed worklogs counted in pendingSeconds
          example: 14
        hasWorklogs:
          type: boolean
          description: True when someone in scope has at least one worklog with its clock-in in this month, in any review status, open ones included. Equals peopleCount > 0.
          example: true
        peopleCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of the people in scope with at least one worklog whose clock-in is in this month, in any review status, open ones included
          example: 8
        report:
          $ref: '#/components/schemas/ManagerHoursMonthReportDTO'
        archive:
          $ref: '#/components/schemas/ManagerHoursMonthArchiveDTO'
      required: [month, inProgress, confirmedSeconds, pendingSeconds, pendingCount, hasWorklogs, peopleCount, report]

    ManagerHoursMonthReportDTO:
      type: object
      description: Whether the app offers the monthly PDF and CSV (exportManagerWorkedHoursReportPdf) for this month
      properties:
        available:
          type: boolean
          description: Equals hasWorklogs. The export also answers for a month without worklogs; this flag only says whether the app offers it.
          example: true
        provisional:
          type: boolean
          description: Equals inProgress. The PDF and the CSV cover the month only up to today, and the filename carries that date.
          example: false
        effectiveTo:
          type: string
          format: date
          description: Last day the files cover, the last day of the month, or today for the current month
          example: "2026-10-31"
      required: [available, provisional, effectiveTo]

    ManagerHoursMonthArchiveDTO:
      type: object
      description: >
        Reserved for the 4-year retention of the registro de jornada (art. 34.9 ET), which is not approved for
        implementation. Not returned in this version: the app must accept its absence and ignore it. Forwarded from
        the Main API `WorkedHoursMonthArchiveDTO` when it exists.
      properties:
        status:
          type: string
          enum: [SEALED]
          description: SEALED when a sealed copy of the closed month exists
          example: SEALED
        version:
          type: integer
          format: int32
          minimum: 1
          description: Version of the sealed copy; a correction of a closed month adds a new version
          example: 1
        sealedAt:
          type: string
          format: date-time
          description: Instant the version was sealed
          example: "2026-11-01T02:00:00Z"
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the sealed file, lowercase hexadecimal
          example: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
      required: [status, version, sealedAt, sha256]

    ManagerHoursPeopleResponseDTO:
      type: object
      description: People of the owner reports selector, current and former members (Main API getBusinessWorkedHoursPeople, forwarded)
      properties:
        people:
          type: array
          description: Ordered by name ignoring case, then userId. removedAt tells current and former members apart.
          items:
            $ref: '#/components/schemas/ManagerHoursPersonDTO'
      required: [people]

    ManagerHoursPersonDTO:
      type: object
      description: One person of the reports selector. No email and no contract detail.
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 103
        name:
          type: string
          description: Display name with the PDF rule (`Persona #<id>` when the name is empty or looks like an email)
          example: Lucía Ruiz
        avatarUrl:
          $ref: "../personalData/components.yml#/components/schemas/AvatarUrl"
        jobRoleName:
          type:
            - string
            - 'null'
          description: Job role of the contract in force today in the business time zone; null without one, and always null for a removed member
          example: Sala
        joinedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Instant the membership started, or null when unknown
          example: "2026-07-01T07:00:00Z"
        removedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Instant the person was removed from the business; null for a current member. The app lists people with removedAt in «Ya no están en el negocio».
          example: null
      required: [userId, name, avatarUrl, jobRoleName, joinedAt, removedAt]
