components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Zero-based slice number
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Number of job roles in the slice
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    ManagerBusinessDashboardResponseDTO:
      type: object
      description: Manager dashboard with aggregate business statistics
      properties:
        totalBusinesses:
          type: integer
          format: int32
          description: Total number of businesses managed by this user
          example: 4
        totalWorkers:
          type: integer
          format: int32
          description: Total number of workers across all managed businesses
          example: 41
        businesses:
          type: array
          description: List of managed businesses with summary info
          items:
            $ref: '#/components/schemas/ManagerBusinessSummaryDTO'
      required:
        - totalBusinesses
        - totalWorkers
        - businesses

    ManagerBusinessSummaryDTO:
      type: object
      description: Summary information for a business in the manager dashboard
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the business
          example: 1
        name:
          type: string
          description: Name of the business
          example: "Downtown Office"
        city:
          type: string
          description: City where the business is located
          example: "New York"
        workerCount:
          type: integer
          format: int32
          description: Number of workers in this business
          example: 12
      required:
        - id
        - name
        - city
        - workerCount

    ManagerWorkersResponseDTO:
      type: object
      description: List of workers for a specific business
      properties:
        totalWorkers:
          type: integer
          format: int32
          description: Number of returned memberships after the role filter; selected owners and managers are included
          example: 5
        workers:
          type: array
          description: List of workers
          items:
            $ref: '#/components/schemas/ManagerWorkerDTO'
      required:
        - totalWorkers
        - workers

    ManagerWorkerDTO:
      type: object
      description: Business membership projection with profile data and one nullable current contract
      properties:
        userId:
          type: integer
          format: int64
          description: Unique identifier of the worker
          example: 1
        name:
          type: string
          description: Display name of the worker
          example: "John Doe"
        email:
          type: string
          format: email
          description: Email address of the worker
          example: "john.doe@example.com"
        role:
          type: string
          description: Role of the user in the business
          enum: [OWNER, MANAGER, EMPLOYEE]
          example: "EMPLOYEE"
        currentContract:
          oneOf:
            - $ref: '#/components/schemas/ManagerCurrentContractDTO'
            - type: 'null'
          description: Contract effective on the business-local current date, or null when absent
      required:
        - userId
        - name
        - email
        - role
        - currentContract

    ManagerDayHistoryResponseDTO:
      type: object
      description: All workers' sessions for a specific day in a business
      properties:
        date:
          type: string
          format: date
          description: The date of this history entry
          example: "2025-03-10"
        totalSeconds:
          type: integer
          format: int64
          description: Total seconds worked by all workers on this date
          example: 86400
        totalWorkers:
          type: integer
          format: int32
          description: Number of workers who worked on this date
          example: 3
        workers:
          type: array
          description: Per-worker breakdown with session details
          items:
            $ref: '#/components/schemas/ManagerDayWorkerDTO'
      required:
        - date
        - totalSeconds
        - totalWorkers
        - workers

    ManagerDayWorkerDTO:
      type: object
      description: A single worker's sessions for a day
      properties:
        userId:
          type: integer
          format: int64
          description: Unique identifier of the worker
          example: 1
        name:
          type: string
          description: Display name of the worker
          example: "John Doe"
        totalSeconds:
          type: integer
          format: int64
          description: Total seconds worked by this worker on this day
          example: 30600
        sessions:
          type: array
          description: Individual work sessions
          items:
            $ref: '../common/components.yml#/components/schemas/SessionDTO'
      required:
        - userId
        - name
        - totalSeconds
        - sessions

    ManagerWeekHistoryResponseDTO:
      type: object
      description: Weekly work history for a business with per-day and per-worker totals
      properties:
        week:
          type: string
          description: ISO 8601 week identifier
          pattern: '^\d{4}-W\d{2}$'
          example: "2025-W31"
        totalSeconds:
          type: integer
          format: int64
          description: Total seconds worked by all workers in this week
          example: 432000
        days:
          type: array
          description: Per-day breakdown with worker-level totals
          items:
            $ref: '#/components/schemas/ManagerWeekDayDTO'
      required:
        - week
        - totalSeconds
        - days

    ManagerWeekDayDTO:
      type: object
      description: A single day within a manager week view, showing per-worker totals
      properties:
        date:
          type: string
          format: date
          description: The date
          example: "2025-07-28"
        totalSeconds:
          type: integer
          format: int64
          description: Total seconds worked by all workers on this day
          example: 86400
        workers:
          type: array
          description: Per-worker totals for this day (no session detail)
          items:
            $ref: '#/components/schemas/ManagerWeekDayWorkerDTO'
      required:
        - date
        - totalSeconds
        - workers

    ManagerWeekDayWorkerDTO:
      type: object
      description: A worker's total for a single day in the week view
      properties:
        userId:
          type: integer
          format: int64
          description: Unique identifier of the worker
          example: 1
        name:
          type: string
          description: Display name of the worker
          example: "John Doe"
        totalSeconds:
          type: integer
          format: int64
          description: Total seconds worked by this worker on this day
          example: 28800
      required:
        - userId
        - name
        - totalSeconds

    ManagerMonthHistoryResponseDTO:
      type: object
      description: >
        Monthly work history calendar for a business.
        Returns day-level totals with worker counts (no session detail).
      properties:
        month:
          type: string
          description: Year and month in YYYY-MM format
          pattern: '^\d{4}-\d{2}$'
          example: "2025-03"
        totalSeconds:
          type: integer
          format: int64
          description: Total seconds worked by all workers in this month
          example: 2376000
        totalSessions:
          type: integer
          format: int32
          description: Total number of work sessions in this month
          example: 100
        days:
          type: array
          description: Per-day summary for the month
          items:
            $ref: '#/components/schemas/ManagerMonthDayDTO'
      required:
        - month
        - totalSeconds
        - totalSessions
        - days

    ManagerMonthDayDTO:
      type: object
      description: A single day within a manager month view
      properties:
        date:
          type: string
          format: date
          description: The date
          example: "2025-03-01"
        totalSeconds:
          type: integer
          format: int64
          description: Total seconds worked by all workers on this day
          example: 86400
        workerCount:
          type: integer
          format: int32
          description: Number of workers who worked on this day
          example: 5
      required:
        - date
        - totalSeconds
        - workerCount

    WorklogUpdateRequestDTO:
      type: object
      description: Request to update a worklog's clock-in and/or clock-out times
      properties:
        clockIn:
          type: string
          format: date-time
          description: Updated clock-in timestamp
          example: "2025-07-29T08:30:00+02:00"
        clockOut:
          type:
            - string
            - 'null'
          format: date-time
          description: Updated clock-out timestamp (null to clear)
          example: "2025-07-29T17:30:00+02:00"

    InvitationRequestDTO:
      type: object
      description: Request to invite a user to join a business
      properties:
        email:
          type: string
          format: email
          description: Email address of the person to invite
          example: "invitee@example.com"
        role:
          type: string
          description: Role to assign to the invitee
          enum: [OWNER, MANAGER, EMPLOYEE]
          example: "OWNER"
      required:
        - email
        - role

    InvitationResponseDTO:
      type: object
      description: Invitation details
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the invitation
          example: 123
        email:
          type: string
          format: email
          description: Email address of the invitee
          example: "invitee@example.com"
        role:
          type: string
          description: Role assigned to the invitee
          enum: [OWNER, MANAGER, EMPLOYEE]
          example: "EMPLOYEE"
        status:
          type: string
          description: Current status of the invitation
          enum: [PENDING, ACCEPTED, DECLINED, EXPIRED]
          example: "PENDING"
        createdAt:
          type: string
          format: date-time
          description: When the invitation was created
          example: "2025-06-15T14:30:00+00:00"
        expiresAt:
          type: string
          format: date-time
          description: When the invitation expires
          example: "2025-06-22T14:30:00+00:00"
      required:
        - id
        - email
        - role
        - status
        - createdAt
        - expiresAt

    ManagerLocalMinuteTimeDTO:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Business-local time with minute precision in 24-hour HH:mm format
      example: "09:00"

    ManagerDayOfWeekDTO:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      example: MONDAY

    ManagerPlanningGenerationSettingsDTO:
      type: object
      description: Business-local settings that control automatic generation of the next weekly planning
      properties:
        generationDay:
          $ref: '#/components/schemas/ManagerDayOfWeekDTO'
        generationTime:
          $ref: '#/components/schemas/ManagerLocalMinuteTimeDTO'
      required: [generationDay, generationTime]

    ManagerOpeningIntervalDTO:
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/ManagerLocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/ManagerLocalMinuteTimeDTO'
      required: [startTime, endTime]

    ManagerRoleDemandDTO:
      type: object
      properties:
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          description: Stable business job-role identifier
          example: 10
        minimumEmployees:
          type: integer
          format: int32
          minimum: 0
          example: 1
        targetEmployees:
          type: integer
          format: int32
          minimum: 0
          example: 2
        maximumEmployees:
          type: integer
          format: int32
          minimum: 1
          example: 3
      required: [jobRoleId, minimumEmployees, targetEmployees, maximumEmployees]

    ManagerPlanningRoleDemandDTO:
      type: object
      description: Immutable planning demand with derived coverage from valid scheduled assignments.
      properties:
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          description: Stable business job-role identifier
          example: 10
        minimumEmployees:
          type: integer
          format: int32
          minimum: 0
          example: 1
        targetEmployees:
          type: integer
          format: int32
          minimum: 0
          example: 2
        maximumEmployees:
          type: integer
          format: int32
          minimum: 1
          example: 3
        assignedEmployees:
          type: integer
          format: int32
          minimum: 0
          description: Number of valid scheduled assignments for this demand.
        minimumDeficit:
          type: integer
          format: int32
          minimum: 0
          description: Missing employees below the minimum, never negative.
        targetDeficit:
          type: integer
          format: int32
          minimum: 0
          description: Missing employees below the target, never negative.
      required: [jobRoleId, minimumEmployees, targetEmployees, maximumEmployees, assignedEmployees, minimumDeficit, targetDeficit]

    ManagerShiftCreateRequestDTO:
      type: object
      description: Creates an active business Shift. The name is trimmed before normalized uniqueness is checked.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Morning service
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Six-digit hexadecimal display color.
          example: "#1A2B3C"
      required: [name, color]

    ManagerShiftUpdateRequestDTO:
      type: object
      description: Updates a business Shift. Setting active to true reactivates it.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Morning service
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#4C9F70"
        active:
          type: boolean
          example: true
      required: [name, color, active]

    ManagerShiftResponseDTO:
      type: object
      description: Current business-owned Shift identity and presentation.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 20
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        name:
          type: string
          minLength: 1
          example: Morning service
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#1A2B3C"
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2025-06-01T10:00:00+00:00"
        updatedAt:
          type: string
          format: date-time
          example: "2025-06-01T10:00:00+00:00"
      required: [id, businessId, name, color, active, createdAt, updatedAt]

    ManagerShiftSliceResponseDTO:
      type: object
      description: Deterministic slice of current and archived business Shifts.
      properties:
        content:
          type: array
          description: Shifts ordered by active state descending, name ascending, and ID ascending.
          items:
            $ref: '#/components/schemas/ManagerShiftResponseDTO'
        page:
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 20
        hasNext:
          type: boolean
          example: false
      required: [content, page, size, hasNext]
      example:
        content:
          - id: 20
            businessId: 101
            name: Morning service
            color: "#1A2B3C"
            active: true
            createdAt: "2025-06-01T10:00:00+00:00"
            updatedAt: "2025-06-01T10:00:00+00:00"
          - id: 21
            businessId: 101
            name: Legacy service
            color: "#808080"
            active: false
            createdAt: "2025-06-02T10:00:00+00:00"
            updatedAt: "2025-06-02T10:00:00+00:00"
        page: 0
        size: 20
        hasNext: false

    ManagerDailyShiftRequestDTO:
      type: object
      description: Day-specific occurrence values referencing a business Shift.
      properties:
        shiftId:
          type: integer
          format: int64
          minimum: 1
          example: 20
        startTime:
          $ref: '#/components/schemas/ManagerLocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/ManagerLocalMinuteTimeDTO'
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          example: 30
        demands:
          type: array
          items:
            $ref: '#/components/schemas/ManagerRoleDemandDTO'
      required: [shiftId, startTime, endTime, breakMinutes, demands]

    ManagerDailyShiftDTO:
      type: object
      description: Day-specific occurrence values enriched with the current Shift resource.
      properties:
        shift:
          $ref: '#/components/schemas/ManagerShiftResponseDTO'
        startTime:
          $ref: '#/components/schemas/ManagerLocalMinuteTimeDTO'
        endTime:
          $ref: '#/components/schemas/ManagerLocalMinuteTimeDTO'
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          example: 30
        demands:
          type: array
          items:
            $ref: '#/components/schemas/ManagerRoleDemandDTO'
      required: [shift, startTime, endTime, breakMinutes, demands]
      example:
        shift:
          id: 21
          businessId: 101
          name: Legacy service
          color: "#808080"
          active: false
          createdAt: "2025-06-02T10:00:00+00:00"
          updatedAt: "2025-06-02T10:00:00+00:00"
        startTime: "09:00"
        endTime: "17:00"
        breakMinutes: 30
        demands: []

    ManagerDailyConfigurationRequestDTO:
      type: object
      description: Complete opening intervals and Shift references for one business-local calendar day.
      properties:
        openingIntervals:
          type: array
          items:
            $ref: '#/components/schemas/ManagerOpeningIntervalDTO'
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/ManagerDailyShiftRequestDTO'
      required: [openingIntervals, shifts]

    ManagerDailyConfigurationDTO:
      type: object
      description: Complete opening intervals and enriched current Shifts for one business-local calendar day.
      properties:
        openingIntervals:
          type: array
          items:
            $ref: '#/components/schemas/ManagerOpeningIntervalDTO'
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/ManagerDailyShiftDTO'
      required: [openingIntervals, shifts]

    ManagerRecurringScheduleDayRequestDTO:
      type: object
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/ManagerDayOfWeekDTO'
        configuration:
          $ref: '#/components/schemas/ManagerDailyConfigurationRequestDTO'
      required: [dayOfWeek, configuration]

    ManagerRecurringScheduleDayDTO:
      type: object
      description: Recurring day with occurrence values and current Shift resources.
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/ManagerDayOfWeekDTO'
        configuration:
          $ref: '#/components/schemas/ManagerDailyConfigurationDTO'
      required: [dayOfWeek, configuration]

    ManagerRecurringScheduleRequestDTO:
      type: object
      description: Complete seven-day recurring schedule configuration
      properties:
        validFrom:
          type: string
          format: date
          example: "2025-07-28"
        validUntil:
          type: [string, "null"]
          format: date
          description: Inclusive end date, or null for an open-ended schedule
          example: null
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/ManagerRecurringScheduleDayRequestDTO'
      required: [validFrom, days]

    ManagerRecurringScheduleReplacementRequestDTO:
      type: object
      description: Complete versioned replacement for a recurring schedule
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: Expected root version for optimistic concurrency
          example: 2
        validFrom:
          type: string
          format: date
          example: "2025-07-28"
        validUntil:
          type: [string, "null"]
          format: date
          example: null
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/ManagerRecurringScheduleDayRequestDTO'
      required: [version, validFrom, days]

    ManagerRecurringScheduleResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 200
        version:
          type: integer
          format: int64
          minimum: 0
          example: 2
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        validFrom:
          type: string
          format: date
          example: "2025-07-28"
        validUntil:
          type: [string, "null"]
          format: date
          example: null
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/ManagerRecurringScheduleDayDTO'
        createdAt:
          type: string
          format: date-time
          example: "2025-07-27T08:00:00+02:00"
        updatedAt:
          type: string
          format: date-time
          example: "2025-07-27T08:00:00+02:00"
      required: [id, version, businessId, validFrom, validUntil, days, createdAt, updatedAt]

    ManagerScheduleExceptionRequestDTO:
      type: object
      description: Complete configuration for one immutable business-local exception date
      properties:
        date:
          type: string
          format: date
          example: "2025-08-15"
        configuration:
          $ref: '#/components/schemas/ManagerDailyConfigurationRequestDTO'
      required: [date, configuration]

    ManagerScheduleExceptionResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 700
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        date:
          type: string
          format: date
          example: "2025-08-15"
        configuration:
          $ref: '#/components/schemas/ManagerDailyConfigurationDTO'
        createdAt:
          type: string
          format: date-time
          example: "2025-08-01T10:00:00+02:00"
        updatedAt:
          type: string
          format: date-time
          example: "2025-08-01T10:00:00+02:00"
      required: [id, businessId, date, configuration, createdAt, updatedAt]

    ManagerJobRoleSummaryDTO:
      type: object
      description: Job-role identity and visual metadata used by planning views
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 10
        code:
          type: string
          example: WAITER
        name:
          type: string
          example: Waiter
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#1A2B3C"
        icon:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: front-of-house
        active:
          type: boolean
          example: true
      required: [id, code, name, color, icon, active]

    ManagerJobRoleRequestDTO:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          example: WAITER
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Waiter
        description:
          type: [string, "null"]
          maxLength: 500
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#1A2B3C"
        icon:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: front-of-house
      required: [code, name, color, icon]

    ManagerJobRoleUpdateRequestDTO:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Waiter
        description:
          type: [string, "null"]
          maxLength: 500
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#1A2B3C"
        icon:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: front-of-house
        active:
          type: boolean
          description: False deactivates the role; true reactivates it
          example: true
      required: [name, color, icon, active]

    ManagerJobRoleResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 10
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        code:
          type: string
          example: WAITER
        name:
          type: string
          example: Waiter
        description:
          type: [string, "null"]
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#1A2B3C"
        icon:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: front-of-house
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, businessId, code, name, color, icon, active, createdAt, updatedAt]

    ManagerJobRoleSliceResponseDTO:
      type: object
      description: Slice of manager job roles without a total-count query
      properties:
        content:
          type: array
          description: Job roles ordered by active state descending, name ascending, and ID ascending
          items:
            $ref: '#/components/schemas/ManagerJobRoleResponseDTO'
        page:
          type: integer
          format: int32
          minimum: 0
          description: Current page number, zero-based
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          description: Requested page size
          example: 20
        hasNext:
          type: boolean
          description: Whether another slice is available
          example: true
      required: [content, page, size, hasNext]
      example:
        content:
          - id: 10
            businessId: 101
            code: WAITER
            name: Waiter
            description: Front of house service
            color: "#1A2B3C"
            icon: front-of-house
            active: true
            createdAt: "2025-06-01T10:00:00+00:00"
