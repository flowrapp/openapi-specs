    ManagerDailyShiftRequestDTO:
      type: object
      description: >
        Day-specific occurrence values referencing a business Shift. `breakMinutes` remains
        required and is the effective value for this occurrence. Clients that create a NEW
        occurrence typically initialize it from the catalog Shift's `defaultBreakMinutes`;
        changing the catalog default never rewrites existing occurrences.
        `breakMinutes` does not include the unpaid gap of a split shift.
        Optional `segments` are the planned intervals; `startTime` and `endTime`
        stay the envelope.
        Omit `segments`, or send an empty array, for a normal shift. One or two
        elements is a split shift. The domain validates 1–2 segments only when
        the list is not empty.
        Omitting `segments`, or sending an empty array, does not make the server copy the catalog Shift's
        `defaultSegments`. The client may preload the editor from that default
        when creating a new occurrence, recurring template or requirement; only
        the segments sent here are stored. A later edit of the catalog default
        does not change this occurrence, its planning snapshot or its assignments.
      properties:
        shiftId:
          type: integer
          format: int64
          minimum: 1
          example: 20
        startTime:
          $ref: "#/components/schemas/ManagerLocalMinuteTimeDTO"
        endTime:
          $ref: "#/components/schemas/ManagerLocalMinuteTimeDTO"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned break of the shift, in minutes. It does not include the
            unpaid gap between segments.
          example: 30
        segments:
          type: array
          maxItems: 2
          description: >
            Planned segments. Omit, or send an empty array, for a normal shift,
            whose only interval is the envelope. One or two elements is a split
            shift. The domain validates 1–2 segments only when the list is not
            empty. See `ShiftSegmentDTO`.
          items:
            $ref: "../common/components.yml#/components/schemas/ShiftSegmentDTO"
        demands:
          type: array
          items:
            $ref: "#/components/schemas/ManagerRoleDemandDTO"
      required: [shiftId, startTime, endTime, breakMinutes, demands]

    ManagerDailyShiftDTO:
      type: object
      description: >
        Day-specific occurrence values enriched with the current Shift resource.
        `startTime` and `endTime` are the envelope. Optional `segments` carries
        a split shift.
      properties:
        shift:
          $ref: "#/components/schemas/ManagerShiftResponseDTO"
        startTime:
          $ref: "#/components/schemas/ManagerLocalMinuteTimeDTO"
        endTime:
          $ref: "#/components/schemas/ManagerLocalMinuteTimeDTO"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned break of the shift, in minutes. It does not include the
            unpaid gap between segments.
          example: 30
        segments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Planned segments. Omitted for a normal shift. See `ShiftSegmentDTO`.
          items:
            $ref: "../common/components.yml#/components/schemas/ShiftSegmentDTO"
        demands:
          type: array
          items:
            $ref: "#/components/schemas/ManagerRoleDemandDTO"
      required: [shift, startTime, endTime, breakMinutes, demands]
      example:
        shift:
          id: 21
          businessId: 101
          name: Legacy service
          color: "#808080"
          defaultStartAt: "09:00:00"
          defaultEndAt: "17:00:00"
          defaultBreakMinutes: 30
          active: false
          createdAt: "2025-06-02T10:00:00+00:00"
          updatedAt: "2025-06-02T10:00:00+00:00"
        startTime: "09:00"
        endTime: "17:00"
        breakMinutes: 30
        demands: []

