    InvitationRequestDTO:
      type: object
      description: Request to invite a user to join a business
      properties:
        email:
          type: string
          format: email
          description: Email address of the person to invite
          example: "invitee@example.com"
        role:
          type: string
          description: Role to assign to the invitee
          enum: [OWNER, EMPLOYEE]
          example: "OWNER"
        contract:
          oneOf:
            - $ref: "#/components/schemas/InvitationContractDTO"
            - type: "null"
          description: Optional contract proposal. When absent, acceptance creates a 40-hour GENERAL job contract.
        identityDocument:
          description: >
            Optional identity document, passed through to the Main API. Omit it
            or send null to invite without one. Only the OWNER may send a
            document: a non-owner who sends one receives 403 1020 even with
            `TEAM_INVITE`. The response never includes the document. It is
            deleted as soon as the invitation expires, with no retention period.
            A resend after expiry comes back without it. A resend before expiry
            keeps it. Decline clears it. Revoke deletes the row. Accept copies
            it onto the membership and then clears it on the invitation.
          oneOf:
            - $ref: "../personalData/components.yml#/components/schemas/IdentityDocumentRequestDTO"
            - type: "null"
      required:
