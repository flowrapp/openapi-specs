components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Zero-based slice number
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Number of job roles in the slice
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    ManagerBusinessProfileUpdateRequestDTO:
      type: object
      description: Complete replacement of the editable business profile fields
      additionalProperties: false
      properties:
        nif:
          type: string
          minLength: 1
          description: Tax identification number for the business
          example: B12345678
        name:
          type: string
          minLength: 1
          description: Name of the business
          example: Coffee Time
        address:
          type: string
          minLength: 1
          description: Address of the business
          example: C/Sin nombre 453
        town:
          type: string
          minLength: 1
          description: Town of the business
          example: Barbate
        city:
          type: string
          minLength: 1
          description: City of the business
          example: Cádiz
        country:
          type: string
          minLength: 1
          description: Country of the business
          example: España
        postalCode:
          type: string
          minLength: 1
          description: Postal code of the business
          example: "11160"
      required: [nif, name, address, town, city, country, postalCode]

    ManagerBusinessDashboardResponseDTO:
      type: object
      description: Manager dashboard with aggregate business statistics and an optional selected-business home view
      properties:
        totalBusinesses:
          type: integer
          format: int32
          description: Total number of businesses managed by this user
          example: 4
        totalWorkers:
          type: integer
          format: int32
          description: Total number of workers across all managed businesses
          example: 41
        businesses:
          type: array
          description: List of managed businesses with summary info
          items:
            $ref: "#/components/schemas/ManagerBusinessSummaryDTO"
        home:
          $ref: "#/components/schemas/ManagerBusinessHomeDTO"
      required:
        - totalBusinesses
        - totalWorkers
        - businesses

    ManagerBusinessHomeDTO:
      type: object
      description: |
        Present only when businessId selects a business managed by the authenticated user.
        Times and dates use the selected business's IANA time zone.

        Home admin v3.2 additive blocks (`workingNow.byJobRole`, `attendanceToday.missing` /
        `upcoming`, `teamHours.plannedSeconds`, `attention`, `nextWeek`) are optional for
        compatibility. They are composed from existing Main API reads (no Main change), with
        bounded concurrency (`parZip`, `Semaphore(8)`), without sweeping the whole team and
        without in-memory filters over complete team collections (only grouping of the day's /
        week's bounded responses).

        OWNER vs MANAGER: blocks that depend on Main `getDailyAttendance`, attendance hours
        (`getDailyAttendance` planned metrics / BFF `getAttendanceHours`) or planning+coverage
        are filled only when the caller is OWNER (Main limits those reads to OWNER). For a
        MANAGER they are omitted or null. Composing them never returns 403: the dashboard
        already admits MANAGER; privileges are not elevated and attendance data is never
        returned to MANAGER. Checklist remains front-only (no backend field).
      properties:
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 1
        zone:
          type: string
          description: IANA time zone of the selected business
          example: America/New_York
        date:
          type: string
          format: date
          description: Today in the business's time zone
          example: "2026-09-24"
        asOf:
          type: string
          format: date-time
          description: Snapshot instant used for current presence and running totals, with the business-local offset
          example: "2026-09-24T10:30:00-04:00"
        workingNow:
          type: object
          description: >
            Distinct workers with an open worklog at asOf, ordered by clockIn ascending, then
            userId ascending. Optional `byJobRole` (OWNER) groups fichados vs planificados ahora
            by job role from the same day's attendance rows.
          properties:
            count:
              type: integer
              format: int32
              minimum: 0
              description: Number of returned workers
            workers:
              type: array
              items:
                $ref: "#/components/schemas/ManagerWorkingNowWorkerDTO"
            byJobRole:
              type: [array, "null"]
              description: |
                OWNER only (omitted or null for MANAGER). One entry per job role present among
                today's attendance rows that are either clocked-open or planned-in-progress at
                `asOf`, plus a `jobRole: null` group when there are fichados/planificados without
                a puesto (UNMATCHED / no job role).

                Semántica: `working` = rows with `clocked.open` in that job-role group;
                `scheduledNow` = rows where `asOf` falls inside a planned segment
                (`segment.startAt <= asOf < segment.endAt`). During the unpaid gap of a
                split shift the row is not `scheduledNow`. One row per shift, not per
                segment. Composed from existing `home.workingNow` plus Main
                `getDailyAttendance` (today), grouping by `row.jobRole`. Not plantilla,
                not current contracts, and not P4a `memberCount`.
              items:
                $ref: "#/components/schemas/ManagerHomeWorkingNowByJobRoleDTO"
          required: [count, workers]
        attendanceToday:
          type: object
          description: >
            Distinct workers with at least one worklog overlapping today's business-local date
            before asOf, ordered by firstClockIn ascending, then userId ascending. Optional
            `missing` / `upcoming` (OWNER) come from the day's attendance list.
          properties:
            count:
              type: integer
              format: int32
              minimum: 0
              description: Number of returned workers
            workers:
              type: array
              items:
                $ref: "#/components/schemas/ManagerAttendanceTodayWorkerDTO"
            missing:
              type: [integer, "null"]
              format: int32
              minimum: 0
              description: |
                OWNER only (omitted or null for MANAGER). Count of attendance/day rows whose
                severity is CRITICAL because of chips `NO_SHOW` or `MISSING_CLOCK_IN` (not every
                incident). From the same Main `getDailyAttendance(today)` composition.
              example: 1
            upcoming:
              type: [integer, "null"]
              format: int32
              minimum: 0
              description: |
                OWNER only (omitted or null for MANAGER). `counts.upcoming` of attendance/day.
                A shift counts once. A split shift counts in upcoming while a later segment
                has not started, including during the unpaid gap, and is not also a second
                row. Front copy «N entran más tarde».
              example: 4
          required: [count, workers]
        teamHours:
          type: object
          description: >
            Team time worked in the current business-local ISO week, clipped at asOf for open
            worklogs; excludes future time. Optional `clockedSeconds`, `pendingReviewSeconds` and
            `plannedSeconds` (OWNER) come from the same BFF attendance/hours totals for the Home
            «Horas semana» card (since BFF 0.0.106 `clockedSeconds` is confirmed only and pending
            is apart). Legacy `totalSeconds` stays unchanged for compatibility and must not be mixed
            with `plannedSeconds` on that card.
          properties:
            week:
              type: string
              pattern: '^\d{4}-W\d{2}$'
              description: ISO week containing date
              example: 2026-W39
            totalSeconds:
              type: integer
              format: int64
              minimum: 0
              description: >
                Legacy dashboard sum of the seven daily totals in seconds (clipped at asOf).
                Kept for compatibility. The Home «Horas semana» card must NOT pair this with
                `plannedSeconds`; use `clockedSeconds` + `plannedSeconds` from attendance/hours
                instead (criteria for open/rejected worklogs can differ).
            clockedSeconds:
              type: [integer, "null"]
              format: int64
              minimum: 0
              description: |
                OWNER only when attendance/hours is available (omitted or null for MANAGER).
                `getAttendanceHours` → `totals.clockedSeconds` for the current business-local
                ISO week: closed CONFIRMED + APPROVED only since BFF 0.0.106 (up to 0.0.105
                reportable + pending); same source as `plannedSeconds`. Pair with
                `plannedSeconds` on the Home hours card; do not mix with legacy `totalSeconds`.
              example: 48720
            pendingReviewSeconds:
              type: [integer, "null"]
              format: int64
              minimum: 0
              description: |
                OWNER only when attendance/hours is available (omitted or null for MANAGER).
                `getAttendanceHours` → `totals.pendingReviewSeconds` of the same week (BFF
                0.0.106): pending time NOT included in `clockedSeconds`, shown apart as
                «+X h pendientes de revisar». Absent or null: show nothing.
              example: 3600
            plannedSeconds:
              type: [integer, "null"]
              format: int64
              minimum: 0
              description: |
                OWNER only when attendance/hours is available (omitted or null for MANAGER).
                Planned seconds of the current business-local ISO week from BFF
                `getAttendanceHours` → `totals.plannedSeconds` (Main `getDailyAttendance`
                `metrics.plannedSeconds` of the published plan). Null means no published
                schedule for the week (distinguish from 0 = plan with 0 h); when null,
                `clockedSeconds` is still present for OWNER. Does not change `totalSeconds`.
                Pair with `clockedSeconds`, never with legacy `totalSeconds`.
              example: 1764000
            days:
              type: array
              minItems: 7
              maxItems: 7
              description: Exactly seven business-local dates ordered Monday through Sunday; future dates have zero seconds
              items:
                $ref: "#/components/schemas/ManagerTeamHoursDayDTO"
          required: [week, totalSeconds, days]
        presence:
          type: array
          minItems: 23
          maxItems: 25
          description: >
            One point at the start of every hour of date in the business's time zone, ordered by
            instant. Includes future hours with zero present workers. A local day has 23, 24 or 25
            points across daylight-saving changes; offsets distinguish repeated local hours.
            Each count is the number of distinct workers whose worklog includes that instant
            (clockIn <= at < clockOut, or clockOut is open and at <= asOf).
          items:
            $ref: "#/components/schemas/ManagerPresencePointDTO"
        attention:
          description: |
            OWNER only (omitted or null for MANAGER). «Requiere atención» strip: incident total
            and up to the first 3 INCIDENTS rows of BFF attendance/day (same order). Front
            actions already exist: Recordar = `notifyAttendanceShiftClockIn`, Revisar = attendance
            detail. Never 403 for composing.
          oneOf:
            - $ref: "#/components/schemas/ManagerHomeAttentionDTO"
            - type: "null"
        nextWeek:
          description: |
            OWNER only (omitted or null for MANAGER). Next ISO week after `date`: planning status
            and number of PEOPLE still missing from the planned assignments. For each cell (local
            date, shift, job role), the deficit is `max(max(minimum, target) - assigned, 0)`;
            `gapCount` is the sum of those deficits. Composed from Main `getPlanning(week+1)`
            plus `getPlanningGenerationInput` when the planning is DRAFT or PUBLISHED. This is
            intentionally NOT Horario H5 `publishCoverageGaps`, which counts one gap per
            under-covered cell rather than missing people (Sergio, 2026-11-06). Only computable
            when a planning exists to evaluate; without planning → `status: NONE`,
            `gapCount: null`. Do not use `shortfallSeconds` as gaps. Front copy says people,
            not ambiguous "huecos"; CTA opens PlanWeek.
          oneOf:
            - $ref: "#/components/schemas/ManagerHomeNextWeekDTO"
            - type: "null"
      required:
        [
          businessId,
          zone,
          date,
          asOf,
          workingNow,
          attendanceToday,
          teamHours,
          presence,
        ]

    ManagerHomeJobRoleDTO:
      type: object
      description: >
        Compact job-role ref for home cards (`id`, `name`, `color`). Color is the business job
        role colour (same hex as the manager job-role catalog). Flat DTO: attendance's
        `AttendanceJobRoleDTO` has no color.
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 3
        name:
          type: string
          minLength: 1
          example: Barra
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#4C9F70"
      required: [id, name, color]

    ManagerHomeWorkingNowByJobRoleDTO:
      type: object
      description: >
        Fichados vs planificados ahora for one job-role group on the home «Trabajando ahora»
        breakdown. Not plantilla / contracts / memberCount.
      additionalProperties: false
      properties:
        jobRole:
          description: Job role of the group, or null for fichados/planificados without a puesto
          oneOf:
            - $ref: "#/components/schemas/ManagerHomeJobRoleDTO"
            - type: "null"
        working:
          type: integer
          format: int32
          minimum: 0
          description: Rows with an open worklog (`clocked.open`) in this job-role group
          example: 2
        scheduledNow:
          type: integer
          format: int32
          minimum: 0
          description: >
            Rows whose `asOf` falls inside a planned segment
            (`segment.startAt <= asOf < segment.endAt`) in this job-role group.
            A split shift in its unpaid gap is not counted. One count per shift.
          example: 2
      required: [jobRole, working, scheduledNow]

    ManagerHomeAttentionDTO:
      type: object
      description: >
        OWNER-only attention strip from attendance/day. `incidentCount` equals
        `counts.incidents`; `rows` are the first at most 3 rows with section INCIDENTS in BFF
        attendance/day order.
      additionalProperties: false
      properties:
        incidentCount:
          type: integer
          format: int32
          minimum: 0
          description: Same as attendance/day `counts.incidents`
          example: 4
        rows:
          type: array
          maxItems: 3
          description: First ≤3 INCIDENTS rows in attendance/day order
          items:
            $ref: "#/components/schemas/ManagerHomeAttentionRowDTO"
      required: [incidentCount, rows]

    ManagerHomeAttentionRowDTO:
      type: object
      description: |
        Compact INCIDENTS row for the home attention strip. Reuses attendance enums and
        `AttendanceClockInNoticeStateDTO` via $ref; ids/name/jobRole/plannedStartAt are flattened
        from the day row (worker, detailRef, planned, chips[0]).
      additionalProperties: false
      properties:
        attendanceMatchId:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: >
            Set for UNMATCHED rows (`detailRef.attendanceMatchId`); null for SHIFT
          example: null
        scheduledShiftId:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: >
            Set for SHIFT rows (`detailRef.scheduledShiftId`); null for UNMATCHED
          example: 900
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 103
        name:
          type: string
          minLength: 1
          example: Carlos Vega
        avatarUrl:
          $ref: "../personalData/components.yml#/components/schemas/AvatarUrl"
        jobRole:
          description: Job role of the row, or null when none
          oneOf:
            - $ref: "#/components/schemas/ManagerHomeJobRoleDTO"
            - type: "null"
        chipType:
          description: >
            Primary chip (`chips[0].type`) — Main incident type or shift alert
          $ref: "../attendance/components.yml#/components/schemas/AttendanceChipTypeDTO"
        severity:
          $ref: "../attendance/components.yml#/components/schemas/AttendanceSeverityDTO"
        plannedStartAt:
          type: [string, "null"]
          format: date-time
          description: >
            Envelope start (`planned.startAt`, the first segment) when the row has a
            planned shift; null for UNMATCHED. The segment «Recordar» targets is
            `clockInNotice.segmentIndex` and `clockInNotice.segmentStartAt`, not this
            envelope start.
          example: "2026-09-24T08:00:00-04:00"
        clockInNotice:
          description: >
            Complete `clockInNotice` state of the attendance day row, with `lastNotice` and
            `blocker`. «Recordar» is enabled when `blocker` is null; otherwise front shows that
            blocker (OUTSIDE_WINDOW, ALREADY_CLOCKED_IN, MEMBER_NOT_ELIGIBLE or TOO_SOON) without
            recomputing server rules. Null for an UNMATCHED row. Recordar = existing
            `notifyAttendanceShiftClockIn`; front never promises push delivery.
          oneOf:
            - $ref: "../attendance/components.yml#/components/schemas/AttendanceClockInNoticeStateDTO"
            - type: "null"
      required:
        [
          attendanceMatchId,
          scheduledShiftId,
          userId,
          name,
          avatarUrl,
          jobRole,
          chipType,
          severity,
          plannedStartAt,
          clockInNotice,
        ]

    ManagerHomeNextWeekStatusDTO:
      type: string
      description: >
        Planning status of the next ISO week, or `NONE` when there is no planning to evaluate.
        Open set aligned with Main `PlanningStatusDTO` plus `NONE`; clients must tolerate
        unknown values.
      enum: [NONE, CREATED, SOLVING, DRAFT, PUBLISHED, ARCHIVED, FAILED]
      example: DRAFT

    ManagerHomeNextWeekDTO:
      type: object
      description: |
        Next ISO week card. `gapCount` is the number of assignment gaps with the same semantics
        as Horario H5 `publishCoverageGaps(planAssignmentsByCell(planning, coverage))` — per
        cell shortfall vs minimum (danger) or target (warning) from planning assignments joined
        with coverage demand. Not `shortfallSeconds`. Null when there is no planning
        (published or draft) to evaluate (`status` is then `NONE`).
      additionalProperties: false
      properties:
        week:
          type: string
          pattern: '^\d{4}-W\d{2}$'
          description: ISO week immediately after the week of `date`
          example: 2026-W40
        status:
          $ref: "#/components/schemas/ManagerHomeNextWeekStatusDTO"
        gapCount:
          type: [integer, "null"]
          format: int32
          minimum: 0
          description: >
            Number of people still missing: sum per cell (local date, shift, job role) of
            `max(max(minimum, target) - assigned, 0)`. NOT a count of under-covered cells:
            Horario H5 `publishCoverageGaps` uses that different unit. Null when status is NONE
            / no planning to evaluate.
          example: 1
      required: [week, status, gapCount]

    ManagerWorkingNowWorkerDTO:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 11
        name:
          type: string
          example: Alex Morgan
        avatarUrl:
          $ref: "../personalData/components.yml#/components/schemas/AvatarUrl"
        clockIn:
          type: string
          format: date-time
          description: Start of the currently open worklog, with the business-local offset
          example: "2026-09-24T08:30:00-04:00"
      required: [userId, name, avatarUrl, clockIn]

    ManagerAttendanceTodayWorkerDTO:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 13
        name:
          type: string
          example: Sam Rivera
        avatarUrl:
          $ref: "../personalData/components.yml#/components/schemas/AvatarUrl"
        firstClockIn:
          type: string
          format: date-time
          description: Earliest worklog start overlapping today; may precede local midnight
          example: "2026-09-24T06:00:00-04:00"
        lastClockOut:
          type: [string, "null"]
          format: date-time
          description: Latest end of today's worklogs, or null if the worker is still working
          example: "2026-09-24T08:00:00-04:00"
        totalSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Seconds worked during today's local date up to asOf, including open worklogs
          example: 7200
      required: [userId, name, avatarUrl, firstClockIn, lastClockOut, totalSeconds]

    ManagerTeamHoursDayDTO:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Business-local calendar date
          example: "2026-09-24"
        totalSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Team seconds worked on this date up to asOf
          example: 19800
      required: [date, totalSeconds]

    ManagerPresencePointDTO:
      type: object
      properties:
        at:
          type: string
          format: date-time
          description: Start instant of a business-local hour with its offset
          example: "2026-09-24T09:00:00-04:00"
        workerCount:
          type: integer
          format: int32
          minimum: 0
          description: Distinct workers present at this instant
          example: 2
      required: [at, workerCount]

    ManagerBusinessSummaryDTO:
      type: object
      description: Summary information for a business in the manager dashboard
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the business
          example: 1
        name:
          type: string
          description: Name of the business
          example: "Downtown Office"
        city:
          type: string
          description: City where the business is located
          example: "New York"
        workerCount:
          type: integer
          format: int32
          description: Number of workers in this business
          example: 12
      required:
        - id
        - name
        - city
        - workerCount

    ManagerWorkersResponseDTO:
      type: object
      description: List of workers for a specific business
      properties:
        totalWorkers:
          type: integer
          format: int32
          description: Number of returned memberships after the role filter; selected owners and managers are included
          example: 5
        workers:
          type: array
          description: List of workers
          items:
            $ref: "#/components/schemas/ManagerWorkerDTO"
      required:
        - totalWorkers
        - workers

    ManagerWorkerDTO:
      type: object
      description: Business membership projection with profile data and one nullable current contract
      properties:
        userId:
          type: integer
          format: int64
          description: Unique identifier of the worker
          example: 1
        name:
          type: string
          description: Display name of the worker
          example: "John Doe"
        email:
          type: string
          format: email
          description: Email address of the worker
          example: "john.doe@example.com"
        avatarUrl:
          $ref: "../personalData/components.yml#/components/schemas/AvatarUrl"
        role:
          type: string
          description: Role of the user in the business
          enum: [OWNER, EMPLOYEE]
          example: "EMPLOYEE"
        currentContract:
          oneOf:
            - $ref: "#/components/schemas/ManagerCurrentContractDTO"
            - type: "null"
          description: Contract effective on the business-local current date, or null when absent
      required:
        - userId
        - name
        - email
        - avatarUrl
        - role
        - currentContract

    ManagerDayHistoryResponseDTO:
      type: object
      description: >
        All workers' sessions for a specific day in a business. Since BFF 0.0.107 (option B) the
        totals count only CONFIRMED + APPROVED, the same rule as `history/week` and `history/month`;
        pending is apart in `pendingSeconds` and REJECTED counts in neither. A worklog counts in the
        business-local day of its clock-in.
      properties:
        date:
          type: string
          format: date
          description: The date of this history entry
          example: "2025-03-10"
        totalSeconds:
          type: integer
          format: int64
          description: >
            Closed CONFIRMED + APPROVED seconds of all workers on this date, net of effective breaks:
            the sum of `workers[].totalSeconds`. Up to BFF 0.0.106 it summed every closed session,
            pending and REJECTED included.
          example: 86400
        pendingSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Pending seconds of all workers on this date, the sum of `workers[].pendingSeconds`: closed PENDING_REVIEW + PENDING_RECONCILIATION worklogs, net of effective breaks
            (BFF 0.0.107). NOT included in `totalSeconds`; the app shows it apart as «+X h pendientes».
            0 means nothing pending; absent means the pending read failed or an older BFF, and the
            app shows nothing.
          example: 7200
        totalWorkers:
          type: integer
          format: int32
          description: >
            Number of `workers` items: workers with at least one session that day, whatever its
            review status (unchanged)
          example: 3
        workers:
          type: array
          description: >
            Per-worker breakdown with session details. Unchanged membership: a worker with at least
            one session that day, also when every session is pending or REJECTED (then
            `totalSeconds: 0`)
          items:
            $ref: "#/components/schemas/ManagerDayWorkerDTO"
      required:
        - date
        - totalSeconds
        - totalWorkers
        - workers

    ManagerDayWorkerDTO:
      type: object
      description: A single worker's sessions for a day
      properties:
        userId:
          type: integer
          format: int64
          description: Unique identifier of the worker
          example: 1
        name:
          type: string
          description: Display name of the worker
          example: "John Doe"
        avatarUrl:
          $ref: "../personalData/components.yml#/components/schemas/AvatarUrl"
        totalSeconds:
          type: integer
          format: int64
          description: >
            Closed CONFIRMED + APPROVED seconds of this worker on this day, net of effective breaks
            (BFF 0.0.107; before, every closed session, pending and REJECTED included)
          example: 30600
        pendingSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Pending seconds of this worker on this day: closed PENDING_REVIEW + PENDING_RECONCILIATION worklogs, net of effective breaks
            (BFF 0.0.107). NOT included in `totalSeconds`; the app shows it apart as «+X h pendientes».
            0 means nothing pending; absent means the pending read failed or an older BFF, and the
            app shows nothing.
          example: 0
        sessions:
          type: array
          description: >
            Individual work sessions, unchanged: every session of the day, whatever its review
            status, each with its own `durationSeconds`. Since BFF 0.0.108 each session carries its
            optional `reviewStatus`, which tells where it counts (`totalSeconds`, `pendingSeconds`
            or, for REJECTED, neither)
          items:
            $ref: "../common/components.yml#/components/schemas/SessionDTO"
      required:
        - userId
        - name
        - avatarUrl
        - totalSeconds
        - sessions

    ManagerWeekHistoryResponseDTO:
      type: object
      description: Weekly work history for a business with per-day and per-worker totals
      properties:
        week:
          type: string
          description: ISO 8601 week identifier
          pattern: '^\d{4}-W\d{2}$'
          example: "2025-W31"
        totalSeconds:
          type: integer
          format: int64
          description: >
            Closed CONFIRMED + APPROVED seconds of all workers in this week, net of effective breaks
