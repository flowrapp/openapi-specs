components:
  schemas:
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details response for a BFF business error
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "1046 - planning not found"
        instance:
          type: string
          format: uri
      required: [status, detail]

    WorklogChangeConfirmationStatusDTO:
      type: string
      description: >-
        Main API confirmation status. PENDING means unanswered; ACKNOWLEDGED means reviewed;
        DISPUTED records disagreement. Neither answer is legal consent or claim.
      enum: [PENDING, ACKNOWLEDGED, DISPUTED]
      example: PENDING

    WorklogChangeConfirmationDTO:
      type: object
      description: Main API worker confirmation of one management worklog change.
      properties:
        status:
          $ref: '#/components/schemas/WorklogChangeConfirmationStatusDTO'
        comment:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
          description: Optional worker comment, trimmed; null while PENDING or when none was given.
          example: "I left at 17:00, not at 16:30."
        respondedBy:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: User who answered (the worker of the change); null while PENDING.
          example: 41
        respondedAt:
          type: [string, 'null']
          format: date-time
          description: When the worker answered; null while PENDING.
          example: "2026-10-31T09:12:40+01:00"
        version:
          type: integer
          format: int64
          minimum: 0
          description: Confirmation version to send when answering (0 while PENDING).
          example: 0
      required: [status, comment, respondedBy, respondedAt, version]

    SessionDTO:
      type: object
      description: A single work session (clock-in/clock-out pair)
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the worklog
          example: 123
        clockIn:
          type: string
          format: date-time
          description: Timestamp when the user clocked in
          example: "2025-07-29T08:30:00+02:00"
        clockOut:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp when the user clocked out (null if session is still active)
          example: "2025-07-29T17:30:00+02:00"
        durationSeconds:
          type:
            - integer
            - 'null'
          format: int64
          description: >
            Worked seconds of the session, net of breaks: `clockOut - clockIn` minus every EFFECTIVE
            closed break of the worklog (BFF 0.0.73; before, the gross interval). Same rule as the Main
            API `reportableSeconds`, so the sum of a day's sessions matches the reports-based week and
            month totals for those worklogs. Never negative. Null while the session is still active.
          example: 30600
        reviewStatus:
          $ref: "../attendance/components.yml#/components/schemas/AttendanceReviewStatusDTO"
          description: >
            Review status of the worklog (BFF 0.0.108), Main API `WorkLogResponseDTO.reviewStatus`
            passed through, in every response that returns a `SessionDTO`: manager day history,
            worker clock view (`activeWorklog`, `sessions`), worker day and week history, clock-in,
            clock-out and `managerUpdateWorklog`.
            - For closed sessions, it says where the session's `durationSeconds` counts:
              CONFIRMED/APPROVED in `totalSeconds`, PENDING_REVIEW/PENDING_RECONCILIATION in
              `pendingSeconds`, REJECTED in neither. So the closed sessions of a day add up to
              `totalSeconds + pendingSeconds` once REJECTED ones are left out. The app shows the
              chip «Pendiente de revisar» for PENDING_* and «Rechazada» for REJECTED, and no chip
              for CONFIRMED/APPROVED.
            - An open session (`clockOut` null) carries its current status, normally CONFIRMED
              (Main creates worklogs CONFIRMED and moves them to PENDING_RECONCILIATION when they
              close). It counts in no total, whatever its status, and its `durationSeconds` is null.
            - Absent from a BFF older than 0.0.108, or when Main sends a value the BFF does not
              know: the app shows no chip.
          example: CONFIRMED
      required:
        - id
        - clockIn

    LocationDTO:
      type: object
      description: Business geofence center and radius in meters
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude coordinate
          example: 36.19
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude coordinate
          example: -5.99
        area:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Geofence area radius in meters
          example: 50.0
      required:
        - latitude
        - longitude
        - area

    ShiftSegmentDTO:
      type: object
      additionalProperties: false
      description: >
        One planned interval of a recurring template, a schedule exception, a
        planning requirement or a coverage shift, in business-local `HH:mm`.
        A shift is one aggregate with one or two of these intervals (a split
        shift, for example 10:00–14:00 and 18:00–23:00). This is not a clocked
        worklog. Clocked intervals are `AttendanceClockedDTO.segments` and
        attendance `timeline.segments` (`AttendanceSegmentDTO`).

        When the parent `segments` array is non-empty it has one or two items,
        ordered by start, with no overlap and a gap of at least one minute.
        All segments share the shift's logical day. The first segment of a
        split shift does not cross midnight; only the last segment may. Each
        segment must lie entirely inside that day's opening intervals. The gap
        is not `breakMinutes`, and opening hours are checked per segment.
        The parent `startTime` and `endTime` stay required and are the envelope
        (first start, last end). On `ManagerDailyShiftRequestDTO`, omit
        `segments`, or send an empty array, for a normal shift. One segment
        equal to the envelope is also a normal shift. A mismatch is `400` `1050` on a
        recurring template or `400` `1053` on a day's exception.
        `breakMinutes` does not include the unpaid gap and must be strictly
        less than the sum of the segment durations. Net time is that sum minus
        `breakMinutes`. The catalog shift may store this same `HH:mm` shape as
        optional `defaultSegments`. That value is a client preload only: the
        server does not copy it when `segments` is omitted.
      properties:
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Business-local start, minute precision.
          example: "10:00"
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: >
            Business-local end. On the last segment only, a time not later than
            the start ends the next day.
          example: "14:00"
      required: [startTime, endTime]

    ScheduledShiftSegmentDTO:
      type: object
      additionalProperties: false
      description: >
        One planned interval of an assigned shift, as offset-aware instants
        with minute precision. Not a clocked worklog: clocked intervals are
        `AttendanceClockedDTO.segments` and attendance `timeline.segments`.
        Several worklogs may reference the same `scheduledShiftId`.

        The parent `segments` array, when non-empty, has one or two items,
        ordered by `startAt`, non-overlapping, with a gap of at least one
        minute, on the same logical day. Only the last segment may cross
        midnight. Each segment must lie inside the day's opening intervals.
        The parent `startAt` and `endAt` are the envelope and stay required.
        On `ManagerScheduledShiftRequestDTO` and `ShiftChangeProposalWindowDTO`,
        omit `segments`, or send an empty array, for a normal shift. One
        segment equal to the envelope is also a normal shift. An envelope that
        does not match is `400` `1047`.
        `breakMinutes` does not include the unpaid gap. Net seconds
        (`durationSeconds`, `netSeconds`, `plannedSeconds`) are the sum of the
        segment durations minus `breakMinutes`, never negative. The gap is
        reserved: the same person cannot hold another shift inside the
        envelope (`400` `1047` on a draft replace, `SHIFT_OVERLAP` on a
        shift-change proposal). A split shift is exchanged or corrected whole.
      properties:
        startAt:
          type: string
          format: date-time
          description: Offset-aware start of this segment.
          example: "2026-10-30T10:00:00+02:00"
        endAt:
          type: string
          format: date-time
          description: >
            Offset-aware end of this segment. Only the last segment of the
            shift may fall on the next local date.
          example: "2026-10-30T14:00:00+02:00"
      required: [startAt, endAt]
