components:
  schemas:
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details response for a BFF business error
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "1046 - planning not found"
        instance:
          type: string
          format: uri
      required: [status, detail]

    SessionDTO:
      type: object
      description: A single work session (clock-in/clock-out pair)
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the worklog
          example: 123
        clockIn:
          type: string
          format: date-time
          description: Timestamp when the user clocked in
          example: "2025-07-29T08:30:00+02:00"
        clockOut:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp when the user clocked out (null if session is still active)
          example: "2025-07-29T17:30:00+02:00"
        durationSeconds:
          type:
            - integer
            - 'null'
          format: int64
          description: >
            Worked seconds of the session, net of breaks: `clockOut - clockIn` minus every EFFECTIVE
            closed break of the worklog (BFF 0.0.73; before, the gross interval). Same rule as the Main
            API `reportableSeconds`, so the sum of a day's sessions matches the reports-based week and
            month totals for those worklogs. Never negative. Null while the session is still active.
          example: 30600
      required:
        - id
        - clockIn

    LocationDTO:
      type: object
      description: Business geofence center and radius in meters
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude coordinate
          example: 36.19
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude coordinate
          example: -5.99
        area:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Geofence area radius in meters
          example: 50.0
      required:
        - latitude
        - longitude
        - area
