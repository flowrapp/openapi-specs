components:
  schemas:
    SyncReadyEvent:
      type: object
      description: First event sent when the business event stream opens successfully.
      properties:
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
      required: [businessId]

    SyncEvent:
      type: object
      description: Invalidation signal; it contains no business data or recipient information.
      properties:
        businessId:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Business scope of the change, or null when the signal is user-scoped.
          example: 101
        topics:
          type: array
          description: Changed data areas. Clients MUST ignore topic values they do not recognize.
          items:
            $ref: '#/components/schemas/SyncTopic'
          example: [WORKLOGS, REPORTS]
      required: [businessId, topics]

    SyncTopic:
      type: string
      description: >-
        Data area that changed. This enum is open for forward compatibility; clients MUST ignore
        unknown values rather than fail to parse the event.
      enum: [WORKLOGS, ATTENDANCE, SCHEDULE, SHIFT_CHANGES, REPORTS]
      example: WORKLOGS
