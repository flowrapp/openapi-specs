components:
  schemas:
    WorkedHoursReportPeriodTypeDTO:
      type: string
      description: |
        Period type of a worked-hours report. It selects the report layout (title, grouping and
        subtotals) and how from and to are validated. from and to are calendar days in the
        business time zone, both inclusive.
        - MONTH: from and to must cover exactly one calendar month (from is the first day and to
          is the last day of the same month).
        - YEAR: from and to must cover exactly one complete calendar year (from is January 1 and
          to is December 31 of the same year). Fiscal or rolling 12-month years are not supported.
        - RANGE: any from and to with from on or before to, exactly as before this field existed.
        For every period type, the period may end after today: send the full period (for example
        MONTH 2026-11-01 to 2026-11-30, or YEAR 2026-01-01 to 2026-12-31) and the server truncates
        the effective end to today in the business time zone. A period whose from is after today
        is rejected with 400.
        When omitted, RANGE is used. Nothing is inferred from the dates.
        If from and to do not match the period type, the request fails with 400 and functional code 1114 (REPORT_PERIOD_TYPE_MISMATCH).
        The BFF forwards it unchanged to the main API, which validates it.
      enum: [MONTH, YEAR, RANGE]
      default: RANGE
      example: MONTH

    WorkedHoursReportTypeDTO:
      type: string
      description: |
        Output format of a worked-hours report download. Both formats cover the same period, the same people
        and the same counting rules; the PDF month total equals the sum of «Horas netas» over the CSV rows with
        «Cuenta en el total» = Sí, up to the per-row rounding described below.
        - PDF (default): the registro de jornada PDF (`application/pdf`).
        - CSV: a text file for Excel in Spanish (`text/csv; charset=utf-8`):
          - Encoding UTF-8 with a byte order mark (EF BB BF), so Excel detects it. Separator `;`. Line endings CRLF.
            Decimal comma.
          - The first line is the header, in Spanish and in this order:
            `Persona;ID persona;Puesto;Fecha;Entrada;Salida;Salida día siguiente;Pausas (min);Horas netas;Duración;Estado;Cuenta en el total`
          - One row per closed worklog (clock-out set) of the people in scope whose clock-in falls in the period
            (business time zone), in CONFIRMED, APPROVED, PENDING_REVIEW or PENDING_RECONCILIATION. REJECTED and
            open worklogs are not listed. No total or subtotal rows. A period without such worklogs returns the
            header line only.
          - Rows ordered by person (name ignoring case, then user id), then date, then clock-in.
          - Persona: display name with the PDF rule (`Persona #<id>` when the name is empty or looks like an
            email). The email is never written.
          - ID persona: user id, to tell apart people with the same name.
          - Puesto: name of the job role of the person's contract in force on that date, or empty.
          - Fecha: business-local date of the clock-in, `dd/MM/yyyy` (the PDF day attribution).
          - Entrada, Salida: `HH:mm`, business-local.
          - Salida día siguiente: `Sí` when the clock-out falls on a later business-local date than the
            clock-in, otherwise `No`.
          - Pausas (min): whole minutes of the effective closed breaks of the worklog, truncated.
          - Duración: net time (clock-out − clock-in − effective closed breaks, truncated to the minute) as
            `H:MM`, the PDF format (e.g. `7:45`).
          - Horas netas: the same truncated net minutes divided by 60, two decimals rounded half up, decimal
            comma (e.g. `7,75`).
          - Estado: `Confirmado`, `Aprobado`, `Pendiente de revisión` or `Pendiente de conciliación` (the PDF
            wording).
          - Cuenta en el total: `Sí` for CONFIRMED and APPROVED, `No` for PENDING_REVIEW and
            PENDING_RECONCILIATION.
          - Quoting (RFC 4180): a field is enclosed in double quotes only when it contains `;`, `"`, CR or LF;
            an inner double quote is doubled.
          - Formula protection (CSV injection): a text field (Persona, Puesto) that starts with `=`, `+`, `-`,
            `@`, TAB or CR is written with a leading apostrophe (`'`). Generated numeric, date and time columns
            are never prefixed.
          - Instants are converted to business-local dates and times in the server code with the business
            ZoneId, not in SQL.
        Any other value returns 400 (1103). The BFF forwards it unchanged to the main API, which renders the file.
      enum: [PDF, CSV]
      default: PDF
      example: CSV
