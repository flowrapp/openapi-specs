components:
  schemas:
    MemberSearchPageDTO:
      type: object
      description: >
        One hub search page. The envelope (`content`, `hasNext`, `nextCursor`) comes
        from `GET /api/v2/businesses/{businessId}/users`. Each item adds the current
        contract, its job role, and whether the member is working, loaded in batch.
      properties:
        content:
          type: array
          description: Matching memberships for this page, possibly empty
          items:
            $ref: "#/components/schemas/MemberSearchItemDTO"
        hasNext:
          type: boolean
          description: True when another page exists after this one
          example: true
        nextCursor:
          type: [string, "null"]
          description: >
            Opaque cursor for the next page, or null on the last page. Bound to the
            business and the normalized query. Forward it unchanged.
          example: "eyJ2IjoxLCJyIjoxfQ"
      required: [content, hasNext, nextCursor]

    MemberSearchItemDTO:
      type: object
      description: >
        Hub search hit. `userId`, `name`, and `role` come from the Main API membership
        page. `currentContractId`, `jobRole`, `totalWeekHours`, and `currentContractEndDate`
        come from the current-contract batch, or are null when that member has no current
        contract. `contractEndingSoon` is computed by the BFF from `currentContractEndDate`
        and the business-local date. `workingNow` comes from the open-worklog batch. Email
        is not included. `userId` is the same identifier schedule accepts as `employeeId`.
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          description: >
            User identifier. Same id that schedule and planning use as employeeId.
          example: 41
        name:
          type: string
          description: Display name. Search matches this field only, not email.
          example: "Turín García"
        avatarUrl:
          $ref: "../personalData/components.yml#/components/schemas/AvatarUrl"
        role:
          type: string
          description: Role of the user in the business
          enum: [OWNER, EMPLOYEE]
          example: EMPLOYEE
        jobRole:
          description: >
            Job role of the member's current contract, or null when there is no
            current contract. Reuses the existing job-role summary.
          oneOf:
            - $ref: "../manager/components.yml#/components/schemas/ManagerJobRoleSummaryDTO"
            - type: "null"
        currentContractId:
          description: Identifier of the current contract, or null when the member has none
          oneOf:
            - type: integer
              format: int64
              minimum: 1
              example: 501
            - type: "null"
        totalWeekHours:
          description: >
            Contracted hours per week of the current contract (`contract.totalWeekHours` of
            the current-contract batch, always greater than 0 there), or null when the member
            has no current contract. Lets the team list show «32 h/sem» without another call.
          oneOf:
            - type: number
              format: double
              exclusiveMinimum: 0
              example: 32
            - type: "null"
        currentContractEndDate:
          description: >
            Inclusive end date of the current contract (`contract.endDate` of the
            current-contract batch), business-local. Null when the current contract is
            open-ended, and null when the member has no current contract (tell both apart
            with `currentContractId`). Being the current contract, it is never before the
            business-local today.
          oneOf:
            - type: string
              format: date
              example: "2026-11-30"
            - type: "null"
        contractEndingSoon:
          type: boolean
          description: >
            True when `currentContractEndDate` is not null and falls within the next 30 days,
            both ends included: `today <= currentContractEndDate <= today + 30 days`, where
            `today` is the business-local current date (business `zone` from the Main API,
            UTC when it has none). False for an open-ended contract and when there is no
            current contract. The 30-day threshold is fixed by the BFF so the app does not
            compute it. Always present.
          example: true
        workingNow:
          type: boolean
          description: >
            True when the open-worklog batch for this page includes the user id.
            False when it does not. Always present.
          example: true
      required: [userId, name, avatarUrl, role, jobRole, currentContractId, totalWeekHours, currentContractEndDate, contractEndingSoon, workingNow]

    MemberProfileDTO:
      type: object
      description: >
        «Ficha de persona» of one active member, ready to paint. Requires `TEAM_VIEW`; blocks the caller
        cannot read are null. Identity comes from
        `getBusinessUsers`; every other block lists its Main API source. Instants carry the business
        offset; local dates are business-local (`zone`). Enums are open: clients must tolerate unknown values.
        The current contract (job role, weekly hours, end date) has a single source: `contracts.current`.
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          description: User identifier; the filter for «Su histórico» (`userIds`) and «Su horario» (`userIds`/`employeeId`)
          example: 41
        businessUserId:
          type: integer
          format: int64
          minimum: 1
          description: >
            Identifier to send as `{businessUserId}` to the geofencing and auto-clocking PATCHes
            (`updateManagerBusinessUserGeofencingPolicy`, `updateManagerBusinessUserAutoClockingPreference`).
            Taken from `businessUserId` of the settings lists, which the Main API fills with the user id, so
            today it equals `userId`. Use this field for those calls.
          example: 41
        name:
          type: string
          description: Display name (`getBusinessUsers.name`)
          example: "Lucía Ramos"
        email:
          type: string
          format: email
          description: >
            Email (`getBusinessUsers.email`). Visible with `TEAM_VIEW`. Not part of
            `personalData` and not protected by `PERSONAL_DATA_VIEW`.
          example: "lucia.ramos@example.com"
        avatarUrl:
          $ref: "../personalData/components.yml#/components/schemas/AvatarUrl"
        personalData:
          description: >
            Phone and identity document of this membership. Null when the caller is
            not the OWNER, does not have `PERSONAL_DATA_VIEW` and is not the subject.
            Null means the caller may not see the block. An allowed caller receives
            the object with `phone` and `identityDocument` null when those values are
            unset. The BFF calls Main API `getCurrentUserPersonalData` for the subject
            and `getBusinessUserPersonalData` otherwise, and skips both calls when the
            block is null.
          oneOf:
            - $ref: "../personalData/components.yml#/components/schemas/MemberPersonalDataDTO"
            - type: "null"
        role:
          type: string
          description: Role in the business (`getBusinessUsers.role`). Read only on this screen. Open enum.
          enum: [OWNER, EMPLOYEE]
          example: EMPLOYEE
        isSelf:
          type: boolean
          description: >
            True when the member is the caller (`getCurrentUser.id` equals `userId`).
            The Clerk session `sub` is not a numeric Flowrapp user id.
          example: false
        asOf:
          type: string
          format: date-time
          description: Instant the profile was computed, with the business offset. Every «now» below is this instant.
          example: "2026-11-19T10:40:00+01:00"
        zone:
          type: string
          description: IANA time zone of the business (`getUserBusinesses.zone`)
          example: "Europe/Madrid"
        date:
          type: string
          format: date
          description: Business-local date of `asOf` («today»)
          example: "2026-11-19"
        accessRole:
          oneOf:
            - $ref: "#/components/schemas/AccessRoleSummaryDTO"
            - type: "null"
          description: Access role of the member (`getBusinessUsers.accessRole`), or null for an OWNER or an EMPLOYEE without one
        liveStatus:
          oneOf:
            - $ref: "#/components/schemas/MemberLiveStatusDTO"
            - type: "null"
          description: Null when the caller lacks `WORKLOGS_VIEW`; the BFF then skips its Main API calls.
        week:
          oneOf:
            - $ref: "#/components/schemas/MemberWeekHoursDTO"
            - type: "null"
          description: Null when the caller lacks `WORKLOGS_VIEW` or `REPORTS_VIEW`; the BFF then skips its Main API calls.
        today:
          type: [array, "null"]
          example: []
          description: >
            Null when the caller lacks `ATTENDANCE_VIEW`; the BFF then skips its Main API calls.
            «Hoy» rows, the same split as the Attendance Day rows: one `SHIFT` row per shift of today in the
            published planning (`getDailyAttendance.shiftAttendances`) and one `UNMATCHED` row per clock-in of
            today without a shift or with an ambiguous match (`getDailyAttendance.unmatchedAttendances`, chip
            `UNSCHEDULED_WORK` or `AMBIGUOUS_MATCH`). Ordered by `startAt` (SHIFT) or `clockIn` (UNMATCHED).
            Empty on a day off without clock-ins; several rows on a split shift.
          items:
            $ref: "#/components/schemas/MemberTodayRowDTO"
        clockInRules:
          oneOf:
            - $ref: "#/components/schemas/MemberClockInRulesDTO"
            - type: "null"
          description: Null when the caller lacks `CLOCKING_SETTINGS_MANAGE`; the BFF then skips its Main API calls.
        employment:
          $ref: "#/components/schemas/MemberEmploymentDTO"
        contracts:
          $ref: "#/components/schemas/MemberContractsDTO"
        actions:
          $ref: "#/components/schemas/MemberProfileActionsDTO"
      required: [userId, businessUserId, name, email, avatarUrl, personalData, role, accessRole, isSelf, asOf, zone, date, liveStatus, week, today, clockInRules, employment, contracts, actions]

    MemberLiveStatusStateDTO:
      type: string
      description: >
        Live state of the header, first match wins:
        (1) `WORKING`: an open worklog whose `operationalState` is WORKING;
        (2) `ON_BREAK`: an open worklog ON_BREAK;
        (3) `NOT_CLOCKED_IN`: a shift of today started more than `attendanceToleranceMinutes` ago, has not
        ended and has no clock-in;
        (4) `NOT_STARTED`: a shift of today has not started yet, so on a split shift the gap between the two
        shifts is NOT_STARTED, never FINISHED;
        (5) `FINISHED`: a worklog of today is closed and no shift of today is still to start;
        (6) `NO_SHOW`: a shift of today ended without any clock-in and nothing was worked today;
        (7) `OFF`: anything else. Open enum: clients must tolerate unknown values.
      enum: [WORKING, ON_BREAK, NOT_CLOCKED_IN, NOT_STARTED, FINISHED, NO_SHOW, "OFF"]
      example: WORKING

    MemberLiveStatusDTO:
      type: object
      description: >
        Header pill («Trabajando · desde 10:14 · 14 min tarde»). Source: the open worklog of `getWorklogs`
        and today's rows of `getDailyAttendance`; tolerance from `getUserBusinesses.attendanceToleranceMinutes`.
      properties:
        state:
          $ref: "#/components/schemas/MemberLiveStatusStateDTO"
        since:
          type: [string, "null"]
          format: date-time
          description: >
            WORKING and ON_BREAK: clock-in of the open worklog. NOT_STARTED: start of the next shift.
            FINISHED: the last clock-out of today. Null otherwise.
          example: "2026-11-19T10:14:00+01:00"
        breakStartedAt:
          type: [string, "null"]
          format: date-time
          description: Start of the open effective break for ON_BREAK; null otherwise
          example: null
        worklogId:
          type: [integer, "null"]
          format: int64
          description: Open worklog for WORKING and ON_BREAK; null otherwise
          example: 9001
        scheduledShiftId:
          type: [integer, "null"]
          format: int64
          description: >
            Shift the state refers to: the shift whose attendance contains the open worklog (null when it is
            an UNMATCHED clock-in), the shift of NOT_CLOCKED_IN or NO_SHOW, or the next shift for NOT_STARTED
            (the earliest one when several); null otherwise
          example: 900
        lateSeconds:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: >
            Seconds late for the header text («14 min tarde»), only beyond the tolerance: for WORKING and
            ON_BREAK, the shift's `entryDeviationSeconds` when it exceeds `attendanceToleranceMinutes × 60`;
            for NOT_CLOCKED_IN, `asOf − startAt`. Null otherwise. The «Tarde» chip of a «Hoy» row comes only
            from that row's `chips`.
          example: 840
      required: [state, since, breakStartedAt, worklogId, scheduledShiftId, lateSeconds]

    MemberWeekHoursDTO:
      type: object
      description: >
        «Esta semana»: the business-local ISO week (Monday to Sunday in `zone`) that contains `date`. Every
        worklog, closed or open, counts in the week of the business-local day of its clock-in (business
        `ZoneId`, as Attendance), so a worklog that crosses midnight from Sunday to Monday counts in the
        week of its clock-in, open and after closing. `workedSeconds + openElapsedSeconds` is the big
        figure, `plannedSeconds` the «de N h planificadas». Since BFF 0.0.106 (option B, owner views)
        `workedSeconds` counts only CONFIRMED + APPROVED and `pendingSeconds` is shown apart
        («+X h pendientes de revisar»), as in the worker history and Attendance «Horas».
      properties:
        week:
          type: string
          pattern: "^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$"
          example: "2026-W47"
        from:
          type: string
          format: date
          description: Monday of the week; also the `weekStart` of «Su horario»
          example: "2026-11-16"
        to:
          type: string
          format: date
          description: Sunday of the week
          example: "2026-11-22"
        workedSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Closed CONFIRMED + APPROVED worklogs of the week, net of effective breaks (`getBusinessReports`
            without `reviewStatus`). Since BFF 0.0.106 pending worklogs (PENDING_RECONCILIATION +
            PENDING_REVIEW) are NOT included: they are `pendingSeconds`. REJECTED never counts. The same
            figure as `clockedSeconds` of Attendance «Horas» for this person and week, so «Su histórico»
            shows the same number. The open worklog is not included.
          example: 61500
        pendingSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Closed PENDING_RECONCILIATION + PENDING_REVIEW worklogs of the week, net of effective breaks
            (`getBusinessReports` with those `reviewStatus`), NOT included in `workedSeconds` (BFF 0.0.106).
            The app shows them apart as «+X h pendientes de revisar». 0 means nothing pending; absent
            means the pending read failed or an older BFF, and the app shows nothing. Same figure as
            `pendingReviewSeconds` of Attendance «Horas» for this person and week.
          example: 7200
        openElapsedSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            «Hoy en curso»: seconds of the open worklog from its clock-in until `asOf`, minus its effective
            breaks (an open break counts until `asOf`), when its clock-in falls in the week; 0 otherwise or
            without an open worklog. Same name as `AttendanceClockedDTO.openElapsedSeconds`.
          example: 1560
        plannedSeconds:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: >
            Sum of `plannedSeconds` of the person's shifts in the published planning of the week
            (`getBusinessTeamSchedule`). Null when the week has no published planning (Main API 404 1046);
            0 for a published planning without shifts for this person.
          example: 115200
        remainingPlannedSeconds:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: >
            «Por hacer»: `max(0, plannedSeconds − workedSeconds − pendingSeconds − openElapsedSeconds)`
            (`pendingSeconds` absent = 0), so the value is the same as before BFF 0.0.106: time pending
            review is time already worked. Null when `plannedSeconds` is null.
          example: 44940
      required: [week, from, to, workedSeconds, openElapsedSeconds, plannedSeconds, remainingPlannedSeconds]

    MemberTodayRowDTO:
      type: object
      description: >
        One «Hoy» row. `SHIFT`: one `getDailyAttendance.shiftAttendances[]` entry («Hoy · Sala 10:00–16:00 ·
        Entrada 10:14»). `UNMATCHED`: one `getDailyAttendance.unmatchedAttendances[]` entry («Sin turno ·
        Entrada 10:14»); its shift fields are null. Job role names come from `getBusinessJobRoles`. The chips
        are the only source of «Tarde», «Sin turno» and the other badges of the row.
      properties:
        kind:
          $ref: "../attendance/components.yml#/components/schemas/AttendanceRowKindDTO"
        scheduledShiftId:
          type: [integer, "null"]
          format: int64
          description: SHIFT only; null for UNMATCHED
          example: 900
        attendanceMatchId:
          type: [integer, "null"]
          format: int64
          description: UNMATCHED only (the match of the worklog); null for SHIFT
          example: null
        shiftName:
          type: [string, "null"]
          description: SHIFT only
          example: "Mañana"
        shiftColor:
          type: [string, "null"]
          description: SHIFT only
          example: "#3494FB"
        jobRole:
          example: {id: 10, code: WAITER, name: Sala, color: "#3494FB", icon: front-of-house, active: true}
          description: >
            SHIFT: the job role stored on the scheduled shift. UNMATCHED: the job role of `contracts.current`.
            Null when there is none.
          oneOf:
            - $ref: "../manager/components.yml#/components/schemas/ManagerJobRoleSummaryDTO"
            - type: "null"
        startAt:
          type: [string, "null"]
          format: date-time
          description: SHIFT only. Envelope start (first segment).
          example: "2026-11-19T10:00:00+01:00"
        endAt:
          type: [string, "null"]
          format: date-time
          description: SHIFT only. Envelope end (last segment).
          example: "2026-11-19T16:00:00+01:00"
        segments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            SHIFT only. Planned segments. Omitted for a normal shift and for
            UNMATCHED. Not clocked worklogs.
          items:
            $ref: "../common/components.yml#/components/schemas/ScheduledShiftSegmentDTO"
        plannedSeconds:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: >
            SHIFT only (`metrics.plannedSeconds`): sum of the planned segment
            durations minus `breakMinutes`. The unpaid gap is not included.
            Same value as `durationSeconds` and `netSeconds`. Null for UNMATCHED.
          example: 21600
        durationSeconds:
          type: [integer, "null"]
          format: int64
          minimum: 0
          readOnly: true
          description: SHIFT only. Same value as `plannedSeconds`. Null for UNMATCHED.
          example: 21600
        netSeconds:
          type: [integer, "null"]
          format: int64
          minimum: 0
          readOnly: true
          description: SHIFT only. Same value as `plannedSeconds`. Null for UNMATCHED.
          example: 21600
        lifecycle:
          description: SHIFT only, Main API `ShiftAttendanceLifecycleDTO` unchanged (open enum); null for UNMATCHED
          oneOf:
            - type: string
              enum: [UPCOMING, EXPECTED, IN_PROGRESS, INTERRUPTED, FINISHED]
            - type: "null"
          example: IN_PROGRESS
        clockIn:
          type: [string, "null"]
          format: date-time
          description: >
            SHIFT: earliest clock-in among the non-rejected worklogs of the shift, null without one.
            UNMATCHED: the clock-in of its worklog (never null).
          example: "2026-11-19T10:14:00+01:00"
        clockOut:
          type: [string, "null"]
          format: date-time
          description: Clock-out of the latest worklog of the row when every worklog is closed; null otherwise («sin salida aún»)
          example: null
        clockInOrigin:
          description: Origin of the clock-in of `clockIn` (Main API `WorklogOriginDTO`); null without a clock-in
          oneOf:
            - type: string
              enum: [MANUAL, GEOFENCE, QR, AUTOMATIC, ADMIN, UNKNOWN]
            - type: "null"
          example: GEOFENCE
        entryDeviationSeconds:
          type: [integer, "null"]
          format: int64
          description: "SHIFT with a clock-in: `metrics.entryDeviationSeconds` (positive = late); null otherwise"
          example: 840
        chips:
          type: array
          example: []
          description: >
            Same chips and rules as the Attendance Day rows (`AttendanceChipDTO`): one per OPEN incident and
            one per current alert of the row, in Main API order. «Tarde» is the `LATE_ENTRY` chip (or
            `MISSING_CLOCK_IN` without a clock-in), «Sin turno» the `UNSCHEDULED_WORK` chip.
          items:
            $ref: "../attendance/components.yml#/components/schemas/AttendanceChipDTO"
      required: [kind, scheduledShiftId, attendanceMatchId, shiftName, shiftColor, jobRole, startAt, endAt, plannedSeconds, lifecycle, clockIn, clockOut, clockInOrigin, entryDeviationSeconds, chips]

    MemberClockInRulesDTO:
      type: object
      description: >
        Segment «Fichaje» and the row «Reglas de fichaje» of Resumen («Sigue al negocio» or «N propias»).
        Sources: `getBusinessGeofencingSettings` and `getBusinessAutoClockingSettings`.
      properties:
        geofencing:
          $ref: "#/components/schemas/MemberGeofencingRuleDTO"
        autoClocking:
          $ref: "#/components/schemas/MemberAutoClockingRuleDTO"
        customRuleCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of rules whose `source` is MEMBER; drives «N propias» and the dot on the «Fichaje» segment
          example: 1
        followsBusiness:
          type: boolean
          description: True when `customRuleCount` is 0 («Sigue al negocio»)
          example: false
      required: [geofencing, autoClocking, customRuleCount, followsBusiness]

    MemberClockInRuleSourceDTO:
      type: string
      description: >
        Who decides what applies now: BUSINESS (the business value applies) or MEMBER (the member's own
        value changes the outcome, «Personalizado»). Open enum.
      enum: [BUSINESS, MEMBER]
      example: MEMBER

    MemberGeofencingRuleDTO:
      type: object
      description: >
        Clock-in and clock-out outside the geofence. The Main API applies the stricter policy of the
        business and the member (ALLOW < WARN < BLOCK), at clock-in and at clock-out; the member value is
        kept when the business policy changes. The selected option of the segmented control is
        `effectivePolicy`. The member PATCH (`updateManagerBusinessUserGeofencingPolicy`) stores the value
        sent as is: it never deletes the member value and does not compare it with the business one; a
        member without a stored value reads as ALLOW. ALLOW is therefore «no rule of its own»: to go back
        to «Como el negocio», send `policy: ALLOW`. Choosing the business value itself (for example WARN
        while the business is WARN) also shows «Como el negocio» today, but stays WARN if the business
        later relaxes, so the front sends ALLOW for «Como el negocio».
      properties:
        businessPolicy:
          $ref: "../settings/components.yml#/components/schemas/GeofencingPolicy"
        memberPolicy:
          $ref: "../settings/components.yml#/components/schemas/GeofencingPolicy"
        effectivePolicy:
          $ref: "../settings/components.yml#/components/schemas/GeofencingPolicy"
        source:
          $ref: "#/components/schemas/MemberClockInRuleSourceDTO"
        selectablePolicies:
          type: array
          description: >
            Policies that change or keep what applies, ordered ALLOW, WARN, BLOCK: those at least as strict as
            `businessPolicy`. The others are shown disabled («Lo exige el negocio»).
          items:
            $ref: "../settings/components.yml#/components/schemas/GeofencingPolicy"
          example: [WARN, BLOCK]
        radiusMeters:
          type: number
          format: double
          description: Geofence radius (`getUserBusinesses.location.area`), for «Fuera de los 150 m»
          example: 150
      required: [businessPolicy, memberPolicy, effectivePolicy, source, selectablePolicies, radiusMeters]

    MemberAutoClockingRuleDTO:
      type: object
      description: >
        Automatic clock-in and clock-out on entering and leaving the geofence. It applies when the business
        switch AND the member's preference are on; the preference is kept when the business switches it off.
        The member PATCH (`updateManagerBusinessUserAutoClockingPreference`) stores the value sent as is; a
        member without a stored value reads as enabled. `enabled: true` is therefore «Como el negocio».
      properties:
        businessEnabled:
          type: boolean
          example: true
        memberEnabled:
          type: boolean
          example: true
        effectiveEnabled:
          type: boolean
          description: Main API `effectiveEnabled` (business AND member)
          example: true
        source:
          $ref: "#/components/schemas/MemberClockInRuleSourceDTO"
      required: [businessEnabled, memberEnabled, effectiveEnabled, source]

    MemberEmploymentDTO:
      type: object
      description: >
        Tiles Alta and Antigüedad, and «En el equipo desde» in Ajustes, from the contract history
        (`getUserContracts`). Horas/semana and Fin de contrato are `contracts.current.totalWeekHours` and
        `contracts.current.endDate`.
      properties:
        hireDate:
          type: [string, "null"]
          format: date
          description: >
            Earliest `startDate` of the contract history; null without contracts. A future first contract
            gives a future date.
          example: "2026-03-01"
        seniority:
          example: {years: 0, months: 8, totalMonths: 8}
          description: >
            Whole months from `hireDate` to `date`, never negative, split into years and months;
            null when `hireDate` is null
          oneOf:
            - $ref: "#/components/schemas/MemberSeniorityDTO"
            - type: "null"
      required: [hireDate, seniority]

    MemberSeniorityDTO:
      type: object
      properties:
        years:
          type: integer
          format: int32
          minimum: 0
          example: 0
        months:
          type: integer
          format: int32
          minimum: 0
          maximum: 11
          example: 8
        totalMonths:
          type: integer
          format: int32
          minimum: 0
          example: 8
      required: [years, months, totalMonths]

    MemberContractStateDTO:
      type: string
      description: >
        Business-local state of a contract on `date`: CURRENT (startDate ≤ date and endDate null or ≥ date),
        UPCOMING (startDate > date), ENDED (endDate < date). Open enum.
      enum: [CURRENT, UPCOMING, ENDED]
      example: CURRENT

    MemberContractDTO:
      type: object
      description: One contract of the history (`getUserContracts`) with its job role (`getBusinessJobRoles`, inactive included)
      properties:
        id:
          type: integer
          format: int64
          example: 501
        jobRole:
          example: {id: 10, code: WAITER, name: Sala, color: "#3494FB", icon: front-of-house, active: true}
          description: Job role of the contract; `active` false means archived. Null only if the id is missing from the catalog
          oneOf:
            - $ref: "../manager/components.yml#/components/schemas/ManagerJobRoleSummaryDTO"
            - type: "null"
        totalWeekHours:
          type: number
          format: double
          example: 32
        startDate:
          type: string
          format: date
          example: "2026-06-01"
        endDate:
          type: [string, "null"]
          format: date
          example: null
        state:
          $ref: "#/components/schemas/MemberContractStateDTO"
        canDelete:
          type: boolean
          description: >
            True for UPCOMING contracts (`deleteUserContract` requires `startDate` strictly after today). The
            Main API may still answer 409 1102 when a planning of the period blocks the deletion; the BFF
            does not read planning states for this flag.
          example: false
      required: [id, jobRole, totalWeekHours, startDate, endDate, state, canDelete]

    MemberContractsDTO:
      type: object
      description: >
        Segment «Contratos», the whole history split by state. `current` is the only source of the current
        contract on the screen: header job role, Horas/semana, Fin de contrato and «Puesto actual».
      properties:
        current:
          example: null
          description: The contract in force today, or null
          oneOf:
            - $ref: "#/components/schemas/MemberContractDTO"
            - type: "null"
        upcoming:
          type: array
          example: []
          description: Contracts that start after today, by startDate ascending
          items:
            $ref: "#/components/schemas/MemberContractDTO"
        previous:
          type: array
          example: []
          description: Ended contracts, by startDate descending
          items:
            $ref: "#/components/schemas/MemberContractDTO"
      required: [current, upcoming, previous]

    MemberRemoveBlockedReasonDTO:
      type: string
      description: >
        Why «Eliminar» is not available: SELF (the caller is the member), TARGET_IS_OWNER (an OWNER cannot
        be removed, Main API 403 1106) or CALLER_NOT_OWNER (only the OWNER removes members). Open enum.
      enum: [SELF, TARGET_IS_OWNER, CALLER_NOT_OWNER]
      example: TARGET_IS_OWNER

    MemberProfileActionsDTO:
      type: object
      description: State rules of the actions of the screen, so the front never computes them.
      properties:
        canEndContract:
          type: boolean
          description: >
            «Dar de baja»: true when `contracts.current` exists and its `endDate` is null or after today
            (`updateUserContract` with an end date)
          example: true
        canRemove:
          type: boolean
          description: True when `removeBlockedReason` is null (`removeBusinessMember`)
          example: true
        removeBlockedReason:
          example: null
          oneOf:
            - $ref: "#/components/schemas/MemberRemoveBlockedReasonDTO"
            - type: "null"
        canChangeAccessRole:
          type: boolean
          description: True when the caller is the OWNER and the member is an EMPLOYEE (`updateMemberAccessRole`)
          example: true
        canEditIdentityDocument:
          type: boolean
          description: >
            True when the caller is the OWNER (`replaceManagerWorkerIdentityDocument`
            and `deleteManagerWorkerIdentityDocument`). False for an encargado, including
            one with `PERSONAL_DATA_VIEW`, and for the subject when they are not the OWNER.
          example: true
        canRemovePhoto:
          type: boolean
          description: >
            True when the caller is the OWNER and `avatarUrl` is not null
            (`deleteManagerWorkerPhoto`). Removing the photo deletes it in Clerk for
            every business of that user.
          example: false
      required: [canEndContract, canRemove, removeBlockedReason, canChangeAccessRole, canEditIdentityDocument, canRemovePhoto]

    BusinessPermission:
      type: string
      description: >
        Business permission, same catalog as the Main API `BusinessPermission`. Implications are
        closed by the Main API when an access role is saved. `PERSONAL_DATA_VIEW` implies `TEAM_VIEW`.
        ATTENDANCE_VIEW also implies SCHEDULE_VIEW
        and REPORTS_VIEW: the attendance screens compare the schedule with the worked hours. Open enum for clients: ignore unknown values.
      enum:
        - TEAM_VIEW
        - TEAM_INVITE
        - CONTRACTS_MANAGE
        - WORKLOGS_VIEW
        - WORKLOGS_MANAGE
        - ATTENDANCE_VIEW
        - ATTENDANCE_MANAGE
        - SCHEDULE_VIEW
        - SCHEDULE_MANAGE
        - SHIFT_CHANGES_APPROVE
        - REPORTS_VIEW
        - REPORTS_EXPORT
        - CLOCKING_SETTINGS_MANAGE
        - BUSINESS_EDIT
        - PERSONAL_DATA_VIEW
      example: TEAM_VIEW

    BusinessFeature:
      type: string
      description: >
        Optional product module of a business, same catalog as the Main API `BusinessFeature`.
        SCHEDULING owns SCHEDULE_VIEW, SCHEDULE_MANAGE and SHIFT_CHANGES_APPROVE and includes manual
        shifts. ATTENDANCE requires SCHEDULING and owns ATTENDANCE_VIEW and ATTENDANCE_MANAGE.
        ADVANCED_PLANNING requires SCHEDULING and gates advanced operations independently of RBAC.
        Every other permission is core.
        Open enum for clients: ignore unknown values.
      enum:
        - SCHEDULING
        - ATTENDANCE
        - ADVANCED_PLANNING
      example: SCHEDULING

    AccessRoleSummaryDTO:
      type: object
      description: Identity of an access role
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 7
        name:
          type: string
          example: Encargado
      required: [id, name]

    AccessRoleDTO:
      type: object
      description: Access role of a business (Main API `BusinessAccessRoleDTO`, forwarded unchanged)
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 7
        name:
          type: string
          example: Encargado
        permissions:
          type: array
          uniqueItems: true
          description: Permissions of the role, implications included, in catalog order
          items:
            $ref: "#/components/schemas/BusinessPermission"
          example: [TEAM_VIEW, WORKLOGS_VIEW, ATTENDANCE_VIEW, REPORTS_VIEW]
        memberCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of active members holding this role
          example: 2
      required: [id, name, permissions, memberCount]

    AccessRoleRequestDTO:
      type: object
      description: >
        Complete definition of an access role. The name is trimmed, 1 to 50 characters and unique in
        the business ignoring case. Implied permissions are added by the Main API.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Encargado
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/BusinessPermission"
          example: [ATTENDANCE_VIEW, REPORTS_VIEW]
      required: [name, permissions]

    MemberAccessRoleRequestDTO:
      type: object
      description: Access role to assign to an employee, or null to clear it
      additionalProperties: false
      properties:
        accessRoleId:
          type: [integer, "null"]
          format: int64
          minimum: 1
          example: 7
      required: [accessRoleId]
