components:
  schemas:
    RegisterUserFromInvitationRequestDTO:
      type: object
      description: Registration details for a new user who received an invitation
      properties:
        username:
          type: string
          description: Username for the new user
          example: "johndoe"
        phone:
          type: string
          description: >
            Phone number in E.164 (`^\+[1-9][0-9]{6,14}$`). The server does not
            infer a country prefix. A value that does not match is 400 1161.
          minLength: 8
          maxLength: 16
          pattern: '^\+[1-9][0-9]{6,14}$'
          example: "+34612345678"
      required:
        - username
        - phone
