components:
  schemas:
    ManagerContractRequestDTO:
      type: object
      description: New contract terms. Inclusive dates must not overlap another contract for the same user and business, regardless of job role.
      properties:
        jobRoleId:
          type: integer
          format: int64
          description: Active job role contracted within the business
          example: 10
        totalWeekHours:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Number of hours agreed for a working week
          example: 40.0
        startDate:
          type: string
          format: date
          description: Inclusive business-local contract start date
          example: "2025-01-01"
        endDate:
          type: [string, "null"]
          format: date
          description: Inclusive business-local contract end date, or null for an open-ended contract
          example: null
      required: [jobRoleId, totalWeekHours, startDate, endDate]

    ManagerContractEndDateUpdateRequestDTO:
      type: object
      additionalProperties: false
      description: Only the end date may be updated; all other contract terms are immutable.
      properties:
        endDate:
          type: [string, "null"]
          format: date
          description: Inclusive business-local contract end date, or null to reopen the contract
          example: "2025-07-31"
      required: [endDate]

    ManagerContractResponseDTO:
      type: object
      description: Contract details forwarded from the Main API for the user identified in the path.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the contract
          example: 123
        businessId:
          type: integer
          format: int64
          description: Business associated with the contract
          example: 101
        jobRoleId:
          type: integer
          format: int64
          description: Job role associated with the contract
          example: 10
        totalWeekHours:
          type: number
          format: double
          description: Number of hours agreed for a working week
          example: 40.0
        startDate:
          type: string
          format: date
          description: Inclusive business-local contract start date
          example: "2025-01-01"
        endDate:
          type: [string, "null"]
          format: date
          description: Inclusive business-local contract end date, or null for an open-ended contract
          example: null
        createdAt:
          type: string
          format: date-time
          description: Instant when the contract was created
          example: "2024-12-20T10:15:00+00:00"
        updatedAt:
          type: string
          format: date-time
          description: Instant when the contract was last updated
          example: "2024-12-20T10:15:00+00:00"
      required: [id, businessId, jobRoleId, totalWeekHours, startDate, endDate, createdAt, updatedAt]

    ManagerContractSliceResponseDTO:
      type: object
      description: Paginated contract history ordered by start date descending, without a total-count query.
      properties:
        content:
          type: array
          description: Contracts in the requested slice
          items:
            $ref: '#/components/schemas/ManagerContractResponseDTO'
        page:
          type: integer
          format: int32
          minimum: 0
          description: Current page number, zero-based
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          description: Requested page size
          example: 20
        hasNext:
          type: boolean
          description: Whether another slice is available
          example: false
      required: [content, page, size, hasNext]

    ManagerContractAmendmentPreviewRequestDTO:
      type: object
      additionalProperties: false
      description: >
        Proposed terms. At least one of `totalWeekHours` or `jobRoleId` must differ from the current contract
        (1171). The preview is informational until the apply operation runs.
      properties:
        effectiveDate:
          type: string
          format: date
          description: >
            Business-local day the new terms start. Today or later (1169) and within the contract validity (1170);
            equal to the contract start date means correcting the contract from its first day.
          example: "2026-12-01"
        totalWeekHours:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 32.0
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          example: 10
      required: [effectiveDate]

    ManagerContractAmendmentExpectedStateDTO:
      type: object
      additionalProperties: false
      description: >
        State shown in the preview. Send it back unchanged to the apply operation. It carries the contract
        `updatedAt`, the planning `version`s and the data of every shift of the worker from the effective date,
        all read through existing Main API reads (`getPlanning`). The planning `version` is not trusted alone:
        the Main API compares the shift data too and rejects any difference with 1167 and no effects.

        Rule marker (version 2 rule of Main API 0.0.127): the preview adds to `plannings` exactly one entry with
        `planningId` 0, a value no planning has, whose `version` is the epoch day (days since 1970-01-01) of the Monday
        of the week that contained today, in the business time zone, when it was taken. Send the state back unchanged,
        marker included: the Main API rejects with 1167, writing nothing, a state without it, or from another local
        week. The marker travels inside the compared state because services of the previous rule ignore a new field
        but reject a state with an unknown planning entry.
      properties:
        contractUpdatedAt:
          type: string
          format: date-time
          example: "2026-11-20T10:00:00Z"
        plannings:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              planningId:
                type: integer
                format: int64
                example: 77
              version:
                type: integer
                format: int64
                example: 4
            required: [planningId, version]
        shifts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              shiftId:
                type: integer
                format: int64
                minimum: 1
                example: 501
              planningId:
                type: integer
                format: int64
                example: 77
              jobRoleId:
                type: integer
                format: int64
                example: 10
              catalogShiftId:
                type: integer
                format: int64
                example: 4
              startAt:
                type: string
                format: date-time
                example: "2026-12-08T08:00:00Z"
              endAt:
                type: string
                format: date-time
                example: "2026-12-08T16:00:00Z"
              breakMinutes:
                type: integer
                minimum: 0
                example: 30
              updatedAt:
                type: string
                format: date-time
                example: "2026-11-20T09:15:00Z"
            required: [shiftId, planningId, jobRoleId, catalogShiftId, startAt, endAt, breakMinutes, updatedAt]
      required: [contractUpdatedAt, plannings, shifts]

    ManagerContractAmendmentPreviewDTO:
      type: object
      description: >
        Read-only preview of the impact. Shows which shifts of the worker change and which are preserved, whether
        planned hours exceed the new contract hours, and from which week the new terms are taken into account when
        planning. No decision is requested: published shifts are never changed.
      properties:
        currentContract:
          type: object
          properties:
            id:
              type: integer
              format: int64
              example: 123
            startDate:
              type: string
              format: date
              example: "2026-01-01"
            endDate:
              type: string
              format: date
              description: Empty when the contract is open-ended
              example: "2026-11-30"
            jobRoleId:
              type: integer
              format: int64
              example: 10
            totalWeekHours:
              type: number
              format: double
              example: 40.0
          required: [id, startDate, jobRoleId, totalWeekHours]
        proposedTerms:
          $ref: '#/components/schemas/ManagerContractAmendmentPreviewRequestDTO'
        expectedState:
          $ref: '#/components/schemas/ManagerContractAmendmentExpectedStateDTO'
        plannings:
          type: array
          items:
            type: object
            properties:
              planningId:
                type: integer
                format: int64
                example: 77
              weekStart:
                type: string
                format: date
                example: "2026-12-07"
              weekEnd:
                type: string
                format: date
                example: "2026-12-13"
              status:
                type: string
                enum: [CREATED, FAILED, SOLVING, DRAFT, PUBLISHED, ARCHIVED]
                example: PUBLISHED
              version:
                type: integer
                format: int64
                example: 4
            required: [planningId, weekStart, weekEnd, status, version]
        shifts:
          type: array
          description: Shifts of this person from the effective date
          items:
            type: object
            properties:
              shiftId:
                type: integer
                format: int64
                example: 501
              planningId:
                type: integer
                format: int64
                example: 77
              planningStatus:
                type: string
                enum: [DRAFT, PUBLISHED]
                example: PUBLISHED
              date:
                type: string
                format: date
                example: "2026-12-08"
              jobRoleId:
                type: integer
                format: int64
                description: Job role the shift has now
                example: 10
              newJobRoleId:
                type: ["integer", "null"]
                format: int64
                description: Job role the shift will have after the amendment; only for `impact` JOB_ROLE_CHANGES
                example: 11
              impact:
                type: string
                enum: [JOB_ROLE_CHANGES, PRESERVED]
                description: >
                  JOB_ROLE_CHANGES: shift whose job role `applyManagerWorkerContractAmendmentV2` writes, when the
                  job role changes: this worker's shift from the effective date in the DRAFT planning of the
                  current week or in any later week, DRAFT or PUBLISHED (the planning keeps its status); only its
                  job role is updated. The deprecated version 1 preview marks only the
                  current-week DRAFT, informationally: no operation confirms it. PRESERVED: it keeps person, job
                  role, schedule and break (every shift of a PUBLISHED current week and every shift when only the hours change). The apply operation sends no notification.
                example: PRESERVED
            required: [shiftId, planningId, planningStatus, date, jobRoleId, impact]
        hoursSummary:
          type: array
          description: Planned hours per week of the plannings read, against the proposed contract hours. Planned hours are never trimmed.
          items:
            type: object
            properties:
              planningId:
                type: integer
                format: int64
                example: 77
              weekStart:
                type: string
                format: date
                example: "2026-12-07"
              plannedHours:
                type: number
                format: double
                description: Hours of this worker planned in that week from the effective date, breaks excluded
                example: 38.5
              contractWeekHours:
                type: number
                format: double
                description: Weekly hours of the proposed terms
                example: 32.0
              exceedsContractHours:
                type: boolean
                example: true
            required: [planningId, weekStart, plannedHours, contractWeekHours, exceedsContractHours]
        correctsFromFirstDay:
          type: boolean
          description: True when the effective date is the contract start date; the contract is corrected in place, with the same start date and no earlier segment
          example: false
        newTermsPlanningFrom:
          type: string
          format: date
          description: >
            Informs from which day the new terms are taken into account when planning. It does not change the
            effective date of the contract and does not replace it when selecting the DRAFT shifts to update. When
            the current week is published with affected shifts it is the later of the effective date and the start
            of the week after the current one; otherwise it is the effective date. Never before the effective date.
          example: "2026-12-14"
      required: [currentContract, proposedTerms, expectedState, plannings, shifts, hoursSummary, correctsFromFirstDay, newTermsPlanningFrom]

    ManagerContractAmendmentApplyRequestDTO:
      type: object
      additionalProperties: false
      properties:
        effectiveDate:
          type: string
          format: date
          example: "2026-12-01"
        totalWeekHours:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 32.0
        jobRoleId:
          type: integer
          format: int64
          minimum: 1
          example: 10
        expectedState:
          $ref: '#/components/schemas/ManagerContractAmendmentExpectedStateDTO'
      required: [effectiveDate, expectedState]

    ManagerContractAmendmentResultDTO:
      type: object
      properties:
        closedContract:
          type: ["object", "null"]
          description: Contract closed by the amendment. Null when the effective date is the first day of the contract (no earlier segment is created).
          properties:
            id:
              type: integer
              format: int64
              example: 123
            endDate:
              type: string
              format: date
              example: "2026-11-30"
          required: [id, endDate]
        newContract:
          type: object
          description: Contract that replaces it
          properties:
            id:
              type: integer
              format: int64
              example: 124
            startDate:
              type: string
              format: date
              example: "2026-12-01"
            jobRoleId:
              type: integer
              format: int64
              example: 10
            totalWeekHours:
              type: number
              format: double
              example: 32.0
          required: [id, startDate, jobRoleId, totalWeekHours]
        updatedShiftCount:
          type: integer
          minimum: 0
          description: Shifts whose job role was changed, across all DRAFT plannings from the effective date (current and later weeks). Zero when no planning was written.
          example: 2
      required: [closedContract, newContract, updatedShiftCount]
