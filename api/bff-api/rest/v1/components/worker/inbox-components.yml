components:
  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      description: Business of the caller-scoped attendance inbox.
      schema: {type: integer, format: int64, minimum: 1, example: 101}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Legacy list cursor forwarded unchanged; bound to business, caller and legacy collection.
      schema: {type: string, minLength: 1}
    Limit:
      name: limit
      in: query
      required: false
      description: Legacy page size forwarded unchanged; default 20, from 1 to 50.
      schema: {type: integer, format: int32, minimum: 1, maximum: 50, default: 20}
    GroupDate:
      name: date
      in: query
      required: false
      description: Optional business-local shift-start or unmatched clock-in date.
      schema: {type: string, format: date}
    JustificationFilter:
      name: justification
      in: query
      required: false
      schema: {type: string, enum: [ALL, UNJUSTIFIED, JUSTIFIED], default: ALL}
    GroupCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to business, caller, date, filter and business zone; forwarded unchanged.
      schema: {type: string, minLength: 1}
    GroupLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 50, default: 20}
    GroupId:
      name: groupId
      in: path
      required: true
      schema: {type: string, pattern: '^[SM]-[1-9][0-9]{0,18}$', example: S-900}

  schemas:
    WorkerAttendanceIncidentTypeDTO:
      type: string
      description: Main API incident-type enum; alert-only chip values are excluded.
      enum: [EARLY_ENTRY, LATE_ENTRY, EARLY_EXIT, LATE_EXIT, UNEXPLAINED_GAP, UNSCHEDULED_WORK, AMBIGUOUS_MATCH, NO_SHOW, AUTOMATIC_CLOSE, OUTSIDE_GEOFENCE]
    WorkerAttendanceIncidentScopeDTO:
      type: string
      enum: [MATCH, SHIFT]
    WorkerAttendanceIncidentPageDTO:
      type: object
      additionalProperties: false
      description: Legacy individual inbox page; cursor and order are forwarded from Main API.
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/WorkerAttendanceIncidentItemDTO'}
        hasNext: {type: boolean}
        nextCursor: {type: [string, 'null']}
      required: [content, hasNext, nextCursor]
    WorkerAttendanceIncidentItemDTO:
      type: object
      properties:
        incident: {$ref: '#/components/schemas/WorkerAttendanceIncidentDTO'}
        anchor: {$ref: '#/components/schemas/WorkerAttendanceAnchorDTO'}
      required: [incident, anchor]
    WorkerAttendanceIncidentDTO:
      type: object
      additionalProperties: false
      description: Minimal caller view; excludes author/resolver identities and incident evidence.
      properties:
        id: {type: integer, format: int64, minimum: 1}
        scope: {$ref: '#/components/schemas/WorkerAttendanceIncidentScopeDTO'}
        attendanceMatchId: {type: [integer, 'null'], format: int64, minimum: 1}
        scheduledShiftId: {type: [integer, 'null'], format: int64, minimum: 1}
        type: {$ref: '#/components/schemas/WorkerAttendanceIncidentTypeDTO'}
        lifecycle: {$ref: '../../components/attendance/components.yml#/components/schemas/AttendanceIncidentLifecycleDTO'}
        resolution:
          oneOf:
            - {$ref: '../../components/attendance/components.yml#/components/schemas/AttendanceIncidentResolutionDTO'}
            - {type: 'null'}
        measuredSeconds: {type: [integer, 'null'], format: int64, minimum: 0}
        toleranceSeconds: {type: [integer, 'null'], format: int64, minimum: 0}
        justification:
          oneOf:
            - type: object
              properties:
                text: {type: string, minLength: 1, maxLength: 500}
                justifiedAt: {type: string, format: date-time}
              required: [text, justifiedAt]
            - {type: 'null'}
        resolvedAt: {type: [string, 'null'], format: date-time}
        reason: {type: [string, 'null'], maxLength: 500}
        canJustify: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
      required: [id, scope, attendanceMatchId, scheduledShiftId, type, lifecycle, resolution, measuredSeconds, toleranceSeconds, justification, resolvedAt, reason, canJustify, createdAt, updatedAt, version]
    WorkerAttendanceAnchorDTO:
      type: object
      description: >-
        Legacy navigation anchor: business-local shift-start date for SHIFT/MATCHED, else
        worklog clock-in date. MATCH-scope always contains its real current match id;
        worklog id is derived from that match and null for SHIFT scope.
      properties:
        date: {type: string, format: date}
        scheduledShiftId: {type: [integer, 'null'], format: int64, minimum: 1}
        attendanceMatchId: {type: [integer, 'null'], format: int64, minimum: 1, description: Required for MATCH scope; null iff scope is SHIFT.}
        worklogId: {type: [integer, 'null'], format: int64, minimum: 1, description: Required for MATCH scope; null iff scope is SHIFT.}
      required: [date, scheduledShiftId, attendanceMatchId, worklogId]
    WorkerAttendanceInboxBadgeDTO:
      type: object
      additionalProperties: false
      description: Legacy Main API badge with its two distinct counts preserved.
      properties:
        incidentCount: {type: integer, format: int32, minimum: 0, example: 2}
        confirmationCount: {type: integer, format: int32, minimum: 0, example: 1}
      required: [incidentCount, confirmationCount]

    WorkerAttendanceIncidentGroupKindDTO:
      type: string
      enum: [SHIFT, UNMATCHED]
    WorkerAttendanceGroupFilterClassDTO:
      type: string
      enum: [JUSTIFIED, UNJUSTIFIED]
    WorkerAttendanceGroupJustificationStateDTO:
      type: string
      enum: [NONE, COMMON, LEGACY_SINGLE, PARTIAL, NOT_COMMON]
    WorkerAttendanceGroupJustificationOriginDTO:
      type: string
      enum: [COMMON, INDIVIDUAL]
    WorkerAttendanceGroupMemberJustificationDTO:
      type: object
      properties:
        text: {type: string, minLength: 1, maxLength: 500}
        justifiedAt: {type: string, format: date-time}
        origin: {$ref: '#/components/schemas/WorkerAttendanceGroupJustificationOriginDTO'}
      required: [text, justifiedAt, origin]
    WorkerAttendanceGroupMemberDTO:
      type: object
      description: Caller-safe OPEN member view, ordered by incidentId; contains no author/resolver identity, evidence or reason.
      properties:
        incidentId: {type: integer, format: int64, minimum: 1}
        type: {$ref: '#/components/schemas/WorkerAttendanceIncidentTypeDTO'}
        scope: {$ref: '#/components/schemas/WorkerAttendanceIncidentScopeDTO'}
        attendanceMatchId: {type: [integer, 'null'], format: int64, minimum: 1}
        worklogId: {type: [integer, 'null'], format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        justification:
          oneOf:
            - {$ref: '#/components/schemas/WorkerAttendanceGroupMemberJustificationDTO'}
            - {type: 'null'}
      required: [incidentId, type, scope, attendanceMatchId, worklogId, createdAt, justification]
    WorkerAttendanceGroupJustificationDTO:
      type: object
      description: >-
        COMMON is one group-level value on all current OPEN members; LEGACY_SINGLE is a
        legacy individual value on the sole current OPEN member; PARTIAL means only some are justified; NOT_COMMON
        means all are justified but individual values differ; NONE means none. `legacy`
        identifies legacy individual evidence. Only COMMON and LEGACY_SINGLE are JUSTIFIED;
        `common` is null except in COMMON state.
      properties:
        state: {$ref: '#/components/schemas/WorkerAttendanceGroupJustificationStateDTO'}
        filterClass: {$ref: '#/components/schemas/WorkerAttendanceGroupFilterClassDTO'}
        legacy: {type: boolean}
        common:
          oneOf:
            - type: object
              properties:
                text: {type: string, minLength: 1, maxLength: 500}
                justifiedAt: {type: string, format: date-time}
              required: [text, justifiedAt]
            - {type: 'null'}
        openCount: {type: integer, format: int32, minimum: 1}
        justifiedOpenCount: {type: integer, format: int32, minimum: 0}
      required: [state, filterClass, legacy, common, openCount, justifiedOpenCount]
    WorkerAttendanceIncidentGroupDTO:
      type: object
      additionalProperties: false
      properties:
        groupId: {type: string, pattern: '^[SM]-[1-9][0-9]{0,18}$'}
        kind: {$ref: '#/components/schemas/WorkerAttendanceIncidentGroupKindDTO'}
        scheduledShiftId: {type: [integer, 'null'], format: int64, minimum: 1}
        attendanceMatchIds:
          type: array
          items: {type: integer, format: int64, minimum: 1}
        businessDate: {type: string, format: date}
        anchorAt: {type: string, format: date-time, description: UTC shift start for SHIFT or clock-in for UNMATCHED.}
        revision:
          type: string
          pattern: '^rv1-[A-Za-z0-9_-]{43}$'
          description: rv1- plus unpadded base64url SHA-256 of canonical caller/group/anchor/match/member snapshot.
        justification: {$ref: '#/components/schemas/WorkerAttendanceGroupJustificationDTO'}
        openMembers:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/WorkerAttendanceGroupMemberDTO'}
      required: [groupId, kind, scheduledShiftId, attendanceMatchIds, businessDate, anchorAt, revision, justification, openMembers]
    WorkerAttendanceIncidentGroupPageDTO:
      type: object
      additionalProperties: false
      description: >-
        One response snapshot forwarded from Main, with complete matching OPEN groups, their
        exact filtered total, and the caller-scoped global badge summary. The total is counted
        after date and justification filters but before cursor/limit; summary is independent
        of all list filters and pagination parameters. If Main cannot compute any count, the
        BFF forwards failure rather than manufacturing a zero. Later pages are live responses
        and may have different totals and summaries; do not add or merge counters across pages.
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/WorkerAttendanceIncidentGroupDTO'}
        totalGroupsMatchingFilters:
          type: integer
          format: int64
          minimum: 0
          description: Complete OPEN groups matching date and justification filters, before cursor and limit; forwarded from Main.
          example: 0
        summary:
          allOf:
            - $ref: '#/components/schemas/WorkerAttendanceInboxBadgeDTO'
          description: Global caller-scoped legacy badge counts forwarded in the same Main response, unaffected by list filters or pagination.
        hasNext: {type: boolean}
        nextCursor: {type: [string, 'null'], description: Null iff hasNext is false.}
        asOf: {type: string, format: date-time}
      required: [content, totalGroupsMatchingFilters, summary, hasNext, nextCursor, asOf]
    WorkerAttendanceIncidentGroupJustificationRequestDTO:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 500, pattern: '(?=.*\S)[\s\S]+', description: Exact text; validated without trimming.}
        expectedRevision: {type: string, pattern: '^rv1-[A-Za-z0-9_-]{43}$'}
      required: [text, expectedRevision]
    WorkerAttendanceIncidentGroupJustificationResponseDTO:
      type: object
      properties:
        outcome: {type: string, enum: [APPLIED, REPLAYED]}
        group: {$ref: '#/components/schemas/WorkerAttendanceIncidentGroupDTO'}
      required: [outcome, group]
    WorkerAttendanceIncidentGroupConflictProblemDetailDTO:
      allOf:
        - $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        - type: object
          properties:
            currentGroupId: {type: [string, 'null'], pattern: '^[SM]-[1-9][0-9]{0,18}$'}
          required: [currentGroupId]

  responses:
    Unauthorized:
      description: No authenticated session.
    NotMember:
      description: Caller is not an active member of the business (1015).
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 403, detail: '1015 - user is not member of business'}
    BusinessNotFound:
      description: Business does not exist (1006).
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 404, detail: '1006 - business does not exist'}
    InboxListBadRequest:
      description: Legacy inbox cursor invalid or bound to another business, caller or collection (1142).
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 400, detail: '1142 - attendance inbox cursor is invalid or does not match this query'}
    GroupListBadRequest:
      description: Invalid date or limit (1144), or cursor invalid or bound to a different filter/scope (1145).
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          examples:
            requestInvalid: {value: {status: 400, detail: '1144 - attendance incident group request is invalid'}}
            cursorInvalid: {value: {status: 400, detail: '1145 - attendance incident group cursor is invalid or does not match this query'}}
    GroupRequestBadRequest:
      description: Invalid group justification request (1144); forwarded from Main API.
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 400, detail: '1144 - attendance incident group request is invalid'}
    GroupNotFound:
      description: Caller-owned group is missing, noncanonical or not visible (1146).
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 404, detail: '1146 - attendance incident group not found'}
    GroupConflict:
      description: Revision conflict (1147) or not open (1148). Proposed future-writer code 1150 is not emitted by these routes.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/WorkerAttendanceIncidentGroupConflictProblemDetailDTO'}
          examples:
            revisionConflict: {value: {status: 409, detail: '1147 - attendance incident group revision conflict', currentGroupId: null}}
            canonicalized: {value: {status: 409, detail: '1147 - attendance incident group revision conflict', currentGroupId: S-900}}
            notOpen: {value: {status: 409, detail: '1148 - attendance incident group is not open', currentGroupId: null}}
    GroupLockTimeout:
      description: Lock timeout; retry after one second (1149).
      headers:
        Retry-After: {description: Seconds before retrying., schema: {type: integer, enum: [1], example: 1}}
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 503, detail: '1149 - attendance incident group lock timed out'}
