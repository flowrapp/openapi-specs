components:
  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      description: Business of the caller-scoped attendance inbox.
      schema: {type: integer, format: int64, minimum: 1, example: 101}
    WorklogChangeId:
      name: worklogChangeId
      in: path
      required: true
      description: Worklog change (`WorkerWorklogChangeDTO.id`) whose confirmation is answered.
      schema: {type: integer, format: int64, minimum: 1, example: 1201}
    AttendanceMatchId:
      name: attendanceMatchId
      in: path
      required: true
      description: Caller-owned attendance match of any kind.
      schema: {type: integer, format: int64, minimum: 1, example: 731}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Legacy list cursor forwarded unchanged; bound to business, caller and legacy collection.
      schema: {type: string, minLength: 1}
    Limit:
      name: limit
      in: query
      required: false
      description: Legacy page size forwarded unchanged; default 20, from 1 to 50.
      schema: {type: integer, format: int32, minimum: 1, maximum: 50, default: 20}
    GroupDate:
      name: date
      in: query
      required: false
      description: Optional business-local shift-start or unmatched clock-in date.
      schema: {type: string, format: date}
    JustificationFilter:
      name: justification
      in: query
      required: false
      schema: {type: string, enum: [ALL, UNJUSTIFIED, JUSTIFIED], default: ALL}
    GroupCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to business, caller, date, filter and business zone; forwarded unchanged.
      schema: {type: string, minLength: 1}
    GroupLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, format: int32, minimum: 1, maximum: 50, default: 20}
    GroupId:
      name: groupId
      in: path
      required: true
      schema: {type: string, pattern: '^[SM]-[1-9][0-9]{0,18}$', example: S-900}

  schemas:
    WorkerAttendanceIncidentTypeDTO:
      type: string
      description: Main API incident-type enum; alert-only chip values are excluded.
      enum: [EARLY_ENTRY, LATE_ENTRY, EARLY_EXIT, LATE_EXIT, UNEXPLAINED_GAP, UNSCHEDULED_WORK, AMBIGUOUS_MATCH, NO_SHOW, AUTOMATIC_CLOSE, OUTSIDE_GEOFENCE]
    WorkerAttendanceIncidentScopeDTO:
      type: string
      enum: [MATCH, SHIFT]
    WorkerAttendanceIncidentPageDTO:
      type: object
      additionalProperties: false
      description: Legacy individual inbox page; cursor and order are forwarded from Main API.
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/WorkerAttendanceIncidentItemDTO'}
        hasNext: {type: boolean}
        nextCursor: {type: [string, 'null']}
      required: [content, hasNext, nextCursor]
    WorkerAttendanceIncidentItemDTO:
      type: object
      properties:
        incident: {$ref: '#/components/schemas/WorkerAttendanceIncidentDTO'}
        anchor: {$ref: '#/components/schemas/WorkerAttendanceAnchorDTO'}
      required: [incident, anchor]
    WorkerAttendanceIncidentDTO:
      type: object
      additionalProperties: false
      description: Minimal caller view; excludes author/resolver identities and incident evidence.
      properties:
        id: {type: integer, format: int64, minimum: 1}
        scope: {$ref: '#/components/schemas/WorkerAttendanceIncidentScopeDTO'}
        attendanceMatchId: {type: [integer, 'null'], format: int64, minimum: 1}
        scheduledShiftId: {type: [integer, 'null'], format: int64, minimum: 1}
        type: {$ref: '#/components/schemas/WorkerAttendanceIncidentTypeDTO'}
        lifecycle: {$ref: '../../components/attendance/components.yml#/components/schemas/AttendanceIncidentLifecycleDTO'}
        resolution:
          oneOf:
            - {$ref: '../../components/attendance/components.yml#/components/schemas/AttendanceIncidentResolutionDTO'}
            - {type: 'null'}
        measuredSeconds: {type: [integer, 'null'], format: int64, minimum: 0}
        toleranceSeconds: {type: [integer, 'null'], format: int64, minimum: 0}
        justification:
          oneOf:
            - type: object
              properties:
                text: {type: string, minLength: 1, maxLength: 500}
                justifiedAt: {type: string, format: date-time}
              required: [text, justifiedAt]
            - {type: 'null'}
        resolvedAt: {type: [string, 'null'], format: date-time}
        reason: {type: [string, 'null'], maxLength: 500}
        canJustify: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
      required: [id, scope, attendanceMatchId, scheduledShiftId, type, lifecycle, resolution, measuredSeconds, toleranceSeconds, justification, resolvedAt, reason, canJustify, createdAt, updatedAt, version]
    WorkerAttendanceMatchKindDTO:
      type: string
      description: >-
        Main API `AttendanceMatchKindDTO` of the worklog's current match, passed through. In the
        day history a SHIFT row only holds MATCHED worklogs of that shift, and an UNMATCHED row
        holds an UNSCHEDULED or AMBIGUOUS worklog. NOT_APPLICABLE (no published planning) is
        never a day row; it is read with `getWorkerAttendanceMatch`. New values may be added;
        clients must tolerate unknown values.
      enum: [NOT_APPLICABLE, MATCHED, UNSCHEDULED, AMBIGUOUS]
      example: MATCHED

    WorkerWorklogChangeDTO:
      type: object
      additionalProperties: false
      description: >-
        Main API `WorklogChangeDTO` of the caller's own worklog, read with the existing
        `getWorklogHistory`: the exact subset of its fields, with `confirmation`. The author
        is not exposed to the worker: Main API `authorId` (and `userId`, `businessId`) are not
        mapped, and no name is resolved. A change with a non-null `confirmation` was made by
        management; `confirmation.respondedBy` can only be the caller.
      properties:
        id: {type: integer, format: int64, minimum: 1, example: 1201}
        worklogId: {type: integer, format: int64, minimum: 1, example: 3051}
        action: {$ref: '../../components/attendance/components.yml#/components/schemas/AttendanceWorklogChangeActionDTO'}
        oldClockIn: {type: string, format: date-time}
        newClockIn: {type: string, format: date-time}
        oldClockOut: {type: [string, 'null'], format: date-time}
        newClockOut: {type: [string, 'null'], format: date-time}
        breakChange:
          description: Present only for BREAK_CORRECTED and BREAK_VOIDED; null otherwise.
          oneOf:
            - type: object
              properties:
                breakId: {type: integer, format: int64, minimum: 1}
                oldStartedAt: {type: string, format: date-time}
                oldEndedAt: {type: [string, 'null'], format: date-time}
                newStartedAt: {type: [string, 'null'], format: date-time}
                newEndedAt: {type: [string, 'null'], format: date-time}
              required: [breakId, oldStartedAt, oldEndedAt, newStartedAt, newEndedAt]
            - type: 'null'
        reason:
          type: [string, 'null']
          maxLength: 500
          example: The register was closed at 16:30.
        occurredAt:
          type: string
          format: date-time
          example: "2026-10-30T19:02:11+01:00"
        confirmation:
          description: >-
            Main API `WorklogChangeDTO.confirmation`, forwarded unchanged. Null when no
            confirmation was requested (own, break and system changes, and every change
            recorded before the Main API rollout): null never means reviewed or agreed.
            PENDING means the worker can answer with
            `PUT /api/v1/worker/worklog-changes/{id}/confirmation`.
          oneOf:
            - $ref: '../common/components.yml#/components/schemas/WorklogChangeConfirmationDTO'
            - type: 'null'
          example: null
      required: [id, worklogId, action, oldClockIn, newClockIn, oldClockOut, newClockOut, breakChange, reason, occurredAt, confirmation]

    WorkerAttendanceWorklogDTO:
      type: object
      description: >-
        One of the worker's own worklogs with its current match, and its change history from
        `getWorklogHistory`. In the day history it comes from the Main API `getDailyAttendance`
        worklog and its match; in `getWorkerAttendanceMatch` from `getWorklogById` and
        `getAttendanceMatch`. Same fields and rules in both. The legacy `sessions` of the day
        keep the same worklogs as `SessionDTO`.
      properties:
        worklogId: {type: integer, format: int64, minimum: 1, example: 3051}
        attendanceMatchId: {type: integer, format: int64, minimum: 1, example: 700}
        matchKind: {$ref: '#/components/schemas/WorkerAttendanceMatchKindDTO'}
        clockIn: {type: string, format: date-time}
        clockOut: {type: [string, 'null'], format: date-time}
        durationSeconds: {type: [integer, 'null'], format: int64, minimum: 0}
        version: {type: integer, format: int64, minimum: 0}
        reviewStatus: {$ref: '../attendance/components.yml#/components/schemas/AttendanceReviewStatusDTO'}
        breaks:
          type: array
          items: {$ref: './components.yml#/components/schemas/WorkerBreakDTO'}
        changes:
          type: array
          items: {$ref: '#/components/schemas/WorkerWorklogChangeDTO'}
      required: [worklogId, attendanceMatchId, matchKind, clockIn, clockOut, durationSeconds, version, reviewStatus, breaks, changes]

    WorkerAttendanceJobRoleDTO:
      type: object
      additionalProperties: false
      description: Job-role id stored on the shift and its name resolved from the member-visible team schedule.
      properties:
        id: {type: integer, format: int64, minimum: 1, example: 10}
        name: {type: string, minLength: 1, example: Barra}
      required: [id, name]

    WorkerAttendanceRowDTO:
      type: object
      description: |
        One caller-owned attendance row of the worker's day, built from Main getDailyAttendance.
        SHIFT rows contain only MATCHED worklogs for that shift and its incidents. UNMATCHED
        rows represent one distinct UNSCHEDULED or AMBIGUOUS match (including candidates also
        listed on shifts), deduplicated by match id. NOT_APPLICABLE matches are not rows and are
        read with getWorkerAttendanceMatch. Never pair sessions and shifts by time or choose a
        candidate shift. Worklogs and incidents appear only on their owning row.
      properties:
        kind: {$ref: '../attendance/components.yml#/components/schemas/AttendanceRowKindDTO'}
        scheduledShiftId: {type: [integer, 'null'], format: int64, minimum: 1}
        attendanceMatchId: {type: [integer, 'null'], format: int64, minimum: 1}
        planned:
          oneOf:
            - $ref: '../attendance/components.yml#/components/schemas/AttendancePlannedDTO'
            - type: 'null'
        jobRoleId: {type: [integer, 'null'], format: int64, minimum: 1}
        jobRole:
          oneOf:
            - $ref: '#/components/schemas/WorkerAttendanceJobRoleDTO'
            - type: 'null'
        worklogs:
          type: array
          description: >-
            SHIFT row: MATCHED worklogs in Main API order, REJECTED included. UNMATCHED row:
            its one worklog. Empty for a shift without a MATCHED worklog.
          items: {$ref: '#/components/schemas/WorkerAttendanceWorklogDTO'}
        incidents:
          type: array
          description: >-
            Open and resolved incidents owned by this row, open first then by createdAt. A
            justified incident stays here as history and can still be replaced while OPEN.
          items: {$ref: '#/components/schemas/WorkerAttendanceIncidentDTO'}
      required: [kind, scheduledShiftId, attendanceMatchId, planned, jobRoleId, jobRole, worklogs, incidents]

    WorkerWorklogChangeConfirmationItemDTO:
      type: object
      description: One PENDING confirmation with its navigation anchor.
      properties:
        change: {$ref: '#/components/schemas/WorkerWorklogChangeDTO'}
        anchor: {$ref: '#/components/schemas/WorkerAttendanceAnchorDTO'}
        laterChangeExists:
          type: boolean
          description: >-
            Main API `laterChangeExists`, forwarded unchanged: true when the same worklog has
            any more recent change (any action and any author: management, the worker
            themselves or the system, breaks and AUTO_CLOSED included). It does not cancel or
            invalidate this confirmation; it stays PENDING and is answered on its own.
          example: false
      required: [change, anchor, laterChangeExists]
    WorkerWorklogChangeConfirmationPageDTO:
      type: object
      additionalProperties: false
      description: Cursor page of caller-owned PENDING confirmations, ordered by occurredAt descending then id.
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/WorkerWorklogChangeConfirmationItemDTO'}
        hasNext: {type: boolean}
        nextCursor: {type: [string, 'null']}
      required: [content, hasNext, nextCursor]
    WorkerWorklogChangeConfirmationRequestDTO:
      type: object
      additionalProperties: false
      description: >-
        Forwarded unchanged to Main API. Optional comment is trimmed, non-empty when supplied,
        and at most 500 characters; it is allowed with either answer.
      properties:
        status: {type: string, enum: [ACKNOWLEDGED, DISPUTED], example: ACKNOWLEDGED}
        comment: {type: [string, 'null'], minLength: 1, maxLength: 500, example: null}
        version: {type: integer, format: int64, minimum: 0, description: Confirmation version read (0 while PENDING).}
      required: [status, version]

    WorkerAttendanceMatchDetailDTO:
      type: object
      additionalProperties: false
      description: >-
        The caller's own attendance match of any kind (MATCHED, UNSCHEDULED, AMBIGUOUS or
        NOT_APPLICABLE) with its worklog and its incidents, built only from Main API
        `getAttendanceMatch`, `getWorklogById` and `getWorklogHistory` with the caller's
        token. It always has the worklog: every match has one. It carries no planned shift
        and no job role (for a MATCHED match the day history row has them), no candidate
        shift, no geofence detail and no management identity.
      properties:
        attendanceMatchId: {type: integer, format: int64, minimum: 1, example: 731}
        matchKind: {$ref: '#/components/schemas/WorkerAttendanceMatchKindDTO'}
        date:
          type: string
          format: date
          description: >-
            Business-local date: shift start for MATCHED, otherwise worklog clock-in, converted
            using the business time zone. Navigation only.
          example: "2026-11-02"
        scheduledShiftId:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: MATCHED shift id; null for UNSCHEDULED, AMBIGUOUS and NOT_APPLICABLE.
        worklog: {$ref: '#/components/schemas/WorkerAttendanceWorklogDTO'}
        incidents:
          type: array
          items: {$ref: '#/components/schemas/WorkerAttendanceIncidentDTO'}
      required: [attendanceMatchId, matchKind, date, scheduledShiftId, worklog, incidents]

    WorkerAttendanceAnchorDTO:
      type: object
      description: >-
        Legacy navigation anchor: business-local shift-start date for SHIFT/MATCHED, else
        worklog clock-in date. MATCH-scope always contains its real current match id;
        worklog id is derived from that match and null for SHIFT scope.
      properties:
        date: {type: string, format: date}
        scheduledShiftId: {type: [integer, 'null'], format: int64, minimum: 1}
        attendanceMatchId: {type: [integer, 'null'], format: int64, minimum: 1, description: Required for MATCH scope; null iff scope is SHIFT.}
        worklogId: {type: [integer, 'null'], format: int64, minimum: 1, description: Required for MATCH scope; null iff scope is SHIFT.}
      required: [date, scheduledShiftId, attendanceMatchId, worklogId]
    WorkerAttendanceInboxSummaryDTO:
      type: object
      additionalProperties: false
      description: Global caller/business counts forwarded from the Main API group-page summary.
      properties:
        incidentCount: {type: integer, format: int32, minimum: 0, example: 2}
        confirmationCount: {type: integer, format: int32, minimum: 0, example: 1}
      required: [incidentCount, confirmationCount]

    WorkerAttendanceIncidentGroupKindDTO:
      type: string
      enum: [SHIFT, UNMATCHED]
    WorkerAttendanceGroupFilterClassDTO:
      type: string
      enum: [JUSTIFIED, UNJUSTIFIED]
    WorkerAttendanceGroupJustificationStateDTO:
      type: string
      enum: [NONE, COMMON, LEGACY_SINGLE, PARTIAL, NOT_COMMON]
    WorkerAttendanceGroupJustificationOriginDTO:
      type: string
      enum: [COMMON, INDIVIDUAL]
    WorkerAttendanceGroupMemberJustificationDTO:
      type: object
      properties:
        text: {type: string, minLength: 1, maxLength: 500}
        justifiedAt: {type: string, format: date-time}
        origin: {$ref: '#/components/schemas/WorkerAttendanceGroupJustificationOriginDTO'}
      required: [text, justifiedAt, origin]
    WorkerAttendanceGroupMemberDTO:
      type: object
      description: Caller-safe OPEN member view, ordered by incidentId; contains no author/resolver identity, evidence or reason.
      properties:
        incidentId: {type: integer, format: int64, minimum: 1}
        type: {$ref: '#/components/schemas/WorkerAttendanceIncidentTypeDTO'}
        scope: {$ref: '#/components/schemas/WorkerAttendanceIncidentScopeDTO'}
        attendanceMatchId: {type: [integer, 'null'], format: int64, minimum: 1}
        worklogId: {type: [integer, 'null'], format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        justification:
          oneOf:
            - {$ref: '#/components/schemas/WorkerAttendanceGroupMemberJustificationDTO'}
            - {type: 'null'}
      required: [incidentId, type, scope, attendanceMatchId, worklogId, createdAt, justification]
    WorkerAttendanceGroupJustificationDTO:
      type: object
      description: >-
        COMMON is one group-level value on all current OPEN members; LEGACY_SINGLE is a
        legacy individual value on the sole current OPEN member; PARTIAL means only some are justified; NOT_COMMON
        means all are justified but individual values differ; NONE means none. `legacy`
        identifies legacy individual evidence. Only COMMON and LEGACY_SINGLE are JUSTIFIED;
        `common` is null except in COMMON state.
      properties:
        state: {$ref: '#/components/schemas/WorkerAttendanceGroupJustificationStateDTO'}
        filterClass: {$ref: '#/components/schemas/WorkerAttendanceGroupFilterClassDTO'}
        legacy: {type: boolean}
        common:
          oneOf:
            - type: object
              properties:
                text: {type: string, minLength: 1, maxLength: 500}
                justifiedAt: {type: string, format: date-time}
              required: [text, justifiedAt]
            - {type: 'null'}
        openCount: {type: integer, format: int32, minimum: 1}
        justifiedOpenCount: {type: integer, format: int32, minimum: 0}
      required: [state, filterClass, legacy, common, openCount, justifiedOpenCount]
    WorkerAttendanceIncidentGroupDTO:
      type: object
      additionalProperties: false
      properties:
        groupId: {type: string, pattern: '^[SM]-[1-9][0-9]{0,18}$'}
        kind: {$ref: '#/components/schemas/WorkerAttendanceIncidentGroupKindDTO'}
        scheduledShiftId: {type: [integer, 'null'], format: int64, minimum: 1}
        attendanceMatchIds:
          type: array
          items: {type: integer, format: int64, minimum: 1}
        businessDate: {type: string, format: date}
        anchorAt: {type: string, format: date-time, description: UTC shift start for SHIFT or clock-in for UNMATCHED.}
        revision:
          type: string
          pattern: '^rv1-[A-Za-z0-9_-]{43}$'
          description: rv1- plus unpadded base64url SHA-256 of canonical caller/group/anchor/match/member snapshot.
        justification: {$ref: '#/components/schemas/WorkerAttendanceGroupJustificationDTO'}
        openMembers:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/WorkerAttendanceGroupMemberDTO'}
      required: [groupId, kind, scheduledShiftId, attendanceMatchIds, businessDate, anchorAt, revision, justification, openMembers]
    WorkerAttendanceIncidentGroupPageDTO:
      type: object
      additionalProperties: false
      description: >-
        One response snapshot forwarded from Main, with complete matching OPEN groups, their
        exact filtered total, and the caller-scoped global summary. The total is counted
        after date and justification filters but before cursor/limit; summary is independent
        of all list filters and pagination parameters. If Main cannot compute any count, the
        BFF forwards failure rather than manufacturing a zero. Later pages are live responses
        and may have different totals and summaries; do not add or merge counters across pages.
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/WorkerAttendanceIncidentGroupDTO'}
        totalGroupsMatchingFilters:
          type: integer
          format: int64
          minimum: 0
          description: Complete OPEN groups matching date and justification filters, before cursor and limit; forwarded from Main.
          example: 0
        summary:
          allOf:
            - $ref: '#/components/schemas/WorkerAttendanceInboxSummaryDTO'
          description: Global caller-scoped counts forwarded in the same Main response, unaffected by list filters or pagination.
        hasNext: {type: boolean}
        nextCursor: {type: [string, 'null'], description: Null iff hasNext is false.}
        asOf: {type: string, format: date-time}
      required: [content, totalGroupsMatchingFilters, summary, hasNext, nextCursor, asOf]
    WorkerAttendanceIncidentGroupJustificationRequestDTO:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, minLength: 1, maxLength: 500, pattern: '(?=.*\S)[\s\S]+', description: Exact text; validated without trimming.}
        expectedRevision: {type: string, pattern: '^rv1-[A-Za-z0-9_-]{43}$'}
      required: [text, expectedRevision]
    WorkerAttendanceIncidentGroupJustificationResponseDTO:
      type: object
      properties:
        outcome: {type: string, enum: [APPLIED, REPLAYED]}
        group: {$ref: '#/components/schemas/WorkerAttendanceIncidentGroupDTO'}
      required: [outcome, group]
    WorkerAttendanceIncidentGroupConflictProblemDetailDTO:
      allOf:
        - $ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'
        - type: object
          properties:
            currentGroupId: {type: [string, 'null'], pattern: '^[SM]-[1-9][0-9]{0,18}$'}
          required: [currentGroupId]

  responses:
    Unauthorized:
      description: No authenticated session.
    NotMember:
      description: Caller is not an active member of the business (1015).
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 403, detail: '1015 - user is not member of business'}
    BusinessNotFound:
      description: Business does not exist (1006).
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 404, detail: '1006 - business does not exist'}
    AttendanceMatchNotFound:
      description: >-
        Forwarded from Main API getAttendanceMatch: the match does not exist or is not the
        caller's own (1074), with the same body in either case.
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 404, detail: '1074 - attendance match not found'}
    InboxListBadRequest:
      description: Legacy inbox cursor invalid or bound to another business, caller or collection (1142).
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 400, detail: '1142 - attendance inbox cursor is invalid or does not match this query'}
    GroupListBadRequest:
      description: Invalid date or limit (1144), or cursor invalid or bound to a different filter/scope (1145).
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          examples:
            requestInvalid: {value: {status: 400, detail: '1144 - attendance incident group request is invalid'}}
            cursorInvalid: {value: {status: 400, detail: '1145 - attendance incident group cursor is invalid or does not match this query'}}
    GroupRequestBadRequest:
      description: Invalid group justification request (1144); forwarded from Main API.
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 400, detail: '1144 - attendance incident group request is invalid'}
    GroupNotFound:
      description: Caller-owned group is missing, noncanonical or not visible (1146).
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 404, detail: '1146 - attendance incident group not found'}
    GroupConflict:
      description: Revision conflict (1147) or not open (1148). Proposed future-writer code 1150 is not emitted by these routes.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/WorkerAttendanceIncidentGroupConflictProblemDetailDTO'}
          examples:
            revisionConflict: {value: {status: 409, detail: '1147 - attendance incident group revision conflict', currentGroupId: null}}
            canonicalized: {value: {status: 409, detail: '1147 - attendance incident group revision conflict', currentGroupId: S-900}}
            notOpen: {value: {status: 409, detail: '1148 - attendance incident group is not open', currentGroupId: null}}
    GroupLockTimeout:
      description: Lock timeout; retry after one second (1149).
      headers:
        Retry-After: {description: Seconds before retrying., schema: {type: integer, enum: [1], example: 1}}
      content:
        application/problem+json:
          schema: {$ref: '../../components/common/components.yml#/components/schemas/ProblemDetail'}
          example: {status: 503, detail: '1149 - attendance incident group lock timed out'}
