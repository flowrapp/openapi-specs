components:
  schemas:
    WorkerBusinessResponseDTO:
      type: object
      description: Business information from the worker's perspective
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the business
          example: 101
        nif:
          type: string
          minLength: 1
          description: Tax identification number for the business
          example: B12345678
        name:
          type: string
          description: Name of the business
          example: "Coffee Time"
        zone:
          type: string
          description: IANA time zone identifier for the business
          example: "Europe/Madrid"
        address:
          type: string
          description: Street address of the business
          example: "C/ Gran Vía 43"
        town:
          type: string
          description: Town of the business
          example: "Barbate"
        city:
          type: string
          description: City of the business
          example: "Cádiz"
        country:
          type: string
          description: Country of the business
          example: "España"
        postalCode:
          type: string
          description: Postal code of the business
          example: "11160"
        location:
          $ref: '../common/components.yml#/components/schemas/LocationDTO'
        userRole:
          type: string
          description: Role of the current user in this business
          enum: [OWNER, EMPLOYEE]
          example: "EMPLOYEE"
        permissions:
          type: array
          uniqueItems: true
          description: >
            Effective permissions of the current user in this business (Main API `getUserBusinesses`,
            forwarded unchanged). An OWNER holds all permissions of the effective business features;
            an EMPLOYEE those of its access role in the effective features, or none without an active
            contract. Core permissions do not require a feature. The app gates management screens on
            these, never on `userRole`.
          items:
            $ref: '../members/components.yml#/components/schemas/BusinessPermission'
          example: [TEAM_VIEW, WORKLOGS_VIEW]
        accessRole:
          oneOf:
            - $ref: '../members/components.yml#/components/schemas/AccessRoleSummaryDTO'
            - type: 'null'
          description: Access role of the current user, or null
        plan:
          type: string
          minLength: 1
          description: >
            Commercial plan of the business (Main API `getUserBusinesses`, forwarded unchanged). Open
            value set: `ESSENTIAL` and `PROFESSIONAL` today.
          example: PROFESSIONAL
        features:
          type: array
          uniqueItems: true
          description: >
            Effective features of the business (Main API `getUserBusinesses`, forwarded unchanged). The
            app shows a feature's screens, including worker ones, only when it is listed here, and
            gates management actions on `permissions` as well.
          items:
            $ref: '../members/components.yml#/components/schemas/BusinessFeature'
          example: [SCHEDULING, ATTENDANCE, ADVANCED_PLANNING]
        attendanceToleranceMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 1440
          description: >
            Read-only. Minutes tolerated for attendance deviations in this business (the Main API
            `getUserBusinesses` `attendanceToleranceMinutes`, forwarded unchanged; no extra Main API
            call). The same value for every role. It is changed only through the Main API
            attendance-tolerance endpoint.
          example: 5
      required:
        - id
        - nif
        - name
        - zone
        - address
        - town
        - city
        - country
        - postalCode
        - location
        - userRole
        - permissions
        - plan
        - features
        - accessRole
        - attendanceToleranceMinutes

    ClockViewResponseDTO:
      type: object
      description: >
        Aggregated clock view for the worker's current day. Combines today's work sessions,
        the currently active session (if any), its open break (if any), the day's breaks, and
        running totals for the week and month.
      properties:
        date:
          type: string
          format: date
          description: The date this clock view represents
          example: "2025-07-29"
        activeWorklog:
          description: The currently open/active work session (null if the worker is clocked out)
          oneOf:
            - $ref: '../common/components.yml#/components/schemas/SessionDTO'
            - type: 'null'
        sessions:
          type: array
          description: All completed work sessions for this date
          items:
            $ref: '../common/components.yml#/components/schemas/SessionDTO'
        activeBreak:
          description: >
            The open break («Pausa») of `activeWorklog`, or null when the worker is not on a break or is
            clocked out. Non-null means the Main API `operationalState` of the active worklog is `ON_BREAK`:
            the app shows «Reanudar» (end the break) instead of «Pausa». It is also the last item of `breaks`.
          oneOf:
            - $ref: '#/components/schemas/WorkerBreakDTO'
            - type: 'null'
        breaks:
          type: array
          description: >
            Breaks of the worklogs in this view (`activeWorklog` and `sessions`), open one included, sorted by
            `startedAt`. Only EFFECTIVE breaks: a VOIDED break does not deduct time and is not listed. There is
            a single kind of break («Pausa», no types) and every break is deducted from the worked time. Empty
            when there are none. To show a running counter for the active session, the app computes
            `now - activeWorklog.clockIn` minus the closed breaks of that worklog, minus `now - activeBreak.startedAt`
            when `activeBreak` is not null.
          items:
            $ref: '#/components/schemas/WorkerBreakDTO'
          example:
            - id: 456
              worklogId: 123
              startedAt: "2025-07-29T11:00:00+02:00"
              endedAt: "2025-07-29T11:30:00+02:00"
              durationSeconds: 1800
            - id: 457
              worklogId: 123
              startedAt: "2025-07-29T14:00:00+02:00"
              endedAt: null
              durationSeconds: null
        totalSecondsWeek:
          type: integer
          format: int64
          description: >
            Total seconds worked in the current ISO week. Counts only closed worklogs in CONFIRMED or APPROVED, the same rule as the
            worked-hours PDF and «Mis horas» confirmedSeconds (BFF 0.0.105; in 0.0.103 and 0.0.104 it also
            counted PENDING_RECONCILIATION and PENDING_REVIEW). Excludes pending, REJECTED worklogs and open sessions.
          example: 129600
        totalSecondsMonth:
          type: integer
          format: int64
          description: >
            Total seconds worked in the current calendar month. Counts only closed worklogs in CONFIRMED or APPROVED, the same rule as the
            worked-hours PDF and «Mis horas» confirmedSeconds (BFF 0.0.105; in 0.0.103 and 0.0.104 it also
            counted PENDING_RECONCILIATION and PENDING_REVIEW). Excludes pending, REJECTED worklogs and open sessions.
          example: 504000
        pendingSecondsWeek:
          type: integer
          format: int64
          minimum: 0
          description: >
            Pending seconds of the current ISO week: closed worklogs in PENDING_RECONCILIATION or PENDING_REVIEW, net of
            effective breaks, NOT included in totalSecondsWeek (BFF 0.0.105). The app shows them
            apart, «+X h pendientes de revisar». 0 means nothing pending. Absent means they could not be read: show
            nothing, never 0.
          example: 5400
        pendingSecondsMonth:
          type: integer
          format: int64
          minimum: 0
          description: >
            Pending seconds of the current calendar month: closed worklogs in PENDING_RECONCILIATION or PENDING_REVIEW, net of
            effective breaks, NOT included in totalSecondsMonth (BFF 0.0.105). The app shows them
            apart, «+X h pendientes de revisar». 0 means nothing pending. Absent means they could not be read: show
            nothing, never 0.
          example: 15300
        autoClocking:
          description: >
            The worker's effective automatic clock-in («Fichaje automático») for this business, so the home
            can show «Fichaje automático activo» without another call. Same value as
            `getWorkerAutoClockingSettings`: the business-wide switch AND the worker's own preference (Main API
            setting `AUTO_CLOCKING_BY_GEOFENCE`, both default to true when never stored). It says whether the
            backend WILL clock in and out automatically from the device geofence events
            (`PUT /api/v1/worker/businesses/{businessId}/geofence-events/{eventId}`); it does not know the device
            state, so the app shows the label only when `effectiveEnabled` is true AND its own geofence is
            registered with location permission «Always». The backend only clocks in automatically when the
            worker has exactly one published segment within 30 minutes of the dwell event
            (the gap of a split shift does not match), and clocks out on the exit event.
            This version does not auto-close a worklog when a segment ends. Not tied to
            `date`: it is the current setting.
          $ref: '../settings/components.yml#/components/schemas/CurrentUserAutoClockingSettingsDTO'
      required:
        - date
        - sessions
        - breaks
        - totalSecondsWeek
        - totalSecondsMonth
        - autoClocking

    WorkerBreakDTO:
      type: object
      description: >
        A worker break («Pausa») inside a worklog. There is a single kind of break and it is always deducted
        from the worked time. Mapped from the Main API `WorklogBreakDTO`.
      properties:
        id:
          type: integer
          format: int64
          description: Identifier of the break (the `breakId` used to end it).
          example: 457
        worklogId:
          type: integer
          format: int64
          description: Identifier of the worklog the break belongs to.
          example: 123
        startedAt:
          type: string
          format: date-time
          description: Effective break start.
          example: "2025-07-29T14:00:00+02:00"
        endedAt:
          type: ['string', 'null']
          format: date-time
          description: Effective break end, or null while the break is open.
          example: null
        durationSeconds:
          type: ['integer', 'null']
          format: int64
          description: "`endedAt - startedAt` in seconds, or null while the break is open."
          example: null
      required:
        - id
        - worklogId
        - startedAt

    WorkerBreakStartRequestDTO:
      type: object
      description: Idempotent request to start a break on the worker's open worklog.
      additionalProperties: false
      properties:
        idempotencyId:
          type: string
          format: uuid
          description: Client-generated command identifier, reused when retrying the same break start.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        startedAt:
          type: string
          format: date-time
          description: >
            Observed break start (for example a tap queued while offline). Omit it to use the server clock.
            It must not be before the clock-in or in the future (1073).
          example: "2025-07-29T14:00:00+02:00"
      required:
        - idempotencyId

    WorkerBreakEndRequestDTO:
      type: object
      description: Idempotent request to end the worker's open break.
      additionalProperties: false
      properties:
        idempotencyId:
          type: string
          format: uuid
          description: Client-generated command identifier, reused when retrying the same break end.
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        endedAt:
          type: string
          format: date-time
          description: >
            Observed break end. Omit it to use the server clock. It must be after `startedAt` and not in the
            future (1073).
          example: "2025-07-29T14:30:00+02:00"
      required:
        - idempotencyId

    WorklogLocationDTO:
      type: object
      description: Device location captured when clocking in or out.
      additionalProperties: false
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 36.19
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -5.99
      required: [latitude, longitude]

    ClockInRequestDTO:
      type: object
      description: Request to clock in (start a work session)
      properties:
        clockIn:
          type: string
          format: date-time
          description: Optional clock-in timestamp. Server uses current time if omitted.
          example: "2025-07-29T08:30:00+02:00"
        location:
          description: Device location at clock-in; may be omitted or null if unavailable.
          oneOf:
            - $ref: '#/components/schemas/WorklogLocationDTO'
            - type: 'null'
          example: {latitude: 36.19, longitude: -5.99}
        idempotencyId:
          type: string
          format: uuid
          description: Client-generated command identifier reused when retrying the same clock-in.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      required:
        - idempotencyId

    ClockInResultDTO:
      type: object
      description: Result of a successful clock-in, including the durable attendance-match identity.
      properties:
        worklog:
          $ref: '../common/components.yml#/components/schemas/SessionDTO'
        attendanceMatchId:
          type: integer
          format: int64
          minimum: 1
          description: Independently identified attendance match created for the session.
          example: 700
      required: [worklog, attendanceMatchId]

    ClockOutRequestDTO:
      type: object
      description: Request to clock out (end a work session)
      properties:
        clockOut:
          type: string
          format: date-time
          description: Optional clock-out timestamp. Server uses current time if omitted.
          example: "2025-07-29T17:30:00+02:00"
        location:
          description: Device location at clock-out; may be omitted or null if unavailable.
          oneOf:
            - $ref: '#/components/schemas/WorklogLocationDTO'
            - type: 'null'
          example: {latitude: 36.19, longitude: -5.99}
        idempotencyId:
          type: string
          format: uuid
          description: Client-generated command identifier reused when retrying the same clock-out.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      required:
        - idempotencyId

    GeofenceEventRequestDTO:
      type: object
      description: Geofence event captured by a worker's device
      additionalProperties: false
      properties:
        deviceId:
          type: string
          format: uuid
          description: Unique identifier of the device that emitted the event
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        type:
          type: string
          description: ENTER when entering, DWELL while still inside, or EXIT when leaving the geofence
          enum: [ENTER, DWELL, EXIT]
          example: ENTER
        occurredAt:
          type: string
          format: date-time
          description: Timestamp when the event occurred on the device
          example: "2026-08-06T08:15:00Z"
      required:
        - deviceId
        - type
        - occurredAt

    IssueGeofenceDeviceCredentialRequestDTO:
      type: object
      description: Device identifier for which to issue a geofence-only credential
      additionalProperties: false
      properties:
        deviceId:
          type: string
          format: uuid
          description: Unique identifier of the device
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      required: [deviceId]

    GeofenceDeviceCredentialDTO:
      type: object
      description: Newly issued geofence device credential and its validity period
      additionalProperties: false
      properties:
        token:
          type: string
          description: Opaque random 256-bit base64url credential (not a JWT). Store securely; it is returned only when issued.
          example: "6d2WwR3wVh0mAE8k0x5D6WzPjVgYZtld4bMHQfK2qCo"
        issuedAt:
          type: string
          format: date-time
          description: Time the credential was issued
          example: "2026-11-08T12:00:00Z"
        expiresAt:
          type: string
          format: date-time
          description: Time the credential expires (90 days after issuance)
          example: "2027-02-06T12:00:00Z"
      required: [token, issuedAt, expiresAt]

    WorkerDayHistoryResponseDTO:
      type: object
      description: Detailed work history for a single day, including all individual sessions and attendance rows
      properties:
        date:
          type: string
          format: date
          description: The date of this history entry
          example: "2025-03-10"
        closed:
          type: boolean
          description: >-
            Whether the business-local date is closed: its effective daily configuration has no
            opening intervals (date exception, otherwise the recurring schedule effective on the
            date, otherwise no configuration). False when this cannot be determined, for example
            when the week has no published planning.
          example: false
        totalSeconds:
          type: integer
          format: int64
          description: >
            Total seconds worked on this date. Counts only closed worklogs in CONFIRMED or APPROVED, the same rule as the
            worked-hours PDF and «Mis horas» confirmedSeconds (BFF 0.0.105; in 0.0.103 and 0.0.104 it also
            counted PENDING_RECONCILIATION and PENDING_REVIEW). Excludes pending, REJECTED worklogs and open sessions.
          example: 30600
        pendingSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Seconds of closed worklogs in PENDING_RECONCILIATION or PENDING_REVIEW, net of effective
            breaks and attributed to the business-local date of the clock-in, like the total. NOT included
            in the total (BFF 0.0.105; in 0.0.103 and 0.0.104 they were included): the app shows them
            apart, «+X h pendientes de revisar». 0 means nothing pending. Absent means the pending seconds
            could not be read (or an older BFF): show nothing, never 0.
          example: 3600
        sessions:
          type: array
          description: Individual work sessions for this date
          items:
            $ref: '../common/components.yml#/components/schemas/SessionDTO'
        attendances:
          type: array
          description: >-
            The caller's attendance rows for this business-local date. A worklog appears in
            at most one row; NOT_APPLICABLE worklogs remain in sessions and use attendance-match detail.
          items:
            $ref: './inbox-components.yml#/components/schemas/WorkerAttendanceRowDTO'
      required:
        - date
        - closed
        - totalSeconds
        - sessions
        - attendances

    WorkerWeekHistoryResponseDTO:
      type: object
      description: Work history summary for an ISO week, with per-day breakdown including sessions
      properties:
        week:
          type: string
          description: ISO 8601 week identifier
          pattern: '^\d{4}-W\d{2}$'
          example: "2025-W31"
        totalSeconds:
          type: integer
          format: int64
          description: >
            Total seconds worked in this week. Counts only closed worklogs in CONFIRMED or APPROVED, the same rule as the
            worked-hours PDF and «Mis horas» confirmedSeconds (BFF 0.0.105; in 0.0.103 and 0.0.104 it also
            counted PENDING_RECONCILIATION and PENDING_REVIEW). Excludes pending, REJECTED worklogs and open sessions.
          example: 144000
        pendingSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Seconds of closed worklogs in PENDING_RECONCILIATION or PENDING_REVIEW, net of effective
            breaks and attributed to the business-local date of the clock-in, like the total. NOT included
            in the total (BFF 0.0.105; in 0.0.103 and 0.0.104 they were included): the app shows them
            apart, «+X h pendientes de revisar». 0 means nothing pending. Absent means the pending seconds
            could not be read (or an older BFF): show nothing, never 0.
          example: 3600
        totalSessions:
          type: integer
          format: int32
          description: Total number of work sessions in this week
          example: 8
        days:
          type: array
          description: Per-day breakdown for the week
          items:
            $ref: '#/components/schemas/WorkerWeekDayDTO'
      required:
        - week
        - totalSeconds
        - totalSessions
        - days

    WorkerWeekDayDTO:
      type: object
      description: >
        A single day within a week history, including session details.
        `totalSeconds` is confirmed time and `pendingSeconds` keeps its own meaning;
        pending seconds are not added to `plannedSeconds`.
      properties:
        date:
          type: string
          format: date
          description: The date
          example: "2025-07-28"
        closed:
          type: boolean
          description: >-
            Whether the business-local date is closed: its effective daily configuration has no
            opening intervals (date exception, otherwise the recurring schedule effective on the
            date, otherwise no configuration). False when this cannot be determined, for example
            when the week has no published planning.
          example: false
        totalSeconds:
          type: integer
          format: int64
          description: >
            Total seconds worked on this day. Counts only closed worklogs in CONFIRMED or APPROVED, the same rule as the
            worked-hours PDF and «Mis horas» confirmedSeconds (BFF 0.0.105; in 0.0.103 and 0.0.104 it also
            counted PENDING_RECONCILIATION and PENDING_REVIEW). Excludes pending, REJECTED worklogs and open sessions.
            Confirmed seconds only: this meaning is unchanged, and these seconds are not planned time.
            `pendingSeconds` is not added to `plannedSeconds`.
          example: 28800
        pendingSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Seconds of closed worklogs in PENDING_RECONCILIATION or PENDING_REVIEW, net of effective
            breaks and attributed to the business-local date of the clock-in, like the total. NOT included
            in the total (BFF 0.0.105; in 0.0.103 and 0.0.104 they were included): the app shows them
            apart, «+X h pendientes de revisar». 0 means nothing pending. Absent means the pending seconds
            could not be read (or an older BFF): show nothing, never 0.
            This meaning is unchanged. Pending seconds are not added to `plannedSeconds`.
          example: 1800
        plannedSeconds:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: >
            Planned seconds for the caller on this business-local date, from the PUBLISHED
            planning of this date's ISO week. The BFF reads Main `getBusinessTeamSchedule`
            (`GET /api/v1/businesses/{businessId}/team-schedules/{weekStart}`, filtered to the
            caller) and sums `plannedSeconds` of the caller's shifts placed on this date.
            A shift counts as the sum of its segments minus the break; the unpaid gap of a
            split shift is not included. A night shift counts entirely on its start day (the
            team-schedule date that already carries it) and adds nothing to the next date.
            `null` means no data (no published planning for this date's ISO week, or the
            business does not have the SCHEDULING feature). `0` means the week is published
            and this date has no shift. The client must not interpolate nulls: a null day is
            a gap, not a zero, and must not be filled from neighbouring days or treated as 0
            when accumulating. An ISO week that crosses the month affects only its own dates
            in this response. A week that team-schedules returns (PUBLISHED, or ARCHIVED that
            was previously published) counts as published; DRAFT and a 404 do not.
            `pendingSeconds` is not added to this value.
          example: 28800
        unjustifiedIncidentCount:
          type: [integer, 'null']
          format: int32
          minimum: 0
          description: >
            Number of the caller's attendance incidents anchored on this business-local date
            (the business time zone) that are still OPEN with no justification. Unjustified
            means OPEN and justification null, the same definition as the worker inbox
            (`getWorkerAttendanceIncidents` / Main `getCurrentUserAttendanceIncidents`):
            an incident that is OPEN but already justified, and a resolved incident, are not
            counted. The anchor date is the inbox anchor (business-local shift start for
            SHIFT scope or a MATCHED match, otherwise the business-local clock-in date), so
            a night shift's incidents stay on the shift's start date. `null` when the
            business does not have the ATTENDANCE feature. `0` when the feature is available
            and this date has no such incident (the date is absent from Main
            `getCurrentUserAttendanceIncidentDailyCounts`).
          example: 1
        sessions:
          type: array
          description: Work sessions for this day
          items:
            $ref: '../common/components.yml#/components/schemas/SessionDTO'
      required:
        - date
        - closed
        - totalSeconds
        - plannedSeconds
        - unjustifiedIncidentCount
        - sessions

    WorkerMonthHistoryResponseDTO:
      type: object
      description: >
        Work history calendar for a month. Returns day-level totals only (no session detail).
        Use the day history endpoint to drill into a specific day. The month line accumulates
        daily confirmed `totalSeconds` against daily `plannedSeconds`. Pending seconds are not
        added to planned seconds. A null `plannedSeconds` is a gap: the client must not
        interpolate nulls.
      properties:
        month:
          type: string
          description: Year and month in YYYY-MM format
          pattern: '^\d{4}-\d{2}$'
          example: "2025-03"
        totalSeconds:
          type: integer
          format: int64
          description: >
            Total seconds worked in this month. Counts only closed worklogs in CONFIRMED or APPROVED, the same rule as the
            worked-hours PDF and «Mis horas» confirmedSeconds (BFF 0.0.105; in 0.0.103 and 0.0.104 it also
            counted PENDING_RECONCILIATION and PENDING_REVIEW). Excludes pending, REJECTED worklogs and open sessions.
          example: 237600
        pendingSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Seconds of closed worklogs in PENDING_RECONCILIATION or PENDING_REVIEW, net of effective
            breaks and attributed to the business-local date of the clock-in, like the total. NOT included
            in the total (BFF 0.0.105; in 0.0.103 and 0.0.104 they were included): the app shows them
            apart, «+X h pendientes de revisar». 0 means nothing pending. Absent means the pending seconds
            could not be read (or an older BFF): show nothing, never 0.
          example: 7200
        totalSessions:
          type: integer
          format: int32
          description: Total number of work sessions in this month
          example: 22
        days:
          type: array
          description: Per-day summary for the month
          items:
            $ref: '#/components/schemas/WorkerMonthDayDTO'
      required:
        - month
        - totalSeconds
        - totalSessions
        - days

    WorkerMonthDayDTO:
      type: object
      description: >
        A single day within a month history (totals only, no session detail).
        `totalSeconds` is confirmed time and `pendingSeconds` keeps its own meaning;
        pending seconds are not added to `plannedSeconds`.
      properties:
        date:
          type: string
          format: date
          description: The date
          example: "2025-03-01"
        totalSeconds:
          type: integer
          format: int64
          description: >
            Total seconds worked on this day. Counts only closed worklogs in CONFIRMED or APPROVED, the same rule as the
            worked-hours PDF and «Mis horas» confirmedSeconds (BFF 0.0.105; in 0.0.103 and 0.0.104 it also
            counted PENDING_RECONCILIATION and PENDING_REVIEW). Excludes pending, REJECTED worklogs and open sessions.
            Confirmed seconds only: this meaning is unchanged, and these seconds are not planned time.
            `pendingSeconds` is not added to `plannedSeconds`.
          example: 28800
        pendingSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Seconds of closed worklogs in PENDING_RECONCILIATION or PENDING_REVIEW, net of effective
            breaks and attributed to the business-local date of the clock-in, like the total. NOT included
            in the total (BFF 0.0.105; in 0.0.103 and 0.0.104 they were included): the app shows them
            apart, «+X h pendientes de revisar». 0 means nothing pending. Absent means the pending seconds
            could not be read (or an older BFF): show nothing, never 0.
            This meaning is unchanged. Pending seconds are not added to `plannedSeconds`.
          example: 1800
        plannedSeconds:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: >
            Planned seconds for the caller on this business-local date, from the PUBLISHED
            planning of this date's ISO week. The BFF reads Main `getBusinessTeamSchedule`
            (`GET /api/v1/businesses/{businessId}/team-schedules/{weekStart}`, filtered to the
            caller) and sums `plannedSeconds` of the caller's shifts placed on this date.
            A shift counts as the sum of its segments minus the break; the unpaid gap of a
            split shift is not included. A night shift counts entirely on its start day (the
            team-schedule date that already carries it) and adds nothing to the next date.
            `null` means no data (no published planning for this date's ISO week, or the
            business does not have the SCHEDULING feature). `0` means the week is published
            and this date has no shift. The client must not interpolate nulls: a null day is
            a gap, not a zero, and must not be filled from neighbouring days or treated as 0
            when accumulating. An ISO week that crosses the month affects only its own dates
            in this response. A week that team-schedules returns (PUBLISHED, or ARCHIVED that
            was previously published) counts as published; DRAFT and a 404 do not.
            `pendingSeconds` is not added to this value.
          example: 28800
        unjustifiedIncidentCount:
          type: [integer, 'null']
          format: int32
          minimum: 0
          description: >
            Number of the caller's attendance incidents anchored on this business-local date
            (the business time zone) that are still OPEN with no justification. Unjustified
            means OPEN and justification null, the same definition as the worker inbox
            (`getWorkerAttendanceIncidents` / Main `getCurrentUserAttendanceIncidents`):
            an incident that is OPEN but already justified, and a resolved incident, are not
            counted. The anchor date is the inbox anchor (business-local shift start for
            SHIFT scope or a MATCHED match, otherwise the business-local clock-in date), so
            a night shift's incidents stay on the shift's start date. `null` when the
            business does not have the ATTENDANCE feature. `0` when the feature is available
            and this date has no such incident (the date is absent from Main
            `getCurrentUserAttendanceIncidentDailyCounts`).
          example: 1
      required:
        - date
        - totalSeconds
        - plannedSeconds
        - unjustifiedIncidentCount

    WorkerHoursMonthsResponseDTO:
      type: object
      description: >
        One page of the worker's own monthly totals for «Mis horas», newest month first. Always the caller's data.
      properties:
        zone:
          type: string
          description: IANA time zone of the business. Months, days and today are calendar values in this zone.
          example: Europe/Madrid
        today:
          type: string
          format: date
          description: Today in the business time zone, from the server clock
          example: "2026-11-11"
        months:
          type: array
          description: >
            Consecutive calendar months, newest first, with no gaps (a month without worklogs has hasWorklogs false).
            Without `before`, the first item is always the current month, even when empty. At most the 12 most recent
            months (the current month and the 11 before it), and never before the worker's first month in the business
            (earliest of the membership join date and the first worklog). Empty when `before` is on or before the
            oldest month of that range.
          items:
            $ref: '#/components/schemas/WorkerHoursMonthDTO'
        nextBefore:
          type:
            - string
            - 'null'
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Send it as `before` for the next (older) page. Null when no older month remains inside the 12-month window and on or after the first month.
          example: "2026-09"
      required: [zone, today, months, nextBefore]

    WorkerHoursMonthDTO:
      type: object
      description: >
        Totals of one calendar month for the worker. Worklogs are attributed to the business-local date of their
        clock-in and seconds are net of effective closed breaks, the same rule as the worked-hours PDF. REJECTED
        and open worklogs are in neither figure. Independent of the worker history `totalSeconds` rule.
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Calendar month (YYYY-MM)
          example: "2026-10"
        inProgress:
          type: boolean
          description: True for the current month in the business time zone
          example: false
        confirmedSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Closed worklogs in CONFIRMED or APPROVED. Equals the «Total» of the month in the PDF of
            getWorkerWorkedHoursReportPdf; the Main API computes both with the same queries and domain rule.
          example: 561600
        pendingSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >
            Closed worklogs in PENDING_REVIEW or PENDING_RECONCILIATION. Not included in confirmedSeconds; the app
            shows it apart («+X h pendientes de revisar»). Always present: 0 means nothing pending. If it cannot be
            read the whole request fails.
          example: 15300
        pendingCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of the closed worklogs counted in pendingSeconds
          example: 2
        hasWorklogs:
          type: boolean
          description: True when the worker has at least one worklog with its clock-in in this month, in any review status, open ones included
          example: true
        report:
          $ref: '#/components/schemas/WorkerHoursMonthReportDTO'
      required: [month, inProgress, confirmedSeconds, pendingSeconds, pendingCount, hasWorklogs, report]

    WorkerHoursMonthReportDTO:
      type: object
      description: Whether the app offers the monthly PDF (getWorkerWorkedHoursReportPdf) for this month
      properties:
        available:
          type: boolean
          description: Equals hasWorklogs. The endpoint also answers for a month without worklogs; this flag only says whether the app offers it.
          example: true
        provisional:
          type: boolean
          description: Equals inProgress. The PDF covers the month only up to today.
          example: false
        effectiveTo:
          type: string
          format: date
          description: Last day the PDF covers, the last day of the month, or today for the current month
          example: "2026-10-31"
      required: [available, provisional, effectiveTo]

    WorkerTeamScheduleResponseDTO:
      type: object
      description: >-
        Privacy-safe schedule for all seven dates of an ISO week, visible to any member of the
        business. Days without shifts are included with an empty shifts array.
      properties:
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        week:
          type: string
          pattern: '^\d{4}-W\d{2}$'
          description: ISO week identifier
          example: "2025-W31"
        weekStart:
          type: string
          format: date
          description: Monday of the requested ISO week in the business-local calendar
          example: "2025-07-28"
        weekEnd:
          type: string
          format: date
          description: Sunday of the requested ISO week in the business-local calendar
          example: "2025-08-03"
        days:
          type: array
          description: >-
            All seven dates of the ISO week, Monday to Sunday, ordered by business-local date.
            Days without assigned shifts are included with an empty shifts array.
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/WorkerTeamScheduleDayDTO'
      required:
        - businessId
        - week
        - weekStart
        - weekEnd
        - days

    WorkerTeamScheduleDayDTO:
      type: object
      description: Assigned shifts grouped by their business-local start date. closed describes the business day, not the person's lack of shifts.
      properties:
        date:
          type: string
          format: date
          example: "2025-07-28"
        closed:
          type: boolean
          description: >-
            Whether the business-local date is closed: its effective daily configuration has no
            opening intervals (date exception, otherwise the recurring schedule effective on the
            date, otherwise no configuration). A person's lack of shifts does not make an open
            date closed.
          example: false
        shifts:
          type: array
          description: Shifts ordered by start instant and then stable shift ID
          items:
            $ref: '#/components/schemas/WorkerTeamScheduleShiftDTO'
      required:
        - date
        - closed
        - shifts

    WorkerTeamScheduleShiftDTO:
      type: object
      description: >
        Privacy-safe presentation of one assigned shift. `startAt` and `endAt`
        are the envelope (first segment start, last segment end). Optional
        `segments` are the planned intervals of a split shift, not clocked
        worklogs. `durationSeconds` and `netSeconds` are the server-computed
        net (sum of segment durations minus `breakMinutes`).
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 900
        worker:
          $ref: '#/components/schemas/WorkerTeamScheduleWorkerDTO'
        jobRole:
          $ref: '#/components/schemas/WorkerTeamScheduleJobRoleDTO'
        shiftId:
          type: integer
          format: int64
          minimum: 1
          description: Business Shift identity captured in the immutable planning snapshot
          example: 20
        shiftName:
          type: string
          minLength: 1
          example: Morning service
        shiftColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#1A2B3C"
        startAt:
          type: string
          format: date-time
          description: Offset-aware start instant
          example: "2025-07-28T09:00:00+02:00"
        endAt:
          type: string
          format: date-time
          description: Offset-aware end instant; may be on the following local date
          example: "2025-07-28T17:00:00+02:00"
        breakMinutes:
          type: integer
          format: int32
          minimum: 0
          description: >
            Planned break of the shift, in minutes. It does not include the unpaid
            gap between segments.
          example: 30
        segments:
          type: array
          minItems: 1
          maxItems: 2
          description: >
            Planned segments. Omitted for a normal shift. Not clocked worklogs.
            See `ScheduledShiftSegmentDTO`.
          items:
            $ref: '../common/components.yml#/components/schemas/ScheduledShiftSegmentDTO'
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: >
            Net planned seconds: sum of the planned segment durations minus
            `breakMinutes`, never negative. When `segments` is omitted the
            envelope is the only segment (overnight counts 24 hours). The unpaid
            gap is not included and is not a break. Same value as `netSeconds`.
          example: 30600
        netSeconds:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Same value as `durationSeconds`. Server-computed.
          example: 30600
      required:
        - id
        - worker
        - jobRole
        - shiftId
        - shiftName
        - shiftColor
        - startAt
        - endAt
        - breakMinutes

    WorkerTeamScheduleWorkerDTO:
      type: object
      description: Assigned worker's minimal display identity
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 3
        name:
          type: string
          example: Bob Wilson
      required:
        - id
        - name

    WorkerTeamScheduleJobRoleDTO:
      type: object
      description: Job-role identity and presentation metadata for an assigned shift
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 10
        code:
          type: string
          example: WAITER
        name:
          type: string
          example: Waiter
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#1A2B3C"
        icon:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: front-of-house
      required:
        - id
        - code
        - name
        - color
        - icon
