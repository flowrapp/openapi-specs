components:
  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      description: ID of the business
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 101
    GenerationId:
      name: generationId
      in: path
      required: true
      description: Planning generation job id, as returned by requestPlanGeneration
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 42
  schemas:
    PlanningGenerationRequestDTO:
      type: object
      additionalProperties: false
      description: Explicit period of whole business-local ISO weeks, at most 4 weeks (Main API `PlanningGenerationRequestDTO`).
      properties:
        from:
          type: string
          format: date
          description: Monday of the first week; not before today in the business time zone
          example: "2026-11-09"
        to:
          type: string
          format: date
          description: Sunday of the last week
          example: "2026-11-22"
      required: [from, to]

    PlanningGenerationStatusDTO:
      type: string
      description: >
        Main API `PlanningGenerationStatusDTO`: PENDING, RUNNING, COMPLETED (every week DRAFT) or
        FAILED (every week finished and at least one FAILED, or the job expired). Open set:
        clients must tolerate unknown values.
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
      example: RUNNING

    PlanningGenerationWeekStatusDTO:
      type: string
      description: Main API `PlanningStatusDTO` of the week's planning. Open set.
      enum: [CREATED, SOLVING, DRAFT, PUBLISHED, ARCHIVED, FAILED]
      example: SOLVING

    PlanningGenerationWeekDTO:
      type: object
      properties:
        weekStart:
          type: string
          format: date
          example: "2026-11-09"
        weekEnd:
          type: string
          format: date
          example: "2026-11-15"
        planningId:
          type: integer
          format: int64
          minimum: 1
          description: Planning of the week; open it with the existing manager schedule endpoints
          example: 501
        planningStatus:
          $ref: "#/components/schemas/PlanningGenerationWeekStatusDTO"
        failureReason:
          type: [string, "null"]
          maxLength: 500
          example: null
      required: [weekStart, weekEnd, planningId, planningStatus, failureReason]

    PlanningGenerationDTO:
      type: object
      description: Automatic generation job (Main API `PlanningGenerationDTO`), forwarded unchanged.
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 42
        businessId:
          type: integer
          format: int64
          minimum: 1
          example: 101
        from:
          type: string
          format: date
          example: "2026-11-09"
        to:
          type: string
          format: date
          example: "2026-11-22"
        status:
          $ref: "#/components/schemas/PlanningGenerationStatusDTO"
        requestedBy:
          type: integer
          format: int64
          minimum: 1
          example: 1
        requestedAt:
          type: string
          format: date-time
          example: "2026-11-02T18:45:00+01:00"
        finishedAt:
          type: [string, "null"]
          format: date-time
          example: null
        failureReason:
          type: [string, "null"]
          maxLength: 500
          example: null
        weeks:
          type: array
          maxItems: 4
          description: One entry per week, ordered by weekStart
          items:
            $ref: "#/components/schemas/PlanningGenerationWeekDTO"
      required: [id, businessId, from, to, status, requestedBy, requestedAt, finishedAt, failureReason, weeks]
